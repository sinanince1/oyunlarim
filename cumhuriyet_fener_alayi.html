<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cumhuriyet Fener Alayı</title>
<style>
/* =========================================================
   1. TEMEL DEĞİŞKENLER VE GENEL STİL
   ========================================================= */
:root{
  --gece1:#0a1433; --gece2:#1b2d66; --gece3:#2a3f86;
  --kirmizi:#E30A17; --kirmizi-koyu:#a90611;
  --sari:#FFD24D; --sari-koyu:#c99a12;
  --kart:#FFF8EC; --kart-metin:#1b2340;
  --golge:0 10px 30px rgba(0,0,0,.35);
  --font:"Nunito","Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--gece1);color:#fff;font-family:var(--font);
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;cursor:pointer;border:0;touch-action:manipulation}
.gizli{display:none!important}

/* =========================================================
   2. SAHNE YÖNETİCİSİ STİLLERİ
   ========================================================= */
.sahne{position:fixed;inset:0;display:none;flex-direction:column;opacity:0;transition:opacity .35s ease;
  background:radial-gradient(ellipse at 50% 120%,var(--gece3) 0%,var(--gece2) 35%,var(--gece1) 80%)}
.sahne.aktif{display:flex}
.sahne.gorunur{opacity:1}
.gok{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.yz{animation:pirilti 3s ease-in-out infinite}
@keyframes pirilti{0%,100%{opacity:.25}50%{opacity:1}}

/* =========================================================
   3. DÜĞMELER
   ========================================================= */
.btn{min-height:64px;padding:.45em 1.4em;border-radius:999px;font-weight:900;font-size:clamp(20px,2.2vw,32px);
  background:var(--sari);color:#3a2500;box-shadow:0 6px 0 var(--sari-koyu),var(--golge);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sari-koyu)}
.btn.kirmizi{background:var(--kirmizi);color:#fff;box-shadow:0 6px 0 var(--kirmizi-koyu),var(--golge)}
.btn.cizgi{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 3px rgba(255,255,255,.5)}
.btn.cizgi-koyu{background:#e6e8f3;color:var(--kart-metin);box-shadow:0 6px 0 #c3c8e2}
.ikon-btn{width:64px;height:64px;flex:0 0 64px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:30px;
  display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.ikon-btn:active{transform:scale(.94)}

/* =========================================================
   4. GİRİŞ EKRANI
   ========================================================= */
#giris .icerik{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(10px,2.2vh,26px);padding:24px 16px 8px;text-align:center;overflow:auto}
/* Taşarsa üstü kesilmesin: ortalama otomatik kenar boşluğuyla */
#giris .icerik{justify-content:flex-start;padding-top:clamp(36px,8vh,80px);padding-bottom:clamp(40px,13vh,130px)}
#giris .bayrak-dalga{width:min(24vw,240px);min-width:140px}
#giris .icerik > :first-child{margin-top:auto}
#giris .icerik > :last-child{margin-bottom:auto}
@media (max-height:520px){
  #giris .bayrak-dalga{width:min(16vw,150px);min-width:90px}
  #giris h1{font-size:clamp(28px,9vh,52px)}
  .giris-sehir{display:none}
}
.sag-ust{position:absolute;top:max(12px,env(safe-area-inset-top));right:12px;z-index:3}
.bayrak-dalga{width:min(30vw,280px);min-width:150px;height:auto;transform-origin:left center;animation:dalga 3.2s ease-in-out infinite;
  filter:drop-shadow(0 8px 18px rgba(0,0,0,.45));border-radius:4px}
@keyframes dalga{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(-3deg) scaleX(.97)}}
#giris h1{margin:0;font-size:clamp(36px,6vw,84px);font-weight:900;line-height:1.05;text-shadow:0 0 24px rgba(255,210,77,.45)}
.alt-baslik{font-size:clamp(18px,2.4vw,32px);color:var(--sari);font-weight:800}
.seviye-sec{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.seviye-kart{min-width:210px;padding:14px 22px;border-radius:24px;background:rgba(255,255,255,.1);color:#fff;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.25);font-size:clamp(22px,2.3vw,32px);font-weight:900;
  display:flex;flex-direction:column;align-items:center;gap:2px}
.seviye-kart small{font-weight:700;opacity:.85;font-size:.68em}
.seviye-kart .rekor{font-size:.58em;color:var(--sari);font-weight:800;margin-top:4px}
.seviye-kart.secili{background:rgba(255,210,77,.2);box-shadow:inset 0 0 0 5px var(--sari)}
.rozet-satir{font-weight:900;color:var(--sari);font-size:clamp(16px,1.8vw,24px)}
.altbilgi{text-align:center;font-size:14px;opacity:.65;padding:6px 0 max(6px,env(safe-area-inset-bottom))}

/* =========================================================
   5. HARİTA (ALAY YOLU)
   ========================================================= */
#harita-kap{position:absolute;inset:0;overflow:hidden;background:linear-gradient(#070f2b,#22357a 62%,#101a42 62%)}
#harita-kap.dikey{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:#070f2b}
#harita-svg{display:block;width:100%;height:100%}
.ust-cubuk{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:10px;
  padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));
  background:linear-gradient(rgba(7,15,43,.92),rgba(7,15,43,0))}
.ust-cubuk .baslik{flex:1;min-width:0;font-weight:900;font-size:clamp(18px,2.2vw,30px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{background:rgba(255,255,255,.14);border-radius:999px;padding:8px 16px;font-weight:900;font-size:clamp(16px,2vw,28px);white-space:nowrap}
@media (max-width:620px){.ust-cubuk .baslik{display:none}.ust-cubuk .bosluk{flex:1}}
@media (min-width:621px){.ust-cubuk .bosluk{display:none}}
.alt-panel{position:absolute;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:3;pointer-events:none;padding:0 12px}
.alt-panel .btn{pointer-events:auto;max-width:100%}

/* Harita içi SVG öğeleri */
.durak-fener{cursor:pointer}
.durak-fener .parilti{opacity:0;transition:opacity 1.1s}
.durak-fener.parlak .parilti{opacity:1}
.durak-fener.soluk .parilti{opacity:.38}
.fener-govde{fill:#3b4777;transition:fill .8s}
.parlak .fener-govde,.soluk .fener-govde{fill:var(--kirmizi)}
.soluk .fener-govde{fill:#a8323a}
.fener-ic{fill:#55608f;transition:fill .8s}
.parlak .fener-ic{fill:#ffe27a}
.soluk .fener-ic{fill:#d9a24a}
.sallanan{transform-box:view-box;animation:salla 4s ease-in-out infinite}
@keyframes salla{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-4deg)}}
.halka{opacity:0}
.siradaki .halka{opacity:1;transform-box:fill-box;transform-origin:center;animation:nabiz 1.4s ease-out infinite}
@keyframes nabiz{0%{transform:scale(.8);opacity:.95}100%{transform:scale(1.6);opacity:0}}
.etiket-rozet{fill:#fff;stroke:#0b1438;stroke-width:3}
.gecildi .etiket-rozet{fill:var(--sari)}
.etiket-no{font-size:22px;font-weight:900;text-anchor:middle;fill:#1b2340}
.etiket-ad{font-size:23px;font-weight:900;text-anchor:middle;fill:#fff;paint-order:stroke;stroke:#0a1433;stroke-width:6px;stroke-linejoin:round}
.siradaki .etiket-ad{fill:var(--sari)}
.mini-dalga{transform-box:fill-box;transform-origin:left center;animation:dalga 3s ease-in-out infinite}
.zaman-kapisi .kapi-isik{opacity:0;transition:opacity 1s}
.zaman-kapisi.parlak .kapi-isik{opacity:1}
/* Kişiler (yürüyen çocuk ve alaya katılanlar) */
.bacak-sol,.bacak-sag{transform-box:fill-box;transform-origin:50% 0}
.yuruyor .bacak-sol{animation:adim .36s ease-in-out infinite alternate}
.yuruyor .bacak-sag{animation:adim .36s ease-in-out infinite alternate-reverse}
@keyframes adim{from{transform:rotate(20deg)}to{transform:rotate(-20deg)}}
.yeni{transform-box:fill-box;transform-origin:50% 100%;animation:pop .7s ease-out both}
@keyframes pop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}

/* =========================================================
   6. KART (DURAK, ZAMAN ŞERİDİ)
   ========================================================= */
.kap{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vw,40px);min-height:0}
.kart{background:var(--kart);color:var(--kart-metin);border-radius:28px;box-shadow:var(--golge);width:min(1100px,100%);max-height:100%;overflow:auto;
  padding:clamp(18px,3vw,40px);display:flex;flex-direction:column;gap:clamp(12px,2.2vh,26px);border-top:12px solid var(--kirmizi)}
.kart > *{flex-shrink:0}
.kart-ust{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.durak-no{background:var(--kirmizi);color:#fff;border-radius:999px;padding:6px 16px;font-weight:900;font-size:clamp(16px,1.8vw,24px)}
.kart h2{margin:0;font-size:clamp(28px,3.6vw,52px);font-weight:900;line-height:1.1}
.kart-govde{display:grid;grid-template-columns:minmax(120px,28%) 1fr;gap:clamp(14px,3vw,36px);align-items:center}
.resim{aspect-ratio:1/1;border-radius:24px;background:linear-gradient(#1b2d66,#0a1433);display:grid;place-items:center;
  font-size:clamp(60px,9vw,130px);line-height:1}
.resim svg{width:78%;height:auto;border-radius:4px}
.metin p{margin:0 0 .55em;font-size:clamp(22px,2.6vw,38px);line-height:1.4;font-weight:700}
.metin p:last-child{margin-bottom:0}
.metin p.ek{border-left:7px solid var(--kirmizi);padding-left:.5em}
.kart-alt{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}
.soru h3{margin:0 0 .3em;font-size:clamp(24px,3vw,44px);line-height:1.25}
.test-not{margin:0 0 1em;font-size:clamp(16px,1.6vw,22px);color:#6a6f8c;font-weight:700}
.siklar{display:grid;gap:14px}
.sik{min-height:72px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 3px #d8dcef,0 5px 0 #c3c8e2;
  font-size:clamp(20px,2.4vw,34px);font-weight:800;color:var(--kart-metin);padding:12px 22px;text-align:left}
.sik:active{transform:translateY(3px)}
@media (orientation:portrait){
  .kart-govde{grid-template-columns:1fr}
  .resim{width:55%;max-width:240px;margin:0 auto}
  .kart-alt{justify-content:center}
}

/* =========================================================
   7. FİNAL EKRANI
   ========================================================= */
.final-icerik{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;overflow-x:hidden;overflow-y:auto}
.final-ic{margin:auto;width:min(1300px,100%);display:grid;grid-template-columns:1fr 1.25fr;gap:clamp(16px,3vw,40px);align-items:center;padding:clamp(8px,2vh,24px) 16px}
.final-sol{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,20px);text-align:center}
@media (orientation:portrait),(max-width:820px){.final-ic{grid-template-columns:1fr}}
.final-baslik{margin:0;font-size:clamp(34px,5vw,72px);font-weight:900;line-height:1.1;text-shadow:0 0 24px rgba(255,210,77,.45)}
.final-yas{font-size:clamp(24px,3.4vw,50px);color:var(--sari);font-weight:900;line-height:1.15}
.final-istat{font-size:clamp(20px,2.4vw,32px);font-weight:800}
.rozet-kutu{background:rgba(255,210,77,.18);border:3px solid var(--sari);border-radius:20px;padding:8px 18px;font-weight:900;font-size:clamp(18px,2.2vw,28px)}
/* Fener alayı geçidi */
.gecit{display:block;width:100%;height:clamp(130px,26vh,260px);flex:0 0 auto}
.alay{animation:gecit 24s linear infinite;animation-delay:-9s}
@keyframes gecit{from{transform:translateX(-120px)}to{transform:translateX(2350px)}}
.zipla{animation:zipla .36s ease-in-out infinite alternate}
@keyframes zipla{from{transform:translateY(0)}to{transform:translateY(-5px)}}
/* Havai fişek tuvali */
/* Cumhuriyet Kartım */
.ckart{background:var(--kart);color:var(--kart-metin);border-radius:26px;border-top:10px solid var(--kirmizi);box-shadow:var(--golge);padding:clamp(14px,2.2vw,28px);display:flex;flex-direction:column;gap:10px}
.ckart-ust{display:flex;align-items:center;gap:12px}
.ckart-bayrak{width:clamp(44px,5vw,64px);height:auto;border-radius:3px;flex:0 0 auto}
.ckart h2{margin:0;font-size:clamp(24px,2.8vw,40px);line-height:1.1}
.ckart-liste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ckart-liste li{display:flex;align-items:center;gap:12px;padding:7px 2px;border-bottom:2px dashed #ece4d4}
.ckart-liste li:last-child{border-bottom:0}
.ckart-liste svg{width:clamp(34px,3.4vw,46px);height:auto;flex:0 0 auto}
.ckart-liste b{display:block;font-size:clamp(14px,1.4vw,19px);color:var(--kirmizi)}
.ckart-liste span{display:block;font-size:clamp(17px,1.75vw,25px);font-weight:800;line-height:1.3}
.ckart-alt{text-align:center;font-weight:900;font-size:clamp(20px,2.2vw,30px);color:var(--kirmizi)}
.ckart-not{text-align:center;font-size:clamp(13px,1.3vw,17px);color:#6a6f8c;font-weight:700}
.btn-dizi{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

/* =========================================================
   8. MODAL (AYARLAR, ONAY)
   ========================================================= */
.modal-arka{position:fixed;inset:0;background:rgba(5,10,30,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-arka.acik{display:flex}
.modal{background:var(--kart);color:var(--kart-metin);border-radius:28px;padding:clamp(18px,3vw,36px);width:min(580px,100%);max-height:100%;overflow:auto;
  display:flex;flex-direction:column;gap:18px;box-shadow:var(--golge);border-top:10px solid var(--kirmizi)}
.modal h2{margin:0;font-size:clamp(26px,3vw,40px)}
.modal p{margin:0;font-size:clamp(18px,2vw,26px);font-weight:700;line-height:1.4}
.ayar-satir{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:clamp(20px,2.2vw,28px);font-weight:900}
.secim{display:flex;border-radius:999px;background:#e6e8f3;padding:4px}
.secim button{min-height:54px;padding:0 18px;border-radius:999px;background:transparent;font-size:clamp(17px,1.9vw,24px);font-weight:900;color:var(--kart-metin)}
.secim button.secili{background:var(--kirmizi);color:#fff}
.not{font-size:clamp(15px,1.6vw,20px)!important;color:#5a6080}
.modal .altbilgi-ic{font-size:14px;color:#8a8fa8;text-align:center}

/* =========================================================
   9. SORU DURUMLARI VE GERİ BİLDİRİM
   ========================================================= */
.soru-sayac{font-size:clamp(15px,1.6vw,20px);font-weight:900;color:#6a6f8c;margin-bottom:4px}
.dy-etiket{display:inline-block;background:#e6e8f3;border-radius:999px;padding:4px 14px;font-size:clamp(15px,1.6vw,20px);font-weight:900;color:#4a5070;margin-bottom:8px}
.siklar{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.sik{display:flex;align-items:center;gap:14px;line-height:1.25}
.sik .s-ikon{font-size:1.35em;line-height:1;flex:0 0 auto}
.sik .s-ikon svg,.ikon-bayrak{width:1.5em;height:auto;border-radius:3px;display:block}
.sik .durum{margin-left:auto;font-size:1.2em;font-weight:900;flex:0 0 auto}
.sik:disabled{cursor:default}
.sik.dogru{background:#dff7ea;box-shadow:inset 0 0 0 5px #1fae6a,0 5px 0 #17905a}
.sik.dogru .durum{color:#17905a}
.sik.yanlis{background:#fde3e3;box-shadow:inset 0 0 0 5px #e04848,0 5px 0 #c03030}
.sik.yanlis .durum{color:#c03030}
.sik.pasif{opacity:.5}
.titre{animation:titre .45s}
@keyframes titre{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.soru.dy .siklar{grid-template-columns:1fr 1fr}
.soru.dy .sik{justify-content:center;font-size:clamp(24px,3vw,42px)}
.soru.dy .sik .durum{margin-left:8px}
.ipucu{background:#fff3c4;border-radius:20px;padding:14px 18px;font-size:clamp(19px,2.2vw,30px);font-weight:800;border-left:8px solid var(--sari);line-height:1.35}
.hatirlat{background:#fff;border-radius:20px;padding:14px 18px;box-shadow:inset 0 0 0 3px #e3e6f3}
.hatirlat .h-baslik{font-size:clamp(15px,1.6vw,20px);font-weight:900;color:#6a6f8c;margin-bottom:6px}
.hatirlat p{margin:0 0 .3em;font-size:clamp(18px,2vw,28px);font-weight:700;line-height:1.35}
.hatirlat p:last-child{margin-bottom:0}
.hatirlat mark{background:#ffe066;padding:0 .2em;border-radius:6px;color:inherit}
.aciklama{background:#e3f6ec;border-radius:20px;padding:14px 18px;font-size:clamp(19px,2.2vw,30px);font-weight:800;border-left:8px solid #1fae6a;line-height:1.35}
.tebrik{font-size:clamp(26px,3.2vw,46px);font-weight:900;color:#17905a;text-align:center}

/* =========================================================
   10. ZAMAN ŞERİDİ
   ========================================================= */
.zaman-yonerge{margin:0;font-size:clamp(20px,2.4vw,34px);font-weight:800;line-height:1.3}
.ok-satir{display:flex;justify-content:space-between;font-weight:900;color:#6a6f8c;font-size:clamp(15px,1.6vw,22px);margin-bottom:-4px}
.zaman-cizgi{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:clamp(10px,1.4vw,18px);padding-top:14px}
.yuva{min-height:clamp(120px,16vh,170px);border-radius:20px;border:4px dashed #c3c8e2;display:flex;align-items:stretch;justify-content:center;position:relative;padding:8px;background:#fff9f0}
.yuva.dolu{border-style:solid;border-color:transparent;padding:0;background:transparent}
.yuva-no{position:absolute;top:-17px;left:50%;transform:translateX(-50%);background:var(--kirmizi);color:#fff;border-radius:999px;min-width:34px;height:34px;display:grid;place-items:center;font-weight:900;font-size:18px;z-index:1;padding:0 8px}
.havuz{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;min-height:clamp(90px,12vh,140px);align-items:center;background:#f1f2f8;border-radius:22px;padding:14px}
.havuz-bos{font-weight:800;color:#8a8fa8;font-size:clamp(16px,1.8vw,24px)}
.zkart{background:#fff;border-radius:18px;box-shadow:inset 0 0 0 3px #d8dcef,0 5px 0 #c3c8e2;padding:10px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font-size:clamp(17px,1.9vw,27px);font-weight:900;color:var(--kart-metin);text-align:center;line-height:1.2;min-width:clamp(150px,17vw,230px);max-width:280px}
.yuva .zkart{width:100%;max-width:none;min-width:0}
.zkart .z-ikon{font-size:1.6em;line-height:1}
.zkart .z-ikon svg{width:2.1em;height:auto;border-radius:3px;display:block}
.zkart .z-tarih{font-size:.82em;color:var(--kirmizi)}
.zkart.yanlis{background:#fde3e3;box-shadow:inset 0 0 0 5px #e04848}
.zkart.dogru{background:#dff7ea;box-shadow:inset 0 0 0 5px #1fae6a}
.zkart:disabled{cursor:default;color:var(--kart-metin)}
@media (orientation:portrait){
  .ok-satir{display:none}
  .zaman-cizgi{grid-template-columns:1fr;padding-top:0;gap:12px}
  .yuva{min-height:78px;padding-left:30px}
  .yuva.dolu{padding-left:0}
  .yuva-no{left:-8px;top:50%;transform:translateY(-50%)}
  .yuva .zkart{flex-direction:row;justify-content:flex-start;padding-left:34px;text-align:left}
  .havuz .zkart{min-width:0;width:100%;max-width:none;flex-direction:row;justify-content:flex-start;text-align:left}
}

/* =========================================================
   11. GÖRSEL CİLA VE ANİMASYONLAR
   ========================================================= */
/* Sahne geçişi: hafif yakınlaşma ile belirme */

/* =========================================================
   4. SES (Web Audio API — dosya yok)
   ========================================================= */
const Ses = {
  ctx:null,
  hazirla(){
    if(!this.ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; this.ctx=new AC(); }
    if(this.ctx.state==="suspended") this.ctx.resume();
  },
  ton(f,sure,tip,vol,gecikme,bitisF){
    if(!K.ses) return; this.hazirla(); const c=this.ctx; if(!c) return;
    const t=c.currentTime+(gecikme||0), o=c.createOscillator(), g=c.createGain();
    o.type=tip||"sine"; o.frequency.setValueAtTime(f,t);
    if(bitisF) o.frequency.exponentialRampToValueAtTime(bitisF,t+sure);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||.18,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t+sure);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+sure+0.05);
  },
  gurultu(sure,vol,gecikme,filtre,frek){
    if(!K.ses) return; this.hazirla(); const c=this.ctx; if(!c) return;
    const t=c.currentTime+(gecikme||0), n=Math.floor(c.sampleRate*sure), buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const src=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
    f.type=filtre||"bandpass"; f.frequency.value=frek||2200; g.gain.value=vol||.1;
    src.buffer=buf; src.connect(f); f.connect(g); g.connect(c.destination); src.start(t);
  },
  tik(){ this.ton(720,.07,"triangle",.13); },
  adim(){ this.ton(150,.06,"sine",.09); },
  can(){ this.ton(988,.5,"sine",.13); this.ton(1480,.6,"sine",.07,.02); },
  fenerYak(){ this.gurultu(.25,.09); this.ton(784,.3,"triangle",.13,.18); this.ton(1175,.5,"sine",.11,.3); },
  // Oyuna özgü kısa fanfar (telifli ezgi kullanılmaz)
  final(){
    [[392,0,.16],[523,.16,.16],[659,.32,.16],[784,.48,.32],[659,.86,.16],[784,1.02,.16],[1047,1.18,.9]]
      .forEach(n=>{ this.ton(n[0],n[2]+.08,"triangle",.14,n[1]); this.ton(n[0]*2,n[2],"sine",.035,n[1]); });
    [0,.48,1.18].forEach(g=>this.gurultu(.12,.09,g,"lowpass",420));
  },
  firlat(){ this.ton(320,.35,"sine",.035,0,900); },
  patlama(){ this.gurultu(.55,.11,0,"lowpass",900); this.ton(110,.3,"sine",.06,0,60); },
  dogru(){ [659,831,988].forEach((f,i)=>this.ton(f,.24,"triangle",.14,i*.09)); },
  yanlis(){ this.ton(260,.3,"sine",.14,0,180); }
};

// Yıldız noktaları (beş köşe; aci0 = ilk köşenin yönü)
function yildizNoktalari(cx,cy,R,r,aci0){
  const p=[]; for(let i=0;i<10;i++){ const u=i%2?r:R, a=aci0+i*Math.PI/5; p.push((cx+u*Math.cos(a)).toFixed(2)+","+(cy+u*Math.sin(a)).toFixed(2)); }
  return p.join(" ");
}
// Türk bayrağı — Türk Bayrağı Kanunu oranları (G=800): dış ay Ø0,5G, iç ay Ø0,4G, ay merkezleri arası G/16,
// yıldız dairesi Ø0,25G ve iç ay dairesinden G/3 uzakta. Yıldızın bir köşesi göndere bakar; merkezi 683,3'tedir.
function bayrakIc(){
  return `<rect width="1200" height="800" fill="#E30A17"/><circle cx="425" cy="400" r="200" fill="#fff"/><circle cx="475" cy="400" r="160" fill="#E30A17"/><polygon fill="#fff" points="${yildizNoktalari(683.334,400,100,38.197,Math.PI)}"/>`;
}
function bayrakSVG(sinif){ return `<svg class="${sinif||""}" viewBox="0 0 1200 800" role="img" aria-label="Türk bayrağı">${bayrakIc()}</svg>`; }
// Gönderli küçük bayrak (harita içinde). x,y: gönder tepesi; w: bayrak genişliği
function miniBayrak(x,y,w){
  const h=w*2/3;
  return `<line x1="${x}" y1="${y-4}" x2="${x}" y2="${y+h*2.2}" stroke="#c9cde6" stroke-width="3"/>
    <g transform="translate(${x+1.5},${y})"><g class="mini-dalga"><g transform="scale(${w/1200})">${bayrakIc()}</g></g></g>`;
}
function yildizlar(r,W,Hmax,n){
  let s=""; for(let i=0;i<n;i++) s+=`<circle class="yz" cx="${(r()*W).toFixed(0)}" cy="${(r()*Hmax).toFixed(0)}" r="${(0.8+r()*1.8).toFixed(1)}" fill="#fff" style="animation-delay:${(r()*3).toFixed(2)}s"/>`;
  return s;
}
// Kırmızı-beyaz flama dizisi (ikinci derece eğri boyunca)
function flama(x1,y1,x2,y2,cx,cy,aralik){
  let s=`<path d="M${x1},${y1} Q${cx},${cy} ${x2},${y2}" stroke="#c9cde6" stroke-width="2" fill="none"/>`;
  const n=Math.floor((x2-x1)/aralik);
  for(let k=1;k<n;k++){
    const t=k/n, x=(1-t)*(1-t)*x1+2*(1-t)*t*cx+t*t*x2, y=(1-t)*(1-t)*y1+2*(1-t)*t*cy+t*t*y2;
    s+=`<path d="M${(x-14).toFixed(1)},${y.toFixed(1)} L${(x+14).toFixed(1)},${y.toFixed(1)} L${x.toFixed(1)},${(y+30).toFixed(1)}Z" fill="${k%2?"#fff":"#E30A17"}"/>`;
  }
  return s;
}

  for(let k=0;k<18;k++){

    s.style.setProperty("--dx",(Math.cos(a)*d).toFixed(0)+"px");

    s.style.setProperty("--rt",(Math.random()*720-360).toFixed(0)+"deg");

// Noktalardan yumuşak yol (Catmull-Rom → Bézier). Her parça ayrıca saklanır (ölçüm için).
function yolYolu(P,parcalar){
  const f=n=>n.toFixed(1); let tam=`M${f(P[0].x)},${f(P[0].y)}`;
  for(let i=0;i<P.length-1;i++){
    const p0=P[Math.max(0,i-1)], p1=P[i], p2=P[i+1], p3=P[Math.min(P.length-1,i+2)];
    const c1={x:p1.x+(p2.x-p0.x)/6, y:p1.y+(p2.y-p0.y)/6}, c2={x:p2.x-(p3.x-p1.x)/6, y:p2.y-(p3.y-p1.y)/6};
    const parca=`C${f(c1.x)},${f(c1.y)} ${f(c2.x)},${f(c2.y)} ${f(p2.x)},${f(p2.y)}`;
    tam+=" "+parca; parcalar.push(`M${f(p1.x)},${f(p1.y)} ${parca}`);
  }
  return tam;
}

function zamanKapisi(p,i,dikey){
  const x=p.x, y=p.y; let seritler="";
  for(let k=0;k<6;k++){ const yy=y-170+k*28; seritler+=`<rect x="${x-74}" y="${yy}" width="22" height="14" fill="#E30A17"/><rect x="${x+52}" y="${yy}" width="22" height="14" fill="#E30A17"/>`; }
  return `<g class="durak-fener zaman-kapisi${S.durak>i?" gecildi parlak":""}" data-i="${i}">
    <ellipse class="halka" cx="${x}" cy="${y+4}" rx="56" ry="18" fill="none" stroke="#ffd24d" stroke-width="5"/>
    <circle class="kapi-isik" cx="${x}" cy="${y-120}" r="120" fill="url(#isikGrad)"/>
    <g class="ok-isaret"><path d="M${x-16},${y-322} h32 l-16,22z" fill="#FFD24D" stroke="#0b1438" stroke-width="3" stroke-linejoin="round"/></g>
    <rect x="${x-74}" y="${y-170}" width="22" height="170" fill="#fff"/><rect x="${x+52}" y="${y-170}" width="22" height="170" fill="#fff"/>
    ${seritler}
    <path d="M${x-63},${y-168} Q${x},${y-250} ${x+63},${y-168}" stroke="#fff" stroke-width="20" fill="none"/>
    <path d="M${x-63},${y-168} Q${x},${y-250} ${x+63},${y-168}" stroke="#E30A17" stroke-width="10" fill="none"/>
    ${miniBayrak(x,y-272,48)}
    <text x="${x}" y="${y-176}" font-size="40" text-anchor="middle">⏳</text>
    ${etiket(p,dikey,"7","Zaman Şeridi")}
  </g>`;
}
// Durak etiketi: yatayda altta, dikeyde dış yanda
function etiket(p,dikey,no,ad){
  const ax=dikey?(p.x<450?p.x-135:p.x+160):p.x, ay=dikey?p.y-40:p.y+48;
  const satir=ikiSatir(ad);
  return `<circle class="etiket-rozet" cx="${ax}" cy="${ay}" r="21"/><text class="etiket-no" x="${ax}" y="${ay+8}">${no}</text>
    ${satir.map((t,k)=>`<text class="etiket-ad" x="${ax}" y="${ay+46+k*26}">${t}</text>`).join("")}`;
}
function haritaCiz(){
  const kap=$("#harita-kap"), svg=$("#harita-svg");
  const dikey=kap.clientHeight>kap.clientWidth*1.05;
  kap.classList.toggle("dikey",dikey);
  const W=dikey?900:1600, Y=dikey?1720:900;
  const P=dikey?dikeyNoktalar():yatayNoktalar();
  const r=tohumluRastgele(dikey?7:3);
  const parcalar=[], tamYol=yolYolu(P,parcalar);
  let s=`<defs>
     <linearGradient id="gokGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070f2b"/><stop offset="1" stop-color="#22357a"/></linearGradient>
     <radialGradient id="isikGrad"><stop offset="0" stop-color="#ffe27a" stop-opacity=".85"/><stop offset=".45" stop-color="#ffb22e" stop-opacity=".32"/><stop offset="1" stop-color="#ffb22e" stop-opacity="0"/></radialGradient>
   </defs>
   <rect width="${W}" height="${Y}" fill="url(#gokGrad)"/>`;
  s+=yildizlar(r,W,dikey?Y:520,dikey?110:80);
  if(!dikey) s+=`<circle class="ay-isik" cx="${W-150}" cy="198" r="72" fill="#fff6d8" opacity=".07"/><circle cx="${W-150}" cy="198" r="36" fill="#fff6d8" opacity=".9"/>
      <circle cx="${W-162}" cy="189" r="6" fill="#e9dfc0" opacity=".7"/><circle cx="${W-140}" cy="211" r="4.5" fill="#e9dfc0" opacity=".6"/>`;
  s+=dikey?`<line class="kayan" x1="820" y1="260" x2="480" y2="470"/><line class="kayan" style="animation-delay:4.5s" x1="380" y1="900" x2="60" y2="1100"/>`
          :`<line class="kayan" x1="1150" y1="40" x2="780" y2="250"/><line class="kayan" style="animation-delay:5s" x1="560" y1="60" x2="220" y2="250"/>`;
  s+=dikey?flama(-20,105,920,105,450,190,50):flama(-20,95,1620,95,800,205,52);
  s+=dikey?dikeyBinalar(r,P):yatayBinalar(r);
  // Yol
  s+=`<path d="${tamYol}" fill="none" stroke="#0b1438" stroke-width="90" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="${tamYol}" fill="none" stroke="#2c3c78" stroke-width="74" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="${tamYol}" fill="none" stroke="#ffd24d" stroke-opacity=".45" stroke-width="5" stroke-dasharray="20 24" stroke-linecap="round"/>
      <g id="segmentler" visibility="hidden">${parcalar.map(d=>`<path d="${d}"/>`).join("")}</g>`;
  // Duraklar
  P.slice(1).forEach((p,i)=>{ s+= i<DURAK_SAYISI ? fenerDurak(p,i,dikey) : zamanKapisi(p,i,dikey); });
  // Kişiler
  s+=`<g id="kisiler"><g id="takipci-g"></g><g id="cocuk">${kisiSVG("#E30A17","#3b2412")}</g></g>`;

  svg.setAttribute("viewBox",`0 0 ${W} ${Y}`);
  svg.setAttribute("preserveAspectRatio","xMidYMid meet");
  svg.innerHTML=s;
  svg.style.height=dikey?(kap.clientWidth*Y/W)+"px":"100%";

  // Ölçüm
  H={ dikey, W, Y, segEls:$$("#segmentler path"), cum:[0], olcek:dikey?1.5:1.2, aralik:dikey?78:64 };
  H.segEls.forEach(el=>H.cum.push(H.cum[H.cum.length-1]+el.getTotalLength()));
  H.toplam=H.cum[H.cum.length-1];
  H.stopS=P.slice(1).map((_,i)=>H.cum[i+1]);
  S.s=S.konum<0?0:H.stopS[S.konum];

  // Önceden yanan fenerler
  S.fenerler.forEach((f,i)=>{ if(f){ const el=svg.querySelector(`.durak-fener[data-i="${i}"]`); if(el) el.classList.add(f); } });

  takipcileriCiz(false); konumla(); durakVurgula(); yuruButonu(); ustCubuk();
}

/* =========================================================
   9. HARİTA: KONUM, YÜRÜYÜŞ, ALAYA KATILANLAR
   ========================================================= */
function noktaAl(s){
  s=Math.max(0,Math.min(H.toplam,s));
  let k=0; while(k<H.segEls.length-1 && H.cum[k+1]<s) k++;
  const p=H.segEls[k].getPointAtLength(s-H.cum[k]); return {x:p.x,y:p.y};
}
function kisiYerlestir(el,s,ziplama,olcek){
  const p=noktaAl(s);
  let dx = s<H.toplam-4 ? noktaAl(s+4).x-p.x : p.x-noktaAl(s-4).x;
  let yon = Math.abs(dx)<0.4 ? (+el.dataset.yon||1) : (dx>0?1:-1);
  el.dataset.yon=yon;
  el.setAttribute("transform",`translate(${p.x.toFixed(1)},${(p.y+ziplama).toFixed(1)}) scale(${yon*olcek},${olcek})`);
}
function konumla(t){
  if(!H.segEls) return; t=t||performance.now();
  const ana=$("#cocuk"); if(!ana) return;
  kisiYerlestir(ana,S.s,S.yuruyor?-Math.abs(Math.sin(t/110))*6:0,H.olcek);
  $$("#takipci-g > g").forEach((el,i)=>{
    const s=Math.max(0,S.s-H.aralik*(i+1));
    kisiYerlestir(el,s,S.yuruyor?-Math.abs(Math.sin(t/110+i*.9))*5:0,H.olcek*.88);
  });
  if(H.dikey){ const kap=$("#harita-kap"), p=noktaAl(S.s), o=kap.clientWidth/H.W; kap.scrollTop=p.y*o-kap.clientHeight*.55; }
}
function takipcileriCiz(yeniEkle){
  const yanan=S.fenerler.filter(Boolean), n=yanan.length; let s="";
  for(let i=0;i<n;i++) s+=`<g><g class="${yeniEkle&&i===n-1?"yeni":""}">${kisiSVG(KIYAFET[i%KIYAFET.length],SAC[i%SAC.length],{soluk:yanan[i]==="soluk"})}</g></g>`;
  $("#takipci-g").innerHTML=s;
}
function durakVurgula(){
  $$("#harita-svg .durak-fener").forEach(g=>g.classList.remove("siradaki"));
  if(S.yuruyor || S.bekleyen || S.durak>=TOPLAM_DURAK) return;
  const g=$(`#harita-svg .durak-fener[data-i="${S.durak}"]`); if(g) g.classList.add("siradaki");
}
function yuruButonu(){
  const b=$("#yuru-btn");
  if(S.yuruyor || S.bekleyen || S.durak>=TOPLAM_DURAK){ b.classList.add("gizli"); return; }
  b.classList.remove("gizli");
  b.textContent="Yürü: "+(S.durak<DURAK_SAYISI?DURAKLAR[S.durak].ad:"Zaman Şeridi")+" ▶";
}
function ustCubuk(){
  $("#seviye-chip").textContent=SEVIYE_AD[S.seviye];
  $("#sayac").textContent="🏮 "+S.fenerler.filter(Boolean).length+"/"+DURAK_SAYISI;
}
function yuru(){
  if(S.yuruyor || S.bekleyen || S.durak>=TOPLAM_DURAK) return;
  const hedef=S.durak, s0=S.s, s1=H.stopS[hedef], sure=Math.max(900,(s1-s0)/0.27);
  S.yuruyor=true; durakVurgula(); yuruButonu(); $("#kisiler").classList.add("yuruyor");
  const t0=performance.now(); let sonAdim=0;
  function kare(t){
    if(!S.yuruyor) return;
    const k=Math.min(1,(t-t0)/sure), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    S.s=s0+(s1-s0)*e; konumla(t);
    if(t-sonAdim>360){ Ses.adim(); sonAdim=t; }
    if(k<1){ requestAnimationFrame(kare); return; }
    S.yuruyor=false; S.konum=hedef; S.s=s1;
    const ks=$("#kisiler"); if(ks) ks.classList.remove("yuruyor");
    konumla(); Ses.can();
    setTimeout(()=>duragaVar(hedef),450);
  }
  requestAnimationFrame(kare);
}
function duragaVar(i){
  if(aktifSahne.id!=="harita") return;
  if(i<DURAK_SAYISI) durakAc(i); else sahneGoster("zaman");
}
function haritaGiris(){
  haritaCiz();
  if(S.bekleyen) setTimeout(fenerYak,550);
}
// Durak sorusundan dönünce fener yanar, alaya bir kişi katılır
function fenerYak(){
  const b=S.bekleyen; if(!b || aktifSahne.id!=="harita") return;
  S.bekleyen=null; S.fenerler[b.i]=b.sonuc;
  const el=$(`#harita-svg .durak-fener[data-i="${b.i}"]`);
  if(el) el.classList.add(b.sonuc,"gecildi");
  if(FENER_XY[b.i]) isikPatlamasi(FENER_XY[b.i].x,FENER_XY[b.i].y);
  Ses.fenerYak();
  takipcileriCiz(true); konumla(); ustCubuk(); durakVurgula(); yuruButonu();
}

/* =========================================================
   10. DURAK (bilgi kartı → soru → iki aşamalı geri bildirim)
   ========================================================= */
function kartUst(i){
  return `<div class="kart-ust"><span class="durak-no">Durak ${i+1} / ${DURAK_SAYISI}</span><h2>${DURAKLAR[i].ad}</h2></div>`;
}
// Seviyeye göre karttaki cümleler (metin + büyüklerde ek)
function kartCumleleri(i){
  const d=DURAKLAR[i];
  return d.metin.map(t=>({t,ek:false})).concat(S.seviye==="buyuk"?d.ek.map(t=>({t,ek:true})):[]);
}
function durakAc(i){
  // Yeni durak: soruları seç (Küçükler 1, Büyükler 2 soru)
  if(S.soruDurak!==i){
    S.soruDurak=i; S.sorular=soruSec(i,S.seviye==="buyuk"?2:1);
    S.soruNo=0; S.temiz=true; soruSifirla();
  }
  const d=DURAKLAR[i], kart=$("#durak-kart");
  const paragraflar=kartCumleleri(i).map(c=>`<p${c.ek?' class="ek"':""}>${c.t}</p>`).join("");
  const basladi=S.soruNo>0 || S.yanlislar.length>0;
  kart.innerHTML=`${kartUst(i)}
    <div class="kart-govde"><div class="resim">${durakResim(i)}</div><div class="metin">${paragraflar}</div></div>
    <div class="kart-alt"><button class="btn" id="anladim-btn">${basladi?"Soruya dön ▶":"Anladım ▶"}</button></div>`;
  $("#anladim-btn").onclick=soruCiz;
  kart.scrollTop=0; kartAnim(kart,true); S.ilkCizim=true;
  sahneGoster("durak");
}
/* Soru seçme ve tekrar önleme
   K.sonGorulen: görülen soru kimlikleri, en eski başta. Hiç görülmeyenler önce,
   sonra en uzun süredir görülmeyenler seçilir; böylece havuz sırayla döner. */
function soruSec(i,n){
  const gecmis=K.sonGorulen||[];
  const havuz=karistir(SORULAR.filter(q=>q.d===i && q.s===S.seviye))
    .map(q=>({q,sira:gecmis.indexOf(q.id)}))
    .sort((a,b)=>a.sira-b.sira)          // -1 (görülmemiş) en başta
    .slice(0,n).map(x=>x.q);
  havuz.forEach(q=>{ const k=gecmis.indexOf(q.id); if(k>=0) gecmis.splice(k,1); gecmis.push(q.id); });
  K.sonGorulen=gecmis.slice(-72); kaydet();
  return havuz;
}
// İçerik giriş animasyonu yalnızca yeni ekranda; aynı sorudaki yeniden çizimlerde oynamaz
function kartAnim(kart,ac){ kart.classList.remove("anim"); if(ac){ void kart.offsetWidth; kart.classList.add("anim"); } }
function soruSifirla(){ S.ilkCizim=true; S.siklar=null; S.yanlislar=[]; S.cozum="yok"; S.sonYanlis=-1; S.zamanlayici&&clearTimeout(S.zamanlayici); }
function soruCiz(){
  const i=S.soruDurak, q=S.sorular[S.soruNo], kart=$("#durak-kart");
  if(!q){ durakSonuc(i,S.temiz?"parlak":"soluk"); return; }
  const dy=q.tip==="dy";
  // Şıkları bir kez hazırla (seçmelide karıştır, doğru/yanlışta sabit)
  if(!S.siklar){
    S.siklar = dy
      ? [{i:"✓",m:"Doğru",dogru:q.dogru===true},{i:"✗",m:"Yanlış",dogru:q.dogru===false}]
      : karistir(q.siklar.map((s,k)=>({i:s[0],m:s[1],dogru:k===q.dogru})));
  }
  const bitti=S.cozum!=="yok";
  const siklarHTML=S.siklar.map((s,j)=>{
    let sinif="sik", durum="";
    if(S.yanlislar.indexOf(j)>=0){ sinif+=" yanlis"; durum="✗"; }
    else if(bitti && s.dogru){ sinif+=" dogru"; durum="✓"; }
    else if(bitti) sinif+=" pasif";
    if(j===S.sonYanlis) sinif+=" titre";
    const kapali=bitti || S.yanlislar.indexOf(j)>=0;
    return `<button class="${sinif}" data-j="${j}"${kapali?" disabled":""}>${dy?"":`<span class="s-ikon">${ikonHTML(s.i)}</span>`}<span>${s.m}</span>${durum?`<span class="durum">${durum}</span>`:""}</button>`;
  }).join("");
  S.sonYanlis=-1;

  // 1. yanlıştan sonra: ipucu + karttaki ilgili cümle vurgulu
  let ekBolum="";
  if(!bitti && S.yanlislar.length){
    const cumleler=kartCumleleri(i).map((c,k)=>`<p>${k===q.vurgu?`<mark>${c.t}</mark>`:c.t}</p>`).join("");
    ekBolum=`${q.ipucu?`<div class="ipucu">💡 ${q.ipucu}</div>`:""}
      <div class="hatirlat"><div class="h-baslik">📜 Kartta ne yazıyordu?</div>${cumleler}</div>`;
  }
  if(S.cozum==="dogru1") ekBolum=`<div class="tebrik">${S.soruNo>=S.sorular.length-1?(S.temiz?"Harika! Fenerin parlıyor 🏮":"Doğru! Fenerin yanıyor 🏮"):"Harika! Sıradaki soru geliyor ✨"}</div>`;
  if(S.cozum==="dogru2" || S.cozum==="gosterildi") ekBolum=`<div class="aciklama">${S.cozum==="dogru2"?"✓ Doğru! ":""}${q.aciklama}</div>`;

  const sonSoru=S.soruNo>=S.sorular.length-1;
  let altBolum="";
  if(!bitti) altBolum=`<button class="btn cizgi-koyu" id="geri-kart">◀ Karta dön</button>`;
  else if(S.cozum!=="dogru1") altBolum=`<button class="btn" id="devam-btn">${sonSoru?"Fenerini yak 🏮":"Sonraki soru ▶"}</button>`;

  kart.innerHTML=`${kartUst(i)}
    <div class="soru${dy?" dy":""}">
      ${S.sorular.length>1?`<div class="soru-sayac">Soru ${S.soruNo+1} / ${S.sorular.length}</div>`:""}
      ${dy?`<span class="dy-etiket">Doğru mu, yanlış mı?</span>`:""}
      <h3>${q.soru}</h3>
      <div class="siklar">${siklarHTML}</div>
    </div>
    ${ekBolum}
    ${altBolum?`<div class="kart-alt">${altBolum}</div>`:""}`;
  kartAnim(kart,S.ilkCizim); S.ilkCizim=false;
  kart.querySelectorAll(".sik:not([disabled])").forEach(b=>b.onclick=()=>sikSec(+b.dataset.j));
  if($("#geri-kart")) $("#geri-kart").onclick=()=>durakAc(i);
  if($("#devam-btn")) $("#devam-btn").onclick=sonrakiSoru;
  if(bitti && S.cozum!=="dogru1") $("#devam-btn").scrollIntoView({block:"nearest",behavior:"smooth"});
}
function sikSec(j){
  if(S.cozum!=="yok") return;
  const q=S.sorular[S.soruNo], s=S.siklar[j];
  if(s.dogru){
    S.cozum=S.yanlislar.length?"dogru2":"dogru1";
    Ses.dogru(); soruCiz(); konfeti($("#durak-kart .sik.dogru"));
    if(S.cozum==="dogru1") S.zamanlayici=setTimeout(sonrakiSoru,1300);
    return;
  }
  S.yanlislar.push(j); S.sonYanlis=j; S.temiz=false; Ses.yanlis();
  // Doğru/yanlışta ya da 2. yanlışta doğru cevap gösterilir
  if(q.tip==="dy" || S.yanlislar.length>=2) S.cozum="gosterildi";
  soruCiz();
}
function sonrakiSoru(){
  if(S.soruDurak==null) return;
  clearTimeout(S.zamanlayici);
  S.soruNo++;
  if(S.soruNo>=S.sorular.length){ durakSonuc(S.soruDurak,S.temiz?"parlak":"soluk"); return; }
  soruSifirla(); soruCiz(); $("#durak-kart").scrollTop=0;
}
function durakSonuc(i,sonuc){
  clearTimeout(S.zamanlayici);
  S.soruDurak=null; S.durak=i+1; S.bekleyen={i,sonuc};
  sahneGoster("harita");
}

/* =========================================================
   11. ZAMAN ŞERİDİ (dokunarak sıralama)
   ========================================================= */
const Z={ kartlar:[], havuz:[], yerler:[], sabit:[], yigin:[], yanlisYerler:[], ipucu:"", kilit:false, bitti:false };
function zamanBaslat(){
  const liste=ZAMAN[S.seviye];
  Z.kartlar=liste;
  // Kartlar havuzda karışık; doğru sırada başlamasın
  let sira; do{ sira=karistir(liste.map((_,k)=>k)); }while(sira.every((v,k)=>v===k));
  Z.havuz=sira; Z.yerler=new Array(liste.length).fill(null); Z.sabit=[]; Z.yigin=[];
  Z.yanlisYerler=[]; Z.ipucu=""; Z.kilit=false; Z.bitti=false; Z.sonKonan=-1; Z.ilk=true;
  zamanCiz();
}
function zKartHTML(k,sinif,kapali){
  const c=Z.kartlar[k];
  return `<button class="zkart ${sinif||""}" data-k="${k}"${kapali?" disabled":""}><span class="z-ikon">${ikonHTML(c.i)}</span><span>${c.m}</span>${c.t?`<span class="z-tarih">${c.t}</span>`:""}</button>`;
}
function zamanCiz(){
  const n=Z.kartlar.length;
  const yuvalar=Z.yerler.map((k,j)=>{
    let ic="";
    if(k!=null){
      const sinif=(Z.bitti||Z.sabit.indexOf(j)>=0?"dogru":Z.yanlisYerler.indexOf(j)>=0?"yanlis titre":"")+(j===Z.sonKonan?" yerles":"");
      ic=zKartHTML(k,sinif,Z.bitti||Z.kilit||Z.sabit.indexOf(j)>=0);
    }
    return `<div class="yuva${k!=null?" dolu":""}" data-j="${j}"><span class="yuva-no">${j+1}</span>${ic}</div>`;
  }).join("");
  const kalan=Z.havuz.filter(k=>Z.yerler.indexOf(k)<0);
  const havuzHTML=kalan.length?kalan.map(k=>zKartHTML(k,"",Z.kilit)).join(""):`<span class="havuz-bos">${Z.bitti?"Hepsi yerinde!":"Kartların hepsi yerleşti"}</span>`;
  $("#zaman-kart").innerHTML=`
    <div class="kart-ust"><span class="durak-no">⏳ Son durak</span><h2>Zaman Şeridi</h2></div>
    <p class="zaman-yonerge">${Z.bitti?"Olaylar doğru sırada! Cumhuriyet'e giden yolu tamamladın.":"Olayları oldukları sıraya diz. Önce olanı 1. kutuya koy."}</p>
    <div><div class="ok-satir"><span>◀ Önce</span><span>Sonra ▶</span></div>
      <div class="zaman-cizgi${Z.bitti?" zaman-bitti":""}" style="--n:${n}">${yuvalar}</div></div>
    ${Z.bitti?"":`<div class="havuz">${havuzHTML}</div>`}
    ${Z.ipucu&&!Z.bitti?`<div class="ipucu">💡 ${Z.ipucu}</div>`:""}
    <div class="kart-alt">${Z.bitti
      ?`<button class="btn" id="zaman-devam">Alayı bitir 🎆</button>`
      :`<button class="btn cizgi-koyu" id="geri-al"${Z.yigin.length&&!Z.kilit?"":" disabled"}>↶ Geri al</button>`}</div>`;
  $$("#zaman-kart .havuz .zkart:not([disabled])").forEach(b=>b.onclick=()=>zKoy(+b.dataset.k));
  $$("#zaman-kart .yuva .zkart:not([disabled])").forEach(b=>b.onclick=()=>zCikar(+b.closest(".yuva").dataset.j));
  if($("#geri-al")) $("#geri-al").onclick=()=>{ if(Z.yigin.length) zCikar(Z.yigin[Z.yigin.length-1]); };
  if($("#zaman-devam")) $("#zaman-devam").onclick=()=>{ S.durak=TOPLAM_DURAK; sahneGoster("final"); };
  Z.yanlisYerler=Z.kilit?Z.yanlisYerler:[];
  Z.sonKonan=-1; kartAnim($("#zaman-kart"),Z.ilk); Z.ilk=false;
}
// Kartı ilk boş kutuya koy
function zKoy(k){
  if(Z.kilit || Z.bitti) return;
  const j=Z.yerler.indexOf(null); if(j<0) return;
  Z.yerler[j]=k; Z.yigin.push(j); Z.sonKonan=j; zamanCiz();
  if(Z.yerler.indexOf(null)<0) setTimeout(zKontrol,350);
}
// Kutudaki kartı havuza geri gönder
function zCikar(j){
  if(Z.kilit || Z.bitti || Z.sabit.indexOf(j)>=0) return;
  Z.yerler[j]=null; Z.yigin=Z.yigin.filter(x=>x!==j); zamanCiz();
}
function zKontrol(){
  const yanlis=[]; Z.yerler.forEach((k,j)=>{ if(k!==j) yanlis.push(j); });
  if(!yanlis.length){
    Z.bitti=true; Z.ipucu=""; Ses.dogru(); setTimeout(()=>Ses.can(),300); zamanCiz();
    $$("#zaman-kart .yuva .zkart").forEach((el,k)=>setTimeout(()=>konfeti(el),150*k));
    return;
  }
  // Doğru yerdekiler sabitlenir; yanlış olanlar titrer ve havuza döner
  Z.yerler.forEach((k,j)=>{ if(k===j && Z.sabit.indexOf(j)<0) Z.sabit.push(j); });
  const ilk=yanlis[0], k=Z.yerler[ilk], ad=Z.kartlar[k].m;
  Z.ipucu = k<ilk ? `“${ad}” daha önce oldu.` : `“${ad}” daha sonra oldu.`;
  Z.kilit=true; Z.yanlisYerler=yanlis; Ses.yanlis(); zamanCiz();
  setTimeout(()=>{
    yanlis.forEach(j=>{ Z.yerler[j]=null; });
    Z.yigin=Z.yigin.filter(j=>Z.yerler[j]!=null && Z.sabit.indexOf(j)<0);
    Z.kilit=false; Z.yanlisYerler=[]; zamanCiz();
  },1100);
}

/* =========================================================
   12. FİNAL — fener alayı geçidi, havai fişek, Cumhuriyet Kartım
   ========================================================= */
// Alttan geçen fener alayı: önde lider (rozet varsa bayrak taşır), arkada fener yakılan her durak için bir çocuk
function gecitSVG(durumlar,bayrakli){
  const r=tohumluRastgele(41); let bina="";
  let x=-20;
  while(x<1620){
    const w=60+r()*70, h=50+r()*110;
    bina+=`<rect x="${x.toFixed(0)}" y="${(240-h).toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}" rx="3" fill="#16245a" opacity=".9"/>`;
    for(let wy=240-h+14; wy<228; wy+=24) for(let wx=x+9; wx<x+w-14; wx+=20)
      if(r()<.3) bina+=`<rect x="${wx.toFixed(0)}" y="${wy.toFixed(0)}" width="9" height="11" rx="1.5" fill="#ffd96b" opacity="${(.45+r()*.5).toFixed(2)}"/>`;
    x+=w+6;
  }
  const kisiler=[{renk:"#E30A17",sac:"#3b2412",o:{bayrak:bayrakli,grad:"isikGrad2"}}]
    .concat(durumlar.map((d,i)=>({renk:KIYAFET[i%KIYAFET.length],sac:SAC[i%SAC.length],o:{soluk:d==="soluk",grad:"isikGrad2"}})));
  const alay=kisiler.map((k,i)=>`<g transform="translate(${-i*92},264) scale(1.25)"><g class="zipla" style="animation-delay:${(-i*.12).toFixed(2)}s">${kisiSVG(k.renk,k.sac,k.o)}</g></g>`).join("");
  return `<svg class="gecit" viewBox="0 0 1600 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs><radialGradient id="isikGrad2"><stop offset="0" stop-color="#ffe27a" stop-opacity=".85"/><stop offset=".45" stop-color="#ffb22e" stop-opacity=".32"/><stop offset="1" stop-color="#ffb22e" stop-opacity="0"/></radialGradient></defs>
    ${bina}
    <rect y="238" width="1600" height="62" fill="#2c3c78"/>
    <rect y="236" width="1600" height="5" fill="#0b1438"/>
    <line x1="0" y1="272" x2="1600" y2="272" stroke="#ffd24d" stroke-opacity=".45" stroke-width="4" stroke-dasharray="20 24"/>
    <g class="yuruyor"><g class="alay">${alay}</g></g>
  </svg>`;
}

// Havai fişek (tuval üzerinde parçacıklar)
const Havai={
  cv:null, ctx:null, parcalar:[], roketler:[], calisiyor:false, bitis:0, sonAtis:0, aralik:700, d:1,
  RENK:["#E30A17","#ffffff","#FFD24D","#ff6b6b","#ffe9a8"],
  baslat(sure,yogun,ayar){
    ayar=ayar||{};
    if(this.cv && this.ctx) this.ctx.clearRect(0,0,this.cv.width,this.cv.height);
    this.cv=$(ayar.cv||"#havai"); if(!this.cv || !this.cv.getContext) return;
    this.ctx=this.cv.getContext("2d"); this.boyut();
    this.sessiz=!!ayar.sessiz; this.soluk=ayar.soluk||1;
    this.parcalar=[]; this.roketler=[]; this.aralik=ayar.aralik||(yogun?380:700);
    this.bitis=performance.now()+sure; this.sonAtis=0;
    if(!this.calisiyor){ this.calisiyor=true; requestAnimationFrame(t=>this.kare(t)); }
  },
  dur(){ this.calisiyor=false; if(this.ctx) this.ctx.clearRect(0,0,this.cv.width,this.cv.height); },
  boyut(){ if(!this.cv) return; this.d=Math.min(2,window.devicePixelRatio||1); this.cv.width=this.cv.clientWidth*this.d; this.cv.height=this.cv.clientHeight*this.d; },
  at(){
    const W=this.cv.width, H=this.cv.height;
    this.roketler.push({ x:W*(.1+Math.random()*.8), y:H*.75, hedef:H*(.08+Math.random()*.3), vy:-H*(.011+Math.random()*.004),
      renk:this.RENK[Math.floor(Math.random()*this.RENK.length)] });
    if(!this.sessiz) Ses.firlat();
  },
  patlat(r){
    const n=44, renk2=this.RENK[Math.floor(Math.random()*this.RENK.length)];
    for(let k=0;k<n;k++){
      const a=k/n*Math.PI*2, h=(1.4+Math.random()*2.4)*this.d;
      this.parcalar.push({x:r.x,y:r.y,vx:Math.cos(a)*h,vy:Math.sin(a)*h,omur:1,renk:k%2?r.renk:renk2});
    }
    if(!this.sessiz) Ses.patlama();
  },
  kare(t){
    if(!this.calisiyor) return;
    const c=this.ctx, W=this.cv.width, H=this.cv.height, d=this.d;
    // İz bırakarak sil
    c.globalCompositeOperation="destination-out"; c.fillStyle="rgba(0,0,0,.22)"; c.fillRect(0,0,W,H);
    c.globalCompositeOperation="lighter";
    if(t<this.bitis && t-this.sonAtis>this.aralik){ this.at(); this.sonAtis=t; }
    this.roketler=this.roketler.filter(r=>{
      r.y+=r.vy; c.fillStyle="#ffe9a8"; c.beginPath(); c.arc(r.x,r.y,2.6*d,0,Math.PI*2); c.fill();
      if(r.y<=r.hedef){ this.patlat(r); return false; } return true;
    });
    this.parcalar=this.parcalar.filter(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=.035*d; p.vx*=.985; p.vy*=.985; p.omur-=.011;
      if(p.omur<=0) return false;
      c.globalAlpha=p.omur*this.soluk; c.fillStyle=p.renk; c.beginPath(); c.arc(p.x,p.y,2.3*d,0,Math.PI*2); c.fill(); c.globalAlpha=1;
      return true;
    });
    if(t>this.bitis && !this.roketler.length && !this.parcalar.length){ this.dur(); return; }
    requestAnimationFrame(tt=>this.kare(tt));
  }
};

function finalGiris(){
  const parlak=S.fenerler.filter(f=>f==="parlak").length;
  const onceki=K.enIyi[S.seviye];
  K.enIyi[S.seviye]=onceki==null?parlak:Math.max(onceki,parlak);
  const tamParlak=parlak===DURAK_SAYISI;
  if(tamParlak) K.rozet=true;
  kaydet();
  const satirlar=DURAKLAR.map((d,i)=>`<li>${miniFener(S.fenerler[i])}<div><b>${d.ad}</b><span>${d.ozet[S.seviye]}</span></div></li>`).join("");
  $("#final-icerik").innerHTML=`
    ${gecitSVG(S.fenerler.filter(Boolean),tamParlak)}
    <div class="final-ic">
      <div class="final-sol">
        <h1 class="final-baslik">Alay tamamlandı!</h1>
        <div class="final-yas">Cumhuriyetimiz ${CUMHURIYET_YASI} yaşında!</div>
        <div class="final-istat">Parlak fener: 🏮 ${parlak} / ${DURAK_SAYISI} &nbsp;·&nbsp; En iyi: ${K.enIyi[S.seviye]}</div>
        ${tamParlak?`<div class="rozet-kutu">🎖️ Bayrak Taşıyıcı rozeti kazandın!</div>`:""}
        <div class="btn-dizi"><button class="btn" id="tekrar-btn">Tekrar oyna ↻</button><button class="btn cizgi" id="ana-btn">Ana ekran</button></div>
      </div>
      <section class="ckart" aria-label="Cumhuriyet Kartım">
        <div class="ckart-ust">${bayrakSVG("ckart-bayrak")}<h2>Cumhuriyet Kartım</h2></div>
        <ol class="ckart-liste">${satirlar}</ol>
        <div class="ckart-alt">Ne mutlu Türküm diyene!</div>
        <div class="ckart-not">🏮 Parlak fener: ilk denemede doğru &nbsp;·&nbsp; Soluk fener: ikinci denemede</div>
      </section>
    </div>
    <div class="altbilgi">Sinan İnce 2026</div>`;
  $("#final-icerik").scrollTop=0;
  $("#tekrar-btn").onclick=()=>{ Havai.dur(); oyunBaslat(); };
  $("#ana-btn").onclick=()=>{ Havai.dur(); sahneGoster("giris"); };
  Ses.final();
  // Tüm fenerler parlaksa daha uzun ve yoğun gösteri
  setTimeout(()=>Havai.baslat(tamParlak?11000:6500,tamParlak),400);
}

/* =========================================================
   13. AYARLAR VE ONAY PENCERESİ
   ========================================================= */
function modalAc(html){ $("#modal-icerik").innerHTML=html; $("#modal").classList.add("acik"); }
function modalKapat(){ $("#modal").classList.remove("acik"); }
$("#modal").addEventListener("click",e=>{ if(e.target.id==="modal") modalKapat(); });

function onayAc(baslik,mesaj,evetMetni,cb){
  modalAc(`<h2>${baslik}</h2><p>${mesaj}</p>
    <div class="btn-dizi"><button class="btn kirmizi" id="onay-evet">${evetMetni}</button><button class="btn cizgi-koyu" id="onay-hayir">Vazgeç</button></div>`);
  $("#onay-evet").onclick=()=>{ modalKapat(); cb(); };
  $("#onay-hayir").onclick=modalKapat;
}
function ayarlarAc(){
  const oyunda=aktifSahne && aktifSahne.id!=="giris" && aktifSahne.id!=="final";
  modalAc(`<h2>⚙️ Ayarlar</h2>
    <div class="ayar-satir"><span>Ses</span>
      <div class="secim"><button data-ses="1" class="${K.ses?"secili":""}">Açık</button><button data-ses="0" class="${K.ses?"":"secili"}">Kapalı</button></div></div>
    <div class="ayar-satir"><span>Seviye</span>
      <div class="secim"><button data-sev="kucuk" class="${K.seviye==="kucuk"?"secili":""}">Küçükler</button><button data-sev="buyuk" class="${K.seviye==="buyuk"?"secili":""}">Büyükler</button></div></div>
    ${oyunda?`<p class="not">Seviye değişikliği yeni oyunda geçerli olur.</p>`:""}
    <div class="ayar-satir"><span>İlerleme</span><button class="btn cizgi-koyu" id="sifirla-btn">Sıfırla</button></div>
    <p class="not gizli" id="sifir-not">İlerleme sıfırlandı ✓</p>
    <div class="btn-dizi"><button class="btn" id="ayar-kapat">Kapat</button></div>
    <div class="altbilgi-ic">Sinan İnce 2026</div>`);
  $$("#modal-icerik [data-ses]").forEach(b=>b.onclick=()=>{ K.ses=b.dataset.ses==="1"; kaydet(); ayarlarAc(); });
  $$("#modal-icerik [data-sev]").forEach(b=>b.onclick=()=>{ K.seviye=b.dataset.sev; kaydet(); ayarlarAc(); if(aktifSahne.id==="giris") girisGuncelle(); });
  let emin=false, zam=null;
  $("#sifirla-btn").onclick=function(){
    if(!emin){ emin=true; this.textContent="Emin misin? Evet, sil"; this.classList.add("kirmizi"); this.classList.remove("cizgi-koyu");
      zam=setTimeout(()=>{ emin=false; this.textContent="Sıfırla"; this.classList.remove("kirmizi"); this.classList.add("cizgi-koyu"); },4000); return; }
    clearTimeout(zam);
    K=kopya(VARSAYILAN); kaydet();
    if(aktifSahne.id==="giris") girisGuncelle();
    ayarlarAc(); $("#sifir-not").classList.remove("gizli");
  };
  $("#ayar-kapat").onclick=modalKapat;
}
