/* =========================================================
   1. TEMEL DEĞİŞKENLER
   ========================================================= */
:root{
  --bg:#FFF8F0; --ink:#2B2340; --ink2:#6B6385; --beyaz:#FFFFFF;
  --tur:#FF6B35; --sari:#FFD600; --pembe:#FF4D8D; --yesil:#00C9A7; --mavi:#4D9FFF; --mor:#A855F7;
  --kirmizi:#E5484D; --cizgi:#BFD7FF; --kenarCizgi:#FF9C9C;
  --kapak:#4D9FFF; --kapakKoyu:#2F7FE0;
  --h1:#FF6B35; --h2:#4D9FFF;               /* hece renkleri (dönüşümlü) */
  --fs:clamp(20px, min(5.4vh, 4.6vw), 64px); /* defter satırı yazı boyu */
  --wf:clamp(30px, min(11vh, 8.4vw), 124px); /* büyük kelime yazı boyu */
  --pad:clamp(8px, 1.6vmin, 22px);
  --rad:24px;
  --golge:0 6px 0 rgba(43,35,64,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:'Nunito',system-ui,sans-serif;font-weight:700;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;font-weight:900;cursor:pointer;border:0;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--mor);outline-offset:3px}
.gizli{display:none!important}

/* =========================================================
   2. SAHNE (EKRAN) YÖNETİMİ
   ========================================================= */
.ekran{position:fixed;inset:0;display:flex;flex-direction:column;padding:var(--pad);padding-bottom:calc(var(--pad) + 22px);opacity:0;pointer-events:none;transition:opacity .25s}
.ekran.aktif{opacity:1;pointer-events:auto}
.altbilgi{position:fixed;left:0;right:0;bottom:4px;text-align:center;font-size:13px;color:var(--ink2);opacity:.75;pointer-events:none;z-index:5}

/* =========================================================
   3. GENEL BİLEŞENLER
   ========================================================= */
.dugme{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:64px;padding:.5em 1.2em;border-radius:20px;font-size:clamp(20px,3.2vmin,34px);background:var(--beyaz);box-shadow:var(--golge);transition:transform .08s, box-shadow .08s}
.dugme:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(43,35,64,.18)}
.dugme svg{width:1.2em;height:1.2em;flex:none}
.d-tur{background:var(--tur);color:#fff}.d-yesil{background:var(--yesil);color:#fff}.d-mor{background:var(--mor);color:#fff}
.d-mavi{background:var(--mavi);color:#fff}.d-pembe{background:var(--pembe);color:#fff}.d-kirmizi{background:var(--kirmizi);color:#fff}
.d-sari{background:var(--sari);color:var(--ink)}
.d-yuvarlak{width:64px;min-width:64px;padding:0;border-radius:50%}
.d-kucuk{min-height:52px;font-size:clamp(17px,2.4vmin,24px);padding:.35em .9em}
.dugme[disabled]{opacity:.45;pointer-events:none}
.rozet{display:inline-flex;align-items:center;gap:.35em;background:var(--beyaz);border-radius:999px;padding:.3em .8em;font-size:clamp(18px,2.8vmin,28px);box-shadow:var(--golge)}
.rozet svg{width:1.1em;height:1.1em}
.baslik{font-weight:900;font-size:clamp(26px,5vmin,52px);margin:0;text-align:center}
.kart{background:var(--beyaz);border-radius:var(--rad);box-shadow:var(--golge);padding:clamp(14px,2.5vmin,28px)}
.ustsatir{display:flex;align-items:center;gap:12px;margin-bottom:var(--pad)}
.ustsatir .baslik{flex:1}
.yildizSvg path{fill:var(--sari);stroke:#E5B800;stroke-width:2}
.yildizSvg.bos path{fill:#E6E1EE;stroke:#CFC8DA}

/* =========================================================
   4. ANA MENÜ
   ========================================================= */
#ekran-menu{align-items:center;justify-content:center;gap:clamp(10px,2.4vmin,26px)}
.menuUst{position:absolute;top:var(--pad);right:var(--pad);display:flex;gap:10px;align-items:center}
.menuKahraman{display:flex;align-items:center;gap:clamp(10px,3vmin,40px)}
.menuKahraman .uc{height:clamp(110px,26vh,280px)}
.menuBaslik{font-weight:900;font-size:clamp(34px,8vmin,92px);line-height:1;margin:0;color:var(--ink)}
.menuBaslik span{color:var(--tur)}
.menuAlt{font-size:clamp(17px,2.8vmin,30px);color:var(--ink2);margin:.3em 0 0}
.menuDugmeler{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,2vmin,20px);width:min(720px,92vw)}
.menuDugmeler .dugme{min-height:clamp(70px,11vh,110px)}
.menuDugmeler .buyuk{grid-column:1/-1;font-size:clamp(26px,4.6vmin,48px)}

/* =========================================================
   5. NASIL OYNANIR
   ========================================================= */
#ekran-nasil{align-items:center;justify-content:center;gap:var(--pad)}
.nasilKart{width:min(820px,94vw);text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.nasilKart h2{margin:0;font-size:clamp(26px,5vmin,50px);font-weight:900}
.nasilKart p{margin:0;font-size:clamp(18px,3vmin,30px);color:var(--ink2)}
.ornekDefter{background:#fff;border:3px solid var(--cizgi);border-radius:16px;padding:10px 22px;font-family:'Andika',sans-serif;font-size:clamp(24px,5vmin,52px);min-width:min(520px,80vw);text-align:left;position:relative}
.ornekDefter .os{border-bottom:2px solid var(--cizgi);padding:4px 0;min-height:1.5em;display:flex;align-items:flex-end}
.ornekDefter .os.sag{justify-content:flex-end}
.ornekDefter .tik{color:var(--yesil);font-family:'Nunito';font-weight:900;margin-left:auto}
.ornekDefter .carpi{color:var(--kirmizi);font-family:'Nunito';font-weight:900;margin-left:auto}
.ornekDefter .ust{text-decoration:line-through;text-decoration-color:var(--kirmizi);text-decoration-thickness:4px}
.noktalar{display:flex;gap:10px}
.noktalar i{width:14px;height:14px;border-radius:50%;background:#DDD6E8}
.noktalar i.on{background:var(--tur)}
.nasilDugmeler{display:flex;gap:12px}

/* =========================================================
   6. KADEME VE ANTRENMAN SEÇİMİ
   ========================================================= */
.kademeIzgara{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--pad);align-content:center;max-width:1200px;width:100%;margin:0 auto}
.kademeKart{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;border-radius:var(--rad);padding:clamp(14px,3vmin,32px) 14px;background:#fff;box-shadow:var(--golge);min-height:clamp(200px,42vh,420px);justify-content:center;position:relative}
.kademeKart .no{width:clamp(56px,10vmin,100px);height:clamp(56px,10vmin,100px);border-radius:50%;display:grid;place-items:center;font-size:clamp(30px,6vmin,58px);color:#fff}
.kademeKart h3{margin:0;font-size:clamp(24px,4vmin,40px);font-weight:900}
.kademeKart p{margin:0;color:var(--ink2);font-size:clamp(16px,2.5vmin,24px)}
.kademeKart .yildizlar svg{width:clamp(28px,5vmin,46px);height:clamp(28px,5vmin,46px)}
.kademeKart.kilitli{opacity:.6}
.kademeEtiket{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:999px;padding:.2em .8em;font-size:clamp(14px,2.2vmin,20px)}
.kademeEtiket svg{width:1.2em;height:1.2em}
.kademeKart .kilitNot{font-size:clamp(14px,2.2vmin,20px);color:var(--ink2);display:flex;align-items:center;gap:6px}
.kademeKart .kilitNot svg{width:1.2em;height:1.2em}
.secimGrup{display:flex;flex-direction:column;gap:10px;align-items:center;margin:8px 0}
.secimGrup h3{margin:0;font-size:clamp(20px,3.2vmin,30px)}
.secimSira{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.secimSira .dugme[aria-pressed="true"]{outline:5px solid var(--ink);outline-offset:2px}
#ekran-antrenman .icerik{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:clamp(8px,2vmin,20px)}

/* =========================================================
   7. OYUN EKRANI
   ========================================================= */
#ekran-oyun{gap:var(--pad)}
.oyunUst{display:flex;align-items:center;gap:clamp(6px,1.4vmin,14px);position:relative}
.ilerleme{display:flex;gap:clamp(3px,.8vmin,8px);flex:1;justify-content:center;flex-wrap:wrap}
.ilerleme i{width:clamp(12px,2.4vmin,24px);height:clamp(12px,2.4vmin,24px);border-radius:50%;background:#E6E1EE;border:3px solid transparent}
.ilerleme i.simdi{border-color:var(--tur);background:#fff}
.ilerleme i.d{background:var(--yesil)}
.ilerleme i.y{background:var(--kirmizi)}
.antSayac{flex:1;text-align:center;font-size:clamp(18px,3vmin,30px)}
.seri{color:var(--tur)}
.hizCubugu{position:absolute;left:0;right:0;bottom:calc(var(--pad) * -0.8);height:6px;border-radius:3px;background:#EEE8F4;overflow:hidden}
.hizCubugu b{display:block;height:100%;width:100%;background:var(--yesil);transform-origin:left center}

.defterKap{flex:1;min-height:0;background:var(--kapak);border-radius:28px;padding:clamp(10px,2vmin,22px) clamp(44px,9vmin,130px) clamp(10px,2vmin,22px) clamp(10px,2vmin,22px);display:flex;position:relative;box-shadow:inset 0 0 0 4px rgba(0,0,0,.08)}
.sayfa{flex:1;min-width:0;background:#fff;border-radius:8px 3px 3px 8px;position:relative;display:flex;flex-direction:column;padding:0 0 0 clamp(36px,7vmin,96px);box-shadow:4px 4px 0 rgba(0,0,0,.12)}
.sayfa::before{content:"";position:absolute;top:0;bottom:0;left:clamp(26px,5.4vmin,74px);width:3px;background:var(--kenarCizgi)}
.sayfa::after{content:"";position:absolute;top:0;bottom:0;right:-2px;width:5px;background:repeating-linear-gradient(var(--ink) 0 10px,transparent 10px 18px);opacity:.55;border-radius:2px}
.spiral{position:absolute;left:4px;top:8%;bottom:8%;width:clamp(12px,2.4vmin,26px);display:flex;flex-direction:column;justify-content:space-around;z-index:2}
.spiral i{display:block;width:100%;aspect-ratio:1;border-radius:50%;background:var(--bg);box-shadow:inset 2px 2px 0 rgba(0,0,0,.18)}
.satir{height:calc(var(--fs) * 1.75);flex:none;border-bottom:3px solid var(--cizgi);display:flex;align-items:flex-end;padding-right:.15em;font-family:'Andika',sans-serif;font-weight:400;font-size:var(--fs);line-height:1.15;padding-bottom:.08em;position:relative;white-space:nowrap}
.satir.s1{margin-top:calc(var(--fs) * .5)}
.onek{flex:1;min-width:0;display:flex;justify-content:flex-end;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 2.2em);mask-image:linear-gradient(90deg,transparent,#000 2.2em)}
.onek span{white-space:pre}
.onek .eski{color:#BDB5CC}
.yuva{flex:none;display:flex;flex-wrap:nowrap;align-items:flex-end;position:relative;transition:width .35s;margin-left:.28em}
.harf{display:inline-block;flex:none;transform-origin:0 0}
.harf.hedef{box-shadow:inset 0 -.42em 0 #FFEC80}
.harf.tasan{color:var(--kirmizi);box-shadow:none;text-shadow:0 0 6px #fff,0 0 2px #fff}
.harf.cizgiH{color:var(--tur);font-weight:700}
.satir.s2{padding-left:0}
.satir.s2 .kalan{white-space:pre}
.calisma{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;background:repeating-linear-gradient(transparent 0 calc(var(--fs) * 1.75 - 3px),rgba(191,215,255,.35) calc(var(--fs) * 1.75 - 3px) calc(var(--fs) * 1.75));cursor:crosshair}
.buyukKelime{display:flex;align-items:flex-end;font-family:'Andika',sans-serif;font-weight:700;font-size:var(--wf);line-height:1.1;position:relative;padding:.12em .2em .25em;outline:none}
.bh{display:inline-block;margin:0 .07em;transition:transform .12s;transform-origin:50% 100%}
.makasNokta{position:absolute;width:12px;height:12px;border-radius:50%;background:#C9BFE0;transform:translate(-50%,0);pointer-events:none}
.makas{position:absolute;top:0;width:clamp(36px,6vmin,64px);transform:translate(-50%,-62%);pointer-events:none;transition:left .08s;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
.kesCizgi{position:absolute;width:0;border-left:4px dashed var(--mor);pointer-events:none;transform:translateX(-2px)}
.makas.iptal,.kesCizgi.iptal{opacity:.3}
.catlak{position:absolute;width:24px;transform:translateX(-12px);pointer-events:none}
.ipucu{font-size:clamp(15px,2.2vmin,22px);color:var(--ink2);margin-top:4px;text-align:center}
.yargiSoru{font-size:clamp(26px,5.2vmin,56px);font-weight:900;color:var(--ink);text-align:center}
.altSira{display:flex;align-items:center;gap:clamp(8px,1.6vmin,18px);min-height:clamp(70px,14vh,150px)}
.altSira .uc{height:clamp(70px,14vh,150px);flex:none}
.balon{background:#fff;border-radius:20px;padding:.45em .9em;font-size:clamp(17px,2.9vmin,30px);box-shadow:var(--golge);position:relative;max-width:46%}
.balon::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:14px solid #fff;border-left:0}
.altSira .bosluk{flex:1}
.eylemler{display:flex;gap:clamp(8px,1.4vmin,16px)}
.eylemler .dugme{min-height:clamp(64px,11vh,108px);font-size:clamp(20px,3.6vmin,38px);padding:.4em 1em}
.ucan{position:absolute;font-weight:900;color:var(--yesil);font-size:clamp(28px,5vmin,52px);pointer-events:none;z-index:20;text-shadow:0 3px 0 #fff}

/* Geri bildirim kartı */
.geriBildirim{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:min(760px,94%);background:#fff;border-radius:22px;box-shadow:0 8px 0 rgba(43,35,64,.2),0 0 0 4px var(--kirmizi);padding:clamp(10px,2vmin,22px) clamp(14px,2.6vmin,28px);display:flex;gap:clamp(10px,2vmin,22px);align-items:center;z-index:15;cursor:pointer}
.geriBildirim.iyi{box-shadow:0 8px 0 rgba(43,35,64,.2),0 0 0 4px var(--yesil)}
.geriBildirim .gbIkon{width:clamp(44px,8vmin,80px);height:clamp(44px,8vmin,80px);flex:none}
.geriBildirim .gbMetin{flex:1;min-width:0}
.geriBildirim .gbMesaj{font-size:clamp(20px,3.6vmin,38px);font-weight:900;line-height:1.15}
.geriBildirim .gbHece{font-family:'Andika',sans-serif;font-size:clamp(22px,4.2vmin,44px);margin-top:4px}
.geriBildirim .gbDogrusu{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px;font-size:clamp(15px,2.4vmin,22px);color:var(--ink2)}
.geriBildirim .gbDevam{flex:none}
.hece1{color:var(--h1)}.hece2{color:var(--h2)}
.heceNokta{color:var(--ink2);margin:0 .12em}
.mini{display:inline-flex;flex-direction:column;background:#fff;border:2px solid var(--cizgi);border-radius:10px;padding:2px 10px;font-family:'Andika',sans-serif;color:var(--ink);font-size:clamp(18px,3vmin,30px);line-height:1.25}
.mini span{border-bottom:2px solid var(--cizgi);min-width:4em;white-space:pre}
.mini span:first-child{text-align:right}
.mini b{color:var(--tur)}

/* Onay katmanı */
.katman{position:fixed;inset:0;background:rgba(43,35,64,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.katman .kart{text-align:center;max-width:560px;display:flex;flex-direction:column;gap:16px}
.katman h3{margin:0;font-size:clamp(24px,4vmin,40px)}
.katman p{margin:0;color:var(--ink2);font-size:clamp(17px,2.6vmin,26px)}
.katman .sira{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.bildirim{position:fixed;left:50%;top:16px;transform:translate(-50%,-140%);background:var(--ink);color:#fff;border-radius:18px;padding:.6em 1.2em;font-size:clamp(18px,2.8vmin,28px);z-index:60;transition:transform .35s;display:flex;align-items:center;gap:.5em;max-width:92vw}
.bildirim.goster{transform:translate(-50%,0)}
.bildirim svg{width:1.4em;height:1.4em}

/* =========================================================
   8. TUR SONU
   ========================================================= */
#ekran-tursonu{align-items:center;justify-content:center;overflow:auto}
.sonKart{width:min(860px,96vw);display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.8vmin,18px);text-align:center}
.sonYildizlar{display:flex;gap:12px}
.sonYildizlar svg{width:clamp(56px,11vmin,110px);height:clamp(56px,11vmin,110px)}
.sonYildizlar.onlu{flex-wrap:wrap;justify-content:center;gap:6px}
.sonYildizlar.onlu svg{width:clamp(30px,6vmin,62px);height:clamp(30px,6vmin,62px)}
.sonYildizlar svg.bonusY{filter:drop-shadow(0 0 6px var(--mor))}
.sonYildizlar svg.bonusY path{fill:#C9A2FF;stroke:var(--mor)}
.sonYildizlar svg.parla{animation:yildizGel .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes yildizGel{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.sonPuan{font-size:clamp(40px,9vmin,96px);font-weight:900;line-height:1;color:var(--tur)}
.sonAlt{font-size:clamp(18px,3vmin,30px);color:var(--ink2)}
.rekor{background:var(--sari);border-radius:999px;padding:.25em .9em;font-weight:900;font-size:clamp(18px,3vmin,28px);animation:zipla .8s ease-in-out infinite alternate}
@keyframes zipla{to{transform:translateY(-6px)}}
.hataListe{display:flex;flex-direction:column;gap:10px;width:100%}
.hataListe h3{margin:4px 0 0;font-size:clamp(18px,3vmin,28px)}
.hataSatir{display:flex;align-items:center;gap:14px;justify-content:center;flex-wrap:wrap;background:#FFF4F4;border-radius:16px;padding:8px 12px}
.hataSatir .hm{font-size:clamp(15px,2.4vmin,22px);color:var(--ink2);max-width:22em;text-align:left}
.sonDugmeler{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* =========================================================
   9. KALEM DOLABI VE AYARLAR
   ========================================================= */
.dolapIc{flex:1;overflow:auto;display:flex;flex-direction:column;gap:var(--pad);max-width:1200px;width:100%;margin:0 auto}
.dolapIc h3{margin:0;font-size:clamp(20px,3.2vmin,32px)}
.esyaIzgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(120px,17vmin,180px),1fr));gap:12px}
.esya{background:#fff;border-radius:20px;box-shadow:var(--golge);padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:clamp(15px,2.2vmin,20px)}
.esya .uc{height:clamp(80px,13vmin,130px)}
.esya .kapakOrnek{width:70%;aspect-ratio:3/4;border-radius:10px 14px 14px 10px;box-shadow:inset 8px 0 0 rgba(0,0,0,.15)}
.esya.secili{outline:5px solid var(--yesil);outline-offset:-5px}
.esya.kilitli{opacity:.55}
.esya.alinabilir{box-shadow:0 0 0 4px var(--sari),var(--golge)}
.esya .fiyat{display:flex;align-items:center;gap:4px;font-weight:900;font-size:1.15em}
.esya .fiyat svg,.esya .kilitBilgi svg{width:1.1em;height:1.1em}
.esya .kilitBilgi{display:flex;align-items:center;gap:4px}
.esya .kilitBilgi svg{width:1.1em;height:1.1em}
.ayarIc{flex:1;display:flex;flex-direction:column;gap:14px;max-width:760px;width:100%;margin:0 auto;justify-content:center}
.ayarSatir{display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:clamp(19px,3vmin,30px)}
.anahtar{width:96px;height:54px;border-radius:999px;background:#DDD6E8;position:relative;flex:none;transition:background .2s}
.anahtar::after{content:"";position:absolute;top:6px;left:6px;width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.2);transition:transform .2s}
.anahtar[aria-checked="true"]{background:var(--yesil)}
.anahtar[aria-checked="true"]::after{transform:translateX(42px)}

/* =========================================================
   10. KÜÇÜK EKRANLAR (telefon)
   ========================================================= */
@media (max-width:640px){
  :root{--fs:clamp(18px,5.6vw,32px);--wf:clamp(30px,10.4vw,58px)}
  .kademeIzgara{grid-template-columns:1fr;align-content:start;overflow:auto}
  .kademeKart{min-height:0;flex-direction:row;flex-wrap:wrap;justify-content:flex-start;text-align:left}
  .menuKahraman{flex-direction:column;text-align:center}
  .defterKap{padding:8px 40px 8px 8px;border-radius:18px}
  .sayfa{padding-left:30px}
  .sayfa::before{left:22px}
  .spiral{display:none}
  .balon{max-width:none;flex:1}
  .altSira{flex-wrap:wrap}
  .altSira .bosluk{display:none}
  .eylemler{width:100%}
  .eylemler .dugme{flex:1}
  .geriBildirim{flex-wrap:wrap;bottom:2%}
  .oyunUst{flex-wrap:wrap;justify-content:flex-end}
  .oyunUst .d-yuvarlak:first-child{margin-right:auto}
  .ilerleme{order:9;flex-basis:100%}
  .oyunUst .rozet{font-size:17px;padding:.25em .6em}
}
@media (max-height:520px){
  .altSira .uc{height:60px}.altSira{min-height:60px}
  .menuKahraman .uc{height:90px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<!-- =========================================================
     EKRANLAR
     ========================================================= -->

<!-- 0. Nasıl Oynanır -->
<section class="ekran" id="ekran-nasil" aria-label="Nasıl oynanır">
  <div class="kart nasilKart" id="nasilKart"></div>
  <div class="noktalar" id="nasilNokta"></div>
  <div class="nasilDugmeler">
    <button class="dugme" id="nasilGeri">Geri</button>
    <button class="dugme d-tur" id="nasilIleri">İleri</button>
  </div>
</section>

<!-- 1. Ana Menü -->
<section class="ekran" id="ekran-menu" aria-label="Ana menü">
  <div class="menuUst">
    <span class="rozet" id="menuYildiz"></span>
    <button class="dugme d-yuvarlak" id="menuYardim" aria-label="Nasıl oynanır"></button>
  </div>
  <div class="menuKahraman">
    <div id="menuUc"></div>
    <div>
      <h1 class="menuBaslik">Satır Sonu<br><span>Makası</span></h1>
      <p class="menuAlt">Sığmayan kelimeyi heceden kes!</p>
    </div>
  </div>
  <div class="menuDugmeler">
    <button class="dugme d-tur buyuk" id="menuTur"></button>
    <button class="dugme d-yesil" id="menuAntrenman"></button>
    <button class="dugme d-mor" id="menuDolap"></button>
    <button class="dugme" id="menuAyarlar" style="grid-column:1/-1"></button>
  </div>
</section>

<!-- 2. Kademe Seç -->
<section class="ekran" id="ekran-kademe" aria-label="Kademe seç">
  <div class="ustsatir">
    <button class="dugme d-yuvarlak" data-geri="menu" aria-label="Geri"></button>
    <h2 class="baslik">Kademeni seç</h2>
    <span style="width:64px"></span>
  </div>
  <div class="kademeIzgara" id="kademeIzgara"></div>
</section>

<!-- 3. Oyun -->
<section class="ekran" id="ekran-oyun" aria-label="Oyun">
  <div class="oyunUst">
    <button class="dugme d-yuvarlak" id="oyunCik" aria-label="Çık"></button>

    <span class="rozet seri gizli" id="seriRozet"></span>
    <span class="rozet" id="yildizRozet"></span>
    <span class="rozet" id="puanRozet"></span>
    <button class="dugme d-yuvarlak d-sari gizli" id="kuralDugme" aria-label="Kurallar"></button>

  </div>
  <div class="defterKap" id="defterKap">
    <div class="spiral"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="sayfa" id="sayfa">
      <div class="satir s1" id="satir1"><div class="onek"><span class="eski" id="eskiMetin"></span><span id="onekMetin"></span></div><div class="yuva" id="yuva"></div></div>
      <div class="satir s2" id="satir2"><span id="sagParca" style="display:flex;align-items:flex-end"></span><span class="kalan" id="kalanMetin"></span></div>
      <div class="calisma" id="calisma"></div>
    </div>
  </div>
  <div class="altSira">
    <div id="oyunUc"></div>
    <div class="balon" id="balon">Sığmadı!</div>
    <div class="bosluk"></div>
    <div class="eylemler" id="eylemler"></div>
  </div>
</section>

<!-- 4. Antrenman Seç -->
<section class="ekran" id="ekran-antrenman" aria-label="Antrenman">
  <div class="ustsatir">
    <button class="dugme d-yuvarlak" data-geri="menu" aria-label="Geri"></button>
    <h2 class="baslik">Antrenman</h2>
    <span style="width:64px"></span>
  </div>

    <div class="secimGrup"><h3>Ne çalışalım?</h3><div class="secimSira" id="antTur"></div></div>
    <div class="secimGrup"><h3>Kademe</h3><div class="secimSira" id="antKademe"></div></div>
    <button class="dugme d-yesil" id="antBasla" style="min-width:240px"></button>
  </div>
</section>

<!-- 5. Tur Sonu -->
<section class="ekran" id="ekran-tursonu" aria-label="Tur sonu">
  <div class="kart sonKart" id="sonKart"></div>

<!-- 6. Kalem Dolabı -->
<section class="ekran" id="ekran-dolap" aria-label="Kalem dolabı">
  <div class="ustsatir">
    <button class="dugme d-yuvarlak" data-geri="menu" aria-label="Geri"></button>
    <h2 class="baslik">Kalem Dolabı</h2>

     satır başında tek harf kalmaz; kısa çizgi satır sonuna konur.
   ========================================================= */
const UNLULER = 'aeıioöuüâîû';
function kucukHarf(s){ return s.toLocaleLowerCase('tr-TR'); }
function unluMu(h){ return UNLULER.indexOf(kucukHarf(h)) !== -1; }
function harfler(k){ return Array.from(k); }

/** Yeni hecenin başladığı harf indeksleri (0 hariç). */
function heceSinirlari(k){
  const h = harfler(k), u = [];
  h.forEach(function(c, i){ if (unluMu(c)) u.push(i); });
  const s = [];
  for (let j = 1; j < u.length; j++){
    const ara = u[j] - u[j-1] - 1;
    s.push(ara === 0 ? u[j] : u[j] - 1);
  }
  return s;
}
function hecele(k){
  const h = harfler(k), s = heceSinirlari(k), out = [];
  let p = 0;
  s.forEach(function(x){ out.push(h.slice(p, x).join('')); p = x; });
  out.push(h.slice(p).join(''));
  return out;
}
/** Satır sonunda geçerli bölme noktaları (hece sınırı, iki tarafta en az 2 harf). */
function gecerliBolmeler(k){
  const n = harfler(k).length;
  return heceSinirlari(k).filter(function(b){ return b >= 2 && n - b >= 2; });
}
/** Kes cevabını değerlendirir. p: bölme indeksi ya da 'alta'. */
function kesimDegerlendir(k, p){
  const gec = gecerliBolmeler(k);
  if (p === 'alta') return gec.length === 0 ? { dogru:true } : { dogru:false, tur:'bolunebilir' };
  const sin = heceSinirlari(k), n = harfler(k).length;
  if (sin.indexOf(p) === -1) return { dogru:false, tur: sin.length === 0 ? 'tekHece' : 'heceOrtasi' };
  if (p < 2 || n - p < 2) return { dogru:false, tur:'tekHarf' };
  return { dogru:true };
}
/** Örnek gösterilecek doğru cevap: kelimenin ortasına en yakın bölme. */
function ornekCevap(k){
  const gec = gecerliBolmeler(k);
  if (!gec.length) return 'alta';
  const n = harfler(k).length;
  return gec.slice().sort(function(a, b){ return Math.abs(a - n/2) - Math.abs(b - n/2); })[0];
}
/** "Doğru mu?" sorusu üretir. rnd: 0–1 arası rastgele sayı üreten işlev. */
function yargiUret(k, kademe, rnd){
  rnd = rnd || Math.random;
  const n = harfler(k).length, sin = heceSinirlari(k), gec = gecerliBolmeler(k);
  const sec = function(a){ return a[Math.floor(rnd() * a.length)]; };
  const dogrular = [], yanlislar = [];
  if (!gec.length){
    dogrular.push({ tip:'alta', dogru:true });
    const tek = sin.filter(function(b){ return b < 2 || n - b < 2; });
    if (sin.length === 0 && n >= 2) yanlislar.push({ tip:'bol', p: Math.max(1, Math.floor(n/2)), cizgi:'son', dogru:false, tur:'tekHece' });
    else if (tek.length) yanlislar.push({ tip:'bol', p: sec(tek), cizgi:'son', dogru:false, tur:'tekHarf' });
  } else {
    dogrular.push({ tip:'bol', p: sec(gec), cizgi:'son', dogru:true });
    const orta = [];
    for (let p = 2; p <= n - 2; p++) if (sin.indexOf(p) === -1) orta.push(p);
    if (orta.length) yanlislar.push({ tip:'bol', p: sec(orta), cizgi:'son', dogru:false, tur:'heceOrtasi' });
    yanlislar.push({ tip:'bol', p: sec(gec), cizgi:'yok', dogru:false, tur:'cizgiYok' });
    if (kademe >= 2){
      const tek = sin.filter(function(b){ return b < 2 || n - b < 2; });
      if (tek.length) yanlislar.push({ tip:'bol', p: sec(tek), cizgi:'son', dogru:false, tur:'tekHarf' });
    }
  }
  if (!yanlislar.length || rnd() < 0.5) return sec(dogrular);
  return sec(yanlislar);
}

  return { onek: c.slice(0, a), kelime: c.slice(a + 1, b), sonek: c.slice(b + 1) };
}

/* =========================================================
   E. DEPOLAMA (localStorage)
   ========================================================= */
const DEPO_ANAHTAR = 'satirSonuMakasi.v1';
const Depo = {
  veri: null,
  varsayilan: function(){
    // toplamYildiz: harcanabilir yıldız (her doğru cevap +1); enIyi.d: bir turdaki en çok doğru
    return { v:1, enIyi:{ 1:{ d:0, p:0 }, 2:{ d:0, p:0 }, 3:{ d:0, p:0 } }, toplamYildiz:0,
      sahip:{ kalem:['sari'], kapak:['mavi'] },
      seciliKalem:'sari', seciliKapak:'mavi', son:[], nasilGoruldu:false, ses:true };
  },
  yukle: function(){
    let v = null;
    try { const s = localStorage.getItem(DEPO_ANAHTAR); if (s) v = JSON.parse(s); } catch(e){}
    const d = this.varsayilan();
    this.veri = v ? Object.assign(d, v) : d;
    [1,2,3].forEach(function(i){ const e = this.veri.enIyi[i] || (this.veri.enIyi[i] = { d:0, p:0 }); if (e.d == null) e.d = 0; }, this);
    if (!this.veri.sahip || !this.veri.sahip.kalem) this.veri.sahip = { kalem:['sari'], kapak:['mavi'] };
    delete this.veri.tumKademeler;
  },
  kaydet: function(){ try { localStorage.setItem(DEPO_ANAHTAR, JSON.stringify(this.veri)); } catch(e){} },
  sifirla: function(){ try { localStorage.removeItem(DEPO_ANAHTAR); } catch(e){} this.veri = this.varsayilan(); }
};

/* =========================================================
   F. SES (Web Audio API — dosya yok)
   ========================================================= */
const Ses = {
  ctx:null, gurultuTampon:null,
  hazirla: function(){
    if (!this.ctx){
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
      const n = this.ctx.sampleRate, b = this.ctx.createBuffer(1, n, n), d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      this.gurultuTampon = b;
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  ton: function(f, t, sure, tip, kazanc, f2){
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = tip || 'sine'; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + sure);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(kazanc || .2, t + .012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + sure);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + sure + .05);
  },
  gurultu: function(t, sure, tip, f1, f2, kazanc){
    const c = this.ctx, s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.gurultuTampon; fl.type = tip; fl.frequency.setValueAtTime(f1, t);
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + sure);
    g.gain.setValueAtTime(kazanc, t); g.gain.exponentialRampToValueAtTime(0.0001, t + sure);
    s.connect(fl).connect(g).connect(c.destination); s.start(t); s.stop(t + sure + .02);
  },
  cal: function(ad){
    if (!Depo.veri.ses) return;
    this.hazirla(); if (!this.ctx) return;
    const t = this.ctx.currentTime + .01;
    switch (ad){
      case 'kes': this.gurultu(t, .06, 'highpass', 3500, 0, .5); this.gurultu(t + .09, .07, 'highpass', 3000, 0, .45); break;
      case 'dogru': this.ton(660, t, .14, 'sine', .22); this.ton(990, t + .11, .22, 'sine', .22); break;
      case 'yanlis': this.ton(260, t, .32, 'triangle', .22, 150); break;
      case 'kay': this.gurultu(t, .32, 'bandpass', 450, 2200, .35); break;
      case 'tik': this.gurultu(t, .015, 'highpass', 5000, 0, .06); break;
      case 'tus': this.ton(880, t, .06, 'sine', .08); break;
      case 'yildiz': this.ton(1180, t, .25, 'sine', .18); this.ton(1770, t + .05, .2, 'sine', .08); break;
      case 'fanfar': [523, 659, 784, 1047].forEach(function(f, i){ Ses.ton(f, t + i * .12, i === 3 ? .45 : .16, 'triangle', .18); }); break;
      case 'pop': this.ton(500, t, .1, 'sine', .15, 900); break;
    }
  }
};

const $ = function(id){ return document.getElementById(id); };
const bekle = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };
const azHareket = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function karistir(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function el(etiket, sinif, html){ const e = document.createElement(etiket); if (sinif) e.className = sinif; if (html != null) e.innerHTML = html; return e; }
function kacis(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
function heceHTML(k){
  return hecele(k).map(function(h, i){ return '<span class="hece' + (i % 2 ? 2 : 1) + '">' + kacis(h) + '</span>'; }).join('<span class="heceNokta">·</span>');
}
/** Doğru bölmeyi gösteren küçük iki satırlık defter parçası. */
function miniHTML(k, p){

  return '<span class="mini"><span>… <b>' + kacis(h.slice(0, p).join('')) + '-</b></span><span><b>' + kacis(h.slice(p).join('')) + '</b> …</span></span>';

let bildirimZaman = null;
function bildir(html){

function onayla(baslik, metin, evet, hayir){

    $('katman').classList.remove('gizli');

    });

/** FLIP: hedef öğeyi kaynak dikdörtgenden kendi yerine uçurur. */
function ucur(hedefEl, kaynak, gecikme, sure){
  if (azHareket || !hedefEl.animate) return;
  const r = hedefEl.getBoundingClientRect();
  if (!r.width || !kaynak.width) return;
  const dx = kaynak.left - r.left, dy = kaynak.top - r.top;
  const sx = kaynak.width / r.width, sy = kaynak.height / r.height;
  hedefEl.animate([
    { transform:'translate(' + dx + 'px,' + dy + 'px) scale(' + sx + ',' + sy + ')' },
    { transform:'none' }
  ], { duration: sure || 480, delay: gecikme || 0, easing:'cubic-bezier(.3,1.25,.5,1)', fill:'backwards' });
}
function pop(e, gecikme){
  if (azHareket || !e.animate) return;
  e.animate([{ transform:'scale(0)' }, { transform:'scale(1.3)' }, { transform:'none' }], { duration:320, delay:gecikme || 0, fill:'backwards' });
}
function salla(e){
  if (!e || azHareket || !e.animate) return;
  e.animate([{ transform:'translateX(0)' }, { transform:'translateX(-12px)' }, { transform:'translateX(12px)' }, { transform:'translateX(-8px)' }, { transform:'translateX(0)' }], { duration:380 });
}

/* =========================================================
   I. SORU SEÇİCİ (tekrar önleme)
   ========================================================= */
function cumleSec(kademe, adet, haric){
  const havuz = CUMLELER[kademe].map(function(c, i){ return { id: kademe + '-' + i, metin: c }; });
  const son = Depo.veri.son;
  let aday = karistir(havuz.filter(function(x){ return son.indexOf(x.id) === -1 && (!haric || haric.indexOf(x.id) === -1); }));
  if (aday.length < adet){
    // yeterli yoksa en eskilerden tamamla
    const eski = son.filter(function(id){ return id.indexOf(kademe + '-') === 0 && (!haric || haric.indexOf(id) === -1); });
    eski.forEach(function(id){ if (aday.length < adet) aday.push(havuz[+id.split('-')[1]]); });
  }
  const secilen = [], kelimeler = [];
  for (let i = 0; i < aday.length && secilen.length < adet; i++){
    const k = kucukHarf(cumleCoz(aday[i].metin).kelime);
    if (kelimeler.indexOf(k) !== -1) continue;
    kelimeler.push(k); secilen.push(aday[i]);
  }
  return secilen;
}
function sonaEkle(id){
  const s = Depo.veri.son, i = s.indexOf(id);
  if (i !== -1) s.splice(i, 1);
  s.push(id); while (s.length > 30) s.shift();
}
function soruKur(kayit, tip, kademe){
  const c = cumleCoz(kayit.metin);
  const s = { id: kayit.id, onek: c.onek, kelime: c.kelime, sonek: c.sonek, tip: tip, kademe: kademe };
  if (tip === 'yargi') s.yargi = yargiUret(c.kelime, kademe);
  return s;
}
function turSorulari(kademe){
  const secim = cumleSec(kademe, 10);
  // 3 "Doğru mu?" sorusu: ilk soru hep Kes, yan yana gelmesin
  let yer;
  do { yer = karistir([1,2,3,4,5,6,7,8,9]).slice(0, 3).sort(function(a, b){ return a - b; }); }
  while (yer[1] - yer[0] < 2 || yer[2] - yer[1] < 2);
  return secim.map(function(k, i){ return soruKur(k, yer.indexOf(i) !== -1 ? 'yargi' : 'kes', kademe); });
}

/* =========================================================
   J. OYUN DURUMU
   ========================================================= */
const Oyun = {
  mod:'tur', kademe:1, antTur:'karisik',
  sorular:[], i:0, puan:0, seri:0, dogruSay:0, cevapSay:0, yanlislar:[],
  soru:null, kilit:true, basla:0, makasG:-1, iptal:false,
  bekleyen:null, // geri bildirim kapanınca devam
  hizAnim:null,
  oturum:0 // ekrandan çıkınca eski zamanlayıcıları geçersiz kılar
};

function turBaslat(kademe){
  Oyun.mod = 'tur'; Oyun.kademe = kademe; Oyun.basBakiye = Depo.veri.toplamYildiz;
  Oyun.sorular = turSorulari(kademe);
  Oyun.i = 0; Oyun.puan = 0; Oyun.seri = 0; Oyun.dogruSay = 0; Oyun.cevapSay = 0; Oyun.yanlislar = [];
  Oyun.gecmis = ILK_GECMIS;
  Oyun.oturum++;
  Sahne.goster('oyun');
  soruGoster();
}
function antrenmanBaslat(tur, kademe){
  Oyun.mod = 'antrenman'; Oyun.kademe = kademe; Oyun.antTur = tur;
  Oyun.i = 0; Oyun.puan = 0; Oyun.seri = 0; Oyun.dogruSay = 0; Oyun.cevapSay = 0; Oyun.yanlislar = [];
  Oyun.sorular = []; Oyun.gecmis = ILK_GECMIS;
  Oyun.oturum++;
  Sahne.goster('oyun');
  soruGoster();
}
function antrenmanSorusu(){
  const tip = Oyun.antTur === 'karisik' ? (Math.random() < 0.65 ? 'kes' : 'yargi') : Oyun.antTur;
  const onceki = Oyun.sorular.slice(-12).map(function(s){ return s.id; });
  const k = cumleSec(Oyun.kademe, 1, onceki)[0] || cumleSec(Oyun.kademe, 1)[0];
  return soruKur(k, tip, Oyun.kademe);
}

/* =========================================================
   K. OYUN EKRANI — ÇİZİM

function ustBarCiz(){
  const tur = Oyun.mod === 'tur';
  $('yildizRozet').innerHTML = IKON.yildiz + '<span>' + Depo.veri.toplamYildiz + '</span>';
  $('ilerleme').classList.toggle('gizli', !tur);
  $('antSayac').classList.toggle('gizli', tur);
  $('kuralDugme').classList.toggle('gizli', tur);

  $('puanRozet').classList.toggle('gizli', !tur);

    Oyun.sorular.forEach(function(s, i){

function balon(metin, ifade){
  $('balon').textContent = metin;
  $('oyunUc').innerHTML = ucSVG(Depo.veri.seciliKalem, ifade || 'normal');
}
function kapakUygula(){
  const k = KAPAKLAR.find(function(x){ return x.id === Depo.veri.seciliKapak; }) || KAPAKLAR[0];
  $('defterKap').style.background = k.bg;
}
function harfSpan(h, sinif){ const s = el('span', 'harf' + (sinif ? ' ' + sinif : '')); s.textContent = h; return s; }
function eylemCiz(dugmeler){
  const e = $('eylemler'); e.innerHTML = '';
  dugmeler.forEach(function(d){
    const b = el('button', 'dugme ' + d.sinif, d.html); b.id = d.id || ''; b.onclick = d.tik; if (d.kapali) b.disabled = true;
    e.appendChild(b);
  });
}
function eylemleriKilitle(k){ $('eylemler').querySelectorAll('button').forEach(function(b){ b.disabled = k; }); }

/** Yuva genişliğini içindeki ilk "adet" harfe göre ayarlar (K1–K2). */
function yuvaGenislik(adet){
  const y = $('yuva'), hs = y.querySelectorAll('.harf');
  if (!hs.length || adet <= 0){ y.style.width = '0px'; return; }
  let w = 0; for (let i = 0; i < Math.min(adet, hs.length); i++) w += hs[i].getBoundingClientRect().width;
  y.style.width = Math.ceil(w) + 'px';
}

/** Bir metni harf harf yazar. */
async function yaz(hedef, metin, oturum, tikSesi){
  if (Oyun.atla || azHareket){ hedef.textContent += metin; return; }
  const ad = Math.max(12, Math.min(40, 900 / Math.max(1, metin.length)));
  for (let i = 0; i < metin.length; i++){
    if (oturum !== Oyun.oturum) return;
    if (Oyun.atla){ hedef.textContent += metin.slice(i); return; }
    hedef.textContent += metin[i];
    if (tikSesi && i % 3 === 0) Ses.cal('tik');
    await bekle(ad);
  }
}

async function soruGoster(){
  const oturum = Oyun.oturum;
  if (Oyun.mod === 'antrenman'){ Oyun.sorular.push(antrenmanSorusu()); Oyun.i = Oyun.sorular.length - 1; }
  const s = Oyun.soru = Oyun.sorular[Oyun.i];
  Oyun.kilit = true; Oyun.atla = false; Oyun.makasG = -1;
  kapakUygula(); ustBarCiz(); hizDurdur(true);
  // sayfayı temizle
  $('eskiMetin').textContent = Oyun.gecmis ? Oyun.gecmis + ' ' : '';
  $('onekMetin').textContent = ''; $('sagParca').innerHTML = ''; $('kalanMetin').textContent = '';
  const y = $('yuva'); y.innerHTML = ''; y.style.width = '0px';
  const cal = $('calisma'); cal.innerHTML = ''; cal.onpointerdown = null;
  $('sayfa').onclick = function(){ Oyun.atla = true; };
  eylemCiz([]);
  if (s.tip === 'kes') await kesSorusu(s, oturum);
  else await yargiSorusu(s, oturum);
}

/* ---------- KES sorusu ---------- */
async function kesSorusu(s, oturum){
  const h = harfler(s.kelime), n = h.length;
  balon('Yazıyorum…', 'normal');
  await yaz($('onekMetin'), s.onek.replace(/\s+$/, ''), oturum, true);
  if (oturum !== Oyun.oturum) return;
  // hedef kelimeyi satıra yaz: taşsın
  const y = $('yuva');
  const sigan = Math.min(n - 1, Math.max(2, Math.floor(n / 2)));
  h.forEach(function(c){ y.appendChild(harfSpan(c, 'hedef')); });
  yuvaGenislik(sigan);
  const hs = y.querySelectorAll('.harf');
  for (let i = 0; i < n; i++){
    if (i >= sigan) hs[i].classList.add('tasan');
    if (!Oyun.atla && !azHareket){ hs[i].style.opacity = 0; }
  }
  for (let i = 0; i < n; i++){ if (oturum !== Oyun.oturum) return; hs[i].style.opacity = ''; if (!Oyun.atla && !azHareket){ Ses.cal('tik'); await bekle(70); } }
  balon('Sığmadı!', 'saskin');
  Ses.cal('pop');
  await bekle(Oyun.atla ? 150 : 650);
  if (oturum !== Oyun.oturum) return;
  // satırdaki harfleri kaldır, büyük kelimeye taşı
  y.innerHTML = ''; y.style.width = '0px';
  buyukKelimeKur(s);
  balon(s.kademe >= 2 ? 'Nereden keselim? Yoksa bölünmez mi?' : 'Nereden keselim?', 'normal');
  const dugmeler = [];
  if (s.kademe >= 2) dugmeler.push({ id:'altaAt', sinif:'d-mavi', html: IKON.asagi + 'Bölünmez', tik: function(){ cevapKes('alta'); } });
  eylemCiz(dugmeler);
  $('sayfa').onclick = null;
  Oyun.kilit = false;
  Oyun.basla = performance.now();
  hizBaslat();
}

function buyukKelimeKur(s){
  const cal = $('calisma'); cal.innerHTML = '';
  const bk = el('div', 'buyukKelime'); bk.tabIndex = 0; bk.setAttribute('aria-label', 'Kelime: ' + s.kelime + '. Sağ sol oklarla makası kaydır, Enter ile kes.');
  harfler(s.kelime).forEach(function(c){ const sp = el('span', 'bh'); sp.textContent = c; bk.appendChild(sp); });
  cal.appendChild(bk);
  const ip = el('div', 'ipucu', 'Parmağını koy, kaydır, bırak: kes!'); cal.appendChild(ip);
  if (!azHareket && bk.animate) bk.animate([{ transform:'translateY(-40px) scale(.6)', opacity:0 }, { transform:'none', opacity:1 }], { duration:360, easing:'cubic-bezier(.3,1.4,.5,1)' });
  setTimeout(makasNoktalariCiz, 380);
  // dokunma / fare
  cal.onpointerdown = function(e){
    if (Oyun.kilit) return;
    Ses.hazirla();
    cal.setPointerCapture(e.pointerId);
    Oyun.iptal = false;
    makasKonumla(e.clientX, e.clientY);
    cal.onpointermove = function(ev){ makasKonumla(ev.clientX, ev.clientY); };
    cal.onpointerup = function(ev){
      cal.onpointermove = null; cal.onpointerup = null; cal.onpointercancel = null;
      if (Oyun.kilit) return;
      if (Oyun.iptal){ makasGizle(); return; }
      if (Oyun.makasG > 0) cevapKes(Oyun.makasG);
    };
    cal.onpointercancel = function(){ cal.onpointermove = null; cal.onpointerup = null; makasGizle(); };
  };
  // klavye
  bk.onkeydown = function(e){
    if (Oyun.kilit) return;
    const n = harfler(s.kelime).length;
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
      e.preventDefault();
      let g = Oyun.makasG > 0 ? Oyun.makasG : Math.floor(n / 2);
      if (Oyun.makasG > 0) g += e.key === 'ArrowRight' ? 1 : -1;
      g = Math.max(1, Math.min(n - 1, g));
      makasGoster(g);
    } else if (e.key === 'Enter' || e.key === ' '){
      e.preventDefault(); if (Oyun.makasG > 0) cevapKes(Oyun.makasG);
    }
  };
  setTimeout(function(){ try { bk.focus({ preventScroll:true }); } catch(e){} }, 50);
}
/** Harf aralıklarının x konumları (çalışma alanına göre). */
function aralikKonumlari(){
  const cal = $('calisma'), cr = cal.getBoundingClientRect();
  const hs = cal.querySelectorAll('.bh'), out = [];
  for (let i = 1; i < hs.length; i++){
    const a = hs[i-1].getBoundingClientRect(), b = hs[i].getBoundingClientRect();
    out.push({ g: i, x: (a.right + b.left) / 2 - cr.left, ust: a.top - cr.top, alt: a.bottom - cr.top });
  }
  return out;
}
function makasNoktalariCiz(){
  if (Oyun.kilit) return;
  const cal = $('calisma'); cal.querySelectorAll('.makasNokta').forEach(function(x){ x.remove(); });
  aralikKonumlari().forEach(function(a){
    const d = el('i', 'makasNokta'); d.style.left = a.x + 'px'; d.style.top = (a.alt + 4) + 'px'; cal.appendChild(d);
  });
}
function makasKonumla(x, yy){
  const cal = $('calisma'), cr = cal.getBoundingClientRect();
  const ar = aralikKonumlari(); if (!ar.length) return;
  const lx = x - cr.left;
  let en = ar[0];
  ar.forEach(function(a){ if (Math.abs(a.x - lx) < Math.abs(en.x - lx)) en = a; });
  // çalışma alanının çok dışına çıkılırsa kesme iptal
  Oyun.iptal = (yy < cr.top - 30 || yy > cr.bottom + 30);
  makasGoster(en.g);
}
function makasGoster(g){
  const cal = $('calisma');
  const ar = aralikKonumlari().find(function(a){ return a.g === g; }); if (!ar) return;
  if (g !== Oyun.makasG) Ses.cal('tus');
  Oyun.makasG = g;
  let m = cal.querySelector('.makas'), c = cal.querySelector('.kesCizgi');
  if (!m){ m = el('div', 'makas', IKON.makas); cal.appendChild(m); }
  if (!c){ c = el('div', 'kesCizgi'); cal.appendChild(c); }
  m.style.left = ar.x + 'px'; m.style.top = ar.ust + 'px';
  c.style.left = ar.x + 'px'; c.style.top = ar.ust + 'px'; c.style.height = (ar.alt - ar.ust) + 'px';
  m.classList.toggle('iptal', Oyun.iptal); c.classList.toggle('iptal', Oyun.iptal);
  cal.querySelectorAll('.bh').forEach(function(b, i){ b.style.transform = Oyun.iptal ? '' : (i < g ? 'translateX(-.12em)' : 'translateX(.12em)'); });
}
function makasGizle(){
  const cal = $('calisma');
  cal.querySelectorAll('.makas,.kesCizgi').forEach(function(x){ x.remove(); });
  cal.querySelectorAll('.bh').forEach(function(b){ b.style.transform = ''; });
  Oyun.makasG = -1;
}

/** Doğru (ya da örnek) kesimi satırlara yerleştirir, harfleri büyük kelimeden uçurur. */
async function kesimiYerlestir(s, p, oturum){
  const cal = $('calisma'), bh = Array.from(cal.querySelectorAll('.bh'));
  const kaynak = bh.map(function(b){ return b.getBoundingClientRect(); });
  const h = harfler(s.kelime), y = $('yuva'), sag = $('sagParca');
  const solEls = [], sagEls = [];
  let cizgiEl = null;
  if (p === 'alta'){
    h.forEach(function(c){ const sp = harfSpan(c, 'hedef'); sag.appendChild(sp); sagEls.push(sp); });
    y.style.width = '0px';
  } else {
    y.innerHTML = '';
    for (let i = 0; i < p; i++){ const sp = harfSpan(h[i], 'hedef'); y.appendChild(sp); solEls.push(sp); }
    cizgiEl = harfSpan('-', 'cizgiH');
    y.appendChild(cizgiEl);
    y.style.transition = 'none'; yuvaGenislik(p + 1); void y.offsetWidth; y.style.transition = '';
    for (let i = p; i < h.length; i++){ const sp = harfSpan(h[i], 'hedef'); sag.appendChild(sp); sagEls.push(sp); }
  }
  // büyük kelimeyi gizle, harfleri uçur
  cal.querySelectorAll('.makas,.kesCizgi,.makasNokta,.ipucu,.catlak').forEach(function(x){ x.remove(); });
  bh.forEach(function(b){ b.style.visibility = 'hidden'; });
  Ses.cal('kay');
  solEls.forEach(function(e, i){ ucur(e, kaynak[i], i * 25, 480); });
  const ofs = p === 'alta' ? 0 : p;
  sagEls.forEach(function(e, i){ ucur(e, kaynak[ofs + i], 120 + i * 25, 520); });
  if (cizgiEl){ pop(cizgiEl, 480); setTimeout(function(){ Ses.cal('pop'); }, 480); }
  await bekle(azHareket ? 50 : 650);
  if (oturum !== Oyun.oturum) return;
  await yaz($('kalanMetin'), s.sonek, oturum, false);
}

/* ---------- KES cevabı ---------- */
async function cevapKes(p){
  if (Oyun.kilit) return;
  Oyun.kilit = true; eylemleriKilitle(true);
  const oturum = Oyun.oturum, s = Oyun.soru;
  const sure = performance.now() - Oyun.basla;
  hizDurdur(false);
  if (p !== 'alta') Ses.cal('kes');
  const sonuc = kesimDegerlendir(s.kelime, p);
  if (sonuc.dogru){
    puanVer(true, sure);
    balon(['Harika!', 'Süper kesim!', 'Tam hecesinden!', 'Bravo!'][Math.floor(Math.random() * 4)], 'mutlu');
    Ses.cal('dogru');
    await kesimiYerlestir(s, p, oturum);
    if (oturum !== Oyun.oturum) return;
    await bekle(500);
    if (Oyun.mod === 'antrenman') await geriBildirimGoster(s, { iyi:true, mesaj:'Doğru!', p:p });
  } else {
    puanVer(false, sure);
    Ses.cal('yanlis');
    balon('Olmadı…', 'uzgun');
    // kesilen yerde çatlak göster
    if (p !== 'alta'){
      const ar = aralikKonumlari().find(function(a){ return a.g === p; });
      if (ar){ const c = el('div', 'catlak', IKON.catlak); c.style.left = ar.x + 'px'; c.style.top = ar.ust + 'px'; c.style.height = (ar.alt - ar.ust) + 'px'; $('calisma').appendChild(c); }
    }
    salla($('calisma').querySelector('.buyukKelime'));
    await bekle(550);
    if (oturum !== Oyun.oturum) return;
    const dogrusu = ornekCevap(s.kelime);
    Oyun.yanlislar.push({ kelime: s.kelime, tur: sonuc.tur, p: dogrusu });
    const yer = kesimiYerlestir(s, dogrusu, oturum);
    await geriBildirimGoster(s, { iyi:false, mesaj: MESAJ[sonuc.tur], p: dogrusu, ekBolunmez: dogrusu === 'alta' && sonuc.tur !== 'tekHece' });
    await yer;
  }
  if (oturum !== Oyun.oturum) return;
  gecmiseEkle(s);
  sonrakiSoru();
}

/* ---------- DOĞRU MU? sorusu ---------- */
async function yargiSorusu(s, oturum){
  const y = s.yargi, h = harfler(s.kelime);
  balon('Yazıyorum…', 'normal');
  await yaz($('onekMetin'), s.onek.replace(/\s+$/, ''), oturum, true);
  if (oturum !== Oyun.oturum) return;
  const yu = $('yuva'), sag = $('sagParca');
  if (y.tip === 'alta'){
    h.forEach(function(c){ sag.appendChild(harfSpan(c, 'hedef')); });
  } else {
    for (let i = 0; i < y.p; i++) yu.appendChild(harfSpan(h[i], 'hedef'));
    if (y.cizgi === 'son') yu.appendChild(harfSpan('-', 'cizgiH'));
    yuvaGenislik(y.p + (y.cizgi === 'son' ? 1 : 0));
    if (y.cizgi === 'bas') sag.appendChild(harfSpan('-', 'cizgiH'));
    for (let i = y.p; i < h.length; i++) sag.appendChild(harfSpan(h[i], 'hedef'));
  }
  await yaz($('kalanMetin'), s.sonek, oturum, true);
  if (oturum !== Oyun.oturum) return;
  const cal = $('calisma'); cal.innerHTML = '<div class="yargiSoru">Bu satır doğru mu?</div>';
  balon('Satır sonuna iyi bak!', 'normal');
  eylemCiz([
    { id:'yargiDogru', sinif:'d-yesil', html: IKON.dogru + 'Doğru', tik: function(){ cevapYargi(true); } },
    { id:'yargiYanlis', sinif:'d-kirmizi', html: IKON.yanlis + 'Yanlış', tik: function(){ cevapYargi(false); } }
  ]);
  $('sayfa').onclick = null;
  Oyun.kilit = false; Oyun.basla = performance.now(); hizBaslat();
}
async function cevapYargi(dediDogru){
  if (Oyun.kilit) return;
  Oyun.kilit = true; eylemleriKilitle(true);
  const oturum = Oyun.oturum, s = Oyun.soru, y = s.yargi;
  const sure = performance.now() - Oyun.basla;
  hizDurdur(false);
  const bildi = dediDogru === y.dogru;
  puanVer(bildi, sure);
  const dogrusu = ornekCevap(s.kelime);
  if (bildi){
    Ses.cal('dogru'); balon('Doğru bildin!', 'mutlu');
    if (!y.dogru || Oyun.mod === 'antrenman') await geriBildirimGoster(s, { iyi:true, mesaj: y.dogru ? 'Evet, bu satır doğru!' : 'Evet, yanlış! ' + MESAJ[y.tur], p: y.dogru ? null : dogrusu, kisa: Oyun.mod === 'tur' });
    else await bekle(700);
  } else {
    Ses.cal('yanlis'); balon('Olmadı…', 'uzgun');
    salla($('satir1')); salla($('satir2'));
    Oyun.yanlislar.push({ kelime: s.kelime, tur: y.dogru ? 'dogruyduYanlis' : y.tur, p: dogrusu });
    await bekle(450);
    await geriBildirimGoster(s, { iyi:false, mesaj: y.dogru ? MESAJ.dogruyduYanlis + ' Heceden bölünmüş, çizgi satır sonunda.' : MESAJ[y.tur], p: y.dogru ? null : dogrusu });
  }
  if (oturum !== Oyun.oturum) return;
  gecmiseEkle(s);
  sonrakiSoru();
}

/* ---------- Geri bildirim kartı ---------- */
function geriBildirimGoster(s, o){
  return new Promise(function(coz){
    const sayfa = $('sayfa');
    const k = el('div', 'geriBildirim' + (o.iyi ? ' iyi' : ''));
    k.setAttribute('role', 'status');
    let dogrusu = '';
    if (o.p != null) dogrusu = '<div class="gbDogrusu">Doğrusu: ' + miniHTML(s.kelime, o.p) + (o.p === 'alta' ? '<span>Bölünmez: kelimenin hepsi alt satıra geçer.</span>' : '') + '</div>';
    k.innerHTML = '<div class="gbIkon" style="color:' + (o.iyi ? 'var(--yesil)' : 'var(--kirmizi)') + '">' + (o.iyi ? IKON.dogru : IKON.yanlis) + '</div>' +
      '<div class="gbMetin"><div class="gbMesaj">' + kacis(o.mesaj) + '</div><div class="gbHece">' + heceHTML(s.kelime) + '</div>' + dogrusu + '</div>' +
      (Oyun.mod === 'antrenman' ? '<button class="dugme d-tur d-kucuk gbDevam">Devam</button>' : '');
    sayfa.appendChild(k);
    pop(k);
    let bitti = false;
    const kapat = function(){ if (bitti) return; bitti = true; k.remove(); coz(); };
    k.onclick = function(){ Ses.cal('tus'); kapat(); };
    Oyun.bekleyen = kapat;
    if (Oyun.mod === 'tur') setTimeout(kapat, o.kisa ? 1800 : (o.iyi ? 2000 : 3000));
  });
}

/* ---------- Puan, hız, seri ---------- */
function puanVer(dogru, sure){
  Oyun.cevapSay++;
  const s = Oyun.soru; s.sonuc = dogru;
  if (dogru){
    Oyun.dogruSay++; Oyun.seri++;
    // her doğru cevap 1 yıldız (Hızlı Tur ve Antrenman), hemen kaydedilir
    Depo.veri.toplamYildiz++; Depo.kaydet();
    setTimeout(function(){ pop($('yildizRozet')); Ses.cal('yildiz'); }, 250);
    let p = 10;
    if (sure <= SURE[Oyun.kademe]) p += 5;
    if (Oyun.seri >= 3) p += 5;
    if (Oyun.mod === 'tur'){ Oyun.puan += p; ucanPuan('+' + p); }
  } else Oyun.seri = 0;
  ustBarCiz();
}
function ucanPuan(t){
  const r = $('puanRozet').getBoundingClientRect();
  const u = el('div', 'ucan', t); u.style.left = (r.left - 10) + 'px'; u.style.top = (r.bottom + 6) + 'px'; u.style.position = 'fixed';
  document.body.appendChild(u);
  if (u.animate) u.animate([{ transform:'translateY(20px)', opacity:0 }, { transform:'none', opacity:1, offset:.3 }, { transform:'translateY(-14px)', opacity:0 }], { duration:1100 });
  setTimeout(function(){ u.remove(); }, 1100);
}
function hizBaslat(){
  if (Oyun.mod !== 'tur') return;
  const b = $('hizCubugu').querySelector('b');
  b.style.background = 'var(--yesil)';
  if (b.animate) Oyun.hizAnim = b.animate([{ transform:'scaleX(1)', background:'#00C9A7' }, { transform:'scaleX(.5)', background:'#FFD600', offset:.5 }, { transform:'scaleX(0)', background:'#FF6B35' }], { duration:SURE[Oyun.kademe], fill:'forwards' });
}
function hizDurdur(sifirla){
  if (Oyun.hizAnim){ if (sifirla) Oyun.hizAnim.cancel(); else Oyun.hizAnim.pause(); }
  if (sifirla) Oyun.hizAnim = null;
}

const ILK_GECMIS = 'Bugün defterime güzel cümleler yazıyorum. Kalemim hazır.';
function gecmiseEkle(s){
  const t = (Oyun.gecmis + ' ' + s.onek + s.kelime + s.sonek).trim();
  Oyun.gecmis = t.length > 140 ? t.slice(t.length - 140) : t;
}
async function sonrakiSoru(){
  if (Oyun.mod === 'tur'){
    Oyun.i++;
    if (Oyun.i >= Oyun.sorular.length){ turBitir(); return; }
  }
  soruGoster();
}

/* =========================================================
   L. TUR SONU
   ========================================================= */
function turBitir(){
  Oyun.oturum++;
  const v = Depo.veri, k = Oyun.kademe;
  const d = Oyun.dogruSay;
  const enIyi = v.enIyi[k];
  const kilitAcildi = k < 3 && d >= KADEME_ESIK && enIyi.d < KADEME_ESIK;
  const rekor = Oyun.puan > enIyi.p && Oyun.puan > 0;
  if (d > enIyi.d) enIyi.d = d;
  if (Oyun.puan > enIyi.p) enIyi.p = Oyun.puan;
  // tur bitince kademe bonusu (Orta +1, Usta +2)
  const bonus = TUR_BONUSU[k] || 0;
  v.toplamYildiz += bonus;
  Oyun.sorular.forEach(function(s){ sonaEkle(s.id); });
  Depo.kaydet();
  Sahne.goster('tursonu');
  const kart = $('sonKart');
  let html = '<h2 class="baslik">Tur bitti!</h2><div class="sonYildizlar onlu">';
  for (let i = 0; i < 10; i++) html += (i < d ? IKON.yildiz.replace('class="yildizSvg"', 'class="yildizSvg parla" style="animation-delay:' + (0.3 + i * 0.12) + 's"') : IKON.yildizBos);
  for (let i = 0; i < bonus; i++) html += IKON.yildiz.replace('class="yildizSvg"', 'class="yildizSvg parla bonusY" style="animation-delay:' + (1.6 + i * 0.3) + 's"');
  html += '</div><div class="sonAlt"><b style="color:var(--ink)">+' + d + ' yıldız</b>' +
    (bonus ? ' + <b style="color:var(--mor)">' + bonus + ' bonus yıldız</b>' : '') + ' kazandın! · 10 sorudan ' + d + ' doğru</div>';
  html += '<div class="sonPuan">' + Oyun.puan + ' puan</div>';
  if (rekor) html += '<div class="rekor">Yeni rekor!</div>';
  if (Oyun.yanlislar.length){
    html += '<div class="hataListe"><h3>Hatalarına bak</h3>';
    Oyun.yanlislar.slice(0, 3).forEach(function(y){
      html += '<div class="hataSatir"><span class="gbHece" style="font-family:Andika;font-size:clamp(20px,3.4vmin,34px)">' + heceHTML(y.kelime) + '</span>' + miniHTML(y.kelime, y.p) + '<span class="hm">' + kacis(MESAJ[y.tur]) + '</span></div>';
    });
    html += '</div>';
  } else if (d === 10) html += '<div class="sonAlt">Hiç hata yok! Makas ustasısın!</div>';
  if (d < 5) html += '<div class="sonAlt">Bir daha dene, başarırsın!</div>';
  html += '<div class="sonDugmeler"><button class="dugme d-tur" id="sonTekrar">' + IKON.oyna + 'Tekrar oyna</button><button class="dugme" id="sonMenu">' + IKON.ev + 'Menü</button></div>';
  kart.innerHTML = html;
  $('sonTekrar').onclick = function(){ Ses.cal('tus'); turBaslat(k); };
  $('sonMenu').onclick = function(){ Ses.cal('tus'); Sahne.goster('menu'); };
  Ses.cal('fanfar');
  if (bonus) setTimeout(function(){ Ses.cal('yildiz'); }, 1700);
  // bu turla alınabilir hâle gelen market ürünleri
  const alinabilir = marketUrunleri().filter(function(x){ return !x.sahip && x.fiyat > (Oyun.basBakiye || 0) && x.fiyat <= v.toplamYildiz; });
  if (alinabilir.length) setTimeout(function(){ bildir(IKON.yildiz + 'Kalem Dolabı\'nda artık alabilirsin: ' + alinabilir.slice(0, 3).map(function(x){ return x.ad; }).join(', ') + (alinabilir.length > 3 ? ' ve ' + (alinabilir.length - 3) + ' ürün daha' : '') + '!'); }, 1800);
  // kademe kilidi açıldı mı
  if (kilitAcildi) setTimeout(function(){ bildir(IKON.yildiz + (k + 1) + '. kademe açıldı!'); }, alinabilir.length ? 4600 : 1800);
}

/* =========================================================
   M. EKRAN KURULUMLARI
   ========================================================= */
function kademeAcik(k){ return k === 1 || Depo.veri.enIyi[k-1].d >= KADEME_ESIK; }
function marketUrunleri(){
  const v = Depo.veri;
  return KALEMLER.map(function(x){ return { ad:x.ad + ' kalem', fiyat:x.fiyat, sahip: v.sahip.kalem.indexOf(x.id) !== -1 }; })
    .concat(KAPAKLAR.map(function(x){ return { ad:x.ad + ' kapak', fiyat:x.fiyat, sahip: v.sahip.kapak.indexOf(x.id) !== -1 }; }));
}

let nasilSayfa = 0;

const Ekranlar = {
  nasil: function(){
    const ciz = function(){
      const n = NASIL[nasilSayfa];
      $('nasilKart').innerHTML = ucSVG(Depo.veri.seciliKalem, nasilSayfa === 2 ? 'saskin' : 'mutlu').replace('class="uc"', 'class="uc" style="height:clamp(70px,14vh,140px)"') +
        '<h2>' + n.b + '</h2><div class="ornekDefter">' + n.o + '</div><p>' + n.m + '</p>';
      $('nasilNokta').innerHTML = NASIL.map(function(_, i){ return '<i class="' + (i === nasilSayfa ? 'on' : '') + '"></i>'; }).join('');
      $('nasilGeri').style.visibility = nasilSayfa === 0 ? 'hidden' : 'visible';
      $('nasilIleri').textContent = nasilSayfa === NASIL.length - 1 ? 'Başla!' : 'İleri';
    };
    nasilSayfa = 0; ciz();
    $('nasilGeri').onclick = function(){ Ses.cal('tus'); if (nasilSayfa > 0){ nasilSayfa--; ciz(); } };
    $('nasilIleri').onclick = function(){
      Ses.cal('tus');
      if (nasilSayfa < NASIL.length - 1){ nasilSayfa++; ciz(); }
      else { Depo.veri.nasilGoruldu = true; Depo.kaydet(); Sahne.goster('menu'); }
    };
  },
  menu: function(){
    $('menuUc').innerHTML = ucSVG(Depo.veri.seciliKalem, 'mutlu');
    $('menuYildiz').innerHTML = IKON.yildiz + '<span>' + Depo.veri.toplamYildiz + '</span>';
    $('menuYardim').innerHTML = IKON.soru;
    $('menuTur').innerHTML = IKON.oyna + 'Hızlı Tur';
    $('menuAntrenman').innerHTML = IKON.hedef + 'Antrenman';
    $('menuDolap').innerHTML = IKON.dolap + 'Kalem Dolabı';
    $('menuAyarlar').innerHTML = IKON.ayar + 'Ayarlar';
  },
  kademe: function(){
    const iz = $('kademeIzgara'); iz.innerHTML = '';
    [1,2,3].forEach(function(k){
      const b = KADEME_BILGI[k], acik = kademeAcik(k), en = Depo.veri.enIyi[k];
      const kart = el('button', 'kademeKart' + (acik ? '' : ' kilitli'));
      kart.innerHTML = '<span class="no" style="background:' + b.renk + '">' + k + '</span><h3>' + b.ad + '</h3><p>' + b.acik + '</p>' +
        '<span class="kademeEtiket">' + IKON.saat + SURE_AD[k] + ' süre</span>' +
        '<span class="kademeEtiket">' + IKON.yildiz + (TUR_BONUSU[k] ? 'Tur sonu +' + TUR_BONUSU[k] + ' bonus' : 'Bonus yok') + '</span>' +
        (acik ? (en.p ? '<p>En iyi: ' + en.d + '/10 doğru · ' + en.p + ' puan</p>' : '') : '<span class="kilitNot">' + IKON.kilit + (k - 1) + '. kademede bir turda ' + KADEME_ESIK + ' doğru yap</span>');
      kart.onclick = function(){
        Ses.cal('tus');
        if (!acik){ salla(kart); bildir(IKON.kilit + 'Önce ' + (k - 1) + '. kademede bir turda ' + KADEME_ESIK + ' doğru yap!'); return; }
        turBaslat(k);
      };
      iz.appendChild(kart);
    });
  },
  antrenman: function(){
    const turlar = [['kes', 'Kes'], ['yargi', 'Doğru mu?'], ['karisik', 'Karışık']];
    const tz = $('antTur'); tz.innerHTML = '';
    turlar.forEach(function(t){
      const b = el('button', 'dugme d-kucuk', t[1]); b.setAttribute('aria-pressed', Oyun.antTur === t[0]);
      b.onclick = function(){ Ses.cal('tus'); Oyun.antTur = t[0]; Ekranlar.antrenman(); };
      tz.appendChild(b);
    });
    const kz = $('antKademe'); kz.innerHTML = '';
    if (!kademeAcik(Oyun.kademe)) Oyun.kademe = 1;
    [1,2,3].forEach(function(k){
      const acik = kademeAcik(k);
      const b = el('button', 'dugme d-kucuk', (acik ? '' : IKON.kilit) + k + '. ' + KADEME_BILGI[k].ad);
      b.setAttribute('aria-pressed', Oyun.kademe === k);
      if (!acik) b.disabled = true;
      b.onclick = function(){ Ses.cal('tus'); Oyun.kademe = k; Ekranlar.antrenman(); };
      kz.appendChild(b);
    });
    $('antBasla').innerHTML = IKON.oyna + 'Başla';
    $('antBasla').onclick = function(){ Ses.cal('tus'); antrenmanBaslat(Oyun.antTur, Oyun.kademe); };
  },
  oyun: function(){
    $('oyunCik').innerHTML = IKON.ev;
    $('kuralDugme').innerHTML = IKON.kitap;
    kapakUygula();
  },
  dolap: function(){
    const v = Depo.veri;
    $('dolapYildiz').innerHTML = IKON.yildiz + '<span>' + v.toplamYildiz + '</span>';
    const ciz = function(liste, tur, kap, gorsel){
      kap.innerHTML = '';
      liste.forEach(function(k){
        const sahip = v.sahip[tur].indexOf(k.id) !== -1;
        const secili = (tur === 'kalem' ? v.seciliKalem : v.seciliKapak) === k.id;
        const yeter = v.toplamYildiz >= k.fiyat;
        const e = el('button', 'esya' + (sahip ? '' : (yeter ? ' alinabilir' : ' kilitli')) + (secili ? ' secili' : ''));
        e.innerHTML = gorsel(k, secili) + '<span>' + k.ad + '</span>' +
          (sahip ? (secili ? '<span class="kilitBilgi" style="color:var(--yesil)">' + IKON.dogru + 'Seçili</span>' : '<span class="kilitBilgi">Seç</span>') :
                   '<span class="fiyat">' + IKON.yildiz + k.fiyat + '</span>');
        e.onclick = async function(){
          Ses.cal('tus');
          if (!sahip){
            if (!yeter){ salla(e); bildir(IKON.yildiz + (k.fiyat - v.toplamYildiz) + ' yıldız daha gerekiyor.'); return; }
            const ok = await onayla(k.ad + ' alınsın mı?', k.fiyat + ' yıldız harcanacak.', 'Al', 'Vazgeç');
            if (!ok) return;
            v.toplamYildiz -= k.fiyat; v.sahip[tur].push(k.id);
            Ses.cal('fanfar');
          }
          if (tur === 'kalem') v.seciliKalem = k.id; else v.seciliKapak = k.id;
          Depo.kaydet(); Ekranlar.dolap();
        };
        kap.appendChild(e);
      });
    };
    ciz(KALEMLER, 'kalem', $('kalemIzgara'), function(k, secili){ return ucSVG(k.id, secili ? 'mutlu' : 'normal'); });
    ciz(KAPAKLAR, 'kapak', $('kapakIzgara'), function(k){
      return '<span class="kapakOrnek" style="background:' + k.bg + '"></span>';
    });
  },
  ayarlar: function(){
    const v = Depo.veri;
    $('ayarSes').setAttribute('aria-checked', v.ses);
  }
};

/* =========================================================
   N. OLAY BAĞLANTILARI
   ========================================================= */
function baglantilar(){
  document.querySelectorAll('[data-geri]').forEach(function(b){
    b.innerHTML = IKON.geri;
    b.onclick = function(){ Ses.cal('tus'); Sahne.goster(b.dataset.geri); };
  });
  $('menuTur').onclick = function(){ Ses.cal('tus'); Sahne.goster('kademe'); };
  $('menuAntrenman').onclick = function(){ Ses.cal('tus'); Sahne.goster('antrenman'); };
  $('menuDolap').onclick = function(){ Ses.cal('tus'); Sahne.goster('dolap'); };
  $('menuAyarlar').onclick = function(){ Ses.cal('tus'); Sahne.goster('ayarlar'); };
  $('menuYardim').onclick = function(){ Ses.cal('tus'); Sahne.goster('nasil'); };
  $('oyunCik').onclick = async function(){
    Ses.cal('tus');
    const bitmis = Oyun.mod === 'antrenman';
    if (!bitmis){
      const durdu = Oyun.hizAnim; if (durdu) durdu.pause();
      const ok = await onayla('Turdan çıkılsın mı?', 'Puanın kaydedilmez ama kazandığın yıldızlar sende kalır.', 'Çık', 'Devam et');
      if (!ok){ if (durdu && !Oyun.kilit) durdu.play(); return; }
    }
    Oyun.oturum++; hizDurdur(true);
    Sahne.goster('menu');
  };
  $('kuralDugme').onclick = function(){
    Ses.cal('tus');
    const k = $('katmanKart');
    k.innerHTML = '<h3>Kurallar</h3>' + NASIL.map(function(n, i){ return '<p style="text-align:left"><b style="color:var(--tur)">' + (i + 1) + '.</b> ' + n.m + '</p>'; }).join('') +
      '<div class="sira"><button class="dugme d-tur">Tamam</button></div>';
    $('katman').classList.remove('gizli');
    k.querySelector('button').onclick = function(){ Ses.cal('tus'); $('katman').classList.add('gizli'); };
  };
  $('ayarSes').onclick = function(){ Depo.veri.ses = !Depo.veri.ses; Depo.kaydet(); Ses.cal('tus'); Ekranlar.ayarlar(); };
  $('ayarNasil').onclick = function(){ Ses.cal('tus'); Sahne.goster('nasil'); };
  $('ayarSifirla').onclick = async function(){
    Ses.cal('tus');
    const ok = await onayla('Emin misin?', 'Tüm yıldızlar, rekorlar ve kalemler silinecek.', 'Evet, sil', 'Vazgeç');
    if (!ok) return;
    Depo.sifirla(); Depo.kaydet();
    bildir('İlerleme sıfırlandı.');
    Sahne.goster('nasil');
  };
  // ilk dokunuşta ses bağlamını aç (tarayıcı kuralı)
  document.addEventListener('pointerdown', function(){ Ses.hazirla(); }, { once:true });
  // pencere boyutu değişince makas noktalarını yenile
  window.addEventListener('resize', function(){ if (Sahne.simdiki === 'oyun' && !Oyun.kilit && Oyun.soru && Oyun.soru.tip === 'kes'){ makasGizle(); makasNoktalariCiz(); } });
}

/* =========================================================
   O. TEST (adres sonuna ?test=1 eklenirse motor testleri çalışır)
   ========================================================= */
function motorTestleri(){
  const hece = {
    kelebek:'ke-le-bek', 'Türkçe':'Türk-çe', portre:'port-re', ilkokul:'il-ko-kul', saat:'sa-at', program:'prog-ram',
    araba:'a-ra-ba', 'uçurtma':'u-çurt-ma', 'öğretmen':'öğ-ret-men', 'ayakkabı':'a-yak-ka-bı', 'kahvaltı':'kah-val-tı',
    'rüzgârlı':'rüz-gâr-lı', 'hikâyeler':'hi-kâ-ye-ler', ev:'ev', 'kuş':'kuş', 'ağaç':'a-ğaç', dua:'du-a', 'şiir':'şi-ir',
    televizyon:'te-le-viz-yon', sandalye:'san-dal-ye', 'kaplumbağa':'kap-lum-ba-ğa', 'gökyüzünde':'gök-yü-zün-de',
    'yıldızlar':'yıl-dız-lar', 'çikolata':'çi-ko-la-ta', 'tavşan':'tav-şan', 'ördek':'ör-dek', 'ılık':'ı-lık',
    'ütüledi':'ü-tü-le-di', 'altlık':'alt-lık', korkmak:'kork-mak', 'saklambaç':'sak-lam-baç', 'Arkadaşım':'Ar-ka-da-şım'
  };
  const sonuc = [];
  Object.keys(hece).forEach(function(k){ const g = hecele(k).join('-'); sonuc.push([g === hece[k], 'hecele(' + k + ') = ' + g + ' (beklenen ' + hece[k] + ')']); });
  const bol = [ ['araba', null, [3]], ['odam', null, []], ['kelebek', null, [2,4]], ['kuş', null, []], ['uçurtma', null, [5]],
    ['ağaç', null, []], ['dua', null, []], ['kaplumbağa', null, [3,6,8]] ];
  bol.forEach(function(t){ const g = JSON.stringify(gecerliBolmeler(t[0], t[1])); sonuc.push([g === JSON.stringify(t[2]), 'gecerliBolmeler(' + t[0] + ',' + t[1] + ') = ' + g]); });
  const deg = [ ['kalem', 2, null, true], ['kalem', 3, null, 'heceOrtasi'], ['araba', 1, null, 'tekHarf'], ['araba', 'alta', null, 'bolunebilir'],
    ['odam', 'alta', null, true], ['kuş', 1, null, 'tekHece'], ['kelebek', 4, null, true], ['kaplumbağa', 'alta', null, 'bolunebilir'] ];
  deg.forEach(function(t){ const r = kesimDegerlendir(t[0], t[1], t[2]); const g = r.dogru ? true : r.tur; sonuc.push([g === t[3], 'kesimDegerlendir(' + t[0] + ',' + t[1] + ',' + t[2] + ') = ' + g]); });
  return sonuc;
}

/* =========================================================
   P. BAŞLAT
   ========================================================= */
Depo.yukle();
baglantilar();
Sahne.goster(Depo.veri.nasilGoruldu ? 'menu' : 'nasil');
if (/[?&]test=1/.test(location.search)){
  const r = motorTestleri(), hata = r.filter(function(x){ return !x[0]; });
  r.forEach(function(x){ (x[0] ? console.log : console.error)((x[0] ? 'GEÇTİ ' : 'KALDI ') + x[1]); });
  bildir('Motor testi: ' + (r.length - hata.length) + '/' + r.length + ' geçti');
}
window.__SSM = { Oyun:Oyun, Depo:Depo, cevapKes:cevapKes, cevapYargi:cevapYargi, turBaslat:turBaslat, antrenmanBaslat:antrenmanBaslat, motorTestleri:motorTestleri, Sahne:Sahne };
</script>
