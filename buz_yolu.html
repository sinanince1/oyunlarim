<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Buz Yolu — Sayı Doğrusu Oyunu</title>
<style>
/* =========================================================
   1. TEMEL DEĞİŞKENLER VE SIFIRLAMA
   ========================================================= */
:root{
  --lacivert:#14213D; --gece:#0E2A52; --deniz:#2A7AB8; --buz:#F4FBFF; --buz2:#CDEBFA; --buz3:#9ED3EE;
  --turuncu:#FF6B35; --sari:#FFD600; --pembe:#FF4D8D; --turkuaz:#00C9A7; --mavi:#4D9FFF; --mor:#A855F7; --krem:#FFF8F0;
  --font:'Nunito','Baloo 2',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--gece);font-family:var(--font);color:var(--lacivert);
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
#app{position:fixed;inset:0}

/* =========================================================
   2. SAHNELER (ekran geçişleri)
   ========================================================= */
.screen{position:absolute;inset:0;display:none;opacity:0;transition:opacity .35s ease;flex-direction:column}
.screen.aktif{display:flex}
.screen.gorunur{opacity:1}

/* Ortak gökyüzü + kuzey ışığı */
.gokyuzu{background:linear-gradient(180deg,#0B2347 0%,#173F78 45%,#4F94CF 80%,#8EC5EC 100%);overflow:hidden}
.aurora{position:absolute;inset:-20% -10% auto -10%;height:70%;pointer-events:none;filter:blur(28px);opacity:.55}
.aurora i{position:absolute;border-radius:50%;animation:aurora 14s ease-in-out infinite alternate}
.aurora i:nth-child(1){left:5%;top:20%;width:45%;height:35%;background:#3DFFB0}
.aurora i:nth-child(2){left:40%;top:5%;width:40%;height:30%;background:#A855F7;animation-delay:-5s}
.aurora i:nth-child(3){left:65%;top:25%;width:35%;height:28%;background:#00C9A7;animation-delay:-9s}
@keyframes aurora{0%{transform:translate(0,0) scale(1,.7)}100%{transform:translate(8%,10%) scale(1.2,1)}}

/* =========================================================
   3. DÜĞMELER
   ========================================================= */
.btn{background:var(--turuncu);color:#fff;font-weight:900;font-size:clamp(18px,2.6vmin + 10px,34px);
  padding:.45em 1.5em;border-radius:999px;box-shadow:0 6px 0 #C94A1C,0 10px 22px rgba(0,0,0,.28);
  transition:transform .08s,box-shadow .08s;letter-spacing:.5px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #C94A1C,0 4px 10px rgba(0,0,0,.25)}
.btn.ikinci{background:var(--turkuaz);box-shadow:0 6px 0 #00957C,0 10px 22px rgba(0,0,0,.25)}
.btn.ikinci:active{box-shadow:0 2px 0 #00957C}
.btn.gri{background:#8FA3BF;box-shadow:0 6px 0 #6B7F9B}
.ikon-btn{width:clamp(44px,6vmin + 18px,64px);height:clamp(44px,6vmin + 18px,64px);border-radius:50%;
  background:rgba(255,255,255,.92);font-size:clamp(20px,3vmin + 8px,32px);display:grid;place-items:center;
  box-shadow:0 4px 0 rgba(0,0,0,.18);flex:none}
.ikon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.hap{background:rgba(255,255,255,.92);border-radius:999px;padding:.3em .9em;font-weight:900;
  font-size:clamp(16px,2vmin + 8px,26px);box-shadow:0 4px 0 rgba(0,0,0,.15);white-space:nowrap}

/* =========================================================
   4. AÇILIŞ EKRANI
   ========================================================= */
#s-acilis{align-items:center;justify-content:center}
.acilis-ic{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:1.6vmin}
.baslik{font-size:clamp(46px,11vmin,120px);font-weight:900;color:#fff;letter-spacing:2px;line-height:1;
  text-shadow:0 4px 0 #4D9FFF,0 8px 0 #1E5F96,0 14px 26px rgba(0,0,0,.35)}
.altbaslik{font-size:clamp(16px,2.6vmin + 6px,30px);font-weight:800;color:#E8F7FF}
.acilis-pitir{width:clamp(110px,26vmin,260px);height:auto;filter:drop-shadow(0 10px 12px rgba(0,0,0,.25))}
.acilis-deniz{position:absolute;left:0;bottom:0;width:100%;height:24%;z-index:1}
.acilis-ayar{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;z-index:3}
.altbilgi{position:absolute;bottom:max(8px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;
  font-size:clamp(11px,1.4vmin + 6px,16px);font-weight:800;color:rgba(255,255,255,.85);z-index:3}

/* =========================================================
   5. HARİTA EKRANI
   ========================================================= */
#s-harita{background:linear-gradient(180deg,#0B2347 0%,#1D4F8C 30%,#2A7AB8 31%,#1E5F96 100%)}
.ust-cubuk{position:relative;z-index:3;display:flex;align-items:center;gap:10px;
  padding:max(10px,env(safe-area-inset-top)) 14px 8px}
.ust-cubuk .ad{flex:1;text-align:center;color:#fff;font-weight:900;font-size:clamp(20px,3.4vmin + 6px,40px);
  text-shadow:0 3px 0 rgba(0,0,0,.25)}
.harita-alan{position:relative;flex:1;min-height:0}
.harita-alan svg.yol-cizgi{position:absolute;inset:0;width:100%;height:100%}
.dugum{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;
  gap:4px;background:none;width:clamp(84px,15vmin + 20px,170px)}
.dugum .ada{width:100%;aspect-ratio:1.5;position:relative;display:grid;place-items:center}
.dugum .ada svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dugum .daire{position:relative;z-index:1;width:52%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  font-size:clamp(22px,4.5vmin + 4px,52px);border:4px solid #fff;box-shadow:0 5px 0 rgba(0,0,0,.2);margin-top:-14%;
  animation:sallan 3s ease-in-out infinite}
.dugum:nth-child(odd) .daire{animation-delay:-1.5s}
@keyframes sallan{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.dugum .etiket{background:#fff;border-radius:12px;padding:2px 10px;font-weight:900;font-size:clamp(12px,1.6vmin + 7px,20px);
  box-shadow:0 3px 0 rgba(0,0,0,.18);white-space:nowrap}
.dugum .yildiz-say{font-weight:900;color:#FFE97A;font-size:clamp(12px,1.4vmin + 7px,18px);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.dugum.kilitli .daire{filter:grayscale(.85) brightness(.85)}
.dugum.kilitli .daire::after{content:'🔒';position:absolute;right:-10%;bottom:-10%;font-size:.55em}
.dugum:active .daire{transform:scale(.94)}

/* =========================================================
   6. MODAL (seviye seçimi, ayarlar, onay)
   ========================================================= */
.modal-arka{position:fixed;inset:0;background:rgba(8,22,45,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal-arka.acik{display:flex;animation:belir .2s}
@keyframes belir{from{opacity:0}to{opacity:1}}
.modal-kutu{background:var(--buz);border-radius:28px;padding:clamp(14px,3vmin,32px);max-width:min(720px,96vw);
  max-height:94vh;overflow:auto;box-shadow:0 12px 0 #9ED3EE,0 20px 50px rgba(0,0,0,.4);text-align:center;
  animation:zipla-gir .3s cubic-bezier(.3,1.6,.6,1)}
@keyframes zipla-gir{from{transform:scale(.7)}to{transform:scale(1)}}
.modal-kutu h2{font-size:clamp(22px,3.6vmin + 6px,40px);font-weight:900;margin-bottom:.4em}
.modal-kutu p{font-size:clamp(15px,2vmin + 7px,24px);font-weight:700;margin-bottom:.8em}
.modal-dugmeler{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.seviye-liste{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.seviye-btn{background:#fff;border-radius:22px;padding:12px 16px;min-width:150px;flex:1;max-width:210px;
  border:4px solid var(--renk,#4D9FFF);box-shadow:0 6px 0 var(--renk,#4D9FFF);display:flex;flex-direction:column;align-items:center;gap:4px}
.seviye-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--renk)}
.seviye-btn .no{font-size:clamp(18px,2.6vmin + 6px,30px);font-weight:900}
.seviye-btn .aralik{font-size:clamp(16px,2.2vmin + 6px,26px);font-weight:900;color:var(--renk)}
.seviye-btn .acik{font-size:clamp(12px,1.4vmin + 7px,17px);font-weight:700;color:#4A5A75}
.seviye-btn .yil{font-size:clamp(18px,2.4vmin + 6px,28px);letter-spacing:2px}
.ayar-satir{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 4px;
  font-size:clamp(17px,2.2vmin + 8px,26px);font-weight:800;border-bottom:2px dashed var(--buz2)}
.anahtar{width:74px;height:40px;border-radius:999px;background:#B8C7D9;position:relative;transition:background .2s;flex:none}
.anahtar::after{content:'';position:absolute;top:4px;left:4px;width:32px;height:32px;border-radius:50%;background:#fff;
  transition:left .2s;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.anahtar.acik{background:var(--turkuaz)}
.anahtar.acik::after{left:38px}

/* =========================================================
   7. OYUN EKRANI
   ========================================================= */
#s-oyun{background:#0B2347}
.oyun-ust{display:flex;align-items:center;gap:10px;padding:max(8px,env(safe-area-inset-top)) 12px 6px;
  background:linear-gradient(180deg,#0B2347,#123566)}
.gorev{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border-radius:999px;
  padding:.25em .9em;min-height:clamp(44px,6vmin + 18px,64px);box-shadow:0 4px 0 #9ED3EE}
#gorevMetin{font-size:clamp(18px,3vmin + 8px,40px);font-weight:900;text-align:center}
#gorevMetin b{color:var(--turuncu);font-size:1.15em}
#btnSoyle{display:none;background:var(--buz2);border-radius:50%;width:1.9em;height:1.9em;font-size:clamp(16px,2vmin + 8px,26px);flex:none}
body.konusma-var #btnSoyle{display:grid;place-items:center}
.ilerleme{display:flex;justify-content:center;gap:clamp(5px,1vmin,10px);padding:4px 0 6px;background:#123566}
.ilerleme i{width:clamp(12px,1.8vmin + 4px,22px);height:clamp(12px,1.8vmin + 4px,22px);border-radius:50%;
  background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.6)}
.ilerleme i.dogru{background:var(--turkuaz);border-color:#fff}
.ilerleme i.yanlis{background:var(--sari);border-color:#fff}
.ilerleme i.simdi{background:#fff;transform:scale(1.2)}
.saha{flex:1;min-height:0;position:relative}
#yolSvg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.oyun-alt{min-height:clamp(54px,9vmin + 20px,110px);background:#EAF6FD;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:6px 12px max(6px,env(safe-area-inset-bottom));flex-wrap:wrap;border-top:4px solid #CDEBFA}

/* SVG içi animasyonlar */
.dalga{animation:dalga 6s linear infinite}
.dalga.d2{animation-duration:9s;animation-direction:reverse}
@keyframes dalga{from{transform:translateX(0)}to{transform:translateX(-80px)}}
.p-nefes{transform-box:fill-box;transform-origin:50% 100%;animation:nefes 2.4s ease-in-out infinite}
@keyframes nefes{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
.p-zipla{transform-box:fill-box;transform-origin:50% 100%}
.p-zipla.kon{animation:kon .32s ease-out}
@keyframes kon{0%{transform:scale(1.2,.78)}60%{transform:scale(.94,1.08)}100%{transform:scale(1,1)}}
.p-gozler{transform-box:fill-box;transform-origin:50% 50%;animation:goz 4.5s infinite}
@keyframes goz{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.p-kanat{transform-box:fill-box;transform-origin:80% 10%}
.selam .p-kanat-sag{transform-origin:20% 10%;animation:selam 1.4s ease-in-out infinite}
@keyframes selam{0%,100%{transform:rotate(0)}50%{transform:rotate(-28deg)}}
.balon{animation:balon .25s cubic-bezier(.3,1.6,.6,1)}
@keyframes balon{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.balon{transform-box:fill-box;transform-origin:50% 100%}
.gecici-etiket{animation:belir .2s}
.parilti{animation:parilti 1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes parilti{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
.ok-yay{animation:belir .25s}
.p-sevin .p-kanat{animation:cirp .25s ease-in-out 3}
.p-sevin .p-kanat-sag{transform-origin:20% 10%}
@keyframes cirp{0%,100%{transform:rotate(0)}50%{transform:rotate(-35deg)}}

/* Bölge 1 — "Hangi buz yolu doğru?" seçenekleri */
.secenek-alan{position:absolute;inset:0;display:none;flex-direction:column;gap:clamp(6px,1.4vmin,16px);
  padding:clamp(8px,1.6vmin,20px) clamp(10px,4vw,80px);background:linear-gradient(180deg,#123566,#2A7AB8)}
.secenek-alan.acik{display:flex}
.secenek{flex:1;min-height:0;background:#fff;border-radius:20px;border:4px solid #CDEBFA;box-shadow:0 5px 0 #9ED3EE;
  display:flex;align-items:center;justify-content:center;padding:2px 6px;transition:transform .1s}
.secenek:active{transform:translateY(3px)}
.secenek svg{width:100%;height:100%;max-height:170px}
.secenek .hata-isaret{display:none}
.secenek.yanlis{border-color:#FF4D8D;background:#FFF0F5;pointer-events:none}
.secenek.yanlis .hata-isaret{display:inline}
.secenek.dogru{border-color:#00C9A7;background:#E6FFF8;box-shadow:0 5px 0 #00957C}
.secenek.goster-dogru{border-color:#00C9A7;animation:parilti-kutu 1s ease-in-out infinite}
@keyframes parilti-kutu{0%,100%{box-shadow:0 5px 0 #9ED3EE}50%{box-shadow:0 0 0 6px #00C9A7}}
/* Alt alan: ipucu ve "Neden?" cevapları */
.ipucu{font-weight:800;font-size:clamp(15px,1.8vmin + 8px,24px);color:#2B4C7E}
.cevap-btn{background:#fff;border:4px solid #A855F7;box-shadow:0 5px 0 #A855F7;border-radius:18px;padding:.4em .9em;
  font-weight:900;font-size:clamp(15px,1.8vmin + 8px,24px)}
.cevap-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #A855F7}
.cevap-btn.dogru{border-color:#00C9A7;box-shadow:0 5px 0 #00957C;background:#E6FFF8}
.cevap-btn.yanlis{border-color:#FF4D8D;box-shadow:0 5px 0 #C9285F;background:#FFF0F5;opacity:.7}
/* Bölge 2 — balık kovası (alt alan) ve sürüklenen balık */
.oyun-alt.kova{background:linear-gradient(180deg,#DDF1FC,#C4E6F8)}
.balik-kart{position:relative;width:clamp(78px,9vmin + 46px,140px);aspect-ratio:1.75;background:none;touch-action:none;
  transition:transform .15s,opacity .3s;filter:drop-shadow(0 4px 0 rgba(0,0,0,.18))}
.balik-kart svg{position:absolute;inset:0;width:100%;height:100%}
.balik-kart span{position:absolute;left:4%;right:36%;top:50%;transform:translateY(-50%);text-align:center;
  font-weight:900;font-size:clamp(20px,2.6vmin + 10px,40px);color:#14213D}
.balik-kart.secili{transform:translateY(-8px) scale(1.08);filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 6px #FFD600) drop-shadow(0 6px 0 rgba(0,0,0,.2))}
.balik-kart.surukle{opacity:.25}
.balik-kart.git{opacity:0;transform:translateX(60px) scale(.6)}
.balik-kart.titre{animation:titre .35s}
@keyframes titre{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.tasinan{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-50%) rotate(-8deg) scale(1.1)}
.ilerleme i.ek{width:clamp(9px,1.2vmin + 3px,16px);height:clamp(9px,1.2vmin + 3px,16px);align-self:center;border-style:dashed}

/* =========================================================
   8. SEVİYE SONU
   ========================================================= */
#s-sonuc{align-items:center;justify-content:center}
.sonuc-kart{position:relative;z-index:2;background:var(--buz);border-radius:32px;padding:clamp(16px,3.5vmin,40px) clamp(20px,5vmin,60px);
  text-align:center;box-shadow:0 12px 0 #9ED3EE,0 24px 50px rgba(0,0,0,.35);max-width:94vw}
.sonuc-kart h2{font-size:clamp(26px,5vmin + 6px,58px);font-weight:900}
.yildizlar{display:flex;gap:2vmin;justify-content:center;margin:1.5vmin 0}
.yildizlar span{font-size:clamp(44px,10vmin,110px);filter:grayscale(1) opacity(.35);transform:scale(.8);transition:all .3s}
.yildizlar span.dolu{filter:none;transform:scale(1);animation:yildiz-pat .45s cubic-bezier(.3,1.8,.6,1)}
@keyframes yildiz-pat{0%{transform:scale(.2) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.sonuc-balik{font-size:clamp(20px,3.4vmin + 6px,38px);font-weight:900;color:var(--turuncu)}
.sonuc-ozet{font-size:clamp(15px,2vmin + 7px,24px);font-weight:700;color:#4A5A75;margin:.6em 0 1em}

/* =========================================================
   9. KOLONİ
   ========================================================= */
#s-koloni{background:linear-gradient(180deg,#0B2347 0%,#3F7FC0 58%,#DCEFFB 58.1%,#F4FBFF 100%)}
.koloni-ic{flex:1;min-height:0;display:flex;gap:2vmin;padding:1vmin 2vmin max(2vmin,env(safe-area-inset-bottom));align-items:stretch}
.koloni-sahne{flex:1.2;min-width:0;position:relative}
.koloni-sahne svg{width:100%;height:100%}
.dukkan{flex:1;min-width:0;background:rgba(255,255,255,.95);border-radius:24px;padding:1.6vmin;overflow:auto;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(100px,15vmin,150px),1fr));gap:1.2vmin;align-content:start;
  box-shadow:0 6px 0 #9ED3EE}
.esya{background:var(--buz);border-radius:18px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;
  border:3px solid var(--buz2);font-weight:900}
.esya .emo{font-size:clamp(28px,5vmin,52px)}
.esya .ad{font-size:clamp(12px,1.4vmin + 6px,17px)}
.esya .fiyat{font-size:clamp(12px,1.4vmin + 6px,17px);color:var(--turuncu)}
.esya.var{border-color:#7FE0C8;background:#EFFFFA}
.esya.yeni{animation:zipla-gir .45s cubic-bezier(.3,1.6,.6,1)}
.esya-btn{margin-top:4px;border-radius:999px;padding:.3em .9em;font-weight:900;font-size:clamp(12px,1.3vmin + 7px,17px);white-space:nowrap}
.esya-btn.al{background:var(--turuncu);color:#fff;box-shadow:0 3px 0 #C94A1C}
.esya-btn.kapali{background:#E3EAF3;color:#8FA3BF;cursor:default}
.esya-btn.giy{background:var(--mavi);color:#fff;box-shadow:0 3px 0 #2F7FE0}
.esya-btn.giyili{background:#fff;color:var(--mavi);border:3px solid var(--mavi)}
.esya-btn.sahip{background:none;color:#00957C}
.esya-btn:active{transform:translateY(2px)}
.kol-bayrak{transform-box:fill-box;transform-origin:0 50%;animation:dalgalan 1.6s ease-in-out infinite}
@keyframes dalgalan{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(6deg) scaleX(.9)}}
.kol-isik{animation:isik 5s ease-in-out infinite alternate}
@keyframes isik{from{opacity:.45}to{opacity:.9}}
.sonuc-not{font-weight:900;font-size:clamp(15px,2vmin + 7px,24px);color:#6B3FC9;margin:-.4em 0 .8em;display:flex;flex-direction:column;gap:4px}
.sonuc-not:empty{display:none}

/* =========================================================
   10. TELEFON DİKEY UYARISI
   ========================================================= */
#dondur{position:fixed;inset:0;z-index:100;background:var(--gece);color:#fff;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;text-align:center;font-weight:900;font-size:24px;padding:30px}
#dondur .tel{font-size:80px;animation:dondur 2s ease-in-out infinite}
@keyframes dondur{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
@media (orientation:portrait) and (max-width:760px){#dondur{display:flex}}
</style>
</head>
<body>
<div id="app">

  <!-- ================= EKRAN 1: AÇILIŞ ================= -->
  <section class="screen gokyuzu" id="s-acilis">
    <div class="aurora"><i></i><i></i><i></i></div>
    <button class="ikon-btn acilis-ayar" data-ayarlar aria-label="Ayarlar">⚙️</button>
    <div class="acilis-ic">
      <svg class="acilis-pitir selam" viewBox="-10 0 120 125" id="acilisPitir" aria-hidden="true"></svg>
      <h1 class="baslik">Buz Yolu</h1>
      <div class="altbaslik">Pıtır ile sayı doğrusunda zıpla!</div>

function sonKelime(n) {

}
function ek(n, tur) {
  const w = sonKelime(n), unl = w.match(/[aeıioöuü]/g), son = unl[unl.length - 1];
  const kalin = 'aıou'.includes(son), sh = w[w.length - 1], unluBit = 'aeıioöuü'.includes(sh), sert = 'fstkçşhp'.includes(sh);
  if (tur === 'abl') return n + "'" + (sert ? 't' : 'd') + (kalin ? 'an' : 'en');

}

function dagit(n) {

/* =========================================================

const Ses = {
  ctx: null, ana: null, ruzgar: null,

  },
  gurultu(sure, frekans, v) {
    if (!kayit.ses || !this.ctx) return;

    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);

    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = frekans; f.Q.value = 0.8;
    const g = c.createGain(); g.gain.value = v;

  },
  boing() { this.ton(220, 0.22, 'sine', 0.35, 560); },
  kon() { this.ton(170, 0.09, 'triangle', 0.3, 90); this.gurultu(0.08, 2500, 0.08); },
  tik() { this.ton(880, 0.05, 'square', 0.06); },
  sip() { this.gurultu(0.4, 1100, 0.35); },
  dogru() { [523, 659, 784].forEach((f, i) => this.ton(f, 0.2, 'triangle', 0.25, null, i * 0.09)); },
  yanlis() { this.ton(320, 0.28, 'sawtooth', 0.1, 180); },
  kasa() { this.ton(1320, 0.08, 'square', 0.1); this.ton(1760, 0.18, 'square', 0.1, null, 0.08); this.gurultu(0.15, 6000, 0.08); },
  fanfar() { [523, 659, 784, 1047].forEach((f, i) => this.ton(f, i === 3 ? 0.5 : 0.16, 'triangle', 0.25, null, i * 0.13)); this.ton(523, 0.6, 'sine', 0.12, null, 0.39); },
  yildiz(i) { this.ton(660 + i * 220, 0.3, 'triangle', 0.25); this.ton(1320 + i * 440, 0.22, 'sine', 0.1, null, 0.05); },

    if (!this.ctx) return;

      if (this.ruzgar) return;
      const c = this.ctx, n = c.sampleRate * 3, b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;

      const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 0.13; lg.gain.value = 250;
      lfo.connect(lg); lg.connect(f.frequency);

      s.connect(f); f.connect(g); g.connect(this.ana); s.start(); lfo.start();

      try { this.ruzgar.s.stop(); this.ruzgar.lfo.stop(); } catch (e) {}
      this.ruzgar = null;
    }
  }
};

/* =========================================================
   H. BUZ YOLU MOTORU — sayı doğrusu çizimi
   cfg = { bas, son, adim, etiket:'hepsi'|'besler'|'onlar'|'uclar'|[değerler], bos:[indeksler], pitir:indeks }
   ========================================================= */
class BuzYolu {
  constructor(svg) {
    this.svg = svg; this.cfg = null; this.pi = 0; this.yon = 1; this.mesgul = false; this.onDokun = null;
    this.gecici = new Set();
    new ResizeObserver(() => { if (this.cfg && Sahne.aktif === 'oyun') this.ciz(); }).observe(svg);
    svg.addEventListener('pointerdown', e => {
      const h = e.target.closest('[data-i]');
      if (h && this.onDokun && !this.mesgul) this.onDokun(+h.dataset.i);
    });
  }
  kur(cfg) {
    this.cfg = cfg;
    this.n = Math.round((cfg.son - cfg.bas) / cfg.adim) + 1;
    this.pi = cfg.pitir ?? 0; this.yon = cfg.yon || 1; this.mesgul = false; this.gecici.clear(); this.izler = [];
    this.ciz();
  }
  deger(i) { return this.cfg.bas + i * this.cfg.adim; }
  etiketli(i) {
    const c = this.cfg, v = this.deger(i), m = c.etiket, uc = i === 0 || i === this.n - 1;
    if (c.bos && c.bos.includes(i)) return false;
    if (this.gecici.has(i)) return true;
    if (c.dolu && c.dolu.includes(i)) return true;
    if (c.gizli && c.gizli.includes(i)) return false;
    if (m === 'hepsi') return true;
    if (m === 'uclar') return uc;
    if (m === 'besler') return uc || v % 5 === 0;
    if (m === 'onlar') return uc || v % 10 === 0;
    if (Array.isArray(m)) return m.includes(v);
    return false;
  }
  ciz() {
    const r = this.svg.getBoundingClientRect();
    if (r.width < 10 || r.height < 10) return;
    const W = r.width, H = r.height, svg = this.svg, n = this.n;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.innerHTML = '';
    // --- yerleşim ölçüleri
    const pad = Math.max(30, W * 0.045);
    const ara = (W - 2 * pad) / ((this.cfg.gorunur || n) - 1);   // gorunur: kamera modunda ekrana sığan buz sayısı
    const denizUst = H * 0.30, karUst = H * 0.70;
    const fw = Math.min(ara * 0.84, 120, H * 0.2);
    const yF = denizUst + (karUst - denizUst) * 0.5;
    const yanH = fw * 0.3;

  const alan = $('#haritaAlan');

  hepsi.forEach((b, i) => { yol += (i ? ' L' : 'M') + b.x + ' ' + b.y; });
  alan.innerHTML = `<svg class="yol-cizgi" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">

    </svg>`;
  const finalAcik = finalAcikMi();
  hepsi.forEach(b => {
    const top = b.seviyeler.reduce((t, _, s) => t + yildizAl(b.id, s + 1), 0);
    const kilitli = b.id === 'final' && !finalAcik;
    const d = document.createElement('button');
    d.className = 'dugum' + (kilitli ? ' kilitli' : '');
    d.style.left = b.x + '%'; d.style.top = b.y + '%';
    d.innerHTML = `<div class="ada">${adaSVG(b.renk)}<div class="daire" style="background:${b.renk}">${b.ikon}</div></div>
      <div class="etiket">${b.ad}</div><div class="yildiz-say">⭐ ${top}/${b.seviyeler.length * 3}</div>`;

    else d.addEventListener('click', () => { Ses.tik(); seviyeSec(b); });
    alan.appendChild(d);
  });
};
// Final: kilitliyse bilgi verir; öğretmen 1,5 sn basılı tutarak açabilir
function finalDugumBagla(d, kilitli) {
  let zaman = null, uzun = false;
  d.addEventListener('pointerdown', () => { uzun = false; zaman = setTimeout(() => { uzun = true; Ses.dogru(); oyunBaslat('final', 1); }, 1500); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => d.addEventListener(t, () => clearTimeout(zaman)));
  d.addEventListener('click', () => {
    if (uzun) return;
    Ses.tik();
    if (!kilitli) { oyunBaslat('final', 1); return; }
    const liste = BOLGELER.map(b => {
      const ok = [1, 2, 3].some(s => yildizAl(b.id, s) > 0);
      return `<div class="ayar-satir"><span>${b.ikon} ${b.ad}</span><span>${ok ? '✅' : '⬜'}</span></div>`;
    }).join('');
    Modal.ac(`<h2>⭐ Kutup Yıldızı</h2><p>Her bölgeden en az 1 yıldız topla, final açılsın!</p>${liste}
      <div class="modal-dugmeler"><button class="btn" onclick="Modal.kapat()">Tamam</button></div>`);
  });
}
function seviyeSec(b) {
  const btn = b.seviyeler.map((s, i) => {
    const y = yildizAl(b.id, i + 1);
    return `<button class="seviye-btn" style="--renk:${b.renk}" onclick="oyunBaslat('${b.id}',${i + 1})">
      <span class="no">Seviye ${i + 1}</span><span class="aralik">${s.aralik}</span><span class="acik">${s.acik}</span>
      <span class="yil">${'★'.repeat(y)}<span style="opacity:.25">${'★'.repeat(3 - y)}</span></span></button>`;
  }).join('');
  Modal.ac(`<h2>${b.ikon} ${b.ad}</h2><div class="seviye-liste">${btn}</div>
    <div class="modal-dugmeler"><button class="btn gri" onclick="Modal.kapat()">Kapat</button></div>`);
}

/* =========================================================
   L. EKRAN: OYUN (Aşama 1 — buz yolu denemesi)
   ========================================================= */
const yolu = new BuzYolu($('#yolSvg'));
let aktif = null;   // { bolge, seviye, cfg }
const GOREV_SAYISI = 8;
function oyunBaslat(bolgeId, seviye) {
  const b = bolgeBul(bolgeId);
  if (!b) return;
  aktif = { bolge: bolgeId, seviye };
  Sahne.git('oyun');
}
function gorevYaz(html, okunacak) {

  $('#btnSoyle').onclick = () => Konus.soyle(okunacak || $('#gorevMetin').textContent);
}
Ekran.oyun = () => {

  if (aktif.bolge === 'final') { requestAnimationFrame(() => FINAL_MOTOR.basla()); return; }
};
/* =========================================================
   L2. TUR YÖNETİMİ — ortak sayaçlar (tüm bölgeler kullanır)
   ========================================================= */
const Tur = {
  gorevler: [], k: 0, durum: [], ilkDogru: 0, balik: 0, zorluk: { uzak: 0, yol: 0 }, tekrarlar: [], kilit: false,
  sifirla(gorevler) { Object.assign(this, { gorevler, ana: gorevler.length, k: 0, durum: [], ilkDogru: 0, balik: 0, zorluk: { uzak: 0, yol: 0 }, tekrarlar: [], kilit: false }); },
  ilerleme() {
    const A = this.ana;
    const d = aralik(0, A - 1).map(i => this.durum[i] || (i === this.k ? 'simdi' : ''));
    const ekler = this.gorevler.slice(A).map((g, j) => (this.durum[A + j] || (A + j === this.k ? 'simdi' : '')) + ' ek');
    $('#ilerleme').innerHTML = [...d.map(c => `<i class="${c}"></i>`), ...ekler.map(c => `<i class="${c}"></i>`)].join('');
  },
  balikEkle(n) { this.balik += n; $$('[data-balik]').forEach(e => e.textContent = kayit.balik + this.balik); },
  // Bir görev bitti: deneme 1 → 2 🐟, deneme 2 → 1 🐟, çözülemedi → 0
  sonuc(deneme) {
    const ana = this.k < this.ana;
    if (deneme === 1 && ana) this.ilkDogru++;
    this.durum[this.k] = deneme === 1 ? 'dogru' : 'yanlis';
    if (deneme <= 2) this.balikEkle(ana ? (deneme === 1 ? 2 : 1) : 1);
    this.k++; this.ilerleme();
  },
  yildiz() { const o = this.ilkDogru / this.ana; return o >= 0.9 ? 3 : o >= 0.7 ? 2 : 1; }
};
// Son seviyelerde çıkan hedefler daha az seçilsin (oturum içi)
const sonHedefler = {};
function hedefSec(bolge, adaylar, haric = []) {
  const eski = sonHedefler[bolge] || [];
  const havuz = adaylar.filter(v => !haric.includes(v));
  const agirlik = havuz.map(v => eski.includes(v) ? 1 : 2);
  let r = Math.random() * agirlik.reduce((a, b) => a + b, 0);
  for (let i = 0; i < havuz.length; i++) { r -= agirlik[i]; if (r < 0) return havuz[i]; }
  return havuz[havuz.length - 1];
}

/* =========================================================
   L3. BÖLGE 1 — BUZ CETVELİ
   Görev tipleri: 'bul' (sayının buzunu bul), 'yol' (hangi buz yolu doğru?), 'neden' (seviye sonu sorusu)
   ========================================================= */
const B1 = {
  seviye: 1, cfg: null,
  YOL_SIRASI: [2, 5],          // 8 görevden 3. ve 6.'sı "Hangi buz yolu doğru?"
  oturum: 0,
  // Bekleme bittiğinde hâlâ aynı turdaysak sıradaki göreve geç
  devam(o) { if (o !== this.oturum || Sahne.aktif !== 'oyun') return; Tur.kilit = false; this.sonraki(); },
  basla(seviye) {
    this.oturum++; this._neden = false;
    this.seviye = seviye;
    this.cfg = BOLGELER[0].seviyeler[seviye - 1].yol();
    this.cfg.gizli = []; this.cfg.pitir = 0;
    const n = (this.cfg.son - this.cfg.bas) / this.cfg.adim + 1;
    // hedef adayları: uçlar hariç; Seviye 2'de 5'in katı olmayanlar öncelikli
    let adaylar = aralik(1, n - 2);
    if (seviye === 2) adaylar = adaylar.filter(i => i % 5 !== 0);
    const secilen = [];
    const gorevler = aralik(0, GOREV_SAYISI - 1).map(k => {
      if (this.YOL_SIRASI.includes(k)) return { tip: 'yol' };
      const h = hedefSec('b1-' + seviye, adaylar, secilen); secilen.push(h);
      return { tip: 'bul', hedef: h };
    });
    // Pıtır ilk görevde hedefin üstünde durmasın
    if (gorevler[0].hedef === 0) this.cfg.pitir = n - 1;
    sonHedefler['b1-' + seviye] = secilen;
    Tur.sifirla(gorevler);
    $('#oyunAlt').innerHTML = `<span class="ipucu">${seviye === 1 ? '💡 Numarası olmayan buzu bul!' : '💡 Numaralı buzdan başla, sayarak zıpla!'}</span>`;
    yolu.kur(this.cfg);
    this.sonraki();
  },
  sonraki() {
    Tur.ilerleme(); yolu.temizle();
    const g = Tur.gorevler[Tur.k];
    if (!g) {
      if (!this._neden) { this._neden = true; return this.neden(); }
      this._neden = false; return this.bitir();
    }
    if (g.tip === 'bul') this.bul(g); else this.yol(g);
  },
  /* ---------- 'bul' görevi ---------- */
  bul(g) {
    const o = this.oturum;
    $('#secenekAlan').classList.remove('acik');
    // Pıtır hedefin üstündeyse yer değiştirmesin diye hedefi gizle, Pıtır'ı uzak bir buza taşı
    if (yolu.pi === g.hedef) { yolu.pi = g.hedef > yolu.n / 2 ? 0 : yolu.n - 1; yolu.pitirYerlestir(yolu.xs[yolu.pi], yolu.yF); }
    this.cfg.gizli = this.seviye === 1 ? [g.hedef] : [];
    yolu.etiketleriYenile();
    const v = yolu.deger(g.hedef);
    let deneme = 1;
    gorevYaz(`<b>${ek(v, 'dat')}</b> zıpla!`, `${ek(v, 'dat')} zıpla!`);
    yolu.onDokun = async i => {
      if (Tur.kilit) return;
      Tur.kilit = true;
      yolu.okKat.innerHTML = '';
      await new Promise(r => yolu.zipla(i, r));
      if (i === g.hedef) {
        Ses.dogru(); yolu.vurgula(null);
        yolu.geciciGoster(i, 1400);
        await yolu.balikVer(i);
        yolu.balon(i, deneme === 1 ? 'Hamm! 🐟' : 'Buldun! 🐟', 1000);
        Tur.sonuc(deneme);
        await bekle(900);
        this.devam(o);
        return;
      }
      // yanlış buz
      Ses.yanlis(); Ses.sip();
      const w = yolu.deger(i), fark = Math.abs(g.hedef - i), yon = g.hedef > i ? 'sağında' : 'solunda';
      if (fark >= 3) Tur.zorluk.uzak++;
      yolu.balon(i, `Bu buz ${w}`, 2400);
      yolu.geciciGoster(i, 3000);
      if (deneme === 1) {
        deneme = 2;
        gorevYaz(`<b>${v}</b>, ${ek(w, 'abl')} <b>${fark} adım ${yon === 'sağında' ? 'sağda' : 'solda'}</b>. Tekrar dene!`,
          `${v}, ${ek(w, 'abl')} ${fark} adım ${yon === 'sağında' ? 'sağda' : 'solda'}. Tekrar dene!`);
        await yolu.adimOklari(i, g.hedef);
        yolu.vurgula(g.hedef);
        Tur.kilit = false;
      } else {
        // ikinci yanlış: doğru buzu göster ve birlikte zıpla, balık yok; sonda bir kez daha sorulacak
        gorevYaz(`İşte <b>${v}</b>! Birlikte zıplayalım.`);
        await yolu.adimOklari(i, g.hedef);
        await bekle(400);
        await new Promise(r => yolu.zipla(g.hedef, r));
        yolu.geciciGoster(g.hedef, 1400);
        if (Tur.k < Tur.ana && Tur.tekrarlar.length < 2) { Tur.tekrarlar.push(g.hedef); Tur.gorevler.push({ ...g }); }
        Tur.sonuc(3);
        await bekle(1200);
        this.devam(o);
      }
    };
  },
  /* ---------- 'yol' görevi: Hangi buz yolu doğru? ---------- */
  yol() {
    const o = this.oturum;
    yolu.onDokun = null;
    const s = this.seviye;
    const adim = s === 3 ? 5 : 1, bas = s === 2 ? rnd(0, 14) : 0, N = 6;
    const dogru = aralik(0, N - 1).map(k => bas + k * adim);
    const esit = aralik(0, N - 1).map(k => k / (N - 1));
    const tipler = karistir(['aralik', 'sira', 'atlama']).slice(0, 2);
    const secenekler = [{ dogru: true, et: dogru, xs: esit }];
    tipler.forEach(t => {
      const j = rnd(1, N - 3);
      if (t === 'aralik') {
        const bosluk = aralik(0, N - 2).map(k => k === j ? 2.2 : 1), top = bosluk.reduce((a, b) => a + b);
        let acc = 0; const xs = [0, ...bosluk.map(b => (acc += b) / top)];
        secenekler.push({ tip: t, et: dogru, xs, hata: { tur: 'bosluk', a: j, b: j + 1 }, mesaj: 'Aralıklar eşit değil! Bu boşluk daha büyük.' });
      } else if (t === 'sira') {
        const et = [...dogru];[et[j], et[j + 1]] = [et[j + 1], et[j]];
        secenekler.push({ tip: t, et, xs: esit, hata: { tur: 'etiket', a: j, b: j + 1 }, mesaj: `Sıra karışmış! ${ek(dogru[j], 'nom')}, ${ek(dogru[j + 1], 'abl')} önce gelir.` });
      } else {
        const et = [...dogru.slice(0, j + 1), ...dogru.slice(j + 2), bas + N * adim];
        secenekler.push({ tip: t, et, xs: esit, hata: { tur: 'bosluk', a: j, b: j + 1 }, mesaj: `Bir sayı atlanmış! ${dogru[j + 1]} nerede?` });
      }
    });
    karistir(secenekler);
    gorevYaz('Hangi <b>buz yolu</b> doğru?', 'Hangi buz yolu doğru?');
    const alan = $('#secenekAlan');
    alan.innerHTML = secenekler.map((o, k) => `<button class="secenek" data-k="${k}" aria-label="Seçenek ${k + 1}">${miniYolSVG(o)}</button>`).join('');
    alan.classList.add('acik');
    let deneme = 1;
    alan.querySelectorAll('.secenek').forEach(b => b.addEventListener('click', async () => {
      if (Tur.kilit) return;
      const sec = secenekler[+b.dataset.k];
      if (sec.dogru) {
        Tur.kilit = true; b.classList.add('dogru'); Ses.dogru();
        gorevYaz(deneme === 1 ? '✓ Doğru! <b>Sırayla gider, aralıklar eşit.</b>' : '✓ Doğru buldun!');
        Tur.balikEkle(0); Tur.sonuc(deneme);
        await bekle(1500); alan.classList.remove('acik'); this.devam(o);
        return;
      }
      b.classList.add('yanlis'); Ses.yanlis(); Tur.zorluk.yol++;
      gorevYaz(`✗ ${sec.mesaj}`, sec.mesaj);
      if (deneme === 1) { deneme = 2; return; }
      Tur.kilit = true;
      alan.querySelector(`.secenek[data-k="${secenekler.findIndex(x => x.dogru)}"]`).classList.add('goster-dogru');
      Tur.sonuc(3);
      await bekle(2600); alan.classList.remove('acik'); this.devam(o);
    }));
  },
  /* ---------- 'neden' sorusu (yıldızı etkilemez, doğruysa +1 🐟) ---------- */
  neden() {
    const o = this.oturum;
    $('#secenekAlan').classList.remove('acik');
    const n = yolu.n, i = rnd(1, n - 2), v = yolu.deger(i), a = this.cfg.adim;
    this.cfg.gizli = []; yolu.gecici.clear();
    const eskiEt = this.cfg.etiket; this.cfg.etiket = 'hepsi'; yolu.etiketleriYenile(); this.cfg.etiket = eskiEt;
    yolu.vurgula(i);
    $('#ilerleme').innerHTML = '<i class="simdi"></i>';
    yolu.zipla(i);
    gorevYaz(`Neden <b>${v}</b> burada?`, `Neden ${v} burada?`);
    const dogruM = `${ek(v - a, 'abl')} sonra, ${ek(v + a, 'abl')} önce gelir.`;
    const sec = karistir([{ m: dogruM, d: true }, { m: 'En büyük sayı odur.' }, { m: 'Buzlar karışık dizilir.' }]);
    yolu.onDokun = null;
    $('#oyunAlt').innerHTML = sec.map((s, k) => `<button class="cevap-btn" data-k="${k}">${s.m}</button>`).join('');
    $('#oyunAlt').querySelectorAll('.cevap-btn').forEach(b => b.addEventListener('click', async () => {
      if (Tur.kilit) return; Tur.kilit = true;
      const s = sec[+b.dataset.k];
      if (s.d) { b.classList.add('dogru'); Ses.dogru(); Tur.balikEkle(1); gorevYaz('✓ Evet! Sayılar <b>sırayla</b> dizilir.'); }
      else {
        b.classList.add('yanlis'); Ses.yanlis();
        $('#oyunAlt').querySelectorAll('.cevap-btn')[sec.findIndex(x => x.d)].classList.add('dogru');
        gorevYaz(`Sayılar sırayla dizilir: <b>${v - a}, ${v}, ${v + a}</b>`);
      }
      await bekle(2200); this.devam(o);
    }));
  },
  bitir() {
    yolu.onDokun = null;
    let ozet = 'Harika! Hiç zorlanmadın. 🐧';
    if (Tur.zorluk.yol > 0 && Tur.zorluk.yol >= Tur.zorluk.uzak) ozet = 'Buz yolunun kuralı: 0’dan başlar, sayılar sırayla gider, aralıklar eşittir.';
    else if (Tur.zorluk.uzak > 0) ozet = 'Uzaktaki sayılarda zorlandın. En yakın numaralı buzdan sayarak zıpla!';
    else if (Tur.ilkDogru < Tur.ana) ozet = 'Çok iyi! Birkaç buzda ikinci denemede buldun.';
    seviyeBitti({ yildiz: Tur.yildiz(), balik: Tur.balik, ozet });
  }
};
MOTORLAR.push(B1);
// "Hangi buz yolu doğru?" için küçük sayı doğrusu (viewBox 600×110)
function miniYolSVG(o) {
  const L = 40, R = 560, yB = 16, yC = 46, yE = 66;
  const xs = o.xs.map(f => L + f * (R - L));
  let s = `<svg viewBox="0 0 600 82" preserveAspectRatio="xMidYMid meet" aria-hidden="true">`;
  // hata işareti (yanlış seçilince görünür)
  if (o.hata) {
    const h = o.hata;
    if (h.tur === 'bosluk') s += `<rect class="hata-isaret" x="${xs[h.a] + 4}" y="2" width="${xs[h.b] - xs[h.a] - 8}" height="78" rx="12" fill="rgba(255,77,141,.15)" stroke="#FF4D8D" stroke-width="3" stroke-dasharray="6 4"/>`;
    else s += `<rect class="hata-isaret" x="${xs[h.a] - 26}" y="${yE - 14}" width="${xs[h.b] - xs[h.a] + 52}" height="32" rx="10" fill="rgba(255,77,141,.18)" stroke="#FF4D8D" stroke-width="3"/>`;
  }
  xs.forEach(x => {
    s += `<rect x="${x - 22}" y="${yB}" width="44" height="9" rx="5" fill="#9ED3EE"/><ellipse cx="${x}" cy="${yB}" rx="22" ry="7" fill="#F4FBFF" stroke="#9ED3EE" stroke-width="2"/>`;
  });
  s += `<line x1="${L - 25}" y1="${yC}" x2="${R + 25}" y2="${yC}" stroke="#14213D" stroke-width="3" stroke-linecap="round"/>`;
  s += `<path d="M${R + 27} ${yC} l-11 -7 v14Z" fill="#14213D"/>`;
  if (o.et[0] > 0) s += `<path d="M${L - 27} ${yC} l11 -7 v14Z" fill="#14213D"/>`;
  xs.forEach((x, k) => {
    s += `<line x1="${x}" y1="${yC - 8}" x2="${x}" y2="${yC + 8}" stroke="#14213D" stroke-width="3" stroke-linecap="round"/>`;
    s += `<text x="${x}" y="${yE + 10}" text-anchor="middle" font-size="28" font-weight="900" fill="#14213D" font-family="Nunito,system-ui,sans-serif">${o.et[k]}</text>`;
  });
  return s + '</svg>';
}

/* =========================================================
   L4. BÖLGE 2 — KAYIP BALIKLAR
   Boş buzlara (?) sayılı balıkları taşı: sürükle-bırak VEYA önce balığa sonra buza dokun.
   Seviye 1: 0–20, 2 boşluk · Seviye 2: onluk parça, 3 boşluk · Seviye 3: onluk parça, 4 boşluk + şaşırtmaca balık
   ========================================================= */
const BALIK_RENK = ['#FF9F1C', '#FFD600', '#FF8FAB', '#7FE0C8', '#9DC4FF'];
function balikKartSVG(renk) {
  return `<svg viewBox="0 0 140 80" aria-hidden="true">
    <path d="M100 40 L136 12 Q130 40 136 68Z" fill="${renk}" stroke="#14213D" stroke-width="4" stroke-linejoin="round"/>
    <path d="M6 40 Q30 4 78 8 Q108 14 108 40 Q108 66 78 72 Q30 76 6 40Z" fill="${renk}" stroke="#14213D" stroke-width="4"/>
    <path d="M50 10 Q62 -2 76 9" fill="${renk}" stroke="#14213D" stroke-width="4"/>
    <ellipse cx="44" cy="40" rx="30" ry="21" fill="#fff" opacity=".85"/>
    <circle cx="97" cy="30" r="4" fill="#14213D"/><circle cx="98.2" cy="28.8" r="1.4" fill="#fff"/>
  </svg>`;
}
const B2 = {
  seviye: 1, oturum: 0,
  devam(o) { if (o !== this.oturum || Sahne.aktif !== 'oyun') return; Tur.kilit = false; this.sonraki(); },
  // Tek bir buz yolu görevi üret
  gorevUret(seviye, onlukNo) {
    let bas = 0, son = 20, kac = 2, bitisikOlur = false;
    if (seviye > 1) { bas = onlukNo * 10; son = bas + 10; kac = seviye === 2 ? 3 : 4; bitisikOlur = true; }
    const n = (son - bas) + 1;
    let bos;
    for (let t = 0; t < 50; t++) {
      bos = rastgeleSec(aralik(1, n - 2), kac);
      const bitisik = bos.filter((b, k) => k && b - bos[k - 1] === 1).length;
      if (!bitisikOlur ? bitisik === 0 : bitisik <= (seviye === 2 ? 1 : 2)) break;
    }
    const degerler = bos.map(i => bas + i);
    let sahte = null;
    if (seviye === 3) {
      // şaşırtmaca: önce ters rakamlı sayı (47 → 74), olmazsa yolun dışında yakın bir sayı
      const ters = karistir(degerler.map(v => +String(v).split('').reverse().join('')).filter(v => v !== 0 && (v < bas || v > son) && v <= 100 && String(v).length === 2));
      sahte = ters.length ? ters[0] : ((Math.random() < .5 && bas > 10) || son === 100 ? bas - rnd(1, 3) : son + rnd(1, 3));
    }
    return { bas, son, bos, degerler, sahte };
  },
  basla(seviye) {
    this.oturum++;
    this.seviye = seviye;
    const onluklar = karistir(aralik(1, 9));
    const gorevler = aralik(0, GOREV_SAYISI - 1).map(k => this.gorevUret(seviye, onluklar[k % 9]));
    Tur.sifirla(gorevler);
    $('#oyunAlt').classList.add('kova');
    this.sonraki();
  },
  sonraki() {
    Tur.ilerleme();
    const g = Tur.gorevler[Tur.k];
    if (!g) return this.bitir();
    this.gorev(g);
  },
  gorev(g) {
    const o = this.oturum;
    this.g = g; this.yanlis = 0; this.secili = null; this.balikYanlis = {}; this.yardimI = null;
    const cfg = { bas: g.bas, son: g.son, adim: 1, etiket: 'hepsi', bos: [...g.bos], dolu: [], pitir: 0 };
    yolu.kur(cfg); yolu.temizle();
    const kac = g.bos.length;
    gorevYaz(`<b>${kac} balığı</b> boş buzlara taşı!`, `${kac} balığı boş buzlara taşı!`);
    // kovadaki balıklar (karışık)
    const kartlar = karistir([...g.degerler.map(v => ({ v })), ...(g.sahte != null ? [{ v: g.sahte, sahte: true }] : [])]);
    const alt = $('#oyunAlt');
    alt.innerHTML = kartlar.map((k, j) => `<button class="balik-kart" data-v="${k.v}" aria-label="Balık ${k.v}">${balikKartSVG(BALIK_RENK[j % BALIK_RENK.length])}<span>${k.v}</span></button>`).join('');
    alt.querySelectorAll('.balik-kart').forEach(b => this.kartBagla(b, o));
    // önce balığa sonra buza dokunma
    yolu.onDokun = i => { if (this.secili != null) this.dene(+this.secili.dataset.v, i, this.secili, o); };
  },
  // Sürükle-bırak + dokun-seç
  kartBagla(kart, o) {
    let bas = null, kopya = null;
    kart.addEventListener('pointerdown', e => {
      if (Tur.kilit) return;
      bas = { x: e.clientX, y: e.clientY }; kart.setPointerCapture(e.pointerId);
    });
    kart.addEventListener('pointermove', e => {
      if (!bas) return;
      if (!kopya && Math.hypot(e.clientX - bas.x, e.clientY - bas.y) > 8) {
        kopya = kart.cloneNode(true); kopya.classList.remove('secili'); kopya.classList.add('tasinan');
        kopya.style.width = kart.offsetWidth + 'px'; document.body.appendChild(kopya);
        kart.classList.add('surukle'); this.sec(null);
      }
      if (kopya) {
        kopya.style.left = e.clientX + 'px'; kopya.style.top = e.clientY + 'px';
        const i = yolu.indeksBul(e.clientX, e.clientY);
        yolu.vurgula(i >= 0 && yolu.cfg.bos.includes(i) ? i : this.yardimI ?? null);
      }
    });
    const birak = e => {
      if (!bas) return;
      const surukledi = !!kopya;
      if (kopya) { kopya.remove(); kopya = null; kart.classList.remove('surukle'); yolu.vurgula(this.yardimI ?? null); }
      bas = null;
      if (surukledi) {
        const i = yolu.indeksBul(e.clientX, e.clientY);
        if (i >= 0) this.dene(+kart.dataset.v, i, kart, o);
      } else { Ses.tik(); this.sec(this.secili === kart ? null : kart); }
    };
    kart.addEventListener('pointerup', birak);
    kart.addEventListener('pointercancel', () => { if (kopya) { kopya.remove(); kopya = null; kart.classList.remove('surukle'); } bas = null; });
  },
  sec(kart) {
    if (this.secili) this.secili.classList.remove('secili');
    this.secili = kart;
    if (kart) kart.classList.add('secili');
  },
  async dene(v, i, kart, o) {
    if (Tur.kilit || o !== this.oturum) return;
    const g = this.g, cfg = yolu.cfg;
    this.sec(null);
    // numaralı buza bırakıldı: ceza yok, yönlendir
    if (!cfg.bos.includes(i)) {
      Ses.tik(); kart.classList.add('titre'); setTimeout(() => kart.classList.remove('titre'), 400);
      gorevYaz('Bu buzun numarası var. <b>? olan</b> buza taşı!');
      return;
    }
    const dogruV = yolu.deger(i);
    if (v === dogruV) {
      Tur.kilit = true;
      Ses.dogru(); kart.classList.add('git'); setTimeout(() => kart.remove(), 300);
      cfg.bos = cfg.bos.filter(x => x !== i); cfg.dolu.push(i); yolu.etiketCiz(i);
      yolu.okKat.innerHTML = ''; this.yardimI = null; yolu.vurgula(null);
      await new Promise(r => yolu.zipla(i, r));
      if (o !== this.oturum) return;
      if (cfg.bos.length) {
        gorevYaz(`✓ <b>${v}</b> yerini buldu! Kalan: <b>${cfg.bos.length}</b>`);
        Tur.kilit = false; return;
      }
      // hepsi yerleşti
      const sahteKart = $('#oyunAlt .balik-kart');
      if (sahteKart) { sahteKart.classList.add('git'); gorevYaz(`Bitti! <b>${sahteKart.dataset.v}</b> bu yolda yoktu. 👋`); }
      else gorevYaz('Bitti! Hepsi yerinde. 🎉');
      await yolu.balikVer(i);
      yolu.balon(i, this.yanlis === 0 ? 'Hamm! 🐟' : 'Buldun! 🐟', 1000);
      const deneme = this.yanlis === 0 ? 1 : this.yanlis <= 2 ? 2 : 3;
      if (deneme > 1 && Tur.k < Tur.ana && Tur.tekrarlar.length < 2) {
        // benzer bir yol sonda bir kez daha
        Tur.tekrarlar.push(g.bas);
        Tur.gorevler.push({ ...this.gorevUret(this.seviye, g.bas / 10), tip: 'balik', seviye: this.seviye });
      }
      Tur.sonuc(deneme);
      await bekle(1300);
      return this.devam(o);
    }
    // yanlış bırakma
    this.yanlis++; Ses.yanlis();
    kart.classList.add('titre'); setTimeout(() => kart.classList.remove('titre'), 400);
    const sahte = g.sahte === v;
    if (sahte) {
      Tur.zorluk.sahte = (Tur.zorluk.sahte || 0) + 1;
      gorevYaz(`<b>${v}</b> bu yolda yok! Yol <b>${g.bas}</b> ile <b>${g.son}</b> arasında.`, `${v} bu yolda yok! Yol ${g.bas} ile ${g.son} arasında.`);
      yolu.okKat.innerHTML = '';
      return;
    }
    Tur.zorluk.yon = (Tur.zorluk.yon || 0) + 1;
    const yon = v > dogruV ? 1 : -1;
    gorevYaz(`<b>${v}</b> buraya gelmez. ${v} daha <b>${yon > 0 ? 'sağda' : 'solda'}</b>!`, `${v} buraya gelmez. ${v} daha ${yon > 0 ? 'sağda' : 'solda'}!`);
    yolu.yonOku(i, yon, v);
    // aynı balık ikinci kez yanlışsa yerini parlat
    this.balikYanlis[v] = (this.balikYanlis[v] || 0) + 1;
    if (this.balikYanlis[v] >= 2) { this.yardimI = v - g.bas; yolu.vurgula(this.yardimI); }
  },
  bitir() {
    yolu.onDokun = null;
    $('#oyunAlt').classList.remove('kova');
    let ozet = 'Harika! Bütün balıkları ilk seferde yerleştirdin. 🐧';
    if ((Tur.zorluk.sahte || 0) > 0) ozet = 'Şaşırtmaca balıklara dikkat! Önce yolun hangi sayılar arasında olduğuna bak.';
    else if ((Tur.zorluk.yon || 0) > 0) ozet = 'Unutma: sayılar sağa gittikçe büyür, sola gittikçe küçülür.';
    seviyeBitti({ yildiz: Tur.yildiz(), balik: Tur.balik, ozet });
  }
};
MOTORLAR.push(B2);

/* =========================================================
   L5. BÖLGE 3 — ZIP ZIP PITIR (ritmik sayma, MAT.2.1.4)
   Her görev bir "koşu": Pıtır kuralı 2 zıplamayla gösterir, çocuk sonraki 3 inişi seçer.
   Uzun yollarda (0–30, 0–40, 0–100) kamera Pıtır'ı izler; ayak izleri örüntüyü oluşturur.
   ========================================================= */
const KURALLAR = {   // adım → { dünya sonu, başlangıç adayları }
  '2': { son: 20, bas: [0, 2, 4, 6, 8, 10] },
  '3': { son: 30, bas: [0, 3, 6, 9, 12, 15] },
  '4': { son: 40, bas: [0, 4, 8, 12, 16, 20] },
  '5': { son: 100, bas: aralik(0, 15).map(k => k * 5) },
  '10': { son: 100, bas: [0, 10, 20, 30, 40, 50] },
  '-2': { son: 20, bas: [10, 12, 14, 16, 18, 20] },
  '-5': { son: 100, bas: aralik(5, 20).map(k => k * 5) },
  '-10': { son: 100, bas: [50, 60, 70, 80, 90, 100] }
};
const B3_PLAN = {
  1: [2, 2, 2, 2, 10, 10, 10, 10],
  2: [3, 3, 3, 3, 5, 5, 5, 5],
  3: [4, 4, 4, -2, -10, -2, -5, -10]
};
const kuralAdi = k => `${dagit(Math.abs(k))} ${k > 0 ? 'ileri' : 'geri'}`;
const B3 = {
  seviye: 1, oturum: 0, bekleyen: null,
  basla(seviye) {
    this.oturum++; this._kural = false;
    this.seviye = seviye;
    const kullanilan = {};
    const gorevler = B3_PLAN[seviye].map(k => this.kosuUret(k, kullanilan));
    Tur.sifirla(gorevler); Tur.zorluk = {};
    $('#oyunAlt').innerHTML = `<span class="ipucu">💡 Pıtır hep aynı sayıda buz atlar. Buzları sayarak bul!</span>`;
    this.sonraki();
  },
  kosuUret(k, kullanilan = {}) {
    const K = KURALLAR[k], adaylar = K.bas.filter(b => !(kullanilan[k] || []).includes(b));
    const bas = (adaylar.length ? adaylar : K.bas)[rnd(0, (adaylar.length ? adaylar : K.bas).length - 1)];
    (kullanilan[k] = kullanilan[k] || []).push(bas);
    return { k, bas, son: K.son };
  },
  sonraki() {
    Tur.ilerleme();
    const g = Tur.gorevler[Tur.k];
    if (!g) {
      if (!this._kural) { this._kural = true; return this.kuralSorusu(); }
      return this.bitir();
    }
    this.kosu(g);
  },
  // Dokunuşu bekleyen söz
  dokunusBekle() { return new Promise(r => { this.bekleyen = r; }); },
  zipla(i) { return new Promise(r => yolu.zipla(i, r)); },
  hazirla(g) {
    yolu.kameraOran = g.k > 0 ? 0.3 : 0.7;
    yolu.kur({ bas: 0, son: g.son, adim: 1, etiket: 'besler', dolu: [g.bas], gorunur: 21, pitir: g.bas, yon: g.k > 0 ? 1 : -1 });
    yolu.temizle();
    yolu.onDokun = i => { if (this.bekleyen) { const r = this.bekleyen; this.bekleyen = null; r(i); } };
  },
  async gosterZipla(a, b, metin) {
    await this.zipla(b);
    yolu.izEkle(a, b, metin); yolu.cfg.dolu.push(b); yolu.etiketCiz(b);
  },
  async kosu(g) {
    const o = this.oturum, gecerli = () => o === this.oturum && Sahne.aktif === 'oyun';
    Tur.kilit = true;
    this.hazirla(g);
    const ad = kuralAdi(g.k), isaret = (g.k > 0 ? '+' : '−') + Math.abs(g.k);
    gorevYaz(`Pıtır <b>${ad}</b> zıplıyor. İzle!`, `Pıtır ${ad} zıplıyor. İzle!`);
    await bekle(700);
    let cur = g.bas;
    for (let t = 0; t < 2; t++) {           // kuralı göster
      if (!gecerli()) return;
      await this.gosterZipla(cur, cur + g.k, isaret); cur += g.k;
      await bekle(350);
    }
    let yanlis = 0;
    for (let t = 0; t < 3; t++) {           // sıra çocukta
      if (!gecerli()) return;
      const hedef = cur + g.k;
      gorevYaz(`<b>${ad}</b> · Sonra hangi buz? (${t + 1}/3)`, `${ad}. Sonra hangi buz?`);
      Tur.kilit = false;
      const i = await this.dokunusBekle();
      if (!gecerli()) return;
      Tur.kilit = true;
      if (i === hedef) {
        Ses.dogru(); yolu.okKat.innerHTML = '';
        await this.gosterZipla(cur, hedef, isaret); cur = hedef;
        yolu.balon(hedef, String(hedef), 700);
        await bekle(250);
        continue;
      }
      // yanlış: tıklanan buzu göster, Pıtır adımları sayarak doğru buza zıplar
      yanlis++; Ses.yanlis();
      Tur.zorluk[ad] = (Tur.zorluk[ad] || 0) + 1;
      yolu.geciciGoster(i, 2200);
      gorevYaz(`O buz <b>${i}</b>. Pıtır hep <b>${Math.abs(g.k)} buz</b> atlar. Birlikte sayalım!`,
        `O buz ${i}. Pıtır hep ${Math.abs(g.k)} buz atlar. Birlikte sayalım!`);
      await yolu.adimOklari(cur, hedef, true);
      if (!gecerli()) return;
      await bekle(300);
      await this.gosterZipla(cur, hedef, isaret); cur = hedef;
      yolu.okKat.innerHTML = '';
      await bekle(500);
    }
    if (!gecerli()) return;
    // koşu bitti: ödül
    await yolu.balikVer(cur);
    yolu.balon(cur, yanlis === 0 ? 'Hamm! 🐟' : 'Aferin! 🐟', 900);
    const deneme = yanlis === 0 ? 1 : yanlis === 1 ? 2 : 3;
    if (deneme > 1 && Tur.k < Tur.ana && Tur.tekrarlar.length < 2) { Tur.tekrarlar.push(g.k); Tur.gorevler.push({ ...this.kosuUret(g.k), tip: 'kosu' }); }
    Tur.sonuc(deneme);
    await bekle(1100);
    if (!gecerli()) return;
    Tur.kilit = false; this.sonraki();
  },
  /* ---------- Kural neydi? (yıldızı etkilemez, doğruysa +1 🐟) ---------- */
  async kuralSorusu() {
    const o = this.oturum, gecerli = () => o === this.oturum && Sahne.aktif === 'oyun';
    const kurallar = [...new Set(B3_PLAN[this.seviye])];
    const k = kurallar[rnd(0, kurallar.length - 1)];
    const K = KURALLAR[k];
    // 4 zıplama sığacak bir başlangıç
    const bas = karistir(K.bas.filter(b => b + 4 * k >= 0 && b + 4 * k <= K.son))[0] ?? K.bas[0];
    const g = { k, bas, son: K.son };
    $('#ilerleme').innerHTML = '<i class="simdi"></i>';
    Tur.kilit = true;
    this.hazirla(g); yolu.onDokun = null;
    gorevYaz('Pıtır’ı izle: <b>Nasıl zıplıyor?</b>', 'Pıtırı izle. Nasıl zıplıyor?');
    $('#oyunAlt').innerHTML = '';
    await bekle(600);
    let cur = bas;
    for (let t = 0; t < 4; t++) { if (!gecerli()) return; await this.gosterZipla(cur, cur + k, '?'); cur += k; await bekle(300); }
    if (!gecerli()) return;
    // çeldiriciler: aynı adım ters yön + farklı adım aynı yön
    const buyuklukler = [2, 3, 4, 5, 10].filter(m => m !== Math.abs(k));
    const farkli = buyuklukler[rnd(0, buyuklukler.length - 1)] * Math.sign(k);
    const sec = karistir([{ k, d: true }, { k: -k }, { k: farkli }]);
    gorevYaz('Pıtır nasıl zıpladı?', 'Pıtır nasıl zıpladı?');
    $('#oyunAlt').innerHTML = sec.map((s, j) => `<button class="cevap-btn" data-j="${j}">${s.k > 0 ? '➡️' : '⬅️'} ${kuralAdi(s.k)}</button>`).join('');
    Tur.kilit = false;
    $('#oyunAlt').querySelectorAll('.cevap-btn').forEach(b => b.addEventListener('click', async () => {
      if (Tur.kilit) return; Tur.kilit = true;
      const s = sec[+b.dataset.j];
      // izlerin üstündeki "?" yerine kuralı yaz
      yolu.izler.forEach(z => z.metin = (k > 0 ? '+' : '−') + Math.abs(k)); yolu.izKat.innerHTML = ''; yolu.izler.forEach(z => yolu.izCiz(z));
      if (s.d) { b.classList.add('dogru'); Ses.dogru(); Tur.balikEkle(1); gorevYaz(`✓ Evet! <b>${kuralAdi(k)}</b>: ${aralik(0, 4).map(t => bas + t * k).join(', ')}`); }
      else {
        b.classList.add('yanlis'); Ses.yanlis();
        $('#oyunAlt').querySelectorAll('.cevap-btn')[sec.findIndex(x => x.d)].classList.add('dogru');
        gorevYaz(`Pıtır <b>${kuralAdi(k)}</b> zıpladı: ${aralik(0, 4).map(t => bas + t * k).join(', ')}`);
      }
      await bekle(2600);
      if (!gecerli()) return;
      Tur.kilit = false; this.sonraki();
    }));
  },
  bitir() {
    yolu.onDokun = null;
    const en = Object.entries(Tur.zorluk).sort((a, b) => b[1] - a[1])[0];
    const ozet = en ? `En çok “${en[0]}” zıplamada zorlandın. Buzları tek tek sayarak zıpla!` : 'Harika! Pıtır’ın bütün zıplamalarını bildin. 🐧';
    seviyeBitti({ yildiz: Tur.yildiz(), balik: Tur.balik, ozet });
  }
};
MOTORLAR.push(B3);

/* =========================================================
   L6. BÖLGE 4 — BÜYÜK BUZDAĞI (100'e kadar)
   'bul' + tur:'onluk' → 0–100 onar ölçekli doğruda onluğu bul (yalnız 0, 50, 100 numaralı)
   'bul' + tur:'kesit' → onluk parçada (ör. 60–70) birliği bul
   'arasinda'          → sayı hangi iki onluğun arasında? (3 seçenek)
   'bul' görevleri Bölge 1'in bul() mantığını kullanır.
   ========================================================= */
const B4_PLAN = {
  1: ['onluk', 'onluk', 'arasinda', 'onluk', 'onluk', 'arasinda', 'onluk', 'onluk'],
  2: ['kesit', 'kesit', 'arasinda', 'kesit', 'kesit', 'arasinda', 'kesit', 'kesit'],
  3: ['onluk', 'kesit', 'arasinda', 'kesit', 'onluk', 'arasinda', 'kesit', 'kesit']
};
function b4GorevUret(tur, seviye) {
  if (tur === 'onluk') return { tip: 'bul', tur, bas: 0, son: 100, adim: 10, etiket: [0, 50, 100], hedef: hedefSec('b4-onluk', [1, 2, 3, 4, 6, 7, 8, 9]) };
  if (tur === 'kesit') {
    const d = rnd(1, 9), adaylar = seviye === 2 ? [1, 2, 3, 4, 6, 7, 8, 9] : aralik(1, 9);
    return { tip: 'bul', tur, bas: d * 10, son: d * 10 + 10, adim: 1, etiket: seviye === 2 ? 'besler' : 'uclar', hedef: adaylar[rnd(0, adaylar.length - 1)] };
  }
  let v; do { v = rnd(1, 99); } while (v % 10 === 0);
  return { tip: 'arasinda', v };
}
const B4 = {
  seviye: 1, oturum: 0, cfg: null,
  devam(o) { if (o !== this.oturum || Sahne.aktif !== 'oyun') return; Tur.kilit = false; this.sonraki(); },
  basla(seviye) {
    this.oturum++;
    this.seviye = seviye;
    // aynı seviyede aynı sayı iki kez sorulmasın
    const gorevler = [], gorulen = new Set();
    B4_PLAN[seviye].forEach(t => {
      let g, anahtar, deneme = 0;
      do { g = b4GorevUret(t, seviye); anahtar = g.tip === 'arasinda' ? g.v : g.bas + g.hedef * g.adim; } while (gorulen.has(anahtar) && ++deneme < 30);
      gorulen.add(anahtar); gorevler.push(g);
    });
    Tur.sifirla(gorevler);
    this.sonraki();
  },
  sonraki() {
    Tur.ilerleme(); yolu.temizle();
    const g = Tur.gorevler[Tur.k];
    if (!g) return this.bitir();
    this.calistir(g);
  },
  calistir(g) {
    $('#secenekAlan').classList.remove('acik'); $('#oyunAlt').classList.remove('kova');
    if (g.tip === 'arasinda') return this.arasinda(g);
    // bul: her görevde kendi yolu
    $('#oyunAlt').innerHTML = `<span class="ipucu">${g.tur === 'onluk' ? '💡 Buzlar onar onar gider: 0, 10, 20…' : '💡 Numaralı buzdan başla, birer birer say!'}</span>`;
    this.cfg = { bas: g.bas, son: g.son, adim: g.adim, etiket: g.etiket, gizli: [], pitir: g.hedef > 4 ? 0 : (g.son - g.bas) / g.adim };
    yolu.kur(this.cfg);
    B1.bul.call(this, g);
  },
  /* ---------- Hangi iki onluğun arasında? ---------- */
  arasinda(g) {
    const o = this.oturum, v = g.v, t = Math.floor(v / 10) * 10;
    this.cfg = { bas: 0, son: 100, adim: 10, etiket: 'hepsi', pitir: 0 };
    yolu.kur(this.cfg); yolu.onDokun = null;
    gorevYaz(`<b>${v}</b> hangi iki onluğun arasında?`, `${v} hangi iki onluğun arasında?`);
    const tabanlar = t === 0 ? [0, 10, 20] : t === 90 ? [70, 80, 90] : [t - 10, t, t + 10];
    const sec = karistir(tabanlar.map(a => ({ a, d: a === t })));
    $('#oyunAlt').innerHTML = sec.map((s, j) => `<button class="cevap-btn" data-j="${j}">${s.a} ile ${s.a + 10}</button>`).join('');
    let deneme = 1;
    $('#oyunAlt').querySelectorAll('.cevap-btn').forEach(b => b.addEventListener('click', async () => {
      if (Tur.kilit) return;
      const s = sec[+b.dataset.j];
      const x = yolu.xs[t / 10] + (v - t) / 10 * yolu.ara;
      if (s.d) {
        Tur.kilit = true; b.classList.add('dogru'); Ses.dogru();
        yolu.isaretKoy(x, v);
        gorevYaz(`✓ <b>${v}</b>, ${ek(t, 'abl')} büyük, ${ek(t + 10, 'abl')} küçük.`);
        await new Promise(r => yolu.zipla(t / 10, r));
        if (o !== this.oturum) return;
        await yolu.balikVer(t / 10);
        Tur.sonuc(deneme);
        await bekle(1300); return this.devam(o);
      }
      b.classList.add('yanlis'); Ses.yanlis();
      Tur.zorluk.arasinda = (Tur.zorluk.arasinda || 0) + 1;
      if (deneme === 1) {
        deneme = 2;
        gorevYaz(`${ek(v, 'loc')} <b>${t / 10} onluk</b> var. Tekrar dene!`, `${ek(v, 'loc')} ${t / 10} onluk var. Tekrar dene!`);
        return;
      }
      Tur.kilit = true;
      $('#oyunAlt').querySelectorAll('.cevap-btn')[sec.findIndex(z => z.d)].classList.add('dogru');
      yolu.isaretKoy(x, v);
      gorevYaz(`<b>${v}</b>, <b>${t}</b> ile <b>${t + 10}</b> arasında.`);
      Tur.sonuc(3);
      await bekle(2600); this.devam(o);
    }));
  },
  bitir() {
    yolu.onDokun = null;
    let ozet = 'Harika! Büyük Buzdağı’nın zirvesindesin. 🏔️';
    if ((Tur.zorluk.arasinda || 0) > 0) ozet = 'İpucu: Bir sayının onluğu, onu hangi iki onluğun arasına koyacağını söyler (63 → 60 ile 70).';
    else if (Tur.zorluk.uzak > 0) ozet = 'Uzaktaki buzlarda zorlandın. Numaralı buzdan başlayıp sayarak zıpla!';
    else if (Tur.ilkDogru < Tur.ana) ozet = 'Çok iyi! Birkaç buzda ikinci denemede buldun.';
    seviyeBitti({ yildiz: Tur.yildiz(), balik: Tur.balik, ozet });
  }
};
MOTORLAR.push(B4);

/* =========================================================
   L7. FİNAL — KUTUP YILDIZI (10 karışık görev, süre yok)
   Her görev ilgili bölgenin kodunu ödünç alır (call ile).
   ========================================================= */
const FINAL_PLAN = ['bul20', 'yol', 'balik', 'kosu', 'kesit', 'arasinda', 'bul20zor', 'kosuGeri', 'onluk', 'balik'];
const FINAL_MOTOR = {
  seviye: 2, oturum: 0, cfg: null,
  // ödünç alınan yardımcılar
  bul: B1.bul, yol: B1.yol,
  gorev: B2.gorev, kartBagla: B2.kartBagla, sec: B2.sec, dene: B2.dene, gorevUret: B2.gorevUret,
  kosu: B3.kosu, hazirla: B3.hazirla, gosterZipla: B3.gosterZipla, zipla: B3.zipla, dokunusBekle: B3.dokunusBekle, kosuUret: B3.kosuUret,
  arasinda: B4.arasinda,
  devam(o) { if (o !== this.oturum || Sahne.aktif !== 'oyun') return; Tur.kilit = false; this.sonraki(); },
  basla() {
    this.oturum++;
    const ilk = 'bul20';
    const gorevler = [ilk, ...karistir(FINAL_PLAN.slice(1))].map(t => this.uret(t));
    Tur.sifirla(gorevler);
    this.sonraki();
  },
  uret(t) {
    if (t === 'bul20' || t === 'bul20zor') return { tip: 'bul', ft: t, bas: 0, son: 20, adim: 1, etiket: t === 'bul20' ? 'besler' : 'uclar', hedef: rnd(1, 19), seviye: 2 };
    if (t === 'yol') return { tip: 'yol', ft: t, seviye: rnd(1, 3) };
    if (t === 'balik') return { tip: 'balik', ft: t, seviye: 2, ...B2.gorevUret(2, rnd(1, 9)) };
    if (t === 'kosu') return { tip: 'kosu', ft: t, ...B3.kosuUret([2, 3, 4, 5, 10][rnd(0, 4)]) };
    if (t === 'kosuGeri') return { tip: 'kosu', ft: t, ...B3.kosuUret([-2, -5, -10][rnd(0, 2)]) };
    const g = b4GorevUret(t === 'onluk' ? 'onluk' : t === 'kesit' ? 'kesit' : 'arasinda', 3);
    return { ...g, ft: t, seviye: 3 };
  },
  sonraki() {
    Tur.ilerleme(); yolu.temizle();
    $('#secenekAlan').classList.remove('acik'); $('#oyunAlt').classList.remove('kova');
    const g = Tur.gorevler[Tur.k];
    if (!g) return this.bitir();
    this.seviye = g.seviye || 2;
    $('#oyunAlt').innerHTML = '';
    if (g.tip === 'bul') {
      this.cfg = { bas: g.bas, son: g.son, adim: g.adim, etiket: g.etiket, gizli: [], pitir: 0 };
      if (g.hedef === 0) this.cfg.pitir = (g.son - g.bas) / g.adim;
      yolu.kur(this.cfg);
      $('#oyunAlt').innerHTML = '<span class="ipucu">⭐ Kutup Yıldızı yolu</span>';
      return this.bul(g);
    }
    if (g.tip === 'yol') { yolu.kur({ bas: 0, son: 10, adim: 1, etiket: 'hepsi' }); $('#oyunAlt').innerHTML = '<span class="ipucu">⭐ Kutup Yıldızı yolu</span>'; return this.yol(); }
    if (g.tip === 'balik') return this.gorev(g);
    if (g.tip === 'kosu') { $('#oyunAlt').innerHTML = '<span class="ipucu">⭐ Pıtır hep aynı sayıda buz atlar.</span>'; return this.kosu(g); }
    if (g.tip === 'arasinda') return this.arasinda(g);
  },
  bitir() {
    yolu.onDokun = null;
    const y = Tur.yildiz();
    const ozet = y === 3 ? 'Kutup Yıldızı senin! Sayı doğrusunun ustası oldun. 🌟' : 'Kutup Yıldızı’na çok yaklaştın! 3 yıldız için tekrar dene.';
    seviyeBitti({ yildiz: y, balik: Tur.balik, ozet });
  }
};
MOTORLAR.push(FINAL_MOTOR);

$('#btnDur').addEventListener('click', () => {
  Ses.tik();
  Modal.ac(`<h2>⏸ Mola</h2><p>Pıtır seni bekliyor!</p><div class="modal-dugmeler">
    <button class="btn ikinci" onclick="Modal.kapat()">Devam ▶</button>
    <button class="btn" onclick="Sahne.git('harita')">Harita 🗺️</button></div>`);
});

/* =========================================================
   M. EKRAN: SEVİYE SONU
   ========================================================= */
function seviyeBitti(sonuc) {
  const anahtar = aktif.bolge + '-' + aktif.seviye;
  const finalOnce = finalAcikMi();
  kayit.yildiz[anahtar] = Math.max(kayit.yildiz[anahtar] || 0, sonuc.yildiz);
  kayit.balik += sonuc.balik;
  kaydet();
  sonuc.finalAcildi = !finalOnce && finalAcikMi();
  Sahne.git('sonuc', sonuc);
}
Ekran.sonuc = s => {
  const b = bolgeBul(aktif.bolge);
  $('#sonucBaslik').textContent = `${b.ikon} Seviye ${aktif.seviye} Tamam!`;
  const yil = $$('#sonucYildiz span');
  yil.forEach(e => e.classList.remove('dolu'));
  yil.forEach((e, i) => { if (i < s.yildiz) setTimeout(() => { e.classList.add('dolu'); Ses.yildiz(i); }, 400 + i * 450); });
  $('#sonucBalik').textContent = `+${s.balik} 🐟`;
  $('#sonucOzet').textContent = s.ozet || '';
  const notlar = [];
  if (s.finalAcildi) notlar.push('⭐ Kutup Yıldızı finali açıldı!');
  if (alinabilirVar()) notlar.push('🐧 Kolonide yeni bir süs alabilirsin!');
  $('#sonucNot').innerHTML = notlar.map(n => `<div>${n}</div>`).join('');
  if (s.finalAcildi) setTimeout(() => Ses.fanfar(), 400 + s.yildiz * 450);
  else if (s.yildiz === 3) setTimeout(() => Ses.fanfar(), 1800);
};
$('#btnTekrar').addEventListener('click', () => { Ses.tik(); oyunBaslat(aktif.bolge, aktif.seviye); });

/* =========================================================
   N. EKRAN: KOLONİ (kozmetik — satın alma Aşama 6'da)
   ========================================================= */
const ESYALAR = [   // tip 'giy' → Pıtır'ın üstünde (slot), tip 'sus' → kolonide
  { id: 'atki', ad: 'Kırmızı atkı', emo: '🧣', fiyat: 15, tip: 'giy', slot: 'boyun' },
  { id: 'bere', ad: 'Ponponlu bere', emo: '🧢', fiyat: 20, tip: 'giy', slot: 'bas' },
  { id: 'bayrak', ad: 'İglo bayrağı', emo: '🚩', fiyat: 25, tip: 'sus' },
  { id: 'kardan', ad: 'Kardan adam', emo: '⛄', fiyat: 30, tip: 'sus' },
  { id: 'gozluk', ad: 'Kayak gözlüğü', emo: '🥽', fiyat: 35, tip: 'giy', slot: 'goz' },
  { id: 'kova', ad: 'Balık kovası', emo: '🪣', fiyat: 40, tip: 'sus' },
  { id: 'isik', ad: 'Kuzey ışığı', emo: '🌌', fiyat: 50, tip: 'sus' },
  { id: 'yavru', ad: 'Penguen yavrusu', emo: '🐣', fiyat: 60, tip: 'sus' }
];
const sahip = id => kayit.kozmetikler.includes(id);
function koloniSahne() {
  const var_ = sahip;
  let s = '';
  if (var_('isik')) s += `<g class="kol-isik" opacity=".8">
      <path d="M-10 70 Q60 10 130 50 T270 30 T410 55" fill="none" stroke="#3DFFB0" stroke-width="22" stroke-linecap="round" opacity=".55"/>
      <path d="M-10 95 Q80 40 160 75 T300 55 T410 80" fill="none" stroke="#A855F7" stroke-width="16" stroke-linecap="round" opacity=".45"/></g>`;
  s += `<ellipse cx="200" cy="248" rx="210" ry="24" fill="#CDEBFA"/>
    <path d="M70 230 A80 80 0 0 1 230 230 Z" fill="#F4FBFF" stroke="#9ED3EE" stroke-width="4"/>
    <g stroke="#CDEBFA" stroke-width="3" fill="none">
      <path d="M78 205 H222"/><path d="M90 180 H210"/><path d="M110 160 H190"/>
      <path d="M120 230 V205 M180 230 V205 M150 205 V180 M110 180 V160 M190 180 V160"/></g>
    <path d="M130 230 V205 A20 20 0 0 1 170 205 V230Z" fill="#1F3A5F"/>`;
  if (var_('bayrak')) s += `<g><line x1="150" y1="151" x2="150" y2="104" stroke="#6B4F3A" stroke-width="4" stroke-linecap="round"/>
      <path class="kol-bayrak" d="M152 106 Q170 100 186 108 Q170 116 152 122Z" fill="#FF6B35"/></g>`;
  if (var_('kardan')) s += `<g transform="translate(38,0)">
      <circle cx="0" cy="226" r="22" fill="#fff" stroke="#CDEBFA" stroke-width="3"/><circle cx="0" cy="192" r="16" fill="#fff" stroke="#CDEBFA" stroke-width="3"/>
      <circle cx="0" cy="165" r="12" fill="#fff" stroke="#CDEBFA" stroke-width="3"/>
      <circle cx="-4" cy="162" r="2" fill="#14213D"/><circle cx="4" cy="162" r="2" fill="#14213D"/><path d="M0 166 L12 169 L0 170Z" fill="#FF9F1C"/>
      <circle cx="0" cy="188" r="2" fill="#14213D"/><circle cx="0" cy="197" r="2" fill="#14213D"/>
      <path d="M-14 188 L-30 176 M14 188 L30 176" stroke="#6B4F3A" stroke-width="3" stroke-linecap="round"/></g>`;
  if (var_('kova')) s += `<g transform="translate(232,214)"><path d="M-4 18 L-8 30 L28 30 L24 18" fill="none"/>
      <path d="M2 6 L26 0 L29 6Z" fill="#FF9F1C"/><path d="M8 4 L2 -6 L14 -2Z" fill="#FFD600"/>
      <path d="M-2 8 H30 L26 30 H2Z" fill="#4D9FFF" stroke="#2F7FE0" stroke-width="2"/></g>`;
  s += `<g transform="translate(252,135) scale(.85)">${pitirSVG()}</g>`;
  if (var_('yavru')) s += `<g transform="translate(336,190) scale(.42)">
      <ellipse cx="50" cy="117" rx="27" ry="5" fill="rgba(0,30,60,.22)"/>
      <ellipse cx="37" cy="112" rx="11" ry="5.5" fill="#FF9F1C"/><ellipse cx="63" cy="112" rx="11" ry="5.5" fill="#FF9F1C"/>
      <path d="M50 20 C80 20 88 54 86 82 C84 104 70 114 50 114 C30 114 16 104 14 82 C12 54 20 20 50 20Z" fill="#9AA9BC"/>
      <path d="M50 30 C70 30 76 50 74 64 C70 76 30 76 26 64 C24 50 30 30 50 30Z" fill="#fff"/>
      <circle cx="41" cy="50" r="5.5" fill="#14213D"/><circle cx="59" cy="50" r="5.5" fill="#14213D"/>
      <path d="M45 59 Q50 55 55 59 Q50 66 45 59Z" fill="#14213D"/></g>`;
  return s;
}
Ekran.koloni = () => {
  balikGuncelle();
  $('#koloniSvg').innerHTML = koloniSahne();
  $('#dukkan').innerHTML = ESYALAR.map(e => {
    let dugme;
    if (!sahip(e.id)) {
      const yeter = kayit.balik >= e.fiyat;
      dugme = `<button class="esya-btn ${yeter ? 'al' : 'kapali'}" data-al="${e.id}">${yeter ? 'Al' : `${e.fiyat - kayit.balik} 🐟 eksik`}</button>`;
    } else if (e.tip === 'giy') {
      const giyili = kayit.giyili[e.slot] === e.id;
      dugme = `<button class="esya-btn ${giyili ? 'giyili' : 'giy'}" data-giy="${e.id}">${giyili ? 'Çıkar' : 'Giy'}</button>`;
    } else dugme = `<span class="esya-btn sahip">✓ Kolonide</span>`;
    return `<div class="esya ${sahip(e.id) ? 'var' : ''}"><span class="emo">${e.emo}</span><span class="ad">${e.ad}</span>
      ${sahip(e.id) ? '' : `<span class="fiyat">🐟 ${e.fiyat}</span>`}${dugme}</div>`;
  }).join('');
  $$('#dukkan [data-al]').forEach(b => b.addEventListener('click', () => esyaAl(b.dataset.al)));
  $$('#dukkan [data-giy]').forEach(b => b.addEventListener('click', () => {
    const e = ESYALAR.find(x => x.id === b.dataset.giy);
    kayit.giyili[e.slot] = kayit.giyili[e.slot] === e.id ? null : e.id;
    kaydet(); Ses.tik(); Ekran.koloni();
  }));
};
function esyaAl(id) {
  const e = ESYALAR.find(x => x.id === id);
  if (sahip(id)) return;
  if (kayit.balik < e.fiyat) { Ses.yanlis(); return; }
  kayit.balik -= e.fiyat; kayit.kozmetikler.push(id);
  if (e.tip === 'giy') kayit.giyili[e.slot] = id;   // alınca hemen giysin
  kaydet(); Ses.kasa();
  Ekran.koloni();
  const kart = [...$$('#dukkan .esya')][ESYALAR.indexOf(e)];
  if (kart) kart.classList.add('yeni');
}
// Seviye sonunda: alınabilecek yeni süs var mı?
const alinabilirVar = () => ESYALAR.some(e => !sahip(e.id) && kayit.balik >= e.fiyat);

/* =========================================================
   O. AYARLAR
   ========================================================= */
function ayarlarAc() {
  Modal.ac(`<h2>⚙️ Ayarlar</h2>
    <div class="ayar-satir"><span>🔔 Efekt sesleri</span><button class="anahtar ${kayit.ses ? 'acik' : ''}" onclick="ayarDegis('ses',this)" aria-label="Efekt sesleri"></button></div>
    <div class="ayar-satir"><span>🌬️ Rüzgâr sesi</span><button class="anahtar ${kayit.ruzgar ? 'acik' : ''}" onclick="ayarDegis('ruzgar',this)" aria-label="Rüzgâr sesi"></button></div>
    <div class="modal-dugmeler">
      <button class="btn gri" onclick="sifirlaSor()">🗑️ İlerlemeyi sıfırla</button>
      <button class="btn ikinci" onclick="Modal.kapat()">Tamam</button></div>`);
}
function ayarDegis(k, btn) {
  kayit[k] = !kayit[k]; kaydet(); btn.classList.toggle('acik', kayit[k]);
  Ses.ruzgarAyarla(); Ses.tik();
}
function sifirlaSor() {
  Modal.ac(`<h2>Emin misin?</h2><p>Tüm yıldızlar, balıklar ve süsler silinecek.</p><div class="modal-dugmeler">
    <button class="btn gri" onclick="ayarlarAc()">Vazgeç</button>
    <button class="btn" onclick="sifirla();Ses.ruzgarAyarla();Modal.kapat();balikGuncelle();if(Sahne.aktif==='harita')Ekran.harita()">Evet, sıfırla</button></div>`);
}

/* =========================================================
   P. BAŞLAT
   ========================================================= */
Konus.hazirla();
balikGuncelle();
Sahne.git('acilis');
</script>
