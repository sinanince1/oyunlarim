<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Oyun Fikirleri</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Nunito', sans-serif; background: #FFF8F0; color: #2D2D2D; }
    header { background: linear-gradient(135deg, #A855F7, #FF4D8D, #FF6B35); color: #fff; padding: 16px 20px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
    header h1 { margin: 0; font-size: 1.45rem; font-weight: 900; flex: 1; display: flex; align-items: center; gap: 10px; min-width: 200px; }
    header h1 .rozet { background: #FFD600; color: #2D2D2D; font-size: .9rem; padding: 2px 10px; border-radius: 99px; }
    header a, header button { color: #fff; font-family: inherit; font-weight: 900; font-size: .9rem; text-decoration: none; background: rgba(255,255,255,.22); padding: 8px 14px; border-radius: 99px; border: none; cursor: pointer; }
    main { max-width: 900px; margin: 0 auto; padding: 20px 16px 60px; }
    .ozet { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    .kart { background: #fff; border-radius: 20px; padding: 14px 16px; box-shadow: 0 6px 0 rgba(0,0,0,.06); border: 3px solid #F0E8DC; }
    .kart .n { font-size: 1.8rem; font-weight: 900; color: #FF6B35; }
    .kart .l { font-weight: 800; color: #8A7F74; font-size: .85rem; }
    .arac { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    .sekme { font-family: inherit; font-weight: 900; font-size: .95rem; padding: 9px 15px; border-radius: 99px; border: 3px solid #EADFD3; background: #fff; cursor: pointer; color: #2D2D2D; }
    .sekme.aktif { background: linear-gradient(135deg, #A855F7, #FF4D8D); color: #fff; border-color: transparent; }
    .sekme .s { opacity: .7; font-size: .85em; }
    select, input[type=search] { font-family: inherit; font-weight: 800; font-size: .95rem; padding: 9px 14px; border-radius: 99px; border: 3px solid #EADFD3; background: #fff; color: #2D2D2D; outline: none; }
    input[type=search] { flex: 1; min-width: 160px; }
    input[type=search]:focus, select:focus { border-color: #A855F7; }
    .ince { font-family: inherit; font-weight: 900; font-size: .85rem; padding: 7px 13px; border-radius: 99px; border: 2px dashed #CFC2B3; background: transparent; cursor: pointer; color: #8A7F74; }
    .liste { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
    .mesaj { background: #fff; border-radius: 20px; padding: 14px 16px 12px; box-shadow: 0 5px 0 rgba(0,0,0,.05); border: 3px solid #F0E8DC; position: relative; }
    .mesaj.yeni { border-color: #C9A6F7; background: #FDFBFF; }
    .mesaj.yeni::before { content: ''; position: absolute; left: -3px; top: 14px; bottom: 14px; width: 6px; border-radius: 0 6px 6px 0; background: #A855F7; }
    .m-ust { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .m-ad { font-weight: 900; font-size: 1.05rem; }
    .cip { font-weight: 900; font-size: .78rem; padding: 3px 10px; border-radius: 99px; background: #F3EEE7; color: #6E6358; }
    .cip.s1 { background: #FFE9DF; color: #C4471A; } .cip.s2 { background: #FFF5C2; color: #8A6D00; } .cip.s3 { background: #D8F7F0; color: #00806A; } .cip.s4 { background: #E0EDFF; color: #2A64C2; }
    .m-tarih { margin-left: auto; font-weight: 800; font-size: .8rem; color: #B9AEA0; white-space: nowrap; }
    .m-metin { font-weight: 700; font-size: 1.05rem; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
    .m-eylem { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 2px solid #F7F0E6; }
    .m-eylem button { font-family: inherit; font-weight: 900; font-size: .82rem; padding: 6px 12px; border-radius: 99px; border: 2px solid #EADFD3; background: #fff; cursor: pointer; color: #5A5047; }
    .m-eylem button:hover { border-color: #A855F7; }
    .m-eylem button.yildizli { background: #FFF5C2; border-color: #FFD600; }
    .m-eylem .sil { margin-left: auto; color: #FF4D8D; }
    .bos { text-align: center; padding: 60px 20px; font-weight: 900; color: #B9AEA0; font-size: 1.15rem; }
    #giris { position: fixed; inset: 0; background: #FFF8F0; display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
    #giris .kutu { background: #fff; border-radius: 24px; padding: 30px 24px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 10px 0 rgba(0,0,0,.1); border: 3px solid #F0E8DC; }
    #giris .gbtn { width: 100%; font-family: inherit; font-weight: 900; font-size: 1.05rem; padding: 13px; border-radius: 99px; border: 3px solid #EADFD3; cursor: pointer; background: #fff; color: #2D2D2D; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 16px; }
    #giris .gbtn:hover { border-color: #4D9FFF; }
    #giris-hata { color: #FF4D8D; font-weight: 800; font-size: .9rem; min-height: 1.3em; margin: 12px 0 0; line-height: 1.4; }
    #bildirim { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(120px); background: #2D2D2D; color: #fff; font-weight: 900; padding: 11px 20px; border-radius: 99px; transition: transform .25s; z-index: 30; }
    #bildirim.goster { transform: translateX(-50%) translateY(0); }
    @media (max-width: 640px) { .ozet { grid-template-columns: repeat(2, 1fr); } header h1 { font-size: 1.2rem; } .m-tarih { margin-left: 0; width: 100%; } }
  </style>
</head>
<body>

<div id="giris">
  <div class="kutu">
    <div style="font-size:2.8rem">📬</div>
    <h3 style="margin:6px 0 2px;font-weight:900;font-size:1.3rem">Oyun Fikirleri</h3>
    <p style="margin:0;color:#8A7F74;font-weight:800">Öğretmen girişi</p>
    <button class="gbtn" id="g-btn" onclick="girisYap()">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Google ile giriş yap
    </button>
    <p id="giris-hata"></p>
    <p style="margin:12px 0 0"><a href="index.html" style="color:#8A7F74;font-weight:800">← Ana sayfa</a></p>
  </div>
</div>

<header>
  <h1>📬 Oyun Fikirleri <span class="rozet" id="rozet" hidden>0</span></h1>
  <a href="istatistik.html">📊 İstatistik</a>
  <a href="index.html">← Site</a>
  <button onclick="cikis()">Çıkış</button>
</header>

<main>
  <div class="ozet">
    <div class="kart"><div class="n" id="o-yeni">–</div><div class="l">Okunmamış</div></div>
    <div class="kart"><div class="n" id="o-hafta">–</div><div class="l">Son 7 gün</div></div>
    <div class="kart"><div class="n" id="o-yildiz">–</div><div class="l">Yıldızlı</div></div>
    <div class="kart"><div class="n" id="o-toplam">–</div><div class="l">Toplam</div></div>
  </div>

  <div class="arac" id="sekmeler">
    <button class="sekme aktif" data-g="yeni">Yeni <span class="s" id="s-yeni"></span></button>
    <button class="sekme" data-g="hepsi">Tümü <span class="s" id="s-hepsi"></span></button>
    <button class="sekme" data-g="yildiz">⭐ Yıldızlı <span class="s" id="s-yildiz"></span></button>
    <button class="sekme" data-g="arsiv">🗄️ Arşiv <span class="s" id="s-arsiv"></span></button>
  </div>
  <div class="arac">
    <select id="f-sinif" aria-label="Sınıf"><option value="">Tüm sınıflar</option><option value="1">1. Sınıf</option><option value="2">2. Sınıf</option><option value="3">3. Sınıf</option><option value="4">4. Sınıf</option></select>
    <select id="f-ders" aria-label="Ders"><option value="">Tüm dersler</option><option>Matematik</option><option>Türkçe</option><option>Hayat Bilgisi</option><option>Başka</option><option value="-">Ders seçilmemiş</option></select>
    <input type="search" id="f-ara" placeholder="Mesajlarda ara…" autocomplete="off">
    <button class="ince" id="hepsi-okundu" onclick="hepsiniOkundu()" hidden>✓ Görünenleri okundu yap</button>
  </div>

  <div class="liste" id="liste"><div class="bos">Yükleniyor…</div></div>
</main>

<div id="bildirim"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
// Veriler: Firestore (hikayesehri projesi) → oyun_fikirleri
// Erişim: Google girişi + Firestore kuralı (yalnızca öğretmen hesabı okuyup değiştirebilir)
const $ = id => document.getElementById(id);
if (typeof firebase === 'undefined') { $('giris-hata').textContent = 'Firebase yüklenemedi (internet / reklam engelleyici?). Sayfayı yenileyin.'; throw new Error('firebase yok'); }
firebase.initializeApp({ apiKey: "AIzaSyCfG9-e_6DjyDnKhptvwgR0SIIjIl8NNsw", authDomain: "hikayesehri-3162b.firebaseapp.com", projectId: "hikayesehri-3162b" });
const auth = firebase.auth(), db = firebase.firestore(), KOL = db.collection('oyun_fikirleri');
let veri = [], gorunum = 'yeni', dinleyici = null;

// ---- Giriş ----
const AUTH_HATA = {
  'auth/unauthorized-domain': 'Bu alan adı Firebase\'de yetkili değil. Firebase → Authentication → Settings → Authorized domains bölümüne <b>' + location.hostname + '</b> ekleyin.',
  'auth/operation-not-allowed': 'Firebase\'de Google ile giriş kapalı. Authentication → Sign-in method → Google\'ı açın.',
  'auth/configuration-not-found': 'Firebase\'de Authentication henüz açılmamış. Authentication → Get started → Google\'ı açın.',
  'auth/network-request-failed': 'İnternet bağlantısı yok gibi görünüyor.'
};
function girisHata(e) { $('giris-hata').innerHTML = AUTH_HATA[e.code] || ('Giriş yapılamadı: ' + esc(e.message || e.code)); }
function girisYap() {
  $('giris-hata').textContent = '';
  const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });
  auth.signInWithPopup(p).catch(e => {
    if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/cancelled-popup-request'].includes(e.code)) return auth.signInWithRedirect(p).catch(girisHata);
    if (e.code !== 'auth/popup-closed-by-user') girisHata(e);
  });
}
auth.getRedirectResult().catch(girisHata);
function cikis() { if (dinleyici) dinleyici(); dinleyici = null; auth.signOut(); }
auth.onAuthStateChanged(k => {
  if (!k) { $('giris').style.display = 'flex'; veri = []; return; }
  $('giris').style.display = 'none';
  dinle();
});

// ---- Veri (canlı) ----
function dinle() {
  if (dinleyici) dinleyici();
  $('liste').innerHTML = '<div class="bos">Yükleniyor…</div>';
  dinleyici = KOL.orderBy('tarih', 'desc').limit(1000).onSnapshot(snap => {
    veri = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    ciz();
  }, e => {
    if (e.code === 'permission-denied') {
      $('giris').style.display = 'flex';
      $('giris-hata').innerHTML = '<b>' + esc(auth.currentUser ? auth.currentUser.email : '') + '</b> hesabının bu mesajları okuma yetkisi yok (ya da Firestore kuralı henüz eklenmedi).<br><a href="#" onclick="cikis();return false" style="color:#4D9FFF">Başka hesapla dene</a>';
    } else $('liste').innerHTML = '<div class="bos">Veri okunamadı: ' + esc(e.message) + '</div>';
  });
}

// ---- Çizim ----
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
function trKucuk(s) { return String(s || '').toLocaleLowerCase('tr-TR'); }
function tarihYaz(t) {
  if (!t || !t.toDate) return 'şimdi';
  const d = t.toDate(), fark = (Date.now() - d) / 1000;
  if (fark < 60) return 'az önce';
  if (fark < 3600) return Math.floor(fark / 60) + ' dk önce';
  const saat = d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  const bugun = new Date(); bugun.setHours(0, 0, 0, 0);
  if (d >= bugun) return 'Bugün ' + saat;
  if (d >= bugun - 864e5) return 'Dün ' + saat;
  return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: d.getFullYear() === bugun.getFullYear() ? undefined : 'numeric' }) + ' ' + saat;
}
const DERS_IKON = { 'Matematik': '🔢', 'Türkçe': '📖', 'Hayat Bilgisi': '🌱', 'Başka': '✨' };
function gruptaMi(m, g) {
  if (g === 'yeni') return m.durum === 'yeni';
  if (g === 'yildiz') return !!m.yildiz && m.durum !== 'arsiv';
  if (g === 'arsiv') return m.durum === 'arsiv';
  return m.durum !== 'arsiv';
}
function filtreli() {
  const s = $('f-sinif').value, dr = $('f-ders').value, q = trKucuk($('f-ara').value.trim());
  return veri.filter(m => gruptaMi(m, gorunum)
    && (!s || String(m.sinif) === s)
    && (!dr || (dr === '-' ? !m.ders : m.ders === dr))
    && (!q || trKucuk(m.metin + ' ' + m.ad).includes(q)));
}
function ciz() {
  const yeni = veri.filter(m => m.durum === 'yeni').length, hafta = Date.now() - 7 * 864e5;
  $('o-yeni').textContent = yeni;
  $('o-hafta').textContent = veri.filter(m => !m.tarih || m.tarih.toMillis() > hafta).length;
  $('o-yildiz').textContent = veri.filter(m => m.yildiz).length;
  $('o-toplam').textContent = veri.length;
  ['yeni', 'hepsi', 'yildiz', 'arsiv'].forEach(g => { const n = veri.filter(m => gruptaMi(m, g)).length; $('s-' + g).textContent = n ? n : ''; });
  $('rozet').hidden = !yeni; $('rozet').textContent = yeni;
  document.title = (yeni ? '(' + yeni + ') ' : '') + 'Oyun Fikirleri';

  const l = filtreli();
  $('hepsi-okundu').hidden = !l.some(m => m.durum === 'yeni');
  if (!l.length) {
    $('liste').innerHTML = '<div class="bos">' + (!veri.length ? '📭 Henüz hiç fikir gelmedi.<br><small style="font-weight:800">Öğrenciler ana sayfadaki “💡 Oyun Fikrim Var” butonundan yazabilir.</small>' : gorunum === 'yeni' && !$('f-ara').value && !$('f-sinif').value && !$('f-ders').value ? '🎉 Okunmamış mesaj yok.' : 'Bu filtreye uyan mesaj yok.') + '</div>';
    return;
  }
  $('liste').innerHTML = l.map(m => `<div class="mesaj ${m.durum === 'yeni' ? 'yeni' : ''}" data-id="${m.id}">
    <div class="m-ust">
      <span class="m-ad">${m.ad ? esc(m.ad) : '<span style="color:#B9AEA0">İsimsiz</span>'}</span>
      ${m.sinif ? `<span class="cip s${+m.sinif}">${+m.sinif}. Sınıf</span>` : ''}
      ${m.ders ? `<span class="cip">${DERS_IKON[m.ders] || ''} ${esc(m.ders)}</span>` : ''}
      <span class="m-tarih">${tarihYaz(m.tarih)}</span>
    </div>
    <div class="m-metin">${esc(m.metin)}</div>
    <div class="m-eylem">
      <button data-e="okundu">${m.durum === 'yeni' ? '✓ Okundu' : '● Yeni yap'}</button>
      <button data-e="yildiz" class="${m.yildiz ? 'yildizli' : ''}">${m.yildiz ? '⭐ Yıldızlı' : '☆ Yıldızla'}</button>
      <button data-e="kopyala">📋 Kopyala</button>
      <button data-e="arsiv">${m.durum === 'arsiv' ? '↩︎ Arşivden çıkar' : '🗄️ Arşivle'}</button>
      <button data-e="sil" class="sil">🗑️ Sil</button>
    </div>
  </div>`).join('');
}

// ---- Eylemler ----
function bildir(t) { const b = $('bildirim'); b.textContent = t; b.classList.add('goster'); clearTimeout(bildir.z); bildir.z = setTimeout(() => b.classList.remove('goster'), 1800); }
function hataBildir(e) { bildir('İşlem yapılamadı: ' + (e.code || e.message)); }
$('liste').addEventListener('click', e => {
  const b = e.target.closest('button[data-e]'); if (!b) return;
  const id = b.closest('.mesaj').dataset.id, m = veri.find(x => x.id === id); if (!m) return;
  const ref = KOL.doc(id);
  switch (b.dataset.e) {
    case 'okundu': ref.update({ durum: m.durum === 'yeni' ? 'okundu' : 'yeni' }).catch(hataBildir); break;
    case 'yildiz': ref.update({ yildiz: !m.yildiz }).catch(hataBildir); break;
    case 'arsiv': ref.update({ durum: m.durum === 'arsiv' ? 'okundu' : 'arsiv' }).then(() => bildir(m.durum === 'arsiv' ? 'Arşivden çıkarıldı' : 'Arşivlendi')).catch(hataBildir); break;
    case 'sil': if (confirm('Bu mesaj kalıcı olarak silinsin mi?')) ref.delete().then(() => bildir('Silindi')).catch(hataBildir); break;
    case 'kopyala': {
      const t = 'Öğrenci oyun fikri (' + (m.sinif ? m.sinif + '. sınıf' : 'sınıf ?') + (m.ders ? ', ' + m.ders : '') + '):\n' + m.metin;
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => bildir('Panoya kopyalandı'), () => { prompt('Kopyalayın:', t); });
      if (m.durum === 'yeni') ref.update({ durum: 'okundu' }).catch(() => {});
      break;
    }
  }
});
function hepsiniOkundu() {
  const yeniler = filtreli().filter(m => m.durum === 'yeni'); if (!yeniler.length) return;
  const batch = db.batch(); yeniler.slice(0, 450).forEach(m => batch.update(KOL.doc(m.id), { durum: 'okundu' }));
  batch.commit().then(() => bildir(yeniler.length + ' mesaj okundu yapıldı')).catch(hataBildir);
}
$('sekmeler').addEventListener('click', e => {
  const b = e.target.closest('.sekme'); if (!b) return;
  gorunum = b.dataset.g; document.querySelectorAll('.sekme').forEach(x => x.classList.toggle('aktif', x === b)); ciz();
});
['f-sinif', 'f-ders', 'f-ara'].forEach(id => $(id).addEventListener('input', ciz));
setInterval(() => { if (veri.length) ciz(); }, 60000); // "dk önce" yazılarını tazele
</script>
</body>
</html>
