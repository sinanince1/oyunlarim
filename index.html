  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --yellow: #FFD600;
      --orange: #FF6B35;
      --pink: #FF4D8D;
      --teal: #00C9A7;
      --blue: #4D9FFF;
      --purple: #A855F7;
      --bg: #FFF8F0;
      --card-shadow: 0 8px 0px rgba(0,0,0,0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 10% 20%, #FFE08A33 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, #FF4D8D22 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, #4D9FFF11 0%, transparent 60%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #FF6B35, #FF4D8D, #A855F7);
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      box-shadow: 0 6px 0 rgba(0,0,0,0.15);
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute;
      top: -30px; right: -30px;
      width: 160px; height: 160px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
    }
    header::after {
      content: '';
      position: absolute;
      bottom: -50px; left: 30%;
      width: 200px; height: 200px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
    }

    .logo {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 2.2rem;
      color: white;
      text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo span { font-size: 2.4rem; }
    .logo-img {
      height: 48px;
      width: 48px;
      object-fit: contain;
      filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.2));
    }
    @media (max-width: 600px) {
      .logo-img { height: 38px; width: 38px; }
    }

    .header-badges {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }

    .about-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: white;
      color: var(--pink);
      font-weight: 900;
      font-size: 0.95rem;
      text-decoration: none;
      padding: 10px 22px;
      border-radius: 999px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.15);
      transition: transform 0.2s, box-shadow 0.2s;
      white-space: nowrap;
    }
    .about-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    }
    .about-btn:active {
      transform: translateY(1px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.15);
    }
    .badge {
      background: rgba(255,255,255,0.22);
      border: 2px solid rgba(255,255,255,0.4);
      color: white;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 6px 16px;
      border-radius: 999px;
      backdrop-filter: blur(4px);
    }

    /* HERO */
    .hero {
      text-align: center;
      padding: 50px 20px 30px;
    }
    .hero h2 {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: #2D2D2D;
      line-height: 1.2;
    }
    .hero h2 em {
      font-style: normal;
      background: linear-gradient(135deg, var(--orange), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero p {
      font-size: 1.15rem;
      color: #666;
      margin-top: 12px;
      font-weight: 600;
    }

    /* FLOATING SHAPES */
    .floaties {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .floatie {
      position: absolute;
      font-size: 2rem;
      opacity: 0.08;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0%   { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.08; }
      90%  { opacity: 0.08; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    /* MAIN CONTENT */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 20px 60px;
      position: relative;
      z-index: 1;
    }

    /* CATEGORY SECTION */
    .category-section {
      margin-bottom: 50px;
    }
    .category-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }
    .category-icon {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      box-shadow: 0 4px 0 rgba(0,0,0,0.15);
      flex-shrink: 0;
    }
    .category-title {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.75rem;
      color: #2D2D2D;
    }
    .category-count {
      font-size: 0.9rem;
      font-weight: 700;
      color: #999;
      margin-top: 2px;
    }
    .category-line {
      flex: 1;
      height: 3px;
      border-radius: 99px;
      margin-left: 8px;
    }

    /* GAME GRID */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 22px;
    }

    /* --- Yapı Ustaları thumbnail (3B cisimlerle kurulan yapı) --- */
    .yapi-ustalari-thumb {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .yut-sahne { width: 100%; height: 100%; }
    .yut-zemin { opacity: .95; }
    /* Parçalar sırayla yukarıdan düşüp yerine oturur, sonra yapı yeniden kurulur */
    .yut-p { opacity: 0; animation: yutKur 5s ease-in-out infinite; }
    .yut-p1 { animation-delay: 0s; }
    .yut-p2 { animation-delay: .32s; }
    .yut-p3 { animation-delay: .64s; }
    .yut-p4 { animation-delay: .96s; }
    @keyframes yutKur {
      0%        { opacity: 0; transform: translateY(-56px); }
      6%        { opacity: 1; }
      13%       { transform: translateY(0); }
      16%       { transform: translateY(-5px); }
      19%, 84%  { opacity: 1; transform: translateY(0); }
      93%, 100% { opacity: 0; transform: translateY(-16px); }
    }
    /* Arka planda süzülen cisimler */
    .yut-f { opacity: .28; animation: yutSuzul 6.5s ease-in-out infinite; }
    .yut-f2 { animation-delay: -1.5s; }
    .yut-f3 { animation-delay: -3.0s; }
    .yut-f4 { animation-delay: -4.4s; }
    @keyframes yutSuzul {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-16px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .yut-p { opacity: 1; animation: none; }
      .yut-f { animation: none; }
    }

    /* --- Şekil Robotu thumbnail (dans eden robot) --- */
    .sekil-robot-thumb {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .sekil-robot-thumb .srt-s {          /* arka planda süzülen geometrik şekiller */
      position: absolute;
      opacity: .5;
      animation: srtSuzul 4.5s ease-in-out infinite;
    }
    .srt-kare {
      width: 22px; height: 22px; border-radius: 4px;
      background: #f5b942; left: 14%; top: 22%;
      animation-delay: -.4s;
    }
    .srt-daire {
      width: 20px; height: 20px; border-radius: 50%;
      background: #e0559a; right: 13%; top: 18%;
      animation-delay: -2.2s;
    }
    .srt-dikdortgen {
      width: 30px; height: 15px; border-radius: 4px;
      background: #4aab6b; right: 10%; bottom: 20%;
      animation-delay: -1.3s;
    }
    .srt-ucgen {
      width: 0; height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-bottom: 21px solid #4f8ce8;
      left: 10%; bottom: 18%;
      animation-delay: -3.1s;
    }
    @keyframes srtSuzul {
      0%, 100% { transform: translateY(0)    rotate(0deg); }
      50%      { transform: translateY(-9px) rotate(12deg); }
    }
    .srt-robot {
      position: relative; z-index: 1;
      height: 128px; width: auto;
      filter: drop-shadow(0 4px 8px rgba(22,35,58,.28));
      animation: srtDans 0.9s ease-in-out infinite;
      transform-origin: 50% 92%;
    }
    @keyframes srtDans {                 /* gövde zıplar ve hafifçe yalpalar */
      0%, 100% { transform: translateY(0)    rotate(-3deg); }
      25%      { transform: translateY(-6px) rotate(0deg); }
      50%      { transform: translateY(0)    rotate(3deg); }
      75%      { transform: translateY(-6px) rotate(0deg); }
    }
    /* Uzuvlar kendi ekleminden döner */
    .srt-kol-sag { transform-origin: 216px 206px; animation: srtKol 0.9s ease-in-out infinite; }
    .srt-kol-sol { transform-origin:  84px 206px; animation: srtKol 0.9s ease-in-out infinite; animation-delay: -.45s; }
    .srt-bacak-sag { transform-origin: 180px 286px; animation: srtBacak 0.9s ease-in-out infinite; animation-delay: -.45s; }
    .srt-bacak-sol { transform-origin: 120px 286px; animation: srtBacak 0.9s ease-in-out infinite; }
    .srt-kafa { transform-origin: 150px 152px; animation: srtKafa 1.8s ease-in-out infinite; }
    @keyframes srtKol   { 0%,100% { transform: rotate(-30deg); } 50% { transform: rotate(30deg); } }
    @keyframes srtBacak { 0%,100% { transform: rotate(-13deg); } 50% { transform: rotate(13deg); } }
    @keyframes srtKafa  { 0%,100% { transform: rotate(-6deg);  } 50% { transform: rotate(6deg);  } }
    @media (prefers-reduced-motion: reduce) {
      .sekil-robot-thumb .srt-s, .srt-robot,
      .srt-kol-sag, .srt-kol-sol, .srt-bacak-sag, .srt-bacak-sol, .srt-kafa { animation: none; }
    }

    /* --- Dino'nun Roketi thumbnail --- */
    .dino-roket-thumb {
      position: absolute; inset: 0;
      display: flex; align-items: flex-end; justify-content: center;
      gap: 2px; padding-bottom: 8px;
      overflow: hidden;
    }
    .drt-yildizlar {
      position: absolute; inset: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 12% 18%, #fff 50%, transparent 50%),
        radial-gradient(1px 1px at 28% 42%, #fff 50%, transparent 50%),
        radial-gradient(1.5px 1.5px at 45% 12%, #fff 50%, transparent 50%),
        radial-gradient(1px 1px at 62% 35%, #fff 50%, transparent 50%),
        radial-gradient(2px 2px at 78% 15%, #FFD84D 50%, transparent 50%),
        radial-gradient(1px 1px at 88% 48%, #fff 50%, transparent 50%),
        radial-gradient(1.5px 1.5px at 35% 65%, #fff 50%, transparent 50%),
        radial-gradient(1px 1px at 72% 58%, #fff 50%, transparent 50%),
        radial-gradient(1.5px 1.5px at 92% 72%, #fff 50%, transparent 50%),
        radial-gradient(1px 1px at 18% 75%, #fff 50%, transparent 50%),
        radial-gradient(2px 2px at 55% 78%, #FFD84D 50%, transparent 50%),
        radial-gradient(1px 1px at 8% 55%, #fff 50%, transparent 50%);
      animation: drtTwinkle 3s ease-in-out infinite alternate;
    }
    @keyframes drtTwinkle {
      0%   { opacity: .6; }
      100% { opacity: 1; }
    }
    .drt-dino {
      position: relative; z-index: 1;
      width: 82px; height: auto;
      animation: drtBounce 2.2s ease-in-out infinite;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,.4));
    }
    @keyframes drtBounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      30%      { transform: translateY(-6px) rotate(-3deg); }
      60%      { transform: translateY(-2px) rotate(2deg); }
    }
    .drt-dino .drt-kol-sol { animation: drtArmL 2.2s ease-in-out infinite; }
    .drt-dino .drt-kol-sag { animation: drtArmR 2.2s ease-in-out infinite; }
    @keyframes drtArmL { 0%,100%{ transform:rotate(0) } 50%{ transform:rotate(-18deg) } }
    @keyframes drtArmR { 0%,100%{ transform:rotate(0) } 50%{ transform:rotate(18deg) } }
    .drt-roket {
      position: relative; z-index: 1;
      width: 54px; height: auto;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,.5));
      animation: drtRocketGlow 2s ease-in-out infinite alternate;
    }
    @keyframes drtRocketGlow {
      0%   { filter: drop-shadow(0 3px 8px rgba(0,0,0,.5)); }
      100% { filter: drop-shadow(0 3px 12px rgba(255,216,77,.5)); }
    }

        /* GAME CARD */
    .game-card {
      background: white;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      border: 3px solid transparent;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      cursor: pointer;
      text-decoration: none;
      display: block;
      position: relative;
    }
    .game-card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 16px 0px rgba(0,0,0,0.12);
    }

    .game-thumb {
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      position: relative;
      overflow: hidden;
    }
    .game-thumb::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.1));
    }

    .game-info {
      padding: 16px;
    }
    .game-name {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.2rem;
      color: #2D2D2D;
      margin-bottom: 6px;
    }
    .game-desc {
      font-size: 0.85rem;
      color: #777;
      line-height: 1.5;
      font-weight: 600;
    }
    .game-sinif {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.78rem;
      font-weight: 800;
      color: #999;
      background: #F5F5F5;
      padding: 3px 10px;
      border-radius: 999px;
    }

    .new-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: linear-gradient(135deg, #FF4D8D, #FF6B35);
      color: white;
      font-weight: 900;
      font-size: 1.05rem;
      padding: 9px 18px;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(255, 77, 141, 0.55);
      animation: pulse-scale 2s ease-in-out infinite;
      z-index: 10;
    }
    @keyframes pulse-scale {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.1);
        opacity: 0.8;
      }
    }

    .special-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: linear-gradient(135deg, #A855F7, #FF4D8D);
      color: white;
      font-weight: 900;
      font-size: 0.78rem;
      padding: 6px 12px;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(168, 85, 247, 0.5);
      animation: special-blink 1.1s ease-in-out infinite;
      z-index: 10;
      white-space: nowrap;
    }
    @keyframes special-blink {
      0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 4px 14px rgba(168,85,247,0.5); }
      50% { opacity: 0.35; transform: scale(1.08); box-shadow: 0 4px 22px rgba(255,77,141,0.7); }
    }

    .play-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 14px 16px 16px;
      padding: 12px;
      border-radius: 14px;
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.05rem;
      color: white;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(0,0,0,0.2);
      transition: transform 0.1s, box-shadow 0.1s;
      text-decoration: none;
      text-align: center;
    }
    .play-btn:hover {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.2);
    }
    .play-btn:active {
      transform: translateY(4px);
      box-shadow: none;
    }

    /* MODAL - TAM EKRAN */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
    }
    .modal-overlay.active {
      display: block;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
    }

    /* Floating butonlar - sağ üst köşe */
    .modal-controls {
      position: fixed;
      top: 9vh;
      right: 8px;
      z-index: 10001;
      display: flex;
      gap: 10px;
    }
    .modal-btn {
      width: 35px;
      height: 35px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      font-weight: 900;
    }
    .modal-btn:hover { transform: scale(1.1); }
    .modal-btn:active { transform: scale(0.93); }
    .modal-btn-close  { background: #FF4D8D; color: white; }

    .modal-body {
      position: fixed;
      inset: 0;
    }
    .modal-body iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 30px;
      font-weight: 700;
      color: #aaa;
      font-size: 0.9rem;
      position: relative;
      z-index: 1;
    }
    footer span {
      color: var(--pink);
    }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      header { padding: 16px 20px; }
      .logo { font-size: 1.7rem; }
      .hero { padding: 30px 16px 20px; }
      main { padding: 10px 14px 40px; }
      .game-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
      .game-thumb { height: 110px; font-size: 3rem; }
      .modal-body iframe { min-height: 340px; }
    }
    /* CONFETTI */
    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -10px;
      z-index: 9999;
      pointer-events: none;
      border-radius: 2px;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
      80%  { opacity: 1; }
      100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
    }

    /* ---- Hece Smaçı kart animasyonu ---- */
    .hece-smaci-thumb {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .hs-sahne { width: 100%; height: 100%; }
    .hs-file  { animation: hsFileTitre 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    @keyframes hsFileTitre {
      0%, 68%, 100% { transform: none; }
      72% { transform: translateY(1.5px) scaleY(.985); }
      78% { transform: translateY(-1px) scaleY(1.01); }
      84% { transform: none; }
    }
    .hs-top { animation: hsUcus 3.4s cubic-bezier(.38,0,.5,1) infinite; }
    @keyframes hsUcus {
      0%   { transform: translate(42px,124px); opacity: 0; }
      7%   { opacity: 1; }
      22%  { transform: translate(76px,76px); }
      42%  { transform: translate(116px,52px); }
      62%  { transform: translate(158px,82px); }
      73%  { transform: translate(186px,114px); opacity: 1; }
      80%  { transform: translate(196px,130px); opacity: 0; }
      100% { transform: translate(42px,124px); opacity: 0; }
    }
    .hs-top-don { transform-box: fill-box; transform-origin: center; animation: hsDonme 1.5s linear infinite; }
    @keyframes hsDonme { to { transform: rotate(360deg); } }
    .hs-golge { animation: hsGolge 3.4s cubic-bezier(.38,0,.5,1) infinite; }
    @keyframes hsGolge {
      0%   { transform: translate(42px,138px) scale(.9); opacity: 0; }
      7%   { opacity: .45; }
      22%  { transform: translate(76px,136px) scale(.62); opacity: .26; }
      42%  { transform: translate(116px,134px) scale(.5); opacity: .2; }
      62%  { transform: translate(158px,136px) scale(.7); opacity: .3; }
      73%  { transform: translate(186px,140px) scale(1); opacity: .45; }
      80%, 100% { transform: translate(196px,142px) scale(1); opacity: 0; }
    }
    .hs-patlama { transform-box: fill-box; transform-origin: center; opacity: 0;
                  animation: hsPatla 3.4s ease-out infinite; }
    @keyframes hsPatla {
      0%, 70%  { transform: translate(186px,114px) scale(.2); opacity: 0; }
      75%      { transform: translate(186px,114px) scale(1.2); opacity: 1; }
      86%      { transform: translate(186px,114px) scale(1.55); opacity: 0; }
      100%     { transform: translate(186px,114px) scale(.2); opacity: 0; }
    }
    .hs-hece { transform-box: fill-box; transform-origin: center; opacity: 0; }
    .hs-hece1 { animation: hsHece1 3.4s ease-in-out infinite; }
    .hs-hece2 { animation: hsHece2 3.4s ease-in-out infinite; }
    @keyframes hsHece1 {
      0%   { transform: translate(30px,66px) scale(.4); opacity: 0; }
      12%  { transform: translate(30px,52px) scale(1.12); opacity: 1; }
      20%  { transform: translate(30px,54px) scale(1); opacity: 1; }
      52%  { transform: translate(30px,50px) scale(1); opacity: 1; }
      60%  { transform: translate(30px,44px) scale(.75); opacity: 0; }
      100% { transform: translate(30px,66px) scale(.4); opacity: 0; }
    }
    @keyframes hsHece2 {
      0%, 26% { transform: translate(30px,110px) scale(.4); opacity: 0; }
      38%     { transform: translate(30px,96px) scale(1.12); opacity: 1; }
      46%     { transform: translate(30px,98px) scale(1); opacity: 1; }
      78%     { transform: translate(30px,94px) scale(1); opacity: 1; }
      88%     { transform: translate(30px,88px) scale(.75); opacity: 0; }
      100%    { transform: translate(30px,110px) scale(.4); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .hs-top, .hs-golge, .hs-patlama, .hs-hece, .hs-top-don, .hs-file { animation: none; }
      .hs-top   { transform: translate(116px,52px); opacity: 1; }
      .hs-golge { transform: translate(116px,134px) scale(.6); opacity: .22; }
      .hs-hece1 { transform: translate(30px,52px); opacity: 1; }
      .hs-hece2 { transform: translate(30px,96px); opacity: 1; }
    }

    /* ---- Sağlıklı Can kart animasyonu ---- */
    .saglikli-can-thumb { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .saglikli-can-thumb svg { width: 100%; height: 100%; }
    .sc-can { animation: scZipla 1.8s ease-in-out infinite; }
    @keyframes scZipla { 0%,60%,100% { transform: translateY(0); } 75% { transform: translateY(-9px); } }
    .sc-dolgu { transform-box: fill-box; transform-origin: left center; animation: scDol 3.6s ease-in-out infinite; }
    .sc-dolgu:nth-of-type(2) { animation-delay: .9s; } .sc-dolgu:nth-of-type(3) { animation-delay: 1.8s; } .sc-dolgu:nth-of-type(4) { animation-delay: 2.7s; }

// ============================================================
// SAYFA OLUŞTURMA
// ============================================================
function buildPage() {
  const main = document.getElementById('main-content');
  main.innerHTML = '';

  categories.forEach((cat, ci) => {
    const section = document.createElement('section');
    section.className = 'category-section';
    section.style.animationDelay = `${ci * 0.12}s`;

    // Category header
    const header = document.createElement('div');
    header.className = 'category-header';
    header.innerHTML = `
      <div class="category-icon" style="background:${cat.iconBg}">${cat.name.split(' ')[0]}</div>
      <div>
        <div class="category-title">${cat.name.slice(cat.name.indexOf(' ')+1)}</div>
        <div class="category-count">${cat.games.length} oyun</div>
      </div>
      <div class="category-line" style="background:${cat.lineColor}"></div>
    `;

    // Game grid
    const grid = document.createElement('div');
    grid.className = 'game-grid';

    cat.games.forEach((game, gi) => {
      const card = document.createElement('div');
      card.className = 'game-card';
      card.style.borderColor = cat.color + '33';
      card.style.animationDelay = `${ci * 0.1 + gi * 0.08}s`;
      card.innerHTML = `
        <div class="game-thumb" style="background:${game.thumbBg}">
          ${game.customThumb || game.emoji}
          ${game.isNew ? '<div class="new-badge">✨ Yeni!</div>' : ''}
          ${game.isSpecial ? '<div class="special-badge">⭐ ÖZEL ETKİNLİK</div>' : ''}
        </div>
        <div class="game-info">
          <div class="game-name">${game.name}</div>
          <div class="game-desc">${game.desc}</div>
          ${game.sinif ? `<div class="game-sinif">🎒 ${game.sinif}</div>` : ''}
        </div>
        <div class="play-btn" style="background:${cat.iconBg}" data-file="${game.file}" data-name="${game.name}" onclick="openGame(this.dataset.file, this.dataset.name)">
          ▶ Oyna!
        </div>
      `;
      grid.appendChild(card);
    });

    section.appendChild(header);
    section.appendChild(grid);
    main.appendChild(section);
  });
}

// ============================================================
// MODAL
// ============================================================
function openGame(file, name) {
  document.getElementById('game-frame').src = file;
  document.getElementById('modal-overlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function reloadGame() {
  const f = document.getElementById('game-frame');
  f.src = f.src;
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('active');
  document.getElementById('game-frame').src = '';
  document.body.style.overflow = '';
}

document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ============================================================
// FLOATING EMOJIS
// ============================================================
function addFloaties() {
  const emojis = ['🎮','⭐','🎯','🏆','🎲','🕹️','🎪','🌟','💫','🎉'];
  const container = document.getElementById('floaties');
  for (let i = 0; i < 14; i++) {
    const el = document.createElement('div');
    el.className = 'floatie';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.animationDuration = (12 + Math.random() * 20) + 's';
    el.style.animationDelay = (Math.random() * 20) + 's';
    el.style.fontSize = (1.5 + Math.random() * 2) + 'rem';
    container.appendChild(el);
  }
}

// ============================================================
// KONFETİ — Sadece ilk açılışta
// ============================================================
function launchConfetti() {
  const colors = ['#FF6B35','#FFD600','#FF4D8D','#00C9A7','#4D9FFF','#A855F7','#fff'];
  for (let i = 0; i < 120; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.width  = (6 + Math.random() * 8) + 'px';
    el.style.height = (6 + Math.random() * 8) + 'px';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    const dur = 2.5 + Math.random() * 2.5;
    const delay = Math.random() * 1.8;
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = delay + 's';
    if (Math.random() > 0.5) el.style.borderRadius = '50%';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), (dur + delay) * 1000 + 200);
  }
}

buildPage();
addFloaties();

// Konfeti sadece sayfaya ilk girişte
if (!sessionStorage.getItem('confettiShown')) {
  sessionStorage.setItem('confettiShown', '1');
  setTimeout(launchConfetti, 200);
}
