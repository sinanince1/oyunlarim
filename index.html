  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --yellow: #FFD600;
      --orange: #FF6B35;
      --pink: #FF4D8D;
      --teal: #00C9A7;
      --blue: #4D9FFF;
      --purple: #A855F7;
      --bg: #FFF8F0;
      --card-shadow: 0 8px 0px rgba(0,0,0,0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 10% 20%, #FFE08A33 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, #FF4D8D22 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, #4D9FFF11 0%, transparent 60%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #FF6B35, #FF4D8D, #A855F7);
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      box-shadow: 0 6px 0 rgba(0,0,0,0.15);
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute;
      top: -30px; right: -30px;
      width: 160px; height: 160px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
    }
    header::after {
      content: '';
      position: absolute;
      bottom: -50px; left: 30%;
      width: 200px; height: 200px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
    }

    .logo {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 2.2rem;
      color: white;
      text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo span { font-size: 2.4rem; }
    .logo-img {
      height: 48px;
      width: 48px;
      object-fit: contain;
      filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.2));
    }
    @media (max-width: 600px) {
      .logo-img { height: 38px; width: 38px; }
    }

    .header-badges {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;

// ============================================================
// SAYFA OLUŞTURMA
// ============================================================
function buildPage() {
  const main = document.getElementById('main-content');
  main.innerHTML = '';

  categories.forEach((cat, ci) => {
    const section = document.createElement('section');
    section.className = 'category-section';
    section.style.animationDelay = `${ci * 0.12}s`;

    // Category header
    const header = document.createElement('div');
    header.className = 'category-header';
    header.innerHTML = `
      <div class="category-icon" style="background:${cat.iconBg}">${cat.name.split(' ')[0]}</div>
      <div>
        <div class="category-title">${cat.name.slice(cat.name.indexOf(' ')+1)}</div>
        <div class="category-count">${cat.games.length} oyun</div>
      </div>
      <div class="category-line" style="background:${cat.lineColor}"></div>
    `;

    // Game grid
    const grid = document.createElement('div');
    grid.className = 'game-grid';

    cat.games.forEach((game, gi) => {
      const card = document.createElement('div');
      card.className = 'game-card';
      card.style.borderColor = cat.color + '33';
      card.style.animationDelay = `${ci * 0.1 + gi * 0.08}s`;
      card.innerHTML = `
        <div class="game-thumb" style="background:${game.thumbBg}">
          ${game.customThumb || game.emoji}
          ${game.isNew ? '<div class="new-badge">✨ Yeni!</div>' : ''}
          ${game.isSpecial ? '<div class="special-badge">⭐ ÖZEL ETKİNLİK</div>' : ''}
        </div>
        <div class="game-info">
          <div class="game-name">${game.name}</div>
          <div class="game-desc">${game.desc}</div>
          ${game.sinif ? `<div class="game-sinif">🎒 ${game.sinif}</div>` : ''}
        </div>
        <div class="play-btn" style="background:${cat.iconBg}" data-file="${game.file}" data-name="${game.name}" onclick="openGame(this.dataset.file, this.dataset.name)">
          ▶ Oyna!
        </div>
      `;
      grid.appendChild(card);
    });

    section.appendChild(header);
    section.appendChild(grid);
    main.appendChild(section);
  });
}

// ============================================================
// MODAL
// ============================================================
function openGame(file, name) {
  document.getElementById('game-frame').src = file;
  document.getElementById('modal-overlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function reloadGame() {
  const f = document.getElementById('game-frame');
  f.src = f.src;
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('active');
  document.getElementById('game-frame').src = '';
  document.body.style.overflow = '';
}

document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ============================================================
// FLOATING EMOJIS
// ============================================================
function addFloaties() {
  const emojis = ['🎮','⭐','🎯','🏆','🎲','🕹️','🎪','🌟','💫','🎉'];
  const container = document.getElementById('floaties');
  for (let i = 0; i < 14; i++) {
    const el = document.createElement('div');
    el.className = 'floatie';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.animationDuration = (12 + Math.random() * 20) + 's';
    el.style.animationDelay = (Math.random() * 20) + 's';
    el.style.fontSize = (1.5 + Math.random() * 2) + 'rem';
    container.appendChild(el);
  }
}

// ============================================================
// KONFETİ — Sadece ilk açılışta
// ============================================================
function launchConfetti() {
  const colors = ['#FF6B35','#FFD600','#FF4D8D','#00C9A7','#4D9FFF','#A855F7','#fff'];
  for (let i = 0; i < 120; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.width  = (6 + Math.random() * 8) + 'px';
    el.style.height = (6 + Math.random() * 8) + 'px';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    const dur = 2.5 + Math.random() * 2.5;
    const delay = Math.random() * 1.8;
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = delay + 's';
    if (Math.random() > 0.5) el.style.borderRadius = '50%';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), (dur + delay) * 1000 + 200);
  }
}

buildPage();
addFloaties();

// Konfeti sadece sayfaya ilk girişte
if (!sessionStorage.getItem('confettiShown')) {
  sessionStorage.setItem('confettiShown', '1');
  setTimeout(launchConfetti, 200);
}
