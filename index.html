  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --yellow: #FFD600;
      --orange: #FF6B35;
      --pink: #FF4D8D;
      --teal: #00C9A7;
      --blue: #4D9FFF;
      --purple: #A855F7;
      --bg: #FFF8F0;
      --card-shadow: 0 8px 0px rgba(0,0,0,0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 10% 20%, #FFE08A33 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, #FF4D8D22 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, #4D9FFF11 0%, transparent 60%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #FF6B35, #FF4D8D, #A855F7);
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      box-shadow: 0 6px 0 rgba(0,0,0,0.15);
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute;
      top: -30px; right: -30px;
      width: 160px; height: 160px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
    }
    header::after {
      content: '';
      position: absolute;
      bottom: -50px; left: 30%;
      width: 200px; height: 200px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
    }

    .logo {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 2.2rem;
      color: white;
      text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo span { font-size: 2.4rem; }
    .logo-img {
      height: 48px;
      width: 48px;
      object-fit: contain;
      filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.2));
    }
    @media (max-width: 600px) {
      .logo-img { height: 38px; width: 38px; }
    }

    .header-badges {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }

    .about-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: white;
      color: var(--pink);
      font-weight: 900;
      font-size: 0.95rem;
      text-decoration: none;
      padding: 10px 22px;
      border-radius: 999px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.15);
      transition: transform 0.2s, box-shadow 0.2s;
      white-space: nowrap;
    }
    .about-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    }
    .about-btn:active {
      transform: translateY(1px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.15);
    }
    .arama-kutu {
      display: flex; align-items: center; gap: 6px;
      background: white; border-radius: 999px; padding: 6px 8px 6px 14px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    }
    .arama-kutu input {
      font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.95rem;
      border: none; outline: none; background: transparent; color: #2D2D2D;
      width: 150px; transition: width .2s;
    }
    .arama-kutu input:focus { width: 200px; }
    .arama-kutu input::placeholder { color: #B9AEA0; font-weight: 700; }
    .arama-kutu button {
      border: none; cursor: pointer; width: 30px; height: 30px; border-radius: 50%;
      background: linear-gradient(135deg, #A855F7, #FF4D8D); color: #fff; font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
    }
    .arama-kutu button[hidden] { display: none; }
    @media (max-width: 600px) { .arama-kutu input, .arama-kutu input:focus { width: 110px; } }
    .badge {
      background: rgba(255,255,255,0.22);
      border: 2px solid rgba(255,255,255,0.4);
      color: white;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 6px 16px;
      border-radius: 999px;
      backdrop-filter: blur(4px);
    }

    /* HERO */
    .hero {
      text-align: center;
      padding: 50px 20px 30px;
    }
    .hero h2 {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: #2D2D2D;
      line-height: 1.2;
    }
    .hero h2 em {
      font-style: normal;
      background: linear-gradient(135deg, var(--orange), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero p {
      font-size: 1.15rem;
      color: #666;
      margin-top: 12px;
      font-weight: 600;
    }

    /* FLOATING SHAPES */
    .floaties {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .floatie {
      position: absolute;
      font-size: 2rem;
      opacity: 0.08;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0%   { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.08; }
      90%  { opacity: 0.08; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    /* MAIN CONTENT */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 20px 60px;
      position: relative;
      z-index: 1;
    }

    /* CATEGORY SECTION */
    .category-section {
      margin-bottom: 50px;
    }
    .category-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }
    .category-icon {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      box-shadow: 0 4px 0 rgba(0,0,0,0.15);
      flex-shrink: 0;
    }
    .category-title {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.75rem;
      color: #2D2D2D;
    }
    .category-count {
      font-size: 0.9rem;
      font-weight: 700;
      color: #999;
      margin-top: 2px;
    }
    .category-line {
      flex: 1;
      height: 3px;
      border-radius: 99px;
      margin-left: 8px;
    }

    /* GAME GRID */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 22px;
    }

    /* --- Yapı Ustaları thumbnail (3B cisimlerle kurulan yapı) --- */
    .yapi-ustalari-thumb {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .yut-sahne { width: 100%; height: 100%; }
    .yut-zemin { opacity: .95; }
    /* Parçalar sırayla yukarıdan düşüp yerine oturur, sonra yapı yeniden kurulur */
    .yut-p { opacity: 0; animation: yutKur 5s ease-in-out infinite; }
    .yut-p1 { animation-delay: 0s; }
    .yut-p2 { animation-delay: .32s; }
    .yut-p3 { animation-delay: .64s; }
    .yut-p4 { animation-delay: .96s; }
    @keyframes yutKur {
      0%        { opacity: 0; transform: translateY(-56px); }
      6%        { opacity: 1; }
      13%       { transform: translateY(0); }
      16%       { transform: translateY(-5px); }
      19%, 84%  { opacity: 1; transform: translateY(0); }
      93%, 100% { opacity: 0; transform: translateY(-16px); }
    }
    /* Arka planda süzülen cisimler */
    .yut-f { opacity: .28; animation: yutSuzul 6.5s ease-in-out infinite; }
    .yut-f2 { animation-delay: -1.5s; }
    .yut-f3 { animation-delay: -3.0s; }
    .yut-f4 { animation-delay: -4.4s; }
    @keyframes yutSuzul {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-16px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .yut-p { opacity: 1; animation: none; }
      .yut-f { animation: none; }
    }

    /* --- Şekil Robotu thumbnail (dans eden robot) --- */
    .sekil-robot-thumb {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .sekil-robot-thumb .srt-s {          /* arka planda süzülen geometrik şekiller */
      position: absolute;
      opacity: .5;
      animation: srtSuzul 4.5s ease-in-out infinite;
    }
    .srt-kare {
      width: 22px; height: 22px; border-radius: 4px;
      background: #f5b942; left: 14%; top: 22%;
      animation-delay: -.4s;
    }
    .srt-daire {
      width: 20px; height: 20px; border-radius: 50%;
      background: #e0559a; right: 13%; top: 18%;
      animation-delay: -2.2s;
    }
    .srt-dikdortgen {
      width: 30px; height: 15px; border-radius: 4px;
      background: #4aab6b; right: 10%; bottom: 20%;
      animation-delay: -1.3s;
    }
    .srt-ucgen {
      width: 0; height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-bottom: 21px solid #4f8ce8;
      left: 10%; bottom: 18%;
      animation-delay: -3.1s;
    }
    @keyframes srtSuzul {
      0%, 100% { transform: translateY(0)    rotate(0deg); }
      50%      { transform: translateY(-9px) rotate(12deg); }
    }
    .srt-robot {
      position: relative; z-index: 1;
      height: 128px; width: auto;
      filter: drop-shadow(0 4px 8px rgba(22,35,58,.28));
      animation: srtDans 0.9s ease-in-out infinite;
      transform-origin: 50% 92%;
    }
    @keyframes srtDans {                 /* gövde zıplar ve hafifçe yalpalar */
      0%, 100% { transform: translateY(0)    rotate(-3deg); }
      25%      { transform: translateY(-6px) rotate(0deg); }
      50%      { transform: translateY(0)    rotate(3deg); }
      75%      { transform: translateY(-6px) rotate(0deg); }
    }
    /* Uzuvlar kendi ekleminden döner */
    .srt-kol-sag { transform-origin: 216px 206px; animation: srtKol 0.9s ease-in-out infinite; }
    .srt-kol-sol { transform-origin:  84px 206px; animation: srtKol 0.9s ease-in-out infinite; animation-delay: -.45s; }
    .srt-bacak-sag { transform-origin: 180px 286px; animation: srtBacak 0.9s ease-in-out infinite; animation-delay: -.45s; }
    .srt-bacak-sol { transform-origin: 120px 286px; animation: srtBacak 0.9s ease-in-out infinite; }
    .srt-kafa { transform-origin: 150px 152px; animation: srtKafa 1.8s ease-in-out infinite; }
    @keyframes srtKol   { 0%,100% { transform: rotate(-30deg); } 50% { transform: rotate(30deg); } }
    @keyframes srtBacak { 0%,100% { transform: rotate(-13deg); } 50% { transform: rotate(13deg); } }
    @keyframes srtKafa  { 0%,100% { transform: rotate(-6deg);  } 50% { transform: rotate(6deg);  } }
    @media (prefers-reduced-motion: reduce) {
      .sekil-robot-thumb .srt-s, .srt-robot,
      .srt-kol-sag, .srt-kol-sol, .srt-bacak-sag, .srt-bacak-sol, .srt-kafa { animation: none; }
    }

    /* --- Dino'nun Roketi thumbnail --- */
    .dino-roket-thumb {
      position: absolute; inset: 0;
      display: flex; align-items: flex-end; justify-content: center;
      gap: 2px; padding-bottom: 8px;
      overflow: hidden;
    }
    .drt-yildizlar {
      position: absolute; inset: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 12% 18%, #fff 50%, transparent 50%),
        radial-gradient(1px 1px at 28% 42%, #fff 50%, transparent 50%),
        radial-gradient(1.5px 1.5px at 45% 12%, #fff 50%, transparent 50%),
        radial-gradient(1px 1px at 62% 35%, #fff 50%, transparent 50%),
        radial-gradient(2px 2px at 78% 15%, #FFD84D 50%, transparent 50%),
        radial-gradient(1px 1px at 88% 48%, #fff 50%, transparent 50%),
        radial-gradient(1.5px 1.5px at 35% 65%, #fff 50%, transparent 50%),
        radial-gradient(1px 1px at 72% 58%, #fff 50%, transparent 50%),
        radial-gradient(1.5px 1.5px at 92% 72%, #fff 50%, transparent 50%),
        radial-gradient(1px 1px at 18% 75%, #fff 50%, transparent 50%),
        radial-gradient(2px 2px at 55% 78%, #FFD84D 50%, transparent 50%),
        radial-gradient(1px 1px at 8% 55%, #fff 50%, transparent 50%);
      animation: drtTwinkle 3s ease-in-out infinite alternate;
    }
    @keyframes drtTwinkle {
      0%   { opacity: .6; }
      100% { opacity: 1; }
    }
    .drt-dino {
      position: relative; z-index: 1;
      width: 82px; height: auto;
      animation: drtBounce 2.2s ease-in-out infinite;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,.4));
    }
    @keyframes drtBounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      30%      { transform: translateY(-6px) rotate(-3deg); }
      60%      { transform: translateY(-2px) rotate(2deg); }
    }
    .drt-dino .drt-kol-sol { animation: drtArmL 2.2s ease-in-out infinite; }
    .drt-dino .drt-kol-sag { animation: drtArmR 2.2s ease-in-out infinite; }
    @keyframes drtArmL { 0%,100%{ transform:rotate(0) } 50%{ transform:rotate(-18deg) } }
    @keyframes drtArmR { 0%,100%{ transform:rotate(0) } 50%{ transform:rotate(18deg) } }
    .drt-roket {
      position: relative; z-index: 1;
      width: 54px; height: auto;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,.5));
      animation: drtRocketGlow 2s ease-in-out infinite alternate;
    }
    @keyframes drtRocketGlow {
      0%   { filter: drop-shadow(0 3px 8px rgba(0,0,0,.5)); }
      100% { filter: drop-shadow(0 3px 12px rgba(255,216,77,.5)); }
    }

        /* GAME CARD */
    .game-card {
      background: white;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      border: 3px solid transparent;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      cursor: pointer;
      text-decoration: none;
      display: block;
      position: relative;
    }
    .game-card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 16px 0px rgba(0,0,0,0.12);
    }

    .game-thumb {
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      position: relative;
      overflow: hidden;
    }
    .game-thumb::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.1));
    }

    .game-info {
      padding: 16px;
    }
    .game-name {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.2rem;
      color: #2D2D2D;
      margin-bottom: 6px;
    }
    .game-desc {
      font-size: 0.85rem;
      color: #777;
      line-height: 1.5;
      font-weight: 600;
    }
    .game-sinif {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.78rem;
      font-weight: 800;
      color: #999;
      background: #F5F5F5;
      padding: 3px 10px;
      border-radius: 999px;
    }

    .new-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: linear-gradient(135deg, #FF4D8D, #FF6B35);
      color: white;
      font-weight: 900;
      font-size: 1.05rem;
      padding: 9px 18px;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(255, 77, 141, 0.55);
      animation: pulse-scale 2s ease-in-out infinite;
      z-index: 10;
    }
    @keyframes pulse-scale {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.1);
        opacity: 0.8;
      }
    }

    .special-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: linear-gradient(135deg, #A855F7, #FF4D8D);
      color: white;
      font-weight: 900;
      font-size: 0.78rem;
      padding: 6px 12px;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(168, 85, 247, 0.5);
      animation: special-blink 1.1s ease-in-out infinite;
      z-index: 10;
      white-space: nowrap;
    }
    @keyframes special-blink {
      0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 4px 14px rgba(168,85,247,0.5); }
      50% { opacity: 0.35; transform: scale(1.08); box-shadow: 0 4px 22px rgba(255,77,141,0.7); }
    }

    .play-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 14px 16px 16px;
      padding: 12px;
      border-radius: 14px;
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.05rem;
      color: white;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(0,0,0,0.2);
      transition: transform 0.1s, box-shadow 0.1s;
      text-decoration: none;
      text-align: center;
    }
    .play-btn { width: calc(100% - 32px); }
    .play-btn:focus-visible { outline: 3px solid #2D2D2D; outline-offset: 2px; }
    .game-card.uyku .game-thumb * { animation-play-state: paused !important; }
    .play-btn:hover {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.2);
    }
    .play-btn:active {
      transform: translateY(4px);
      box-shadow: none;
    }

    /* MODAL - TAM EKRAN */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
    }
    .modal-overlay.active {
      display: block;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
    }

    /* Floating butonlar - sağ üst köşe */
    .modal-controls {
      position: fixed;
      top: 9vh;
      right: 8px;
      z-index: 10001;
      display: flex;
      gap: 10px;
    }
    .modal-btn {
      width: 35px;
      height: 35px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      font-weight: 900;
    }
    .modal-btn:hover { transform: scale(1.1); }
    .modal-btn:active { transform: scale(0.93); }
    .modal-btn-close  { background: #FF4D8D; color: white; }
    .modal-btn-tam    { background: #4D9FFF; color: white; }

    .modal-body {
      position: fixed;
      inset: 0;
    }
    .modal-body iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 30px;
      font-weight: 700;
      color: #aaa;
      font-size: 0.9rem;
      position: relative;
      z-index: 1;
    }
    footer span {
      color: var(--pink);
    }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      header { padding: 16px 20px; }
      .logo { font-size: 1.7rem; }
      .hero { padding: 30px 16px 20px; }
      main { padding: 10px 14px 40px; }
      .game-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
      .game-thumb { height: 110px; font-size: 3rem; }
      .modal-body iframe { min-height: 340px; }
    }
    /* CONFETTI */
    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -10px;
      z-index: 9999;
      pointer-events: none;
      border-radius: 2px;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
      80%  { opacity: 1; }
      100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
    }

    /* ---- Kasa Ustası kart animasyonu: rakamlar çözümlenir, çark döner, kasa açılır ---- */
    .kasa-ustasi-thumb { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .ku-sahne { width: 100%; height: 100%; }
    .ku-teker { transform-box: fill-box; transform-origin: center; animation: kuTeker 6s ease-in-out infinite; }
    @keyframes kuTeker { 0%, 30% { transform: rotate(0deg); } 42%, 100% { transform: rotate(270deg); } }
    .ku-kapi { transform-box: view-box; transform-origin: 24px 75px; animation: kuKapi 6s ease-in-out infinite; }
    @keyframes kuKapi { 0%, 44% { transform: scaleX(1); } 54%, 76% { transform: scaleX(.12); } 86%, 100% { transform: scaleX(1); } }
    .ku-p1 { opacity: 0; animation: kuP1 6s linear infinite; }
    .ku-p2 { opacity: 0; animation: kuP2 6s linear infinite; }
    @keyframes kuP1 { 0%, 8% { opacity: 0; } 12%, 88% { opacity: 1; } 94%, 100% { opacity: 0; } }
    @keyframes kuP2 { 0%, 20% { opacity: 0; } 24%, 88% { opacity: 1; } 94%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .ku-teker, .ku-kapi, .ku-p1, .ku-p2 { animation: none; }
      .ku-p1, .ku-p2 { opacity: 1; }
    }
    /* ---- Sözcük Müzesi kart animasyonu: kart vitrinden çıkar, mecaz anlam salonuna girer, kapı ışır ---- */
    .sozcuk-muzesi-thumb { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .sozcuk-muzesi-thumb svg { width: 100%; height: 100%; }
    .sm-kart { animation: smKart 5s ease-in-out infinite; }
    @keyframes smKart {
      0%        { transform: translate(120px, 16px) scale(1); opacity: 0; }
      8%, 28%   { transform: translate(120px, 30px) scale(1); opacity: 1; }
      36%       { transform: translate(120px, 46px) scale(1.06); opacity: 1; }
      58%, 100% { transform: translate(120px, 100px) scale(.25); opacity: 0; }
    }
    .sm-isik { opacity: 0; animation: smIsik 5s ease-in-out infinite; }
    @keyframes smIsik { 0%, 54% { opacity: 0; } 62%, 82% { opacity: 1; } 92%, 100% { opacity: 0; } }
    .sm-kapak { transform-box: fill-box; transform-origin: center top; transform: scaleY(0); animation: smKirp 4s infinite; }
    @keyframes smKirp { 0%, 90%, 100% { transform: scaleY(0); } 94% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) {
      .sm-kart { animation: none; transform: translate(120px, 30px); opacity: 1; }
      .sm-isik, .sm-kapak { animation: none; }
    }
    /* ---- Kızak Pisti kart animasyonu: penguen tepeden 4.400 istasyonuna kayar ---- */
    .kizak-pisti-thumb { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .kizak-pisti-thumb svg { width: 100%; height: 100%; }
    .kp-kizak { animation: kpKay 5s ease-in-out infinite; }
    @keyframes kpKay {
      0%, 18%  { transform: translate(128px, 52px) rotate(0deg); }
      40%      { transform: translate(160px, 82px) rotate(28deg); }
      55%, 100% { transform: translate(188px, 108px) rotate(0deg); }
    }
    .kp-bayrak { animation: kpBayrak 5s linear infinite; }
    @keyframes kpBayrak { 0%, 52% { fill: #9DB3CF; } 58%, 100% { fill: #00C9A7; } }
    @media (prefers-reduced-motion: reduce) {
      .kp-kizak { animation: none; transform: translate(188px, 108px); }
      .kp-bayrak { animation: none; fill: #00C9A7; }
    }

// ============================================================
// SINIF SEÇİMİ
// Her oyunun sınıfı, "sinif" metnindeki sayılardan otomatik okunur
// ("1. - 2. Sınıf" → 1 ve 2). Gerekirse oyuna grades: [2,3] yazarak
// elle de belirtilebilir. "sinif" alanı olmayan oyun her sınıfta görünür.
// ============================================================
const SINIF_RENK = {
  1: { renk: '#F2A900', grad: 'linear-gradient(135deg,#FFD600,#FF9E2C)' },
  2: { renk: '#FF6B35', grad: 'linear-gradient(135deg,#FF6B35,#FF4D8D)' },
  3: { renk: '#00C9A7', grad: 'linear-gradient(135deg,#00C9A7,#4D9FFF)' },
  4: { renk: '#4D9FFF', grad: 'linear-gradient(135deg,#4D9FFF,#A855F7)' }
};
const KONU_SIRASI = ['Hayat Bilgisi', 'Türkçe', 'Matematik', 'Fen Bilimleri', 'PYP', 'Diğer Oyunlar'];

let seciliSinif = 2; // ilk girişte 2. sınıf açılır
try {
  const s = parseInt(localStorage.getItem('seciliSinif') || '2');
  if (s >= 1 && s <= 4) seciliSinif = s;
} catch (e) {}
// Adresten sınıf: sinanince.com/?sinif=3
{ const u = parseInt(new URLSearchParams(location.search).get('sinif')); if (u >= 1 && u <= 4) seciliSinif = u; }
function adresGuncelle() {
  try {
    const url = new URL(location.href);
    url.searchParams.set('sinif', seciliSinif);
    history.replaceState(null, '', url.pathname + url.search + url.hash);
  } catch (e) {}
}

// "Yeni" rozeti: eklenme tarihinden itibaren 14 gün otomatik görünür
const YENI_GUN = 14;
function yeniMi(o) {
  if (o.isNew) return true;
  if (!o.eklenme) return false;
  const fark = (Date.now() - new Date(o.eklenme + 'T00:00:00')) / 86400000;
  return fark >= 0 && fark < YENI_GUN;
}

// Ekranda olmayan kartların animasyonunu durdur (eski tahta/tablet için)
const kartGozcu = ('IntersectionObserver' in window) ? new IntersectionObserver(girdiler => {
  girdiler.forEach(g => g.target.classList.toggle('uyku', !g.isIntersecting));
}, { rootMargin: '150px 0px' }) : null;

// Arama: tüm sınıflarda ad, açıklama ve kazanımda arar
let aramaMetni = '';
const trKucuk = t => (t || '').replace(/İ/g, 'i').replace(/I/g, 'ı').toLocaleLowerCase('tr');
function aramaYap(metin, odak) {
  aramaMetni = (metin || '').trim();
  const inp = document.getElementById('arama');
  if (inp.value !== aramaMetni && !aramaMetni) inp.value = '';
  document.getElementById('arama-temizle').hidden = !aramaMetni;
  document.getElementById('arama-ikon').hidden = !!aramaMetni;
  buildPage();
  if (odak) inp.focus();
}
function aramaGruplari() {
  const q = trKucuk(aramaMetni);
  const gruplar = new Map();
  categories.concat(hiddenCategories).forEach(cat => {
    const oyunlar = cat.games.filter(o => trKucuk(o.name + ' ' + o.desc + ' ' + oyunBecerisi(o)).includes(q));
    if (!oyunlar.length) return;
    const ad = konuAdi(cat);
    if (!gruplar.has(ad)) gruplar.set(ad, Object.assign({}, cat, { name: ad, games: [] }));
    gruplar.get(ad).games.push(...oyunlar.filter(o => !gruplar.get(ad).games.includes(o)));
  });
  return [...gruplar.values()].sort((a, b) => konuSira(a.name) - konuSira(b.name));
}

function oyunSiniflari(oyun) {
  if (oyun.grades) return oyun.grades;
  const s = (oyun.sinif || '').split('—')[0];
  const sayilar = (s.match(/[1-4]/g) || []).map(Number);
  if (!sayilar.length) return [1, 2, 3, 4];
  if (s.includes('-') && sayilar.length >= 2) {
    const a = Math.min(...sayilar), b = Math.max(...sayilar), r = [];
    for (let i = a; i <= b; i++) r.push(i);
    return r;
  }
  return [...new Set(sayilar)];
}

// 3.-4. sınıf kategorileri sınıf görünümünde normal ders adlarıyla gösterilir
function konuAdi(cat) {
  if (cat.tetik) return cat.name.includes('Fen') ? '🔬 Fen Bilimleri' : '➕ Matematik';
  return cat.name;
}

// Oyunun kazanımı: önce oyundaki "beceri" alanı, yoksa sinif metninin
// "—" sonrası ("2. Sınıf — Hikâye unsurları" → "Hikâye unsurları")
function oyunBecerisi(o) {
  if (o.beceri) return o.beceri;
  const p = (o.sinif || '').split('—')[1];
  if (p) return p.replace(/\(.*?\)/g, '').trim();
  return 'Diğer';
}

function sinifSec(g) {
  seciliSinif = g;
  try { localStorage.setItem('seciliSinif', seciliSinif); } catch (e) {}
  adresGuncelle();
  filtreTemizle(true); // sınıf değişince kazanım filtresi sıfırlanır
  if (aramaMetni) { document.getElementById('arama').value = ''; aramaMetni = ''; aramaYap(''); return; }
  buildPage();
}

function sinifBarGuncelle() {
  document.querySelectorAll('.sinif-btn').forEach(btn => {
    const g = parseInt(btn.dataset.sinif);
    const r = SINIF_RENK[g];
    const secili = g === seciliSinif;
    btn.classList.toggle('secili', secili);
    btn.style.background = secili ? r.grad : '#fff';
    btn.style.borderColor = secili ? 'transparent' : r.renk;
    btn.style.color = secili ? '#fff' : r.renk;
  });
  const alt = document.getElementById('hero-alt');
  if (alt) alt.textContent = aramaMetni
    ? '"' + aramaMetni + '" için arama sonuçları (tüm sınıflar)'
    : seciliSinif + '. sınıf oyunları — favorini seç ve başla!';
  filtreBtnGuncelle();
}

// ============================================================
// SAYFA OLUŞTURMA
// ============================================================
const konuSira = n => { const i = KONU_SIRASI.findIndex(k => n.includes(k)); return i < 0 ? 99 : i; };

// Seçilen sınıfın oyunları, derslere ayrılmış gruplar halinde
function sinifGruplari(g) {
  const gruplar = new Map();
  categories.concat(hiddenCategories).forEach(cat => {
    const oyunlar = cat.games.filter(o => oyunSiniflari(o).includes(g));
    if (!oyunlar.length) return;
    const ad = konuAdi(cat);
    if (!gruplar.has(ad)) gruplar.set(ad, Object.assign({}, cat, { name: ad, games: [] }));
    gruplar.get(ad).games.push(...oyunlar);
  });
  return [...gruplar.values()].sort((a, b) => konuSira(a.name) - konuSira(b.name));
}

function buildPage() {
  const main = document.getElementById('main-content');
  main.innerHTML = '';
  let liste = aramaMetni ? aramaGruplari() : sinifGruplari(seciliSinif);
  if (seciliBeceriler.size && !aramaMetni) {
    liste = liste
      .map(cat => Object.assign({}, cat, { games: cat.games.filter(o => seciliBeceriler.has(oyunBecerisi(o))) }))
      .filter(cat => cat.games.length);
  }
  liste.forEach((cat, ci) => main.appendChild(makeSection(cat, ci)));
  if (!liste.length) {
    const bos = document.createElement('div');
    bos.className = 'sinif-bos';
    bos.textContent = aramaMetni ? '🔍 "' + aramaMetni + '" ile eşleşen oyun bulunamadı.' : '🚧 Bu sınıf için oyunlar çok yakında!';
    main.appendChild(bos);
  }
  sinifBarGuncelle();
}

// ============================================================
// KAZANIM FİLTRESİ
// ============================================================
let seciliDers = null;
const seciliBeceriler = new Set();

function filtreAcikMi() { return !document.getElementById('filtre-panel').hidden; }

function filtreAcKapa(zorla) {
  const panel = document.getElementById('filtre-panel');
  const ac = (typeof zorla === 'boolean') ? zorla : panel.hidden;
  panel.hidden = !ac;
  const btn = document.getElementById('filtre-btn');
  btn.classList.toggle('aktif', ac);
  btn.setAttribute('aria-expanded', ac);
  if (ac) filtrePanelCiz();
}

function filtreTemizle(sessiz) {
  seciliBeceriler.clear();
  seciliDers = null;
  if (!sessiz) {
    buildPage();
    if (filtreAcikMi()) filtrePanelCiz();
  }
}

function filtreBtnGuncelle() {
  const btn = document.getElementById('filtre-btn');
  if (!btn) return;
  btn.classList.toggle('dolu', seciliBeceriler.size > 0);
  btn.textContent = seciliBeceriler.size ? `🎯 Kazanım (${seciliBeceriler.size} seçili)` : '🎯 Kazanım Filtrele';
}

function filtrePanelCiz() {
  const dersler = sinifGruplari(seciliSinif);
  if (seciliDers && !dersler.some(d => d.name === seciliDers)) seciliDers = null;
  if (!seciliDers && dersler.length) seciliDers = dersler[0].name;

  // Sol: dersler
  const dEl = document.getElementById('filtre-dersler');
  dEl.innerHTML = '';
  dersler.forEach(d => {
    const b = document.createElement('button');
    b.className = 'filtre-ders-btn' + (d.name === seciliDers ? ' aktif' : '');
    b.textContent = d.name;
    if (d.name === seciliDers) b.style.background = d.iconBg;
    else { b.style.borderColor = d.color + '55'; }
    b.onclick = () => { seciliDers = d.name; filtrePanelCiz(); };
    dEl.appendChild(b);
  });

  // Sağ: seçili dersin bu sınıftaki kazanımları
  const bEl = document.getElementById('filtre-beceriler');
  bEl.innerHTML = '';
  const grup = dersler.find(d => d.name === seciliDers);
  if (!grup) return;
  const beceriler = new Map();
  grup.games.forEach(o => {
    const b = oyunBecerisi(o);
    beceriler.set(b, (beceriler.get(b) || 0) + 1);
  });
  [...beceriler.entries()].sort((a, b) => a[0].localeCompare(b[0], 'tr')).forEach(([ad, sayi]) => {
    const b = document.createElement('button');
    b.className = 'filtre-beceri-btn' + (seciliBeceriler.has(ad) ? ' secili' : '');
    b.innerHTML = `${seciliBeceriler.has(ad) ? '✅ ' : ''}${ad} <span class="filtre-beceri-sayi">${sayi} oyun</span>`;
    b.onclick = () => {
      seciliBeceriler.has(ad) ? seciliBeceriler.delete(ad) : seciliBeceriler.add(ad);
      buildPage();
      filtrePanelCiz();
    };
    bEl.appendChild(b);
  });
}

function makeSection(cat, ci) {
    const section = document.createElement('section');
    section.className = 'category-section';
    section.style.animationDelay = `${ci * 0.12}s`;

    // Category header
    const header = document.createElement('div');
    header.className = 'category-header';
    header.innerHTML = `
      <div class="category-icon" style="background:${cat.iconBg}">${cat.name.split(' ')[0]}</div>
      <div>
        <div class="category-title">${cat.name.slice(cat.name.indexOf(' ')+1)}</div>
        <div class="category-count">${cat.games.length} oyun</div>
      </div>
      <div class="category-line" style="background:${cat.lineColor}"></div>
    `;

    // Game grid
    const grid = document.createElement('div');
    grid.className = 'game-grid';

    cat.games.forEach((game, gi) => {
      const card = document.createElement('div');
      card.className = 'game-card';
      card.style.borderColor = cat.color + '33';
      card.style.animationDelay = `${ci * 0.1 + gi * 0.08}s`;
      card.innerHTML = `
        <div class="game-thumb" style="background:${game.thumbBg}">
          ${game.customThumb || `<div class="thumb-canli"><span class="ts ts1">✦</span><span class="ts ts2">✨</span><span class="ts ts3">✧</span><span class="thumb-emoji">${game.emoji || '🎮'}</span></div>`}
          ${yeniMi(game) ? '<div class="new-badge">✨ Yeni!</div>' : ''}
          ${game.isSpecial ? `<div class="special-badge">${game.ozelEtiket || '⭐ ÖZEL ETKİNLİK'}</div>` : ''}
        </div>
        <div class="game-info">
          <div class="game-name">${game.name}</div>
          <div class="game-desc">${game.desc}</div>
          ${game.sinif ? `<div class="game-sinif">🎒 ${game.sinif}</div>` : ''}
        </div>
        <button type="button" class="play-btn" style="background:${cat.iconBg}" data-file="${game.file}" data-name="${game.name}" onclick="openGame(this.dataset.file, this.dataset.name)" aria-label="${game.name} oyununu oyna">
          ▶ Oyna!
        </button>
      `;
      grid.appendChild(card);
      kartGozcu && kartGozcu.observe(card);
    });

    section.appendChild(header);
    section.appendChild(grid);
    return section;
}

const OYUN_KOK = /(^|\.)sinanince\.com$|github\.io$|^localhost$/.test(location.hostname) ? '' : 'https://sinanince.com/';
if (OYUN_KOK) { const l = document.querySelector('.logo-img'); if (l) l.src = OYUN_KOK + 'logo.png'; }

// ============================================================
// OYNANMA SAYACI — Firestore (hikayesehri projesi), koleksiyon: oyun_istatistik
// Sayfa yükünü artırmamak için Firebase yalnızca ilk oyun açılışında yüklenir.
// ============================================================
const FB_CONFIG = { apiKey: "AIzaSyCfG9-e_6DjyDnKhptvwgR0SIIjIl8NNsw", authDomain: "hikayesehri-3162b.firebaseapp.com", projectId: "hikayesehri-3162b" };
let fbDbSoz = null;
function fbDb() {
  if (fbDbSoz) return fbDbSoz;
  const yukle = src => new Promise((ok, hata) => { const e = document.createElement('script'); e.src = src; e.onload = ok; e.onerror = hata; document.head.appendChild(e); });
  fbDbSoz = yukle('https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js')
    .then(() => yukle('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js'))
    .then(() => { if (!firebase.apps.length) firebase.initializeApp(FB_CONFIG); return firebase.firestore(); });
  return fbDbSoz;
}
function oyunSay(file, name) {
  try {
    const d = new Date(), gun = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const inc = () => firebase.firestore.FieldValue.increment(1);
    fbDb().then(db => db.collection('oyun_istatistik').doc(file.replace(/\.html$/, '')).set({
      ad: name, dosya: file, toplam: inc(), gunluk: { [gun]: inc() }, son: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true })).catch(() => {});
  } catch (e) {}
}

function openGame(file, name) {
  oyunSay(file, name);
  document.getElementById('game-frame').src = OYUN_KOK + file;
  document.getElementById('modal-overlay').classList.add('active');
  document.body.style.overflow = 'hidden';
  // Adres: sinanince.com/#ac_timsah → bu oyunu doğrudan açar
  const id = file.replace(/\.html$/, '');
  if (location.hash !== '#' + id) history.replaceState(null, '', location.pathname + location.search + '#' + id);
}

function tamEkran() {
  const el = document.getElementById('modal-overlay');
  const f = document.getElementById('game-frame');
  if (document.fullscreenElement) { document.exitFullscreen && document.exitFullscreen(); return; }
  const istek = el.requestFullscreen || el.webkitRequestFullscreen;
  if (istek) istek.call(el).catch(() => {});
  else if (f.webkitEnterFullscreen) f.webkitEnterFullscreen(); // iOS Safari
}

// Adresteki #oyun_adi varsa o oyunu aç
function adrestenOyunAc() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (!id) return;
  const o = categories.concat(hiddenCategories).flatMap(c => c.games).find(g => g.file === id + '.html');
  if (o) openGame(o.file, o.name);
}
window.addEventListener('hashchange', () => { if (location.hash) adrestenOyunAc(); else closeModal(); });

function reloadGame() {
  const f = document.getElementById('game-frame');
  f.src = f.src;
}

function closeModal() {
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
  document.getElementById('modal-overlay').classList.remove('active');
  document.getElementById('game-frame').src = '';
  document.body.style.overflow = '';
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
}

document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function addFloaties() {

  const container = document.getElementById('floaties');

    el.style.animationDuration = (12 + Math.random() * 20) + 's';
    el.style.animationDelay = (Math.random() * 20) + 's';

// KONFETİ — Sadece ilk açılışta
// ============================================================
function launchConfetti() {
  const colors = ['#FF6B35','#FFD600','#FF4D8D','#00C9A7','#4D9FFF','#A855F7','#fff'];
  for (let i = 0; i < 120; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.width  = (6 + Math.random() * 8) + 'px';
    el.style.height = (6 + Math.random() * 8) + 'px';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    const dur = 2.5 + Math.random() * 2.5;
    const delay = Math.random() * 1.8;
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = delay + 's';
    if (Math.random() > 0.5) el.style.borderRadius = '50%';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), (dur + delay) * 1000 + 200);
  }
}

buildPage();
addFloaties();
adrestenOyunAc();

// Konfeti sadece sayfaya ilk girişte
if (!sessionStorage.getItem('confettiShown')) {
  sessionStorage.setItem('confettiShown', '1');
  setTimeout(launchConfetti, 200);
}
