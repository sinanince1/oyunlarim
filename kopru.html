<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sihirli Köprü İnşası 🌉</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;700;800;900&display=swap');

:root {
  --wood-brown: #8B5E3C;
  --wood-light: #C49A6C;
  --star-yellow: #FFD700;
  --correct-green: #2ECC71;
  --wrong-red: #E74C3C;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Nunito','Arial','Helvetica',sans-serif; min-height:100vh; overflow:hidden; user-select:none; background:#1a0a00; -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision; }

/* ── SCREENS ── */
.screen { position:fixed; inset:0; display:none; }
.screen.active { display:flex; }

/* ════════════════════════════════
   MENU
════════════════════════════════ */
#screen-menu {
  background:radial-gradient(ellipse at 50% 30%,#1B4F72 0%,#0D2137 60%,#050D18 100%);
  flex-direction:column; align-items:center; justify-content:center; gap:0;
}
#menu-stars { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.mstar { position:absolute; background:white; border-radius:50%; animation:twinkle 2s ease-in-out infinite; }
@keyframes twinkle { 0%,100%{opacity:.2;transform:scale(1)} 50%{opacity:1;transform:scale(1.4)} }

.menu-title-wrap { text-align:center; margin-bottom:28px; animation:titleFloat 3s ease-in-out infinite; }
@keyframes titleFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
.menu-char { font-size:clamp(3rem,8vw,5.5rem); display:block; margin-bottom:8px; animation:charBob 2s ease-in-out infinite; }
@keyframes charBob { 0%,100%{transform:translateY(0)rotate(-5deg)} 50%{transform:translateY(-12px)rotate(5deg)} }
.menu-title { font-family:'Baloo 2','Nunito','Arial Rounded MT Bold','Trebuchet MS',sans-serif; font-size:clamp(1.8rem,4.5vw,3.2rem); color:#FFD700; text-shadow:0 0 20px rgba(255,215,0,.6),3px 3px 0 rgba(0,0,0,.5); }
.menu-subtitle { font-family:'Baloo 2','Nunito','Arial Rounded MT Bold','Trebuchet MS',sans-serif; font-size:clamp(.9rem,1.8vw,1.3rem); color:#87CEFA; margin-top:5px; }

.menu-card {
  background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
  backdrop-filter:blur(10px); border:2px solid rgba(255,215,0,.3); border-radius:24px;
  padding:26px 34px; display:flex; flex-direction:column; align-items:center; gap:14px;
  box-shadow:0 8px 32px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1);
  min-width:min(340px,88vw);
}
.name-label { font-family:'Baloo 2','Nunito','Arial Rounded MT Bold','Trebuchet MS',sans-serif; font-size:1.05rem; color:#FFD700; align-self:flex-start; }
.name-input {
  width:100%; padding:11px 16px; border-radius:13px; border:2px solid rgba(255,215,0,.4);
  background:rgba(255,255,255,.1); color:white; font-family:'Nunito',sans-serif;
  font-size:1.15rem; font-weight:700; outline:none; transition:border-color .2s,background .2s;
}
.name-input::placeholder { color:rgba(255,255,255,.4); }
.name-input:focus { border-color:#FFD700; background:rgba(255,255,255,.15); }
.name-warning { font-weight:800; color:#FF8A80; font-size:.9rem; min-height:18px; }
.start-btn {
  background:linear-gradient(135deg,#FFD700,#FF8C00); border:3px solid #B8860B; border-radius:16px;
  padding:13px 40px; font-family:'Baloo 2','Nunito','Arial Rounded MT Bold','Trebuchet MS',sans-serif; font-size:clamp(1.2rem,2.5vw,1.6rem);
  color:#3B1F00; cursor:pointer; box-shadow:0 5px 0 #8B6914,0 8px 20px rgba(0,0,0,.4);
  transition:transform .15s,box-shadow .15s; width:100%;
}
.start-btn:hover { transform:translateY(-3px)scale(1.03); box-shadow:0 8px 0 #8B6914,0 12px 24px rgba(0,0,0,.4); }
.start-btn:active { transform:translateY(2px); box-shadow:0 2px 0 #8B6914; }

/* ════════════════════════════════
   MAP
════════════════════════════════ */
#screen-map { flex-direction:column; align-items:center; justify-content:center; overflow:hidden; }
.map-bg {
  position:absolute; inset:0;
  background-color:#D4A96A;
  background-image:
    radial-gradient(ellipse at 20% 20%,rgba(160,100,40,.3) 0%,transparent 50%),
    radial-gradient(ellipse at 80% 80%,rgba(100,60,20,.3) 0%,transparent 50%),
    radial-gradient(ellipse at 50% 50%,rgba(220,180,100,.5) 0%,transparent 70%),
    repeating-linear-gradient(45deg,transparent,transparent 40px,rgba(150,80,30,.04) 40px,rgba(150,80,30,.04) 41px),
    repeating-linear-gradient(-45deg,transparent,transparent 40px,rgba(150,80,30,.04) 40px,rgba(150,80,30,.04) 41px);
}
.map-frame { position:absolute; inset:10px; border:6px solid #8B5E3C; border-radius:18px; pointer-events:none; box-shadow:inset 0 0 40px rgba(100,50,10,.3),0 0 0 2px #C49A6C; }
.map-frame::before { content:''; position:absolute; inset:6px; border:2px dashed rgba(139,94,60,.4); border-radius:12px; }

.map-header { position:relative; z-index:5; text-align:center; padding:22px 0 6px; }
.map-title { font-family:'Baloo 2','Nunito','Arial Rounded MT Bold','Trebuchet MS',sans-serif; font-size:clamp(1.4rem,3vw,2.2rem); color:#3B1F00; text-shadow:1px 1px 0 rgba(255,200,100,.5); }
.map-player-name { font-family:'Baloo 2','Nunito','Arial Rounded MT Bold','Trebuchet MS',sans-serif; font-size:clamp(.9rem,1.8vw,1.2rem); color:#6B3F10; margin-top:4px; }

/* Horizontal map track */
.map-track {
  position:relative;
  z-index:5;
  width:min(900px,94vw);
  height:min(320px,45vh);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 clamp(16px,4vw,40px);
  margin-top:8px;
}

/* SVG path behind nodes */
.map-track-svg {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:visible;
  pointer-events:none;
}

/* Character start (left) and treasure (right) */
.map-endpoint {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  z-index:6;
  flex-shrink:0;
}
.map-endpoint .ep-emoji { font-size:clamp(2.4rem,5vw,4rem); filter:drop-shadow(2px 3px 5px rgba(0,0,0,.35)); }
.map-endpoint .ep-label { font-family:'Baloo 2','Nunito','Arial Rounded MT Bold','Trebuchet MS',sans-serif; font-size:clamp(.7rem,1.4vw,.95rem); color:#3B1F00; }

/* Node boxes */
.map-node {
  display:flex;
  flex-direction:column;
  align-items:center;
  cursor:pointer;
  transition:transform .2s;
  z-index:7;
  flex-shrink:0;
}
.map-node:hover .node-box.unlocked { transform:scale(1.06) translateY(-4px); }

.node-box {
  width:clamp(110px,17vw,160px);
  height:clamp(110px,17vw,160px);
  border-radius:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-family:'Baloo 2','Nunito','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  border:4px solid;
  box-shadow:0 6px 18px rgba(0,0,0,.3);
  position:relative;
  overflow:hidden;
  transition:all .3s;
  gap:4px;
}
.node-box.unlocked {
  background:linear-gradient(135deg,#6EE89A,#27AE60);
  border-color:#1A7A45;
  color:white;
  text-shadow:1px 1px 0 rgba(0,0,0,.3);
  animation:nodeGlow 2s ease-in-out infinite;
}
@keyframes nodeGlow {
  0%,100%{box-shadow:0 6px 18px rgba(0,0,0,.3)}
  50%{box-shadow:0 6px 18px rgba(0,0,0,.3),0 0 22px rgba(46,204,113,.65)}
}
.node-box.locked {
  background:linear-gradient(135deg,#999,#666);
  border-color:#444;
  color:#bbb;
  filter:grayscale(1);
  cursor:not-allowed;
}
.node-box.completed {
  background:linear-gradient(135deg,#F9CA24,#F0932B);
  border-color:#C0392B;
  color:white;
}
.node-icon { font-size:clamp(2.2rem,4.5vw,3.4rem); line-height:1; }
.node-num  { font-size:clamp(.85rem,1.7vw,1.15rem); opacity:.95; }
.node-name { font-size:clamp(.7rem,1.3vw,.9rem); opacity:.85; }
.node-lock { position:absolute; top:6px; right:8px; font-size:1.1rem; }

#map-character-wrap {
  position:absolute;
  z-index:10;
  pointer-events:none;
  transition:left .9s ease;
  display:flex;
  flex-direction:column;
  align-items:center;
}
#map-char-emoji { font-size:clamp(2rem,4vw,3rem); filter:drop-shadow(2px 3px 4px rgba(0,0,0,.4)); animation:charBob 2s ease-in-out infinite; }

/* ════════════════════════════════
   GAME
════════════════════════════════ */
#screen-game { flex-direction:column; overflow:hidden; }
.game-bg-forest { background:linear-gradient(180deg,#87CEEB 0%,#B0E0FF 55%,#5DBB63 55%); }
.game-bg-desert { background:linear-gradient(180deg,#F4D03F 0%,#E8A838 45%,#C19A6B 45%); }
.game-bg-mountain { background:linear-gradient(180deg,#4A6FA5 0%,#6B8EC7 45%,#8B7355 45%); }

#hud { position:absolute; top:10px; left:0; right:0; display:flex; justify-content:space-between; padding:0 12px; z-index:100; pointer-events:none; }
.hud-pill { background:rgba(255,255,255,.85); backdrop-filter:blur(6px); border-radius:14px; padding:5px 12px; font-family:'Baloo 2','Nunito','Arial Rounded MT Bold','Trebuchet MS',sans-serif; font-size:clamp(.8rem,1.6vw,1rem); box-shadow:0 3px 10px rgba(0,0,0,.2); display:flex; align-items:center; gap:5px; }
.hud-pill.clickable { pointer-events:all; cursor:pointer; }
.hud-pill.clickable:hover { background:rgba(255,255,255,1); }

.clouds { position:absolute; top:0; left:0; width:100%; pointer-events:none; z-index:1; height:55%; }
.cloud { position:absolute; background:white; border-radius:50px; opacity:.85; }
.cloud::before,.cloud::after { content:''; position:absolute; background:white; border-radius:50%; }
.cloud-1 { width:120px;height:40px;top:8%;left:-140px;animation:cloudMove 18s linear infinite; }
.cloud-1::before{width:60px;height:60px;top:-30px;left:15px;} .cloud-1::after{width:45px;height:45px;top:-20px;left:50px;}
.cloud-2 { width:90px;height:30px;top:18%;left:-110px;animation:cloudMove 25s linear infinite 6s; }
.cloud-2::before{width:45px;height:45px;top:-22px;left:10px;} .cloud-2::after{width:35px;height:35px;top:-15px;left:38px;}
.cloud-3 { width:140px;height:45px;top:5%;left:-170px;animation:cloudMove 22s linear infinite 12s; }
.cloud-3::before{width:70px;height:70px;top:-35px;left:18px;} .cloud-3::after{width:55px;height:55px;top:-25px;left:60px;}
@keyframes cloudMove { from{left:-200px} to{left:110%} }

.ground-left,.ground-right { position:absolute; bottom:0; height:42%; width:28%; z-index:2; }
.ground-left{left:0;} .ground-right{right:0;}
.bank { position:absolute; bottom:0; height:100%; width:100%; }
.game-bg-forest .bank { background:linear-gradient(180deg,#5DBB63 0%,#3A9940 100%); border-radius:0 20px 0 0; }
.game-bg-desert .bank { background:linear-gradient(180deg,#C19A6B 0%,#A0784A 100%); border-radius:0 20px 0 0; }
.game-bg-mountain .bank { background:linear-gradient(180deg,#9E8060 0%,#7A5C40 100%); border-radius:0 20px 0 0; }
.ground-right .bank { border-radius:20px 0 0 0 !important; }

.deco-item { position:absolute; font-size:1.1rem; animation:flowerBob 2s ease-in-out infinite; }
@keyframes flowerBob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }

#river { position:absolute; bottom:0; left:28%; width:44%; height:42%; overflow:hidden; z-index:1; }
.river-forest { background:linear-gradient(180deg,#42A5F5 0%,#1565C0 100%); }
.river-desert { background:linear-gradient(180deg,#D4A96A 0%,#B8864E 100%); }
.river-mountain { background:linear-gradient(180deg,#6090C0 0%,#3A5F8A 100%); }
.wave-container { position:absolute; inset:0; overflow:hidden; }
.wave { position:absolute; width:200%; height:60px; background:rgba(255,255,255,.15); border-radius:100%; animation:waveAnim 3s linear infinite; }
.wave:nth-child(2){animation-duration:4s;animation-delay:-1s;opacity:.1;}
.wave:nth-child(3){animation-duration:3.5s;animation-delay:-2s;}
.wave:nth-child(4){animation-duration:5s;animation-delay:-.5s;opacity:.08;}
@keyframes waveAnim { from{left:-100%} to{left:0%} }
.river-fish { position:absolute; font-size:1.3rem; animation:fishSwim 6s linear infinite; }
@keyframes fishSwim { from{left:110%;transform:scaleX(-1)} to{left:-10%;transform:scaleX(1)} }

#bridge { position:absolute; bottom:42%; left:28%; width:44%; height:70px; z-index:5; display:flex; align-items:flex-end; }
.bridge-plank {
  flex:1; height:55px; background:linear-gradient(180deg,#C49A6C 0%,#8B5E3C 100%);
  border:2px solid #5C3317; border-radius:4px; box-shadow:2px 4px 6px rgba(0,0,0,.3);
  margin:0 1px; position:relative; animation:plankAppear .5s cubic-bezier(.22,1,.36,1);
}
.bridge-plank::after{content:'';position:absolute;top:5px;left:4px;right:4px;height:3px;background:rgba(255,255,255,.2);border-radius:2px;}
@keyframes plankAppear {
  0%{transform:translateY(-60px)rotate(10deg)scale(.6);opacity:0}
  60%{transform:translateY(4px)rotate(-2deg)scale(1.04)}
  100%{transform:translateY(0)rotate(0)scale(1);opacity:1}
}
@keyframes plankRemove {
  0%{transform:translateY(0)rotate(0);opacity:1}
  40%{transform:translateY(-12px)rotate(-8deg);opacity:.8}
  100%{transform:translateY(60px)rotate(15deg);opacity:0}
}
.bridge-gap { flex:1; height:55px; margin:0 1px; border:3px dashed rgba(150,150,150,.4); border-radius:4px; background:rgba(0,0,0,.05); }

#goal-emoji { position:absolute; bottom:42%; right:2%; font-size:clamp(2.8rem,6vw,4.5rem); z-index:3; filter:drop-shadow(3px 5px 8px rgba(0,0,0,.3)); animation:castleFloat 4s ease-in-out infinite; }
@keyframes castleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

#character { position:absolute; bottom:42%; z-index:10; font-size:clamp(2rem,4.5vw,3.2rem); filter:drop-shadow(2px 4px 6px rgba(0,0,0,.3)); transition:left .9s cubic-bezier(.22,1,.36,1); }
#character.jumping { animation:charJump .7s cubic-bezier(.22,1,.36,1); }
@keyframes charJump { 0%{transform:translateY(0)}30%{transform:translateY(-55px)}70%{transform:translateY(-20px)}100%{transform:translateY(0)} }

#question-bubble {
  position:absolute;
  top:54px;
  left:50%;
  transform:translateX(-50%);
  background:white;
  border:5px solid #F39C12;
  border-radius:26px;
  padding:14px 36px;
  font-family:'Baloo 2','Nunito','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  font-size:clamp(1.8rem,4.5vw,3rem);
  color:#2C3E50;
  box-shadow:0 8px 28px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.8);
  z-index:20;
  text-align:center;
  white-space:nowrap;
  animation:bubblePop .4s cubic-bezier(.22,1,.36,1);
}
@keyframes bubblePop { 0%{transform:translateX(-50%) scale(.5);opacity:0}70%{transform:translateX(-50%) scale(1.04)}100%{transform:translateX(-50%) scale(1);opacity:1} }

#progress-dots { position:absolute; bottom:100px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:20; }
.dot { width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,.4);border:2px solid rgba(255,255,255,.6);transition:all .3s; }
.dot.done { background:var(--star-yellow);border-color:#E65100;transform:scale(1.2); }

/* ── STREAK BADGE ── */
#streak-badge {
  position:absolute;
  top:54px;
  right:14px;
  background:linear-gradient(135deg,#FF6B35,#FF3D00);
  border:3px solid #BF360C;
  border-radius:16px;
  padding:7px 13px;
  font-family:'Baloo 2','Nunito','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  font-size:clamp(.75rem,1.5vw,.95rem);
  color:white;
  text-shadow:1px 1px 0 rgba(0,0,0,.3);
  box-shadow:0 4px 10px rgba(0,0,0,.25);
  z-index:25;
  display:none;
  text-align:center;
  line-height:1.3;
}
#streak-badge.show { display:block; animation:badgePop .4s cubic-bezier(.22,1,.36,1); }
@keyframes badgePop{0%{transform:scale(0) rotate(-15deg);opacity:0}60%{transform:scale(1.1) rotate(3deg)}100%{transform:scale(1) rotate(0);opacity:1}}

/* ── BONUS POPUP ── */
#bonus-popup {
  position:fixed;
  top:50%;
  right:5%;
  transform:translateY(-50%);
  font-family:'Baloo 2','Nunito','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  font-size:clamp(1.1rem,2.5vw,1.8rem);
  color:#FFD700;
  text-shadow:3px 3px 0 rgba(0,0,0,.5), 0 0 20px rgba(255,215,0,.7);
  pointer-events:none;
  opacity:0;
  z-index:65;
  text-align:center;
  line-height:1.4;
}
#bonus-popup.show { animation:bonusPop 1.8s ease-out forwards; }
@keyframes bonusPop{
  0%{opacity:0;transform:translateY(-50%) scale(.4)}
  15%{opacity:1;transform:translateY(-60%) scale(1.2)}
  60%{opacity:1;transform:translateY(-58%) scale(1)}
  100%{opacity:0;transform:translateY(-80%) scale(.8)}
}

#answer-area { position:absolute; bottom:10px; width:100%; display:flex; justify-content:center; gap:clamp(8px,2vw,22px); z-index:20; padding:0 14px; }
.answer-btn {
  background:linear-gradient(180deg,#C49A6C 0%,#8B5E3C 100%); border:3px solid #5C3317; border-radius:12px;
  padding:11px clamp(12px,2.5vw,30px); font-family:'Baloo 2','Nunito','Arial Rounded MT Bold','Trebuchet MS',sans-serif; font-size:clamp(1.4rem,3vw,2rem);
  color:#FFF8E7; cursor:pointer; text-shadow:1px 2px 3px rgba(0,0,0,.4);
  box-shadow:0 6px 0 #5C3317,0 8px 16px rgba(0,0,0,.3); transition:transform .15s,box-shadow .15s;
  min-width:clamp(68px,14vw,115px); text-align:center; -webkit-tap-highlight-color:transparent; position:relative; overflow:hidden;
}
.answer-btn::before{content:'';position:absolute;top:4px;left:6px;right:6px;height:4px;background:rgba(255,255,255,.25);border-radius:4px;}
.answer-btn:hover{transform:translateY(-4px)scale(1.06);box-shadow:0 10px 0 #5C3317,0 14px 20px rgba(0,0,0,.35);}
.answer-btn:active{transform:translateY(2px)scale(.97);box-shadow:0 3px 0 #5C3317;}
.answer-btn.correct{background:linear-gradient(180deg,#6EE89A,#27AE60);border-color:#1A7A45;box-shadow:0 6px 0 #1A7A45;animation:correctPulse .4s;}
.answer-btn.wrong{background:linear-gradient(180deg,#FF8A80,#E74C3C);border-color:#8B0000;animation:shake .5s;}
@keyframes correctPulse{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-10px)rotate(-3deg)}30%{transform:translateX(10px)rotate(3deg)}45%{transform:translateX(-8px)}60%{transform:translateX(8px)}75%{transform:translateX(-4px)}90%{transform:translateX(4px)}}

/* Touch device fixes */
@media (hover: none) {
  /* Disable hover effects on touch devices to prevent sticky hover */
  .answer-btn:hover { transform:none; box-shadow:0 6px 0 #5C3317, 0 8px 16px rgba(0,0,0,.3); }
  .start-btn:hover  { transform:none; box-shadow:0 5px 0 #8B6914, 0 8px 20px rgba(0,0,0,.4); }
  .modal-btn:hover  { transform:none; }
  .restart-btn:hover{ transform:none; box-shadow:0 5px 0 #8B6914; }
  .map-node:hover .node-box.unlocked { transform:none; }
}

/* Ensure minimum tap target size (48px) for all interactive elements */
.answer-btn  { min-height:56px; touch-action:manipulation; }
.start-btn   { min-height:52px; touch-action:manipulation; }
.modal-btn   { min-height:48px; touch-action:manipulation; }
.restart-btn { min-height:52px; touch-action:manipulation; }
.map-node    { touch-action:manipulation; }
.hud-pill.clickable { min-height:40px; touch-action:manipulation; }

/* ── CONFETTI ── */
.confetti-piece{position:fixed;z-index:999;pointer-events:none;animation:confettiFall linear forwards;}
@keyframes confettiFall{0%{transform:translateY(-10px)rotate(0deg);opacity:1}100%{transform:translateY(110vh)rotate(720deg);opacity:0}}

/* ── STAR PARTICLES ── */
.star-particle{position:fixed;font-size:1.4rem;pointer-events:none;z-index:50;animation:starBurst 1.2s ease-out forwards;}
@keyframes starBurst{0%{transform:translate(0,0)scale(0)rotate(0deg);opacity:1}50%{opacity:1;transform:translate(var(--dx),var(--dy))scale(1.3)rotate(180deg)}100%{transform:translate(calc(var(--dx)*1.8),calc(var(--dy)*1.8 + 60px))scale(.2)rotate(360deg);opacity:0}}

/* ── MOTIVATIONAL ── */
#motivational{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Baloo 2','Nunito','Arial Rounded MT Bold','Trebuchet MS',sans-serif;font-size:2.4rem;color:white;text-shadow:3px 3px 0 rgba(0,0,0,.3);pointer-events:none;opacity:0;z-index:60;}
#motivational.show{animation:motivPop 1.5s ease-out forwards;}
@keyframes motivPop{0%{opacity:0;transform:translate(-50%,-50%)scale(.5)}20%{opacity:1;transform:translate(-50%,-70%)scale(1.2)}70%{opacity:1;transform:translate(-50%,-80%)scale(1)}100%{opacity:0;transform:translate(-50%,-120%)scale(.8)}}

/* ── FLASH ── */
#success-flash{position:fixed;inset:0;background:radial-gradient(ellipse,rgba(46,204,113,.4) 0%,transparent 70%);pointer-events:none;opacity:0;z-index:40;transition:opacity .2s;}
#success-flash.active{opacity:1;}

/* ── SPEECH BUBBLE ── */
#speech-bubble {
  position:absolute;
  bottom: calc(42% + clamp(2.2rem,4.5vw,3.2rem) + 14px);
  z-index:30;
  background:white;
  border:3px solid #F39C12;
  border-radius:18px;
  padding:8px 14px;
  font-family:'Baloo 2','Nunito','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  font-size:clamp(.72rem,1.5vw,.95rem);
  color:#2C3E50;
  max-width:clamp(140px,26vw,220px);
  text-align:center;
  box-shadow:0 4px 14px rgba(0,0,0,.18);
  pointer-events:none;
  white-space:normal;
  line-height:1.35;
  transition:left .9s cubic-bezier(.22,1,.36,1);
  opacity:0;
}
#speech-bubble.visible {
  opacity:1;
  animation:bubbleIn .35s cubic-bezier(.22,1,.36,1);
}
#speech-bubble.hiding {
  animation:bubbleOut .4s ease forwards;
}
#speech-bubble::after {
  content:'';
  position:absolute;
  bottom:-12px; left:50%; transform:translateX(-50%);
  border-width:10px 8px 0 8px;
  border-style:solid;
  border-color:white transparent transparent transparent;
}
#speech-bubble::before {
  content:'';
  position:absolute;
  bottom:-15px; left:50%; transform:translateX(-50%);
  border-width:12px 9px 0 9px;
  border-style:solid;
  border-color:#F39C12 transparent transparent transparent;
}
@keyframes bubbleIn{0%{opacity:0;transform:scale(.6) translateY(10px)}70%{transform:scale(1.05)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes bubbleOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.7) translateY(-10px)}}

/* ── MODAL ── */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:center;justify-content:center;}
#modal-overlay.show{display:flex;}

.modal-box .big-emoji{font-size:3.2rem;display:block;margin-bottom:8px;}
.modal-box h2{font-family:'Baloo 2','Nunito','Arial Rounded MT Bold','Trebuchet MS',sans-serif;font-size:clamp(1.4rem,2.8vw,2rem);color:#E65100;margin-bottom:6px;}
.modal-box p{font-weight:700;color:#5D4037;font-size:clamp(.85rem,1.6vw,1rem);}
.modal-btn{display:inline-block;margin-top:16px;background:linear-gradient(135deg,#2ECC71,#27AE60);border:3px solid #1A7A45;border-radius:13px;padding:10px 26px;font-family:'Baloo 2','Nunito','Arial Rounded MT Bold','Trebuchet MS',sans-serif;font-size:clamp(.95rem,2vw,1.25rem);color:white;cursor:pointer;box-shadow:0 4px 0 #1A7A45;transition:transform .15s;}
.modal-btn:hover{transform:scale(1.05);}

/* ── WIN ── */
#screen-win{flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#1B4F72 0%,#0D2137 60%,#050D18 100%);gap:14px;}

.win-sub{font-weight:800;font-size:clamp(.95rem,2vw,1.3rem);color:#87CEFA;text-align:center;position:relative;z-index:5;}
.treasure-big{font-size:clamp(4rem,10vw,7rem);animation:treasurePop .8s cubic-bezier(.22,1,.36,1) both;position:relative;z-index:5;}
@keyframes treasurePop{0%{transform:scale(0)rotate(-20deg)}60%{transform:scale(1.2)rotate(5deg)}100%{transform:scale(1)rotate(0)}}
.restart-btn{background:linear-gradient(135deg,#FFD700,#FF8C00);border:3px solid #B8860B;border-radius:16px;padding:12px 36px;font-family:'Baloo 2','Nunito','Arial Rounded MT Bold','Trebuchet MS',sans-serif;font-size:clamp(1rem,2.2vw,1.5rem);color:#3B1F00;cursor:pointer;box-shadow:0 5px 0 #8B6914;transition:transform .15s,box-shadow .15s;position:relative;z-index:5;}
.restart-btn:hover{transform:translateY(-3px)scale(1.04);box-shadow:0 8px 0 #8B6914;}

let audioCtx;
function getAudio(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq, type, vol, start, dur){
  const ctx=getAudio(), o=ctx.createOscillator(), g=ctx.createGain();
  o.connect(g); g.connect(ctx.destination); o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0,start); g.gain.linearRampToValueAtTime(vol,start+0.05); g.gain.exponentialRampToValueAtTime(0.001,start+dur);
  o.start(start); o.stop(start+dur);
}
function playCorrect(){ [523,659,784,1047].forEach((f,i)=>tone(f,'triangle',.3,getAudio().currentTime+i*.12,.4)); }
function playWrong(){
  const ctx=getAudio(), o=ctx.createOscillator(), g=ctx.createGain();
  o.connect(g); g.connect(ctx.destination); o.type='square';
  o.frequency.setValueAtTime(220,ctx.currentTime); o.frequency.exponentialRampToValueAtTime(110,ctx.currentTime+.3);
  g.gain.setValueAtTime(.18,ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.35);
  o.start(ctx.currentTime); o.stop(ctx.currentTime+.35);
}

function drawHorizontalPath(){
  const svg=document.getElementById('map-svg'); const track=document.getElementById('map-track'); svg.innerHTML=''; const tr=track.getBoundingClientRect();
  const stopIds=['ep-start', ...LEVELS.map((_,i)=>'map-node-'+(i+1)), 'ep-end'];
  const centers=stopIds.map(id=>{ const el=document.getElementById(id); if(!el) return null; const r=el.getBoundingClientRect(); return {x:r.left-tr.left+r.width/2,y:r.top-tr.top+r.height/2}; }).filter(Boolean);
  if(centers.length<2) return;
  const H=tr.height,W=tr.width;
  [['🌲',W*.08,H*.18],['🌿',W*.28,H*.78],['⛰️',W*.52,H*.15],['🌸',W*.76,H*.80],['🪨',W*.18,H*.62],['🌳',W*.66,H*.18],['🦋',W*.42,H*.72],['🌻',W*.88,H*.55]].forEach(([em,x,y])=>{
    const t=document.createElementNS('http://www.w3.org/2000/svg','text'); t.setAttribute('x',x); t.setAttribute('y',y); t.setAttribute('font-size','28'); t.setAttribute('text-anchor','middle'); t.setAttribute('dominant-baseline','middle'); t.setAttribute('opacity','.4'); t.textContent=em; svg.appendChild(t);
  });
  for(let i=0;i<centers.length-1;i++){
    const a=centers[i],b=centers[i+1],wave=(i%2===0?-1:1)*H*.18,cx1=a.x+(b.x-a.x)*.33,cy1=a.y+wave,cx2=a.x+(b.x-a.x)*.67,cy2=b.y+wave,done=G.levelsCompleted>i;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path'); path.setAttribute('d',`M ${a.x} ${a.y} C ${cx1} ${cy1} ${cx2} ${cy2} ${b.x} ${b.y}`); path.setAttribute('stroke',done?'#C0392B':'#8B5E3C'); path.setAttribute('stroke-width','5'); path.setAttribute('stroke-dasharray','12 8'); path.setAttribute('fill','none'); path.setAttribute('stroke-linecap','round'); svg.appendChild(path);
    if(done){ for(let t2=.15;t2<.9;t2+=.18){ const px=bezier(a.x,cx1,cx2,b.x,t2),py=bezier(a.y,cy1,cy2,b.y,t2); const dot=document.createElementNS('http://www.w3.org/2000/svg','circle'); dot.setAttribute('cx',px); dot.setAttribute('cy',py); dot.setAttribute('r','4'); dot.setAttribute('fill','rgba(192,57,43,.4)'); svg.appendChild(dot); } }
  }
}
function bezier(p0,p1,p2,p3,t){return (1-t)**3*p0+3*(1-t)**2*t*p1+3*(1-t)*t**2*p2+t**3*p3;}
function updateMapNodes(){
  for(let i=0;i<LEVELS.length;i++){
    const box=document.getElementById('nodebox-'+(i+1)); if(!box) continue;
    box.querySelectorAll('.node-lock').forEach(e=>e.remove()); box.classList.remove('unlocked','locked','completed');
    if(G.levelsCompleted>i){ box.classList.add('completed'); const ck=document.createElement('div'); ck.className='node-lock'; ck.textContent='✅'; box.appendChild(ck); }

  }
}

/* ══════════════════════════════
   MATH QUESTION GENERATOR
══════════════════════════════ */
function getActiveConfig(){
  const lvl=LEVELS[G.currentLevel-1], diff=DIFFICULTIES[G.difficulty]||DIFFICULTIES.medium;
  const cap = G.difficulty==='hard' ? Math.min(40, Math.max(lvl.maxSum+5, diff.maxCap)) : Math.min(lvl.maxSum, diff.maxCap);
  return {maxA:cap, maxSum:cap, maxB:Math.min(12, Math.max(9, Math.floor(cap/2))), types:diff.types};
}
function rand(n){ return Math.floor(Math.random()*(n+1)); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function makeQuestion(){
  const cfg=getActiveConfig(); const type=pick(cfg.types); let a,b,c,answer,html,kind='add';
  if(type==='add'){
    b=rand(Math.min(cfg.maxB,cfg.maxSum)); a=rand(cfg.maxSum-b); answer=a+b; html=`${a} <span style="color:#E74C3C">+</span> ${b} = <span style="color:#3498DB">?</span>`; kind='add';
  } else if(type==='sub'){
    a=rand(cfg.maxA); b=rand(Math.min(cfg.maxB,a)); answer=a-b; html=`${a} <span style="color:#E74C3C">-</span> ${b} = <span style="color:#3498DB">?</span>`; kind='sub';
  } else if(type==='make10'){
    a=rand(10); answer=10-a; html=`${a} <span style="color:#E74C3C">+</span> <span style="color:#3498DB">?</span> = 10`; kind='missing';
  } else if(type==='missingAdd'){
    answer=rand(Math.min(cfg.maxB,cfg.maxSum)); a=rand(Math.max(0,cfg.maxSum-answer)); c=a+answer; html=`${a} <span style="color:#E74C3C">+</span> <span style="color:#3498DB">?</span> = ${c}`; kind='missing';
  } else if(type==='missingSub'){
    a=rand(cfg.maxA); answer=rand(Math.min(cfg.maxB,a)); c=a-answer; html=`${a} <span style="color:#E74C3C">-</span> <span style="color:#3498DB">?</span> = ${c}`; kind='missing';
  } else if(type==='compare'){
    a=rand(Math.min(15,cfg.maxSum)); b=rand(Math.min(15,cfg.maxSum-a)); c=rand(cfg.maxSum); const left=a+b; answer=left>c?'Büyük':left<c?'Küçük':'Eşit'; html=`${a}+${b} <span style="color:#3498DB">?</span> ${c}`; kind='compare';
  } else {
    b=rand(Math.min(cfg.maxB,cfg.maxSum)); a=rand(cfg.maxSum-b); const real=a+b; const shown=Math.random()<.55?real:Math.max(0,real+(Math.random()<.5?-1:1)*(1+rand(3))); answer=shown===real?'Doğru':'Yanlış'; html=`${a} <span style="color:#E74C3C">+</span> ${b} = ${shown}`; kind='trueFalse';
  }
  return {html, answer, kind};
}
function makeChoices(answer){
  if(answer==='Doğru'||answer==='Yanlış') return shuffle(['Doğru','Yanlış']);
  if(answer==='Büyük'||answer==='Küçük'||answer==='Eşit') return shuffle(['Büyük','Küçük','Eşit']);
  const s=new Set([answer]); let tries=0;
  while(s.size<3&&tries<150){ const d=Math.floor(Math.random()*5)+1, sg=Math.random()<.5?1:-1, c=answer+sg*d; if(c>=0&&c<=40&&c!==answer) s.add(c); tries++; }
  let fb=answer+1; while(s.size<3){ if(fb>=0&&fb<=40&&!s.has(fb)) s.add(fb); fb++; if(fb>45) fb=0; }
  return shuffle([...s]);
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ══════════════════════════════
   RENDER QUESTION / HINT
══════════════════════════════ */
function updateProgressDots(){ const el=document.getElementById('progress-dots'); el.innerHTML=''; for(let i=0;i<G.totalPlanks;i++){ const d=document.createElement('div'); d.className='dot'+(i<G.planksPlaced?' done':''); el.appendChild(d); } }
function renderQuestion(q,choices){
  G.currentQuestion=q;
  const bbl=document.getElementById('question-bubble'); bbl.innerHTML=q.html; bbl.style.animation='none'; void bbl.offsetWidth; bbl.style.animation='bubblePop .4s cubic-bezier(.22,1,.36,1)';
  const area=document.getElementById('answer-area'); area.innerHTML='';
  choices.forEach(c=>{ const btn=document.createElement('button'); btn.className='answer-btn'; btn.textContent=c; btn.dataset.v=String(c); btn.addEventListener('click',()=>handleAnswer(btn,c,q.answer)); area.appendChild(btn); });
}
function updateHintUI(){ const el=document.getElementById('hint-count'), btn=document.getElementById('hint-btn'); if(el) el.textContent=G.hintsLeft; if(btn) btn.classList.toggle('hint-empty',G.hintsLeft<=0); }
function useHint(){
  if(G.locked || !G.currentQuestion) return;
  if(G.hintsLeft<=0){ showBonusPopup('🪄 İpucu kalmadı!'); return; }
  const wrong=[...document.querySelectorAll('.answer-btn')].filter(b=>!b.classList.contains('hint-removed') && b.textContent!=String(G.currentQuestion.answer));
  if(!wrong.length) return;
  G.hintsLeft--; updateHintUI();
  const btn=pick(wrong); btn.classList.add('hint-removed'); btn.disabled=true;
  showBonusPopup('🪄 Bir yanlış seçenek silindi!');
}
let _lastQuestionKey='';
function nextQuestion(){ let q,tries=0; do{ q=makeQuestion(); tries++; }while(q.html===_lastQuestionKey && tries<20); _lastQuestionKey=q.html; renderQuestion(q,makeChoices(q.answer)); }

/* ══════════════════════════════
   ANSWER HANDLING
══════════════════════════════ */
function recordQuestionKind(kind){ if(!G.levelStats) return; if(kind==='add') G.levelStats.add++; else if(kind==='sub') G.levelStats.sub++; else if(kind==='missing') G.levelStats.missing++; else if(kind==='compare') G.levelStats.compare++; else if(kind==='trueFalse') G.levelStats.trueFalse++; }
function handleAnswer(btn,chosen,correct){
  if(G.locked) return; G.locked=true; recordQuestionKind(G.currentQuestion?.kind);
  if(chosen===correct){
    btn.classList.add('correct'); playCorrect();
    const flash=document.getElementById('success-flash'); flash.classList.add('active'); setTimeout(()=>flash.classList.remove('active'),350);
    layPlank(G.planksPlaced); G.planksPlaced++; updateProgressDots();
    const ch=document.getElementById('character'); ch.style.left=getCharLeft(G.planksPlaced); syncSpeechBubble(); syncPet();
    const r=btn.getBoundingClientRect(); burstStars(r.left+r.width/2, r.top, 8); setTimeout(()=>showMotiv(MOTIV[Math.floor(Math.random()*MOTIV.length)]),80);
    G.streak++; G.levelStats.correct++; G.levelStats.bestStreak=Math.max(G.levelStats.bestStreak,G.streak); SAVE.totalCorrect=(SAVE.totalCorrect||0)+1; SAVE.bestStreak=Math.max(SAVE.bestStreak||0,G.streak);
    let bonus=1, bonusMsg='';
    if(G.streak===3){ bonus=2; bonusMsg='🔥 Hatasız 3 Seri! +2 ⭐'; }
    else if(G.streak>3){ bonus=3; bonusMsg=`🔥 ${G.streak}. Hatasız! +3 ⭐`; }
    G.score+=bonus; SAVE.stars=(SAVE.stars||0)+bonus; SAVE.totalStarsEarned=(SAVE.totalStarsEarned||0)+bonus; SAVE.bestScore=Math.max(SAVE.bestScore||0,G.score);
    document.getElementById('hud-score').textContent=G.score; updateStreakBadge(); if(bonusMsg) showBonusPopup(bonusMsg); saveData(); checkBadges('correct');
    if(G.planksPlaced>=G.totalPlanks){
      setTimeout(()=>{ ch.style.left='78%'; syncSpeechBubble(); syncPet(); ch.classList.add('jumping');
        setTimeout(()=>{ ch.classList.remove('jumping'); launchConfetti(); playLevelUp(); G.levelsCompleted=Math.max(G.levelsCompleted,G.currentLevel); SAVE.maxLevelCompleted=Math.max(SAVE.maxLevelCompleted||0,G.levelsCompleted); clearSpeechTimers(); hideSpeechBubble(); saveData(); checkBadges('levelComplete'); setTimeout(()=>showLevelModal(),700); },950);
      },350);
    } else setTimeout(()=>{ G.locked=false; nextQuestion(); },800);
  } else {
    btn.classList.add('wrong'); btn.disabled=true; btn.style.opacity='.45'; btn.style.pointerEvents='none'; playWrong();
    G.streak=0; G.levelStats.wrong++; SAVE.totalWrong=(SAVE.totalWrong||0)+1; updateStreakBadge(); saveData();
    if(G.planksPlaced>0 && G.difficulty!=='teacher'){
      removeRightmostPlank(); G.planksPlaced--; updateProgressDots(); const ch=document.getElementById('character'); setTimeout(()=>{ ch.style.left=getCharLeft(G.planksPlaced); syncSpeechBubble(); syncPet(); },200);
    } else if(G.difficulty==='teacher') showBonusPopup('👩‍🏫 Öğretmen modu: köprü düşmedi!');
    setTimeout(()=>{ btn.classList.remove('wrong'); G.locked=false; },650);
  }
}

/* ══════════════════════════════
   STREAK UI
══════════════════════════════ */
function updateStreakBadge(){ const badge=document.getElementById('streak-badge'); if(G.streak>=3){ badge.innerHTML=`🔥 ${G.streak} Hatasız!<br><span style="font-size:.75em;opacity:.9">${G.streak===3?'+2 ⭐ / soru':'+3 ⭐ / soru'}</span>`; badge.classList.add('show'); } else badge.classList.remove('show'); }
function showBonusPopup(msg){ const el=document.getElementById('bonus-popup'); el.textContent=msg; el.className=''; void el.offsetWidth; el.className='show'; }

/* ══════════════════════════════
   SPEECH BUBBLE SYSTEM
══════════════════════════════ */
const SPEECH_LINES=['Haydi yapabilirsin! 💪','İyi gidiyorsun! 🌟','Köprü de ne uzunmuş... 😅','Daha kaç tane köprü kaldı? 🤔','Neyse ki matematiğin çok iyi,\nyoksa bana kim yardım ederdi! 😄','Sen çok zekisin! ⭐','Devam et, az kaldı! 🏃'];
let speechTimer=null, speechHideTimer=null, speechScheduleTimer=null;
function clearSpeechTimers(){ if(speechTimer) clearTimeout(speechTimer); if(speechHideTimer) clearTimeout(speechHideTimer); if(speechScheduleTimer) clearTimeout(speechScheduleTimer); speechTimer=speechHideTimer=speechScheduleTimer=null; }
function scheduleSpeechBubble(){ clearSpeechTimers(); const delay=8000+Math.random()*17000; speechScheduleTimer=setTimeout(()=>showSpeechBubble(),delay); }
function showSpeechBubble(){ const line=pick(SPEECH_LINES), bbl=document.getElementById('speech-bubble'); bbl.textContent=line; syncSpeechBubble(); bbl.classList.remove('hiding'); bbl.classList.add('visible'); speechHideTimer=setTimeout(()=>hideSpeechBubble(),20000); speechTimer=setTimeout(()=>scheduleSpeechBubble(),20000+15000+Math.random()*20000); }
function hideSpeechBubble(){ const bbl=document.getElementById('speech-bubble'); bbl.classList.add('hiding'); setTimeout(()=>{ bbl.classList.remove('visible','hiding'); },420); }
function syncSpeechBubble(){ const ch=document.getElementById('character'), bbl=document.getElementById('speech-bubble'); if(!ch||!bbl) return; bbl.style.left=ch.style.left; bbl.style.transform='translateX(-50%)'; }
function syncPet(){ const ch=document.getElementById('character'), pet=document.getElementById('pet-companion'); if(!ch||!pet) return; pet.style.left=ch.style.left; }

/* ══════════════════════════════
   EFFECTS
══════════════════════════════ */
function burstStars(x,y,n){ for(let i=0;i<n;i++){ const s=document.createElement('div'); s.className='star-particle'; const ang=(i/n)*360, dist=50+Math.random()*50; s.style.setProperty('--dx',Math.cos(ang*Math.PI/180)*dist+'px'); s.style.setProperty('--dy',(Math.sin(ang*Math.PI/180)*dist-40)+'px'); s.style.left=x+'px'; s.style.top=y+'px'; s.textContent=['✨','⭐','🌟','💫'][i%4]; document.body.appendChild(s); setTimeout(()=>s.remove(),1300); } }
function showMotiv(t){ const el=document.getElementById('motivational'); el.textContent=t; el.className=''; void el.offsetWidth; el.className='show'; }
function launchConfetti(){ for(let i=0;i<130;i++){ setTimeout(()=>{ const el=document.createElement('div'); el.className='confetti-piece'; const col=CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)], rect=Math.random()>.5; el.style.cssText=`left:${Math.random()*100}%;top:-10px;background:${col};width:${rect?8:10}px;height:${rect?14:10}px;border-radius:${rect?'2px':'50%'};animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*.6}s;`; document.body.appendChild(el); setTimeout(()=>el.remove(),3500); },i*12); } }

/* ══════════════════════════════
   MODALS
══════════════════════════════ */
function showLevelModal(){
  const last=G.currentLevel===LEVELS.length;
  document.getElementById('modal-emoji').textContent=last?'🏆':'🎉';
  document.getElementById('modal-title').textContent=last?'Tüm Bölümler Tamam!':'Bölüm '+G.currentLevel+' Tamamlandı!';
  document.getElementById('modal-desc').textContent=`${G.playerName}, harika iş! ⭐ Toplam: ${G.score} yıldız | 💰 Market: ${SAVE.stars||0} yıldız`;
  const s=G.levelStats||{correct:0,wrong:0,bestStreak:0,add:0,sub:0,missing:0,compare:0,trueFalse:0};
  document.getElementById('modal-report').innerHTML=`<div class="report-pill">✅ Doğru: ${s.correct}</div><div class="report-pill">❌ Yanlış: ${s.wrong}</div><div class="report-pill">🔥 En iyi seri: ${s.bestStreak}</div><div class="report-pill">🪄 Kalan ipucu: ${G.hintsLeft}</div><div class="report-pill">➕ Toplama: ${s.add}</div><div class="report-pill">➖ Çıkarma: ${s.sub}</div><div class="report-pill">❔ Eksik sayı: ${s.missing}</div><div class="report-pill">⚖️ Diğer: ${s.compare+s.trueFalse}</div>`;
  document.getElementById('modal-btn').textContent=last?'🏆 Ödülünü Al!':'🗺️ Haritaya Dön';
  document.getElementById('modal-overlay').classList.add('show');
}
function handleModalBtn(){ document.getElementById('modal-overlay').classList.remove('show'); if(G.currentLevel===LEVELS.length) showWin(); else openMap(); }
function goToMap(){ G.streak=0; clearSpeechTimers(); hideSpeechBubble(); document.getElementById('streak-badge').classList.remove('show'); openMap(); }

/* ══════════════════════════════
   WIN SCREEN
══════════════════════════════ */
function showWin(){
  G.levelsCompleted=LEVELS.length; SAVE.maxLevelCompleted=LEVELS.length; saveData(); checkBadges('win');
  launchConfetti(); playWin(); const ws=document.getElementById('win-stars'); ws.innerHTML='';
  for(let i=0;i<80;i++){ const s=document.createElement('div'); s.className='mstar'; const sz=Math.random()*3+1; s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*2}s;animation-duration:${1+Math.random()*2}s`; ws.appendChild(s); }
  document.getElementById('win-sub').textContent=G.playerName+', sen gerçek bir büyücüsün! 🧙‍♂️✨';
  document.getElementById('win-score-text').textContent=`Toplam: ${G.score} Yıldız ⭐ | Market: ${SAVE.stars||0} ⭐ | En iyi: ${SAVE.bestScore||0} ⭐`;
  const tr=document.getElementById('win-treasure'); tr.textContent='🎁'; setTimeout(()=>{ tr.textContent=getSelectedGoal('💎'); tr.style.animation='none'; void tr.offsetWidth; tr.style.animation='treasurePop .6s cubic-bezier(.22,1,.36,1)'; },700);
  showScreen('screen-win');
}
function restartGame(){
  clearSpeechTimers(); hideSpeechBubble();
  G.playerName=SAVE.playerName||''; G.score=0; G.levelsCompleted=0; G.currentLevel=1; G.streak=0; G.planksPlaced=0; G.sessionStarted=false;
  document.getElementById('player-name-input').value=SAVE.playerName||''; refreshMenuPanels(); showScreen('screen-menu');
}

/* ══════════════════════════════
   INIT / TOUCH
══════════════════════════════ */
window.addEventListener('load',()=>{
  buildMenuStars();
  G.playerName=SAVE.playerName||''; document.getElementById('player-name-input').value=SAVE.playerName||'';
  refreshMenuPanels(); applyCosmetics();
  document.getElementById('player-name-input').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.target.blur(); handleMenuStart(); } });
  initTouchSupport();
});
let _resizeTimer=null;
window.addEventListener('resize',()=>{ if(!document.getElementById('screen-map').classList.contains('active')) return; clearTimeout(_resizeTimer); _resizeTimer=setTimeout(()=>{ drawHorizontalPath(); positionMapCharacter(); },150); });
function initTouchSupport(){ document.addEventListener('touchstart',onTouchStart,{passive:false}); document.addEventListener('touchend',onTouchEnd,{passive:false}); }
let _touchTarget=null,_touchStartX=0,_touchStartY=0;
function onTouchStart(e){
  const t=e.target; _touchTarget=t; _touchStartX=e.touches[0].clientX; _touchStartY=e.touches[0].clientY;
  if(t.classList.contains('answer-btn')){ t.style.transform='translateY(2px) scale(0.97)'; t.style.boxShadow='0 3px 0 #5C3317'; e.preventDefault(); }
  if(t.closest('.start-btn, .modal-btn, .restart-btn, .map-node, .hud-pill.clickable, .mini-btn, .panel-btn, .difficulty-btn, .panel-close')) e.preventDefault();
}
function onTouchEnd(e){
  const t=e.target, dx=Math.abs((e.changedTouches[0]?.clientX||0)-_touchStartX), dy=Math.abs((e.changedTouches[0]?.clientY||0)-_touchStartY), isTap=dx<10&&dy<10;
  if(_touchTarget&&_touchTarget.classList.contains('answer-btn')){ _touchTarget.style.transform=''; _touchTarget.style.boxShadow=''; }
  if(!isTap){ _touchTarget=null; return; }
  const clickable=t.closest('.answer-btn, .start-btn, .modal-btn, .restart-btn, .map-node, .hud-pill.clickable, .node-box, .mini-btn, .panel-btn, .difficulty-btn, .panel-close');
  if(clickable){ e.preventDefault(); if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume(); clickable.click(); }
  _touchTarget=null;
}
