<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kasa Ustası – 6 Basamaklı Sayıları Çözümle</title>
<meta name="description" content="4. sınıf eğitici oyun: 6 basamaklı sayıların basamakları, basamak değerleri, sayı değerleri ve çözümlenmesi.">
<style>
/* =========================================================
   1. TEMA DEĞİŞKENLERİ
   ========================================================= */
:root{
  --bg1:#0b1533; --bg2:#1c2f66;
  --ink:#1b2340; --muted:#5b6585;
  --vault-a:#ffe27a; --vault-b:#d9a514; --vault-c:#7a5a08;
  --accent:#ffd34d;
  --ok:#1fbf75; --bad:#ff5d5d; --warn:#ff9f1c;
  --col1:#e6eeff; --col2:#fff1dc;
  --star:#f4b400;
}
body[data-theme="gumus"]{--vault-a:#f1f4f8;--vault-b:#9aa6b8;--vault-c:#4f5a6b;--accent:#cfe3ff}
body[data-theme="zumrut"]{--vault-a:#8ff0c4;--vault-b:#16a06a;--vault-c:#0b4f34;--accent:#9ff5cf}
body[data-theme="yakut"]{--vault-a:#ffb0bf;--vault-b:#d42a52;--vault-c:#6e0f26;--accent:#ffc2cf}

/* =========================================================
   2. TEMEL YERLEŞİM
   ========================================================= */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  background:radial-gradient(circle at 50% -10%,var(--bg2),var(--bg1) 70%);
  color:var(--ink);overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
}
button{font-family:inherit;cursor:pointer;color:inherit}
#app{height:100%;display:flex;flex-direction:column}
.screen{display:none;flex:1;min-height:0;overflow-y:auto;padding:16px clamp(12px,3vw,40px)}
.screen.active{display:flex;flex-direction:column}
#sig{text-align:center;color:rgba(255,255,255,.6);font-size:13px;padding:6px;flex:none}

/* Düğmeler */
.btn{min-height:56px;padding:0 32px;border-radius:999px;font-size:clamp(18px,2.2vw,28px);font-weight:900;border:none;transition:transform .08s}
.btn:active{transform:translateY(3px)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.primary{background:linear-gradient(180deg,var(--vault-a),var(--vault-b));color:#1b1300;box-shadow:0 6px 0 var(--vault-c)}
.ghost{background:rgba(255,255,255,.1);color:#fff;border:2px solid rgba(255,255,255,.35)}
.soft{background:#e7ebf7;color:var(--ink)}
.danger{background:var(--bad);color:#fff;box-shadow:0 6px 0 #a83030}
.icon-btn{width:52px;height:52px;flex:none;border-radius:50%;border:none;background:rgba(255,255,255,.14);color:#fff;font-size:24px;font-weight:900}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* Üst çubuk */
.topbar{display:flex;align-items:center;gap:12px;color:#fff;flex:none}
.topbar h2{flex:1;font-size:clamp(18px,2.4vw,30px);font-weight:900}
.keys{background:rgba(255,255,255,.12);padding:8px 14px;border-radius:999px;font-weight:900;font-size:clamp(16px,2vw,24px);white-space:nowrap}

/* Beyaz panel */
.panel{background:#fff;border-radius:24px;padding:clamp(18px,3vw,32px);max-width:680px;width:100%;margin:auto;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.25)}
.panel h2{font-size:clamp(26px,3.5vw,42px);font-weight:900}

/* =========================================================
   3. KASA GÖRSELİ
   ========================================================= */
.vault{--vs:200px;position:relative;width:var(--vs);height:var(--vs);border-radius:50%;
  background:radial-gradient(circle at 50% 50%,#2a1d05 55%,var(--vault-c) 56%);
  box-shadow:0 0 0 calc(var(--vs)*.03) var(--vault-c),0 calc(var(--vs)*.05) 0 calc(var(--vs)*.03) rgba(0,0,0,.35);
  perspective:calc(var(--vs)*3);flex:none}
.vault-inside{position:absolute;inset:9%;border-radius:50%;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle,#5a3d00,#1a1203 75%)}
.vault-inside svg{width:70%;height:70%}
.vault-door{position:absolute;inset:3%;border-radius:50%;transform-origin:left center;
  background:radial-gradient(circle at 35% 30%,var(--vault-a),var(--vault-b) 65%,var(--vault-c));
  transition:transform .7s cubic-bezier(.3,1.3,.5,1);box-shadow:inset 0 0 calc(var(--vs)*.06) rgba(0,0,0,.35)}
.vault-door svg{width:100%;height:100%;display:block}
.vault.open .vault-door{transform:rotateY(-78deg)}
.wheel{transform-box:fill-box;transform-origin:center;transition:transform .45s ease}
.vault.spin .wheel{transform:rotate(270deg)}
.vault.idle .wheel{animation:spinIdle 7s linear infinite}
@keyframes spinIdle{to{transform:rotate(360deg)}}
.vault.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.vault-label{position:absolute;bottom:14%;left:50%;transform:translateX(-50%);background:var(--bg1);color:var(--accent);
  font-weight:900;padding:2px 10px;border-radius:8px;font-size:calc(var(--vs)*.09);white-space:nowrap}
.float-key{position:absolute;left:50%;top:40%;transform:translateX(-50%);font-size:clamp(22px,3vw,40px);font-weight:900;color:var(--accent);
  text-shadow:0 2px 0 rgba(0,0,0,.4);animation:floatUp 1.1s ease-out forwards;pointer-events:none;white-space:nowrap}
@keyframes floatUp{to{transform:translate(-50%,-90px);opacity:0}}

/* =========================================================
   4. GİRİŞ EKRANI
   ========================================================= */
.home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;color:#fff}
.home .vault{--vs:clamp(140px,32vh,300px)}
.home h1{font-size:clamp(42px,7vw,96px);font-weight:900;color:var(--accent);text-shadow:0 5px 0 rgba(0,0,0,.35);line-height:1}
.home .sub{font-size:clamp(18px,2.4vw,30px);font-weight:700;max-width:640px}
.home .btn{min-width:220px}

/* =========================================================
   5. KASA HARİTASI VE TEMA DÜKKÂNI
   ========================================================= */
.map-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px;margin-top:16px}
.lvl{background:#fff;border:none;border-radius:24px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:6px;
  text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.25);min-height:200px}
.lvl:active{transform:translateY(3px)}
.lvl.locked{opacity:.55;filter:grayscale(.7)}
.lv-ico{font-size:40px;line-height:1}
.lv-no{font-size:14px;font-weight:800;color:var(--muted)}
.lvl b{font-size:clamp(18px,2vw,24px)}
.lvl small{font-size:15px;color:var(--muted);font-weight:600}
.lvl .stars{color:var(--star);font-size:28px;letter-spacing:2px;margin-top:auto}
.shop-title{color:#fff;margin:22px 0 10px;font-size:clamp(18px,2.2vw,26px)}
.shop-title small{font-weight:600;opacity:.75;font-size:.7em}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px;padding-bottom:10px}
.theme{background:#fff;border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;border:4px solid transparent;font-weight:800}
.theme.on{border-color:var(--accent)}
.sw{width:56px;height:56px;border-radius:50%;box-shadow:0 0 0 4px rgba(0,0,0,.15)}
.theme .btn{min-height:48px;padding:0 16px;font-size:17px}

/* =========================================================
   6. OYUN EKRANI
   ========================================================= */
.dots{display:flex;gap:8px;justify-content:center;margin:8px 0;flex:none}
.dot{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4)}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.bad,.dot.retry{background:var(--warn);border-color:var(--warn)}
.dot.cur{outline:3px solid var(--accent);outline-offset:2px}
.timer{height:12px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden;margin:0 auto 8px;width:min(100%,640px);flex:none;display:none}
#timerBar{height:100%;width:100%;background:var(--ok);transition:width .1s linear}
#timerBar.low{background:var(--bad)}

.play-body{flex:1;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:center;align-items:center}
.vault-wrap{display:flex;justify-content:center;position:relative}
#vault{--vs:clamp(90px,17vh,170px)}
@media (min-aspect-ratio:4/3) and (min-width:900px){
  .play-body{grid-template-columns:minmax(180px,.75fr) 2fr}
  #vault{--vs:clamp(150px,30vh,340px)}
}
.task{background:#fff;border-radius:24px;padding:clamp(14px,2.5vw,30px);box-shadow:0 10px 0 rgba(0,0,0,.25);
  display:flex;flex-direction:column;gap:14px;align-items:center;min-width:0}
.prompt{font-size:clamp(18px,2.2vw,28px);font-weight:800;text-align:center}
.display{font-size:clamp(34px,5.5vw,76px);font-weight:900;font-variant-numeric:tabular-nums;text-align:center;line-height:1.2;
  background:var(--bg1);color:var(--accent);border-radius:16px;padding:8px 22px;min-width:min(100%,360px);max-width:100%}
.display.expr{font-size:clamp(20px,3vw,40px);padding:12px 18px}
.dch{display:inline-block;padding:0 .06em}
.dch.hl{color:var(--bg1);background:var(--accent);border-radius:10px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.gsp{display:inline-block;width:.35em}
.input-area{width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
.open-btn{min-width:200px}

/* Çoktan seçmeli */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:640px}
.opt{min-height:64px;font-size:clamp(18px,2.4vw,30px);border-radius:16px;border:3px solid #d6dcf0;background:#f6f8ff;font-weight:800;
  font-variant-numeric:tabular-nums;padding:6px}
.opt.sel{border-color:var(--vault-b);background:#fff4cc}

/* Kart yerleştirme */
.slots,.bank{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px}
.bank{gap:10px;padding-top:10px;border-top:2px dashed #dfe4f2;width:100%}
.slot,.card{min-width:clamp(88px,9vw,150px);height:clamp(52px,6vw,72px);border-radius:14px;padding:0 10px;display:grid;place-items:center;
  font-size:clamp(18px,2.2vw,30px);font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.slot{border:3px dashed #9aa6c8;background:#fafbff}
.slot.filled{border-style:solid;border-color:var(--vault-b);background:#fff4cc}
.card{border:3px solid #c9d4f2;background:#eef3ff;box-shadow:0 4px 0 #c9d4f2}
.card.used{visibility:hidden}
.plus{font-weight:900;font-size:clamp(20px,2.4vw,30px);color:var(--muted)}

/* Şifre çarkları */
.dials{display:flex;gap:clamp(8px,2vw,24px);justify-content:center}
.dial-group{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;border-radius:14px}
.dial-group.g1{background:var(--col1)} .dial-group.g2{background:var(--col2)}
.group-label{font-size:clamp(11px,1.2vw,15px);font-weight:800;color:var(--muted)}
.dial-row{display:flex;gap:clamp(4px,.8vw,10px)}
.dial{width:clamp(46px,6vw,84px);display:flex;flex-direction:column;align-items:center}
.arr{width:100%;height:clamp(34px,4vw,48px);border-radius:10px;border:none;background:#d9e0f5;font-size:18px;color:var(--ink)}
.arr:active{background:#c3cdee}
.dg{width:100%;height:clamp(56px,7.5vw,100px);display:grid;place-items:center;font-size:clamp(32px,4.8vw,64px);font-weight:900;
  background:var(--bg1);color:var(--accent);border-radius:12px;margin:4px 0;font-variant-numeric:tabular-nums;cursor:pointer}
.dial.cur .dg{box-shadow:0 0 0 4px var(--vault-b)}
.dlabel{font-size:clamp(10px,1vw,13px);text-align:center;line-height:1.1;color:var(--muted);font-weight:700;min-height:2.3em;margin-top:2px}

/* =========================================================
   7. GERİ BİLDİRİM, MODAL, TOAST
   ========================================================= */
.overlay{position:fixed;inset:0;background:rgba(5,10,30,.65);display:none;place-items:center;z-index:50;padding:12px}
.overlay.show{display:grid}
.overlay .panel{max-height:94vh;overflow-y:auto;margin:0}
.fb-title{color:var(--bad)}
.fb-msg{font-size:clamp(17px,2vw,24px);font-weight:700;line-height:1.4}
.fb-line{font-size:clamp(16px,2vw,24px);font-weight:900;background:#f2f5ff;border-radius:12px;padding:8px 14px;font-variant-numeric:tabular-nums}
.pv{border-collapse:separate;border-spacing:4px;margin:0 auto;font-variant-numeric:tabular-nums}
.pv th,.pv td{padding:6px 8px;border-radius:8px;text-align:center}
.pv .bol th{font-size:13px;font-weight:800;color:var(--muted)}
.pv .bol .b1{background:var(--col1)} .pv .bol .b2{background:var(--col2)}
.pv .names th{font-size:clamp(11px,1.3vw,15px);background:#eef2fb;line-height:1.1}
.pv .digs td{font-size:clamp(24px,3vw,40px);font-weight:900;background:#f6f8ff}
.pv .vals td{font-size:clamp(11px,1.3vw,16px);font-weight:700;color:var(--muted);background:#f6f8ff;white-space:nowrap}
.pv .hl{background:#ffe08a !important;color:#1b1300 !important}
@media (max-width:480px){
  .pv{border-spacing:2px}
  .pv th,.pv td{padding:4px 3px}
  .pv .vals td{font-size:10px}
  .pv .names th{font-size:10px}
}
.modal-in{font-size:28px;text-align:center;padding:10px;border-radius:12px;border:3px solid #c9d4f2;width:180px;font-family:inherit;font-weight:900}
.err-txt{color:var(--bad);font-weight:800;min-height:1.2em}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(30px);background:#fff;color:var(--ink);font-weight:800;
  padding:12px 22px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.35);opacity:0;transition:.25s;z-index:60;pointer-events:none;text-align:center;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Özet */
.big-stars{font-size:clamp(50px,8vw,90px);color:var(--star);letter-spacing:6px;line-height:1}
.big-stars span{display:inline-block;animation:pop .5s backwards}
@keyframes pop{from{transform:scale(0)}}
.tip{background:#fff4cc;border-radius:16px;padding:12px 16px;font-weight:700;font-size:clamp(16px,1.8vw,20px);line-height:1.4}
.sum-txt{font-size:clamp(18px,2.2vw,26px);font-weight:800}
.unlock-txt{color:var(--ok);font-weight:900;font-size:clamp(18px,2.2vw,24px)}
.set-row{display:flex;flex-direction:column;gap:12px;width:100%;max-width:360px}
.set-note{color:var(--muted);font-weight:700}
</style>
</head>
<body data-theme="altin">
<div id="app">

  <!-- EKRAN 1: GİRİŞ -->
  <section class="screen active" id="scr-home">
    <div class="home">
      <div class="vault idle" id="homeVault"></div>
      <h1>Kasa Ustası</h1>
      <p class="sub">6 basamaklı sayıları çözümle, kasaları aç!</p>
      <button class="btn primary" data-go="map">Başla</button>
      <button class="btn ghost" data-go="settings">Ayarlar</button>
    </div>
  </section>

  <!-- EKRAN 2: KASA HARİTASI -->
  <section class="screen" id="scr-map">
    <header class="topbar">
      <button class="icon-btn" data-go="home" aria-label="Geri">←</button>
      <h2>Kasa Haritası</h2>
      <div class="keys">🔑 <span class="keyCount">0</span></div>
    </header>
    <div class="map-grid" id="levelGrid"></div>
    <h3 class="shop-title">Kasa Temaları <small>(sadece görünüşü değiştirir)</small></h3>
    <div class="shop" id="shop"></div>
  </section>

  <!-- EKRAN 3: OYUN -->
  <section class="screen" id="scr-play">
    <header class="topbar">
      <button class="icon-btn" id="btnQuit" aria-label="Turdan çık">←</button>
      <h2 id="playTitle"></h2>
      <div class="keys">🔑 <span class="keyCount">0</span></div>
    </header>
    <div class="dots" id="dots"></div>
    <div class="timer" id="timerWrap"><div id="timerBar"></div></div>
    <div class="play-body">
      <div class="vault-wrap" id="vaultWrap"><div class="vault" id="vault"></div></div>
      <div class="task">
        <p class="prompt" id="prompt" aria-live="polite"></p>
        <div class="display" id="display"></div>
        <div class="input-area" id="inputArea"></div>
        <button class="btn primary open-btn" id="btnOpen">AÇ 🔓</button>
      </div>
    </div>
  </section>

  <!-- EKRAN 4: TUR ÖZETİ -->
  <section class="screen" id="scr-summary">
    <div class="panel">
      <h2>Tur Bitti!</h2>
      <div class="big-stars" id="sumStars"></div>
      <p class="sum-txt" id="sumText"></p>
      <p class="sum-txt" id="sumKeys"></p>
      <div class="tip" id="sumTip"></div>
      <p class="unlock-txt" id="sumUnlock"></p>
      <div class="row">
        <button class="btn primary" id="btnAgain">Tekrar Oyna</button>
        <button class="btn soft" data-go="map">Haritaya Dön</button>
      </div>
    </div>
  </section>

  <!-- EKRAN 5: AYARLAR -->
  <section class="screen" id="scr-settings">
    <div class="panel">
      <h2>Ayarlar</h2>
      <div class="set-row">
        <button class="btn soft" id="btnSound"></button>
        <button class="btn danger" id="btnReset">İlerlemeyi Sıfırla</button>
        <p class="set-note" id="teacherNote"></p>
        <button class="btn primary" data-go="home">Geri</button>
      </div>
    </div>
  </section>

  <footer id="sig">Sinan İnce 2026</footer>
</div>

<!-- GERİ BİLDİRİM KATMANI -->
<div class="overlay" id="fbOverlay">
  <div class="panel">
    <h2 class="fb-title" id="fbTitle">Neredeyse!</h2>
    <p class="fb-msg" id="fbMsg"></p>
    <div id="fbTable"></div>
    <p class="fb-line" id="fbLine"></p>
    <button class="btn primary" id="btnRetry">Tekrar dene</button>
  </div>
</div>

<!-- GENEL MODAL -->
<div class="overlay" id="modal">
  <div class="panel">
    <h2 id="mTitle"></h2>
    <div id="mBody"></div>
    <div class="row" id="mBtns"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   8. OYUN MANTIĞI (DOM kullanmaz, konsoldan test edilebilir)
   ========================================================= */
/* === MANTIK BAŞI === */
const PLACES=['yüz binler','on binler','binler','yüzler','onlar','birler'];
const UNITS=['yüz binlik','on binlik','binlik','yüzlük','onluk','birlik'];
const POW=[100000,10000,1000,100,10,1];
const TOUR=8;

function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00A0');}
function cap(s){return s.charAt(0).toLocaleUpperCase('tr-TR')+s.slice(1);}
function digitsOf(n){return String(n).split('').map(Number);}
function termsOf(d){return d.map((x,i)=>({d:x,i:i,v:x*POW[i]})).filter(t=>t.d>0);}
function joinTr(a){return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' ve '+a[a.length-1];}
function expanded(n){return fmt(n)+' = '+termsOf(digitsOf(n)).map(t=>fmt(t.v)).join(' + ');}
function placeMsg(dg,i){return dg+' rakamı '+PLACES[i]+' basamağında: '+dg+' × '+fmt(POW[i])+' = '+fmt(dg*POW[i]);}

/* Sayı üretici. rule: 'none' sıfırsız | 'some' 1-3 sıfır | 'any' karışık.
   İlk rakam asla 0 değildir. Son 20 sayı tekrar etmez. */
function makeNumber(rule,recent){
  for(let t=0;t<300;t++){
    const d=[ri(1,9)];
    for(let i=1;i<6;i++) d.push(ri(1,9));
    const r=rule==='any'?(Math.random()<0.5?'none':'some'):rule;
    if(r==='some'){shuffle([1,2,3,4,5]).slice(0,ri(1,3)).forEach(p=>{d[p]=0;});}
    const n=Number(d.join(''));
    if(!recent.includes(n)||t>250){recent.push(n);if(recent.length>20)recent.shift();return n;}
  }
}

/* Tip 1 — Basamak avcısı (çoktan seçmeli) */
function qT1(rule,recent){
  const n=makeNumber(rule,recent), d=digitsOf(n);
  const p=pick([0,1,2,3,4,5].filter(i=>d[i]>0));
  const dig=d[p], val=dig*POW[p];
  const r=Math.random();
  let kind=r<0.4?'ad':(r<0.85?'deger':'sayi');
  if(kind==='sayi'&&p===5) kind='ad';
  let opts, prompt;
  if(kind==='ad'){
    prompt='Parlayan rakam hangi basamakta?';
    const order=[p-1,p+1,p-2,p+2,p-3,p+3,p-4,p+4,p-5,p+5].filter(i=>i>=0&&i<6);
    opts=[{label:cap(PLACES[p]),ok:true}].concat(order.slice(0,3).map(i=>({label:cap(PLACES[i]),ok:false,err:'basamakAdi'})));
  }else if(kind==='deger'){
    prompt='Parlayan rakamın basamak değeri kaçtır?';
    const ks=[...new Set([5,p-1,p+1,p-2,p+2,p-3,p+3,0,1,2,3,4].filter(k=>k>=0&&k<6&&k!==p))].slice(0,3);
    opts=[{label:fmt(val),ok:true}].concat(ks.map(k=>({label:fmt(dig*POW[k]),ok:false,err:k===5?'sayiDegeri':'kaydirma'})));
  }else{
    prompt='Parlayan rakamın sayı değeri kaçtır?';
    const cand=[{v:val,err:'sayiDegeri'}];
    if(p-1>=0) cand.push({v:dig*POW[p-1],err:'kaydirma'});
    if(p+1<5) cand.push({v:dig*POW[p+1],err:'kaydirma'});
    const other=d.filter(x=>x!==dig&&x>0);
    if(other.length) cand.push({v:pick(other),err:'diger'});
    for(let k=0;k<6;k++){const v=dig*POW[k];if(v!==dig&&!cand.some(c=>c.v===v))cand.push({v:v,err:'kaydirma'});}
    const pickC=[cand[0]].concat(shuffle(cand.slice(1))).slice(0,3);
    opts=[{label:String(dig),ok:true}].concat(pickC.map(c=>({label:fmt(c.v),ok:false,err:c.err})));
  }
  opts=shuffle(opts);
  return {type:'t1',kind:kind,n:n,d:d,p:p,prompt:prompt,display:{kind:'digits'},input:{kind:'options',opts:opts},
    check(ans){
      const o=opts[ans];
      if(o.ok) return {ok:true};
      let pre='';
      if(o.err==='sayiDegeri') pre='Sayı değeri rakamın kendisidir: '+dig+'. Basamak değeri ise rakamın bulunduğu yere göre bulunur. ';
      else if(o.err==='basamakAdi') pre='Basamakları sağdan say: birler, onlar, yüzler, binler, on binler, yüz binler. ';
      else if(o.err==='kaydirma') pre='Seçtiğin değer başka bir basamağa ait. ';
      else pre='Rakamın kendisine dikkat et. ';
      const tail=kind==='sayi'?('Sayı değeri: '+dig+'. Basamak değeri: '+fmt(val)+'.'):(placeMsg(dig,p)+'.');
      return {ok:false,err:o.err,msg:pre+tail,hl:[p]};
    }};
}

/* Tip 2 — Çözümle (kartları kutulara yerleştir) */
function qT2(rule,recent){
  const n=makeNumber(rule,recent), d=digitsOf(n), terms=termsOf(d), tv=terms.map(t=>t.v), dis=[];
  for(const t of shuffle(terms)){
    for(const k of shuffle([t.i-1,t.i+1])){
      if(k<0||k>5) continue;
      const v=t.d*POW[k];
      if(!tv.includes(v)&&!dis.includes(v)){dis.push(v);break;}
    }
    if(dis.length>=4) break;
  }
  const cards=shuffle(tv.concat(dis));
  return {type:'t2',n:n,d:d,prompt:'Sayıyı çözümle: Basamak değeri kartlarını kutulara yerleştir.',
    display:{kind:'eq'},input:{kind:'cards',cards:cards,slots:tv.length},
    check(arr){
      const a=arr.slice().sort((x,y)=>x-y).join(), b=tv.slice().sort((x,y)=>x-y).join();
      if(a===b) return {ok:true};
      const w=arr.filter(v=>!tv.includes(v))[0];
      for(const t of terms){
        if((t.i>0&&t.d*POW[t.i-1]===w)||(t.i<5&&t.d*POW[t.i+1]===w))
          return {ok:false,err:'kaydirma',msg:fmt(w)+' bu sayının parçası değil. '+placeMsg(t.d,t.i)+'.',hl:[t.i]};
      }
      return {ok:false,err:'diger',msg:'Bazı kartlar yanlış. Her rakamın değerini bulunduğu basamağa göre bul.',hl:[]};
    }};
}

/* Çark cevabını kontrol et ve hata türünü bul */
function checkDials(d,E){
  if(E.join('')===d.join('')) return {ok:true};
  const zeroPos=[];d.forEach((x,i)=>{if(x===0)zeroPos.push(i);});
  if(zeroPos.length&&d.filter(x=>x>0).join()===E.filter(x=>x>0).join()){
    return {ok:false,err:'sifir',hl:zeroPos,
      msg:'Sıfırı unutma! '+cap(joinTr(zeroPos.map(i=>PLACES[i])))+(zeroPos.length>1?' basamaklarında':' basamağında')+' değer yok. Oraya 0 yazılır.'};
  }
  let p=0;while(E[p]===d[p])p++;
  if(d[p]===0) return {ok:false,err:'sifir',hl:[p],msg:cap(PLACES[p])+' basamağında değer yok, oraya 0 yazılır.'};
  const near=(p>0&&E[p-1]===d[p])||(p<5&&E[p+1]===d[p]);
  return {ok:false,err:near?'kaydirma':'diger',hl:[p],msg:(near?'Rakam bir basamak kaymış. ':'')+placeMsg(d[p],p)+'.'};
}

/* Tip 3 — Birleştir (sıralı çözümleme → çarklar) */
function qT3(rule,recent){
  const n=makeNumber(rule,recent), d=digitsOf(n);
  return {type:'t3',n:n,d:d,prompt:'Basamak değerlerini birleştir, sayıyı çarklara gir.',
    display:{kind:'expr',text:termsOf(d).map(t=>fmt(t.v)).join(' + ')},input:{kind:'dials'},
    check(E){return checkDials(d,E);}};
}

/* Tip 4 — Karışık şifre (karışık sıra veya "4 yüz binlik" biçimi → çarklar) */
function qT4(rule,recent){
  const n=makeNumber(rule,recent), d=digitsOf(n), terms=termsOf(d);
  let order=shuffle(terms), tries=0;
  while(order.length>1&&order.every((t,j)=>t.i===terms[j].i)&&tries++<10) order=shuffle(terms);
  const unit=Math.random()<0.5;
  return {type:'t4',n:n,d:d,
    prompt:unit?'Kaç tane olduğuna bak, sayıyı çarklara gir.':'Parçalar karışık! Sayıyı bul, çarklara gir.',
    display:{kind:'expr',text:order.map(t=>unit?(t.d+' '+UNITS[t.i]):fmt(t.v)).join(' + ')},input:{kind:'dials'},
    check(E){return checkDials(d,E);}};
}

/* Kademeye göre soru üret. hint: yanlış yapılan soru türünü tekrar sormak için */
function makeQuestion(level,hint,recent){
  const usta=level===4;
  const type=usta?(hint?hint.type:pick(['t1','t2','t3','t4'])):['t1','t2','t3','t4'][level];
  let rule;
  if(type==='t1') rule=usta?'any':'none';
  else if(type==='t2') rule=usta?(hint&&hint.zero?'some':'any'):'none';
  else rule='some';
  const q={t1:qT1,t2:qT2,t3:qT3,t4:qT4}[type](rule,recent);
  q.hasZero=q.d.includes(0);q.usta=usta;
  return q;
}

/* Kabul testi: konsolda kasaTest() yaz */
function selfTest(N){
  N=N||10000;const errs=[], recent=[];
  for(let k=0;k<N;k++){
    const level=k%5, q=makeQuestion(level,null,recent), n=q.n, d=q.d;
    if(n<100000||n>999999) errs.push('aralık '+n);
    if(d[0]===0) errs.push('ilk rakam 0 '+n);
    if(termsOf(d).reduce((s,t)=>s+t.v,0)!==n) errs.push('toplam '+n);
    if((q.type==='t3'||q.type==='t4')&&!d.includes(0)) errs.push('sıfır yok '+n);
    if((level===0||level===1)&&d.includes(0)) errs.push('erken sıfır '+n);
    if(q.type==='t1'){
      const o=q.input.opts;
      if(o.length!==4) errs.push('şık sayısı '+n);
      if(o.filter(x=>x.ok).length!==1) errs.push('doğru şık '+n);
      if(new Set(o.map(x=>x.label)).size!==4) errs.push('tekrarlı şık '+n+' '+q.kind);
      if(!q.check(o.findIndex(x=>x.ok)).ok) errs.push('t1 doğru reddedildi');
      if(q.check(o.findIndex(x=>!x.ok)).ok) errs.push('t1 yanlış kabul');
      if(d[q.p]===0) errs.push('sıfır vurgulandı');
    }
    if(q.type==='t2'){
      const tv=termsOf(d).map(t=>t.v), c=q.input.cards, dis=c.filter(v=>!tv.includes(v));
      if(!tv.every(v=>c.includes(v))) errs.push('kart eksik '+n);
      if(new Set(c).size!==c.length) errs.push('tekrarlı kart '+n);
      if(!q.check(shuffle(tv)).ok) errs.push('t2 doğru reddedildi');
      if(dis.length<2) errs.push('az çeldirici '+n);
      if(dis.length){const bad=tv.slice();bad[0]=dis[0];const r=q.check(bad);if(r.ok||r.err!=='kaydirma')errs.push('t2 hata türü '+n);}
    }
    if(q.type==='t3'||q.type==='t4'){
      if(!q.check(d.slice()).ok) errs.push('çark doğru reddedildi');
      const nz=d.filter(x=>x>0), skip=nz.concat(Array(6-nz.length).fill(0));
      if(skip.join('')!==d.join('')){const r=q.check(skip);if(r.ok||r.err!=='sifir') errs.push('sıfır atlama yakalanmadı '+n);}
    }
  }
  return {N:N,hatalar:errs.length,ornek:errs.slice(0,10)};
}

   10. SES (Web Audio API)
   ========================================================= */
const Snd={
  ctx:null,
  init(){
    if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
    if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();
  },
  tone(f,dur,type,vol,delay){
    if(!S.sound||!this.ctx)return;
    const t=this.ctx.currentTime+(delay||0), o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(this.ctx.destination);o.start(t);o.stop(t+dur+0.05);
  },
  tick(){this.tone(1800,0.04,'square',0.05);},
  place(){this.tone(520,0.08,'triangle',0.18);this.tone(780,0.08,'triangle',0.12,0.05);},
  unlock(){this.tone(140,0.12,'square',0.08);[523,659,784,1047].forEach((f,i)=>this.tone(f,0.35,'triangle',0.18,0.2+i*0.07));},
  wrong(){this.tone(220,0.25,'sine',0.2);this.tone(175,0.3,'sine',0.15,0.12);},
  fanfare(){[523,659,784,659,784,1047].forEach((f,i)=>this.tone(f,0.3,'square',0.07,i*0.12));}
};
document.addEventListener('pointerdown',()=>Snd.init());

  cards.forEach((v,ci)=>{
    const c=el('button','card',fmt(v));
    c.onclick=()=>{const e=G.ans.slots.indexOf(null);if(e<0)return;G.ans.slots[e]=ci;Snd.place();paintCards();};
    bank.appendChild(c);
  });
  area.append(sl,bank);paintCards();
}
function paintCards(){
  const cards=G.q.input.cards;
  document.querySelectorAll('.slot').forEach((s,i)=>{const ci=G.ans.slots[i];s.textContent=ci===null?'':fmt(cards[ci]);s.classList.toggle('filled',ci!==null);});
  document.querySelectorAll('.card').forEach((c,ci)=>c.classList.toggle('used',G.ans.slots.includes(ci)));
  updOpen();
}

/* Şifre çarkları */
function buildDials(area,hideLabels){
  G.ans={E:[0,0,0,0,0,0],cur:0};
  const wrap=el('div','dials');
  [[[0,1,2],'Binler Bölüğü','g1'],[[3,4,5],'Birler Bölüğü','g2']].forEach(([ids,lab,cls])=>{
    const g=el('div','dial-group '+cls);g.appendChild(el('div','group-label',lab));
    const row=el('div','dial-row');
    ids.forEach(i=>{
      const dl=el('div','dial');dl.dataset.i=i;
      dl.innerHTML=`<button class="arr up" aria-label="${PLACES[i]} artır">▲</button><div class="dg">0</div>
        <button class="arr down" aria-label="${PLACES[i]} azalt">▼</button><div class="dlabel">${hideLabels?'&nbsp;':cap(PLACES[i])}</div>`;
      row.appendChild(dl);
    });
    g.appendChild(row);wrap.appendChild(g);
  });
  wrap.addEventListener('click',e=>{
    const dl=e.target.closest('.dial');if(!dl||G.busy)return;
    const i=+dl.dataset.i, delta=e.target.closest('.down')?-1:1;
    G.ans.E[i]=(G.ans.E[i]+delta+10)%10;G.ans.cur=i;Snd.tick();paintDials();
  });
  area.appendChild(wrap);paintDials();
}
function paintDials(){
  document.querySelectorAll('.dial').forEach(dl=>{const i=+dl.dataset.i;dl.querySelector('.dg').textContent=G.ans.E[i];dl.classList.toggle('cur',i===G.ans.cur);});
}

/* AÇ düğmesi */
function updOpen(){
  const k=G.q.input.kind;let ok=true;
  if(k==='options') ok=G.ans.sel!==null;
  if(k==='cards') ok=!G.ans.slots.includes(null);
  $('#btnOpen').disabled=!ok||G.busy;
}
function tryOpen(){
  if(G.busy||$('#btnOpen').disabled)return;
  const q=G.q,k=q.input.kind;
  const ans=k==='options'?G.ans.sel:k==='cards'?G.ans.slots.map(ci=>q.input.cards[ci]):G.ans.E.slice();
  const r=q.check(ans);
  if(r.ok) onCorrect(); else onWrong(r);
}
$('#btnOpen').onclick=tryOpen;

function onCorrect(){
  stopTimer();G.busy=true;updOpen();
  const first=G.first;
  G.results[G.idx]=first?'ok':'retry';
  if(first){G.earned++;S.keys++;save();updateKeys();}
  renderDots();Snd.unlock();
  $('#prompt').textContent=first?'Kasa açıldı! 🎉':'Kasa açıldı!';
  const v=$('#vault');v.classList.add('spin');
  setTimeout(()=>{v.classList.add('open');if(first)floatKey();},350);
  setTimeout(()=>{v.classList.remove('open','spin');G.idx++;G.busy=false;nextQ();},1500);
}
function markWrong(err){
  if(!G.first)return;
  G.first=false;G.errors[err]=(G.errors[err]||0)+1;
  if(G.idx<TOUR-1&&G.pending.length<2) G.pending.push({type:G.q.type,zero:G.q.hasZero});
  G.results[G.idx]='bad';renderDots();
}
function onWrong(r){
  stopTimer();Snd.wrong();
  const v=$('#vault');v.classList.remove('shake');void v.offsetWidth;v.classList.add('shake');
  markWrong(r.err);showFeedback(r);
}
function onTimeout(){
  if(G.busy)return;
  Snd.wrong();markWrong('sure');
  showFeedback({msg:'Süre doldu! Doğru cevabı incele, sonra tekrar dene.',hl:G.q.type==='t1'?[G.q.p]:[]},'Süre doldu!');
}
function floatKey(){const f=el('div','float-key','+1 🔑');$('#vaultWrap').appendChild(f);setTimeout(()=>f.remove(),1200);}

/* Geri bildirim: basamak tablosu + çözümleme */
function pvTable(d,hl){
  hl=hl||[];const c=i=>hl.includes(i)?' class="hl"':'';
  return `<table class="pv"><tr class="bol"><th colspan="3" class="b1">Binler Bölüğü</th><th colspan="3" class="b2">Birler Bölüğü</th></tr>
    <tr class="names">${PLACES.map((p,i)=>`<th${c(i)}>${cap(p)}</th>`).join('')}</tr>
    <tr class="digs">${d.map((x,i)=>`<td${c(i)}>${x}</td>`).join('')}</tr>
    <tr class="vals">${d.map((x,i)=>`<td${c(i)}>${fmt(x*POW[i])}</td>`).join('')}</tr></table>`;
}
function showFeedback(r,title){
  $('#fbTitle').textContent=title||pick(['Neredeyse!','Az kaldı!','Bir daha bakalım!']);
  $('#fbMsg').textContent=r.msg;
  $('#fbTable').innerHTML=pvTable(G.q.d,r.hl);
  $('#fbLine').textContent=expanded(G.q.n);
  $('#fbOverlay').classList.add('show');
}
function retry(){$('#fbOverlay').classList.remove('show');Snd.place();renderInput();}
$('#btnRetry').onclick=retry;

/* Süre (yalnızca Usta Kasa, yalnızca ilk deneme) */
function startTimer(){
  stopTimer();
  $('#timerWrap').style.display='block';
  G.left=TIME*10;paintTimer();
  G.timer=setInterval(()=>{G.left--;paintTimer();if(G.left<=0){stopTimer();onTimeout();}},100);
}
function stopTimer(){if(G.timer){clearInterval(G.timer);G.timer=null;}}
function paintTimer(){const p=G.left/(TIME*10);const b=$('#timerBar');b.style.width=(p*100)+'%';b.classList.toggle('low',p<0.3);}

/* Turdan çık */
$('#btnQuit').onclick=()=>{
  openModal('Turdan çıkılsın mı?','<p class="set-note">Bu turdaki yıldızlar kaydedilmez. Kazandığın anahtarlar sende kalır.</p>',
    [{label:'Devam et',cls:'primary'},{label:'Çık',cls:'soft',fn:()=>{stopTimer();show('map');}}]);
};

/* Klavye desteği */
document.addEventListener('keydown',e=>{
  if(!$('#scr-play').classList.contains('active'))return;
  if($('#modal').classList.contains('show'))return;
  if($('#fbOverlay').classList.contains('show')){if(e.key==='Enter'){e.preventDefault();retry();}return;}
  if(!G.q||G.busy)return;
  if(e.key==='Enter'){e.preventDefault();tryOpen();return;}
  const k=G.q.input.kind;
  if(k==='options'&&/^[1-4]$/.test(e.key)) selectOpt(+e.key-1);
  if(k==='dials'){
    const A=G.ans;
    if(/^[0-9]$/.test(e.key)){A.E[A.cur]=+e.key;if(A.cur<5)A.cur++;}
    else if(e.key==='ArrowLeft') A.cur=Math.max(0,A.cur-1);
    else if(e.key==='ArrowRight') A.cur=Math.min(5,A.cur+1);
    else if(e.key==='ArrowUp') A.E[A.cur]=(A.E[A.cur]+1)%10;
    else if(e.key==='ArrowDown') A.E[A.cur]=(A.E[A.cur]+9)%10;
    else if(e.key==='Backspace'){if(A.E[A.cur]===0)A.cur=Math.max(0,A.cur-1);A.E[A.cur]=0;}
    else return;
    e.preventDefault();Snd.tick();paintDials();
  }
});

/* =========================================================
   15. TUR ÖZETİ
   ========================================================= */
function endTour(){
  stopTimer();
  const firstOk=G.results.filter(r=>r==='ok').length;
  const st=firstOk>=8?3:firstOk>=6?2:firstOk>=4?1:0;
  const next=G.level+1, wasOpen=next<5&&isUnlocked(next);
  if(st>S.stars[G.level]) S.stars[G.level]=st;
  save();
  show('summary');
  $('#sumStars').innerHTML=[0,1,2].map(i=>`<span style="animation-delay:${i*0.25}s">${i<st?'★':'☆'}</span>`).join('');
  $('#sumText').textContent=TOUR+' kasadan '+firstOk+' tanesini ilk denemede açtın.';
  $('#sumKeys').textContent='+'+G.earned+' 🔑';
  const errKeys=Object.keys(G.errors).sort((a,b)=>G.errors[b]-G.errors[a]);
  $('#sumTip').textContent=errKeys.length?('💡 '+TIPS[errKeys[0]]):'🏆 Harika! Hiç hata yapmadın.';
  let u='';
  if(next<5&&!wasOpen&&isUnlocked(next)) u='🔓 Yeni kasa açıldı: '+LEVELS[next].name+'!';
  else if(G.level===4&&st===3) u='👑 Tebrikler! Artık bir Kasa Ustasısın!';
  else if(next<5&&!isUnlocked(next)) u='Sıradaki kasayı açmak için en az 2 yıldız topla.';
  $('#sumUnlock').textContent=u;
  Snd.fanfare();
}
$('#btnAgain').onclick=()=>{Snd.place();startLevel(G.level);};

/* =========================================================
   16. AYARLAR + ÖĞRETMEN MODU
   ========================================================= */
function renderSettings(){
  $('#btnSound').textContent='Ses: '+(S.sound?'Açık 🔊':'Kapalı 🔇');
  $('#teacherNote').textContent=S.unlockAll?'Öğretmen modu açık: Tüm kasalar açık.':'';
}
$('#btnSound').onclick=()=>{S.sound=!S.sound;save();renderSettings();Snd.place();};
$('#btnReset').onclick=()=>{
  openModal('Emin misin?','<p class="set-note">Tüm yıldızlar, anahtarlar ve temalar silinecek.</p>',
    [{label:'Vazgeç',cls:'soft'},{label:'Sıfırla',cls:'danger',fn:()=>{
      const snd=S.sound;S=JSON.parse(JSON.stringify(DEF));S.sound=snd;save();applyTheme();updateKeys();renderSettings();toast('İlerleme sıfırlandı.');}}]);
};
/* İmzaya 5 dokunuş → şifre (2026) → tüm kasaları aç/kapat */
let tapN=0,tapT=0;
$('#sig').addEventListener('click',()=>{
  const now=Date.now();if(now-tapT>2500)tapN=0;tapT=now;
  if(++tapN>=5){tapN=0;teacherPrompt();}
});
function teacherPrompt(){
  openModal('Öğretmen Modu','<input class="modal-in" id="tPass" type="password" inputmode="numeric" placeholder="Şifre"><p class="err-txt" id="tErr"></p>',
    [{label:'İptal',cls:'soft'},{label:'Tamam',cls:'primary',fn:()=>{
      if($('#tPass').value!=='2026'){$('#tErr').textContent='Şifre yanlış.';return false;}
      S.unlockAll=!S.unlockAll;save();
      toast(S.unlockAll?'Öğretmen modu açık: Tüm kasalar açık.':'Öğretmen modu kapandı.');
      if($('#scr-map').classList.contains('active'))renderMap();
      if($('#scr-settings').classList.contains('active'))renderSettings();
    }}]);
  setTimeout(()=>{const i=$('#tPass');if(i)i.focus();},50);
}

/* =========================================================
   17. BAŞLANGIÇ
   ========================================================= */
$('#homeVault').innerHTML=vaultHTML(false);
$('#vault').innerHTML=vaultHTML(true);
applyTheme();updateKeys();
window.kasaTest=selfTest;
</script>
