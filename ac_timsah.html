/* ----- 8.6 Düello -----
   İki yarı aynı anda, birbirinden bağımsız oynar (pointerdown → çoklu dokunma).
   Her oyuncunun kendi soru üreteci var: kademe aynı, sorular farklı (kopya yok).
   Nehir yarışı: doğru → 1 adım ileri · yanlış → 1 adım geri (0'ın altına inmez) + 2 sn panel.
   10 adıma ilk varan kazanır. */
const Duello = { kademe: 'kolay', renkler: [0, 1], adim: [0, 0], bitti: false, oturum: 0, oyuncular: [] };
function duelloYari(t) { return $(`#sahne-duello .duello-yari[data-taraf="${t}"]`); }
function duelloCiz(tam) {
  for (const t of [0, 1]) {
    const yari = duelloYari(t);
    if (tam) $('.nehir-timsah', yari).innerHTML = timsahSVG(TIMSAH_RENKLERI[Duello.renkler[t]]);
    $('.nehir', yari).style.setProperty('--adim', Duello.adim[t]);
    $('.duello-skor', yari).textContent = `${Duello.adim[t]} / ${DUELLO_HEDEF}`;
  }
  const k = KADEMELER.find(x => x.id === Duello.kademe);
  $('#duello-kademe').textContent = k ? k.ad : '';
}
function duelloAdim(t, fark) {
  if (Duello.bitti) return;
  Duello.adim[t] = Math.max(0, Math.min(DUELLO_HEDEF, Duello.adim[t] + fark));
  duelloCiz(false);
  const nt = $('.nehir-timsah', duelloYari(t));
  nt.classList.remove('ileri', 'geri');
  void nt.offsetWidth;
  nt.classList.add(fark > 0 ? 'ileri' : 'geri');
  if (Duello.adim[t] >= DUELLO_HEDEF) {
    Duello.bitti = true;
    Duello.oyuncular.forEach(o => o.durdur());
    const tok = Duello.oturum;
    setTimeout(() => {
      if (tok === Duello.oturum && Sahne.aktif === 'duello') Sahne.git('duello-sonu', { kazanan: t });
    }, 1200);
  }
}

const DALGA_SVG = '<svg class="dalga arena-dalga" viewBox="0 0 1200 40" preserveAspectRatio="none" aria-hidden="true"><path d="M0 20 Q75 2 150 20 T300 20 T450 20 T600 20 T750 20 T900 20 T1050 20 T1200 20 V40 H0 Z" fill="var(--su-ust)"/></svg>';
const DUELLO_ALAN_HTML = `
  <div class="arena">
    <div class="ufuk" aria-hidden="true"></div>
    ${DALGA_SVG}
    <button class="balik-kap sol"></button>
    <div class="timsah-kap"></div>
    <button class="balik-kap sag"></button>
    <div class="isaret-rozet" aria-hidden="true"></div>
  </div>
  <div class="isaret-dugmeleri" hidden>
    <button class="isaret-btn" data-secim="sol" aria-label="büyüktür"></button>
    <button class="isaret-btn" data-secim="esit" aria-label="eşittir"></button>
    <button class="isaret-btn" data-secim="sag" aria-label="küçüktür"></button>
  </div>
  <div class="cumle-kutu" aria-live="polite"></div>
  <div class="geri-katman" hidden>
    <div class="geri-panel" role="dialog" aria-label="Doğru cevap">
      <div class="geri-icerik" style="display:contents"></div>
      <div class="gp-sure"><i></i></div>
    </div>
  </div>`;

/* Bir düello yarısı: tek oyuncudaki karşılaştırma mekaniğinin kendi alanına kapalı kopyası */
class DuelloOyuncu {
  constructor(t) {
    this.t = t;
    this.kok = $('.duello-alan', duelloYari(t));
    this.kok.innerHTML = DUELLO_ALAN_HTML;
    this.kilit = true;
    this.bakinma = null;
    this.soru = null;
    dokun(this.q('.balik-kap.sol'), () => { if (this.kademe !== 'zor') this.cevapla('sol'); });
    dokun(this.q('.balik-kap.sag'), () => { if (this.kademe !== 'zor') this.cevapla('sag'); });
    this.qa('.isaret-btn').forEach(b => dokun(b, () => this.cevapla(b.dataset.secim)));
  }
  q(s) { return this.kok.querySelector(s); }
  qa(s) { return [...this.kok.querySelectorAll(s)]; }

  baslat(kademe) {
    this.kademe = kademe;
    this.uretec = new SoruUreteci(kademe);
    this.dogruSayisi = 0;
    const renk = TIMSAH_RENKLERI[Duello.renkler[this.t]];
    this.q('.arena').classList.toggle('zor', kademe === 'zor');
    this.q('.isaret-dugmeleri').hidden = kademe !== 'zor';
    this.q('.timsah-kap').innerHTML = timsahSVG(renk);
    this.qa('.isaret-btn').forEach(b => {
      const s = b.dataset.secim;
      const isaret = s === 'sol' ? '>' : s === 'sag' ? '<' : '=';
      b.innerHTML = ISARET_SVG[isaret] + (s === 'esit' ? '' :
        `<span class="mini-timsah ${s === 'sol' ? 'sola' : ''}">${timsahSVG(renk, 'agiz-acik')}</span>`);
    });
    this.q('.geri-katman').hidden = true;
    this.soruGoster();
  }
  durdur() {
    clearInterval(this.bakinma);
    this.bakinma = null;
    this.kilit = true;
    if (this.q('.geri-katman')) this.q('.geri-katman').hidden = true;
  }
  bakinmaBaslat() {
    clearInterval(this.bakinma);
    this.bakinma = setInterval(() => this.q('.timsah-kap').classList.toggle('sola'), 1400);
  }
  balikCiz(taraf, sayi, renk) {
    const el = this.q('.balik-kap.' + taraf);
    el.className = 'balik-kap ' + taraf;
    el.innerHTML = balikSVG(sayi, renk, taraf === 'sag');
    el.setAttribute('aria-label', String(sayi));
    void el.offsetWidth;
    el.classList.add('geliyor');
  }
  soruGoster() {
    this.soru = this.uretec.uret();
    const renk = karistir([...BALIK_RENKLERI]);
    this.balikCiz('sol', this.soru.a, renk[0]);
    this.balikCiz('sag', this.soru.b, renk[1]);
    const kap = this.q('.timsah-kap');
    kap.className = 'timsah-kap' + (Math.random() < 0.5 ? ' sola' : '');
    this.q('.timsah').classList.remove('agiz-acik');
    this.q('.isaret-rozet').classList.remove('goster');
    this.qa('.isaret-btn').forEach(b => b.classList.remove('dogru', 'yanlis'));
    const k = this.q('.cumle-kutu');
    k.className = 'cumle-kutu goster';
    k.innerHTML = this.kademe === 'zor'
      ? '<p class="yonerge">Doğru işareti seç!</p>'
      : '<p class="yonerge">Timsah hangisini yer?</p><p class="ipucu">Büyük sayıya dokun.</p>';
    this.kilit = false;
    this.bakinmaBaslat();
  }
  balon(metin, konum, iyi) {
    const b = document.createElement('div');
    b.className = `balon ${konum} ${iyi ? 'iyi' : 'kotu'}`;
    b.textContent = metin;
    this.q('.arena').appendChild(b);
    setTimeout(() => b.remove(), 950);
  }
  async cevapla(secim) {
    if (this.kilit || Duello.bitti) return;
    this.kilit = true;
    clearInterval(this.bakinma);
    const tok = Duello.oturum;
    const devam = () => tok === Duello.oturum;
    const { a, b } = this.soru;
    const dogruSecim = a > b ? 'sol' : a < b ? 'sag' : 'esit';
    const dogru = secim === dogruSecim;
    const kap = this.q('.timsah-kap');
    const timsah = this.q('.timsah');

    if (this.kademe === 'zor') {
      this.qa('.isaret-btn').forEach(btn => {
        if (btn.dataset.secim === dogruSecim) btn.classList.add('dogru');
        else if (btn.dataset.secim === secim) btn.classList.add('yanlis');
      });
    }
    if (secim === 'esit') {
      kap.classList.add(dogru ? 'mutlu' : 'uzgun');
      if (!dogru) { Ses.cal('bos'); this.balon('Tüh!', 'orta', false); }
      await bekle(600); if (!devam()) return;
      kap.classList.remove('mutlu', 'uzgun');
    } else {
      kap.classList.toggle('sola', secim === 'sol');
      await bekle(200); if (!devam()) return;
      timsah.classList.add('agiz-acik');
      await bekle(180); if (!devam()) return;
      kap.classList.add('saldir-' + secim);
      const balik = this.q('.balik-kap.' + secim);
      balik.classList.remove('geliyor');
      balik.classList.add(dogru ? 'yeniyor' : 'kaciyor');
      await bekle(200); if (!devam()) return;
      timsah.classList.remove('agiz-acik');
      Ses.cal(dogru ? 'hap' : 'bos');
      Ses.cal('sicrama');
      this.balon(dogru ? 'Hap!' : 'Tüh!', dogru ? secim : 'orta', dogru);
      await bekle(200); if (!devam()) return;
      kap.classList.remove('saldir-' + secim);
    }

    if (dogru) {
      Ses.cal('dogru');
      this.dogruSayisi++;
      timsah.style.setProperty('--gobek', Math.min(this.dogruSayisi, 10));
      this.q('.isaret-rozet').innerHTML = ISARET_SVG[isaretBul(a, b)];
      this.q('.isaret-rozet').classList.add('goster');
      const k = this.q('.cumle-kutu');
      k.className = 'cumle-kutu goster dogru';
      k.innerHTML = `<div class="ifade">${ifadeHTML(a, b)}</div><p class="okunus">${okunusCumlesi(a, b)}</p>`;
      duelloAdim(this.t, +1);
      await bekle(750);
    } else {
      Ses.cal('yanlis');
      duelloAdim(this.t, -1);
      this.panelGoster();
      await bekle(2000);
      if (devam()) this.q('.geri-katman').hidden = true;
    }
    if (!devam() || Duello.bitti) return;
    this.soruGoster();
  }
  panelGoster() {
    const dar = this.kok.getBoundingClientRect().width < 600;
    this.q('.geri-icerik').innerHTML = geriBildirimHTML(this.soru, this.kademe, dar);
    this.q('.geri-katman').hidden = false;
    const sure = this.q('.gp-sure');
    sure.classList.remove('akiyor');
    void sure.offsetWidth;
    sure.classList.add('akiyor');
  }
}

for (const t of [0, 1]) {
  $('.nehir-noktalar', duelloYari(t)).innerHTML = '<i></i>'.repeat(DUELLO_HEDEF + 1);
}
Duello.oyuncular = [new DuelloOyuncu(0), new DuelloOyuncu(1)];

Sahne.tanimla('duello', {
  gir(p) {
    if (p.kademe) Duello.kademe = p.kademe;
    if (p.renkler) Duello.renkler = [...p.renkler];
    Duello.oturum++;
    Duello.adim = [0, 0];
    Duello.bitti = false;
    duelloCiz(true);
    Duello.oyuncular.forEach(o => o.baslat(Duello.kademe));
  },
  cik() {
    Duello.oturum++;
    Duello.oyuncular.forEach(o => o.durdur());
  }
});
$('#duello-cik').addEventListener('click', () => Onay.ac('Yarış bitsin mi?', 'Evet, bitir', () => Sahne.git('menu')));

/* ----- 8.7 Düello sonu ----- */
Sahne.tanimla('duello-sonu', {
  gir(p) {
    for (const t of [0, 1]) {
      const kazandi = t === p.kazanan;
      const el = $(`#sahne-duello-sonu .sonuc-taraf[data-taraf="${t}"]`);
      el.classList.toggle('kazanan', kazandi);
      el.innerHTML =
        (kazandi ? `<div class="tac">${IKON.tac}</div>` : '') +
        timsahSVG(TIMSAH_RENKLERI[Duello.renkler[t]], kazandi ? 'agiz-acik' : '') +
        `<h3>${t + 1}. Oyuncu</h3><p>${kazandi ? 'Kazandı!' : 'Çok iyi yarıştı!'}</p>`;
    }
    $('#sonuc-skor').innerHTML = `${Duello.adim[0]} <span>–</span> ${Duello.adim[1]}`;
    Ses.cal('fanfar');
    konfeti();
  }
});
$('#btn-rovans').addEventListener('click', () => geriSayim(() => Sahne.git('duello', {})));

/* ----- 8.8 Ayarlar ----- */
function sesAnahtariCiz() {
  const a = $('#ayar-ses');
  a.classList.toggle('acik', Depo.veri.ses);
  a.setAttribute('aria-checked', String(Depo.veri.ses));
}
$('#ayar-ses').addEventListener('click', () => {
  Depo.veri.ses = !Depo.veri.ses;
  Depo.kaydet();
  sesAnahtariCiz();
});
$('#ayar-sifirla').addEventListener('click', () =>
  Onay.ac('Tüm yıldızlar silinsin mi?', 'Evet, sil', () => { Depo.sifirla(); bildir('İlerleme sıfırlandı'); }));
Sahne.tanimla('ayarlar', { gir() { sesAnahtariCiz(); } });

/* =========================================================
   9. GENEL OLAYLAR
   ========================================================= */
/* data-git="sahne" olan düğmeler o sahneye götürür */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-git]');
  if (b && !b.disabled) Sahne.git(b.dataset.git);
});
/* Tık sesi (anında tepki veren dokunmatik düğmeler kendi sesini çalar) */
document.addEventListener('click', e => {
  const b = e.target.closest('.dugme, .ikon-dugme, .bolum-kart, .anahtar');
  if (b && !b.dataset.dokun) Ses.cal('tik');
});
/* Uzun basma menüsü ve iOS yakınlaştırma hareketi kapalı */
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

/* =========================================================
   9B. GÖL SÜSLERİ (yalnız görsel)
   ========================================================= */
const NILUFER_SVG = '<svg viewBox="0 0 100 56" aria-hidden="true">' +
  '<path d="M50 30 58 6.4A46 24 0 1 1 42 6.4Z" fill="#3DBE6B"/>' +
  '<path d="M50 30 20 17M50 30 13 34M50 30 34 50M50 30 66 50M50 30 87 34M50 30 80 15" stroke="#2FA85A" stroke-width="2" stroke-linecap="round"/></svg>';
const CICEKLI_NILUFER_SVG = NILUFER_SVG.replace('</svg>',
  '<g transform="translate(64 22)"><ellipse cx="0" cy="-7" rx="4.5" ry="8" fill="#FF9EC0"/><ellipse cx="-7" cy="-2" rx="4.5" ry="8" transform="rotate(-60 -7 -2)" fill="#FF9EC0"/><ellipse cx="7" cy="-2" rx="4.5" ry="8" transform="rotate(60 7 -2)" fill="#FF9EC0"/><circle r="3.5" fill="#FFD600"/></g></svg>');
function nilufurEkle(kap, yerler) {
  yerler.forEach(([stil, gecikme, cicekli]) => {
    const d = document.createElement('div');
    d.className = 'nilufer';
    d.style.cssText = `${stil};animation-delay:${gecikme}s`;
    d.innerHTML = cicekli ? CICEKLI_NILUFER_SVG : NILUFER_SVG;
    kap.appendChild(d);
  });
}
nilufurEkle($('#sahne-menu .menu-gol'), [
  ['left:5%;top:calc(var(--su) + 2.5rem)', 0, true],
  ['right:6%;top:calc(var(--su) + 5rem)', -2, false],
  ['left:15%;bottom:7%', -3.5, false]
]);
[8, 22, 37, 63, 78, 91].forEach((x, i) => {
  const k = document.createElement('span');
  k.className = 'kabarcik';
  k.style.left = x + '%';
  k.style.animationDelay = -i * 1.1 + 's';
  $('#sahne-menu .menu-gol').appendChild(k);
});
nilufurEkle($('#sahne-oyun'), [['left:2%;bottom:4%', -1, true], ['right:3%;bottom:12%', -3, false]]);

/* Gökyüzü katmanı: güneş + üç bulut (farklı hız ve boyda) */
const BULUT_SVG = '<svg viewBox="0 0 120 50" aria-hidden="true"><path d="M22 46h76a18 18 0 0 0 1-36 26 26 0 0 0-49-5A20 20 0 0 0 22 46z" fill="#fff"/></svg>';
function gokEkle(sahneId, gunesVar = true) {
  const g = document.createElement('div');
  g.className = 'gok-katmani';
  g.setAttribute('aria-hidden', 'true');
  const bulutlar = [[14, 80, -12, 'clamp(6rem,13vw,12rem)', .92], [34, 110, -70, 'clamp(5rem,10vw,9rem)', .8], [6, 140, -40, 'clamp(4rem,8vw,7rem)', .6]];
  g.innerHTML = (gunesVar ? '<div class="gunes"></div>' : '') + bulutlar.map(([ust, sure, gecikme, gen, op]) =>
    `<div class="bulut" style="top:${ust}%;width:${gen};opacity:${op};animation-duration:${sure}s;animation-delay:${gecikme}s">${BULUT_SVG}</div>`).join('');
  $('#sahne-' + sahneId).prepend(g);
}
['menu', 'bolumler', 'oyun', 'hazirlik'].forEach(id => gokEkle(id));
gokEkle('duello', false);

/* =========================================================
   10. BAŞLAT
   ========================================================= */
Depo.yukle();
$$('[data-ikon]').forEach(el => { el.innerHTML = IKON[el.dataset.ikon] || ''; });
menuSahnesiCiz();
Sahne.git('menu');
</script>
