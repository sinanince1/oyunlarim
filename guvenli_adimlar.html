    {e:"📵", s:"Görevli 'kapatabilirsin' demeden neden telefonu kapatmayız?", n:"Görevli yeni bir bilgi isteyebilir ya da önemli bir talimat verebilir."},
    {e:"😜", s:"Şaka amaçlı 112'yi aramak neden yanlış bir seçimdir?", n:"Hat meşgul olur; o sırada gerçekten yardım bekleyen birine ulaşmak gecikebilir."},
    {e:"💭", s:"Bugün öğrendiklerinle hangi güvenli seçimi yapacaksın? Neden?", n:"Her öğrenci bir seçim ve bir 'çünkü' cümlesi söylesin."}
  ]
};
const Ders = {
  KARTLAR:[
    {k:"on", ikon:"💬", ad:"Ön Değerlendirme", ac:"Derse başlarken ve bitirirken konuşma soruları.", renk:"#00C9A7"},
    {k:"rehber", ikon:"🪧", ad:"Levha Rehberi", ac:"Levhaları tek tek tanıtın, sınıf tahmin etsin.", renk:"#4D9FFF"},
    {k:"canlandir", ikon:"📞", ad:"112 Canlandırma", ac:"Arayan ve Görevli rolleriyle adım adım canlandırın.", renk:"#FF4D8D"},
    {k:"karar", ikon:"👍", ad:"Sınıfça Karar", ac:"Doğru mu, yanlış mı? Sınıfça oylayın, çubuğu doldurun.", renk:"#A855F7"}
  ],
  ileri:null, geri:null,
  hazirla(){
    $("#dersIzgara").innerHTML=this.KARTLAR.map(c=>`<button class="ders-kart" data-k="${c.k}" style="background:${c.renk}"><span class="ikon">${c.ikon}</span><b>${c.ad}</b><span>${c.ac}</span></button>`).join("");
    $$("#dersIzgara .ders-kart").forEach(b=>b.onclick=()=>{ Ses.tik(); Sahne.goster("dersAlt",this.KARTLAR.find(c=>c.k===b.dataset.k)); });
  },
  altHazirla(c){
    this.ileri=this.geri=null;
    ({on:()=>this.onAc(), rehber:()=>this.rehberAc(), canlandir:()=>this.canlandirSec(), karar:()=>this.kararAc()})[c.k]();
  },
  kutu(){ return $("#dersAltIcerik"); },
  gezinti(no,top){
    return `<div class="ders-gezinti"><button class="dugme beyaz" id="dGeri" ${no<=0?"disabled":""}>◀</button><span>${no+1} / ${top}</span><button class="dugme mavi" id="dIleri" ${no>=top-1?"disabled":""}>▶</button></div>`;
  },
  gezintiBagla(){ const g=$("#dGeri"), i=$("#dIleri"); if(g) g.onclick=()=>this.geri&&this.geri(); if(i) i.onclick=()=>this.ileri&&this.ileri(); },

  /* --- Ön Değerlendirme --- */
  onDurum:{set:"bas",no:0},
  onAc(){
    const d=this.onDurum, liste=ON_SORULAR[d.set], q=liste[d.no];
    this.kutu().innerHTML=`
      <div class="ders-ekran">
        <div class="ders-sekmeler">
          <button class="sekme ${d.set==="bas"?"secili":""}" data-set="bas">🌅 Derse başlarken</button>
          <button class="sekme ${d.set==="son"?"secili":""}" data-set="son">🌙 Dersi bitirirken · Neden?</button>
        </div>
        <div class="ders-sahne"><div class="ders-dev-emoji">${q.e}</div><div class="ders-buyuk">${q.s}</div>
          <button class="dugme sari" id="notBtn">💡 Öğretmen notu</button><div class="ders-not gizli" id="dersNot">${q.n}</div></div>
        ${this.gezinti(d.no,liste.length)}
      </div>`;
    $$(".ders-sekmeler .sekme").forEach(b=>b.onclick=()=>{ Ses.tik(); d.set=b.dataset.set; d.no=0; this.onAc(); });
    $("#notBtn").onclick=()=>{ Ses.tik(); $("#dersNot").classList.toggle("gizli"); };
    this.geri=()=>{ if(d.no>0){ Ses.tik(); d.no--; this.onAc(); } };
    this.ileri=()=>{ if(d.no<liste.length-1){ Ses.tik(); d.no++; this.onAc(); } };
    this.gezintiBagla(); Sesli.otomatik(q.s);
  },

  /* --- Levha Rehberi --- */
  rehberNo:0,
  rehberSira(){ const s=[]; ROTA_SIRASI.forEach(r=>ROTA_LEVHALARI[r].forEach(k=>{ if(!s.includes(k)) s.push(k); })); return ["sekiller",...s]; },
  rehberAc(){
    const sira=this.rehberSira(), no=this.rehberNo, k=sira[no];
    let govde;
    if(k==="sekiller"){
      const ornek=[["okul_gecidi","Kırmızı kenarlı üçgen","Uyarır: Dikkat et!"],["yaya_giremez","Kırmızı kenarlı daire","Yasaklar: Yapma, giremezsin!"],
                   ["yaya_gecidi","Mavi levha","Bilgi verir, yol gösterir."],["dur","Sekiz köşeli kırmızı","Dur!"],["yaya_isik","Işıklar","Kırmızı bekle, yeşil geç."]];
      govde=`<div class="ders-buyuk">Levhalar şekil ve renkle konuşur</div>
        <div class="sekil-izgara">${ornek.map(([kod,a,b])=>`<div class="sekil-kart">${levhaSVG(kod)}<b>${a}</b><span>${b}</span></div>`).join("")}</div>`;
    } else {
      const L=LEVHALAR[k], r=ROTALAR[Album.rotasi(k)];
      govde=`<div class="rehber-duzen">
          <div class="rehber-levha">${levhaSVG(k,null,"levha-dev")}</div>
          <div class="rehber-bilgi">
            <span class="etiket" style="background:var(--mavi)">${r.ikon} ${r.ad}</span>
            <div class="ders-buyuk" id="rehberBaslik">Bu levha ne anlatıyor?</div>
            <div class="ders-not">🙋 Sınıfa sor: Bu levhayı nerede gördünüz?</div>
            <button class="dugme yesil" id="gosterBtn">👀 Göster</button>
            <div id="rehberCevap" class="gizli rehber-cevap">
              <div class="rc-anlam">${L.anlam}</div>
              <div class="detay-satir">📍 ${L.nerede}</div>
              <div class="detay-satir">💡 ${IPUCU_TIP[L.tip]}</div>
              <div class="detay-satir">✅ Bunu görünce: ${L.ne[0].dogru}</div>
            </div>
          </div></div>`;
    }
    this.kutu().innerHTML=`<div class="ders-ekran"><div class="ders-sahne">${govde}</div>${this.gezinti(no,sira.length)}</div>`;
    const g=$("#gosterBtn");
    if(g) g.onclick=()=>{ Ses.dogru(); const L=LEVHALAR[k]; $("#rehberBaslik").textContent=L.ad; $("#rehberCevap").classList.remove("gizli"); g.remove(); Sesli.otomatik(L.ad+". "+L.anlam); };
    this.geri=()=>{ if(this.rehberNo>0){ Ses.tik(); this.rehberNo--; this.rehberAc(); } };
    this.ileri=()=>{ if(this.rehberNo<sira.length-1){ Ses.tik(); this.rehberNo++; this.rehberAc(); } };
    this.gezintiBagla();
  },

  /* --- 112 Canlandırma --- */
  canlandirSec(){
    this.ileri=this.geri=null;
    this.kutu().innerHTML=`<div class="ders-ekran"><div class="ders-buyuk">Hangi durumu canlandıralım?</div>
      <div class="ders-not">İki öğrenci seçin: biri 🧒 Arayan, biri 🎧 Görevli. Görevli, ekrandaki cümleleri okur.</div>
      <div class="senaryo-izgara">${Object.keys(SENARYOLAR).map(k=>{ const S=SENARYOLAR[k]; return `<button class="senaryo-kart" data-k="${k}"><span>${S.rozet}${S.ekip}</span><b>${S.ad}</b></button>`; }).join("")}</div></div>`;
    $$(".senaryo-kart").forEach(b=>b.onclick=()=>{ Ses.tik(); this.c={k:b.dataset.k,no:0}; this.canlandirAc(); });
  },
  canlandirAdimlar(S){
    return [
      {rol:"arayan", m:"Önce sakin ol. Derin bir nefes al.", sinif:"Hep birlikte nefes alalım: içimize 1, 2, 3… dışarı 1, 2, 3…", tik:"sakin"},
      {rol:"arayan", m:"Telefondan 1 - 1 - 2'yi tuşla.", tus:true},
      {rol:"gorevli", m:"112 Acil Çağrı Merkezi, dinliyorum. Ne oldu?", c:S.ne.dogru, tik:"ne"},
      {rol:"gorevli", m:"Adresin ne? Neredesin?", c:S.nerede.dogru, tik:"nerede", parla:"adresTabela"},
      {rol:"gorevli", m:"Ne zaman oldu?", c:"Az önce oldu.", tik:"zaman"},
      {rol:"gorevli", m:S.kac.soru, c:S.kac.dogru, tik:"kac", parla:"kisiler"},
      {rol:"gorevli", m:"Ekip yola çıktı. Şimdi beni dinle: "+S.talimat.join(" "), c:"(Arayan sözünü kesmeden dinler.)"},
      {rol:"sinif", m:"Görevli, arayana ne yapmasını söyledi?", c:S.dinle.dogru, tik:"dinle"},
      {rol:"gorevli", m:"Ekip yolda. Şimdi telefonu kapatabilirsin.", c:"Teşekkür ederim. (Arayan şimdi kapatır.)", tik:"kapat", son:true},
      {rol:"sinif", m:"Arayan sakin miydi? Kısa ve net konuştu mu? Görevli izin vermeden kapattı mı?", degerlendirme:true}
    ];
  },
  canlandirAc(){
    const S=SENARYOLAR[this.c.k], A=this.canlandirAdimlar(S), no=this.c.no, a=A[no];
    const yapildi=new Set(A.slice(0,no+1).filter(x=>x.tik).map(x=>x.tik));
    const ROL={arayan:["🧒","Arayan"],gorevli:["🎧","Görevli"],sinif:["👥","Sınıf"]};
    this.kutu().innerHTML=`
      <div class="ders-ekran">
        <div class="rol-satir">${Object.entries(ROL).map(([k,[i,y]])=>`<span class="rol ${k===a.rol?"aktif":""}">${i} ${y}</span>`).join("")}</div>
        <div class="canlandir-duzen">
          <div class="canlandir-olay">${olaySVG(this.c.k)}
            <div class="kontrol">${ADIM_LISTESI.map(([k,i,y])=>`<span class="cip ${yapildi.has(k)?"tamam":""}">${yapildi.has(k)?"✔":i} ${y}</span>`).join("")}</div></div>
          <div class="replik rol-${a.rol}">
            <div class="replik-kim">${ROL[a.rol][0]} ${ROL[a.rol][1]}</div>
            <div class="ders-buyuk">${a.m}</div>
            ${a.sinif?`<div class="ders-not">👥 ${a.sinif}</div>`:""}
            ${a.tus?`<div class="dev-numara">1 · 1 · 2</div>`:""}
            ${a.c?`<button class="dugme sari" id="ornekBtn">💬 Örnek cevabı göster</button><div class="ornek gizli" id="ornek">${ROL[a.rol==="gorevli"?"arayan":"sinif"][0]} ${a.c}</div>`:""}
            ${a.degerlendirme?`<button class="dugme mor" id="tekrarBtn">🔁 Başka bir durum seç</button>`:""}
          </div>
        </div>
        ${this.gezinti(no,A.length)}
      </div>`;
    if(a.parla) setTimeout(()=>Telefon.parlat(a.parla),300);
    if(a.tus) [1,1,2].forEach((t,i)=>setTimeout(()=>Ses.dtmf(t),i*260));
    if(a.son){ Ses.siren(); const k=$("#ekipKatman"); if(k) k.innerHTML=`<text class="ekip-arac" x="0" y="230" font-size="46">${S.ekip}</text>`; }
    const ob=$("#ornekBtn"); if(ob) ob.onclick=()=>{ Ses.tik(); $("#ornek").classList.remove("gizli"); ob.remove(); };
    const tb=$("#tekrarBtn"); if(tb) tb.onclick=()=>{ Ses.tik(); this.canlandirSec(); };
    if(a.rol==="gorevli") Sesli.otomatik(a.m);
    this.geri=()=>{ if(this.c.no>0){ Ses.tik(); this.c.no--; this.canlandirAc(); } };
    this.ileri=()=>{ if(this.c.no<A.length-1){ Ses.tik(); this.c.no++; this.canlandirAc(); } };
    this.gezintiBagla();
  },

  /* --- Sınıfça Karar --- */
  HEDEF:20,
  kartUret(){
    const tur=["anlam","davranis","gerekli"][Math.floor(Math.random()*3)], kodlar=Object.keys(LEVHALAR);
    if(tur==="gerekli"){
      const c=GEREKLI_KARTLAR[Math.floor(Math.random()*GEREKLI_KARTLAR.length)];
      return {gorsel:`<div class="ders-dev-emoji">${c.e}</div>`, ifade:`${c.m}<br><b>Bu durumda 112 aranır.</b>`, dogru:c.evet, ac:c.ac};
    }
    const k=kodlar[Math.floor(Math.random()*kodlar.length)], L=LEVHALAR[k], dogruMu=Math.random()<.5;
    if(tur==="anlam"){
      const baska=kodlar.filter(x=>x!==k && LEVHALAR[x].tip!==L.tip), b=LEVHALAR[baska[Math.floor(Math.random()*baska.length)]];
      return {gorsel:levhaSVG(k,null,"levha-dev"), ifade:`Bu levha şunu söyler:<br><b>“${dogruMu?L.anlam:b.anlam}”</b>`, dogru:dogruMu, ac:`${L.ad}: ${L.anlam}`};
    }
    const v=L.ne[Math.floor(Math.random()*L.ne.length)];
    return {gorsel:levhaSVG(k,v.durum||null,"levha-dev"), ifade:`${v.soru}<br><b>${dogruMu?v.dogru:(v.zor||v.yanlis[0])}</b>`, dogru:dogruMu, ac:`Doğru seçim: ${v.dogru}`};
  },
  kararAc(){
    const k=this.kartUret(), v=Kayit.veri, n=Math.min(v.sinifCubugu,this.HEDEF);
    this.kutu().innerHTML=`
      <div class="ders-ekran">
        <div class="sinif-cubuk"><div class="sc-yazi">👥 Sınıfça ${this.HEDEF} doğru karar: <b>${n} / ${this.HEDEF}</b></div>
          <div class="sc-bar"><div style="width:${n/this.HEDEF*100}%"></div></div>
          <button class="sc-sifir" id="cubukSifir" aria-label="Çubuğu sıfırla">↺</button></div>
        <div class="ders-sahne karar-duzen">
          <div class="karar-gorsel">${k.gorsel}</div>
          <div class="karar-sag">
            <div class="ders-buyuk">${k.ifade}</div>
            <div class="ders-not">Önce herkes başparmağıyla oy versin 👍 👎, sonra çoğunluğun cevabına dokunun.</div>
            <div class="karar-dugmeler" id="kararDugmeler">
              <button class="dugme yesil buyuk" data-c="1">👍 Doğru</button><button class="dugme pembe buyuk" data-c="0">👎 Yanlış</button>
            </div>
            <div id="kararSonuc"></div>
          </div>
        </div>
      </div>`;
    Sesli.otomatik($(".karar-sag .ders-buyuk").textContent);
    $$("#kararDugmeler button").forEach(b=>b.onclick=()=>{
      const bildi=(b.dataset.c==="1")===k.dogru;
      $("#kararDugmeler").remove();
      if(bildi){ Ses.dogru(); v.sinifCubugu=Math.min(v.sinifCubugu+1,this.HEDEF); Kayit.kaydet(); } else Ses.yanlis();
      const m=Math.min(v.sinifCubugu,this.HEDEF);
      $(".sc-bar div").style.width=(m/this.HEDEF*100)+"%"; $(".sc-yazi b").textContent=`${m} / ${this.HEDEF}`;
      $("#kararSonuc").innerHTML=`<div class="karar-sonuc ${bildi?"iyi":""}">${bildi?"✅ Sınıf doğru bildi! +1":"🤔 Bu sefer olmadı. Doğru cevap: "+(k.dogru?"👍 Doğru":"👎 Yanlış")}<br><span>${k.ac}</span></div>
        <button class="dugme mavi" id="sonrakiKart">Sonraki kart ▶</button>`;
      $("#sonrakiKart").onclick=()=>{ Ses.tik(); this.kararAc(); };
      if(bildi && m>=this.HEDEF){ Konfeti.at(); Ses.yildiz(); setTimeout(()=>Modal.sor("🎉 Hedef tamam!",`Sınıfça ${this.HEDEF} doğru karar verdiniz. Harika bir takım!`,[{yazi:"Yeni hedef başlat",sinif:"yesil",deger:true}]).then(()=>{ v.sinifCubugu=0; Kayit.kaydet(); this.kararAc(); }),700); }
    });
    $("#cubukSifir").onclick=async ()=>{
      Ses.tik();
      const c=await Modal.sor("Çubuk sıfırlansın mı?","Sınıfın doğru karar sayısı 0'a döner.",[{yazi:"Vazgeç",sinif:"beyaz",deger:false},{yazi:"Sıfırla",sinif:"pembe",deger:true}]);
      if(c){ v.sinifCubugu=0; Kayit.kaydet(); this.kararAc(); }
    };
    this.ileri=()=>{ const s=$("#sonrakiKart"); if(s) s.click(); };
  }
};
// Öğretmen dizüstünden yönetirken: ← → ile geçiş
addEventListener("keydown",e=>{
  if(Sahne.aktif!=="dersAlt" || $("#modal").classList.contains("acik")) return;
  if(["ArrowRight","PageDown"].includes(e.key) && Ders.ileri){ e.preventDefault(); Ders.ileri(); }
  if(["ArrowLeft","PageUp"].includes(e.key) && Ders.geri){ e.preventDefault(); Ders.geri(); }
});

/* =========================================================
   P) AYARLAR
   ========================================================= */
const Ayarlar = {
  ciz(){
    const a=Kayit.veri.ayar;
    $("#ayarSes").classList.toggle("acik",a.ses);
    const s=$("#ayarSesli");
    s.disabled=!Sesli.var(); s.classList.toggle("acik",a.sesliOku && Sesli.var());
    $("#sesliNot").textContent = Sesli.var() ? "Işıl ve görevli konuşmalarını okur" : "Bu cihazda Türkçe ses bulunamadı";
  },
  bagla(){
    $("#ayarSes").onclick=()=>{ Kayit.veri.ayar.ses=!Kayit.veri.ayar.ses; Kayit.kaydet(); this.ciz(); Ses.tik(); };
    $("#ayarSesli").onclick=()=>{ if(!Sesli.var()) return; Kayit.veri.ayar.sesliOku=!Kayit.veri.ayar.sesliOku; Kayit.kaydet(); this.ciz(); Ses.tik(); if(Kayit.veri.ayar.sesliOku) Sesli.oku("Sesli okuma açık."); };
    $("#ayarSifirla").onclick=async ()=>{
      Ses.tik();
      const c=await Modal.sor("Her şey silinsin mi?","Albüm, yıldızlar ve en iyi rekor silinir. Bu geri alınamaz.",[{yazi:"Vazgeç",sinif:"beyaz",deger:false},{yazi:"Evet, sıfırla",sinif:"pembe",deger:true}]);
      if(c){ Kayit.tamSifirla(); Kayit.ozetYaz(); this.ciz(); girisGuncelle(); }
    };
  }
};

/* =========================================================
   R) BAĞLANTILAR VE BAŞLATMA
   ========================================================= */
function girisGuncelle(){ const c=Album.sayac(); $("#girisYildiz").textContent=Kayit.veri.yildiz+"  ·  📒 "+c.var+"/"+c.top; }

Sahne.hazirlayicilar={
  giris(){ girisGuncelle(); },
  harita(){
    const r=ROTALAR[Kayit.veri.aktifRota]||ROTALAR.okul, birden=Kayit.veri.rotalar.length>1;
    $("#rotaAdi").textContent=r.ikon+" "+r.ad+(birden && Tur.durakIndeksi<0?" ▾":"");
    Harita.ciz(); Tur.ilerlemeCiz();
    if(Tur.durakIndeksi<0) setTimeout(()=>Isil.soyle(r.davet+" Parlayan durağa dokun."),450);
  },
  telefon(v){ Telefon.hazirla(v); },
  turSonu(){ TurSonu.hazirla(); },
  album(){ Album.hazirla(); },
  ders(){ Ders.hazirla(); },
  dersAlt(c){ Ders.altHazirla(c); },
  ayarlar(){ Ayarlar.ciz(); }
};

// İlk dokunuşta ses motorunu aç (tarayıcı kuralı)
addEventListener("pointerdown",()=>Ses.baslat(),{capture:true});

$("#oynaBtn").onclick=()=>{ Ses.baslat(); Ses.tik(); Tur.basla(); };
$$("[data-git]").forEach(b=>b.addEventListener("click",()=>{ Ses.tik(); Sahne.goster(b.dataset.git); }));
$("#haritaGeri").onclick=async ()=>{
  Ses.tik();
  if(Tur.durakIndeksi<0){ Sahne.goster("giris"); return; }
  const c=await Modal.sor("Turdan çıkılsın mı?","Bu turdaki ilerleme kaydedilmez. Albümün ve yıldızların durur.",[{yazi:"Devam et",sinif:"yesil",deger:false},{yazi:"Çık",sinif:"beyaz",deger:true}]);
  if(c){ DurakPaneli.kapat(); Sahne.goster("giris"); }
};
$("#telefonGeri").onclick=()=>Telefon.cik();
$("#balonSesli").onclick=()=>Sesli.oku($("#balonYazi").textContent);
// Rota seçimi: yalnızca tur başlamadan, birden fazla rota açıksa
$("#rotaAdi").onclick=async ()=>{
  const v=Kayit.veri; if(Tur.durakIndeksi>=0 || v.rotalar.length<2 || Harita.yuruyor) return;
  Ses.tik();
  const secim=await Modal.sor("Hangi yoldan gidelim?","Her yolda farklı levhalar var.",
    ROTA_SIRASI.filter(r=>v.rotalar.includes(r)).map(r=>({yazi:ROTALAR[r].ikon+" "+ROTALAR[r].ad, sinif:r===v.aktifRota?"yesil":"beyaz", deger:r})));
  if(secim && secim!==v.aktifRota){ v.aktifRota=secim; Kayit.kaydet(); Tur.basla(); }
};

// Ekran döndürülünce haritayı yeniden çiz
let yenidenCizZamani;
addEventListener("resize",()=>{ clearTimeout(yenidenCizZamani); yenidenCizZamani=setTimeout(()=>{ if(Sahne.aktif==="harita" && !Harita.yuruyor) Harita.ciz(); },200); });

Kayit.yukle();
Ayarlar.bagla();
Sesli.hazirla();
Sahne.goster("giris");
</script>
