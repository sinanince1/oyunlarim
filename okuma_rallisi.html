html,body{height:100%;background:var(--koyu);overflow:hidden}
body{
  font-family:"Nunito Variable","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--koyu);-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit}

/* ==========================================================
   3. SAHNE ÇERÇEVESİ
   ========================================================== */
#oyun{position:fixed;inset:0;overflow:hidden}
.sahne{
  position:absolute;inset:0;overflow:hidden;opacity:0;transition:opacity .35s ease;
  background:var(--arka,none) center/cover no-repeat,linear-gradient(160deg,#4D9FFF,#A855F7);
}
.sahne.gorunur{opacity:1}
.sahne::after{content:"";position:absolute;inset:0;pointer-events:none;background:var(--perde-renk,transparent)}
.sahne > *{position:relative;z-index:1}

/* ==========================================================
   4. DÜĞMELER
   ========================================================== */
.btn{
  --r:var(--turuncu);--g:var(--turuncu-k);
  border:0;cursor:pointer;border-radius:999px;padding:.55em 1.5em;
  font-weight:900;font-size:var(--f2);color:#fff;background:var(--r);
  box-shadow:0 .25em 0 var(--g),0 .5em 1.1em rgba(0,0,0,.28);
  transition:transform .08s,box-shadow .08s,filter .2s;
  display:inline-flex;align-items:center;justify-content:center;gap:.4em;
  text-shadow:0 .06em 0 rgba(0,0,0,.18);
}
.btn:active{transform:translateY(.18em);box-shadow:0 .07em 0 var(--g),0 .25em .6em rgba(0,0,0,.25)}
.btn:focus-visible,.menu-btn:focus-visible,.yuvarlak:focus-visible,.avatar-sec:focus-visible{outline:4px solid #fff;outline-offset:3px}
.btn:disabled{filter:grayscale(.85);opacity:.55;cursor:not-allowed;transform:none}
.btn[hidden]{display:none}
.btn.yesil{--r:var(--yesil);--g:var(--yesil-k)}
.btn.mavi{--r:var(--mavi);--g:var(--mavi-k)}
.btn.mor{--r:var(--mor);--g:var(--mor-k)}
.btn.pembe{--r:var(--pembe);--g:var(--pembe-k)}
.btn.gri{--r:#8A90A6;--g:#5E6480}
.btn.kirmizi{--r:#EF4444;--g:#B91C1C}
.btn.kucuk{font-size:var(--f1);padding:.45em 1.1em}

.yuvarlak{
  width:2.7em;height:2.7em;border-radius:50%;border:0;cursor:pointer;flex:none;
  background:rgba(255,255,255,.94);font-size:var(--f1);display:grid;place-items:center;
  box-shadow:0 .2em 0 rgba(0,0,0,.18),0 .4em .9em rgba(0,0,0,.22);
}
.yuvarlak span{font-size:1.35em;line-height:1}
.yuvarlak:active{transform:translateY(.12em)}

/* ==========================================================
   5. AÇILIŞ (KAPAK)
   ========================================================== */
.kapak-ust{position:absolute;top:3%;right:2.5%;display:flex;gap:.6em}
.kapak-blok{position:absolute;left:4.5%;top:9%;width:min(50%,calc(var(--o)*62));display:flex;flex-direction:column;align-items:flex-start;gap:calc(var(--o)*2.2)}
.logo{
  font-size:var(--f4);font-weight:1000;line-height:.95;color:#fff;letter-spacing:.01em;
  -webkit-text-stroke:.09em var(--turuncu);paint-order:stroke fill;
  text-shadow:0 .1em 0 var(--turuncu-k),0 .22em .4em rgba(0,0,0,.25);
  text-transform:uppercase;
}
.logo .bayrak{display:inline-block;width:.8em;height:.8em;vertical-align:.02em;margin-left:.15em}
.logo small{display:block;font-size:.5em;-webkit-text-stroke-width:.12em}
.slogan{
  background:rgba(255,255,255,.93);border-radius:999px;padding:.45em 1.1em;font-weight:800;
  font-size:var(--f1);box-shadow:0 .3em .8em rgba(0,0,0,.15);color:var(--koyu);
}
.kapak-dugmeler{display:flex;flex-direction:column;align-items:flex-start;gap:calc(var(--o)*1.4);margin-top:calc(var(--o)*.8)}
.kapak-dugmeler .btn{font-size:var(--f3)}
.surucu-not{display:flex;align-items:center;gap:.5em;background:rgba(31,35,64,.78);color:#fff;border-radius:999px;padding:.25em 1em .25em .25em;font-weight:800;font-size:var(--f1)}
.surucu-not svg{width:2.2em;height:2.2em}
.imza{position:absolute;right:2%;bottom:2%;color:#fff;font-weight:800;font-size:var(--f0);text-shadow:0 1px 3px rgba(0,0,0,.6);opacity:.9}

/* ==========================================================
   6. SÜRÜCÜ KAYDI
   ========================================================== */
.sahne.kayit{--perde-renk:rgba(31,35,64,.45)}
.kart{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(94vw,calc(var(--o)*92));max-height:94dvh;overflow:auto;
  background:#fff;border-radius:calc(var(--o)*2.6);padding:calc(var(--o)*2.6) calc(var(--o)*3);
  box-shadow:0 1.2em 3em rgba(0,0,0,.35);text-align:center;
}
.kart h2{font-size:var(--f3);font-weight:1000;color:var(--turuncu)}
.kart .alt-yazi{font-size:var(--f1);font-weight:700;color:#5A6080;margin:.2em 0 .8em}
.etiket{display:block;font-weight:900;font-size:var(--f1);margin:.4em 0 .35em;color:var(--koyu)}
.ad-kutu{
  font:inherit;font-weight:900;font-size:var(--f2);text-align:center;width:min(100%,14em);
  padding:.45em .8em;border-radius:999px;border:4px solid #E3E6F0;background:var(--krem);color:var(--koyu);outline:none;
}
.ad-kutu:focus{border-color:var(--mavi)}
.avatar-izgara{display:grid;grid-template-columns:repeat(9,1fr);gap:calc(var(--o)*1);margin:.4em .3em 1.2em}
.avatar-sec{border:0;background:none;cursor:pointer;border-radius:50%;padding:0;aspect-ratio:1;transition:transform .15s}
.avatar-sec svg{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 0 0 4px #fff,0 0 0 7px #E3E6F0}
.avatar-sec.secili{transform:scale(1.12)}
.avatar-sec.secili svg{box-shadow:0 0 0 4px #fff,0 0 0 8px var(--turuncu)}
.uyari{min-height:1.4em;font-weight:800;font-size:var(--f0);color:#D9480F;margin:-.4em 0 .5em}
.kart-dugmeler{display:flex;justify-content:center;gap:1em;flex-wrap:wrap}

/* ==========================================================
   7. GARAJ
   ========================================================== */
.hud{position:absolute;top:2.6%;left:2.4%;right:2.4%;display:flex;justify-content:space-between;align-items:flex-start;gap:1em;z-index:3}
.profil-cip{
  display:flex;align-items:center;gap:.55em;background:rgba(255,255,255,.95);border-radius:999px;
  padding:.25em 1.1em .25em .25em;font-weight:900;font-size:var(--f1);box-shadow:0 .3em .9em rgba(0,0,0,.2);
}
.profil-cip svg{width:2.6em;height:2.6em;display:block}
.profil-cip[data-eylem]{cursor:pointer;transition:transform .15s}
.profil-cip[data-eylem]:hover{transform:scale(1.04)}
.profil-cip[data-eylem]:active{transform:scale(.97)}
.cip.yon{background:var(--koyu)}
.profil-cip small{display:block;font-weight:800;font-size:.72em;color:#6A7090}
.hud-sag{display:flex;gap:.55em;align-items:center}
.cip{
  display:flex;align-items:center;gap:.4em;background:rgba(31,35,64,.88);color:#fff;border-radius:999px;
  padding:.4em 1em;font-weight:900;font-size:var(--f1);box-shadow:0 .3em .9em rgba(0,0,0,.22);white-space:nowrap;
}
.cip .ik{font-size:1.15em;line-height:1}
.cip.guc{background:linear-gradient(90deg,var(--mor),var(--pembe))}

.garaj-araba{position:absolute;z-index:2;cursor:pointer;transform-origin:50% 95%}
.garaj-araba svg{width:100%;height:auto;display:block;overflow:visible}
.garaj-araba.vin{animation:vin .9s ease}
.garaj-araba.vin .teker{animation:don .9s linear}
.teker{transform-box:fill-box;transform-origin:center}
@keyframes vin{0%{transform:translateX(0)}15%{transform:translateX(-1.2%) rotate(-1deg)}35%{transform:translateX(1.5%) rotate(.6deg)}55%{transform:translateX(-.8%)}75%{transform:translateX(.5%)}100%{transform:none}}
@keyframes don{to{transform:rotate(720deg)}}
.plaka{
  position:absolute;z-index:2;transform:translate(-50%,-100%);white-space:nowrap;
  background:rgba(255,255,255,.95);border-radius:999px;padding:.3em 1em;font-weight:900;font-size:var(--f1);
  box-shadow:0 .3em .8em rgba(0,0,0,.18);pointer-events:none;
}
.plaka small{font-weight:800;color:#7A2FD0;margin-left:.3em}

.balon{
  position:absolute;left:50%;top:14%;transform:translateX(-50%);z-index:4;width:min(90%,calc(var(--o)*70));
  background:#fff;border-radius:1.2em;padding:.8em 1.2em;font-weight:800;font-size:var(--f1);
  box-shadow:0 .6em 1.6em rgba(0,0,0,.25);display:flex;gap:.9em;align-items:center;animation:belir .4s ease;
}
.balon svg{width:3.2em;height:3.2em;flex:none}
.balon p{flex:1;line-height:1.35}
@keyframes belir{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}

.alt-menu{position:absolute;left:2.4%;right:2.4%;bottom:3%;display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:1.4%;z-index:3}
.menu-btn{
  --r:var(--turuncu);--g:var(--turuncu-k);
  display:flex;align-items:center;gap:.6em;padding:.55em .8em;border-radius:1.1em;border:0;cursor:pointer;text-align:left;
  background:var(--r);color:#fff;font-size:var(--f1);box-shadow:0 .28em 0 var(--g),0 .6em 1.2em rgba(0,0,0,.28);
  transition:transform .08s,box-shadow .08s;min-height:3.6em;
}
.menu-btn:active{transform:translateY(.18em);box-shadow:0 .08em 0 var(--g)}
.menu-btn .ik{font-size:1.75em;width:1.75em;height:1.75em;display:grid;place-items:center;background:rgba(255,255,255,.24);border-radius:.45em;flex:none;line-height:1}
.menu-btn b{display:block;font-weight:1000;font-size:1.12em;line-height:1.1}
.menu-btn small{display:block;font-weight:700;opacity:.92;font-size:.78em;line-height:1.2}
.menu-btn.mavi{--r:var(--mavi);--g:var(--mavi-k)}
.menu-btn.mor{--r:var(--mor);--g:var(--mor-k)}
.menu-btn.yesil{--r:var(--yesil);--g:var(--yesil-k)}
.menu-btn.ana{animation:nabiz 2.2s ease-in-out infinite}
@keyframes nabiz{0%,100%{box-shadow:0 .28em 0 var(--g),0 .6em 1.2em rgba(0,0,0,.28),0 0 0 0 rgba(255,214,0,.0)}50%{box-shadow:0 .28em 0 var(--g),0 .6em 1.2em rgba(0,0,0,.28),0 0 0 .35em rgba(255,214,0,.75)}}

/* ==========================================================
   8. YAPIM AŞAMASINDAKİ EKRANLAR
   ========================================================== */
.sahne.yakinda{--perde-renk:rgba(31,35,64,.35)}
.yakinda-kart{text-align:center;width:min(94vw,calc(var(--o)*64))}
.yakinda-kart .buyuk-ik{font-size:calc(var(--f4)*1.2);line-height:1;margin-bottom:.15em}
.yakinda-kart p{font-size:var(--f1);font-weight:700;color:#4A5070;line-height:1.45;margin:.5em auto 1em;max-width:30em}
.rozet{display:inline-block;background:var(--sari);color:var(--koyu);font-weight:900;font-size:var(--f0);border-radius:999px;padding:.3em .9em;margin-bottom:.4em}
.geri-ust{position:absolute;top:3%;left:2.4%;z-index:3}

/* ==========================================================
   9. PENCERELER (Ayarlar, onay)
   ========================================================== */
.perde{position:fixed;inset:0;z-index:50;background:rgba(15,18,40,.55);display:grid;place-items:center;padding:12px;animation:solgun .2s ease}
@keyframes solgun{from{opacity:0}to{opacity:1}}
.pencere{
  background:#fff;border-radius:calc(var(--o)*2.6);width:min(94vw,calc(var(--o)*72));max-height:92dvh;overflow:auto;
  padding:calc(var(--o)*2.4) calc(var(--o)*3);box-shadow:0 1.2em 3em rgba(0,0,0,.4);animation:yuksel .25s ease;
}
@keyframes yuksel{from{transform:translateY(16px)}to{transform:none}}
.pencere h2{font-size:var(--f3);font-weight:1000;color:var(--mavi-k);text-align:center;margin-bottom:.3em}
.ayar-satir{display:flex;justify-content:space-between;align-items:center;gap:1em;padding:.75em 0;border-bottom:3px dashed #EEF0F6;font-size:var(--f1);font-weight:800}
.ayar-satir:has(+ .pencere-dugmeler){border-bottom:0}
.ayar-satir small{display:block;font-weight:700;color:#7A809A;font-size:.82em}
.anahtar{width:3.4em;height:1.9em;border-radius:999px;border:0;cursor:pointer;background:#CDD2E0;position:relative;flex:none;transition:background .2s}
.anahtar::after{content:"";position:absolute;top:.2em;left:.2em;width:1.5em;height:1.5em;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s}
.anahtar.acik{background:var(--yesil)}
.anahtar.acik::after{left:1.7em}
.boyut-sec{display:flex;align-items:center;gap:.5em}
.ses-kaydirak{-webkit-appearance:none;appearance:none;width:9em;height:.7em;border-radius:99px;background:linear-gradient(90deg,var(--mor),var(--pembe));cursor:pointer;outline:none}
.ses-kaydirak::-webkit-slider-thumb{-webkit-appearance:none;width:1.5em;height:1.5em;border-radius:50%;background:#fff;border:3px solid var(--mor);box-shadow:0 2px 5px rgba(0,0,0,.25)}
.ses-kaydirak::-moz-range-thumb{width:1.2em;height:1.2em;border-radius:50%;background:#fff;border:3px solid var(--mor);box-shadow:0 2px 5px rgba(0,0,0,.25)}
.ses-kaydirak:disabled{opacity:.4;cursor:default}
.ornek-yazi{font-weight:700;color:var(--koyu);min-width:6.5em;text-align:center}
.pencere .imza-ic{text-align:center;color:#9AA0B8;font-weight:800;font-size:var(--f0);margin-top:.9em}
.onay-metin{font-size:var(--f1);font-weight:700;text-align:center;line-height:1.45;color:#4A5070;margin:.4em 0 1.1em}
.pencere-dugmeler{display:flex;justify-content:center;gap:.8em;flex-wrap:wrap}

/* ==========================================================
   9b. OKUMA PİSTİ HARİTASI
   ========================================================== */
.ust-bar{position:absolute;top:2.6%;left:2.4%;right:2.4%;display:flex;align-items:center;justify-content:space-between;gap:.8em;z-index:3}
.ust-bar h1{font-size:var(--f3);font-weight:1000;color:#fff;-webkit-text-stroke:.08em var(--turuncu);paint-order:stroke fill;text-shadow:0 .08em 0 var(--turuncu-k),0 .2em .4em rgba(0,0,0,.25)}
.bolge{
  --renk:var(--yesil);
  position:absolute;z-index:2;transform:translate(-50%,-50%);width:max(190px,calc(var(--o)*25));border:0;cursor:pointer;text-align:left;
  background:rgba(255,255,255,.96);border-radius:1.1em;padding:.65em .95em .75em;font-size:var(--f1);
  border-top:.5em solid var(--renk);box-shadow:0 .35em 0 rgba(0,0,0,.16),0 .8em 1.6em rgba(0,0,0,.28);transition:transform .12s;
}
.bolge:active{transform:translate(-50%,-48%)}
.bolge .sev{display:block;font-size:.72em;font-weight:1000;color:var(--renk);text-transform:uppercase;letter-spacing:.05em}
.bolge b{display:block;font-size:1.15em;font-weight:1000;line-height:1.15}
.bolge .cubuk{display:block;height:.55em;border-radius:99px;background:#E9ECF4;margin:.45em 0 .35em;overflow:hidden}
.bolge .cubuk i{display:block;height:100%;background:var(--renk);border-radius:99px}
.bolge .bilgi{display:flex;justify-content:space-between;font-weight:800;font-size:.8em;color:#5A6080}
.bolge.kilitli{background:rgba(236,238,245,.95)}
.bolge.kilitli b,.bolge.kilitli .bilgi{opacity:.55}
.bolge .kilit-not{display:block;margin-top:.4em;font-weight:900;font-size:.76em;color:#5A6080;line-height:1.3}
.pencere.genis{width:min(96vw,calc(var(--o)*112))}
.pencere{position:relative}
.kapat-x{position:absolute;top:.7em;right:.7em;width:2.3em;height:2.3em;border-radius:50%;border:0;background:#EEF0F6;color:var(--koyu);font-weight:1000;font-size:var(--f1);cursor:pointer;z-index:2}
.kapat-x:active{transform:scale(.94)}
.alt-not{text-align:center;font-weight:700;color:#6A7090;font-size:var(--f0);margin-bottom:.2em}
.metin-izgara{display:grid;grid-template-columns:repeat(5,1fr);gap:calc(var(--o)*.9);margin-top:.6em}
.metin-kart{
  --renk:var(--yesil);
  cursor:pointer;background:var(--krem);border-radius:1em;padding:.55em .65em;text-align:left;font-size:var(--f0);
  border:3px solid transparent;box-shadow:0 .25em 0 #E8DCCB;display:flex;flex-direction:column;gap:.2em;min-height:6.8em;transition:transform .1s;
}
.metin-kart:active{transform:translateY(.15em)}
.metin-kart .ust{display:flex;justify-content:space-between;align-items:center}
.metin-kart .no{width:1.9em;height:1.9em;border-radius:50%;background:var(--renk);color:#fff;font-weight:1000;display:grid;place-items:center}
.metin-kart .tur{font-size:1.45em;line-height:1}
.metin-kart b{font-weight:900;font-size:1.1em;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.metin-kart .tur-ad{font-weight:700;color:#7A809A;font-size:.85em}
.metin-kart .yildiz{margin-top:auto;font-size:1.2em;color:#FFB800;letter-spacing:.04em}
.yildiz .bos{color:#D5D9E5}
.metin-kart.yeni{border-color:var(--sari)}
.yeni-rozet{display:inline-block;background:var(--sari);color:var(--koyu);font-weight:1000;font-size:.7em;border-radius:99px;padding:.15em .7em;letter-spacing:.02em}

/* ==========================================================
   9c. OKUMA VE SORU EKRANLARI
   ========================================================== */
:root{--mb:1}
.sahne.okuma,.sahne.soru{background:radial-gradient(circle at 18% 8%,rgba(255,255,255,.35),transparent 45%),linear-gradient(160deg,var(--renk,#4D9FFF),var(--renk-k,#2A6FD0))}
.okuma-ust{position:absolute;top:2.4%;left:2.4%;right:2.4%;display:flex;align-items:center;justify-content:space-between;gap:.8em;z-index:5}
.tur-cip{display:inline-flex;align-items:center;gap:.4em;background:rgba(255,255,255,.95);color:var(--koyu);border-radius:999px;padding:.35em 1em;font-weight:900;font-size:var(--f1);box-shadow:0 .3em .8em rgba(0,0,0,.18)}
.tur-cip small{font-weight:800;color:#6A7090}
.boyut-kutu{display:flex;gap:.4em}
.kagit{
  position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--o)*9.5);bottom:calc(var(--o)*11.5);
  width:min(94vw,calc(var(--o)*84));background:#FFFDF8;border-radius:1.4em;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(var(--o)*2.6) calc(var(--o)*4);box-shadow:0 .2em 0 rgba(0,0,0,.08),0 1em 2.4em rgba(0,0,0,.28);
  -webkit-user-select:text;user-select:text;
}
.metin{
  font-size:calc(var(--mb) * max(18px, calc(var(--o)*2.2)));line-height:1.75;font-weight:600;color:#1F2340;
  -webkit-hyphens:manual;hyphens:manual;overflow-wrap:normal;word-break:normal;
}
.metin h2{font-size:1.28em;font-weight:1000;color:var(--renk-k,#2A6FD0);text-align:center;margin-bottom:.55em;line-height:1.25}
.metin p{margin-bottom:.75em}
.metin.siir p{text-align:center;margin-bottom:1em}
.metin.diyalog p,.metin.roportaj p{margin-bottom:.45em}
.metin .konusan{font-weight:900;color:var(--renk-k,#2A6FD0)}
.metin .c{border-radius:.25em;transition:background .3s,box-shadow .3s}
.metin .c.kanit{background:#FFEB80;box-shadow:0 0 0 .18em #FFEB80}
.okuma-alt{position:absolute;left:0;right:0;bottom:calc(var(--o)*2.6);display:flex;justify-content:center;z-index:5}
.btn.sureli{position:relative;overflow:hidden;min-width:9em}
.btn.sureli .dolum{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.35);transition:width .25s linear}
.btn.sureli > span:last-child{position:relative}
.btn.hazir{animation:hazir 1.3s ease-in-out infinite}
.kaydir-ipucu{position:absolute;left:50%;bottom:calc(var(--o)*12.6);z-index:6;transform:translateX(-50%);background:var(--koyu);color:#fff;font-weight:900;font-size:var(--f0);border-radius:999px;padding:.45em 1.1em;box-shadow:0 .3em .8em rgba(0,0,0,.25);animation:zipla 1.2s ease-in-out infinite;pointer-events:none}
.kaydir-ipucu[hidden]{display:none}
@keyframes zipla{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,6px)}}

/* ==========================================================

function yeniDurum() {
  return {

    jeton: 0,

    ogretmen: { sesliOkuma: false },

    galeri: { anahtar: "", sahip: "", sinif: "", id: "" }   // Araçlar Galerisi: cihaz anahtarı ve son kullanılan bilgiler
  };
}
// Eski kayıtta eksik alan varsa varsayılanla tamamlar
function birlestir(hedef, kaynak) {
  if (!kaynak || typeof kaynak !== "object") return hedef;
  for (const k of Object.keys(kaynak)) {
    const h = hedef[k], v = kaynak[k];
    if (h && v && typeof h === "object" && typeof v === "object" && !Array.isArray(h) && !Array.isArray(v)) birlestir(h, v);
    else if (v !== undefined) hedef[k] = v;
  }
  return hedef;
}
function yukle() {
  try {
    const ham = localStorage.getItem(KAYIT_ANAHTARI);
    const d = ham ? birlestir(yeniDurum(), JSON.parse(ham)) : yeniDurum();
    d.garaj.arabalar = d.garaj.arabalar.map(arabaNormal);
    if (d.garaj.secili >= d.garaj.arabalar.length) d.garaj.secili = 0;
    if (!d.ayarlar.muzikDokundu) d.ayarlar.muzikSes = 25;      // oyuncu ayarlamadıysa müzik %25 ile başlar
    return d;
  } catch (e) { return yeniDurum(); }
}
function kaydet() { try { localStorage.setItem(KAYIT_ANAHTARI, JSON.stringify(durum)); } catch (e) {} }
let durum = yukle();

function guc() { return 20 + 4 * PARCALAR.reduce((t, p) => t + (durum.garaj.parcalar[p] || 0), 0); }

/* Performans parçaları: 5 seviye; her seviye +4 güç ve ölçülebilir bir yarış etkisi */

  return { azamiHiz: 1 + ETKI.hiz * p.motor, ivme: 1 + ETKI.ivme * p.aero, kayma: 1 - ETKI.kayma * p.lastik, nitroSn: 1.5 + ETKI.nitro * p.nitro };
}
const PARCA_FIYAT = [30, 60, 100, 150, 210];
const PARCA_BILGI = {
  motor:  { ad: "Motor",       renk: "#FF6B35", etki: "Arabanın en yüksek hızını artırır.",            etiket: "En yüksek hız", deger: lv => `+%${Math.round(lv * ETKI.hiz * 100)}` },
  lastik: { ad: "Lastik",      renk: "#4D9FFF", etki: "Yağ birikintisinde daha az kayar, az yavaşlarsın.", etiket: "Kayma",         deger: lv => `−%${Math.round(lv * ETKI.kayma * 100)}` },
  aero:   { ad: "Aerodinamik", renk: "#00C9A7", etki: "Arabanın daha çabuk hızlanmasını sağlar.",       etiket: "Hızlanma",      deger: lv => `+%${Math.round(lv * ETKI.ivme * 100)}` },
  nitro:  { ad: "Nitro",       renk: "#A855F7", etki: "Nitro kullandığında daha uzun süre uçarsın.",   etiket: "Nitro süresi",  deger: lv => `${(1.5 + lv * ETKI.nitro).toFixed(1).replace(".", ",")} sn` }
};
const PARCA_IKON = {
  motor:  `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h3V7h7v3h2l2 2h2v5h-2l-2 2H9l-2-2H4z"/><path d="M9 4h5"/><path d="M11.5 4v3"/></svg>`,
  lastik: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="M12 3v5.5M12 15.5V21M3 12h5.5M15.5 12H21"/></svg>`,
  aero:   `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h18v3H3z"/><path d="M7 11v6M16 11v6"/><path d="M4 20h16"/></svg>`,
  nitro:  `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v3L8 8v11a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V8l-2-2V3"/><path d="M13 11l-2 3h3l-2 3"/></svg>`
};
const YARIS_KADEME = [
  { id: "kolay",  ad: "Kolay",   min: 20, max: 30,  renk: "#00C9A7" },
  { id: "orta",   ad: "Orta",    min: 40, max: 50,  renk: "#FFD600" },
  { id: "zor",    ad: "Zor",     min: 60, max: 75,  renk: "#FF6B35" },
  { id: "cokZor", ad: "Çok Zor", min: 85, max: 100, renk: "#EF4444" }
];

/* Görünüm kataloğu: hepsi kozmetik (güce etkisi yok). Bir kez alınır, sonra ücretsiz takılır.
   ozel: yarışta o kademede 3 galibiyetle açılır, satın alınamaz. */
const RENKLER = [["#FF6B35","Turuncu"],["#EF4444","Kırmızı"],["#FF4D8D","Pembe"],["#FFB3D1","Toz pembe"],["#A855F7","Mor"],["#C4B5FD","Lila"],
  ["#4D9FFF","Mavi"],["#93C5FD","Bebek mavisi"],["#00C9A7","Turkuaz"],["#86EFAC","Nane yeşili"],["#22C55E","Yeşil"],["#FFD600","Sarı"],
  ["#FDE68A","Limon"],["#FFFFFF","Beyaz"],["#9CA3AF","Gümüş"],["#1F2340","Gece mavisi"]];
const oge = (dizi, ozel = {}) => dizi.map(([id, ad, fiyat]) => ({ id, ad, ozel: ozel[id] || null, fiyat: fiyat || null }));
const ogeFiyat = (kat, o) => yoneticiModu ? 0 : (o.fiyat || GORUNUM[kat].fiyat);
const parcaFiyat = lv => yoneticiModu ? 0 : PARCA_FIYAT[lv];
const yeriFiyat = () => yoneticiModu ? 0 : ARABA_YERI_FIYAT[durum.garaj.yerSayisi];
const ozelKilit = o => o.ozel && !yoneticiModu;
const GORUNUM = {
  govde:     { ad: "Gövde",       fiyat: 80, ogeler: oge([["spor","Spor"],["mini","Minik"],["retro","Retro"],["ustuacik","Üstü Açık"],["kamyonet","Kamyonet"],
    ["buggy","Buggy"],["kart","Go-Kart"],["kas","Kas Araba",130],["arazi","Arazi Canavarı",130],["f1","Formula",130],
    ["supersport","Süper Spor",200],["gt","GT Yarışçı",200],["canavar","Canavar Kamyon",200]]) },
  renk:      { ad: "Renk",        fiyat: 15, ogeler: oge(RENKLER) },
  desen:     { ad: "Desen",       fiyat: 40, ogeler: oge([["yok","Düz"],["serit","Yarış şeridi"],["puantiye","Puantiye"],["kalp","Kalpler"],["cicek","Çiçekler"],["yildiz","Yıldızlar"],
    ["gokkusagi","Gökkuşağı"],["alev","Alev"],["simsek","Şimşek"],["dalga","Dalgalar"],["seker","Şeker çubuğu"],["ekose","Ekose"],["mozaik","Mozaik"],
    ["kartanesi","Kar taneleri"],["pati","Pati izleri"],["nota","Notalar"],["kamuflaj","Kamuflaj"],["zebra","Zebra",60],["leopar","Leopar",60],
    ["kaplan","Kaplan",60],["galaksi","Galaksi",60],["dama","Dama"]], { dama: "cokZor" }) },
  cikartma:  { ad: "Çıkartma",    fiyat: 25, ogeler: oge([["yok","Yok"],["kedi","Kedi"],["kelebek","Kelebek"],["tekboynuz","Tek boynuz"],["ejderha","Ejderha"],["top","Top"],["kalp","Kalp"],["yildiz","Yıldız"],["simsek","Şimşek"],
    ["roket","Roket"],["dinozor","Dinozor"],["dondurma","Dondurma"],["gezegen","Gezegen"],["balina","Balina"],["ahtapot","Ahtapot"]],
    { roket: "sezon", dinozor: "sezon", dondurma: "sezon", gezegen: "sezon", balina: "sezon", ahtapot: "sezon" }) },
  jant:      { ad: "Jant",        fiyat: 35, ogeler: oge([["standart","Standart"],["spor","Spor"],["yildiz","Yıldız"],["cicek","Çiçek"],["tel","Tel"],["altin","Altın"]], { altin: "kolay" }) },
  tavan:     { ad: "Tavan",       fiyat: 30, ogeler: oge([["yok","Yok"],["fiyonk","Fiyonk"],["bayrak","Bayrak"],["anten","Anten"],["kulak","Kedi kulağı"],["tac","Taç"]], { tac: "orta" }) },
  egzoz:     { ad: "Egzoz",       fiyat: 45, ogeler: oge([["yok","Yok"],["duman","Renkli duman"],["parilti","Parıltı"],["kalpcik","Kalpçikler"],["gokkusagi","Gökkuşağı"]], { gokkusagi: "zor" }) },
  kaskRenk:  { ad: "Kask rengi",  fiyat: 15, surucu: "renk",  ogeler: oge(RENKLER) },
  kaskDesen: { ad: "Kask deseni", fiyat: 25, surucu: "desen", ogeler: oge([["duz","Düz"],["serit","Şerit"],["yildiz","Yıldız"],["kalp","Kalp"],["simsek","Şimşek"]]) }
};
const kademeAdi = id => (YARIS_KADEME.find(k => k.id === id) || {}).ad || "";
/* Sezon Kupası: her hafta (pazartesi başlar) sıradaki çıkartma; o hafta 3 yeni metin bitiren alır */
const SEZON_CIKARTMA = ["roket", "dinozor", "dondurma", "gezegen", "balina", "ahtapot"], SEZON_ESIK = 3;
function haftaninCikartmasi(t = new Date()) {
  const [y, a, g] = haftaAnahtari(t).split("-").map(Number), hafta = Math.round(Date.UTC(y, a - 1, g) / 6048e5);
  const id = SEZON_CIKARTMA[((hafta % SEZON_CIKARTMA.length) + SEZON_CIKARTMA.length) % SEZON_CIKARTMA.length];
  return GORUNUM.cikartma.ogeler.find(o => o.id === id);
}
function ozelAciklama(o) {
  if (o.ozel !== "sezon") return `${kademeAdi(o.ozel)} yarışlarında ${OZEL_ESIK} kez birinci olunca senin olur.`;
  return haftaninCikartmasi().id === o.id ? `Bu haftanın sezon çıkartması! Bu hafta ${SEZON_ESIK} yeni metin bitir, senin olsun.`
                                          : `Sezon çıkartması: kendi haftası gelince ${SEZON_ESIK} yeni metin bitirerek kazanılır.`;
}
const sahipMi = (kat, id) => (durum.envanter[kat] || []).includes(id);
const ARABA_YERI_FIYAT = [0, 120, 220, 320];   // 2., 3. ve 4. araba yeri
function arabaAdi(i = durum.garaj.secili) {
  const a = durum.garaj.arabalar[i];
  return (a && a.ad) ? a.ad : (i === 0 ? ilgiEki(durum.profil.ad) + " Arabası" : `${i + 1}. Araba`);
}
// Yarış motorunun (5. aşama) kullanacağı ölçülebilir değerler
function profilVar() { return durum.profil.ad.trim().length >= 2; }

/* ==========================================================
   3. YARDIMCILAR
   ========================================================== */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

// Türkçe ilgi eki: Ela'nın, Mert'in, Duru'nun, Gül'ün
function ilgiEki(ad) {
  const kucuk = ad.toLocaleLowerCase("tr");
  const sesliler = "aeıioöuü";
  let son = "";
  for (let i = kucuk.length - 1; i >= 0; i--) if (sesliler.includes(kucuk[i])) { son = kucuk[i]; break; }
  const ek = { a:"ın", ı:"ın", e:"in", i:"in", o:"un", u:"un", ö:"ün", ü:"ün" }[son] || "in";
  const sesliBiter = sesliler.includes(kucuk[kucuk.length - 1]);
  return ad + "'" + (sesliBiter ? "n" : "") + ek;
}

/* ==========================================================
   4. SES
   Gerçek ses kayıtları (ElevenLabs, okuma_rallisi/ses/) Web Audio ile çalınır;
   dosya yüklenemezse (çevrimdışı, file://) aynı olay sentezlenmiş sesle duyulur.
   ========================================================== */
const SES_DOSYA = {
  motor_kucuk: "okuma_rallisi/ses/motor_kucuk.mp3", motor_spor: "okuma_rallisi/ses/motor_spor.mp3", motor_v8: "okuma_rallisi/ses/motor_v8.mp3",
  calistir_kucuk: "okuma_rallisi/ses/calistir_kucuk.mp3", calistir_spor: "okuma_rallisi/ses/calistir_spor.mp3", calistir_v8: "okuma_rallisi/ses/calistir_v8.mp3",
  nitro: "okuma_rallisi/ses/nitro.mp3", koni: "okuma_rallisi/ses/koni.mp3", kayma: "okuma_rallisi/ses/kayma.mp3",
  nitro_al: "okuma_rallisi/ses/nitro_al.mp3", bitis: "okuma_rallisi/ses/bitis.mp3", kupa: "okuma_rallisi/ses/kupa.mp3", boya: "okuma_rallisi/ses/boya.mp3", kazandin: "okuma_rallisi/ses/kazandin.mp3",
  yukselt_motor: "okuma_rallisi/ses/yukselt_motor.mp3", yukselt_lastik: "okuma_rallisi/ses/yukselt_lastik.mp3",
  yukselt_aero: "okuma_rallisi/ses/yukselt_aero.mp3", yukselt_nitro: "okuma_rallisi/ses/yukselt_nitro.mp3"
};
/* Gövdeye göre motor sesi sınıfı: minik vızıltı, spor çığlığı, kalın V8 gürlemesi */
const MOTOR_SINIF = { mini: "kucuk", kart: "kucuk", buggy: "kucuk", retro: "kucuk",
  spor: "spor", ustuacik: "spor", supersport: "spor", gt: "spor", f1: "spor",
  kas: "v8", arazi: "v8", kamyonet: "v8", canavar: "v8" };
function motorSinifi(araba) { return MOTOR_SINIF[(araba || durum.garaj.arabalar[durum.garaj.secili] || {}).govde] || "spor"; }
const Ses = {
  ctx: null, tampon: {}, _yuklendi: false,
  hazirla() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
    if (this.ctx && !this._yuklendi) { this.yukle(); Muzik.baslat(); }
  },
  yukle() {
    this._yuklendi = true;
    if (!window.fetch) return;
    for (const [ad, yol] of Object.entries(SES_DOSYA)) {
      fetch(yol).then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
        .then(ab => new Promise((ok, red) => this.ctx.decodeAudioData(ab, ok, red)))
        .then(b => { this.tampon[ad] = b; if (ad.startsWith("motor_")) b._dongu = this.donguSinir(b); })
        .catch(() => {});                       // dosya yoksa sentez sesi kalır
    }
  },
  /* mp3 kodlayıcısının baş/son sessizliğini atla ki döngü kesintisiz olsun */
  donguSinir(b) {
    const d = b.getChannelData(0); let a = 0, s = d.length - 1;
    while (a < d.length / 4 && Math.abs(d[a]) < 1e-4) a++;
    while (s > d.length * .75 && Math.abs(d[s]) < 1e-4) s--;
    return [a / b.sampleRate, s / b.sampleRate];
  },
  /* kayıtlı sesi çal; çalındıysa kaynağı, yoksa null döndürür */
  cal(ad, hacim = .8, { hiz = 1, gecikme = 0 } = {}) {
    if (!this.acik() || !this.tampon[ad]) return null;
    const c = this.ctx, k = c.createBufferSource(), g = c.createGain();
    k.buffer = this.tampon[ad]; k.playbackRate.value = hiz; g.gain.value = hacim;
    k.connect(g).connect(c.destination); k.start(c.currentTime + gecikme);
    return k;
  },
  acik() { return durum.ayarlar.ses && this.ctx; },
  ton(frekans, sure, tip = "sine", siddet = 0.18, gecikme = 0) {
    if (!this.acik()) return;
    const t = this.ctx.currentTime + gecikme;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = tip; o.frequency.setValueAtTime(frekans, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(siddet, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + sure);
    o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + sure + 0.05);
  },
  tik()   { this.ton(720, 0.07, "triangle", 0.12); },
  satin() { this.ton(988, 0.12, "triangle", 0.16); this.ton(1319, 0.28, "triangle", 0.16, 0.09);
            [0.32, 0.44, 0.56].forEach(g => this.ton(170, 0.05, "square", 0.07, g)); },
  onay()  { [523, 659, 784].forEach((f, i) => this.ton(f, 0.16, "triangle", 0.15, i * 0.08)); },
  hata()  { this.ton(220, 0.18, "square", 0.08); this.ton(180, 0.22, "square", 0.08, 0.1); },
  gurultuTampon() {
    if (this._gurultu || !this.ctx) return this._gurultu;
    const b = this.ctx.createBuffer(1, this.ctx.sampleRate, this.ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return (this._gurultu = b);
  },
  gurultu(sure, filtre, f1, f2, siddet = .2, gecikme = 0) {
    if (!this.acik()) return;
    const c = this.ctx, t = c.currentTime + gecikme, k = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    k.buffer = this.gurultuTampon(); k.loop = true; f.type = filtre;
    f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(f2, t + sure);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(siddet, t + .03); g.gain.exponentialRampToValueAtTime(.0001, t + sure);
    k.connect(f).connect(g).connect(c.destination); k.start(t); k.stop(t + sure + .05);
  },
  motorBasla() {
    if (!this.acik() || this._m) return;
    const kayit = this.tampon["motor_" + motorSinifi()];
    if (kayit) {                                // kayıtlı motor döngüsü: hıza göre perde değişir
      const c = this.ctx, k = c.createBufferSource(), g = c.createGain();
      k.buffer = kayit; k.loop = true; [k.loopStart, k.loopEnd] = kayit._dongu || [0, kayit.duration];
      k.playbackRate.value = .7; g.gain.value = .0001;
      k.connect(g).connect(c.destination); k.start(c.currentTime, k.loopStart);
      g.gain.setTargetAtTime(.38, c.currentTime, .12);
      this._m = { k, g };
      return;
    }
    const c = this.ctx, o1 = c.createOscillator(), o2 = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
    o1.type = "sawtooth"; o2.type = "square"; f.type = "lowpass"; f.frequency.value = 700; g.gain.value = .0001;
    o1.connect(f); o2.connect(f); f.connect(g).connect(c.destination); o1.start(); o2.start();
    g.gain.setTargetAtTime(.05, c.currentTime, .1);
    this._m = { o1, o2, f, g };
  },
  motorAyarla(oran, nitro) {
    if (!this._m) return;
    if (this._m.k) {
      const t = this.ctx.currentTime, o = Math.min(1.7, Math.max(0, oran));
      this._m.k.playbackRate.setTargetAtTime(Math.min(1.55, .72 + .5 * o + (nitro ? .18 : 0)), t, .12);
      this._m.g.gain.setTargetAtTime(nitro ? .5 : .3 + .08 * Math.min(1, o), t, .15);
      return;
    }
    const t = this.ctx.currentTime, fr = 48 + 95 * Math.min(1.8, oran);
    this._m.o1.frequency.setTargetAtTime(fr, t, .08); this._m.o2.frequency.setTargetAtTime(fr / 2, t, .08);
    this._m.f.frequency.setTargetAtTime(nitro ? 2200 : 600 + 700 * oran, t, .1);
  },
  motorDur() {
    if (!this._m) return;
    const m = this._m, t = this.ctx.currentTime; this._m = null;
    m.g.gain.setTargetAtTime(.0001, t, .08);
    if (m.k) { m.k.stop(t + .4); return; }
    m.o1.stop(t + .4); m.o2.stop(t + .4);
  },
  serit() { this.ton(520, .06, "triangle", .07); },
  carp()  { if (this.cal("koni", .9)) return; this.ton(150, .25, "sine", .3); this.gurultu(.25, "lowpass", 900, 200, .25); },
  kay()   { if (this.cal("kayma", .7)) return; this.gurultu(.7, "bandpass", 2400, 700, .12); },
  nitro() { if (this.cal("nitro", .85)) return; this.gurultu(.9, "highpass", 600, 3500, .16); this.ton(300, .5, "sawtooth", .05); },
  al()    { if (this.cal("nitro_al", .8)) return; [880, 1320].forEach((f, i) => this.ton(f, .12, "triangle", .14, i * .07)); },
  bip(son) { this.ton(son ? 880 : 440, son ? .45 : .18, "square", .09); },
  fanfar(birinci) {
    const n = birinci ? [523, 659, 784, 1047, 784, 1047] : [523, 659, 784];
    n.forEach((f, i) => this.ton(f, .22, "triangle", .16, i * .13));
  },
  bitis(birinci) {                              // seyirci + korna; birinciye kazanma müziği
    this.cal("bitis", birinci ? .4 : .55);
    if (!(birinci && this.cal("kazandin", .9))) this.fanfar(birinci);
  },
  kupa() { this.cal("kupa", .9); this.fanfar(true); },
  /* yarış başlarken arabanın kendi marş sesi */
  calistir(araba, hacim = .75) {
    if (this._cal) { try { this._cal.stop(); } catch (e) {} }
    this._cal = this.cal("calistir_" + motorSinifi(araba), hacim);
    return !!this._cal;
  },
  yukselt(parca) {                              // parça türüne göre atölye sesi + jeton çınlaması
    if (!this.cal("yukselt_" + parca, .85)) return this.satin();
    this.ton(988, .12, "triangle", .1); this.ton(1319, .28, "triangle", .1, .09);
  },
  boya(kat) {
    const kayit = kat === "govde" ? this.calistir(null, .7) : this.cal("boya", .75);
    if (!kayit) return this.satin();
    this.ton(988, .12, "triangle", .1); this.ton(1319, .28, "triangle", .1, .09);
  },
  motor(araba) {
    if (!this.acik()) return;
    if (this.calistir(araba)) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(), o2 = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
    o.type = "sawtooth"; o2.type = "square";
    o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(210, t + 0.45); o.frequency.exponentialRampToValueAtTime(95, t + 1.1);
    o2.frequency.setValueAtTime(35, t); o2.frequency.exponentialRampToValueAtTime(105, t + 0.45); o2.frequency.exponentialRampToValueAtTime(48, t + 1.1);
    f.type = "lowpass"; f.frequency.setValueAtTime(900, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.08);
    g.gain.setValueAtTime(0.16, t + 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.15);
    o.connect(f); o2.connect(f); f.connect(g).connect(c.destination);
    o.start(t); o2.start(t); o.stop(t + 1.2); o2.stop(t + 1.2);
  }
};

/* --- Müzik: ana menü ve galeri döngüleri (dosyadan akış, Web Audio ile ses seviyesi) --- */
const MUZIK_DOSYA = { menu: "okuma_rallisi/ses/muzik_menu.mp3", galeri: "okuma_rallisi/ses/muzik_galeri.mp3" };
const MUZIKSIZ = new Set(["okuma", "soru", "pist"]);        // okurken ve yarışırken müzik susar
const Muzik = {
  parca: {}, aktif: null, istenen: null, zaman: null,
  hacim() { return durum.ayarlar.muzik ? Math.max(0, Math.min(100, durum.ayarlar.muzikSes)) / 100 * .6 : 0; },
  hazir() { return !!Ses.ctx; },
  al(ad) {
    if (this.parca[ad]) return this.parca[ad];
    const el = new Audio(MUZIK_DOSYA[ad]); el.loop = true; el.preload = "auto";
    const p = { el, g: null };
    try { const k = Ses.ctx.createMediaElementSource(el); p.g = Ses.ctx.createGain(); p.g.gain.value = 0; k.connect(p.g).connect(Ses.ctx.destination); }
    catch (e) { el.volume = 0; }                  // Web Audio bağlanamazsa öğenin kendi sesi
    return (this.parca[ad] = p);
  },
  seviye(p, v, sure = .6) {
    if (p.g) { const t = Ses.ctx.currentTime; p.g.gain.cancelScheduledValues(t); p.g.gain.setValueAtTime(p.g.gain.value, t); p.g.gain.linearRampToValueAtTime(v, t + sure); }
    else p.el.volume = Math.min(1, v);
  },
  sahne(ad, gecikme = 0) { this.cal(MUZIKSIZ.has(ad) ? null : ad === "showroom" ? "galeri" : "menu", gecikme); },
  cal(ad, gecikme = 0) {
    this.istenen = ad; clearTimeout(this.zaman);
    if (gecikme) { if (this.aktif && this.aktif !== ad) { this.dur(this.aktif); this.aktif = null; } this.zaman = setTimeout(() => this.cal(ad), gecikme); return; }
    if (!this.hazir()) return;
    if (this.aktif && this.aktif !== ad) this.dur(this.aktif);
    this.aktif = ad;
    if (!ad) return;
    const v = this.hacim(), p = this.al(ad);
    if (!v) { p.el.pause(); return; }
    if (p.el.paused) { if (p.g) p.g.gain.value = 0; else p.el.volume = 0; const s = p.el.play(); if (s && s.catch) s.catch(() => {}); }
    this.seviye(p, v, 1.2);
  },
  dur(ad, sure = .6) {
    const p = this.parca[ad]; if (!p) return;
    this.seviye(p, 0, sure);
    setTimeout(() => { if (this.aktif !== ad) p.el.pause(); }, sure * 1000 + 80);
  },
  ayarla() {                                     // ayarlardan açma/kapama ve ses seviyesi
    const ad = this.aktif || this.istenen; if (!ad || !this.hazir()) return;
    const p = this.al(ad), v = this.hacim();
    if (!v) { this.seviye(p, 0, .25); setTimeout(() => { if (!this.hacim()) p.el.pause(); }, 300); return; }
    this.aktif = ad;
    if (p.el.paused) { const s = p.el.play(); if (s && s.catch) s.catch(() => {}); }
    this.seviye(p, v, .2);
  },
  baslat() { if (this.hazir()) this.cal(this.istenen); }
};
document.addEventListener("visibilitychange", () => {      // sekme gizlenince müzik dursun
  const p = Muzik.parca[Muzik.aktif]; if (!p) return;
  if (document.hidden) p.el.pause(); else if (Muzik.hacim()) { const s = p.el.play(); if (s && s.catch) s.catch(() => {}); }
});

    dondurma:  `<path d="M-6 -1 L6 -1 L0 11Z" fill="#F5B86B" stroke="#C98A3C" stroke-width=".8"/><path d="M-4 1 L3 6 M-1 1 L4 4 M2 1 L-2 6" stroke="#C98A3C" stroke-width=".7"/><circle cy="-4" r="6.5" fill="#FF8FB1"/><circle cx="-2" cy="-6" r="1.6" fill="#fff" opacity=".6"/><circle cx="2" cy="-10.5" r="1.8" fill="#EF4444"/>`,
    gezegen:   `<circle r="7" fill="#A855F7"/><path d="M-5 -3 Q0 -1 5 -4 M-6 2 Q0 4 6 1" stroke="#C4B5FD" stroke-width="1.4" fill="none"/><ellipse rx="12" ry="3.4" fill="none" stroke="#FFD600" stroke-width="1.8" transform="rotate(-18)"/><path d="M-7 1.5 A7 7 0 0 0 7 -1.5" fill="#A855F7" transform="rotate(-18)"/>`,
    balina:    `<path d="M-10 3 Q-10 -6 0 -6 Q9 -6 10 2 Q10 7 2 7 L-6 7 Q-10 7 -10 3Z" fill="#4D9FFF"/><path d="M-10 0 L-13 -4 L-12 3Z" fill="#4D9FFF"/><path d="M-6 3 Q2 6 9 3 Q8 6 2 6.5 L-5 6.5Z" fill="#DBEAFE"/><circle cx="5" cy="-1" r="1.2" fill="#1F2340"/><path d="M0 -6 Q-1 -10 -3 -11 M0 -6 Q1 -10 3 -11" stroke="#93C5FD" stroke-width="1.3" fill="none"/>`,
    ahtapot:   `<path d="M-7 1 Q-8 -9 0 -9 Q8 -9 7 1Z" fill="#FF4D8D"/><path d="M-7 1 Q-9 6 -7 9 M-4 1 Q-5 7 -3 10 M0 1 L0 10 M4 1 Q5 7 3 10 M7 1 Q9 6 7 9" stroke="#FF4D8D" stroke-width="2.6" stroke-linecap="round" fill="none"/><circle cx="-2.6" cy="-3" r="1.6" fill="#fff"/><circle cx="2.6" cy="-3" r="1.6" fill="#fff"/><circle cx="-2.6" cy="-3" r=".8" fill="#1F2340"/><circle cx="2.6" cy="-3" r=".8" fill="#1F2340"/>`,
    kupa:      `<path d="M-6 -8 H6 V-2 Q6 4 0 4 Q-6 4 -6 -2Z M-2 4 H2 V7 H4 V9 H-4 V7 H-2Z" fill="#FBBF24"/><path d="M-6 -6 Q-10 -6 -9 -1 Q-8 2 -5 1 M6 -6 Q10 -6 9 -1 Q8 2 5 1" stroke="#FBBF24" stroke-width="1.6" fill="none"/>`
  }[tur] || "";
  return `<g transform="translate(${x} ${y}) scale(${k})"><circle r="14" fill="#fff" stroke="#1F2340" stroke-opacity=".25" stroke-width="1.5"/>${ic}</g>`;
}

/* --- Jantlar (r: jant yarıçapı) --- */
const JANTLAR = {
  standart: (cx, cy, r) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#D9DEE5"/><g stroke="#9AA3AF" stroke-width="3.5" stroke-linecap="round"><path d="M${cx} ${cy - r + 3} L${cx} ${cy + r - 3}"/><path d="M${cx - r + 3} ${cy} L${cx + r - 3} ${cy}"/><path d="M${cx - r * .6} ${cy - r * .6} L${cx + r * .6} ${cy + r * .6}"/><path d="M${cx + r * .6} ${cy - r * .6} L${cx - r * .6} ${cy + r * .6}"/></g>`,
  spor: (cx, cy, r) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#374151"/>${[0, 1, 2, 3, 4].map(k => { const a = -Math.PI / 2 + k * 1.2566; return `<path d="M${cx} ${cy} L${(cx + Math.cos(a - .22) * (r - 2)).toFixed(1)} ${(cy + Math.sin(a - .22) * (r - 2)).toFixed(1)} L${(cx + Math.cos(a + .22) * (r - 2)).toFixed(1)} ${(cy + Math.sin(a + .22) * (r - 2)).toFixed(1)}Z" fill="#E5E7EB"/>`; }).join("")}`,
  yildiz: (cx, cy, r) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#1F2340"/><path d="${yildizYol(cx, cy, r - 2, (r - 2) * .45)}" fill="#FFD600"/>`,
  cicek: (cx, cy, r) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff"/>${[0, 1, 2, 3, 4, 5].map(k => `<circle cx="${(cx + Math.cos(k * 1.047) * r * .52).toFixed(1)}" cy="${(cy + Math.sin(k * 1.047) * r * .52).toFixed(1)}" r="${(r * .36).toFixed(1)}" fill="#FF8FB1"/>`).join("")}<circle cx="${cx}" cy="${cy}" r="${r * .3}" fill="#FFD600"/>`,
  tel: (cx, cy, r) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/><g stroke="#9CA3AF" stroke-width="1.1">${Array.from({ length: 12 }, (_, k) => { const a = k * Math.PI / 6; return `<path d="M${cx} ${cy} L${(cx + Math.cos(a) * r).toFixed(1)} ${(cy + Math.sin(a) * r).toFixed(1)}"/>`; }).join("")}</g>`,
  altin: (cx, cy, r) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#FBBF24" stroke="#B45309" stroke-width="1.5"/><g stroke="#B45309" stroke-width="3" stroke-linecap="round">${[0, 1, 2, 3, 4, 5].map(k => { const a = k * 1.047; return `<path d="M${cx} ${cy} L${(cx + Math.cos(a) * (r - 3)).toFixed(1)} ${(cy + Math.sin(a) * (r - 3)).toFixed(1)}"/>`; }).join("")}</g><circle cx="${cx - r * .35}" cy="${cy - r * .35}" r="${r * .18}" fill="#FEF3C7"/>`
};

function tekerSVG(cx, lastik, jant, ek = 0, aci = 0) {
  const r = 28 + ek + [0, 0, 1, 2, 3, 3][lastik], cy = 162 - r, ri = 17 + ek * .6 + (lastik >= 3 ? 1 : 0);
  let dis = "";
  if (lastik >= 1) for (let k = 0; k < 16; k++) {
    const a = k / 16 * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
    dis += `<path d="M${(cx + c * (r - 5)).toFixed(1)} ${(cy + s * (r - 5)).toFixed(1)} L${(cx + c * (r - .5)).toFixed(1)} ${(cy + s * (r - .5)).toFixed(1)}"/>`;
  }
  return `<circle cx="${cx}" cy="${cy}" r="${r + 5}" fill="#1F2340" opacity=".35"/>
<g class="teker" transform="rotate(${aci} ${cx} ${cy})"><circle cx="${cx}" cy="${cy}" r="${r}" fill="#23242B"/>${dis ? `<g stroke="#454652" stroke-width="3.2" stroke-linecap="round">${dis}</g>` : ""}
${lastik >= 5 ? `<circle cx="${cx}" cy="${cy}" r="${r - 7.5}" fill="none" stroke="#FFD600" stroke-width="2.6"/>` : ""}</g>
${lastik >= 4 ? `<path d="M${cx - ri * .55} ${cy - ri * .95} A${ri + 1} ${ri + 1} 0 0 1 ${cx + ri * .95} ${cy - ri * .45}" stroke="#EF4444" stroke-width="7" fill="none" stroke-linecap="round"/>` : ""}
<g class="teker" transform="rotate(${aci} ${cx} ${cy})">${(JANTLAR[jant] || JANTLAR.standart)(cx, cy, ri)}<circle cx="${cx}" cy="${cy}" r="4.5" fill="#6B7280"/></g>`;
}

/* --- Tavan süsleri (x,y: tavanın tepe noktası) --- */
function tavanSVG(tur, x, y, renk) {
  switch (tur) {
    case "fiyonk": return `<path d="M${x} ${y - 6} L${x - 15} ${y - 14} L${x - 15} ${y + 2} Z M${x} ${y - 6} L${x + 15} ${y - 14} L${x + 15} ${y + 2} Z" fill="#FF4D8D" stroke="#C42A62" stroke-width="1.5" stroke-linejoin="round"/><circle cx="${x}" cy="${y - 6}" r="4.5" fill="#FF8FB1" stroke="#C42A62" stroke-width="1.5"/>`;
    case "bayrak": return `<path d="M${x - 10} ${y + 1} L${x - 10} ${y - 30}" stroke="#6B7280" stroke-width="2.4" stroke-linecap="round"/><rect x="${x - 10}" y="${y - 30}" width="26" height="17" fill="#E30A17"/><circle cx="${x - 0.5}" cy="${y - 21.5}" r="5" fill="#fff"/><circle cx="${x + 0.8}" cy="${y - 21.5}" r="4" fill="#E30A17"/><path d="${yildizYol(x + 7, y - 21.5, 2.6, 1.05)}" fill="#fff" transform="rotate(-18 ${x + 7} ${y - 21.5})"/>`;
    case "anten":  return `<path d="M${x + 8} ${y + 1} Q${x + 4} ${y - 16} ${x - 6} ${y - 30}" stroke="#4B5563" stroke-width="2" fill="none"/><circle cx="${x - 6}" cy="${y - 31}" r="5" fill="#FF4D8D" stroke="#fff" stroke-width="1.5"/>`;
    case "kulak":  return `<path d="M${x - 22} ${y + 2} L${x - 15} ${y - 14} L${x - 6} ${y + 1} Z M${x + 6} ${y + 1} L${x + 15} ${y - 14} L${x + 22} ${y + 2} Z" fill="${renk}" stroke="#1F2340" stroke-opacity=".35" stroke-width="1.5"/><path d="M${x - 18} ${y} L${x - 15} ${y - 8} L${x - 10} ${y}Z M${x + 10} ${y} L${x + 15} ${y - 8} L${x + 18} ${y}Z" fill="#FF8FB1"/>`;
    case "tac":    return `<path d="M${x - 16} ${y + 1} L${x - 18} ${y - 16} L${x - 8} ${y - 7} L${x} ${y - 20} L${x + 8} ${y - 7} L${x + 18} ${y - 16} L${x + 16} ${y + 1} Z" fill="#FBBF24" stroke="#B45309" stroke-width="1.5" stroke-linejoin="round"/><circle cx="${x}" cy="${y - 6}" r="2.6" fill="#EF4444"/><circle cx="${x - 10}" cy="${y - 4}" r="2" fill="#4D9FFF"/><circle cx="${x + 10}" cy="${y - 4}" r="2" fill="#22C55E"/>`;
    default: return "";
  }
}

/* --- Egzoz efektleri (x,y: egzozun arka ucu) --- */
function egzozEfektSVG(tur, x, y) {
  switch (tur) {
    case "duman":    return `<g opacity=".85"><circle cx="${x - 4}" cy="${y + 2}" r="4.5" fill="#C4B5FD"/><circle cx="${x - 12}" cy="${y - 2}" r="6" fill="#93C5FD"/><circle cx="${x - 22}" cy="${y - 7}" r="7" fill="#FFB3D1"/></g>`;
    case "parilti":  return `<g fill="#FFD600" stroke="#fff" stroke-width=".8">${[[x - 6, y + 1, 5], [x - 16, y - 6, 4], [x - 20, y + 6, 3.4]].map(([a, b, r]) => `<path d="${yildizYol(a, b, r, r * .38)}"/>`).join("")}</g>`;
    case "kalpcik":  return `<g fill="#FF4D8D">${[[x - 6, y + 1, 4], [x - 15, y - 6, 3.4], [x - 20, y + 5, 3]].map(([a, b, s]) => `<path d="${kalpYol(a, b, s)}"/>`).join("")}</g>`;
    case "gokkusagi": return ["#EF4444", "#FFD600", "#22C55E", "#3B82F6", "#A855F7"].map((c, i) => `<rect x="${x - 26}" y="${y - 5 + i * 2.6}" width="26" height="2.7" rx="1.3" fill="${c}"/>`).join("");
    default: return "";
  }
}

/* --- Sürücü kaskı --- */
function kaskSVG(cx, cy, r, kask) {
  const k = kask || { renk: "#FFFFFF", desen: "duz" }, id = "ks" + (++svgSayac);
  const ac = acikMi(k.renk) ? "#1F2340" : "#fff";
  const d = { serit: `<rect x="${cx - r * .2}" y="${cy - r}" width="${r * .4}" height="${r * 2}" fill="${ac}" opacity=".85"/>`,
              yildiz: `<path d="${yildizYol(cx - r * .3, cy - r * .2, r * .42)}" fill="#FFD600"/>`,
              kalp: `<path d="${kalpYol(cx - r * .3, cy - r * .15, r * .38)}" fill="${acikMi(k.renk) ? "#FF4D8D" : "#fff"}"/>`,
              simsek: `<path d="${simsekYol(cx - r * .3, cy - r * .1, r * .5)}" fill="#FFD600"/>` }[k.desen] || "";
  return `<clipPath id="${id}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath>
<circle cx="${cx}" cy="${cy}" r="${r}" fill="${k.renk}" stroke="#1F2340" stroke-opacity=".4" stroke-width="1.4"/>
<g clip-path="url(#${id})">${d}</g>
<path d="M${cx + r * .05} ${cy - r * .35} Q${cx + r * 1.02} ${cy - r * .38} ${cx + r * .97} ${cy + r * .28} L${cx + r * .2} ${cy + r * .22} Z" fill="#1F2340" opacity=".85"/>
<path d="M${cx + r * .35} ${cy - r * .22} Q${cx + r * .72} ${cy - r * .24} ${cx + r * .8} ${cy - r * .05}" stroke="#fff" stroke-width="1.4" opacity=".7" fill="none"/>`;
}

function arabaNormal(a) {
  a = a || {};
  const d = { ad: "", govde: "spor", renk: "#FF6B35", desen: "yok", cikartma: "yok", jant: "standart", tavan: "yok", egzoz: "yok" };
  const n = { ...d, ...a };
  for (const k of Object.keys(d)) if (n[k] === null || n[k] === undefined) n[k] = d[k];
  delete n.cikartmalar;
  return n;
}

function arabaSVG(araba, numara = "1", parcalar = durum.garaj.parcalar, kask = durum.profil.kask, ops = {}) {
  const a = arabaNormal(araba), G = GOVDELER[a.govde] || GOVDELER.spor, r = a.renk, id = "ar" + (++svgSayac);
  const p = { motor: 0, lastik: 0, aero: 0, nitro: 0, ...parcalar };
  const koyu = "#1F2340", krom = p.motor >= 5 ? "#E5E7EB" : "#9CA3AF";
  // Egzoz boruları ve efektleri (gövdenin arkasında)
  const [ex, ey] = G.egzoz;
  let egzoz = "";
  if (p.motor >= 2) egzoz += `<rect x="${ex}" y="${ey}" width="24" height="7" rx="3.5" fill="${krom}" stroke="#6B7280" stroke-width="1.5"/>`;
  if (p.motor >= 4) egzoz += `<rect x="${ex + 2}" y="${ey + 7.5}" width="22" height="6" rx="3" fill="${krom}" stroke="#6B7280" stroke-width="1.5"/>`;
  const alev = p.nitro >= 5 ? `<path d="M${ex + 2} ${ey + 3} Q${ex - 10} ${ey - 1} ${ex - 26} ${ey + 4} Q${ex - 10} ${ey + 6} ${ex - 18} ${ey + 11} Q${ex - 8} ${ey + 9} ${ex + 2} ${ey + 10} Z" fill="#60A5FA" opacity=".9"/><path d="M${ex + 2} ${ey + 4.5} Q${ex - 6} ${ey + 3} ${ex - 14} ${ey + 5.5} Q${ex - 6} ${ey + 7} ${ex + 2} ${ey + 8} Z" fill="#E0F2FE"/>` : "";
  // Kaput hava girişi (motor 1+)
  let kaput = "";
  if (p.motor >= 1) {
    const K = G.kaput, egim = (K.y2 - K.y1) / (K.x2 - K.x1), aci = Math.atan(egim) * 180 / Math.PI, h = p.motor >= 3 ? 9 : 7;
    const kr = p.motor >= 3 ? ` stroke="#E5E7EB" stroke-width="1.6"` : "";
    const tek = x => { const y = K.y1 + (x + 13 - K.x1) * egim;
      return `<g transform="rotate(${aci.toFixed(1)} ${x + 13} ${y.toFixed(1)})"><rect x="${x}" y="${(y - h + 2).toFixed(1)}" width="26" height="${h}" rx="3" fill="${koyu}"${kr}/><rect x="${x + 3}" y="${(y - h + 4).toFixed(1)}" width="20" height="2.6" rx="1.3" fill="#4B5563"/></g>`; };
    kaput = (p.motor >= 5 ? K.xs5 : K.xs).map(tek).join("");
  }
  // Aerodinamik: dudak, kanat, splitter, yan etek
  let aero = "";
  const kl = Math.max(p.aero, G.kanatMin || 0);
  if (kl === 1 && G.dudak) aero += `<path d="${G.dudak}" fill="${koyu}"/>`;
  if (kl >= 2) {
    const [[a1x, a1y], [a2x, a2y]] = G.kanat.ayak, m = G.kanat.merkez;
    const yari = [0, 0, 24, 30, 36, 40][kl], h = [0, 0, 5, 6, 7, 8][kl], wy = a1y - [0, 0, 16, 22, 29, 33][kl];
    const x1 = m - yari, x2 = m + yari;
    aero += `<path d="M${a1x} ${a1y} L${a1x + 4} ${wy + h} M${a2x} ${a2y} L${a2x + 2} ${wy + h}" stroke="${koyu}" stroke-width="5" stroke-linecap="round"/>`;
    aero += `<rect x="${x1}" y="${wy}" width="${x2 - x1}" height="${h}" rx="${h / 2}" fill="${koyu}"/>`;
    if (kl >= 4) aero += `<rect x="${x1 - 2}" y="${wy - 5}" width="5" height="${h + 10}" rx="2" fill="${koyu}"/><rect x="${x2 - 3}" y="${wy - 5}" width="5" height="${h + 10}" rx="2" fill="${koyu}"/>`;
    if (kl >= 5) aero += `<rect x="${x1 + 4}" y="${wy + 1.5}" width="${x2 - x1 - 8}" height="2.5" rx="1.2" fill="#FFD600"/>`;
  }
  if (p.aero >= 2) aero += `<path d="${G.splitter}" fill="${koyu}"/>`;
  if (p.aero >= 5) aero += `<rect x="${G.etek[0]}" y="${G.etek[1]}" width="${G.etek[2]}" height="6" rx="3" fill="${koyu}"/>`;
  // Nitro: rozet, tüpler, yan şerit
  let nitro = "";
  if (p.nitro >= 4) nitro += `<rect x="${G.serit[0]}" y="${G.serit[1]}" width="${G.serit[2]}" height="4" rx="2" fill="#3B82F6" opacity=".85"/>`;
  if (p.nitro >= 2) {
    const [tx, ty] = G.tup;
    const tup = y => `<rect x="${tx}" y="${y}" width="40" height="9" rx="4.5" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/><rect x="${tx + 12}" y="${y}" width="5" height="9" fill="#fff" opacity=".85"/><rect x="${tx + 38}" y="${y + 2}" width="5" height="5" rx="1.5" fill="#E5E7EB"/>`;
    nitro += tup(ty) + (p.nitro >= 3 ? tup(ty - 9) : "");
  }
  if (p.nitro >= 1) { const [rx, ry1, ry4] = G.rozet, ry = p.nitro >= 4 ? ry4 : ry1;
    nitro += `<circle cx="${rx}" cy="${ry}" r="7.5" fill="#3B82F6" stroke="#fff" stroke-width="2"/><text x="${rx}" y="${ry + 3.6}" text-anchor="middle" font-size="10" font-weight="900" fill="#fff" font-family="Nunito Variable,Nunito,sans-serif">N</text>`; }
  // Sürücü
  const [kx, ky, kr2] = G.kask;
  let surucu = "";
  if (G.acik) {
    const gomlek = ops.gomlek || (AVATARLAR[durum.profil.avatar] || AVATARLAR[0]).gomlek;
    surucu = (G.kokpit ? "" : `<rect x="${kx - 15}" y="${ky + 8}" width="30" height="18" rx="7" fill="${gomlek}"/>`) + kaskSVG(kx, ky, kr2, kask);
  }
  const [nx, ny, nr] = G.numara, cam = G.cam, gid = id + "k";
  const krm = G.krom ? `<rect x="14" y="124" width="26" height="8" rx="4" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.2"/><rect x="370" y="124" width="26" height="8" rx="4" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.2"/>` : "";
  return `<svg viewBox="-24 0 ${ARABA_EN} 170" aria-hidden="true">
<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="${gid}"><path d="${G.govde}"/></clipPath>${cam ? `<clipPath id="${id}c"><path d="${cam}"/></clipPath>` : ""}</defs>
<ellipse cx="208" cy="162" rx="182" ry="9" fill="#000" opacity=".22"/>
${egzozEfektSVG(a.egzoz, ex, ey + 3)}${egzoz}${alev}
${G.kafes ? `<path d="${G.kafes}" stroke="${koyu}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="${G.koltuk}" fill="#374151"/>` : ""}${G.arka || ""}
${G.kokpit ? kaskSVG(kx, ky, kr2, kask) : (G.acik ? surucu : "")}
${G.kemer ? G.teker.map(cx => `<path d="M${cx - 36} 136 C${cx - 36} 116.1 ${cx - 19.9} 100 ${cx} 100 C${cx + 19.9} 100 ${cx + 36} 116.1 ${cx + 36} 136 Z" fill="#15172A"/>`).join("") : ""}
<path d="${G.govde}" fill="${r}"/>
<g clip-path="url(#${gid})">${desenSVG(a.desen, r, govdeKutu(a.govde))}<rect x="-24" y="${govdeKutu(a.govde).y2 - 12}" width="430" height="20" fill="#000" opacity=".18"/></g>
<path d="${G.govde}" fill="url(#${id})"/>
${G.detay ? `<g color="${r}">${G.detay}</g>` : ""}
${G.kokpit ? `<path d="M176 95 L224 95 L232 104 L172 104 Z" fill="${koyu}" opacity=".8"/>${G.onKanat ? `<path d="${G.onKanat}" fill="${koyu}"/>` : ""}` : ""}
${cam ? `<path d="${cam}" fill="#BFE6FF"/><g clip-path="url(#${id}c)">${kaskSVG(kx, ky, kr2, kask)}</g><path d="${cam}" fill="#BFE6FF" opacity=".35" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>` : ""}
${G.direk ? `<path d="M${G.direk[0]} ${G.direk[1]} L${G.direk[0]} ${G.direk[2]}" stroke="${r}" stroke-width="6"/>` : ""}
${G.parlak ? `<path d="${G.parlak}" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".75" fill="none"/>` : ""}
${G.direk ? `<path d="M${G.direk[0]} ${G.direk[2] + 4} L${G.direk[0]} ${govdeKutu(a.govde).y2 - 6}" stroke="#000" stroke-opacity=".15" stroke-width="2"/>` : ""}
${krm}
${G.far ? `<ellipse cx="${G.far[0]}" cy="${G.far[1]}" rx="${G.krom ? 9 : 8}" ry="${G.krom ? 9 : 6}" fill="#FFF3B0" stroke="#fff" stroke-width="2"/>` : ""}
<rect x="${G.stop[0]}" y="${G.stop[1]}" width="10" height="12" rx="3" fill="#FF3B3B"/>
${tavanSVG(a.tavan, G.tavan[0], G.tavan[1], r)}
${nitro}

function bayrakSVG() {
  let kare = "";
  for (let y = 0; y < 4; y++) for (let x = 0; x < 5; x++) if ((x + y) % 2 === 0) kare += `<rect x="${6 + x * 6}" y="${4 + y * 5}" width="6" height="5" fill="#1F2340"/>`;
  return `<svg class="bayrak" viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="2" width="4" height="36" rx="2" fill="#fff" stroke="#1F2340" stroke-width="1.5"/><rect x="6" y="4" width="30" height="20" fill="#fff" stroke="#1F2340" stroke-width="1.5"/>${kare}</svg>`;
}

function karistir(dizi) {
  const a = dizi.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function karistirFarkli(dizi) {   // sıralama sorusunda öğeler asla doğru sırada gelmesin
  let a = karistir(dizi), deneme = 0;
  while (a.every((v, i) => v === dizi[i]) && deneme++ < 20) a = karistir(dizi);
  return a;
}

// Metni cümle cümle (kanıt vurgusu için) HTML'e çevirir
function metinHTML(m) {
  const satirli = ["siir", "ilan"].includes(m.tur);
  const konusmali = ["diyalog", "roportaj"].includes(m.tur);
  let html = "", p = [];
  const kapat = () => { if (p.length) { html += `<p>${p.join(satirli ? "<br>" : " ")}</p>`; p = []; } };
  m.cumleler.forEach((c, i) => {
    if (konusmali || m.paragrafBasi.includes(i)) kapat();
    let ic = esc(c);
    const k = konusmali && c.match(/^([^:]{1,24}):\s(.*)$/);
    if (k) ic = `<span class="konusan">${esc(k[1])}:</span> ${esc(k[2])}`;
    p.push(`<span class="c" data-c="${i}">${ic}</span>`);
  });
  kapat();
  return `<div class="metin ${m.tur}"><h2>${esc(m.baslik)}</h2>${html}</div>`;
}

// Pazartesi başlayan haftanın anahtarı (Sezon Kupası için)
function haftaAnahtari(t = new Date()) {
  const d = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

// Kapak (cover) yerleşimindeki bir görselde, görsel oranıyla verilen noktanın ekrandaki yeri
function gorselNoktasi(el, x, y) {
  const w = el.clientWidth, h = el.clientHeight;
  const olcek = Math.max(w / GORSEL_EN, h / GORSEL_BOY);
  const gw = GORSEL_EN * olcek, gh = GORSEL_BOY * olcek;
  return { x: (w - gw) / 2 + gw * x, y: (h - gh) / 2 + gh * y, gw, gh, w, h };
}

function arabayiYerlestir(el) {

  const araba = el.querySelector("#garajAraba"), plaka = el.querySelector("#plaka");

  const w = el.clientWidth, h = el.clientHeight;
  const olcek = Math.max(w / GORSEL_EN, h / GORSEL_BOY);
  const gw = GORSEL_EN * olcek, gh = GORSEL_BOY * olcek;
  const ox = (w - gw) / 2, oy = (h - gh) / 2;
  const en = gw * PLATFORM.genislik, boy = en * 170 / ARABA_EN;
  const cx = ox + gw * PLATFORM.x, tabanY = oy + gh * PLATFORM.y;
  araba.style.width = en + "px";
  araba.style.left = (cx - en / 2) + "px";
  araba.style.top = (tabanY - boy * 0.93) + "px";

}

function svgResim(svg, w, h) {
  return new Promise((ok, hata) => {
    const kod = svg.replace("<svg ", `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" `);
    const r = new Image(); r.onload = () => ok(r); r.onerror = hata;
    r.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(kod);
  });
}
async function arabaKartiCiz(i) {

  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.globalAlpha = .08; x.fillStyle = a.renk; for (let k = -H; k < W; k += 70) { x.beginPath(); x.moveTo(k, 0); x.lineTo(k + 35, 0); x.lineTo(k + 35 + H, H); x.lineTo(k + H, H); x.fill(); } x.globalAlpha = 1;
  for (let k = 0; k < W / 20; k++) for (let r = 0; r < 2; r++) { x.fillStyle = (k + r) % 2 ? "#fff" : "#1F2340"; x.fillRect(k * 20, r * 20, 20, 20); }
  const yazi = (t, px, py, boyut, renk, kalin = 900, hiza = "left") => { x.font = `${kalin} ${boyut}px "Nunito Variable", Nunito, sans-serif`; x.fillStyle = renk; x.textAlign = hiza; x.fillText(t, px, py); };
  yazi("OKUMA RALLİSİ", 60, 100, 30, "#FFD600");
  yazi(arabaAdi(i), 60, 160, 54, "#fff");
  const aw = 740, ah = Math.round(aw * 170 / ARABA_EN), ay = 225, taban = ay + ah * 162 / 170;
  const el = x.createRadialGradient(400, taban, 10, 400, taban, 340); el.addColorStop(0, "rgba(255,255,255,.35)"); el.addColorStop(1, "rgba(255,255,255,0)");
  x.fillStyle = el; x.beginPath(); x.ellipse(400, taban, 340, 50, 0, 0, Math.PI * 2); x.fill();
  const ah2 = Math.round(aw * (170 + UST_PAY) / ARABA_EN);
  const araba = await svgResim(uzunSVG(arabaSVG(a, String(durum.profil.avatar + 1))), aw, ah2);
  x.drawImage(araba, 30, taban - ah2 * (162 + UST_PAY) / (170 + UST_PAY), aw, ah2);
  x.fillStyle = "rgba(255,255,255,.1)"; x.beginPath(); x.roundRect(790, 60, 360, 555, 28); x.fill();
  const av = await svgResim(avatarSVG(durum.profil.avatar), 120, 120); x.drawImage(av, 910, 90, 120, 120);
  yazi(durum.profil.ad, 970, 250, 38, "#fff", 900, "center");
  yazi("Sürücü", 970, 282, 22, "#C4B5FD", 800, "center");
  const yildiz = Object.values(durum.metinler).reduce((t, y) => t + y, 0);
  [["⚡ Güç", guc()], ["📖 Okunan metin", durum.istatistik.okunanMetin], ["⭐ Yıldız", yildiz], ["🏆 Kupa", durum.kupalar.length], ["🥇 Birincilik", durum.istatistik.galibiyet]]
    .forEach(([ad, d], k) => { const y = 345 + k * 52; yazi(ad, 820, y, 26, "#E5E7EB", 800); yazi(String(d), 1120, y, 30, "#FFD600", 1000, "right"); });
  yazi("sinanince.com", W - 40, H - 24, 20, "rgba(255,255,255,.6)", 800, "right");

function sonucHesapla() {
  const { m, sonuc, onceki, tekrar } = oturum, n = m.sorular.length;
  const ilkDogru = sonuc.filter(t => t === "dogru").length;
  const yildiz = ilkDogru === n ? 3 : ilkDogru >= n - 2 ? 2 : 1;
  const acikOnce = seviyeAcik(m.seviye + 1);
  let jeton = 0, yakit = 0, bonus = 0;
  if (!tekrar) {
    jeton = oturum.kazanilan;
    if (ilkDogru === n) { bonus = ODUL.tamBonus; jeton += bonus; }
    yakit = ODUL.yakit;
    durum.istatistik.okunanMetin++;
    const h = haftaAnahtari();
    if (durum.sezon.hafta !== h) { durum.sezon.hafta = h; durum.sezon.sayi = 0; }
    durum.sezon.sayi++;
    const sc = haftaninCikartmasi();
    if (durum.sezon.sayi >= SEZON_ESIK && !sahipMi("cikartma", sc.id)) { durum.envanter.cikartma.push(sc.id); durum.sezon.alinanlar.push(h); var sezonOdul = sc; }
  } else if (yildiz > onceki) { jeton = ODUL.yeniYildiz * (yildiz - onceki); yakit = ODUL.tekrarYakit; }
  durum.metinler[m.id] = Math.max(onceki, yildiz);
  durum.jeton += jeton; durum.yakit += yakit;
  kaydet();
  const acilan = m.seviye < 4 && !acikOnce && seviyeAcik(m.seviye + 1) ? bolgesi(m.seviye + 1) : null;
  return { yildiz, ilkDogru, n, jeton, yakit, bonus, acilan, sezonOdul: typeof sezonOdul !== "undefined" ? sezonOdul : null };
}

                : r.yildiz === 2 ? "Çok iyi! Birkaç soruda kanıta göz attın."

/* ==========================================================
   7.9 YARIŞ MOTORU (simülasyon; çizimden bağımsız, test edilebilir)
   Bütün arabalar aynı fizikle yarışır. Rakiplerin gücü kademe aralığından
   gelir ve parçalara eşit dağıtılır; oyuncu kendi parçalarıyla yarışır.
   Sonucu çoğunlukla güç belirler, engellerden kaçmak ve nitroyu doğru
   kullanmak da fark yaratır.
   ========================================================== */
const YARIS = {
  BASE_HIZ: 38, BASE_IVME: 8, ARABA_L: 16, SURE: 40, KONI: .35, YAG: .5, NITRO_SIK: .3,
  /* kacis: rakiplerin engelden kaçma olasılığı (hata oranı = 1 − kacis), kademe zorlaştıkça rakipler daha az hata yapar;
     nitro: rakiplerin nitro kullanma sıklığı; dagilim: her rakibin kendi beceri sapması (bazı rakipler sakar, bazıları usta) */
  ayar: {
    kolay:  { pist: "pist1", bosluk: [88, 108], ikili: 0,   yag: .30, kacis: .42, nitro: .18, dagilim: .14 },
    orta:   { pist: "pist2", bosluk: [78, 98],  ikili: .15, yag: .38, kacis: .55, nitro: .28, dagilim: .12 },
    zor:    { pist: "pist3", bosluk: [70, 88],  ikili: .30, yag: .45, kacis: .70, nitro: .40, dagilim: .10 },
    cokZor: { pist: "pist4", bosluk: [62, 80],  ikili: .40, yag: .50, kacis: .90, nitro: .60, dagilim: .06 }
  },
  /* Lastik bandı: oyuncunun GERİSİNDE kalan rakipler sessizce hızlanıp yaklaşır, son düzlükte daha da yaklaşır.
     Yalnızca geride olan rakibe uygulanır ve iki emniyet kemeri vardır:
       1) yaklaştıkça etki söner (oyuncuya ~1 araba boyu kala sıfır) ve rakip zaten geçecek durumdaysa itiş hiç verilmez,
       2) itişle kazanılan her metre borç yazılır; rakip borcunu ödemeden (o kadar yol arkada tutulmadan) oyuncuyu geçemez.
     Böylece sonuç değişmez, yalnızca fark kapanır; oyuncu son anda çarparsa rakip borcunu ödeyip doğal hızıyla geçebilir.
     Oyuncu gerideyse hiçbir yardım yok: araba yetersizse yarış kaybedilir. */
  bant: { normal: .16, son: .28, sonBaslangic: .70, sonmeNormal: 14, sonmeSon: 8, menzil: 55, pay: .35 },
  rakipAdlari: ["Turbo Tilki", "Şimşek Kaplan", "Rüzgâr Kuşu", "Hızlı Kirpi", "Mavi Bulut", "Kum Fırtınası", "Kar Leoparı", "Neon Panter",
    "Gece Kartalı", "Zıpzıp Tavşan", "Pırpır Kelebek", "Ateş Böceği", "Çılgın Kaplumbağa", "Gökkuşağı Atı", "Yıldız Tozu", "Fırtına Kedisi"]
};
function rastgeleUretec(tohum) {
  let a = tohum >>> 0;
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const karistirR = (dizi, rnd) => { const a = dizi.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const gucParca = P => { const l = Math.max(0, Math.min(5, (P - 20) / 16)); return { motor: l, lastik: l, aero: l, nitro: l }; };

function aracKur(parcalar, serit, x) {
  const o = arabaOzellik(parcalar);
  return { x, v: 0, seritF: serit, hedefSerit: serit, serit, parcalar: { ...parcalar },
    vmax: YARIS.BASE_HIZ * o.azamiHiz, ivme: YARIS.BASE_IVME * o.ivme, kayma: o.kayma, nitroSn: o.nitroSn,
    nitroSarj: 1, nitroKalan: 0, kayKalan: 0, sarsinti: 0, bitis: null, tekerAci: 0,
    ei: 0, ni: 0, di: 0, carpilan: new Set(), alinan: new Set(), kararlar: new Set(), carpma: 0 };
}
function yarisKur(kademeId, parcalar, tohum = (Date.now() ^ Math.floor(Math.random() * 1e9))) {
  const A = YARIS.ayar[kademeId], K = YARIS_KADEME.find(k => k.id === kademeId), rnd = rastgeleUretec(tohum);
  const vref = YARIS.BASE_HIZ * (1 + ETKI.hiz * Math.max(0, ((K.min + K.max) / 2 - 20) / 16));
  const L = Math.round(YARIS.SURE * vref / 10) * 10;
  const engeller = [], nitrolar = [], dalgalar = [];
  let x = 140;
  while (x < L - 70) {
    const bloklu = karistirR([0, 1, 2], rnd).slice(0, rnd() < A.ikili ? 2 : 1);
    dalgalar.push({ x, bloklu, bos: [0, 1, 2].filter(s => !bloklu.includes(s)) });
    bloklu.forEach(s => engeller.push({ x: x + (rnd() - .5) * 5, serit: s, tur: rnd() < A.yag ? "yag" : "koni" }));
    x += A.bosluk[0] + rnd() * (A.bosluk[1] - A.bosluk[0]);
  }
  engeller.sort((a, b) => a.x - b.x);
  for (let i = 1; i < dalgalar.length - 1; i += 3) nitrolar.push({ x: (dalgalar[i].x + dalgalar[i + 1].x) / 2, serit: Math.floor(rnd() * 3) });
  const guclar = [0, .5, 1].map(f => Math.round(Math.max(20, Math.min(100, K.min + (K.max - K.min) * f + (rnd() * 4 - 2)))));
  const oyuncu = aracKur(parcalar, 1, 0);
  const rakipler = [aracKur(gucParca(guclar[0]), 0, 0), aracKur(gucParca(guclar[1]), 2, 0), aracKur(gucParca(guclar[2]), 1, -26)];
  [oyuncu, ...rakipler].forEach(c => { c.rnd = rastgeleUretec(Math.floor(rnd() * 2147483647)); });   // her sürücünün kendi zar torbası
  rakipler.forEach((r, i) => {
    r.guc = guclar[i]; r.rakip = true;
    r.kacis = Math.max(.2, Math.min(.98, A.kacis + (rnd() - .5) * 2 * A.dagilim));   // kişilik: sakar ya da usta
    r.yakinlik = [0, .6, 1][Math.floor(rnd() * 3)];                                   // bu yarışta ne kadar "yapışkan" (bazen hiç)
  });
  oyuncu.oyuncu = true;
  return { kademe: kademeId, A, K, L, t: 0, engeller, nitrolar, dalgalar, oyuncu, rakipler, araclar: [oyuncu, ...rakipler], rnd, olaylar: [] };
}
function seritDegistir(c, yon) {
  if (c.kayKalan > 0) return false;
  const yeni = Math.max(0, Math.min(2, c.hedefSerit + yon));
  if (yeni === c.hedefSerit) return false;
  c.hedefSerit = yeni; return true;
}
function seriteGit(c, s) { if (c.kayKalan > 0 || s === c.hedefSerit) return false; c.hedefSerit = Math.max(0, Math.min(2, s)); return true; }
function nitroKullan(c) {
  if (c.nitroSarj <= 0 || c.nitroKalan > 0) return false;
  c.nitroSarj--; c.nitroKalan = c.nitroSn; return true;
}
// Rakip sürücü: yaklaşan engel dalgasını görünce çoğunlukla boş şeride geçer, nitroyu ara ara kullanır
function surucuKarar(st, c, dt, kacis, nitroSik) {
  const bakis = 22 + c.v * .55;
  while (c.di < st.dalgalar.length && st.dalgalar[c.di].x < c.x) c.di++;
  for (let i = c.di; i < st.dalgalar.length; i++) {
    const d = st.dalgalar[i];
    if (d.x - c.x > bakis) break;
    if (c.kararlar.has(i)) continue;
    c.kararlar.add(i);
    const zar = c.rnd || st.rnd;
    if (d.bloklu.includes(c.hedefSerit) && c.kayKalan <= 0 && zar() < kacis)
      c.hedefSerit = d.bos.slice().sort((a, b) => Math.abs(a - c.hedefSerit) - Math.abs(b - c.hedefSerit) || zar() - .5)[0];
  }
  if (nitroSik === "hemen") { if (c.kayKalan <= 0) nitroKullan(c); }
  else if (c.nitroSarj > 0 && c.nitroKalan <= 0 && c.kayKalan <= 0 && st.t > 2 && (c.rnd || st.rnd)() < dt * nitroSik) nitroKullan(c);
}
function yarisAdim(st, dt) {
  st.t += dt;
  for (const c of st.araclar) {
    if (c.rakip && c.bitis === null) surucuKarar(st, c, dt, c.kacis, st.A.nitro);
    // şerit değiştirme (yumuşak geçiş)
    const adim = dt / .17, fark = c.hedefSerit - c.seritF;
    c.seritF += Math.max(-adim, Math.min(adim, fark));
    c.serit = Math.round(c.seritF);
    // hız
    let hedef = c.vmax, a = c.ivme;
    if (c.nitroKalan > 0) { c.nitroKalan -= dt; hedef = c.vmax * 1.3; a = c.ivme * 2.2; }
    if (c.kayKalan > 0) { c.kayKalan -= dt; hedef *= .8; }
    let bant = 0;
    if (c.rakip && st.bant !== false) {
      bant = lastikBandi(st, c);
      if (bant > 0) { c.bantli = true; hedef *= 1 + bant; a *= 1 + bant; }
      else if (c.bantli && c.v > hedef) c.v = hedef;        // itiş bitince kazanılmış ivme de biter (süzülerek geçemez)
    }
    if (c.sarsinti > 0) c.sarsinti -= dt;
    if (c.v < hedef) c.v = Math.min(hedef, c.v + a * dt);
    else c.v = Math.max(hedef, c.v - (c.v - hedef) * Math.min(1, 1.6 * dt));
    c.x += c.v * dt; c.tekerAci += c.v * dt / 1.13;
    if (bant > 0) c.borc = (c.borc || 0) + c.v * dt * bant / (1 + bant);   // itişle kazanılan yol "borç" yazılır
    if (c.borc > 0 && st.oyuncu.bitis === null) {                          // borç bitmeden oyuncuyu geçemez: tutulduğu her metre borcu öder
      const sinir = st.oyuncu.x - YARIS.bant.sonmeSon * .6;
      if (c.x > sinir) { c.borc -= c.x - sinir; c.x = sinir; if (c.nitroKalan > 0) c.nitroKalan += dt; }   // tutulurken nitrosu boşa yanmaz
    }
    // engeller (x'e göre sıralı; araba yalnızca ileri gider)
    const arka = c.x - YARIS.ARABA_L * .72;
    while (c.ei < st.engeller.length && st.engeller[c.ei].x < arka) c.ei++;
    for (let i = c.ei; i < st.engeller.length; i++) {
      const e = st.engeller[i];
      if (e.x > c.x) break;
      if (c.carpilan.has(e) || Math.abs(c.seritF - e.serit) > .45) continue;
      c.carpilan.add(e); c.carpma++;
      if (e.tur === "koni") { c.v *= YARIS.KONI; c.sarsinti = .45; }
      else { c.v *= 1 - YARIS.YAG * c.kayma; c.kayKalan = .9 * c.kayma; }
      st.olaylar.push({ tur: e.tur, arac: c, engel: e });
    }
    while (c.ni < st.nitrolar.length && st.nitrolar[c.ni].x < arka) c.ni++;
    for (let i = c.ni; i < st.nitrolar.length; i++) {
      const n = st.nitrolar[i];
      if (n.x > c.x) break;
      if (c.alinan.has(n) || Math.abs(c.seritF - n.serit) > .45) continue;
      c.alinan.add(n);
      if (c.nitroSarj < 3) c.nitroSarj++;
      st.olaylar.push({ tur: "nitroAl", arac: c, engel: n });
    }
    if (c.bitis === null && c.x >= st.L) { c.bitis = st.t - (c.x - st.L) / Math.max(c.v, 1); st.olaylar.push({ tur: "bitis", arac: c }); }
  }
}
// Rakip kendi gücüyle oyuncuyu geçemeyecek durumda mı? (itişin öne geçirmesini önleyen emniyet)
function lastikBandiGeride(st, c) {
  const o = st.oyuncu;
  if (o.bitis !== null || c.bitis !== null) return false;
  const oyuncuSure = (st.L - o.x) / Math.max(o.v, 5), izinHiz = (st.L - c.x) / (oyuncuSure + YARIS.bant.pay);
  const dogal = c.nitroKalan > 0 ? c.vmax * 1.3 : c.vmax;
  return dogal < izinHiz;
}
// Geride kalan rakip için hız itişi (0 … bant.son). Ayrıntı: YARIS.bant açıklaması.
function lastikBandi(st, c) {
  const o = st.oyuncu, B = YARIS.bant;
  if (!c.yakinlik || o.bitis !== null || c.bitis !== null || o.x <= c.x) return 0;
  const ara = o.x - c.x, son = c.x / st.L > B.sonBaslangic;
  const sonme = son ? B.sonmeSon : B.sonmeNormal;
  const b = (son ? B.son : B.normal) * c.yakinlik * Math.max(0, Math.min(1, (ara - sonme) / B.menzil));
  if (b <= 0 || !lastikBandiGeride(st, c)) return 0;
  const oyuncuSure = (st.L - o.x) / Math.max(o.v, 5), izinHiz = (st.L - c.x) / (oyuncuSure + B.pay);
  const dogal = c.nitroKalan > 0 ? c.vmax * 1.3 : c.vmax;
  return Math.min(b, izinHiz / dogal - 1);
}
function yarisSiralama(st) {
  return st.araclar.map(c => ({ c, zaman: c.bitis !== null ? c.bitis : st.t + (st.L - c.x) / Math.max(c.v, 12) }))
    .sort((a, b) => a.zaman - b.zaman);
}
const anlikSira = st => 1 + st.rakipler.filter(r => r.bitis !== null ? (st.oyuncu.bitis === null || r.bitis < st.oyuncu.bitis) : (st.oyuncu.bitis === null && r.x > st.oyuncu.x)).length;
// Test ve denge ayarı için: oyuncuyu belirli bir beceriyle süren bot
function botYaris(kademeId, parcalar, beceri, tohum, bant = true) {
  const st = yarisKur(kademeId, parcalar, tohum); st.bant = bant;
  while (st.oyuncu.bitis === null && st.t < 150) { surucuKarar(st, st.oyuncu, 1 / 60, beceri, "hemen"); yarisAdim(st, 1 / 60); }
  const sira = yarisSiralama(st);
  const ben = sira.findIndex(s => s.c.oyuncu), komsu = sira[ben === 0 ? 1 : ben - 1];
  return { sira: ben + 1, sure: st.oyuncu.bitis, carpma: st.oyuncu.carpma, fark: Math.abs(komsu.zaman - sira[ben].zaman) };
}

const resimOnbellek = {};

  return resimOnbellek[src];
}
const yuvarlakParca = p => ({ motor: Math.round(p.motor), lastik: Math.round(p.lastik), aero: Math.round(p.aero), nitro: Math.round(p.nitro) });
// Bir arabanın 8 karesi (tekerler 45°'lik adımlarla döner)
// Resme çevirirken üstte 30 birim pay bırakılır; uzun araçların tavan süsleri kesilmez
const UST_PAY = 30, uzunSVG = svg => svg.replace(`viewBox="-24 0 ${ARABA_EN} 170"`, `viewBox="-24 -${UST_PAY} ${ARABA_EN} ${170 + UST_PAY}"`);

function rakipleriGiydir(st) {

  const oyuncuRenk = durum.garaj.arabalar[durum.garaj.secili].renk;

  const sec = (kat) => { const l = GORUNUM[kat].ogeler.filter(o => !o.ozel); return l[Math.floor(rnd() * l.length)].id; };
  st.rakipler.forEach((r, i) => {

                              cikartma: rnd() < .6 ? sec("cikartma") : "yok", jant: sec("jant"), tavan: rnd() < .3 ? sec("tavan") : "yok", egzoz: "yok" });

/* --- Başlat / kapat --- */
async function pistBaslat(el, kademeId) {
  const st = yarisKur(kademeId, { ...durum.garaj.parcalar });
  rakipleriGiydir(st);
  const cv = el.querySelector("#pistCanvas");
  pist = { el, cv, ctx: cv.getContext("2d"), st, durum: "hazirlik", kam: 0, parcaciklar: [], hizCizgi: [], son: 0, raf: 0,
           hud: {}, dinleyici: [], bitisZaman: 0, mesajlar: [] };
  pistOlcule();
  pistKontrolleri(el);
  ilerlemeKur(el);
  const [bg, ...kareler] = await Promise.all([
    resimYukle(GORSEL[st.A.pist]),
    arabaKareleri(durum.garaj.arabalar[durum.garaj.secili], String(durum.profil.avatar + 1), durum.garaj.parcalar, durum.profil.kask),
    ...st.rakipler.map(r => arabaKareleri(r.gorunum, r.numara, r.parcalar, r.kask, r.gomlek))
  ]);
  if (!pist || pist.st !== st) return;            // bu arada sahneden çıkıldıysa
  pist.bg = bg;
  st.araclar.forEach((c, i) => c.kareler = kareler[i]);
  el.querySelector("#yYukle").remove();
  pist.son = performance.now();
  pist.raf = requestAnimationFrame(pistDongu);
  geriSayim();
}
function pistKapat() {
  if (!pist) return;
  cancelAnimationFrame(pist.raf);
  pist.dinleyici.forEach(([hedef, ad, f, o]) => hedef.removeEventListener(ad, f, o));
  clearTimeout(pist.geriZaman);

}
function pistOlcule() {
  if (!pist) return;
  const P = pist, r = P.el.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  P.W = r.width; P.H = r.height; P.cv.width = Math.round(P.W * dpr); P.cv.height = Math.round(P.H * dpr);
  P.cv.style.width = P.W + "px"; P.cv.style.height = P.H + "px";
  P.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const He = Math.min(P.H, P.W * .5625);
  P.yolAlt = P.H - He * .015; P.yolUst = P.yolAlt - He * .29; P.seritH = (P.yolAlt - P.yolUst) / 3;
  P.ch = P.seritH * 1.42;

  P.oyuncuSX = P.W * .115 + P.cw;
  // Manzara: görselin zemin çizgisi (yüksekliğin %70'i) yolun hemen üstüne gelir. Görsel ekrandan geniş
  // tutulur ve yarış boyunca yalnızca bu fazlalık kadar kayar; böylece hiç ek yeri görünmez.
  const zemin = P.yolUst - He * .02, h0 = zemin / .7, w0 = h0 * 1600 / 900, olcek = Math.max(1.2, 1.2 * P.W / w0);

const seritY = (P, f) => P.yolUst + P.seritH * (f + .82);
