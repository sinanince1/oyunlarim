/* --- Kontroller: düğmeler, şeride dokunma, kaydırma, klavye --- */
function pistKontrolleri(el) {
  const P = pist, dinle = (hedef, ad, f, o) => { hedef.addEventListener(ad, f, o); P.dinleyici.push([hedef, ad, f, o]); };
  const oyunda = () => pist && pist.durum === "yaris";
  const yukari = () => { if (oyunda() && seritDegistir(P.st.oyuncu, -1)) Ses.serit(); };
  const asagi = () => { if (oyunda() && seritDegistir(P.st.oyuncu, 1)) Ses.serit(); };
  const nitro = () => { if (oyunda() && nitroKullan(P.st.oyuncu)) Ses.nitro(); else if (oyunda()) Ses.hata(); };
  const bas = (id, f) => dinle(el.querySelector(id), "pointerdown", e => { e.preventDefault(); e.stopPropagation(); f(); });
  bas("#yYukari", yukari); bas("#yAsagi", asagi); bas("#yNitro", nitro);
  bas("#yDur", () => pistDuraklat());
  let bas0 = null;
  dinle(P.cv, "pointerdown", e => { bas0 = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  dinle(P.cv, "pointerup", e => {
    if (!bas0 || !oyunda()) return;
    const dy = e.clientY - bas0.y, dx = e.clientX - bas0.x, r = P.cv.getBoundingClientRect();
    if (Math.abs(dy) > 28 && Math.abs(dy) > Math.abs(dx)) { (dy < 0 ? yukari : asagi)(); }
    else if (Math.abs(dy) < 14 && Math.abs(dx) < 14) {           // şeride dokunma
      const y = e.clientY - r.top;
      if (y > P.yolUst - P.seritH * .6) {
        const s = Math.max(0, Math.min(2, Math.floor((y - P.yolUst + P.seritH * .3) / P.seritH)));
        if (seriteGit(P.st.oyuncu, s)) Ses.serit();
      }
    }
    bas0 = null;
  });
  dinle(document, "keydown", e => {
    if (!pist) return;
    if (e.key === "Escape" || e.key === "p" || e.key === "P") { e.preventDefault(); return P.durum === "duraklat" ? pistDevam() : pistDuraklat(); }
    if (["ArrowUp", "w", "W"].includes(e.key)) { e.preventDefault(); yukari(); }
    else if (["ArrowDown", "s", "S"].includes(e.key)) { e.preventDefault(); asagi(); }

function pistDuraklat() {

  pencereAc(`<h2>⏸ Mola</h2><p class="onay-metin">Yarış durdu. Hazır olduğunda devam et!<br><small>Yarıştan çıkarsan harcadığın yakıt geri gelmez; baştan başlamak ücretsizdir.</small></p>
<div class="pencere-dugmeler"><button class="btn gri" data-eylem="pistCik">Yarıştan çık</button><button class="btn mavi" data-eylem="pistYeniden">↺ Baştan başla</button><button class="btn yesil" data-eylem="pistDevamEt">▶ Devam</button></div>`, "", { kapanmaz: true });

function geriSayim() {

    if (!pist || pist !== P) return;
    if (n > 0) {

      Ses.bip(false); if (n === 3) Ses.calistir(null, .6); n--; P.geriZaman = setTimeout(adim, 800);
    } else {

/* --- İlerleme çubuğu --- */
function ilerlemeKur(el) {

  yol.innerHTML = pist.st.araclar.map((c, i) => c.oyuncu
    ? `<span class="y-isaret oyuncu" data-i="${i}">${avatarSVG(durum.profil.avatar)}</span>`
    : `<span class="y-isaret" data-i="${i}" style="background:${c.gorunum ? c.gorunum.renk : "#999"}"></span>`).join("") + `<span class="y-bayrak">🏁</span>`;

}
function hudGuncelle() {
  const P = pist, st = P.st, o = st.oyuncu, H = P.hud;
  const sira = anlikSira(st), hiz = Math.round(o.v * 3.6), sarj = o.nitroSarj + (o.nitroKalan > 0 ? "a" : "");
  if (H.sira !== sira) { H.sira = sira; P.el.querySelector("#ySira").textContent = sira + "."; }
  if (H.hiz !== hiz) { H.hiz = hiz; P.el.querySelector("#yHiz").textContent = hiz; }
  if (H.sarj !== sarj) {

    const b = P.el.querySelector("#yNitro");

}

/* --- Ana döngü --- */
function pistDongu(simdi) {
  const P = pist; if (!P) return;
  P.raf = requestAnimationFrame(pistDongu);
  const dt = Math.min(.05, (simdi - P.son) / 1000); P.son = simdi;
  const st = P.st;
  if (P.durum === "yaris" || P.durum === "bitti") {
    yarisAdim(st, dt);
    olaylariIsle();
    Ses.motorAyarla(st.oyuncu.v / YARIS.BASE_HIZ, st.oyuncu.nitroKalan > 0);
    if (P.durum === "yaris" && st.oyuncu.bitis !== null) yarisBitti();
    if (P.durum === "bitti" && simdi - P.bitisZaman > 1900) { P.durum = "sonuc"; yarisSonucunaGit(); return; }
  }
  P.kam += (st.oyuncu.x - P.kam) * Math.min(1, dt * 12);
  if (P.durum === "hazirlik") P.kam = st.oyuncu.x;
  pistCiz(dt);
  hudGuncelle();
}
function olaylariIsle() {
  const P = pist, st = P.st;
  for (const ol of st.olaylar) {
    const o = ol.arac.oyuncu;
    if (ol.tur === "koni") {
      P.parcaciklar.push({ tur: "koni", x: ol.engel.x, f: ol.engel.serit, vx: ol.arac.v * 1.15, y: 0, vy: -9, a: 0, va: 9, t: 0 });
      ol.engel.ucuyor = true;
      if (o) { Ses.carp(); mesaj("Bom! Koniye çarptın", "#FF6B35"); }
    } else if (ol.tur === "yag") {
      if (o) { Ses.kay(); mesaj(ol.arac.kayma < .6 ? "Lastiklerin yağda tutundu!" : "Yağda kaydın!", "#1F2340"); }
    } else if (ol.tur === "nitroAl" && o) {
      ol.engel.alindi = true; Ses.al(); mesaj("+1 NİTRO", "#3B82F6");
    } else if (ol.tur === "bitis" && !o) {
      ol.arac.bitti = true;
    }
  }
  st.olaylar.length = 0;
}
function mesaj(yazi, renk) { pist.mesajlar.push({ yazi, renk, t: 0 }); if (pist.mesajlar.length > 3) pist.mesajlar.shift(); }
function yarisBitti() {
  const P = pist; P.durum = "bitti"; P.bitisZaman = performance.now();
  const sira = yarisSiralama(P.st).findIndex(s => s.c.oyuncu) + 1;
  Ses.motorDur(); Ses.bitis(sira === 1);
  for (let i = 0; i < 70; i++) P.parcaciklar.push({ tur: "konfeti", sx: P.oyuncuSX + (Math.random() - .3) * P.W * .5, sy: -10 - Math.random() * P.H * .3,
    vx: (Math.random() - .5) * 120, vy: 120 + Math.random() * 160, a: Math.random() * 6, va: (Math.random() - .5) * 12, renk: ["#FFD600", "#FF4D8D", "#4D9FFF", "#00C9A7", "#FF6B35", "#A855F7"][i % 6], t: 0 });
  P.el.querySelector("#yGeri").innerHTML = `<b class="bitis-yazi">${sira === 1 ? "🏆 BİRİNCİ!" : sira + ". oldun!"}</b>`;
}
function yarisSonucunaGit() {
  const st = pist.st;
  // rakipler bitirene kadar beklemeden kalan süreyi tahmin ederek sıralar
  const siralama = yarisSiralama(st).map(s => ({ oyuncu: !!s.c.oyuncu, ad: s.c.oyuncu ? durum.profil.ad : s.c.ad, renk: s.c.gorunum ? s.c.gorunum.renk : durum.garaj.arabalar[durum.garaj.secili].renk,
    guc: s.c.oyuncu ? guc() : s.c.guc, zaman: s.zaman, carpma: s.c.carpma }));
  git("yarisSonuc", { kademe: st.kademe, siralama, odul: yarisOdulleri(st.kademe, siralama) });
}

/* --- Çizim --- */
function pistCiz(dt) {
  const P = pist, ctx = P.ctx, st = P.st, W = P.W, H = P.H;
  const wx = x => P.oyuncuSX + (x - P.kam) * P.pxm;          // dünya → ekran
  ctx.clearRect(0, 0, W, H);
  // 1) gökyüzü ve manzara (yavaş kayar, aynalanarak döşenir)
  if (P.bg) {
    const ilerle = Math.max(0, Math.min(1, P.kam / st.L));
    ctx.drawImage(P.bg, -ilerle * (P.bgW - W), P.bgY, P.bgW, P.bgH);
    if (P.bgY + P.bgH < H) { ctx.fillStyle = "#6B7280"; ctx.fillRect(0, P.bgY + P.bgH, W, H - P.bgY - P.bgH); }
  } else { ctx.fillStyle = "#7EC8F2"; ctx.fillRect(0, 0, W, H); }

  ctx.fillStyle = g; ctx.fillRect(0, P.yolUst, W, P.yolAlt - P.yolUst);
  const bordur = (y, h) => { const L = 9, b0 = Math.floor((P.kam - P.oyuncuSX / P.pxm) / L);
    for (let k = b0; wx(k * L) < W; k++) { ctx.fillStyle = (k % 2 + 2) % 2 ? "#fff" : "#EF4444"; ctx.fillRect(wx(k * L), y, L * P.pxm + 1, h); } };
  bordur(P.yolUst - sh * .1, sh * .14); bordur(P.yolAlt - sh * .06, sh * .1);
  ctx.strokeStyle = "rgba(255,255,255,.75)"; ctx.lineWidth = Math.max(2, sh * .05); ctx.setLineDash([8 * P.pxm, 6 * P.pxm]);
  ctx.lineDashOffset = (P.kam * P.pxm) % (14 * P.pxm);

    if (bitis) { // bayrak direği
      ctx.fillStyle = "#E5E7EB"; ctx.fillRect(sx - 3, P.yolUst - sh * 2.2, 6, sh * 2.2);
      for (let r = 0; r < 3; r++) for (let c = 0; c < 5; c++) { ctx.fillStyle = (r + c) % 2 ? "#1F2340" : "#fff"; ctx.fillRect(sx + 3 + c * sh * .18, P.yolUst - sh * 2.2 + r * sh * .18, sh * .18, sh * .18); }
    }

      if (e.serit !== s || e.ucuyor) continue;

      if (e.tur === "koni") koniCiz(ctx, sx, yb, sh * .62 * k); else yagCiz(ctx, sx, yb, sh, k, P.pxm);
    }
    for (const n of st.nitrolar) {

      const sx = wx(n.x); if (sx < -60 || sx > W + 60) continue;
      nitroSiseCiz(ctx, sx, yb - sh * .2 + Math.sin(zaman * 4 + n.x) * sh * .06, sh * .62 * k, zaman);
    }
    for (const c of [...st.rakipler, st.oyuncu]) {
      if (Math.round(c.seritF) !== s) continue;
      const sx = wx(c.x); if (sx < -P.cw * 1.2 || sx > W + P.cw * 1.2) continue;
      const ust = !c.oyuncu && Math.abs(c.seritF - st.oyuncu.seritF) < .6 && Math.abs(c.x - st.oyuncu.x) < YARIS.ARABA_L;
      ctx.globalAlpha = ust ? .5 : 1;
      arabaCiz(ctx, c, sx, seritY(P, c.seritF), P.ch * seritOlcek(c.seritF), zaman, st.t, ust);
      ctx.globalAlpha = 1;
    }
  }
  // 6) sağ kenarda yaklaşan engel uyarısı
  const ileri = st.oyuncu.v * P.pxm * 1.1;
  const uyar = (x, s, renk, isaret) => {
    const sx = wx(x); if (sx <= W - 4 || sx > W + ileri) return;
    const a = 1 - (sx - W) / ileri, y = seritY(P, s) - sh * .45, r = sh * .26;
    ctx.globalAlpha = .35 + .65 * a; ctx.fillStyle = renk;
    ctx.beginPath(); ctx.moveTo(W - 6, y); ctx.lineTo(W - 6 - r * 1.5, y - r); ctx.lineTo(W - 6 - r * 1.5, y + r); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = `900 ${r * 1.1}px "Nunito Variable",Nunito,sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(isaret, W - 6 - r * .95, y + 1); ctx.globalAlpha = 1;
  };
  st.engeller.forEach(e => uyar(e.x, e.serit, e.tur === "koni" ? "#FF6B35" : "#1F2340", "!"));
  st.nitrolar.forEach(n => { if (!n.alindi) uyar(n.x, n.serit, "#3B82F6", "N"); });
  // 7) nitro hız çizgileri
  if (st.oyuncu.nitroKalan > 0 && Math.random() < .8) P.hizCizgi.push({ x: W + 20, y: Math.random() * P.yolAlt, l: 60 + Math.random() * 140, v: 2200 + Math.random() * 1200 });
  ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 2;
  P.hizCizgi = P.hizCizgi.filter(c => { c.x -= c.v * dt; ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(c.x + c.l, c.y); ctx.stroke(); return c.x + c.l > 0; });

    p.t += dt;

/* --- İlerleme kodu: kayıt sıkıştırılır (varsa), base64 olarak verilir, sağlama toplamıyla korunur --- */
let kodBekleyen = null, baslikDokunus = [];
const b64url = bayt => { let s = ""; bayt.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
const b64coz = t => { const s = atob(t.replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(s, c => c.charCodeAt(0)); };

async function akis(bayt, tur, sikistir) {
  const s = new Blob([bayt]).stream().pipeThrough(sikistir ? new CompressionStream(tur) : new DecompressionStream(tur));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function ilerlemeKodu() {
  const { ayarlar, ogretmen, ipucu, ...tasinan } = durum;
  const ham = new TextEncoder().encode(JSON.stringify(tasinan));
  let govde, surum;
  try { govde = b64url(await akis(ham, "deflate-raw", true)); surum = "OR1"; } catch (e) { govde = b64url(ham); surum = "OR0"; }
  return `${surum}.${govde}.${saglama(govde)}`;
}
async function ilerlemeCoz(kod) {
  try {
    const [surum, govde, s] = String(kod).replace(/\s+/g, "").split(".");
    if (!govde || saglama(govde) !== s || !["OR0", "OR1"].includes(surum)) return null;
    const bayt = surum === "OR1" ? await akis(b64coz(govde), "deflate-raw", false) : b64coz(govde);
    const veri = JSON.parse(new TextDecoder().decode(bayt));
    if (!veri || !veri.profil || !veri.garaj) return null;
    const d = birlestir(yeniDurum(), veri);
    d.garaj.arabalar = d.garaj.arabalar.map(arabaNormal); d.ipucu.garaj = true;
    if (d.garaj.secili >= d.garaj.arabalar.length) d.garaj.secili = 0;
    if (!d.ayarlar.muzikDokundu) d.ayarlar.muzikSes = 25;      // oyuncu ayarlamadıysa müzik %25 ile başlar

const Okuyucu = {
  okuyor: false, ses: null,
  bul() { try { const v = speechSynthesis.getVoices(); this.ses = v.find(x => /^tr([-_]|$)/i.test(x.lang)) || null; } catch (e) { this.ses = null; } return this.ses; },
  destek() { return "speechSynthesis" in window && !!(this.ses || this.bul()); },
  oku(m, cumlede, bitince) {
    this.dur(); this.okuyor = true;
    let i = 0;
    const sonraki = () => {
      if (!this.okuyor) return;
      if (i >= m.cumleler.length) { this.okuyor = false; return bitince && bitince(); }
      const u = new SpeechSynthesisUtterance(m.cumleler[i].replace(/^([^:]{1,24}):\s/, "$1 diyor ki: "));
      this.hazirla(u);
      const no = i++;
      u.onstart = () => cumlede && cumlede(no);
      u.onend = sonraki; u.onerror = () => { this.okuyor = false; bitince && bitince(); };
      speechSynthesis.speak(u);
    };
    if (m.baslik) { const u = new SpeechSynthesisUtterance(m.baslik); this.hazirla(u); u.onend = sonraki; u.onerror = () => sonraki(); speechSynthesis.speak(u); } else sonraki();
  },
  hazirla(u) { u.lang = "tr-TR"; u.rate = .88; try { if (this.ses) u.voice = this.ses; } catch (e) {} },
  dur() { this.okuyor = false; try { speechSynthesis.cancel(); } catch (e) {} }
};

const Eylemler = {
  basla()   { git("kayit"); },
  devam()   { git(profilVar() ? "garaj" : "kayit"); },
  garajaDon() { git("garaj"); },
  ac(el) {
    const h = el.dataset.hedef;
    if (h === "okumaPisti") git("harita"); else if (h === "atolye") git("atolye"); else if (h === "showroom") git("showroom");
    else if (h === "yaris") git("yarisSec");
    else git("yakinda", { hedef: h });
  },

  /* --- Yarış --- */
  yarisBasla(el) {
    const k = el.dataset.k;
    if (!kademeAcik(k)) return;
    if (durum.yakit <= 0) {
      Ses.hata();
      return pencereAc(`<h2>⛽ Yakıtın bitti!</h2><p class="onay-metin">Her yarış 1 yakıt harcar. Okuma Pisti'nde yeni bir metin bitirirsen ⛽ ${ODUL.yakit} yakıt kazanırsın.</p>
<div class="pencere-dugmeler"><button class="btn gri" data-eylem="pencereKapat">Tamam</button><button class="btn" data-eylem="ac" data-hedef="okumaPisti">📖 Okuma Pisti</button></div>`);
    }
    durum.yakit--; kaydet();
    git("pist", { kademe: k });
  },
  pistDevamEt()  { pistDevam(); },
  pistYeniden()  { const k = pist.st.kademe; pencereKapat(); git("pist", { kademe: k }); },
  pistCik()      { pencereKapat(); git("yarisSec"); },

  /* --- Araçlar Galerisi --- */
  salonGez(el)   { salonGit(+el.dataset.y); },
  galeriYenile()  { galeriYukle(true); },
  sergiAc(el) {
    if (Date.now() - salonKaydi < 400) return;          // kaydırma bitişindeki dokunuş ayrıntı açmasın
    const s = el.dataset.id === "benim" ? benimSergi() : sergiBul(el.dataset.id); if (!s) return;
    yonetimOnay = null; sergiPencere(s);
  },
  async galeriTepki(el) {
    const s = sergiBul(el.dataset.id), e = +el.dataset.e; if (!s || el.dataset.bekle) return;
    el.dataset.bekle = "1";
    try {
      const j = await galeriIstek("/tepki", { veri: { id: s.id, e } });
      s.t = j.t; s.verdim = s.verdim || [false, false, false]; s.verdim[e] = j.verdi;
      if (j.verdi) Ses.al(); else Ses.tik();
      document.querySelectorAll(`.tepki[data-id="${CSS.escape(s.id)}"][data-e="${e}"]`).forEach(b => {
        b.classList.toggle("verdi", j.verdi); b.querySelector("small").textContent = j.t[e];
        if (j.verdi) { b.classList.remove("zipla"); void b.offsetWidth; b.classList.add("zipla"); }
      });
    } catch (h) { Ses.hata(); bildirim(galeriHataMetni(h)); }
    delete el.dataset.bekle;
  },
  sergileAc() {
    if (!galeriAcik()) { Ses.hata(); return bildirim("🏗️ " + GALERI_HATA.kapali); }
    const i = durum.garaj.secili, g = durum.galeri, sergide = !!g.id;
    const ad = g.sahip || galeriAd(String(durum.profil.ad).split(/\s+/)[0]) || "";
    const arac = galeriAracAdi(durum.garaj.arabalar[i].ad) || (ad && galeriAracAdi(ilgiEki(ad) + " Arabası")) || "";
    pencereAc(`<h2>🏛️ ${sergide ? "Galerideki arabanı güncelle" : "Galeride sergile"}</h2>
<div class="sergile-onizleme">${arabaSVG(durum.garaj.arabalar[i], String(durum.profil.avatar + 1))}</div>
<p class="onay-metin" style="margin:.2em 0 .6em">Arabanı oyunu oynayan <b>herkes</b> görecek. Yarış araban galeride hep senin araban olarak durur; Atölye'de değiştirdiklerin galeriye de yansır.</p>
<div class="sergile-form">
  <label>Adın <small>(soyadını yazma)</small><input id="sgAd" class="ad-kutu" maxlength="12" autocomplete="off" value="${esc(ad)}" placeholder="Ela"></label>
  <label>Sınıfın<input id="sgSinif" class="ad-kutu" maxlength="4" autocomplete="off" value="${esc(g.sinif || "")}" placeholder="2-A"></label>
  <label>Arabanın adı<input id="sgArac" class="ad-kutu" maxlength="16" autocomplete="off" value="${esc(arac)}" placeholder="Pembe Roket"></label>
</div>
<p class="uyari" id="sgUyari"></p>
<div class="pencere-dugmeler">${sergide ? `<button class="btn kirmizi kucuk" data-eylem="sergiKaldirSor">Göstermeyi bırak</button>` : ""}
<button class="btn gri" data-eylem="pencereKapat">Vazgeç</button><button class="btn yesil" data-eylem="sergileGonder" id="sgGonder">🏛️ ${sergide ? "Güncelle" : "Sergile"}</button></div>`);
    document.querySelectorAll(".sergile-form input").forEach(k => k.addEventListener("keydown", e => { if (e.key === "Enter") Eylemler.sergileGonder(); }));
  },
  async sergileGonder() {
    const uy = document.getElementById("sgUyari"), btn = document.getElementById("sgGonder"); if (!uy || btn.disabled) return;
    const alanlar = { sahip: "sgAd", sinif: "sgSinif", aracAdi: "sgArac" };
    document.querySelectorAll(".sergile-form input").forEach(k => k.classList.remove("hatali"));
    const yanlis = (alan, metin) => { uy.textContent = metin; const k = document.getElementById(alanlar[alan]); if (k) { k.classList.add("hatali"); k.focus(); } Ses.hata(); };
    const sahip = galeriAd($v("sgAd")), sinif = galeriSinif($v("sgSinif")), aracAdi = galeriAracAdi($v("sgArac"));
    if (!sahip) return yanlis("sahip", /\s/.test($v("sgAd").trim()) ? "Sadece adını yaz, soyadını yazma." : "Adını yaz (2–12 harf, sadece harf).");
    if (!sinif) return yanlis("sinif", "Sınıfını yaz, örneğin 2-A.");
    if (!aracAdi) return yanlis("aracAdi", "Arabana 2–16 harflik bir ad ver.");
    btn.disabled = true; btn.textContent = "Gönderiliyor...";
    try {
      const yuk = { sahip, sinif, aracAdi, veri: benimVerim() };
      const j = await galeriIstek("/sergi", { veri: yuk });
      durum.garaj.arabalar[durum.garaj.secili].ad = aracAdi.slice(0, 16);
      Object.assign(durum.galeri, { id: j.id, sahip, sinif, aracAdi, son: JSON.stringify(yuk) }); kaydet();
      pencereKapat(); Ses.kupa(); bildirim(j.gizli ? "🏛️ Güncellendi. Öğretmenin bu sergiyi şimdilik gizlemiş." : "🏛️ Araban galeride! Herkes görebilir.");
      salonIdx = 0; galeriYukle(true);
    } catch (h) {
      btn.disabled = false; btn.textContent = "🏛️ Tekrar dene";
      if (h && h.hata === "uygunsuz") return yanlis(h.alan, h.alan === "sahip" ? "Bu ad kullanılamaz. Kendi adını yaz." : "Bu araba adı uygun değil. Başka bir ad yaz.");
      if (h && h.hata === "bicim" && alanlar[h.alan]) return yanlis(h.alan, "Bu alanı kontrol et.");
      uy.textContent = galeriHataMetni(h); Ses.hata();
    }
  },
  async yonKodKopyala(el) {
    const s = sergiBul(el.dataset.id); if (!s) return;
    const metin = `Okuma Rallisi araba kodu: ${s.id} · ${s.aracAdi} · ${s.sahip} ${s.sinif}`;
    try { await navigator.clipboard.writeText(metin); bildirim("📋 Araba kodu kopyalandı: " + s.id); }
    catch (e) {
      const t = document.createElement("textarea"); t.value = metin; t.style.position = "fixed"; t.style.opacity = "0"; document.body.appendChild(t); t.select();
      let ok = false; try { ok = document.execCommand("copy"); } catch (e2) {} t.remove();
      bildirim(ok ? "📋 Araba kodu kopyalandı: " + s.id : "Kod: " + s.id);
    }
  },
  yonEngelleSor(el) {
    const s = sergiBul(el.dataset.id); if (!s) return;
    pencereAc(`<h2>⛔ Kullanıcıyı engelle</h2><p class="onay-metin"><b>${esc(s.aracAdi)}</b> · ${esc(s.sahip)} ${esc(s.sinif)}<br>Bu araba galeriden silinir ve bu cihaz bir daha galeriye araba ekleyemez.<br><small>Engeli sonra Ayarlar → Engellenenler'den kaldırabilirsin.</small></p>
<div class="pencere-dugmeler"><button class="btn gri" data-eylem="sergiAc" data-id="${esc(s.id)}">Vazgeç</button><button class="btn kirmizi" data-eylem="yonEngelle" data-id="${esc(s.id)}">⛔ Engelle</button></div>`);
  },
  async yonEngelle(el) {
    const id = el.dataset.id; el.disabled = true;
    try {
      await galeriIstek("/yonetici/engelle", { yonetici: true, veri: { id } });
      gal.liste = gal.liste.filter(x => x.id !== id); delete gal.ekstra[id]; gal.toplam = Math.max(0, gal.toplam - 1);
      pencereKapat(); salonCiz(); bildirim("⛔ Kullanıcı engellendi, arabası galeriden kaldırıldı.");
    } catch (h) { el.disabled = false; Ses.hata(); bildirim(galeriHataMetni(h)); }
  },
  async engellerAc() {
    pencereAc(`<h2>⛔ Engellenenler</h2><p class="onay-metin">Bu cihazlar galeriye araba ekleyemez.</p><div id="engelListe" class="engel-liste">Yükleniyor...</div>
<div class="pencere-dugmeler" style="margin-top:.6em"><button class="btn gri" data-eylem="ayarlar">◀ Geri</button></div>`, "genis");
    try {
      const l = (await galeriIstek("/yonetici/engeller", { yonetici: true })).liste, k = document.getElementById("engelListe");
      k.innerHTML = l.length ? `<ul class="tekrar-liste">${l.map(e => `<li><button class="btn yesil kucuk" data-eylem="engelKaldir" data-k="${esc(e.kod)}">Engeli kaldır</button> <b>${esc(e.aracAdi || "")}</b> · ${esc(e.sahip || "")} ${esc(e.sinif || "")} <small>${new Date(e.zaman).toLocaleDateString("tr-TR")}</small></li>`).join("")}</ul>` : `<p class="alt-not">Engellenen kimse yok.</p>`;
    } catch (h) { document.getElementById("engelListe").textContent = galeriHataMetni(h); }
  },
  async engelKaldir(el) {
    try { await galeriIstek("/yonetici/engel-kaldir", { yonetici: true, veri: { kod: el.dataset.k } }); bildirim("Engel kaldırıldı."); Eylemler.engellerAc(); }
    catch (h) { Ses.hata(); bildirim(galeriHataMetni(h)); }
  },
  sergiKaldirSor() {
    pencereAc(`<h2>🏛️ Galeride göstermeyi bırak</h2><p class="onay-metin">Emin misin? Araban galeriden kalkar ve aldığı beğeniler silinir.<br>İstediğin zaman yeniden sergileyebilirsin.</p>
<div class="pencere-dugmeler"><button class="btn gri" data-eylem="pencereKapat">Vazgeç</button><button class="btn kirmizi" data-eylem="sergiKaldir">Evet, göstermeyi bırak</button></div>`);
  },
  async sergiKaldir(el) {
    if (el) el.disabled = true;
    try {
      await galeriIstek("/sergi/kaldir", { veri: {} });
      durum.galeri.id = ""; durum.galeri.son = ""; kaydet(); pencereKapat(); bildirim("Araban artık galeride görünmüyor.");
      gal.benim = null;
      if (aktifAd === "showroom") galeriYukle(true); else if (aktifAd === "atolye") atolyeYenile(false);
    } catch (h) { if (el) el.disabled = false; Ses.hata(); bildirim(galeriHataMetni(h)); }
  },


  /* --- Galeri yöneticisi (Ayarlar → öğretmen ayarları) --- */
  yoneticiAc() {
    pencereAc(`<h2>🛡️ Yönetici girişi</h2><p class="onay-metin">Öğretmen şifresini yaz.</p>
<div style="text-align:center"><input id="yonSifre" class="ad-kutu" type="password" inputmode="numeric" autocomplete="off" maxlength="64"></div><p class="uyari" id="yonUyari" style="text-align:center"></p>
<div class="pencere-dugmeler"><button class="btn gri" data-eylem="ayarlar">◀ Geri</button><button class="btn yesil" data-eylem="yoneticiGiris">Giriş</button></div>`);
    const k = document.getElementById("yonSifre"); k.addEventListener("keydown", e => { if (e.key === "Enter") Eylemler.yoneticiGiris(); }); k.focus();
  },
  async yoneticiGiris() {
    const s = $v("yonSifre").trim(), uy = document.getElementById("yonUyari"); if (!s) return;
    let dogru = false;
    try { dogru = (await sifreOzet(s)) === YONETICI_OZET; } catch (e) {}
    if (!dogru) { uy.textContent = "Şifre yanlış."; Ses.hata(); document.getElementById("yonSifre").select(); return; }
    yoneticiModu = true; galeriYonetici = "";
    if (galeriAcik()) { galeriYonetici = s; try { await galeriIstek("/yonetici/giris", { yonetici: true }); } catch (h) { galeriYonetici = ""; } }
    try { sessionStorage.setItem("okumaRallisi_yonetici", "1"); sessionStorage.setItem("okumaRallisi_yoneticiS", galeriYonetici); } catch (e) {}
    gal.liste = []; Ses.onay(); bildirim("🛡️ Yönetici modu açıldı"); pencereAc(ayarlarIcerik()); yonetimSahneYenile();
  },
  yoneticiCikis() {
    yoneticiModu = false; galeriYonetici = ""; gal.liste = [];
    try { sessionStorage.removeItem("okumaRallisi_yonetici"); sessionStorage.removeItem("okumaRallisi_yoneticiS"); } catch (e) {}
    bildirim("Yönetici modu kapandı"); pencereAc(ayarlarIcerik()); yonetimSahneYenile();
  },
  async yonKaydet(el) {
    const uy = document.getElementById("yonUyari");
    try {
      const j = await galeriIstek("/yonetici/duzenle", { yonetici: true, veri: { id: el.dataset.id, sahip: $v("yonSahip"), sinif: $v("yonSinif"), aracAdi: $v("yonArac") } });
      sergiGuncelle(j.sergi); Ses.onay(); bildirim("💾 Kaydedildi");
    } catch (h) { uy.textContent = h && h.hata === "bicim" ? "Bu alanı kontrol et: " + ({ sahip: "Sahibi", sinif: "Sınıf", aracAdi: "Araç adı" }[h.alan] || "") : galeriHataMetni(h); Ses.hata(); }
  },
  async yonGizle(el) {
    const s = sergiBul(el.dataset.id); if (!s) return;
    try { const j = await galeriIstek("/yonetici/duzenle", { yonetici: true, veri: { id: s.id, gizli: !s.gizli } }); sergiGuncelle(j.sergi); bildirim(j.sergi.gizli ? "🙈 Gizlendi" : "👀 Yeniden görünüyor"); }
    catch (h) { Ses.hata(); bildirim(galeriHataMetni(h)); }
  },
  async yonSil(el) {
    const id = el.dataset.id;
    if (yonetimOnay !== "sil:" + id) { yonetimOnay = "sil:" + id; el.textContent = "Emin misin? Sil"; return; }
    yonetimOnay = null;
    try { await galeriIstek("/yonetici/sil", { yonetici: true, veri: { id } }); gal.liste = gal.liste.filter(s => s.id !== id); gal.toplam = Math.max(0, gal.toplam - 1); pencereKapat(); salonCiz(); bildirim("🗑️ Silindi"); }
    catch (h) { Ses.hata(); bildirim(galeriHataMetni(h)); }
  },
  async kelimelerAc() {
    pencereAc(`<h2>🚫 Yasaklı kelimeler</h2><p class="onay-metin">Türkçe küfür ve hakaretlerin hazır listesi (<span id="hazirSay">yüzlerce yazım</span>) sunucuda her zaman açık. Buraya eklediklerin ona eklenir. <b>Parça</b>: kelimenin içinde geçerse engellenir. <b>Tam</b>: yalnızca tek başına yazılırsa.</p>
<div class="kelime-ekle"><input id="kelimeKutu" class="ad-kutu" maxlength="24" autocomplete="off" placeholder="kelime"><select id="kelimeTur" class="ad-kutu"><option value="parca">Parça</option><option value="tam">Tam</option></select><button class="btn yesil kucuk" data-eylem="kelimeEkle">Ekle</button></div>
<div id="kelimeListe" class="kelime-liste">Yükleniyor...</div>
<div id="taramaSonuc"></div>
<div class="pencere-dugmeler" style="margin-top:.6em"><button class="btn gri" data-eylem="ayarlar">◀ Geri</button><button class="btn mavi" data-eylem="yonTara">🔎 Galeriyi tara</button></div>`, "genis");
    try { const j = await galeriIstek("/yonetici/kelimeler", { yonetici: true }); kelimeListesiCiz(j.liste); if (j.hazir) document.getElementById("hazirSay").textContent = j.hazir + " kelime ve yazım"; }
    catch (h) { document.getElementById("kelimeListe").textContent = galeriHataMetni(h); }
  },
  async kelimeEkle() {
    const k = $v("kelimeKutu").trim(); if (k.length < 2) return;
    try { kelimeListesiCiz((await galeriIstek("/yonetici/kelime", { yonetici: true, veri: { kelime: k, tur: document.getElementById("kelimeTur").value } })).liste); document.getElementById("kelimeKutu").value = ""; }
    catch (h) { Ses.hata(); bildirim(galeriHataMetni(h)); }
  },
  async kelimeSil(el) {
    try { kelimeListesiCiz((await galeriIstek("/yonetici/kelime", { yonetici: true, veri: { kelime: el.dataset.k, sil: true } })).liste); }
    catch (h) { Ses.hata(); bildirim(galeriHataMetni(h)); }
  },
  async yonTara() {
    const kutu = document.getElementById("taramaSonuc"); kutu.innerHTML = `<p class="alt-not">Taranıyor...</p>`;
    try {
      const l = (await galeriIstek("/yonetici/tara", { yonetici: true })).liste;
      for (const s of l) gal.ekstra[s.id] = s;
      kutu.innerHTML = l.length ? `<p class="alt-not">Filtreye takılan ${l.length} sergi:</p><ul class="tekrar-liste">${l.map(s => `<li><button class="btn mor kucuk" data-eylem="sergiAc" data-id="${esc(s.id)}">Aç</button> ${esc(s.aracAdi)} · ${esc(s.sahip)} ${esc(s.sinif)}${s.gizli ? " 🙈" : ""}</li>`).join("")}</ul>`
        : `<p class="alt-not">✓ Filtreye takılan sergi yok.</p>`;
    } catch (h) { kutu.innerHTML = `<p class="uyari">${galeriHataMetni(h)}</p>`; }
  },

  /* --- Arabalarım (galerinin ilk sekmesi) --- */
  showGez(el) {                               // Atölye → Arabalarım: yarış arabasını değiştir
    const n = durum.garaj.arabalar.length; if (n < 2) return;
    durum.garaj.secili = (durum.garaj.secili + (+el.dataset.y) + n) % n; showSira = durum.garaj.secili; kaydet();
    deneme = null; Ses.calistir(); arabaParla(); atolyeYenile(false);
  },
  arabaAdiAc() {
    const a = durum.garaj.arabalar[showSira];
    showSira = durum.garaj.secili;
    pencereAc(`<h2>Arabanın adı</h2><p class="onay-metin">Arabana bir ad ver. Araçlar Galerisi'nde ve Araba Kartı'nda görünecek.</p>
<div style="text-align:center"><input id="arabaAdKutu" class="ad-kutu" maxlength="16" autocomplete="off" value="${esc(a.ad || "")}" placeholder="${esc(arabaAdi(showSira))}"></div>
<div class="pencere-dugmeler" style="margin-top:1em"><button class="btn gri" data-eylem="pencereKapat">Vazgeç</button><button class="btn yesil" data-eylem="arabaAdiKaydet">Kaydet</button></div>`);
    const k = document.getElementById("arabaAdKutu");
    k.addEventListener("keydown", e => { if (e.key === "Enter") Eylemler.arabaAdiKaydet(); });
    if (window.matchMedia("(pointer:fine)").matches) k.focus();
  },
  arabaAdiKaydet() {
    const k = document.getElementById("arabaAdKutu"); if (!k) return;
    durum.garaj.arabalar[showSira].ad = k.value.trim().replace(/\s+/g, " ").slice(0, 16); kaydet();
    pencereKapat(); atolyeYenile(false);
  },
  yeniArabaAc() {
    const fiyat = yeriFiyat(), yeter = durum.jeton >= fiyat;
    pencereAc(`<h2>Yeni araba</h2><p class="onay-metin">Garajına ${durum.garaj.yerSayisi + 1}. arabayı ekle! Parçaların bu arabaya da takılır; görünümünü Atölye'de istediğin gibi süsleyebilirsin.<br><b>Fiyatı: 🪙 ${fiyat}</b>${yeter ? "" : `<br>${fiyat - durum.jeton} jeton daha biriktirmelisin.`}</p>
<div class="pencere-dugmeler"><button class="btn gri" data-eylem="pencereKapat">Vazgeç</button><button class="btn yesil" data-eylem="yeniArabaAl" ${yeter ? "" : "disabled"}>🪙 ${fiyat} Satın al</button></div>`);
  },
  yeniArabaAl() {
    const fiyat = yeriFiyat();
    if (durum.garaj.yerSayisi >= 4 || durum.jeton < fiyat) return;
    const renkler = durum.envanter.renk;
    durum.jeton -= fiyat; durum.garaj.yerSayisi++;
    durum.garaj.arabalar.push(arabaNormal({ renk: renkler[Math.floor(Math.random() * renkler.length)] }));
    showSira = durum.garaj.secili = durum.garaj.arabalar.length - 1; kaydet();
    pencereKapat(); Ses.satin(); arabaParla(); atolyeYenile(false); bildirim("🚗 Garajına yeni bir araba geldi! Şimdi onu süsleyebilirsin.");
  },
  async arabaKarti(el) {
    el.disabled = true;
    try {
      showSira = durum.garaj.secili;
      const c = await arabaKartiCiz(showSira), url = c.toDataURL("image/png");
      const dosya = "okuma_rallisi_" + arabaAdi(showSira).toLocaleLowerCase("tr").replace(/[^a-z0-9çğıöşü]+/g, "_") + ".png";
      pencereAc(`<h2>🖼️ Araba Kartı</h2><img class="kart-resim" src="${url}" alt="Araba kartı">
<div class="pencere-dugmeler" style="margin-top:.8em"><button class="btn gri" data-eylem="pencereKapat">Kapat</button><a class="btn yesil" href="${url}" download="${dosya}">⬇ İndir</a></div>`, "genis");
    } catch (e) { bildirim("Kart hazırlanamadı, lütfen tekrar dene."); }
    el.disabled = false;
  },
  /* --- Atölye --- */
  parcaAl(el) {
    const k = el.dataset.p, lv = durum.garaj.parcalar[k];
    if (lv >= 5 || durum.jeton < parcaFiyat(lv)) return;
    clearTimeout(atolyeOnayZaman);
    if (atolyeOnay !== k) {                     // ilk dokunuş: onay iste (yanlışlıkla almayı önler)
      atolyeOnay = k;
      atolyeOnayZaman = setTimeout(() => { atolyeOnay = null; atolyeYenile(false); }, 3000);
      atolyeYenile(false);
      return;
    }
    const once = guc();
    durum.jeton -= parcaFiyat(lv); durum.garaj.parcalar[k] = lv + 1; atolyeOnay = null; kaydet();
    Ses.yukselt(k);
    arabaParla(); atolyeYenile(false); $("#gucKutu").innerHTML = gucKutuHTML();
    const sonra = guc(), yeni = YARIS_KADEME.find(y => y.min > once && y.min <= sonra);
    bildirim(yeni ? `🎉 Gücün ${sonra} oldu! Artık ${yeni.ad} yarışlarına hazırsın.` : `${PARCA_BILGI[k].ad} seviye ${lv + 1} oldu! ⚡ Güç ${sonra}`);
  },
  sekmeSec(el) { atolyeSekme = el.dataset.s; deneme = null; atolyeOnay = null; atolyeYenile(); },
  katSec(el)   { gorunumKat = el.dataset.k; deneme = null; atolyeOnay = null; atolyeYenile(); $(".atolye-panel").scrollTop = 0; },
  ogeSec(el) {
    const kat = el.dataset.k, id = el.dataset.i, o = GORUNUM[kat].ogeler.find(x => x.id === id);
    atolyeOnay = null;
    if (sahipMi(kat, id)) {                       // sahip olunan: hemen takılır
      if (GORUNUM[kat].surucu) durum.profil.kask[GORUNUM[kat].surucu] = id;
      else durum.garaj.arabalar[durum.garaj.secili][kat] = id;
      deneme = null; kaydet(); arabaParla(); atolyeYenile(false);
      return;
    }
    if (ozelKilit(o)) { Ses.hata(); bildirim(o.ozel === "sezon" ? "📅 Bu bir sezon çıkartması: haftalık 3 metinle kazanılır!" : `🏆 Bu özel bir ödül: ${kademeAdi(o.ozel)} yarışlarında ${OZEL_ESIK} kez birinci ol!`); deneme = { kat, id }; atolyeYenile(); return; }
    deneme = { kat, id }; atolyeYenile();
  },
  denemeIptal() { deneme = null; atolyeOnay = null; atolyeYenile(); },
  ogeAl() {
    if (!deneme) return;
    const { kat, id } = deneme, o = GORUNUM[kat].ogeler.find(x => x.id === id), fiyat = ogeFiyat(kat, o), anahtar = "g:" + kat + ":" + id;
    if (ozelKilit(o) || durum.jeton < fiyat) return;
    clearTimeout(atolyeOnayZaman);
    if (atolyeOnay !== anahtar) { atolyeOnay = anahtar; atolyeOnayZaman = setTimeout(() => { atolyeOnay = null; atolyeYenile(false); }, 3000); atolyeYenile(false); return; }
    durum.jeton -= fiyat; durum.envanter[kat].push(id);
    if (GORUNUM[kat].surucu) durum.profil.kask[GORUNUM[kat].surucu] = id; else durum.garaj.arabalar[durum.garaj.secili][kat] = id;
    deneme = null; atolyeOnay = null; kaydet();
    Ses.boya(kat); arabaParla(); atolyeYenile(false);
    bildirim(`🎨 ${o.ad} artık senin!`);
  },

  /* --- Okuma Pisti --- */
  bolgeAc(el) {
    const s = +el.dataset.s;
    if (seviyeAcik(s)) return listeAc(s);
    Ses.hata();
    pencereAc(`<h2>🔒 ${bolgesi(s).ad} kilitli</h2>
<p class="onay-metin">Bu bölgeyi açmak için ${bolgesi(s - 1).de} ${KILIT_ESIGI} metin bitirmelisin. Şu ana kadar ${bitenSay(s - 1)} metin bitirdin.</p>
<div class="pencere-dugmeler"><button class="btn yesil" data-eylem="pencereKapat">Tamam</button></div>`);
  },
  metinAc(el) { git("okuma", { id: el.dataset.id }); },
  okudum()    { git("soru"); },
  okumaCik() {
    pencereAc(`<h2>Metinden çıkılsın mı?</h2>
<p class="onay-metin">Çıkarsan bu metindeki cevapların kaydedilmez. Metni daha sonra baştan okuyabilirsin.</p>
<div class="pencere-dugmeler"><button class="btn yesil" data-eylem="pencereKapat">Devam et</button><button class="btn gri" data-eylem="okumaCikEvet">Çık</button></div>`);
  },
  okumaCikEvet() { git("harita", { acSeviye: oturum.m.seviye }); },
  haritayaDon()  { git("harita", { acSeviye: oturum ? oturum.m.seviye : 0 }); },
  panelDegistir() { panelAc(!aktifSahne.classList.contains("panel-acik")); },

  /* --- Sorular --- */
  secenek(el) {
    if (oturum.kilit) return;
    if (+el.dataset.g === suankiSoru().dogru) return cevapDegerlendir(true);
    el.classList.add("yanlis"); el.disabled = true; cevapDegerlendir(false);
  },
  dyCevap(el) {
    if (oturum.kilit) return;
    if ((el.dataset.v === "1") === suankiSoru().dogru) return cevapDegerlendir(true);
    el.classList.add("yanlis"); cevapDegerlendir(false);
  },
  siraKoy(el) {
    const s = oturum.sira, o = +el.dataset.o, bos = s.yer.indexOf(null);
    if (oturum.kilit || bos < 0) return;
    s.yer[bos] = o; s.havuz = s.havuz.filter(x => x !== o); siraCiz();
  },
  siraGeri(el) {
    const s = oturum.sira, i = +el.dataset.i;
    if (oturum.kilit || s.yer[i] === null || s.sabit.has(i)) return;
    s.havuz.push(s.yer[i]); s.yer[i] = null; siraCiz();
  },
  siraKontrol() {
    const s = oturum.sira;
    if (s.yer.every((o, i) => o === i)) return cevapDegerlendir(true);
    if (oturum.deneme === 0) {          // doğru yerdekiler sabitlenir, yanlışlar havuza döner
      const geri = [];
      s.yer.forEach((o, i) => { if (o === i) s.sabit.add(i); else { geri.push(o); s.yer[i] = null; } });
      s.havuz = karistir(geri);
    }
    cevapDegerlendir(false);
    if (!oturum.kilit) siraCiz();
  },
  sonrakiSoru() {
    oturum.soruNo++;
    if (oturum.soruNo < oturum.m.sorular.length) { panelAc(false); soruGoster(); }
    else git("sonuc");
  },

  avatarSec(el) {
    kayitTaslak.avatar = +el.dataset.i;
    aktifSahne.querySelectorAll(".avatar-sec").forEach(b => b.classList.toggle("secili", b === el));
  },
  kayitTamam() {
    const ad = (kayitTaslak.ad || "").trim().replace(/\s+/g, " ");
    if (ad.length < 2) {
      Ses.hata();
      aktifSahne.querySelector("#adUyari").textContent = "Adın en az 2 harf olmalı.";
      aktifSahne.querySelector("#adKutu").focus();
      return;
    }
    durum.profil.ad = ad; durum.profil.avatar = kayitTaslak.avatar; kaydet();
    Ses.onay(); git("garaj");
  },

  arabaDokun(el) {
    Ses.motor();
    el.classList.remove("vin"); void el.offsetWidth; el.classList.add("vin");
  },
  ipucuKapat() {
    durum.ipucu.garaj = true; kaydet();
    const b = document.getElementById("ipucu"); if (b) b.remove();
  },

  ayarlar() { pencereAc(ayarlarIcerik()); },
  pencereKapat() { pencereKapat(); },
  muzikDegistir() {
    durum.ayarlar.muzik = !durum.ayarlar.muzik; kaydet(); Ses.hazirla(); Muzik.ayarla();
    pencereAc(ayarlarIcerik());
  },
  sesDegistir() {
    durum.ayarlar.ses = !durum.ayarlar.ses; kaydet();
    if (durum.ayarlar.ses) { Ses.hazirla(); Ses.tik(); }
    if (document.getElementById("perde")) pencereAc(ayarlarIcerik());
    if (aktifAd === "kapak") git("kapak");
  },
  metinBoyu(el) {
    const yeni = durum.ayarlar.metinBoyu + (+el.dataset.yon);
    durum.ayarlar.metinBoyu = Math.max(0, Math.min(METIN_BOYLARI.length - 1, yeni)); kaydet();
    metinBoyuUygula();
    if (document.getElementById("perde")) pencereAc(ayarlarIcerik());
    const k = $("#boyutKutu"); if (k) k.innerHTML = boyutKontrolHTML();
    if (aktifAd === "okuma" && oturum && oturum.yenidenBak) setTimeout(oturum.yenidenBak, 60);
  },
  profilDuzenle() { pencereKapat(); git("kayit", { duzenle: true }); },
  sifirla() {
    pencereAc(`<h2 style="color:#B91C1C">Emin misin?</h2>
<p class="onay-metin">Bütün jetonların, araban, parçaların ve kupaların silinecek. Bu işlem geri alınamaz.</p>
<div class="pencere-dugmeler"><button class="btn yesil" data-eylem="ayarlar">Vazgeç</button><button class="btn kirmizi" data-eylem="sifirlaEvet">Evet, sıfırla</button></div>`);
  },
  sifirlaEvet() {
    const { ayarlar, ogretmen } = durum;                 // cihaz ayarları korunur
    try { localStorage.removeItem(KAYIT_ANAHTARI); } catch (e) {}
    durum = yeniDurum(); durum.ayarlar = ayarlar; durum.ogretmen = ogretmen; kaydet();
    pencereKapat(); git("kapak");
  },

  /* --- İlerleme kodu --- */
  async kodGoster() {
    const kod = await ilerlemeKodu();
    pencereAc(`<h2>🔑 İlerleme kodun</h2><p class="onay-metin">Bu kodu kopyala ve diğer cihazda <b>Ayarlar → Kod gir</b> bölümüne yapıştır. Kodda araban, jetonların, metinlerin ve kupaların var.</p>
<textarea class="kod-kutu" id="kodKutu" readonly>${kod}</textarea>
<div class="pencere-dugmeler" style="margin-top:.8em"><button class="btn gri" data-eylem="ayarlar">◀ Geri</button>${navigator.share ? `<button class="btn mor" data-eylem="kodPaylas">Paylaş</button>` : ""}<button class="btn yesil" data-eylem="kodKopyala">📋 Kopyala</button></div>`);
    const k = document.getElementById("kodKutu"); k.addEventListener("focus", () => k.select());
  },
  async kodKopyala() {
    const k = document.getElementById("kodKutu"); if (!k) return;
    try { await navigator.clipboard.writeText(k.value); bildirim("📋 Kod kopyalandı!"); }
    catch (e) { k.focus(); k.select(); try { document.execCommand("copy"); bildirim("📋 Kod kopyalandı!"); } catch (e2) { bildirim("Kodu seçip kendin kopyala."); } }
  },
  kodPaylas() { const k = document.getElementById("kodKutu"); if (k && navigator.share) navigator.share({ title: "Okuma Rallisi ilerleme kodu", text: k.value }).catch(() => {}); },
  kodGirAc() {
    pencereAc(`<h2>🔑 Kod gir</h2><p class="onay-metin">Diğer cihazdan aldığın ilerleme kodunu buraya yapıştır.</p>
<textarea class="kod-kutu" id="kodGiris" placeholder="OR1.…" autocomplete="off" spellcheck="false"></textarea><div class="uyari" id="kodUyari"></div>
<div class="pencere-dugmeler"><button class="btn gri" data-eylem="ayarlar">◀ Geri</button><button class="btn yesil" data-eylem="kodYukle">Yükle</button></div>`);
  },
  async kodYukle() {
    const k = document.getElementById("kodGiris"), uyari = document.getElementById("kodUyari");
    const yeni = await ilerlemeCoz(k.value);
    if (!yeni) { Ses.hata(); uyari.textContent = "Bu kod okunamadı. Tamamını kopyaladığından emin ol."; return; }
    kodBekleyen = yeni;
    pencereAc(`<h2>Kod hazır!</h2><p class="onay-metin"><b>${esc(yeni.profil.ad)}</b> adlı sürücünün ilerlemesi yüklenecek: 🪙 ${yeni.jeton} jeton, 📖 ${Object.keys(yeni.metinler).length} metin, 🏆 ${yeni.kupalar.length} kupa.<br>Bu cihazdaki ilerleme bunun yerine geçecek.</p>
<div class="pencere-dugmeler"><button class="btn gri" data-eylem="ayarlar">Vazgeç</button><button class="btn yesil" data-eylem="kodYukleEvet">Evet, yükle</button></div>`);
  },
  kodYukleEvet() {
    if (!kodBekleyen) return;
    kodBekleyen.ayarlar = durum.ayarlar; kodBekleyen.ogretmen = durum.ogretmen;
    durum = kodBekleyen; kodBekleyen = null; kaydet(); pencereKapat(); Ses.onay();
    git("garaj"); bildirim(`👋 Tekrar hoş geldin, ${durum.profil.ad}!`);
  },

  /* --- Yönetici modu: "Ayarlar" başlığına art arda 5 kez dokun --- */
  ayarBaslik() {
    const t = Date.now(); baslikDokunus = baslikDokunus.filter(x => t - x < 2500); baslikDokunus.push(t);
    if (baslikDokunus.length >= 5) { baslikDokunus = []; if (yoneticiModu) bildirim("🛡️ Yönetici modu zaten açık"); else Eylemler.yoneticiAc(); }
  },
  sesliOkumaDegistir() { durum.ogretmen.sesliOkuma = !durum.ogretmen.sesliOkuma; kaydet(); pencereAc(ayarlarIcerik()); },
  dinle() {
    if (Okuyucu.okuyor) { Okuyucu.dur(); return dinleDugme(); }
    Okuyucu.oku(oturum.m, i => {
      aktifSahne.querySelectorAll(".kagit .c.okunuyor").forEach(c => c.classList.remove("okunuyor"));
      const c = $(`.kagit .c[data-c="${i}"]`); if (c) { c.classList.add("okunuyor"); c.scrollIntoView({ behavior: "smooth", block: "center" }); }
      if (i === oturum.m.cumleler.length - 1) { oturum.sonaVardi = true; if (oturum.yenidenBak) oturum.yenidenBak(); }
    }, () => { if (aktifSahne) aktifSahne.querySelectorAll(".kagit .c.okunuyor").forEach(c => c.classList.remove("okunuyor")); dinleDugme(); });
    dinleDugme();
  }
};

// Sessiz eylemler (tık sesi çalmasın)
const SESSIZ = new Set(["muzikDegistir", "galeriTepki", "arabaDokun", "sesDegistir", "kayitTamam", "secenek", "dyCevap", "siraKontrol", "ayarBaslik", "dinle"]);  // kendi seslerini çalarlar

document.addEventListener("pointerdown", () => Ses.hazirla(), { passive: true });
document.addEventListener("input", e => {          // ayarlardaki müzik sesi kaydırağı
  if (e.target.id !== "muzikSes") return;
  durum.ayarlar.muzikSes = +e.target.value; durum.ayarlar.muzikDokundu = true; Muzik.ayarla();
});
document.addEventListener("change", e => { if (e.target.id === "muzikSes") kaydet(); });
document.addEventListener("click", e => {
  const el = e.target.closest("[data-eylem]");
  if (!el || el.disabled) return;
  const ad = el.dataset.eylem;
  if (!Eylemler[ad]) return;
  if (!SESSIZ.has(ad)) Ses.tik();
  Eylemler[ad](el);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !document.querySelector("#perde[data-kapanmaz]")) pencereKapat();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[role=button][data-eylem]")) { e.preventDefault(); e.target.click(); }
});
window.addEventListener("resize", () => { arabayiYerlestir(); haritaYerlestir(); salonYerlestir(); });

/* ==========================================================
   10. BAŞLAT
   ========================================================== */
Object.values(GORSEL).forEach(src => { const i = new Image(); i.src = src; });
metinBoyuUygula();
git("kapak");
</script>
</body>
</html>
