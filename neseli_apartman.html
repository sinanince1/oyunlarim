<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neşeli Apartman — İstek mi İhtiyaç mı?</title>
<style>
/* =========================================================
   1) TEMEL DEĞİŞKENLER VE SIFIRLAMA
   ========================================================= */
:root{
  --turuncu:#FF6B35; --sari:#FFD600; --pembe:#FF4D8D; --yesil:#00C9A7;
  --mavi:#4D9FFF; --mor:#A855F7; --zemin:#FFF8F0; --koyu:#3B2416;
  --kahve:#7a3b1d; --golge:0 6px 0 rgba(59,36,22,.18);
  --yaricap:24px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--zemin);color:var(--koyu);
  font-family:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
button:focus-visible{outline:4px solid var(--mavi);outline-offset:3px}

/* =========================================================
   2) SAHNE YÖNETİCİSİ İÇİN KAPSAYICI
   ========================================================= */
#uygulama{position:relative;width:100%;height:100dvh;overflow:hidden}
.sahne{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;
  padding:clamp(10px,2vw,22px);padding-bottom:34px}
.sahne.aktif{display:flex;animation:belir .28s ease-out}
@keyframes belir{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* =========================================================
   3) ORTAK BİLEŞENLER: DÜĞMELER, ÜST BAR, KARTLAR
   ========================================================= */
.dugme{min-height:64px;padding:12px 28px;border-radius:999px;font-size:clamp(20px,2.4vw,28px);
  font-weight:900;background:var(--turuncu);color:#fff;box-shadow:var(--golge);
  transition:transform .1s}
.dugme:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(59,36,22,.18)}
.dugme.ikincil{background:#fff;color:var(--koyu);border:3px solid #f0dccb}
.dugme.yesil{background:var(--yesil)}
.dugme.mavi{background:var(--mavi)}
.dugme.pembe{background:var(--pembe)}
.dugme.mor{background:var(--mor)}

.ust-bar{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-shrink:0}
.ust-bar h2{flex:1;font-size:clamp(20px,2.6vw,32px);font-weight:900;text-align:center}
.geri{min-height:56px;min-width:56px;padding:8px 18px;border-radius:999px;background:#fff;
  border:3px solid #f0dccb;font-size:20px;font-weight:800;box-shadow:var(--golge)}
.yildiz-rozet{min-height:56px;display:flex;align-items:center;gap:6px;padding:8px 18px;
  border-radius:999px;background:var(--sari);font-size:22px;font-weight:900;box-shadow:var(--golge)}

.sesli{min-width:52px;min-height:52px;border-radius:50%;background:#fff;border:3px solid #f0dccb;
  font-size:24px;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
.sesli.gizli{display:none}

.altbilgi{position:fixed;bottom:6px;left:0;right:0;text-align:center;font-size:13px;
  font-weight:700;opacity:.55;pointer-events:none;z-index:5}

/* =========================================================
   4) GİRİŞ EKRANI
   ========================================================= */
#s-giris{align-items:center;justify-content:center;gap:clamp(8px,2vh,18px);text-align:center}
#s-giris .bina-kutu{height:min(46dvh,420px);aspect-ratio:360/520}
#s-giris h1{font-size:clamp(38px,6vw,72px);font-weight:900;color:var(--turuncu);
  text-shadow:0 4px 0 #ffd9c4;line-height:1}
#s-giris .alt-baslik{font-size:clamp(18px,2.4vw,26px);font-weight:800;display:flex;
  align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}
.giris-dugmeler{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}

/* =========================================================
   5) APARTMAN (ANA MENÜ)
   ========================================================= */
.apt-izgara{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);
  gap:clamp(12px,2.5vw,32px);align-items:center;min-height:0}
.apt-izgara .bina-kutu{height:100%;max-height:calc(100dvh - 120px);display:flex;justify-content:center}
.bina-svg{height:100%;width:auto;max-width:100%;display:block}
.mod-kartlar{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.6vw,18px)}
.mod-kart{border-radius:var(--yaricap);padding:clamp(12px,1.8vw,20px);text-align:left;color:#fff;
  box-shadow:var(--golge);display:flex;gap:12px;align-items:center;min-height:96px;transition:transform .1s}
.mod-kart:active{transform:translateY(4px)}
.mod-kart.genis{grid-column:1/-1}
.mod-kart svg{width:clamp(48px,6vw,72px);height:clamp(48px,6vw,72px);flex-shrink:0}
.mod-kart b{display:block;font-size:clamp(19px,2.2vw,26px);font-weight:900}
.mod-kart span{display:block;font-size:clamp(14px,1.5vw,17px);font-weight:700;opacity:.95}
.mod-kart.ek{min-height:76px;background:#fff;color:var(--koyu);border:3px solid #f0dccb}
.k-a{background:var(--turuncu)} .k-b{background:var(--mavi)} .k-c{background:var(--mor)}
.apt-alt{display:flex;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}
.sus-dugme{flex:1;min-height:64px;border-radius:999px;background:#fff;border:3px solid #f0dccb;box-shadow:var(--golge);
  display:flex;align-items:center;gap:10px;padding:6px 16px;text-align:left;font-size:clamp(15px,1.6vw,18px);font-weight:800}
.sus-dugme .cubuk{flex:1;height:12px;border-radius:6px;background:#F3E3D3;overflow:hidden;min-width:60px}
.sus-dugme .cubuk i{display:block;height:100%;background:linear-gradient(90deg,var(--sari),var(--turuncu));border-radius:6px}
.en-iyi{display:block;font-style:normal;font-size:clamp(13px,1.4vw,15px);font-weight:800;opacity:.9;margin-top:2px}
/* süs paneli */
#sus-panel{position:fixed;inset:0;background:rgba(59,36,22,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#sus-panel.goster{display:flex}
.sus-kutu{background:#fff;border-radius:28px;padding:20px;max-width:560px;width:100%;max-height:92dvh;overflow:auto}
.sus-kutu h3{font-size:26px;font-weight:900;text-align:center;margin-bottom:4px}
.sus-kutu .not{text-align:center;font-weight:700;opacity:.7;margin-bottom:12px}
.sus-liste{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sus-ogesi{border-radius:18px;padding:10px 12px;background:#FFF3B0;border:3px solid var(--sari);display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.sus-ogesi .em{font-size:30px}
.sus-ogesi.kilitli{background:#F3E3D3;border-color:#e8cdb6;opacity:.75}
.sus-ogesi small{display:block;font-size:14px;opacity:.75}
.yeni-sus{background:linear-gradient(90deg,#FFF3B0,#FFE0EC);border:4px solid var(--sari);border-radius:22px;padding:12px 18px;
  font-size:clamp(19px,2.3vw,24px);font-weight:900;text-align:center;animation:parla .6s ease-in-out 2}
/* süs animasyonları */
.ampul{animation:ampulYan 1.2s ease-in-out infinite}
@keyframes ampulYan{50%{opacity:.35}}
.kuslar{animation:kusUc 9s ease-in-out infinite}
@keyframes kusUc{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-8px)}}
.kedi-kuyruk{animation:kuyruk 2s ease-in-out infinite;transform-box:fill-box;transform-origin:left bottom}
@keyframes kuyruk{50%{transform:rotate(-14deg)}}

/* =========================================================
   6) BİNA ÇİZİMİ ANİMASYONLARI
   ========================================================= */
.bulut{animation:bulutKay 14s linear infinite}
@keyframes bulutKay{0%{transform:translateX(-100px)}100%{transform:translateX(420px)}}
.isik{animation:isikYan 5s ease-in-out infinite}
@keyframes isikYan{0%,100%{fill:#FFF3B0}50%{fill:#FFE066}}
.kapici{animation:zipla 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
@keyframes zipla{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.gunes-isin{animation:don 18s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes don{to{transform:rotate(360deg)}}

/* =========================================================
   7) OYUN EKRANI YER TUTUCULARI (sonraki aşamalarda dolacak)
   ========================================================= */
.oyun-govde{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.yonerge{font-size:clamp(19px,2.3vw,26px);font-weight:800;display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}

/* =========================================================
   7b) MOD B — İSTEK Mİ İHTİYAÇ MI?
   ========================================================= */
.ilerleme{display:flex;gap:8px;justify-content:center;margin-bottom:6px;flex-shrink:0}
.ilerleme i{width:18px;height:18px;border-radius:50%;background:#efdccc;display:block}
.ilerleme i.simdi{outline:4px solid var(--mavi);outline-offset:2px;background:#fff}
.ilerleme i.d{background:var(--yesil)} .ilerleme i.y{background:var(--pembe)}
.b-alan{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2.4vh,26px);position:relative}
.b-sahne{display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,40px);flex-wrap:wrap}
.sakin-kart{background:#fff;border-radius:var(--yaricap);padding:16px 22px;display:flex;align-items:center;gap:16px;
  box-shadow:var(--golge);max-width:520px}
.sakin-kart .portre{width:clamp(84px,11vw,130px);height:clamp(84px,11vw,130px);flex-shrink:0}
.sakin-kart h3{font-size:clamp(22px,2.8vw,32px);font-weight:900}
.sakin-kart .bilgi{font-size:clamp(17px,2vw,22px);font-weight:700;opacity:.85}
.sakin-kart .durum{font-size:clamp(18px,2.1vw,23px);font-weight:800;color:var(--mavi);margin-top:4px}
.esya-kart{background:#FFF3B0;border:4px solid var(--sari);border-radius:var(--yaricap);padding:14px 22px;text-align:center;
  box-shadow:var(--golge);min-width:170px;animation:paketGel .45s ease-out}
@keyframes paketGel{from{transform:translateY(-30px) scale(.8);opacity:0}to{transform:none;opacity:1}}
.esya-kart .emoji{font-size:clamp(56px,8vw,96px);line-height:1.1}
.esya-kart .ad{font-size:clamp(20px,2.4vw,28px);font-weight:900}
.b-soru{font-size:clamp(20px,2.5vw,30px);font-weight:900;text-align:center;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.cevaplar{display:flex;gap:clamp(14px,3vw,40px);flex-wrap:wrap;justify-content:center}
.cevap{min-width:clamp(190px,24vw,300px);min-height:clamp(78px,11vh,104px);border-radius:28px;font-size:clamp(24px,3vw,36px);
  font-weight:900;color:#fff;box-shadow:var(--golge);transition:transform .1s, opacity .2s}
.cevap:active{transform:translateY(4px)}
.cevap.ihtiyac{background:var(--yesil)} .cevap.istek{background:var(--turuncu)}
.cevap.soluk{opacity:.35} .cevap.parla{animation:parla .5s ease-in-out 2}
@keyframes parla{50%{transform:scale(1.08)}}
.arti{position:absolute;top:8%;font-size:clamp(34px,5vw,56px);font-weight:900;color:var(--turuncu);
  animation:artiUc 1s ease-out forwards;pointer-events:none}
@keyframes artiUc{from{opacity:0;transform:translateY(20px)}20%{opacity:1}to{opacity:0;transform:translateY(-40px)}}
.gb-panel{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(720px,100%);background:#fff;
  border-radius:28px 28px 20px 20px;border:4px solid var(--pembe);padding:18px 22px;display:flex;gap:16px;align-items:center;
  box-shadow:0 -6px 24px rgba(59,36,22,.18);animation:yukari .3s ease-out;z-index:4}
@keyframes yukari{from{transform:translate(-50%,40px);opacity:0}to{transform:translateX(-50%);opacity:1}}
.gb-panel .portre{width:84px;height:84px;flex-shrink:0}
.gb-panel .gb-metin{flex:1;font-size:clamp(18px,2.2vw,23px);font-weight:800;line-height:1.35}
.gb-panel .gb-baslik{color:var(--pembe);font-size:clamp(20px,2.4vw,26px);font-weight:900}
.gb-panel .gb-dugmeler{display:flex;flex-direction:column;gap:8px;align-items:center}
@media (max-width:620px){ .gb-panel{flex-wrap:wrap;justify-content:center;text-align:center} .gb-panel .gb-dugmeler{flex-direction:row} }

/* =========================================================
   7c) MOD A — KAPIYA TESLİM
   ========================================================= */
.a-alan{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:clamp(10px,2vh,22px);position:relative;min-height:0}
.a-yonerge{text-align:center}
.kapilar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,2vw,26px);max-width:1000px;width:100%;margin:0 auto}
.kapi{background:#fff;border-radius:22px 22px 16px 16px;border:4px solid #e8cdb6;box-shadow:var(--golge);
  display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 8px 12px;overflow:hidden;
  transition:transform .15s,border-color .15s;cursor:pointer;min-height:clamp(170px,30vh,250px);position:relative}
.kapi .ust-serit{width:calc(100% + 16px);height:16px;margin-bottom:8px}
.kapi .portre{width:clamp(60px,9vw,104px);height:clamp(60px,9vw,104px)}
.kapi h3{font-size:clamp(16px,2.1vw,25px);font-weight:900;line-height:1.15;margin-top:4px}
.kapi .bilgi{font-size:clamp(13px,1.6vw,18px);font-weight:700;opacity:.85;line-height:1.2}
.kapi.hedef{border-color:var(--mavi);transform:scale(1.04)}
.kapi.secime-hazir{border-style:dashed;border-color:var(--mavi)}
.kapi.ipucu{animation:parla .6s ease-in-out 3;border-color:var(--yesil)}
.kapi.titre{animation:titre .4s}
@keyframes titre{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.kapi .teslim{position:absolute;top:22px;right:8px;background:var(--yesil);color:#fff;border-radius:16px;padding:2px 8px;
  font-size:clamp(22px,3vw,34px);animation:paketGel .35s ease-out}
.tepsi{display:flex;gap:clamp(10px,2.5vw,30px);justify-content:center;flex-wrap:wrap;min-height:clamp(110px,18vh,160px);
  align-items:center;background:#F3E3D3;border-radius:var(--yaricap);padding:12px;max-width:900px;width:100%;margin:0 auto}
.paket{background:#FFF3B0;border:4px solid var(--sari);border-radius:20px;padding:8px 14px;text-align:center;min-width:clamp(110px,15vw,170px);
  box-shadow:var(--golge);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;animation:paketGel .4s ease-out}
.paket .emoji{font-size:clamp(40px,6vw,70px);line-height:1.1;pointer-events:none}
.paket .ad{font-size:clamp(16px,1.9vw,22px);font-weight:900;pointer-events:none}
.paket.secili{border-color:var(--mavi);transform:translateY(-6px);box-shadow:0 10px 0 rgba(77,159,255,.35)}
.paket.tasiniyor{opacity:.3}
.hayalet{position:fixed;z-index:30;pointer-events:none;transform:translate(-50%,-50%) rotate(-4deg) scale(1.05);animation:none}
.a-mesaj{position:absolute;left:50%;top:0;transform:translateX(-50%);background:#fff;border:4px solid var(--pembe);border-radius:22px;
  padding:14px 20px;font-size:clamp(18px,2.2vw,24px);font-weight:800;box-shadow:0 8px 24px rgba(59,36,22,.2);z-index:6;
  display:flex;gap:10px;align-items:center;width:max-content;max-width:min(760px,96%);animation:mesajGel .25s ease-out}
@keyframes mesajGel{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translateX(-50%)}}
.a-mesaj.iyi{border-color:var(--yesil)}
@media (max-width:620px){ .kapi .bilgi{font-size:12px} .kapi{min-height:150px;padding:0 4px 10px} .kapi h3{font-size:15px} }

/* =========================================================
   7d) MOD C — HERKESE SOR
   ========================================================= */
.c-alan{flex:1;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.8vh,18px);min-height:0}
.c-ust{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.c-ust .esya-kart{min-width:150px;padding:8px 18px}
.c-ust .esya-kart .emoji{font-size:clamp(44px,6vw,72px)}
.c-sonuc{font-size:clamp(20px,2.5vw,28px);font-weight:900;color:var(--mor);text-align:center;min-height:1.3em}
.c-kartlar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,1.6vw,18px);width:100%;max-width:1200px}
.c-kart{background:#fff;border-radius:22px;border:4px solid #f0dccb;box-shadow:var(--golge);padding:10px;display:flex;flex-direction:column;
  align-items:center;text-align:center;gap:4px;position:relative;transition:border-color .2s}
.c-kart .portre{width:clamp(56px,7vw,86px);height:clamp(56px,7vw,86px)}
.c-kart h3{font-size:clamp(16px,1.9vw,22px);font-weight:900;line-height:1.15}
.c-kart .bilgi{font-size:clamp(12px,1.4vw,16px);font-weight:700;opacity:.8;line-height:1.2}
.c-kart .durum{font-size:clamp(13px,1.5vw,17px);font-weight:800;color:var(--mavi);line-height:1.2}
.c-kart .sesli{position:absolute;top:6px;right:6px;min-width:40px;min-height:40px;font-size:18px}
.c-secim{display:flex;gap:6px;width:100%;margin-top:auto;padding-top:6px}
.c-secim button{flex:1;min-height:56px;border-radius:16px;font-size:clamp(15px,1.7vw,20px);font-weight:900;background:#F3E3D3;color:var(--koyu);
  border:3px solid transparent;transition:background .15s}
.c-secim button.ihtiyac.sec{background:var(--yesil);color:#fff}
.c-secim button.istek.sec{background:var(--turuncu);color:#fff}
.c-secim button:disabled{cursor:default}
.c-kart.dogru{border-color:var(--yesil)} .c-kart.yanlis{border-color:var(--pembe)}
.c-kart .rozet{position:absolute;top:-12px;left:-8px;width:40px;height:40px;border-radius:50%;color:#fff;font-size:22px;font-weight:900;
  display:flex;align-items:center;justify-content:center;animation:paketGel .3s ease-out}
.c-kart.dogru .rozet{background:var(--yesil)} .c-kart.yanlis .rozet{background:var(--pembe)}
.c-kart .c-aciklama{font-size:clamp(13px,1.5vw,16px);font-weight:800;background:#FFE9F1;border-radius:12px;padding:6px 8px;margin-top:4px;line-height:1.25}
.c-dugme{min-width:260px}
.c-dugme:disabled{opacity:.4;cursor:default}
@media (max-width:820px), (orientation:portrait){ .c-kartlar{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:420px){ .c-secim{flex-direction:column} .c-secim button{min-height:48px} }

/* =========================================================
   7e) BENİM İHTİYACIM (puansız)
   ========================================================= */
.bn-alan{flex:1;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,18px);width:100%;max-width:1100px;margin:0 auto}
.av-izgara{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;width:100%;max-width:820px}
.av-sec{background:#fff;border-radius:22px;border:4px solid #f0dccb;padding:8px;box-shadow:var(--golge)}
.av-sec svg{width:100%;height:auto;display:block}
.av-sec.sec{border-color:var(--mavi);transform:translateY(-4px)}
.ad-giris{min-height:60px;border-radius:999px;border:3px solid #f0dccb;padding:8px 22px;font:800 22px 'Nunito','Segoe UI',sans-serif;
  text-align:center;width:min(360px,90%);color:var(--koyu);background:#fff}
.sepetler{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,2vw,22px);width:100%}
.sepet{border-radius:22px;padding:10px;border:4px solid;background:#fff}
.sepet.ihtiyac{border-color:var(--yesil)} .sepet.istek{border-color:var(--turuncu)}
.sepet h3{font-size:clamp(18px,2.2vw,24px);font-weight:900;text-align:center;margin-bottom:6px}
.sepet.ihtiyac h3{color:#00a88b} .sepet.istek h3{color:var(--turuncu)}
.yuvalar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.yuva{min-height:clamp(70px,11vh,96px);border-radius:16px;border:3px dashed #e8cdb6;background:#FFF8F0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:clamp(13px,1.5vw,16px);font-weight:800;padding:4px}
.yuva .emoji{font-size:clamp(30px,4vw,44px);line-height:1.1}

/* =========================================================
   B) DEPO (localStorage)
   ========================================================= */
const Depo = {
  anahtar:'neseli_apartman_v1',
  varsayilan(){ return {yildiz:0, susler:[], enIyi:{A:0,B:0,C:0,duello:0}, sonCiftler:[], sonA:[], sonC:[], benim:null, ses:true, sesliOkuma:true}; },
  v:null,
  yukle(){
    try{ const h = JSON.parse(localStorage.getItem(this.anahtar)); this.v = Object.assign(this.varsayilan(), h||{}); }
    catch(e){ this.v = this.varsayilan(); }
  },
  kaydet(){ try{ localStorage.setItem(this.anahtar, JSON.stringify(this.v)); }catch(e){} },
  sifirla(){
    const ses = this.v.ses, sesli = this.v.sesliOkuma;   // ayarlar korunur, ilerleme silinir
    this.v = this.varsayilan(); this.v.ses = ses; this.v.sesliOkuma = sesli; this.kaydet();
  }
};

/* =========================================================
   C) SES MOTORU (Web Audio API — ses dosyası yok)
   ========================================================= */
const Ses = {
  ctx:null,
  hazirla(){ if(!this.ctx){ try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
             if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  nota(frek, sure, tur='sine', gecikme=0, siddet=.18){
    if(!Depo.v.ses || !this.ctx) return;
    const t = this.ctx.currentTime + gecikme, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = tur; o.frequency.setValueAtTime(frek, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(siddet, t+.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t+sure);
    o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t+sure+.05);
  },
  tik(){ this.nota(660,.08,'triangle',0,.12); },
  dogru(){ [523,659,784].forEach((f,i)=>this.nota(f,.18,'triangle',i*.09)); },
  yanlis(){ this.nota(220,.22,'sawtooth',0,.08); this.nota(180,.28,'sawtooth',.14,.08); },
  zil(){ this.nota(988,.35,'sine',0,.15); this.nota(784,.45,'sine',.25,.15); },
  sus(){ [784,988,1175,1568].forEach((f,i)=>this.nota(f,.16,'sine',i*.07,.12)); },
  fanfar(){ [523,659,784,1047].forEach((f,i)=>this.nota(f,.22,'triangle',i*.12,.16)); this.nota(1047,.5,'triangle',.5,.14); }
};

/* =========================================================
   D) SESLİ OKUMA (tarayıcının Türkçe sesi; yoksa düğmeler gizlenir)
   ========================================================= */
const Konus = {
  destek: 'speechSynthesis' in window,
  oku(metin){
    if(!this.destek || !Depo.v.sesliOkuma) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(metin);
    u.lang = 'tr-TR'; u.rate = .9;
    const tr = speechSynthesis.getVoices().find(s => (s.lang||'').toLowerCase().startsWith('tr'));
    if(tr) u.voice = tr;
    speechSynthesis.speak(u);
  },
  dugmeleriGuncelle(){
    const gorunur = this.destek && Depo.v.sesliOkuma;
    document.querySelectorAll('.sesli').forEach(b => b.classList.toggle('gizli', !gorunur));
  }
};

  /* Ayla: ponponlu bere, şişme mont */
  ayla: () => P.arka('#E3F2FF') + `<path d="M30 40 Q26 60 32 66 L40 50 Z M70 40 Q74 60 68 66 L60 50 Z" fill="#8D5524" ${CIZGI}/>` +
       P.govde('#90CAF9', `<path d="M16 84 H84 M14 96 H86" stroke="#5c95c9" stroke-width="2.5"/><path d="M50 70 V104" stroke="#7a3b1d" stroke-width="2"/>`) +
       P.boyun('#F5C6A0') + P.bas('#F5C6A0') +
       `<path d="M29 38 Q29 14 50 14 Q71 14 71 38 Z" fill="#FF4D8D" ${CIZGI}/><rect x="27" y="32" width="46" height="8" rx="4" fill="#fff" ${CIZGI}/>` +

  /* Ali: kıvırcık saç, turuncu tişört */

       P.boyun('#E0AC7E') + P.bas('#E0AC7E') +

/* Portrenin iç çizimi (bina pencerelerinde de kullanılır) */
function portreIc(id){ return (PORTRE[id] || (() => P.arka('#FFF3E6') + P.govde('#ccc') + P.bas('#F5C6A0') + P.yuz()))(); }
function portreSVG(id){
  return `<svg class="portre" viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="kp-${id}"><circle cx="50" cy="50" r="48"/></clipPath></defs>
    <g clip-path="url(#kp-${id})">${portreIc(id)}</g><circle cx="50" cy="50" r="48" fill="none" stroke="#f0dccb" stroke-width="3"/></svg>`;
}

/* =========================================================
   E2) MOD B — İSTEK Mİ İHTİYAÇ MI?
   Tur düzeni (8 görev): K1, K1, P1, K1, Q1, P2, K1, Q2
   K1 = 1. kademe sorusu, P/Q = karşıtlık çiftinin iki yarısı
   (aynı eşyanın iki görünüşü arasında 2 görev var)
   ========================================================= */
const karistir = d => { const a=[...d]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

const ModB = {
  el:null, gorevler:[], sira:0, dogru:0, yanlislar:[], sonuclar:[], kilit:false, zaman:null,

  kur(el){
    this.el = el;
    el.innerHTML = `
      <div class="ust-bar">
        <button class="geri" data-git="apartman" aria-label="Apartmana dön">←</button>
        <h2>İstek mi İhtiyaç mı?</h2>
        <div class="yildiz-rozet">⭐ <span class="yildiz-sayi">0</span></div>
      </div>
      <div class="ilerleme" id="b-ilerleme"></div>
      <div class="b-alan" id="b-alan"></div>`;
  },

  /* Görev listesini kur — son turlarda görülenleri önce dışarıda bırakır */
  turOlustur(){
    const son = new Set(Depo.v.sonCiftler);
    const sec = (havuz, n) => {
      const taze = karistir(havuz.filter(x => !son.has(x.id)));
      const eski = karistir(havuz.filter(x => son.has(x.id)));
      return [...taze, ...eski].slice(0, n);
    };
    // 2 ihtiyaç + 2 istek: hep aynı düğmeye basarak geçilemesin
    const k1 = karistir([...sec(B_KADEME1.filter(x=>x.cevap==='ihtiyac'), 2), ...sec(B_KADEME1.filter(x=>x.cevap==='istek'), 2)]);
    const adaylar = sec(B_KARSITLIK, B_KARSITLIK.length);
    const ciftler = [adaylar[0], adaylar.find(c => c.esya !== adaylar[0].esya)];   // iki farklı eşya
    const yarilar = c => {
      const g = ['ihtiyac','istek'].map(t => ({id:c.id, sakin:c[t].sakin, esya:c.esya, cevap:t, durum:c[t].durum, aciklama:c[t].aciklama, cift:true}));
      return Math.random() < .5 ? g : g.reverse();
    };
    const [P1,P2] = yarilar(ciftler[0]), [Q1,Q2] = yarilar(ciftler[1]);
    this.gorevler = [k1[0], k1[1], P1, k1[2], Q1, P2, k1[3], Q2];
    // tekrar önleme: son 2 turun kimlikleri saklanır (en çok 12)
    Depo.v.sonCiftler = [...k1.map(x=>x.id), ...ciftler.map(x=>x.id), ...Depo.v.sonCiftler].slice(0,12);
    Depo.kaydet();
  },

  yeniTur(){
    clearTimeout(this.zaman);
    this.turOlustur();
    this.sira = 0; this.dogru = 0; this.yanlislar = []; this.sonuclar = [];
    this.goster();
  },

  ilerlemeCiz(){
    document.getElementById('b-ilerleme').innerHTML = this.gorevler.map((_,i) =>
      `<i class="${i<this.sira ? (this.sonuclar[i]?'d':'y') : i===this.sira ? 'simdi' : ''}"></i>`).join('');
  },

  goster(){
    this.kilit = false;
    const g = this.gorevler[this.sira], k = sakinBul(g.sakin), e = ESYALAR[g.esya];
    const okunacak = `${k.ad}. ${k.bilgi} ${g.durum} Eşya: ${e.ad}. ${k.kisa} için ihtiyaç mı, istek mi?`;
    this.ilerlemeCiz();
    document.getElementById('b-alan').innerHTML = `
      <div class="b-sahne">
        <div class="sakin-kart">${portreSVG(g.sakin)}
          <div><h3>${k.ad}</h3><div class="bilgi">${k.bilgi}</div><div class="durum">${g.durum}</div></div>
        </div>
        <div class="esya-kart"><div class="emoji">${e.e}</div><div class="ad">${e.ad}</div></div>
      </div>
      <p class="b-soru">${e.ad}, ${k.kisa} için ihtiyaç mı, istek mi?
        <button class="sesli" data-oku="${okunacak}" aria-label="Sesli oku">🔊</button></p>
      <div class="cevaplar">
        <button class="cevap ihtiyac" data-cevap="ihtiyac">✔ İhtiyaç</button>
        <button class="cevap istek" data-cevap="istek">★ İstek</button>
      </div>`;
    Konus.dugmeleriGuncelle();
    this.el.querySelectorAll('[data-cevap]').forEach(b => b.onclick = () => this.cevapla(b.dataset.cevap));
  },

  cevapla(secim){
    if(this.kilit) return; this.kilit = true;
    const g = this.gorevler[this.sira], dogruMu = secim === g.cevap;
    this.sonuclar[this.sira] = dogruMu;
    this.el.querySelectorAll('[data-cevap]').forEach(b => {
      if(b.dataset.cevap === g.cevap) b.classList.add('parla'); else b.classList.add('soluk');
    });
    const alan = document.getElementById('b-alan');
    if(dogruMu){
      this.dogru++; yildizEkle(1); Ses.dogru();
      alan.insertAdjacentHTML('beforeend','<div class="arti">+1 ⭐</div>');
      this.zaman = setTimeout(() => this.sonraki(), 1300);
    } else {
      Ses.yanlis();
      this.yanlislar.push({metin:`${portreMini(g.sakin)} ${g.aciklama}`});
      const dogruAd = g.cevap === 'ihtiyac' ? '✔ İhtiyaç' : '★ İstek';
      const metinDuz = g.aciklama.replace(/<[^>]+>/g,'');
      alan.insertAdjacentHTML('beforeend', `
        <div class="gb-panel" role="alert">${portreSVG(g.sakin)}
          <div class="gb-metin"><div class="gb-baslik">Doğrusu: ${dogruAd}</div>${g.aciklama}</div>
          <div class="gb-dugmeler">
            <button class="sesli" data-oku="${metinDuz}" aria-label="Sesli oku">🔊</button>
            <button class="dugme mavi" id="b-anladim">Anladım ▶</button>
          </div>
        </div>`);
      Konus.dugmeleriGuncelle();
      document.getElementById('b-anladim').onclick = () => { Ses.tik(); this.sonraki(); };
    }
  },

  sonraki(){
    clearTimeout(this.zaman);
    this.sira++;
    if(this.sira < this.gorevler.length) this.goster();
    else this.bitir();
  },

  bitir(){
    Depo.v.enIyi.B = Math.max(Depo.v.enIyi.B||0, this.dogru); Depo.kaydet();
    Ses.fanfar();
    Sahne.git('ozet', {mod:'B', dogru:this.dogru, toplam:this.gorevler.length, yanlislar:this.yanlislar});
  },

  durdur(){ clearTimeout(this.zaman); }
};

/* =========================================================
   E3) MOD A — KAPIYA TESLİM
   Tur: 4 teslimat, her teslimatta 3 sakin + 3 eşya (12 eşya)
   Sürükle-bırak VEYA önce pakete sonra kapıya dokunma
   İlk denemede doğru teslim = +1 yıldız; 2 yanlıştan sonra doğru kapı parlar
   ========================================================= */
/* Tüm modlardaki verilerden "kimin neye ihtiyacı var" haritası */
const IHTIYAC_HARITA = new Set([
  ...A_IHTIYACLAR.map(x => x.sakin+'|'+x.esya),
  ...B_KADEME1.filter(x => x.cevap==='ihtiyac').map(x => x.sakin+'|'+x.esya),
  ...B_KARSITLIK.map(x => x.ihtiyac.sakin+'|'+x.esya),
  ...C_SORULAR.flatMap(q => q.kisiler.filter(k => k.cevap==='ihtiyac').map(k => k.sakin+'|'+q.esya))
]);
const ihtiyacMi = (sakin, esya) => IHTIYAC_HARITA.has(sakin+'|'+esya);

const ModA = {
  el:null, setler:[], setNo:0, paketler:[], dogru:0, yanlislar:[], yanlisSay:{}, secili:null, surukle:null, zaman:null, kilit:false,
  KAPI_RENK:['#FF6B35','#4D9FFF','#A855F7'],

  kur(el){
    this.el = el;
    el.innerHTML = `
      <div class="ust-bar">
        <button class="geri" data-git="apartman" aria-label="Apartmana dön">←</button>
        <h2>Kapıya Teslim</h2>
        <div class="yildiz-rozet">⭐ <span class="yildiz-sayi">0</span></div>
      </div>
      <div class="ilerleme" id="a-ilerleme"></div>
      <div class="a-alan" id="a-alan"></div>`;
  },

  /* 4 set kur: her sette 3 farklı sakin; tur içinde eşya tekrarı yok */
  turOlustur(){
    const son = new Set(Depo.v.sonA);
    for(let deneme=0; deneme<30; deneme++){
      const havuz = [...karistir(A_IHTIYACLAR.filter(x=>!son.has(x.id))), ...karistir(A_IHTIYACLAR.filter(x=>son.has(x.id)))];
      const kullanildi = new Set(), setler = [];
      for(let s=0; s<4; s++){
        const set = [], sakinler = new Set();
        for(const x of havuz){
          if(set.length===3) break;
          if(kullanildi.has(x.id) || sakinler.has(x.sakin)) continue;
          // aynı teslimatta bir eşyanın iki doğru kapısı olmasın (ör. şapka: Mert ve Hasan)
          if(set.some(y => ihtiyacMi(y.sakin, x.esya) || ihtiyacMi(x.sakin, y.esya))) continue;
          set.push(x); sakinler.add(x.sakin); kullanildi.add(x.id);
        }
        if(set.length<3) break;
        setler.push(set);
      }
      if(setler.length===4){
        this.setler = setler;
        Depo.v.sonA = setler.flat().map(x=>x.id).slice(0,12); Depo.kaydet();
        return;
      }
    }
  },

  yeniTur(){
    this.durdur();
    this.turOlustur();
    this.setNo = 0; this.dogru = 0; this.yanlislar = [];
    this.setGoster();
  },

  ilerlemeCiz(){
    document.getElementById('a-ilerleme').innerHTML = this.setler.map((_,i) =>
      `<i class="${i<this.setNo ? 'd' : i===this.setNo ? 'simdi' : ''}"></i>`).join('');
  },

  setGoster(){
    this.kilit = false; this.secili = null; this.yanlisSay = {};
    const set = this.setler[this.setNo];
    const kapiSirasi = karistir(set), paketSirasi = karistir(set);
    this.paketler = set.map(x => x.id);
    this.ilerlemeCiz();
    const yon = 'Her eşyayı ona ihtiyacı olan komşunun kapısına götür.';
    document.getElementById('a-alan').innerHTML = `
      <p class="yonerge a-yonerge">${yon} <button class="sesli" data-oku="${yon}" aria-label="Sesli oku">🔊</button></p>
      <div class="kapilar">${kapiSirasi.map((x,i) => { const k = sakinBul(x.sakin); return `
        <div class="kapi" data-kapi="${x.sakin}" role="button" tabindex="0" aria-label="${k.ad}: ${k.bilgi}">
          <div class="ust-serit" style="background:${this.KAPI_RENK[i]}"></div>
          ${portreSVG(x.sakin)}<h3>${k.ad}</h3><div class="bilgi">${k.bilgi}</div>
        </div>`; }).join('')}</div>
      <div class="tepsi" id="a-tepsi">${paketSirasi.map(x => { const e = ESYALAR[x.esya]; return `
        <div class="paket" data-paket="${x.id}" role="button" tabindex="0" aria-label="${e.ad}">
          <div class="emoji">${e.e}</div><div class="ad">${e.ad}</div></div>`; }).join('')}</div>`;
    Konus.dugmeleriGuncelle();
    this.el.querySelectorAll('.paket').forEach(p => this.paketBagla(p));
    this.el.querySelectorAll('.kapi').forEach(k => {
      k.onclick = () => { if(this.secili && !this.surukle) this.teslim(this.secili, k); };
      k.onkeydown = ev => { if(ev.key==='Enter' && this.secili) this.teslim(this.secili, k); };
    });
  },

  /* ---- sürükle-bırak + dokun-seç ---- */
  paketBagla(p){
    p.onpointerdown = ev => {
      if(this.kilit) return;
      ev.preventDefault();
      this.surukle = {p, x0:ev.clientX, y0:ev.clientY, hayalet:null};
      p.setPointerCapture(ev.pointerId);
    };
    p.onpointermove = ev => {
      const s = this.surukle; if(!s || s.p!==p) return;
      if(!s.hayalet){
        if(Math.hypot(ev.clientX-s.x0, ev.clientY-s.y0) < 10) return;
        s.hayalet = p.cloneNode(true); s.hayalet.classList.add('hayalet'); s.hayalet.classList.remove('secili');
        document.body.appendChild(s.hayalet); p.classList.add('tasiniyor'); this.seciliBirak();
      }
      s.hayalet.style.left = ev.clientX+'px'; s.hayalet.style.top = ev.clientY+'px';
      const hedef = this.kapiBul(ev.clientX, ev.clientY);
      this.el.querySelectorAll('.kapi').forEach(k => k.classList.toggle('hedef', k===hedef));
    };
    const bitir = ev => {
      const s = this.surukle; if(!s || s.p!==p) return;
      if(s.hayalet){
        const hedef = this.kapiBul(ev.clientX, ev.clientY);
        s.hayalet.remove(); p.classList.remove('tasiniyor');
        this.el.querySelectorAll('.kapi').forEach(k => k.classList.remove('hedef'));
        if(hedef && ev.type==='pointerup') this.teslim(p, hedef);
      } else if(ev.type==='pointerup'){
        // dokunma: paketi seç / bırak
        if(this.secili===p) this.seciliBirak();
        else { this.seciliBirak(); this.secili = p; p.classList.add('secili'); Ses.tik();
               this.el.querySelectorAll('.kapi').forEach(k => k.classList.add('secime-hazir')); }
      }
      setTimeout(() => { this.surukle = null; }, 0);
    };
    p.onpointerup = bitir; p.onpointercancel = bitir;
    p.onkeydown = ev => { if(ev.key==='Enter'){ this.seciliBirak(); this.secili = p; p.classList.add('secili'); } };
  },

  seciliBirak(){
    if(this.secili) this.secili.classList.remove('secili');
    this.secili = null;
    this.el.querySelectorAll('.kapi').forEach(k => k.classList.remove('secime-hazir'));
  },

  kapiBul(x, y){
    return [...this.el.querySelectorAll('.kapi')].find(k => {
      const r = k.getBoundingClientRect(); return x>=r.left && x<=r.right && y>=r.top && y<=r.bottom;
    }) || null;
  },

  /* ---- teslim kontrolü ---- */
  teslim(paketEl, kapiEl){
    if(this.kilit) return;
    const g = A_IHTIYACLAR.find(x => x.id === paketEl.dataset.paket);
    const kime = kapiEl.dataset.kapi;
    this.seciliBirak();
    if(kime === g.sakin){
      const ilkDeneme = !this.yanlisSay[g.id];
      if(ilkDeneme){ this.dogru++; yildizEkle(1); }
      Ses.zil();
      kapiEl.classList.remove('ipucu');
      kapiEl.insertAdjacentHTML('beforeend', `<div class="teslim">${ESYALAR[g.esya].e}</div>`);
      paketEl.remove();
      this.paketler = this.paketler.filter(id => id !== g.id);
      this.mesaj(`${ilkDeneme ? '+1 ⭐ ' : ''}${g.aciklama}`, true);
      if(!this.paketler.length){ this.kilit = true; this.zaman = setTimeout(() => this.sonrakiSet(), 1800); }
    } else {
      Ses.yanlis();
      this.yanlisSay[g.id] = (this.yanlisSay[g.id]||0) + 1;
      if(this.yanlisSay[g.id] === 1) this.yanlislar.push({metin:`${portreMini(g.sakin)} ${ESYALAR[g.esya].ad}: ${g.aciklama}`});
      kapiEl.classList.remove('titre'); void kapiEl.offsetWidth; kapiEl.classList.add('titre');
      const yanlisK = sakinBul(kime), e = ESYALAR[g.esya];
      this.mesaj(`${e.e} ${e.ad}, ${yanlisK.ad} için gerekli değil. Tekrar dene!`, false);
      if(this.yanlisSay[g.id] >= 2){   // iki yanlıştan sonra doğru kapı parlar
        const dogruKapi = this.el.querySelector(`[data-kapi="${g.sakin}"]`);
        dogruKapi.classList.remove('ipucu'); void dogruKapi.offsetWidth; dogruKapi.classList.add('ipucu');
      }
    }
  },

  mesaj(html, iyi){
    const alan = document.getElementById('a-alan');
    alan.querySelector('.a-mesaj')?.remove();
    clearTimeout(this.mesajZaman);
    alan.insertAdjacentHTML('beforeend', `<div class="a-mesaj ${iyi?'iyi':''}" role="status">${html}</div>`);
    const m = alan.querySelector('.a-mesaj');
    if(Depo.v.sesliOkuma) Konus.oku(m.textContent.replace('+1 ⭐',''));
    this.mesajZaman = setTimeout(() => m.remove(), iyi ? 1700 : 2200);
  },

  sonrakiSet(){
    this.setNo++;
    if(this.setNo < this.setler.length) this.setGoster();
    else this.bitir();
  },

  bitir(){
    Depo.v.enIyi.A = Math.max(Depo.v.enIyi.A||0, this.dogru); Depo.kaydet();
    Ses.fanfar();
    Sahne.git('ozet', {mod:'A', dogru:this.dogru, toplam:12, yanlislar:this.yanlislar});
  },

  durdur(){
    clearTimeout(this.zaman); clearTimeout(this.mesajZaman);
    document.querySelectorAll('.hayalet').forEach(h => h.remove());
    this.surukle = null;
  }
};

/* =========================================================
   E4) MOD C — HERKESE SOR
   Tur: 5 eşya × 4 kişi = 20 seçim; her doğru seçim +1 yıldız
   Tur düzeni: 1 "herkes için ihtiyaç" + 3 "karışık" + 1 (herkes / herkes için istek)
   ========================================================= */
const ModC = {
  el:null, sorular:[], sira:0, dogru:0, yanlislar:[], secimler:[], kontrolEdildi:false,

  kur(el){
    this.el = el;
    el.innerHTML = `
      <div class="ust-bar">
        <button class="geri" data-git="apartman" aria-label="Apartmana dön">←</button>
        <h2>Herkese Sor</h2>
        <div class="yildiz-rozet">⭐ <span class="yildiz-sayi">0</span></div>
      </div>
      <div class="ilerleme" id="c-ilerleme"></div>
      <div class="c-alan" id="c-alan"></div>`;
  },

  turOlustur(){
    const son = new Set(Depo.v.sonC);
    const sec = (havuz, n) => [...karistir(havuz.filter(x=>!son.has(x.id))), ...karistir(havuz.filter(x=>son.has(x.id)))].slice(0,n);
    const herkes = C_SORULAR.filter(x=>x.tur==='herkes'), karisik = C_SORULAR.filter(x=>x.tur==='karisik');
    const h = sec(herkes, 1), k = sec(karisik, 3);
    const kalan = C_SORULAR.filter(x => (x.tur==='istek' || x.tur==='herkes') && !h.includes(x));
    const son5 = sec(kalan, 1);
    // karışık soruyla başla, sonra karıştır
    this.sorular = [k[0], ...karistir([...h, k[1], k[2], ...son5])];
    Depo.v.sonC = [...this.sorular.map(x=>x.id)]; Depo.kaydet();
  },

  yeniTur(){
    this.turOlustur();
    this.sira = 0; this.dogru = 0; this.yanlislar = [];
    this.goster();
  },

  ilerlemeCiz(){
    document.getElementById('c-ilerleme').innerHTML = this.sorular.map((_,i) =>
      `<i class="${i<this.sira ? 'd' : i===this.sira ? 'simdi' : ''}"></i>`).join('');
  },

  goster(){
    const q = this.sorular[this.sira], e = ESYALAR[q.esya];
    this.kisiler = karistir(q.kisiler);
    this.secimler = this.kisiler.map(() => null);
    this.kontrolEdildi = false;
    this.ilerlemeCiz();
    const soru = `${e.ad}, bu komşular için ihtiyaç mı, istek mi?`;
    document.getElementById('c-alan').innerHTML = `
      <div class="c-ust">
        <div class="esya-kart"><div class="emoji">${e.e}</div><div class="ad">${e.ad}</div></div>
        <p class="b-soru">${soru} <button class="sesli" data-oku="${soru} Her komşu için seç." aria-label="Sesli oku">🔊</button></p>
      </div>
      <div class="c-sonuc" id="c-sonuc"></div>
      <div class="c-kartlar">${this.kisiler.map((x,i) => { const k = sakinBul(x.sakin); return `
        <div class="c-kart" data-i="${i}">
          <button class="sesli" data-oku="${k.ad}. ${k.bilgi} ${x.durum}" aria-label="Sesli oku">🔊</button>
          ${portreSVG(x.sakin)}<h3>${k.ad}</h3><div class="bilgi">${k.bilgi}</div><div class="durum">${x.durum}</div>
          <div class="c-secim">
            <button class="ihtiyac" data-sec="ihtiyac">✔ İhtiyaç</button>
            <button class="istek" data-sec="istek">★ İstek</button>
          </div>
        </div>`; }).join('')}</div>
      <button class="dugme mor c-dugme" id="c-dugme" disabled>Kontrol et</button>`;
    Konus.dugmeleriGuncelle();
    this.el.querySelectorAll('.c-kart').forEach(kart => {
      const i = +kart.dataset.i;
      kart.querySelectorAll('[data-sec]').forEach(b => b.onclick = () => {
        if(this.kontrolEdildi) return;
        Ses.tik();
        this.secimler[i] = b.dataset.sec;
        kart.querySelectorAll('[data-sec]').forEach(x => x.classList.toggle('sec', x===b));
        document.getElementById('c-dugme').disabled = this.secimler.some(s => !s);
      });
    });
    document.getElementById('c-dugme').onclick = () => this.kontrolEdildi ? this.sonraki() : this.kontrol();
  },

  kontrol(){
    if(this.secimler.some(s => !s)) return;
    this.kontrolEdildi = true;
    let buSoruDogru = 0;
    this.kisiler.forEach((x,i) => {
      const kart = this.el.querySelector(`.c-kart[data-i="${i}"]`);
      const ok = this.secimler[i] === x.cevap;
      kart.querySelectorAll('[data-sec]').forEach(b => b.disabled = true);
      kart.classList.add(ok ? 'dogru' : 'yanlis');
      kart.insertAdjacentHTML('beforeend', `<div class="rozet">${ok ? '✔' : '✘'}</div>`);
      if(ok){ buSoruDogru++; }
      else {
        const dogruAd = x.cevap === 'ihtiyac' ? '✔ İhtiyaç' : '★ İstek';
        kart.insertAdjacentHTML('beforeend', `<div class="c-aciklama">Doğrusu: ${dogruAd}<br>${x.aciklama}</div>`);
        this.yanlislar.push({metin:`${portreMini(x.sakin)} ${ESYALAR[this.sorular[this.sira].esya].e} ${x.aciklama}`});
      }
    });
    this.dogru += buSoruDogru;
    yildizEkle(buSoruDogru);
    buSoruDogru === 4 ? Ses.dogru() : Ses.yanlis();
    const sonuc = this.sorular[this.sira].sonuc;
    document.getElementById('c-sonuc').textContent = (buSoruDogru ? `+${buSoruDogru} ⭐  ` : '') + sonuc;
    Konus.oku(sonuc.replace(/[^\p{L}\p{N}\s,.!:]/gu,''));
    const d = document.getElementById('c-dugme');
    d.textContent = this.sira === this.sorular.length-1 ? 'Turu bitir ▶' : 'Sonraki ▶';
  },

  sonraki(){
    Ses.tik();
    this.sira++;
    if(this.sira < this.sorular.length){ this.goster(); this.el.scrollTop = 0; }
    else this.bitir();
  },

  bitir(){
    Depo.v.enIyi.C = Math.max(Depo.v.enIyi.C||0, this.dogru); Depo.kaydet();
    Ses.fanfar();
    Sahne.git('ozet', {mod:'C', dogru:this.dogru, toplam:this.sorular.length*4, yanlislar:this.yanlislar});
  }
};

/* =========================================================
   E5) BENİM İHTİYACIM — puansız; çocuk kendisi için 3 ihtiyaç + 3 istek seçer
   Karttaki "Düşünelim" bölümü yargılamaz, yalnızca soru sorar
   ========================================================= */
const AVATARLAR = [
  {ten:'#F5C6A0', sac:'#5D3A1A', stil:'orgu',     renk:'#FF4D8D', arka:'#FFE0EC'},
  {ten:'#E0AC7E', sac:'#212121', stil:'kisa',     renk:'#4D9FFF', arka:'#E3F2FF'},
  {ten:'#8D5524', sac:'#212121', stil:'kivircik', renk:'#FFD600', arka:'#FFF6C9'},
  {ten:'#FFD7B5', sac:'#E07B39', stil:'uzun',     renk:'#00C9A7', arka:'#DFF8F2'},
  {ten:'#C68B59', sac:'#3B2416', stil:'kisa',     renk:'#A855F7', arka:'#F1E6FF'},
  {ten:'#F5C6A0', sac:'#F2C14E', stil:'uzun',     renk:'#FF6B35', arka:'#FFE3D3'}
];
function avatarSVG(i){
  const a = AVATARLAR[i]; let ic = P.arka(a.arka);
  if(a.stil==='uzun') ic += `<path d="M28 40 Q24 66 30 78 H70 Q76 66 72 40 Z" fill="${a.sac}" ${CIZGI}/>`;
  if(a.stil==='orgu') ic += `<circle cx="27" cy="46" r="8" fill="${a.sac}" ${CIZGI}/><circle cx="73" cy="46" r="8" fill="${a.sac}" ${CIZGI}/>`;
  ic += P.govde(a.renk) + P.boyun(a.ten) + P.bas(a.ten);
  if(a.stil==='kivircik') ic += [[34,30],[40,23],[49,20],[58,22],[65,28],[68,36],[32,37]].map(([x,y]) => `<circle cx="${x}" cy="${y}" r="7" fill="${a.sac}" ${CIZGI}/>`).join('') + `<path d="M33 34 Q50 22 67 34 L66 30 Q50 18 34 30 Z" fill="${a.sac}"/>`;
  else ic += `<path d="M30 40 Q30 18 50 20 Q70 18 70 40 Q62 28 50 30 Q40 28 30 40 Z" fill="${a.sac}" ${CIZGI}/>`;
  ic += P.yuz();
  const id = 'av' + (avatarSVG.n = (avatarSVG.n||0) + 1);   // her çizime ayrı kırpma kimliği
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="${id}"><circle cx="50" cy="50" r="48"/></clipPath></defs><g clip-path="url(#${id})">${ic}</g></svg>`;
}
const BENIM_ESYALAR = ['su','ekmek','meyve','sut','ev','yatak','mont','canta','defter','kalem','discircasi','sabun',
                       'gozluk','bisiklet','top','boya','keman','konsol','tablet','ayi','ucurtma','dondurma','cikolata','pasta'];
const COGU_ISTEK  = ['konsol','tablet','ayi','ucurtma','dondurma','cikolata','pasta'];
const HEP_IHTIYAC = ['su','ekmek','meyve','sut','ev','yatak','sabun','discircasi'];

const Benim = {
  el:null, avatar:null, ad:'', ihtiyac:[], istek:[], secilen:null,
  kur(el){
    this.el = el;
    el.innerHTML = `
      <div class="ust-bar">
        <button class="geri" data-git="apartman" aria-label="Apartmana dön">←</button>
        <h2>Benim İhtiyacım</h2>
        <div class="yildiz-rozet">⭐ <span class="yildiz-sayi">0</span></div>
      </div>
      <div class="bn-alan" id="bn-alan"></div>`;
    document.getElementById('bn-pop-ihtiyac').onclick = () => this.ekle('ihtiyac');
    document.getElementById('bn-pop-istek').onclick = () => this.ekle('istek');
    document.getElementById('bn-pop-vazgec').onclick = () => this.popKapat();
  },
  basla(){
    const k = Depo.v.benim;
    this.avatar = k ? k.avatar : null; this.ad = k ? k.ad : ''; this.ihtiyac = []; this.istek = [];
    this.avatarAdimi();
  },

  /* 1. adım: karakter ve isim */
  avatarAdimi(){
    const yon = 'Kendine bir karakter seç.';
    document.getElementById('bn-alan').innerHTML = `
      <p class="yonerge">${yon} <button class="sesli" data-oku="${yon} İstersen adını da yaz." aria-label="Sesli oku">🔊</button></p>
      <div class="av-izgara">${AVATARLAR.map((_,i) => `<button class="av-sec ${this.avatar===i?'sec':''}" data-av="${i}" aria-label="Karakter ${i+1}">${avatarSVG(i)}</button>`).join('')}</div>
      <input class="ad-giris" id="bn-ad" maxlength="14" placeholder="Adın (isteğe bağlı)" value="${this.ad.replace(/"/g,'')}" autocomplete="off">
      <button class="dugme" id="bn-devam" ${this.avatar===null?'disabled style="opacity:.4"':''}>Devam ▶</button>`;
    Konus.dugmeleriGuncelle();
    this.el.querySelectorAll('[data-av]').forEach(b => b.onclick = () => {
      this.avatar = +b.dataset.av; Ses.tik();
      this.el.querySelectorAll('[data-av]').forEach(x => x.classList.toggle('sec', x===b));
      const d = document.getElementById('bn-devam'); d.disabled = false; d.style.opacity = '';
    });
    document.getElementById('bn-devam').onclick = () => {
      if(this.avatar===null) return;
      this.ad = document.getElementById('bn-ad').value.trim(); Ses.tik(); this.secimAdimi();
    };
  },

  /* 2. adım: 3 ihtiyaç + 3 istek */
  secimAdimi(){
    const yon = 'Kendin için 3 ihtiyaç ve 3 istek seç. Bir eşyaya dokun.';
    const yuvalar = tur => [0,1,2].map(i => { const id = this[tur][i];
      return id ? `<div class="yuva dolu" data-cikar="${tur}:${i}" role="button" aria-label="${ESYALAR[id].ad} çıkar"><span class="emoji">${ESYALAR[id].e}</span>${ESYALAR[id].ad}</div>`
                : `<div class="yuva">?</div>`; }).join('');
    const bitti = this.ihtiyac.length===3 && this.istek.length===3;
    document.getElementById('bn-alan').innerHTML = `
      <p class="yonerge">${yon} <button class="sesli" data-oku="${yon}" aria-label="Sesli oku">🔊</button></p>
      <div class="sepetler">
        <div class="sepet ihtiyac"><h3>✔ İhtiyaçlarım (${this.ihtiyac.length}/3)</h3><div class="yuvalar">${yuvalar('ihtiyac')}</div></div>
        <div class="sepet istek"><h3>★ İsteklerim (${this.istek.length}/3)</h3><div class="yuvalar">${yuvalar('istek')}</div></div>
      </div>
      <button class="dugme mor" id="bn-kart" ${bitti?'':'disabled style="opacity:.4"'}>Kartımı göster ▶</button>
      <div class="esya-izgara">${BENIM_ESYALAR.map(id => `<button class="esya-sec" data-bn="${id}" ${this.ihtiyac.includes(id)||this.istek.includes(id)?'disabled':''}>
        <span class="emoji">${ESYALAR[id].e}</span>${ESYALAR[id].ad}</button>`).join('')}</div>`;
    Konus.dugmeleriGuncelle();
    this.el.querySelectorAll('[data-bn]').forEach(b => b.onclick = () => this.popAc(b.dataset.bn));
    this.el.querySelectorAll('[data-cikar]').forEach(y => y.onclick = () => {
      const [tur,i] = y.dataset.cikar.split(':'); this[tur].splice(+i,1); Ses.tik(); this.secimAdimi();
    });
    document.getElementById('bn-kart').onclick = () => { if(this.ihtiyac.length===3 && this.istek.length===3) this.kartAdimi(); };
  },
  popAc(id){
    this.secilen = id; Ses.tik();
    document.getElementById('bn-pop-emoji').textContent = ESYALAR[id].e;
    document.getElementById('bn-pop-ad').textContent = ESYALAR[id].ad;
    document.getElementById('bn-pop-ihtiyac').disabled = this.ihtiyac.length>=3;
    document.getElementById('bn-pop-istek').disabled = this.istek.length>=3;
    document.getElementById('bn-pop').classList.add('goster');
  },
  popKapat(){ document.getElementById('bn-pop').classList.remove('goster'); this.secilen = null; },
  ekle(tur){
    if(!this.secilen || this[tur].length>=3) return;
    this[tur].push(this.secilen); this.popKapat(); Ses.dogru(); this.secimAdimi();
  },

  /* 3. adım: kart + düşündüren sorular (puan yok) */
  kartAdimi(){
    Depo.v.benim = {avatar:this.avatar, ad:this.ad, ihtiyac:[...this.ihtiyac], istek:[...this.istek]}; Depo.kaydet();
    const liste = tur => this[tur].map(id => `<div class="yuva dolu"><span class="emoji">${ESYALAR[id].e}</span>${ESYALAR[id].ad}</div>`).join('');
    const sorular = [
      ...this.ihtiyac.filter(id => COGU_ISTEK.includes(id)).map(id => `🤔 <b>${ESYALAR[id].ad}</b> olmadan da yaşayabilir miydin? Belki bu bir istektir.`),
      ...this.istek.filter(id => HEP_IHTIYAC.includes(id)).map(id => `🤔 <b>${ESYALAR[id].ad}</b> olmadan sağlıklı yaşayabilir miydin? Belki bu bir ihtiyaçtır.`)
    ];
    document.getElementById('bn-alan').innerHTML = `
      <div class="bn-kart">
        <div class="kimlik">${avatarSVG(this.avatar)}<span>${this.ad ? this.ad + ' — ' : ''}Benim Kartım</span></div>
        <div class="sepetler">
          <div class="sepet ihtiyac"><h3>✔ İhtiyaçlarım</h3><div class="yuvalar">${liste('ihtiyac')}</div></div>
          <div class="sepet istek"><h3>★ İsteklerim</h3><div class="yuvalar">${liste('istek')}</div></div>
        </div>
        <div class="dusun">${sorular.length ? '<b>Düşünelim:</b><br>' + sorular.join('<br>') : '👏 Güzel seçimler!'}
          <br>💬 Herkesin istekleri ve ihtiyaçları farklıdır. Kartını bir arkadaşınınkiyle karşılaştır!</div>
      </div>
      <div class="ozet-dugmeler">
        <button class="dugme ikincil" id="bn-yeniden">↻ Yeniden seç</button>
        <button class="dugme" data-git="apartman">🏠 Apartmana Dön</button>
      </div>`;
    Ses.fanfar();
    document.getElementById('bn-yeniden').onclick = () => { Ses.tik(); this.ihtiyac = []; this.istek = []; this.secimAdimi(); };
  }
};

/* =========================================================
   E6) 2 KİŞİLİK DÜELLO — akıllı tahtada iki takım aynı soruya yarışır
   İlk doğru cevap 1 puan; yanlış cevap veren takım o soruda kilitlenir.
   Bu modda yıldız verilmez (paylaşılan tahta).
   ========================================================= */
const Duello = {
  el:null, sorular:[], sira:0, puan:[0,0], kilit:[false,false], cozuldu:false,
  TAKIM:['Yeşil Takım','Pembe Takım'], SORU_SAYISI:10,
  kur(el){
    this.el = el;
    el.innerHTML = `
      <div class="ust-bar">
        <button class="geri" data-git="apartman" aria-label="Apartmana dön">←</button>
        <h2>2 Kişilik Yarış</h2>
        <div class="yildiz-rozet" id="d-sayac">1 / 10</div>
      </div>
      <div class="d-izgara" id="d-alan"></div>`;
  },
  /* 10 soru: 6 tekli (3 ihtiyaç + 3 istek) + 2 karşıtlık çifti; çift yarıları arasında en az 2 soru */
  soruOlustur(){
    const iht = karistir(B_KADEME1.filter(x=>x.cevap==='ihtiyac')).slice(0,3);
    const ist = karistir(B_KADEME1.filter(x=>x.cevap==='istek')).slice(0,3);
    const k = karistir([...iht, ...ist]);
    const adaylar = karistir(B_KARSITLIK);
    const c1 = adaylar[0], c2 = adaylar.find(c => c.esya !== c1.esya);
    const yari = c => { const g = ['ihtiyac','istek'].map(t => ({sakin:c[t].sakin, esya:c.esya, cevap:t, durum:c[t].durum, aciklama:c[t].aciklama}));
                        return Math.random()<.5 ? g : g.reverse(); };
    const [P1,P2] = yari(c1), [Q1,Q2] = yari(c2);
    this.sorular = [k[0], k[1], P1, k[2], Q1, P2, k[3], k[4], Q2, k[5]];
  },
  basla(){
    this.soruOlustur(); this.sira = 0; this.puan = [0,0];
    this.goster();
  },
  takimHTML(t){
    return `<div class="takim t${t}" id="takim${t}">
      <h3>${this.TAKIM[t]}</h3><div class="puan" id="puan${t}">${this.puan[t]}</div>
      <button class="cevap ihtiyac" data-t="${t}" data-c="ihtiyac">✔ İhtiyaç</button>
      <button class="cevap istek" data-t="${t}" data-c="istek">★ İstek</button>
      <div class="durum-t" id="durum${t}"></div></div>`;
  },
  goster(){
    this.kilit = [false,false]; this.cozuldu = false;
    const g = this.sorular[this.sira], k = sakinBul(g.sakin), e = ESYALAR[g.esya];
    document.getElementById('d-sayac').textContent = `${this.sira+1} / ${this.sorular.length}`;
    const okunacak = `${k.ad}. ${k.bilgi} ${g.durum} Eşya: ${e.ad}. İhtiyaç mı, istek mi?`;
    document.getElementById('d-alan').innerHTML = this.takimHTML(0) + `
      <div class="d-orta" id="d-orta">
        <div class="sakin-kart">${portreSVG(g.sakin)}<div><h3>${k.ad}</h3><div class="bilgi">${k.bilgi}</div><div class="durum">${g.durum}</div></div></div>
        <div class="esya-kart"><div class="emoji">${e.e}</div><div class="ad">${e.ad}</div></div>
        <p class="b-soru">${k.kisa} için ihtiyaç mı, istek mi? <button class="sesli" data-oku="${okunacak}" aria-label="Sesli oku">🔊</button></p>
      </div>` + this.takimHTML(1);
    Konus.dugmeleriGuncelle();
    // pointerdown: iki takım aynı anda dokunabilir (çoklu dokunma)
    this.el.querySelectorAll('[data-t]').forEach(b => b.onpointerdown = ev => { ev.preventDefault(); this.cevap(+b.dataset.t, b.dataset.c); });
  },
  cevap(t, c){
    if(this.cozuldu || this.kilit[t]) return;
    const g = this.sorular[this.sira];
    if(c === g.cevap){
      this.cozuldu = true; this.puan[t]++; Ses.dogru();
      document.getElementById('puan'+t).textContent = this.puan[t];
      document.getElementById('takim'+t).classList.add('bildi');
      document.getElementById('durum'+t).textContent = '✔ Bildi! +1';
      this.sonucGoster(`<b>${this.TAKIM[t]}</b> bildi!<br>${g.aciklama}`);
    } else {
      this.kilit[t] = true; Ses.yanlis();
      document.getElementById('takim'+t).classList.add('kilitli');
      document.getElementById('durum'+t).textContent = '✘ Bu soruda bekle';
      if(this.kilit[0] && this.kilit[1]){
        this.cozuldu = true;
        this.sonucGoster(`İki takım da bilemedi.<br>${g.aciklama}`);
      }
    }
  },
  sonucGoster(html){
    const son = this.sira === this.sorular.length-1;
    document.getElementById('d-orta').insertAdjacentHTML('beforeend',
      `<div class="d-sonuc">${html}</div><button class="dugme mor" id="d-sonraki">${son ? 'Sonucu gör 🏆' : 'Sonraki ▶'}</button>`);
    document.getElementById('d-sonraki').onclick = () => { Ses.tik(); this.sira++; this.sira < this.sorular.length ? this.goster() : this.bitir(); };
  },
  bitir(){
    const [a,b] = this.puan;
    const baslik = a===b ? 'Berabere! 🤝' : `${this.TAKIM[a>b?0:1]} kazandı!`;
    Depo.v.enIyi.duello = (Depo.v.enIyi.duello||0) + 1; Depo.kaydet();   // oynanan düello sayısı
    document.getElementById('d-sayac').textContent = '🏆';
    document.getElementById('d-alan').outerHTML = `<div class="d-bitis" id="d-alan">
        <div class="kupa">🏆</div><h3>${baslik}</h3>
        <div class="skorlar"><span style="color:#00a88b">${this.TAKIM[0]}: ${a}</span> &nbsp;—&nbsp; <span style="color:var(--pembe)">${this.TAKIM[1]}: ${b}</span></div>
        <p class="yonerge">Aynı eşya bazen bir kişi için ihtiyaç, başka biri için istektir!</p>
        <div class="ozet-dugmeler"><button class="dugme" id="d-tekrar">↻ Yeni Yarış</button><button class="dugme ikincil" data-git="apartman">🏠 Apartmana Dön</button></div>
      </div>`;
    Ses.fanfar();
    document.getElementById('d-tekrar').onclick = () => { Ses.tik(); this.kur(this.el); this.basla(); };
  }
};

/* Özet listesinde kullanılan küçük portre */
function portreMini(id){ return `<span style="display:inline-block;width:40px;height:40px;vertical-align:middle;margin-right:6px">${portreSVG(id).replace('class="portre"','width="40" height="40"')}</span>`; }

/* =========================================================
   F) SAHNE YÖNETİCİSİ
   ========================================================= */
const Sahne = {
  kayit:{}, aktif:null, onceki:null,
  tanimla(ad, kancalar){ this.kayit[ad] = kancalar||{}; },
  git(ad, param){
    if(ad==='geri') ad = this.onceki || 'giris';
    const yeni = document.getElementById('s-'+ad);
    if(!yeni) return;
    if(this.aktif){
      const eski = document.getElementById('s-'+this.aktif);
      eski.classList.remove('aktif');
      this.kayit[this.aktif]?.cik?.();
      if(this.aktif!=='ayarlar') this.onceki = this.aktif;
    }
    if(Konus.destek) speechSynthesis.cancel();
    yeni.classList.add('aktif'); yeni.scrollTop = 0;
    this.aktif = ad;
    this.kayit[ad]?.gir?.(param);
    yildizGuncelle();
  }
};

/* =========================================================
   G) ORTAK YARDIMCILAR
   ========================================================= */
function yildizGuncelle(){ document.querySelectorAll('.yildiz-sayi').forEach(e => e.textContent = Depo.v.yildiz); }

/* Yıldız ekle; eşiği geçen süsleri aç (tur sonu özetinde duyurulur) */
let bekleyenSusler = [];
function yildizEkle(n){
  if(!n) return;
  Depo.v.yildiz += n;
  SUSLER.forEach(su => {
    if(Depo.v.yildiz >= su.yildiz && !Depo.v.susler.includes(su.id)){ Depo.v.susler.push(su.id); bekleyenSusler.push(su); }
  });
  Depo.kaydet(); yildizGuncelle();
}

/* Apartman ekranı: binayı süsleriyle yeniden çiz, süs çubuğu ve en iyi skorlar */
function apartmaniGuncelle(){
  document.querySelectorAll('[data-bina]').forEach(el => el.innerHTML = binaSVG());
  const acik = Depo.v.susler.length, sirada = SUSLER.find(su => !Depo.v.susler.includes(su.id));
  const onceki = [...SUSLER].reverse().find(su => Depo.v.susler.includes(su.id));
  document.getElementById('sus-yazi').textContent = sirada ? `🎀 Süsler ${acik}/${SUSLER.length} · Sıradaki: ${sirada.e} ${sirada.yildiz}⭐` : `🎀 Tüm süsler açıldı!`;
  const alt = onceki ? onceki.yildiz : 0, ust = sirada ? sirada.yildiz : 1;
  document.getElementById('sus-cubuk').style.width = sirada ? Math.min(100, (Depo.v.yildiz-alt)/(ust-alt)*100)+'%' : '100%';
  const toplam = {A:12, B:8, C:20};
  document.querySelectorAll('[data-eniyi]').forEach(e => { const v = Depo.v.enIyi[e.dataset.eniyi]||0; e.textContent = v ? `En iyi: ${v}/${toplam[e.dataset.eniyi]}` : ''; });
}

function susPaneliAc(){
  document.getElementById('sus-liste').innerHTML = SUSLER.map(su => {
    const acik = Depo.v.susler.includes(su.id);
    return `<div class="sus-ogesi ${acik?'':'kilitli'}"><span class="em">${acik ? su.e : '🔒'}</span><span>${su.ad}<small>${acik ? 'Açıldı!' : su.yildiz+' ⭐ gerekli'}</small></span></div>`;
  }).join('');
  document.getElementById('sus-panel').classList.add('goster'); Ses.tik();
}
document.getElementById('sus-ac').onclick = susPaneliAc;
document.getElementById('sus-kapat').onclick = () => { document.getElementById('sus-panel').classList.remove('goster'); Ses.tik(); };

/* Tur sonu özeti */
let sonMod = 'B';
function ozetGoster({mod, dogru, toplam, yanlislar}){
  sonMod = mod;
  document.getElementById('ozet-skor').textContent = `⭐ ${dogru} / ${toplam}`;
  const susKutu = document.getElementById('ozet-sus');
  susKutu.innerHTML = bekleyenSusler.map(su => `<div class="yeni-sus">🎉 Yeni süs açıldı: ${su.e} ${su.ad}!</div>`).join('');
  if(bekleyenSusler.length) setTimeout(() => Ses.sus(), 500);
  bekleyenSusler = [];
  const liste = document.getElementById('ozet-liste');
  liste.innerHTML = yanlislar.length
    ? '<p class="yonerge" style="justify-content:flex-start">Birlikte bakalım:</p>' +
      yanlislar.map(y => `<div class="ozet-madde">${y.metin}</div>`).join('')
    : '<p class="ozet-tamam">Hepsi doğru! Komşuların çok mutlu. 🎉</p>';
}

/* =========================================================
   H) SAHNE TANIMLARI
   ========================================================= */
Sahne.tanimla('giris', { gir(){ apartmaniGuncelle(); } });
Sahne.tanimla('apartman', { gir(){ apartmaniGuncelle(); } });
Sahne.tanimla('benim', { gir(){ Benim.basla(); }, cik(){ Benim.popKapat(); } });
Sahne.tanimla('duello', { gir(){ Duello.kur(Duello.el); Duello.basla(); } });
Sahne.tanimla('modC', { gir(){ ModC.yeniTur(); } });
Sahne.tanimla('modA', { gir(){ ModA.yeniTur(); }, cik(){ ModA.durdur(); } });
Sahne.tanimla('modB', { gir(){ ModB.yeniTur(); }, cik(){ ModB.durdur(); } });
Sahne.tanimla('ozet', { gir(p){ ozetGoster(p); } });
Sahne.tanimla('ayarlar', { gir(){ ayarlariCiz(); } });

/* =========================================================
   I) AYARLAR
   ========================================================= */
function ayarlariCiz(){
  const a = (el, acik) => { el.classList.toggle('acik', acik); el.textContent = acik ? 'Açık' : 'Kapalı'; };
  a(document.getElementById('ayar-ses'), Depo.v.ses);
  const sesli = document.getElementById('ayar-sesli');
  if(!Konus.destek){ sesli.disabled = true; sesli.textContent = 'Yok'; document.getElementById('sesli-not').textContent = 'Bu cihaz sesli okumayı desteklemiyor'; }
  else a(sesli, Depo.v.sesliOkuma);
}
document.getElementById('ayar-ses').onclick = () => { Depo.v.ses = !Depo.v.ses; Depo.kaydet(); ayarlariCiz(); Ses.tik(); };
document.getElementById('ayar-sesli').onclick = () => {
  Depo.v.sesliOkuma = !Depo.v.sesliOkuma; Depo.kaydet(); ayarlariCiz(); Konus.dugmeleriGuncelle();
  if(Depo.v.sesliOkuma) Konus.oku('Sesli okuma açık.');
};
const onay = document.getElementById('onay');
document.getElementById('ayar-sifirla').onclick = () => onay.classList.add('goster');
document.getElementById('onay-hayir').onclick = () => onay.classList.remove('goster');
document.getElementById('onay-evet').onclick = () => { Depo.sifirla(); bekleyenSusler = []; onay.classList.remove('goster'); yildizGuncelle(); apartmaniGuncelle(); Ses.yanlis(); };

/* =========================================================
   J) GENEL TIKLAMA YÖNETİMİ
   ========================================================= */
document.addEventListener('pointerdown', () => Ses.hazirla(), {passive:true});
document.addEventListener('click', e => {
  const git = e.target.closest('[data-git]');
  if(git){ Ses.tik(); Sahne.git(git.dataset.git); return; }
  const oku = e.target.closest('[data-oku]');
  if(oku){ Konus.oku(oku.dataset.oku); return; }
});
document.getElementById('ozet-tekrar').onclick = () => { Ses.tik(); Sahne.git('mod'+sonMod in Sahne.kayit ? 'mod'+sonMod : sonMod); };

/* =========================================================
   K) BAŞLAT
   ========================================================= */
Depo.yukle();
document.querySelectorAll('[data-bina]').forEach(el => el.innerHTML = binaSVG());
ModB.kur(document.getElementById('s-modB'));
ModA.kur(document.getElementById('s-modA'));
ModC.kur(document.getElementById('s-modC'));
Benim.kur(document.getElementById('s-benim'));
Duello.kur(document.getElementById('s-duello'));
if(Konus.destek) speechSynthesis.getVoices();   // bazı tarayıcılarda sesleri önceden yükler
Konus.dugmeleriGuncelle();
Sahne.git('giris');
</script>
</body>
</html>
