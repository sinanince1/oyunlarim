<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Maden Kâşifi</title>
<style>
/* =========================================================
   1. TEMEL DEĞİŞKENLER VE SAHNE
   ========================================================= */
:root{
  --bg:#1b2a35; --sea1:#2f7393; --sea2:#1d5370;
  --land:#ecd3a0; --landEdge:#b98a4e;
  --ink:#2b2118; --paper:#fdf6e6; --paper2:#f4e7c8;
  --accent:#e0772c; --accentDark:#a9521a;
  --ok:#2f9a58; --bad:#cc5139; --gold:#f2b81f;
  --font:"Trebuchet MS","Segoe UI",Verdana,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--ink);
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:var(--bg)}
.scr{position:absolute;inset:0;display:none}
.scr.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#scr-match.active ~ .footer{display:none}
.footer{position:absolute;right:14px;bottom:6px;font-size:14px;color:rgba(255,255,255,.55);pointer-events:none;z-index:40}
svg{display:block}

/* =========================================================
   2. ORTAK BİLEŞENLER: DÜĞME, ÇİP, BALON
   ========================================================= */
.btn{font-family:var(--font);border:none;cursor:pointer;border-radius:18px;font-weight:700;font-size:26px;padding:14px 28px;
  background:var(--accent);color:#fff;box-shadow:0 6px 0 var(--accentDark);transition:transform .08s, box-shadow .08s;display:inline-flex;align-items:center;gap:10px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--accentDark)}
.btn.big{font-size:38px;padding:20px 54px;border-radius:24px}
.btn.alt{background:#3d7fa6;box-shadow:0 6px 0 #24577a}
.btn.alt:active{box-shadow:0 2px 0 #24577a}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 6px 0 #c9b791}
.btn.ghost:active{box-shadow:0 2px 0 #c9b791}
.btn.green{background:var(--ok);box-shadow:0 6px 0 #1d6b3b}
.btn.red{background:var(--bad);box-shadow:0 6px 0 #8a3020}
.btn.locked{background:#8d8d8d;box-shadow:0 6px 0 #5f5f5f}
.btn svg{width:30px;height:30px}
.iconbtn{width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;background:rgba(255,255,255,.95);
  box-shadow:0 4px 0 rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.iconbtn svg{width:36px;height:36px}
.topbar{position:absolute;left:0;right:0;top:0;height:86px;display:flex;align-items:center;gap:14px;padding:0 20px;
  background:linear-gradient(#14212b,#14212bdd);z-index:10}
.topbar h1{color:#fff4d6;font-size:32px;flex:1;letter-spacing:.5px;white-space:nowrap}
.chip{background:rgba(255,255,255,.12);color:#fff;border-radius:30px;padding:8px 18px;font-size:24px;font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
.chip svg{width:28px;height:28px}
.bubble{background:#fff;border-radius:22px;padding:16px 20px;font-size:23px;line-height:1.35;box-shadow:0 6px 18px rgba(0,0,0,.25);position:relative}
.bubble.ok{background:#e6f7ec;border:3px solid var(--ok)}
.bubble.bad{background:#fdece7;border:3px solid var(--bad)}
.toast{position:absolute;left:50%;top:104px;transform:translateX(-50%);background:var(--gold);color:var(--ink);font-weight:700;font-size:28px;
  padding:14px 30px;border-radius:40px;box-shadow:0 8px 20px rgba(0,0,0,.35);z-index:60;animation:toast 3s ease forwards;pointer-events:none;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-20px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* =========================================================
   3. BAŞLANGIÇ EKRANI
   ========================================================= */
#scr-start{background:linear-gradient(#8fd0ef 0%,#cdebf7 34%,#7fb65a 34%,#6aa047 37%,#b07a4a 37%,#9a6640 55%,#7d5232 55%,#6b4429 75%,#55351f 75%)}
.start-title{position:absolute;left:0;right:0;top:40px;text-align:center}
.start-title h1{font-size:110px;color:#fff6dc;letter-spacing:2px;
  text-shadow:0 5px 0 #a9521a,0 8px 0 #6b3412,0 14px 20px rgba(0,0,0,.35)}
.start-title p{font-size:30px;color:#25455a;font-weight:700;margin-top:6px}
.start-guide{position:absolute;left:70px;bottom:120px;width:220px}
.start-menu{position:absolute;left:0;right:0;top:330px;display:flex;flex-direction:column;align-items:center;gap:22px}
.start-menu .row{display:flex;gap:20px}
.buried{position:absolute;width:86px;height:86px;opacity:.95;filter:drop-shadow(0 4px 3px rgba(0,0,0,.4))}

/* =========================================================
   4. HARİTA EKRANI
   ========================================================= */
#scr-map{background:radial-gradient(ellipse at 50% 40%,var(--sea1),var(--sea2))}
#mapWrap{position:absolute;left:10px;right:10px;top:92px;bottom:8px}
#mapSvg{width:100%;height:100%}
.land{fill:var(--land);stroke:var(--landEdge);stroke-width:3;stroke-linejoin:round}
.seaLabel{fill:#9fd0e6;font-size:24px;font-style:italic;font-weight:700;letter-spacing:3px}
.node{cursor:pointer}
.node .pulse{fill:none;stroke:#fff;stroke-width:3;opacity:.8;animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.7);opacity:0}}
.node .plabel{font-size:19px;font-weight:700;fill:#3a2814;paint-order:stroke;stroke:#fdf3dc;stroke-width:5px;stroke-linejoin:round}
.node .mlabel{font-size:16px;font-weight:700;fill:#a9521a;paint-order:stroke;stroke:#fdf3dc;stroke-width:4px}
.node:active .bodyc{transform:scale(.9)}
.map-guide{position:absolute;left:24px;bottom:22px;width:470px;display:flex;align-items:flex-end;gap:6px;z-index:5;pointer-events:none}
.map-guide .g{width:110px;flex:none}
.map-guide .bubble{font-size:21px;margin-bottom:20px}

/* =========================================================
   5. KAZI (KEŞİF) EKRANI
   ========================================================= */
#scr-dig{background:#2a1d14}
#digArea{position:absolute;left:30px;top:100px;width:600px;height:600px;border-radius:26px;overflow:hidden;cursor:pointer;
  box-shadow:inset 0 0 0 4px rgba(0,0,0,.25);touch-action:none}
#digArea svg.ground{position:absolute;inset:0}
#boulder{transform-box:fill-box;transform-origin:center;transition:transform .1s}
#boulder.shake{animation:shake .25s}
#boulder.broken{animation:breakAway .5s forwards}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px) rotate(-1deg)}75%{transform:translateX(7px) rotate(1deg)}}
@keyframes breakAway{to{transform:scale(1.25);opacity:0}}
.crack{opacity:0;transition:opacity .15s}
.crack.on{opacity:1}
#reveal{position:absolute;left:175px;top:200px;width:250px;height:250px;display:none}
#reveal.show{display:block;animation:rise .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes rise{0%{transform:translateY(80px) scale(.3);opacity:0}100%{transform:none;opacity:1}}
#reveal .rays{position:absolute;inset:-70px;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#reveal .gem{position:absolute;inset:0;filter:drop-shadow(0 10px 8px rgba(0,0,0,.5))}
.pick{position:absolute;width:110px;height:110px;pointer-events:none;transform-origin:80% 80%;animation:swing .3s ease-out forwards;z-index:4}
@keyframes swing{0%{transform:rotate(-55deg);opacity:1}60%{transform:rotate(18deg)}100%{transform:rotate(10deg);opacity:0}}
.dirt{position:absolute;width:14px;height:14px;border-radius:50%;pointer-events:none;z-index:3;animation:dirt .6s ease-out forwards}
@keyframes dirt{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.frag{position:absolute;width:40px;height:34px;background:#8a8378;clip-path:polygon(0 30%,40% 0,100% 20%,85% 100%,15% 90%);pointer-events:none;z-index:3;
  animation:frag .9s ease-in forwards}
@keyframes frag{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
#digSide{position:absolute;left:660px;top:100px;width:590px;height:600px}
.dig-wait{display:flex;flex-direction:column;align-items:center;gap:20px;padding-top:60px}
.dig-wait .g{width:200px}
.taps{display:flex;gap:16px}
.taps span{width:34px;height:34px;border-radius:50%;background:#5a4130;border:3px solid #c9a27a}
.taps span.on{background:var(--gold);border-color:#fff3c4}

/* =========================================================
   6. BİLGİ KARTI
   ========================================================= */
.infocard{background:var(--paper);border-radius:26px;padding:24px 28px;box-shadow:0 12px 30px rgba(0,0,0,.4);animation:cardIn .5s ease}
@keyframes cardIn{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}
.ic-top{display:flex;gap:18px;align-items:center}
.ic-stone{width:120px;height:120px;flex:none;background:var(--paper2);border-radius:22px;padding:8px}
.ic-top h2{font-size:48px;line-height:1}
.ic-place{display:flex;align-items:center;gap:6px;font-size:24px;font-weight:700;color:#7a5530;margin-top:8px}
.ic-place svg{width:26px;height:26px}
.ic-desc{font-size:22px;line-height:1.4;margin:14px 0 10px}
.infocard h3{font-size:22px;color:var(--accentDark);margin-bottom:8px}
.ic-uses{display:flex;gap:14px}
.ic-use{flex:1;background:#fff;border-radius:16px;padding:8px;display:flex;align-items:center;gap:10px;font-size:21px;font-weight:700;border:2px solid #eadbb8}
.ic-use .ico{width:64px;height:64px;flex:none}
.ic-tr{margin-top:14px;background:#fff1ec;border-left:7px solid #d4322c;border-radius:12px;padding:12px 14px;font-size:21px;line-height:1.4}
.ic-tr b{color:#b0241f}
.ic-actions{margin-top:16px;display:flex;justify-content:flex-end}

/* =========================================================
   7. EŞLEŞTİRME EKRANI
   ========================================================= */
#scr-match{background:linear-gradient(#f6ebd2,#ecd9b0)}
#scr-match .topbar{background:#5b3b22}
#items{position:absolute;left:20px;right:20px;top:100px;height:420px;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:18px}
.item{width:270px;height:196px;background:#fff;border-radius:22px;border:4px solid #e2cfa5;box-shadow:0 6px 0 #d2bb8b;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .12s,border-color .12s,background .12s}
.item .ico{width:108px;height:108px}
.item .lbl{font-size:23px;font-weight:700;margin-top:4px;text-align:center;padding:0 8px;line-height:1.1}
.item .slot{position:absolute;right:10px;top:10px;width:58px;height:58px;border-radius:50%;border:3px dashed #c9b083;display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:700;color:#c9b083}
.item.over{transform:scale(1.06);border-color:var(--accent);background:#fff6ea}
.item.sel-target{border-color:#7fb3d1}
.item.done{border-color:var(--ok);background:#effaf2;box-shadow:0 6px 0 #9fd3b0}
.item.done .slot{border:none;width:76px;height:76px;right:6px;top:6px}
.item.done .mname{position:absolute;left:0;right:0;bottom:-2px;text-align:center;font-size:18px;font-weight:700;color:var(--ok)}
.item.shakeX{animation:shakeX .4s}
@keyframes shakeX{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
#tray{position:absolute;left:0;right:0;bottom:0;height:188px;background:#5b3b22;display:flex;align-items:center;padding:0 16px;gap:10px;
  box-shadow:0 -6px 0 #43291a}
#stones{flex:1;display:flex;justify-content:center;gap:10px}
.stone{width:112px;height:160px;border-radius:18px;background:#7a5234;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:grab;touch-action:none;
  border:3px solid #8f6646;transition:transform .12s, background .12s}
.stone .gem{width:92px;height:92px;pointer-events:none}
.stone .nm.long{font-size:17px}
.stone .nm{color:#fff;font-weight:700;font-size:21px;margin-top:2px;pointer-events:none;white-space:nowrap}
.stone.sel{background:#a8734b;border-color:var(--gold);transform:translateY(-10px)}
.stone.hint{animation:hintPulse .9s ease-in-out 3}
@keyframes hintPulse{50%{transform:translateY(-14px) scale(1.08);border-color:var(--gold);background:#a8734b}}
#feedback{width:400px;flex:none;display:flex;align-items:center;gap:6px}
#feedback .g{width:82px;flex:none}
#feedback .bubble{font-size:20px;flex:1;padding:12px 14px;min-height:90px;display:flex;align-items:center}
.dragghost{position:absolute;width:100px;height:100px;pointer-events:none;z-index:50;filter:drop-shadow(0 10px 8px rgba(0,0,0,.4))}
.dragghost.fly{transition:left .32s ease, top .32s ease, transform .32s ease, opacity .32s}

/* =========================================================
   8. TUR ÖZETİ, DEFTER, AYARLAR, MODAL
   ========================================================= */
#scr-summary{background:radial-gradient(circle at 50% 30%,#3e6d88,#1b2a35)}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--paper);border-radius:30px;padding:30px 40px;
  box-shadow:0 16px 40px rgba(0,0,0,.45)}
.sum-panel{width:900px;max-height:660px;display:flex;flex-direction:column;align-items:center}
.sum-panel h2{font-size:46px}
.stars{display:flex;gap:14px;margin:14px 0}
.stars svg{width:84px;height:84px}
.stars .pop{animation:starPop .5s cubic-bezier(.2,1.8,.4,1) both}
@keyframes starPop{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.sum-line{font-size:26px;font-weight:700;margin-bottom:10px}
.mist{width:100%;max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:10px;margin:6px 0 16px}
.mist .m{display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:8px 14px;border:2px solid #eadbb8}
.mist .m .ico{width:58px;height:58px;flex:none}
.mist .m .tx{font-size:20px;line-height:1.35}
.mist .m .tx b{font-size:22px}
.btnrow{display:flex;gap:20px;justify-content:center}

#scr-book{background:linear-gradient(#5b3b22,#3e2716)}
#bookGrid{position:absolute;left:30px;right:30px;top:110px;bottom:40px;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(2,1fr);gap:18px}
.bcard{background:var(--paper);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:10px;
  box-shadow:0 6px 0 #2a190d;border:4px solid #e8d4a8;text-align:center}
.bcard:active{transform:translateY(3px)}
.bcard .ico{width:120px;height:120px}
.bcard .t{font-size:23px;font-weight:700;margin-top:6px;line-height:1.1}
.bcard .s{font-size:18px;color:#7a5530;font-weight:700;margin-top:3px}
.bcard.locked{background:#6e5340;border-color:#7d604a;cursor:default}
.bcard.locked .t,.bcard.locked .s{color:#d6c2a8}
.bcard.special{border-color:var(--gold)}

#scr-settings{background:radial-gradient(circle at 50% 30%,#3e6d88,#1b2a35)}
.set-panel{width:640px;display:flex;flex-direction:column;gap:26px;align-items:stretch}
.set-panel h2{font-size:44px;text-align:center}
.set-row{display:flex;align-items:center;justify-content:space-between;font-size:28px;font-weight:700;background:#fff;border-radius:18px;padding:16px 22px}
.toggle{width:110px;height:56px;border-radius:30px;background:#bbb;position:relative;cursor:pointer;border:none;transition:background .2s}
.toggle::after{content:"";position:absolute;left:5px;top:5px;width:46px;height:46px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.toggle.on{background:var(--ok)}
.toggle.on::after{left:59px}
.set-foot{text-align:center;font-size:20px;color:#7a5530}

.modal{position:absolute;inset:0;background:rgba(10,18,24,.72);z-index:70;display:flex;align-items:center;justify-content:center}
.modal.hidden{display:none}
.modal-box{background:var(--paper);border-radius:30px;padding:30px 36px;max-width:1080px;max-height:680px;overflow:auto;position:relative;box-shadow:0 16px 40px rgba(0,0,0,.5);animation:pop .3s ease}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.modal-box .infocard{box-shadow:none;padding:0;background:transparent;animation:none;width:640px}
.mclose{position:absolute;right:16px;top:16px;width:56px;height:56px}
.intro{display:flex;gap:30px;align-items:center;width:960px}
.intro .g{width:230px;flex:none}
.intro .body{flex:1}
.intro .bubble{font-size:28px;line-height:1.45;padding:24px 28px}
.intro .pic{display:flex;gap:14px;justify-content:center;margin:18px 0}
.intro .pic svg{width:120px;height:120px}
.intro .navrow{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.dots{display:flex;gap:10px}
.dots span{width:16px;height:16px;border-radius:50%;background:#d8c49b}
.dots span.on{background:var(--accent)}
.lvls{display:flex;gap:24px;margin-top:20px}
.lvl{width:270px;background:#fff;border-radius:22px;border:4px solid #e2cfa5;padding:20px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;box-shadow:0 6px 0 #d2bb8b}
.lvl:active{transform:translateY(3px)}
.lvl h3{font-size:34px}
.lvl .d{font-size:21px;color:#7a5530;font-weight:700;text-align:center}
.lvl .stars svg{width:46px;height:46px}
.lvl .stars{margin:4px 0;gap:6px}
.lvl.locked{background:#e9e2d3;cursor:default;opacity:.85}
.lvl .lk{width:50px;height:50px}
.zen{width:900px}
.zen h2{font-size:40px;text-align:center;margin-bottom:10px}
.zen .wrap{display:flex;gap:20px;align-items:center}
.zen .mini{width:470px;flex:none;background:#2f7393;border-radius:20px;padding:8px}
.zen ul{list-style:none;display:flex;flex-direction:column;gap:6px;flex:1}
.zen li{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:700;background:#fff;border-radius:12px;padding:4px 10px}
.zen li svg{width:44px;height:44px}
.zen li span{color:#7a5530;font-weight:400}
.zen p{font-size:23px;line-height:1.45;margin-top:14px;text-align:center}
.confirm{width:560px;text-align:center}
.confirm h2{font-size:36px;margin-bottom:14px}
.confirm p{font-size:24px;margin-bottom:24px}

/* =========================================================
   9. YÖN UYARISI (telefon/tablet dikey)
   ========================================================= */
#rotate{display:none;position:fixed;inset:0;z-index:999;background:var(--bg);color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  font-family:var(--font);font-size:24px;font-weight:700;text-align:center;padding:30px}
#rotate svg{width:110px;height:110px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:1024px){#rotate{display:flex}}
</style>
</head>
<body>

<div id="rotate">
  <svg viewBox="0 0 100 100"><rect x="30" y="10" width="40" height="80" rx="8" fill="none" stroke="#fff" stroke-width="6"/><circle cx="50" cy="80" r="4" fill="#fff"/></svg>
  <div>Lütfen cihazını yan çevir.</div>
</div>

<div id="stage">

  <!-- ===== EKRAN 1: BAŞLANGIÇ ===== -->
  <section id="scr-start" class="scr active">
    <div id="buriedLayer"></div>
    <div class="start-title">
      <h1>Maden Kâşifi</h1>
      <p>Türkiye'nin toprak altı zenginliklerini keşfet!</p>
    </div>
    <div class="start-guide" id="startGuide"></div>
    <div class="start-menu">
      <button class="btn big" id="btnStart"></button>
      <div class="row">
        <button class="btn ghost" id="btnBookStart"></button>
        <button class="btn ghost" id="btnSetStart"></button>
      </div>
    </div>
  </section>

  <!-- ===== EKRAN 2: HARİTA ===== -->
  <section id="scr-map" class="scr">
    <div class="topbar">
      <button class="iconbtn" id="mapHome" aria-label="Ana sayfa"></button>
      <h1>Maden Haritası</h1>
      <div class="chip" id="chipMines"></div>
      <div class="chip" id="chipFossils"></div>
      <div class="chip" id="chipStars"></div>
      <button class="btn alt" id="btnBook"></button>
      <button class="btn" id="btnMatch"></button>
    </div>
    <div id="mapWrap"></div>
    <div class="map-guide"><div class="g" id="mapGuideImg"></div><div class="bubble" id="mapBubble"></div></div>
  </section>

  <!-- ===== EKRAN 3: KAZI / KEŞİF ===== -->
  <section id="scr-dig" class="scr">
    <div class="topbar">
      <button class="iconbtn" id="digBack" aria-label="Haritaya dön"></button>
      <h1 id="digTitle"></h1>
    </div>
    <div id="digArea"></div>
    <div id="digSide"></div>
  </section>

/* =========================================================
   3. SES (Web Audio API, dosya yok)
   ========================================================= */
let AC = null, noiseBuf = null;
function ac(){
  if(!S.sound) return null;
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function tone(f, t0, dur, type='sine', vol=.18, f2){
  const a = ac(); if(!a) return;
  const t = a.currentTime + t0, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2, t+dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05);
}
function noise(t0, dur, vol=.25, freq=1200){
  const a = ac(); if(!a) return;
  if(!noiseBuf){ noiseBuf = a.createBuffer(1, a.sampleRate*.5, a.sampleRate); const d = noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const t = a.currentTime+t0, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = noiseBuf; f.type='bandpass'; f.frequency.value=freq; f.Q.value=.8;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f).connect(g).connect(a.destination); s.start(t); s.stop(t+dur);
}

function buildMap(){
  let h = `<svg id="mapSvg" viewBox="-40 -55 1110 560" preserveAspectRatio="xMidYMid meet">
  <defs><pattern id="soil" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="5" cy="6" r="1.6" fill="#d6b77e"/><circle cx="16" cy="15" r="1.2" fill="#d6b77e"/></pattern>
  <filter id="sh"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0c2a3a" flood-opacity=".5"/></filter></defs>
  <text class="seaLabel" x="430" y="-22">KARADENİZ</text>
  <text class="seaLabel" x="560" y="490">AKDENİZ</text>
  <text class="seaLabel" x="-10" y="250" transform="rotate(-90 -10 250)">EGE DENİZİ</text>
  <path d="${TR_PATH}" class="land" filter="url(#sh)"/>
  <path d="${TR_PATH}" fill="url(#soil)" stroke="none"/>`;
  // Fosil noktaları
  FOSSILS.forEach(f=>{
    const [x,y] = proj(f.lon,f.lat), got = S.fossils.includes(f.id);
    h += `<g class="node" data-kind="fossil" data-id="${f.id}" transform="translate(${x} ${y})">
      <circle r="20" fill="transparent"/>
      ${got ? `<g transform="translate(-20 -20) scale(.4)">${fossilSVG(f.id).replace('<svg viewBox="0 0 100 100">','<g>').replace('</svg>','</g>')}</g>`
            : `<circle r="16" fill="#cbb58e" stroke="#8f7a5c" stroke-width="2.5" stroke-dasharray="5 4"/><text y="7" text-anchor="middle" font-size="22" font-weight="700" fill="#6b5634">?</text>`}
    </g>`;
  });
  // Maden noktaları
  MINES.forEach(m=>{
    const [x,y] = proj(m.lon,m.lat), got = S.found.includes(m.id);
    const [lx,ly,anc] = m.lab;
    h += `<g class="node" data-kind="mine" data-id="${m.id}" transform="translate(${x} ${y})">
      ${got?'':'<circle class="pulse" r="17"/>'}
      <circle r="19" fill="${got?'#fff8e6':'#e0772c'}" stroke="${got?'#2f9a58':'#fff'}" stroke-width="3"/>
      ${got ? `<g transform="translate(-16 -16) scale(.32)">${stoneSVG(m.id).replace(/^<svg viewBox="0 0 100 100">/,'<g>').replace(/<\/svg>$/,'</g>')}</g>`
            : `<g transform="translate(-13 -13) scale(.65)">${IC.pick.replace('<svg viewBox="0 0 40 40">','<g>').replace('</svg>','</g>')}</g>`}
      <text class="plabel" x="${lx}" y="${ly}" text-anchor="${anc}">${m.il}</text>
      ${got?`<text class="mlabel" x="${lx}" y="${ly+19}" text-anchor="${anc}">${m.ad}</text>`:''}
    </g>`;
  });
  h += '</svg>';
  return h;
}

const $ = id => document.getElementById(id);
const stage = $('stage');
let scale = 1;
function fit(){
  scale = Math.min(innerWidth/1280, innerHeight/720);
  stage.style.transform = `translate(${(innerWidth-1280*scale)/2}px,${(innerHeight-720*scale)/2}px) scale(${scale})`;
}
addEventListener('resize', fit); fit();
function show(name){
  document.querySelectorAll('.scr').forEach(s=>s.classList.remove('active'));
  $('scr-'+name).classList.add('active');
  if(name==='map') renderMap();
  if(name==='book') renderBook();
  if(name==='settings') renderSettings();
}
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; stage.appendChild(t); setTimeout(()=>t.remove(),3100); }
function openModal(html){ $('modalBox').innerHTML = html; $('modal').classList.remove('hidden'); }
function closeModal(){ $('modal').classList.add('hidden'); $('modalBox').innerHTML=''; }
function closeBtn(){ return `<button class="iconbtn mclose" onclick="SFX.click();closeModal()" aria-label="Kapat">${IC.close}</button>`; }
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
function rectStage(el){ const r=el.getBoundingClientRect(), s=stage.getBoundingClientRect(); return { x:(r.left-s.left)/scale, y:(r.top-s.top)/scale, w:r.width/scale, h:r.height/scale }; }
function toStage(e){ const s=stage.getBoundingClientRect(); return { x:(e.clientX-s.left)/scale, y:(e.clientY-s.top)/scale }; }

function totalStars(){ return S.stars[1]+S.stars[2]+S.stars[3]; }
function renderMap(){
  $('mapWrap').innerHTML = buildMap();
  $('mapHome').innerHTML = IC.home;
  $('chipMines').innerHTML = IC.gem + `Madenler ${S.found.length}/7`;
  $('chipFossils').innerHTML = IC.fossil + `Fosiller ${S.fossils.length}/3`;
  $('chipStars').innerHTML = starSVG(true) + `${totalStars()}/9`;
  $('btnBook').innerHTML = IC.book.replace('fill="#fff"','fill="none"') + 'Defter';
  $('btnBook').style.color = '#fff';
  const open = S.found.length >= 3;
  $('btnMatch').innerHTML = (open ? IC.match : IC.lock.replace(/#7d7d7d/g,'#fff')) + 'Eşleştir';
  $('btnMatch').classList.toggle('locked', !open);
  $('mapGuideImg').innerHTML = guideSVG();
  const n = S.found.length;
  let msg;
  if(n===0) msg = 'Kazma işaretli bir ile dokun ve kazı yap!';
  else if(n<3) msg = `Harika! <b>${3-n} maden</b> daha bul, eşleştirme oyunu açılsın.`;
  else if(n<7) msg = 'Eşleştirme oyunu açık! Daha çok maden bulursan yeni seviyeler açılır.';
  else if(S.fossils.length<3) msg = 'Bütün madenleri buldun! Soru işaretli gizli noktalarda neler saklı?';

let dig = null;
function groundSVG(){
  let pebbles = '';
  for(let i=0;i<26;i++){ const x=(i*97)%580+10, y=120+((i*53)%460); pebbles += `<ellipse cx="${x}" cy="${y}" rx="${4+(i%4)*2}" ry="${3+(i%3)*1.5}" fill="#000" opacity=".12"/>`; }

   <path d="M0 206 Q150 222 300 214 T600 210 V340 Q420 326 300 344 T0 336 Z" fill="#9a6640"/>
   <path d="M0 336 Q150 352 300 344 T600 340 V470 Q430 456 300 474 T0 466 Z" fill="#7d5232"/>
   <path d="M0 466 Q150 482 300 474 T600 470 V600 H0 Z" fill="#62402a"/>
   ${pebbles}
   <g id="boulder">
     <path d="M150 360 L176 250 L260 200 L360 206 L440 258 L456 360 L404 430 L290 448 L196 430 Z" fill="#8a8378" stroke="#5e584f" stroke-width="5" stroke-linejoin="round"/>
     <path d="M176 250 L260 200 L360 206 L300 300 Z" fill="#fff" opacity=".14"/>
     <path d="M300 300 L456 360 L404 430 L290 448 Z" fill="#000" opacity=".14"/>
     <path class="crack" d="M300 300 L270 270 L282 240 L262 214" fill="none" stroke="#3a352f" stroke-width="5" stroke-linecap="round"/>
     <path class="crack" d="M300 300 L344 316 L360 360 L400 380 M300 300 L240 330 L214 380" fill="none" stroke="#3a352f" stroke-width="5" stroke-linecap="round"/>
     <path class="crack" d="M300 300 L320 250 L380 236 M240 330 L250 400 L280 440 M344 316 L420 300" fill="none" stroke="#3a352f" stroke-width="5" stroke-linecap="round"/>
   </g>
  </svg>`;
}
function openDig(kind, id){
  const isMine = kind==='mine', obj = isMine ? MB[id] : FB[id];
  const already = isMine ? S.found.includes(id) : S.fossils.includes(id);
  dig = { kind, id, taps:0, done:already, revisit:already };
  $('digBack').innerHTML = IC.back;
  $('digTitle').textContent = isMine ? `${locative(obj.il)} kazı yapıyorsun` : 'Gizli bir noktada kazı yapıyorsun';
  const art = $('digArea');
  art.innerHTML = groundSVG() + `<div id="reveal"><svg class="rays" viewBox="0 0 100 100">${raysSVG()}</svg><div class="gem">${isMine?stoneSVG(id):fossilSVG(id)}</div></div>`;
  if(already){
    $('boulder').style.display='none';
    $('reveal').classList.add('show');
    showInfo();
  } else {
    $('digSide').innerHTML = `<div class="dig-wait"><div class="g">${guideSVG()}</div>
      <div class="bubble" style="font-size:28px;text-align:center">Kayaya <b>3 kez</b> dokun ve kaz!<br>İçinde ne saklı acaba?</div>
      <div class="taps"><span></span><span></span><span></span></div></div>`;
  }
  art.onpointerdown = digTap;
  show('dig');
}
// Türkçe bulunma eki: Uşak'ta, Kütahya'da, Artvin'de, Eskişehir'de ...
function locative(w){
  const vowels = w.toLocaleLowerCase('tr').match(/[aeıioöuü]/g); const last = vowels[vowels.length-1];
  const back = 'aıou'.includes(last);
  const hard = 'fstkçşhp'.includes(w.slice(-1).toLocaleLowerCase('tr'));
  return `${w}'${hard?'t':'d'}${back?'a':'e'}`;
}
function raysSVG(){ let r=''; for(let i=0;i<12;i++) r+=`<path d="M50 50 L${50+60*Math.cos(i*Math.PI/6-.12)} ${50+60*Math.sin(i*Math.PI/6-.12)} L${50+60*Math.cos(i*Math.PI/6+.12)} ${50+60*Math.sin(i*Math.PI/6+.12)} Z" fill="#ffe27a" opacity=".35"/>`; return r; }
function digTap(e){
  if(!dig || dig.done) return;
  const r = rectStage($('digArea')), p = toStage(e), x = p.x - r.x, y = p.y - r.y;
  // kazma animasyonu
  const pk = document.createElement('div'); pk.className='pick'; pk.innerHTML = IC.pick;
  pk.style.left=(x-88)+'px'; pk.style.top=(y-88)+'px'; $('digArea').appendChild(pk); setTimeout(()=>pk.remove(),350);
  for(let i=0;i<7;i++){ const d=document.createElement('div'); d.className='dirt'; d.style.left=x+'px'; d.style.top=y+'px';
    d.style.background = pick(['#7d5232','#9a6640','#5e584f','#b07a4a']);
    d.style.setProperty('--dx',(Math.random()*120-60)+'px'); d.style.setProperty('--dy',(-Math.random()*90-10)+'px');
    $('digArea').appendChild(d); setTimeout(()=>d.remove(),650); }
  dig.taps++;
  SFX.dig();
  const b = $('boulder'); b.classList.remove('shake'); void b.getBBox(); b.classList.add('shake');
  document.querySelectorAll('#boulder .crack').forEach((c,i)=>c.classList.toggle('on', i<dig.taps));
  document.querySelectorAll('.taps span').forEach((s,i)=>s.classList.toggle('on', i<dig.taps));
  if(dig.taps>=3){ dig.done = true; setTimeout(breakBoulder, 250); }
}
function breakBoulder(){
  SFX.crash();
  $('boulder').classList.add('broken');
  for(let i=0;i<10;i++){ const f=document.createElement('div'); f.className='frag'; f.style.left=(280+Math.random()*40)+'px'; f.style.top=(300+Math.random()*40)+'px';
    const a=Math.random()*Math.PI*2; f.style.setProperty('--dx',Math.cos(a)*260+'px'); f.style.setProperty('--dy',(Math.sin(a)*200+120)+'px'); f.style.setProperty('--r',(Math.random()*400-200)+'deg');
    $('digArea').appendChild(f); setTimeout(()=>f.remove(),950); }
  const d = dig;
  setTimeout(()=>{
    if(dig!==d) return; // oyuncu bu arada çıktıysa
    $('reveal').classList.add('show'); SFX.found();
    // Bulunanı hemen kaydet
    const firstThree = dig.kind==='mine' && S.found.length===2;
    if(dig.kind==='mine'){ if(!S.found.includes(dig.id)) S.found.push(dig.id); }
    else if(!S.fossils.includes(dig.id)) S.fossils.push(dig.id);
    save();
    dig.unlockToast = firstThree;
    showInfo();
  }, 450);
}

/* =========================================================
   11. EŞLEŞTİRME (SÜRÜKLE-BIRAK + DOKUN-DOKUN)
   ========================================================= */
let R = null, drag = null;
function startRound(lv){
  const L = LEVELS[lv];
  const lw = S.lastWrong;
  // Son turda yanlış yapılan nesnelerin madenleri öncelikli
  const pri = shuffle(S.found.filter(m=>MB[m].kullanim.some(i=>lw.includes(i))));
  const rest = shuffle(S.found.filter(m=>!pri.includes(m)));
  const mines = pri.concat(rest).slice(0, L.mines);
  let items;
  if(lv<3){
    items = mines.map(m=>{ const u=MB[m].kullanim, w=u.filter(i=>lw.includes(i)); return pick(w.length?w:u); });
  } else {
    const all = Object.keys(ITEMS).filter(i=>S.found.includes(ITEMS[i].maden));
    const w = shuffle(all.filter(i=>lw.includes(i))), r = shuffle(all.filter(i=>!w.includes(i)));
    items = w.concat(r).slice(0, L.items);
  }
  R = { lv, mines:shuffle(mines), items:shuffle(items), done:{}, wrong:{}, mistakes:0, sel:null, over:false };
  renderRound();
  show('match');
}
function renderRound(){
  $('matchBack').innerHTML = IC.back;
  $('matchTitle').textContent = `Eşleştir — ${LEVELS[R.lv].ad}`;
  $('items').innerHTML = R.items.map(i=>`<div class="item" data-id="${i}"><div class="slot">?</div><div class="ico">${itemSVG(i)}</div><div class="lbl">${ITEMS[i].ad}</div></div>`).join('');
  $('stones').innerHTML = R.mines.map(m=>`<div class="stone" data-id="${m}"><div class="gem">${stoneSVG(m)}</div><div class="nm${MB[m].ad.length>7?' long':''}">${MB[m].ad}</div></div>`).join('');
  $('fbGuide').innerHTML = guideSVG();
  feedback('Maden taşını sürükle, onu kullanıldığı yere bırak!', '');
  updateProg();
  document.querySelectorAll('.stone').forEach(s=>{
    s.addEventListener('pointerdown', stoneDown);
    s.addEventListener('pointermove', stoneMove);
    s.addEventListener('pointerup', stoneUp);
    s.addEventListener('pointercancel', stoneCancel);
  });
  document.querySelectorAll('.item').forEach(it=>it.addEventListener('click', ()=>itemTap(it.dataset.id)));
}
function updateProg(){ $('matchProg').textContent = `${Object.keys(R.done).length} / ${R.items.length}`; }
function feedback(html, cls){ const b=$('fbText'); b.className='bubble '+(cls||''); b.innerHTML=html; }
function stoneEl(id){ return document.querySelector(`.stone[data-id="${id}"]`); }
function itemEl(id){ return document.querySelector(`.item[data-id="${id}"]`); }
function makeGhost(id,x,y){ const g=document.createElement('div'); g.className='dragghost'; g.innerHTML=stoneSVG(id); g.style.left=(x-50)+'px'; g.style.top=(y-50)+'px'; stage.appendChild(g); return g; }
function itemUnder(e){ const el = document.elementFromPoint(e.clientX, e.clientY); const it = el && el.closest && el.closest('.item'); return it && !it.classList.contains('done') ? it : null; }

function stoneDown(e){
  if(!R || R.over) return;
  e.preventDefault();
  const el = e.currentTarget; el.setPointerCapture(e.pointerId);
  const p = toStage(e);
  drag = { id:el.dataset.id, el, sx:p.x, sy:p.y, moved:false, ghost:null, pid:e.pointerId, over:null };
}
function stoneMove(e){
  if(!drag || e.pointerId!==drag.pid) return;
  const p = toStage(e);
  if(!drag.moved && Math.hypot(p.x-drag.sx, p.y-drag.sy) > 10){
    drag.moved = true; drag.ghost = makeGhost(drag.id, p.x, p.y); clearSel();
  }
  if(drag.ghost){
    drag.ghost.style.left=(p.x-50)+'px'; drag.ghost.style.top=(p.y-50)+'px';
    const it = itemUnder(e);
    if(drag.over && drag.over!==it) drag.over.classList.remove('over');
    if(it) it.classList.add('over');
    drag.over = it;
  }
}
function stoneUp(e){
  if(!drag || e.pointerId!==drag.pid) return;
  const d = drag; drag = null;
  if(d.over) d.over.classList.remove('over');
  if(!d.moved){ toggleSel(d.id); return; }
  const it = itemUnder(e);
  if(it) attempt(d.id, it.dataset.id, d.ghost);
  else returnGhost(d.ghost, d.id);
}
function stoneCancel(){ if(drag){ if(drag.ghost) drag.ghost.remove(); if(drag.over) drag.over.classList.remove('over'); drag=null; } }
function returnGhost(g, id){
  const r = rectStage(stoneEl(id));
  g.classList.add('fly'); g.style.left=(r.x+r.w/2-50)+'px'; g.style.top=(r.y+r.h/2-60)+'px'; g.style.opacity='0';
  setTimeout(()=>g.remove(), 340);
}
function clearSel(){ R.sel=null; document.querySelectorAll('.stone.sel').forEach(s=>s.classList.remove('sel')); }
function toggleSel(id){
  SFX.click();
  if(R.sel===id){ clearSel(); feedback('Maden taşını sürükle, onu kullanıldığı yere bırak!',''); return; }
  clearSel(); R.sel=id; stoneEl(id).classList.add('sel');
  feedback(`<b>${MB[id].ad}</b> seçildi. Şimdi onun kullanıldığı nesneye dokun.`, '');
}
function itemTap(itemId){
  if(!R || R.over || R.done[itemId]) return;
  if(!R.sel){ feedback('Önce aşağıdan bir maden taşı seç ya da taşı sürükle.', ''); return; }
  const id = R.sel, r = rectStage(stoneEl(id));
  clearSel();
  const g = makeGhost(id, r.x+r.w/2, r.y+r.h/2-14);
  attempt(id, itemId, g);
}
function attempt(mineId, itemId, ghost){
  const it = itemEl(itemId), item = ITEMS[itemId];
  const tr = rectStage(it.querySelector('.slot'));
  if(item.maden === mineId){
    // DOĞRU
    R.done[itemId] = true;
    ghost.classList.add('fly'); ghost.style.left=(tr.x+tr.w/2-50)+'px'; ghost.style.top=(tr.y+tr.h/2-50)+'px'; ghost.style.transform='scale(.75)';
    setTimeout(()=>{
      ghost.remove();
      it.classList.add('done');
      it.querySelector('.slot').innerHTML = stoneSVG(mineId);
      it.insertAdjacentHTML('beforeend', `<div class="mname">${MB[mineId].ad}</div>`);
    }, 330);
    SFX.correct();
    feedback(`<span><b>Doğru!</b> ${item.aciklama}</span>`, 'ok');
    updateProg();
    if(Object.keys(R.done).length === R.items.length){ R.over = true; setTimeout(endRound, 2200); }
  } else {
    // YANLIŞ — taş geri seker, ipucu verilir
    R.mistakes++; R.wrong[itemId] = (R.wrong[itemId]||0)+1;
    SFX.wrong();
    it.classList.remove('shakeX'); void it.offsetWidth; it.classList.add('shakeX');
    returnGhost(ghost, mineId);
    if(R.wrong[itemId] >= 2){
      const right = MB[item.maden];
      feedback(`<span>${MB[mineId].yanlis} <b>${item.ad}</b> için doğru maden: <b>${right.ad}</b>. Haydi, onu sürükle!</span>`, 'bad');
      const s = stoneEl(item.maden); if(s){ s.classList.remove('hint'); void s.offsetWidth; s.classList.add('hint'); }
    } else {
      feedback(`<span>${MB[mineId].yanlis} <b>İpucu:</b> ${item.ipucu}</span>`, 'bad');
    }
  }
}
function endRound(){
  const n = R.items.length;
  const first = R.items.filter(i=>!R.wrong[i]).length;
  const stars = R.mistakes===0 ? 3 : R.mistakes<=2 ? 2 : 1;
  if(stars > S.stars[R.lv]) S.stars[R.lv] = stars;
  S.lastWrong = R.items.filter(i=>R.wrong[i]);
  save();
  const wrongs = R.items.filter(i=>R.wrong[i]);
  const title = stars===3 ? 'Mükemmel!' : stars===2 ? 'Çok iyi!' : 'Tamamladın!';
  $('sumPanel').innerHTML = `<h2>${title}</h2><div class="stars">${starsRow(stars,true)}</div>
    <div class="sum-line">İlk denemede doğru: ${first} / ${n}</div>
    ${wrongs.length ? `<div style="font-size:22px;font-weight:700;color:var(--accentDark);align-self:flex-start">Bunları birlikte hatırlayalım:</div>
      <div class="mist">${wrongs.map(i=>`<div class="m"><div class="ico">${itemSVG(i)}</div><div class="ico">${stoneSVG(ITEMS[i].maden)}</div>
        <div class="tx"><b>${ITEMS[i].ad} → ${MB[ITEMS[i].maden].ad}</b><br>${ITEMS[i].aciklama}</div></div>`).join('')}</div>`
      : `<p style="font-size:24px;margin:10px 0 20px">Hiç hata yapmadan bütün madenleri doğru yere yerleştirdin!</p>`}
    <div class="btnrow"><button class="btn alt" id="sumMap">Haritaya Dön</button><button class="btn" id="sumAgain">${IC.redo}Tekrar Oyna</button></div>`;
  show('summary');
  SFX.end();
  document.querySelectorAll('#sumPanel .stars .pop').forEach((s,i)=>{ s.style.animationDelay=(i*.25+.2)+'s'; setTimeout(SFX.star, 450+i*250); });
  $('sumMap').onclick = ()=>{ SFX.click(); R=null; show('map'); };
  $('sumAgain').onclick = ()=>{ SFX.click(); startRound(R.lv); };
}
function initMatch(){ $('matchBack').onclick = ()=>{ SFX.click(); stoneCancel(); R=null; show('map'); }; }

  document.querySelectorAll('.bcard:not(.locked)').forEach(c=>c.onclick = ()=>{
    SFX.click();
    const k = c.dataset.k, id = c.dataset.id;
    if(k==='mine') openModal(closeBtn()+`<div class="infocard">${mineCardHTML(id)}</div>`);
    if(k==='fossil') openModal(closeBtn()+`<div class="infocard">${fossilCardHTML(id)}</div>`);
    if(k==='zen') openModal(closeBtn()+zenginlikHTML());
    if(k==='concept') openModal(closeBtn()+`<div class="infocard"><h2 style="font-size:42px;margin-bottom:12px">Kayaç ve Maden</h2>
      <div style="display:flex;gap:20px;align-items:center"><div class="ic-stone">${pebbleSVG()}</div><p class="ic-desc">Yer kabuğunu oluşturan katı ve sert parçalara <b>kayaç</b> denir.</p></div>
      <div style="display:flex;gap:20px;align-items:center;margin-top:10px"><div class="ic-stone">${stoneSVG('altin')}</div><p class="ic-desc"><b>Ekonomik değeri olan kayaçlara maden denir.</b> Madenleri topraktan çıkarır, işler ve kullanırız.</p></div></div>`);
  });
}
function initBook(){ $('bookBack').onclick = ()=>{ SFX.click(); show(bookFrom); }; }

/* =========================================================
   13. AYARLAR
   ========================================================= */
let setFrom = 'start';
function renderSettings(){ $('tglSound').classList.toggle('on', S.sound); }
function initSettings(){
  $('tglSound').onclick = ()=>{ S.sound = !S.sound; save(); renderSettings(); SFX.click(); };
  $('setBack').onclick = ()=>{ SFX.click(); show(setFrom); };
  $('btnIntroAgain').onclick = ()=>{ SFX.click(); setFrom='start'; showIntro(0); };
  $('btnReset').onclick = ()=>{
    SFX.click();
    openModal(`<div class="confirm"><h2>Emin misin?</h2><p>Bulduğun bütün madenler, fosiller ve yıldızlar silinecek.</p>
      <div class="btnrow"><button class="btn ghost" id="rNo">Vazgeç</button><button class="btn red" id="rYes">Evet, sıfırla</button></div></div>`);
    $('rNo').onclick = ()=>{ SFX.click(); closeModal(); };
    $('rYes').onclick = ()=>{
      try{ localStorage.removeItem(KEY); }catch(e){}
      S = defState();
      closeModal(); toast('İlerleme sıfırlandı'); renderSettings();
    };
  };
}

/* =========================================================
   14. BAŞLAT
   ========================================================= */
$('modal').addEventListener('click', e=>{ if(e.target.id==='modal' && !$('introNext') && !$('rYes')) closeModal(); });
initStart(); initMap(); initDig(); initMatch(); initBook(); initSettings();
</script>
