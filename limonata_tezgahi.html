/* --- 7.2b Ortak yardımcılar: metin, karıştırma, puan --- */
const buyukHarf = s => s.charAt(0).toLocaleUpperCase('tr-TR') + s.slice(1);
function karistir(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const rastgele = a => a[Math.floor(Math.random()*a.length)];
// Sayılara ayrılma eki: 6'dan, 7'den, 3'ten…
function ayrilma(n){
  const birler = { 1:"'den", 2:"'den", 3:"'ten", 4:"'ten", 5:"'ten", 6:"'dan", 7:"'den", 8:"'den", 9:"'dan" };
  const onlar  = { 1:"'dan", 2:"'den", 3:"'dan", 4:"'tan", 5:"'den" };
  return n + (n % 10 ? birler[n % 10] : onlar[Math.floor(n/10)] || "'den");
}
// Puan tablosu (spec §8)
function puanla(zorluk, fark){
  if(fark === 0) return 3;
  if(zorluk === 'zor'){ if(fark <= 2) return 2; if(fark <= 4) return 1; return 0; }
  if(fark === 1) return 2; if(fark === 2) return 1; return 0;
}
function rozetBilgi(puan, fark){
  if(fark === 0) return { ad:'Tam tuttu!', ikon:'🎯', tur:'tam' };
  if(puan >= 2)  return { ad:'Çok yakın!', ikon:'✨', tur:'yakin' };
  if(puan === 1) return { ad:'Yakın!',     ikon:'👍', tur:'yakin' };
  return { ad:'Biraz uzak', ikon:'🙂', tur:'uzak' };
}
// Uçan limonlar: kazanılan limonlar sayaca uçar
function limonUcur(kaynak, adet){
  const hap = document.querySelector('.sahne.aktif .limon-hap');
  if(!hap || !kaynak || adet <= 0){ limonGuncelle(); return; }
  const a = kaynak.getBoundingClientRect(), b = hap.getBoundingClientRect();
  for(let i=0; i<Math.min(adet,6); i++){
    const el = document.createElement('div');
    el.className = 'ucan-limon'; el.innerHTML = SVG.limon();
    el.style.left = (a.left + a.width/2 - 24 + (i-adet/2)*14) + 'px';
    el.style.top = (a.top + a.height/2 - 24) + 'px';
    document.body.appendChild(el);
    setTimeout(()=>{
      el.style.transform = `translate(${b.left + 20 - (a.left + a.width/2 - 24 + (i-adet/2)*14)}px, ${b.top + 4 - (a.top + a.height/2 - 24)}px) scale(.6)`;
      el.style.opacity = '.4';
    }, 30 + i*90);
    setTimeout(()=>{ el.remove(); Ses.limon(); limonGuncelle(); hap.animate([{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:250}); }, 760 + i*90);
  }
}

/* --- 7.2c Soru seçimi ve tekrar önleme (spec §7) --- */
const TUR_AYAR = {
  tezgah: { soruSayisi:6, aralik:{ kolay:[2,6], orta:[6,12], zor:[10,20] }, kaplar:null },
  siparis:{ soruSayisi:4, aralik:{ kolay:[3,6], orta:[8,12], zor:[15,20] },
            kaplar:['tencere','kova','damacana','akvaryum','legen','bidon','sulama','fici'] }
};
const TAHMIN_UST = { kolay:10, orta:15, zor:25 };
const ciftAnahtar = c => c.kap + '-' + c.arac;

function ciftHavuzu(bolum, zorluk){
  const ayar = TUR_AYAR[bolum], [alt, ust] = ayar.aralik[zorluk];
  const h = [];
  Object.keys(KAPLAR).forEach(kap=>{
    if(ayar.kaplar && !ayar.kaplar.includes(kap)) return;
    KAPLAR[kap].araclar.forEach(arac=>{
      const n = olcum(kap, arac);
      if(n >= alt && n <= ust) h.push({ kap, arac, n });
    });
  });
  return h;
}
function turSorulari(bolum, zorluk){
  const N = TUR_AYAR[bolum].soruSayisi;
  const son = new Set(Kayit.veri.sonCiftler);
  let en = [];
  for(let deneme=0; deneme<40; deneme++){
    const h = karistir(ciftHavuzu(bolum, zorluk));
    // Son 2 turda çıkmayanlar önce
    const aday = [...h.filter(c=>!son.has(ciftAnahtar(c))), ...h.filter(c=>son.has(ciftAnahtar(c)))];
    const sec = [];
    while(sec.length < N){
      const i = aday.findIndex(c=> !sec.length || sec[sec.length-1].kap !== c.kap);
      if(i < 0) break;
      sec.push(aday.splice(i,1)[0]);
    }
    if(sec.length > en.length) en = sec;
    if(en.length === N) break;
  }
  // Havuz yetmezse (olmamalı) tekrar ederek tamamla
  const havuz = ciftHavuzu(bolum, zorluk);
  while(en.length < N && havuz.length){
    const c = rastgele(havuz.filter(x=> x.kap !== en[en.length-1].kap)) || rastgele(havuz);
    en.push({ ...c });
  }
  en = en.map(c=>({ ...c, yon:'doldur' }));
  if(bolum === 'tezgah'){
    // En az 2 "Paylaştır" sorusu
    const kac = 2 + (Math.random() < 0.4 ? 1 : 0);
    karistir([...Array(N).keys()]).slice(0, kac).forEach(i=> en[i].yon = 'paylastir');
  }
  return en;
}

/* --- 7.2d Tahmin oyunu: Limonata Tezgâhı ve Büyük Sipariş --- */
const TahminOyunu = {
  bolum:null, zorluk:null, sorular:[], i:0, sonuclar:[], ipucu:0, sahne:null, faz:null,
  tahmin:null, sayi:0, musteri:null, kuyruk:false, aktif:false, turLimon:0,

  kutu(){ return document.getElementById(this.bolum + '-icerik'); },
  q(s){ return this.kutu().querySelector(s); },
  s(){ return this.sorular[this.i]; },

  baslat(bolum, zorluk){
    Object.assign(this, { bolum, zorluk, sorular:turSorulari(bolum, zorluk), i:0, sonuclar:[], ipucu:0, musteri:null, aktif:true, turLimon:0 });
    const k = this.kutu();
    k.classList.add('oyun-icerik');
    k.innerHTML = `<div class="oyun-govde">
      <div class="soru-bant"><div class="musteri"></div><div class="balon" aria-live="polite"></div><div class="ilerleme"></div></div>
      <div class="oyun-sahne"><div class="dolum-alan"></div></div>
      <div class="panel"></div>
    </div>`;
    this.basligiGuncelle();
    this.soru();
  },
  bitir(){
    this.aktif = false; this.faz = null;
    if(this.sahne){ this.sahne.yokEt(); this.sahne = null; }
    katmanKapat('k-sonuc');
  },
  basligiGuncelle(){
    const h2 = document.querySelector('#s-' + this.bolum + ' .ustbar h2');
    h2.innerHTML = `${BOLUM_ADLARI[this.bolum]} <small style="color:var(--metin-acik);font-size:.7em">${this.i+1}/${this.sorular.length}</small>`;
  },
  balon(html){ this.q('.balon').innerHTML = html; },

  /* ----- Yeni soru ----- */
  soru(){
    const s = this.s();
    this.basligiGuncelle();
    // Müşteri: kaba uygun olan, yoksa bir öncekinden farklı rastgele
    let m = KAP_MUSTERI[s.kap];
    if(!m || m === this.musteri) m = rastgele(HAYVAN_LISTE.filter(x=> x !== this.musteri));
    this.musteri = m;
    const mEl = this.q('.musteri');
    mEl.classList.remove('gidiyor'); mEl.style.animation = 'none'; void mEl.offsetWidth; mEl.style.animation = '';
    mEl.innerHTML = HAYVANLAR[m]();
    this.q('.ilerleme').innerHTML = this.sorular.map((_,j)=>`<i class="${j<this.i?'tamam':j===this.i?'simdi':''}"></i>`).join('');
    this.tahmin = null; this.sayi = 0; this.kuyruk = 0; this.yargiIlk = null;
    this.sahneKur();
    if(this.bolum === 'siparis') this.onDokum();
    else this.tahminFazi(1);
  },
  sahneKur(){
    const s = this.s();
    if(this.sahne) this.sahne.yokEt();
    this.sahne = new DolumSahnesi(this.q('.dolum-alan'), {
      kap:s.kap, arac:s.arac, yon:s.yon,
      onSayi:k=> this.sayildi(k),
      onBitti:()=> this.olcumBitti()
    });
  },
  soruMetni(){
    const s = this.s(), K = KAPLAR[s.kap], A = ARACLAR[s.arac];
    return s.yon === 'paylastir'
      ? `Bu <b>${K.ki}</b> limonata kaç <b>${A.ad}</b> doldurur?`
      : `Bu <b>${K.ad}</b> kaç <b>${A.ad}</b> limonata alır?`;
  },
  sayacHTML(){
    const A = this.s().arac;
    return `<div class="sayac-kutu"><div class="sayac-sayi">${this.sayi}</div>
      <div class="sayac-simgeler">${Array.from({length:this.sayi}, ()=> aracSimge(A, 34)).join('')}</div></div>`;
  },
  sayildi(k){
    this.sayi = k;
    Ses.say(k);
    const el = this.q('.panel .sayac-sayi');
    if(el){
      el.textContent = k; el.classList.remove('zipla'); void el.offsetWidth; el.classList.add('zipla');
      this.q('.panel .sayac-simgeler').insertAdjacentHTML('beforeend', aracSimge(this.s().arac, 34));
    }
  },

  /* ----- Büyük Sipariş: ilk dökümleri oyun yapar (referans ölçü) ----- */
  async onDokum(){
    const s = this.s(), K = KAPLAR[s.kap], A = ARACLAR[s.arac];
    s.on = Math.max(1, Math.round(s.n/4));
    this.faz = 'ondokum';
    this.balon(`Bu <b>${K.ad}</b> kaç <b>${A.ad}</b> alır? Önce <b>${s.on}</b> ${A.ad} dökelim, sen izle!`);
    this.q('.panel').innerHTML = `<div class="panel-baslik">İzle ve say 👀</div>${this.sayacHTML()}`;
    const sahne = this.sahne;
    await bekle(700);
    for(let k=0; k<s.on; k++){
      if(sahne !== this.sahne || !this.aktif) return;
      await sahne.dok(0.9);
    }
    if(sahne !== this.sahne || !this.aktif) return;
    this.balon(`Bak, <b>${s.on} ${A.ad}</b> döktük. ${buyukHarf(K.ad)} ne kadar doldu? <b>Hepsinde</b> kaç ${A.ad} alır?`);
    this.tahminFazi(s.on + 1);
  },

  /* ----- 1) Tahmin ----- */
  tahminFazi(min){
    const s = this.s(), A = ARACLAR[s.arac];
    this.faz = 'tahmin';
    this.tahminMin = min;
    if(this.bolum !== 'siparis') this.balon(this.soruMetni());
    const ust = TAHMIN_UST[this.zorluk];
    this.q('.panel').innerHTML = `
      <div class="panel-baslik">Tahminin kaç?</div>
      <div class="tahmin-giris">
        <button class="btn btn-mavi" data-adim="-1" aria-label="Azalt">−</button>
        <div class="tahmin-sayi" aria-live="polite">?</div>
        <button class="btn btn-mavi" data-adim="1" aria-label="Artır">+</button>
      </div>
      <div class="tahmin-birim">${aracSimge(s.arac, 36)} ${A.ad}</div>
      ${this.bolum==='siparis' ? this.sayacHTML() : ''}
      <button class="btn btn-ana btn-buyuk" id="tahmin-tamam" disabled>Tahminim bu!</button>`;
    const sayiEl = this.q('.tahmin-sayi'), tamam = this.q('#tahmin-tamam');
    const degistir = d=>{
      this.tahmin = this.tahmin === null ? min : Math.max(min, Math.min(ust, this.tahmin + d));
      sayiEl.textContent = this.tahmin; sayiEl.classList.add('dolu'); tamam.disabled = false;
      Ses.ton(500 + this.tahmin*18, 0.06, 'triangle', 0.1);
    };
    this.q('.tahmin-giris').querySelectorAll('[data-adim]').forEach(b=> basiliTut(b, ()=> degistir(+b.dataset.adim)));
    tamam.onclick = ()=> this.olcumFazi();
  },

  /* ----- 2) Ölçüm: dök ve say ----- */
  olcumFazi(){
    const s = this.s();
    this.faz = 'olcum';
    this.balon(`Şimdi dök ve say! ${s.yon==='paylastir' ? 'Kaç <b>'+ARACLAR[s.arac].ad+'</b> dolacak?' : 'Kaç <b>'+ARACLAR[s.arac].ad+'</b> alacak?'}`);
    this.q('.panel').innerHTML = `
      <div class="tahmin-cip">Tahminin: <b>${this.tahmin}</b></div>
      <button class="btn btn-ana btn-buyuk" id="dok-btn">Dök 🫗</button>
      <button class="btn btn-mavi" id="oto-btn">⏩ Otomatik dök</button>
      ${this.sayacHTML()}`;
    this.q('#dok-btn').onclick = ()=> this.dokIste();
    this.q('#oto-btn').onclick = ()=>{
      this.kuyruk = 0;
      this.q('#dok-btn').disabled = true; this.q('#oto-btn').disabled = true;
      this.sahne.otomatik();
    };
  },
  // Her dokunuş bir döküm: döküm sürerken gelen dokunuşlar sıraya alınır,
  // ama kalan döküm sayısını asla aşmaz.
  dokIste(){
    if(this.faz !== 'olcum') return;
    const sahne = this.sahne;
    if(sahne.mesgul){
      this.kuyruk = Math.min((this.kuyruk || 0) + 1, Math.max(0, sahne.n - sahne.sayi - 1));
      return;
    }
    sahne.dok().then(()=>{
      if(sahne !== this.sahne || this.faz !== 'olcum') return;
      if(this.kuyruk > 0){ this.kuyruk--; this.dokIste(); }
    });
  },
  olcumBitti(){
    if(!this.aktif) return;
    const s = this.s(), K = KAPLAR[s.kap], A = ARACLAR[s.arac];
    this.faz = 'yargi';
    this.q('.panel').querySelectorAll('button').forEach(b=> b.disabled = true);
    this.balon(s.yon === 'paylastir'
      ? `${buyukHarf(K.ki)} limonata <b>${s.n} ${A.ad}</b> doldurdu!`
      : `${buyukHarf(K.ad)} <b>${s.n} ${A.ad}</b> limonata aldı!`);
    setTimeout(()=>{ if(this.faz === 'yargi'){ this.sahne.olcuCizgileri(); this.yargiFazi(); } }, 650);
  },

  /* ----- 3) Yargı: çocuk tahminini değerlendirir (kazanım c) ----- */
  yargiFazi(){
    const s = this.s(), t = this.tahmin, n = s.n;
    const gercek = t < n ? 'az' : t > n ? 'cok' : 'tam';
    this.q('.panel').innerHTML = `
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
        <div class="tahmin-cip">Tahminin: <b>${t}</b></div>
        <div class="tahmin-cip">Ölçüm: <b>${n}</b></div>
      </div>
      <div class="panel-baslik">Tahminin nasıldı?</div>
      <div class="yargi-dugmeler">
        <button class="btn" data-y="az"><span class="ok" style="color:var(--mavi)">▼</span> Az tahmin ettim</button>
        <button class="btn" data-y="tam"><span class="ok" style="color:var(--yesil)">●</span> Tam tuttu</button>
        <button class="btn" data-y="cok"><span class="ok" style="color:var(--pembe)">▲</span> Çok tahmin ettim</button>
      </div>
      <div class="yargi-not" hidden></div>`;
    this.q('.panel').querySelectorAll('[data-y]').forEach(b=> b.onclick = ()=>{
      if(this.faz !== 'yargi') return;
      const dogru = b.dataset.y === gercek;
      if(this.yargiIlk === null) this.yargiIlk = dogru;
      if(dogru){
        this.faz = 'sonuc';
        b.classList.remove('parla'); b.classList.add('btn-yesil');
        Ses.dogru();
        setTimeout(()=> this.sonucGoster(), 450);
      } else {
        b.classList.remove('salla'); void b.offsetWidth; b.classList.add('salla');
        Ses.yanlis();
        const not = this.q('.yargi-not');
        not.hidden = false;
        not.innerHTML = gercek === 'az' ? `${t}, ${ayrilma(n)} <b>küçük</b>. Yani <b>az</b> tahmin ettin.`
                      : gercek === 'cok' ? `${t}, ${ayrilma(n)} <b>büyük</b>. Yani <b>çok</b> tahmin ettin.`
                      : `${t} ile ${n} <b>aynı</b>. Yani tahminin <b>tam tuttu!</b>`;
        this.q(`[data-y="${gercek}"]`).classList.add('parla');
      }
    });
  },

  /* ----- 4) Sonuç kartı ----- */
  sonucGoster(){
    const s = this.s(), A = ARACLAR[s.arac], t = this.tahmin, n = s.n;
    const fark = Math.abs(t - n);
    const puan = puanla(this.zorluk, fark);
    const bonus = this.yargiIlk ? 1 : 0;
    const toplam = puan + bonus;
    const r = rozetBilgi(puan, fark);
    Kayit.veri.limon += toplam;
    Kayit.veri.sonCiftler = [...Kayit.veri.sonCiftler.filter(x=> x !== ciftAnahtar(s)), ciftAnahtar(s)].slice(-12);
    Kayit.kaydet();
    this.turLimon += toplam;
    this.sonuclar.push({ kap:s.kap, arac:s.arac, yon:s.yon, t, n, fark, puan, bonus, tur:r.tur, ikon:r.ikon });

    const boy = Math.max(t, n) > 12 ? 24 : 32;
    const ic = aracSimge(s.arac, boy);
    let tahminDizi = '';
    for(let k=1; k<=Math.max(t,n); k++){
      if(k <= t) tahminDizi += k > n ? `<span class="fazla">${ic}</span>` : `<span>${ic}</span>`;
      else tahminDizi += `<span class="eksik">${ic}</span>`;
    }
    const olcumDizi = Array.from({length:n}, ()=> `<span>${ic}</span>`).join('');
    const cumle = fark === 0 ? 'Tahminin ölçümle aynı. Harika!'
                : t < n ? `${fark} ${A.ad} <span style="color:var(--mavi)">az</span> tahmin ettin.`
                : `${fark} ${A.ad} <span style="color:var(--pembe)">fazla</span> tahmin ettin.`;
    let ipucu = '';
    if(puan === 0 && this.ipucu < 2){
      this.ipucu++;
      ipucu = s.yon === 'paylastir'
        ? `<div class="ipucu">💡 İpucu: Kap, bardaktan kaç kat büyük görünüyor? Tahmin etmeden önce ikisini yan yana düşün.</div>`
        : `<div class="ipucu">💡 İpucu: İlk dökümden sonra kabın ne kadarı doldu? Kaptaki çizgilere bak: her çizgi bir döküm.</div>`;
    }
    const el = document.getElementById('sonuc-icerik');
    el.innerHTML = `
      <div class="rozet-baslik">${r.ikon} ${r.ad}</div>
      <div class="karsilastir">
        <div class="karsilastir-satir"><span>Tahminin <b>${t}</b></span><div class="simge-dizi">${tahminDizi}</div></div>
        <div class="karsilastir-satir"><span>Ölçüm <b>${n}</b></span><div class="simge-dizi">${olcumDizi}</div></div>
      </div>
      <div class="fark-cumle">${cumle}</div>
      ${ipucu}
      <div>
        <div class="kazanc" id="sonuc-kazanc">+${toplam} ${SVG.limon()}</div>
        ${bonus ? `<div class="panel-not">${puan ? 'Yargın da doğruydu: +1' : 'Yargın doğruydu: +1'}</div>` : ''}
      </div>
      <button class="btn btn-ana btn-buyuk" id="sonuc-devam">Devam ▶</button>`;
    katmanAc('k-sonuc');
    if(fark === 0) Ses.fanfar(); else if(puan > 0) Ses.dogru();
    setTimeout(()=> limonUcur(document.getElementById('sonuc-kazanc'), toplam), 350);
    document.getElementById('sonuc-devam').onclick = ()=> this.sonraki();
  },
  sonraki(){
    katmanKapat('k-sonuc');
    this.q('.musteri').classList.add('gidiyor');
    this.faz = 'gecis';
    setTimeout(()=>{
      if(!this.aktif) return;
      this.i++;
      if(this.i < this.sorular.length) this.soru();
      else this.turBitti();
    }, 480);
  },

  /* ----- Tur sonu ----- */
  turBitti(){
    const b = this.bolum, st = Kayit.veri.istatistik[b];
    const tam = this.sonuclar.filter(x=> x.tur === 'tam').length;
    const yakin = this.sonuclar.filter(x=> x.tur === 'yakin').length;
    const uzak = this.sonuclar.filter(x=> x.tur === 'uzak').length;
    st.tur++; st.tam += tam; st.enIyi = Math.max(st.enIyi, this.turLimon);
    // Tahmin Ustası: turdaki bütün tahminler en fazla 1 farkla
    let rozet = null;
    if(this.sonuclar.every(x=> x.fark <= 1)){
      rozet = 'Tahmin Ustası';
      const ad = `usta-${b}-${this.zorluk}`;
      if(!Kayit.veri.rozetler.includes(ad)) Kayit.veri.rozetler.push(ad);
    }
    Kayit.kaydet();
    const satirlar = this.sonuclar.map(x=>`
      <div class="ozet-satir">${kapSimge(x.kap, 46, x.yon==='paylastir'?0:1)}
        <span class="ad">${buyukHarf(KAPLAR[x.kap].ad)} · ${ARACLAR[x.arac].ad}</span>
        <span>Tahmin <b>${x.t}</b> · Ölçüm <b>${x.n}</b></span><span style="font-size:1.3em">${x.ikon}</span></div>`);
    const bolum = this.bolum, zorluk = this.zorluk;
    this.bitir();
    Sahne.git('s-ozet', {
      bolum, zorluk, limon:this.turLimon, rozet, satirlar,
      ust:[ { ikon:'🎯', sayi:tam, etiket:'Tam' }, { ikon:'✨', sayi:yakin, etiket:'Yakın' }, { ikon:'🙂', sayi:uzak, etiket:'Uzak' } ]
    }, { gecmiseEkleme:true });
  },

  // Ekran döndürülünce tahmin aşamasındaysa sahneyi yeniden çiz
  yenidenBoyutla(){
    if(this.aktif && this.faz === 'tahmin' && this.bolum !== 'siparis') this.sahneKur();
  }
};

// Basılı tutunca tekrarlayan düğme (tahmin + / −)
function basiliTut(btn, f){
  let zaman = null, aralik = null;
  const dur = ()=>{ clearTimeout(zaman); clearInterval(aralik); zaman = aralik = null; };
  btn.addEventListener('pointerdown', e=>{
    e.preventDefault(); Ses.baslat(); f();
    zaman = setTimeout(()=>{ aralik = setInterval(f, 140); }, 420);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(o=> btn.addEventListener(o, dur));
  btn.addEventListener('click', e=>{ if(e.detail === 0) f(); });   // klavye
}

function tahminEkrani(bolum){
  return {
    gir(p){ if(p && p.zorluk) TahminOyunu.baslat(bolum, p.zorluk); },
    cik(){ if(TahminOyunu.bolum === bolum) TahminOyunu.bitir(); }
  };
}
Sahne.kaydet('s-tezgah', tahminEkrani('tezgah'));
Sahne.kaydet('s-siparis', tahminEkrani('siparis'));
let _boyutZaman = null;
window.addEventListener('resize', ()=>{ clearTimeout(_boyutZaman); _boyutZaman = setTimeout(()=> TahminOyunu.yenidenBoyutla(), 250); });

// Takılı tentenin rengi bütün ekranlardaki tente şeridine de yansır
function tenteRengiUygula(){
  const t = Kayit.veri.takili.semsiye && urun(Kayit.veri.takili.semsiye);
  document.documentElement.style.setProperty('--tente-renk', t ? t.renk : '#FF6B35');

// Ürün kartı simgesi
function urunSimge(u){
  const s = (ic)=> `<svg viewBox="0 0 80 80" aria-hidden="true">${ic}</svg>`;
  if(u.yuva === 'semsiye') return s(`<path d="M8 40 Q40 4 72 40Z" fill="${u.renk}"/><path d="M29 40 Q40 10 51 40Z" fill="#fff" opacity=".85"/><rect x="38" y="38" width="4" height="34" fill="#7A6A62"/>`);
  if(u.id === 'tabela-ahsap') return s(`<rect x="10" y="22" width="60" height="32" rx="6" fill="#C98B5A" stroke="#8C5A35" stroke-width="4"/><path d="M20 38 h40" stroke="#FFF1E3" stroke-width="5" stroke-linecap="round"/>`);
  if(u.id === 'tabela-yildiz') return s(`<rect x="10" y="22" width="60" height="32" rx="6" fill="#FFD600" stroke="#FF6B35" stroke-width="4"/><path d="M24 30 l2 5 5 .5 -4 3 1.3 5 -4.3-2.7 -4.3 2.7 1.3-5 -4-3 5-.5Z M56 30 l2 5 5 .5 -4 3 1.3 5 -4.3-2.7 -4.3 2.7 1.3-5 -4-3 5-.5Z" fill="#FF6B35"/>`);
  if(u.yuva === 'cicek') return s(`<path d="M28 50 h24 l-4 22 h-16Z" fill="#FF6B35"/><path d="M40 50 V30" stroke="#00C9A7" stroke-width="4"/><circle cx="40" cy="24" r="8" fill="#FFD600"/>${[0,72,144,216,288].map(a=>`<circle cx="${40+12*Math.cos(a*Math.PI/180)}" cy="${24+12*Math.sin(a*Math.PI/180)}" r="7" fill="#FF4D8D"/>`).join('')}`);
  if(u.yuva === 'ortu') return s(`<defs><pattern id="kr-${u.id}" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#fff"/><rect width="8" height="8" fill="#FF4D8D"/><rect x="8" y="8" width="8" height="8" fill="#FF4D8D"/></pattern></defs><path d="M8 20 h64 v34 q-8 8 -16 0 q-8 8 -16 0 q-8 8 -16 0 q-8 8 -16 0Z" fill="url(#kr-${u.id})" stroke="#FF4D8D" stroke-width="2"/>`);
  if(u.yuva === 'isik') return s(`<path d="M6 24 Q40 46 74 24" stroke="#3A2E2A" stroke-width="2" fill="none"/>${[[14,31,'#FF4D8D'],[27,37,'#FFD600'],[40,39,'#00C9A7'],[53,37,'#4D9FFF'],[66,31,'#A855F7']].map(([x,y,c])=>`<circle cx="${x}" cy="${y+6}" r="6" fill="${c}"/>`).join('')}`);
  if(u.yuva === 'sivi'){ const r = SIVI_RENKLERI[u.sivi]; return s(`<path d="M22 14 h36 l-5 58 h-26Z" fill="#EAF5FF" stroke="#4D9FFF" stroke-width="3"/><path d="M24.5 30 h31 l-3.6 40 h-23.8Z" fill="${r.ana}"/><rect x="24.5" y="30" width="31" height="5" fill="${r.acik}"/>`); }
  return '';
}

// Tezgâh önizlemesi
function tezgahCiz(){
  const t = Kayit.veri.takili;
  const tente = t.semsiye && urun(t.semsiye);
  let c = `<svg viewBox="0 0 600 420" aria-label="Tezgâhın" role="img" style="width:100%;height:100%">
    <rect x="0" y="0" width="600" height="420" rx="24" fill="#E8F7FF"/>
    <circle cx="520" cy="70" r="36" fill="#FFE14D" opacity=".8"/>
    <rect x="0" y="360" width="600" height="60" fill="#BFE6B0"/>`;
  // Direkler
  c += `<rect x="96" y="120" width="12" height="230" fill="#8C5A35"/><rect x="492" y="120" width="12" height="230" fill="#8C5A35"/>`;
  // Tente
  if(tente){
    let serit = '';
    for(let i=0;i<8;i++) serit += `<path d="M${70+i*57.5},150 L${90+i*52.5},84 L${90+(i+1)*52.5},84 L${70+(i+1)*57.5},150 Z" fill="${i%2?'#fff':tente.renk}"/>`;
    c += `<path d="M70 150 L90 84 H510 L530 150Z" fill="${tente.renk}"/>${serit}`;
    for(let i=0;i<8;i++) c += `<path d="M${70+i*57.5},150 a28.75,18 0 0 0 57.5,0Z" fill="${i%2?'#fff':tente.renk}"/>`;
  } else {
    c += `<rect x="80" y="110" width="440" height="14" rx="7" fill="#8C5A35"/>`;
  }
  // Işık zinciri
  if(t.isik){
    c += `<path d="M90 172 Q300 222 510 172" stroke="#3A2E2A" stroke-width="2.5" fill="none"/>`;
    const renk = ['#FF4D8D','#FFD600','#00C9A7','#4D9FFF','#A855F7','#FF6B35'];
    for(let i=1;i<12;i++){
      const u = i/12, x = 90 + 420*u, y = (1-u)*(1-u)*172 + 2*(1-u)*u*222 + u*u*172;
      c += `<circle cx="${x}" cy="${y+8}" r="7" fill="${renk[i%renk.length]}"><animate attributeName="opacity" values="1;.45;1" dur="${1.2+(i%3)*0.4}s" repeatCount="indefinite"/></circle>`;
    }
  }
  // Limoş tezgâhın arkasında
  c += `<g transform="translate(240,170) scale(1.0)">${SVG.limos().replace('<svg viewBox="0 0 120 120" aria-hidden="true">','<svg viewBox="0 0 120 120" width="120" height="120">')}</g>`;
  // Tezgâh
  c += `<rect x="70" y="270" width="460" height="90" rx="8" fill="#C98B5A"/><rect x="62" y="262" width="476" height="16" rx="6" fill="#E0A877"/>`;
  if(t.ortu){
    c += `<defs><pattern id="ortu-d" width="28" height="28" patternUnits="userSpaceOnUse"><rect width="28" height="28" fill="#fff"/><rect width="14" height="14" fill="#FF4D8D" opacity=".85"/><rect x="14" y="14" width="14" height="14" fill="#FF4D8D" opacity=".85"/></pattern></defs>`;
    let alt = 'M62 270 H538 V316';
    for(let i=0;i<12;i++) alt += ` q-${19.8} 18 -39.67 0`;
    c += `<path d="${alt} Z" fill="url(#ortu-d)" stroke="#FF4D8D" stroke-width="2"/>`;
  }
  // Tabela
  if(t.tabela === 'tabela-ahsap')
    c += `<rect x="190" y="292" width="220" height="50" rx="10" fill="#8C5A35"/><text x="300" y="327" text-anchor="middle" font-size="28" font-weight="900" fill="#FFF1E3" font-family="sans-serif">LİMONATA</text>`;
  if(t.tabela === 'tabela-yildiz')
    c += `<rect x="190" y="292" width="220" height="50" rx="10" fill="#FFD600" stroke="#FF6B35" stroke-width="4"/><text x="300" y="327" text-anchor="middle" font-size="28" font-weight="900" fill="#FF6B35" font-family="sans-serif">★ LİMONATA ★</text>`;
  // Limonata makinesi ve bardaklar
  c += `<path d="M372 172 h70 v86 q0 8 -8 8 h-54 q-8 0 -8 -8Z" fill="#EAF5FF" fill-opacity=".8" stroke="#7A6A62" stroke-width="3"/>
        <path d="M375 196 h64 v62 q0 5 -5 5 h-54 q-5 0 -5 -5Z" style="fill:var(--sivi)"/>
        <rect x="375" y="196" width="64" height="5" style="fill:var(--sivi-acik)"/>
        <circle cx="393" cy="228" r="9" fill="#FFF3A6" stroke="#FFD600" stroke-width="3"/>
        <rect x="368" y="164" width="78" height="12" rx="5" fill="var(--tente-renk)"/>
        <path d="M150 230 h26 l-4 32 h-18Z M188 236 h22 l-3 26 h-16Z" fill="#EAF5FF" stroke="#4D9FFF" stroke-width="2.5"/>
        <path d="M152 240 h22 l-2.8 22 h-16.4Z M190 244 h18 l-2.3 18 h-13.4Z" style="fill:var(--sivi)"/>`;
  // Çiçek
  if(t.cicek){
    c += `<path d="M470 228 h40 l-6 36 h-28Z" fill="#FF6B35"/><path d="M490 228 V196" stroke="#00C9A7" stroke-width="5"/>
          <path d="M490 214 q-14 -2 -16 -12 q12 0 16 12Z" fill="#00C9A7"/>
          ${[0,72,144,216,288].map(a=>`<circle cx="${490+13*Math.cos(a*Math.PI/180)}" cy="${186+13*Math.sin(a*Math.PI/180)}" r="9" fill="#FF4D8D"/>`).join('')}
          <circle cx="490" cy="186" r="9" fill="#FFD600"/>`;
  }
  c += `</svg>`;
  return c;
}

const Tezgahim = {
  ciz(){
    const v = Kayit.veri;
    const kutu = document.getElementById('tezgahim-icerik');
    const rozet = v.rozetler.length;
    kutu.classList.add('oyun-icerik');
    kutu.innerHTML = `<div class="dukkan">
      <div class="dukkan-onizleme">
        <div class="onizleme-svg">${tezgahCiz()}</div>
        <div class="dukkan-bilgi">🏅 Rozetlerin: <b>${rozet}</b> · 🎯 Tam tahminlerin: <b>${v.istatistik.tezgah.tam + v.istatistik.siparis.tam}</b></div>
      </div>
      <div class="dukkan-raf">${DUKKAN.map(u=> this.kart(u)).join('')}</div>
    </div>`;
    kutu.querySelectorAll('[data-urun]').forEach(b=> b.onclick = ()=> this.tikla(b.dataset.urun, b));
  },
  takiliMi(u){
    const t = Kayit.veri.takili;
    if(u.yuva === 'sivi') return t.sivi === u.sivi;
    if(u.yuva === 'semsiye' || u.yuva === 'tabela') return t[u.yuva] === u.id;
    return !!t[u.yuva];
  },
  kart(u){
    const sahip = Kayit.veri.sahipOlunanlar.includes(u.id);
    const takili = sahip && this.takiliMi(u);
    const yeter = Kayit.veri.limon >= u.fiyat;
    let dugme;
    if(!sahip) dugme = `<button class="btn ${yeter?'btn-ana':''}" data-urun="${u.id}" ${yeter?'':'aria-disabled="true"'}>${u.fiyat} ${SVG.limon()}</button>`;
    else if(takili) dugme = `<button class="btn btn-yesil" data-urun="${u.id}">✓ Takılı</button>`;
    else dugme = `<button class="btn btn-mavi" data-urun="${u.id}">Tak</button>`;
    return `<div class="urun-kart ${takili?'takili':''} ${!sahip && !yeter ? 'pahali':''}">
      <div class="urun-simge">${urunSimge(u)}</div><div class="urun-ad">${u.ad}</div>${dugme}</div>`;
  },
  tikla(id, btn){
    const v = Kayit.veri, u = urun(id), t = v.takili;
    if(!v.sahipOlunanlar.includes(id)){
      if(v.limon < u.fiyat){
        btn.classList.remove('salla'); void btn.offsetWidth; btn.classList.add('salla'); Ses.yanlis();
        this.not(`Biraz daha limon topla! ${u.fiyat - v.limon} limon daha lazım.`);
        return;
      }
      v.limon -= u.fiyat; v.sahipOlunanlar.push(id);
      this.tak(u, true);
      Ses.fanfar();
    } else {
      // Takılıysa çıkar (sıvı rengi çıkarılınca sarıya döner)
      if(this.takiliMi(u)) this.tak(u, false); else this.tak(u, true);
      Ses.tik();
    }
    Kayit.kaydet(); siviRengiUygula(); tenteRengiUygula(); limonGuncelle();
    this.ciz();
  },
  tak(u, ac){
    const t = Kayit.veri.takili;
    if(u.yuva === 'sivi') t.sivi = ac ? u.sivi : 'sari';
    else if(u.yuva === 'semsiye' || u.yuva === 'tabela') t[u.yuva] = ac ? u.id : null;
    else t[u.yuva] = ac;
  },
  not(m){
    let el = document.querySelector('.dukkan-not');
    if(!el){ el = document.createElement('div'); el.className = 'dukkan-not'; document.body.appendChild(el); }
    el.textContent = m; el.classList.add('acik');
    clearTimeout(this._not); this._not = setTimeout(()=> el.classList.remove('acik'), 2200);
  }
};
Sahne.kaydet('s-tezgahim', { gir(){ Tezgahim.ciz(); } });

/* --- 7.5 Ayarlar --- */
const sesAnahtar = document.getElementById('ses-anahtar');
function sesAnahtarCiz(){
  sesAnahtar.classList.toggle('acik', Kayit.veri.sesAcik);
  sesAnahtar.setAttribute('aria-checked', Kayit.veri.sesAcik);
}
sesAnahtar.addEventListener('click', ()=>{
  Kayit.veri.sesAcik = !Kayit.veri.sesAcik; Kayit.kaydet(); sesAnahtarCiz(); Ses.tik();
});
document.getElementById('sifirla-btn').addEventListener('click', ()=>{
  onayIste([
    { baslik:'İlerleme silinsin mi?', metin:'Tüm limonlar, eşyalar ve rozetler silinecek.' },
    { baslik:'Emin misin?', metin:'Bu işlem geri alınamaz.' }
  ], ()=>{ Kayit.sifirla(); Kayit.kaydet(); sesAnahtarCiz(); limonGuncelle(); siviRengiUygula(); tenteRengiUygula(); });
});
Sahne.kaydet('s-ayarlar', { gir(){ sesAnahtarCiz(); } });

/* --- 7.6 Geliştirici test ekranı (?test) --- */
const Test = {
  sahne:null,
  hazirla(){
    const kapSec = document.getElementById('t-kap'), aracSec = document.getElementById('t-arac');
    kapSec.innerHTML = Object.keys(KAPLAR).map(k=>`<option value="${k}">${KAPLAR[k].ad}</option>`).join('');
    const araclariDoldur = ()=>{
      aracSec.innerHTML = KAPLAR[kapSec.value].araclar.map(a=>`<option value="${a}">${ARACLAR[a].ad} (${olcum(kapSec.value,a)})</option>`).join('');
    };
    kapSec.onchange = araclariDoldur; araclariDoldur();
    document.getElementById('t-kur').onclick = ()=> this.kur();
    document.getElementById('t-dok').onclick = ()=> this.sahne && this.sahne.dok();
    document.getElementById('t-oto').onclick = ()=> this.sahne && this.sahne.otomatik();
  },
  kur(){
    if(this.sahne) this.sahne.yokEt();
    const kap = document.getElementById('t-kap').value, arac = document.getElementById('t-arac').value;
    const yon = document.getElementById('t-yon').value;
    const sayiEl = document.getElementById('t-sayi'), simge = document.getElementById('t-simgeler');
    sayiEl.textContent = 0; simge.innerHTML = '';
    document.getElementById('t-bilgi').textContent = `beklenen: ${olcum(kap,arac)}`;
    this.sahne = new DolumSahnesi(document.getElementById('t-alan'), {
      kap, arac, yon,
      onSayi:(k)=>{
        sayiEl.textContent = k; sayiEl.classList.remove('zipla'); void sayiEl.offsetWidth; sayiEl.classList.add('zipla');
        simge.insertAdjacentHTML('beforeend', aracSimge(arac, 34)); Ses.say(k);
      },
      onBitti:(k)=>{ document.getElementById('t-bilgi').textContent = `bitti: ${k}`; }
    });
  }
};
Sahne.kaydet('s-test', { gir(){ Test.kur(); } });

/* =========================================================
   8. GENEL OLAYLAR VE BAŞLATMA
   ========================================================= */
document.addEventListener('click', e=>{
  Ses.baslat();
  const git = e.target.closest('[data-git]');
  const geri = e.target.closest('[data-geri]');
  const sifir = e.target.closest('[data-git-sifir]');
  const kapat = e.target.closest('[data-kapat]');
  if(e.target.closest('button')) Ses.tik();
  if(git) Sahne.git(git.dataset.git);
  else if(geri){
    // Tur sürerken oyundan çıkmadan önce sor
    const oyunda = TahminOyunu.aktif && geri.closest('#s-tezgah,#s-siparis') ||
                   (typeof Atolye !== 'undefined' && Atolye.aktif && geri.closest('#s-atolye'));
    if(oyunda) onayIste([{ baslik:'Turdan çıkılsın mı?', metin:'Bu turda kazandığın limonlar sende kalır.' }], ()=> Sahne.geri());
    else Sahne.geri();
  }
  else if(sifir) Sahne.git(sifir.dataset.gitSifir, {}, { sifirla:true });
  else if(kapat) katmanKapat(kapat.closest('.katman').id);
});
// Katman dışına dokununca kapat
document.querySelectorAll('.katman').forEach(k=>{
  k.addEventListener('click', e=>{ if(e.target === k && !k.hasAttribute('data-sabit')) katmanKapat(k.id); });
});

Kayit.yukle();
siviRengiUygula();
tenteRengiUygula();
svgYerlestir();
Test.hazirla();
Sahne.git(/[?&]test\b/.test(location.search) ? 's-test' : 's-acilis', {}, { gecmiseEkleme:true });
