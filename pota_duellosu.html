<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pota Düellosu</title>
<style>
/* =========================================================
   1. TEMA DEĞİŞKENLERİ
   ========================================================= */
:root{
  --turuncu:#FF6B35;
  --sari:#FFD600;
  --pembe:#FF4D8D;
  --yesil:#00C9A7;
  --mavi:#4D9FFF;
  --mor:#A855F7;
  --zemin:#FFF8F0;
  --koyu:#2B2140;
  --yumusak:#6B5F80;
  --parke:#E9B676;
  --parke-koyu:#C98B4A;
  --golge:0 6px 0 rgba(0,0,0,.18);
  --radius:24px;
}

/* =========================================================
   2. TEMEL YERLEŞİM
   ========================================================= */
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:var(--zemin);
  color:var(--koyu);
  font-family:'Nunito','Varela Round','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
#oyun{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden}
button{font-family:inherit}

/* =========================================================
   3. SAHNE YÖNETİCİSİ STİLLERİ
   ========================================================= */
.sahne{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2.4vh;padding:3vh 4vw 6vh;
  opacity:0;pointer-events:none;visibility:hidden;
  transform:scale(.97);
  transition:opacity .3s ease, transform .3s ease, visibility 0s linear .3s;
}
.sahne.aktif{opacity:1;pointer-events:auto;visibility:visible;transform:scale(1);transition:opacity .3s ease, transform .3s ease}

/* =========================================================
   4. ORTAK BİLEŞENLER
   ========================================================= */
.baslik{
  font-size:clamp(32px,7vh,72px);font-weight:900;letter-spacing:.5px;
  text-align:center;line-height:1.05;
}
.baslik span{color:var(--turuncu)}
.orta-baslik{font-size:clamp(26px,5.5vh,56px)}
.altbaslik{font-size:clamp(16px,3vh,28px);font-weight:700;color:var(--yumusak);text-align:center}

.dugme-grup{display:flex;gap:2vw;flex-wrap:wrap;justify-content:center}
.dugme{
  min-width:64px;min-height:64px;
  padding:1.6vh 3.2vw;
  border:none;border-radius:var(--radius);
  font-weight:900;font-size:clamp(20px,3.6vh,36px);
  color:#fff;background:var(--turuncu);
  box-shadow:var(--golge);cursor:pointer;
  transition:transform .08s ease, box-shadow .08s ease, opacity .2s;
}
.dugme:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.dugme:disabled{opacity:.35;filter:grayscale(.7);cursor:default}
.dugme.mavi{background:var(--mavi)}
.dugme.yesil{background:var(--yesil)}
.dugme.mor{background:var(--mor)}
.dugme.gri{background:#9A8FAE}
.dugme.kucuk{font-size:clamp(16px,2.6vh,24px);padding:1.1vh 2.2vw;min-height:56px}

.ust-cubuk{
  position:absolute;top:2vh;left:2vw;right:2vw;
  display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:5;
}
.ust-cubuk > *{pointer-events:auto}

.altbilgi{
  position:absolute;bottom:.6vh;left:0;right:0;text-align:center;
  font-size:clamp(11px,1.6vh,15px);font-weight:700;color:var(--yumusak);opacity:.75;
  pointer-events:none;z-index:50;
}

/* Onluk file ve tek top görselleri */
.file{
  --fw:min(3.1vw,5.2vh);
  width:var(--fw);height:calc(var(--fw)*2.1);
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,1fr);gap:1px;
  padding:2px;border:3px solid #6b3e12;border-radius:8px;
  background:repeating-linear-gradient(45deg,#fff3df 0 4px,#f3dcb8 4px 5px);
  flex:0 0 auto;
}
.file i{border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffa36e,#e8541c 70%)}
.tektop{
  --tw:min(2.8vw,4.6vh);
  width:var(--tw);height:var(--tw);border-radius:50%;
  background:
    linear-gradient(90deg,transparent 46%,#7a2e10 46% 54%,transparent 54%),
    linear-gradient(0deg,transparent 46%,#7a2e10 46% 54%,transparent 54%),
    radial-gradient(circle at 35% 35%,#ffa36e,#e8541c 70%);
  border:2px solid #7a2e10;flex:0 0 auto;
}
.mini .file{--fw:min(1.8vw,3.2vh);border-width:2px}
.mini .tektop{--tw:min(1.7vw,3vh)}

/* =========================================================
   5. EKRAN 1 — GİRİŞ
   ========================================================= */
#sahne-giris{background:linear-gradient(#150f28 0%, #2B2140 45%, #4a3d66 100%)}
.giris-sahne{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#sahne-giris > :not(.giris-sahne){position:relative;z-index:1}
#sahne-giris .baslik{color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.35)}
#sahne-giris .baslik span{color:var(--turuncu)}
#sahne-giris .altbaslik{color:#e6defa}
.logo-top{filter:drop-shadow(0 10px 0 rgba(0,0,0,.3))}
.logo-top{width:clamp(90px,18vh,180px);height:auto;animation:sektir 1.4s ease-in-out infinite}
@keyframes sektir{0%,100%{transform:translateY(0)}50%{transform:translateY(-3vh)}}
.nasil{display:flex;gap:1.6vw;justify-content:center;flex-wrap:wrap;max-width:1200px}
.nasil div{
  background:#fff;border-radius:18px;padding:1.2vh 1.4vw;
  font-weight:800;font-size:clamp(14px,2.3vh,22px);
  box-shadow:0 6px 0 rgba(0,0,0,.25);max-width:340px;text-align:center;
  border-top:6px solid var(--turuncu);
}
.nasil div:nth-child(2){border-top-color:var(--mavi)}
.nasil div:nth-child(2) b{color:var(--mavi)}
.nasil div:nth-child(3){border-top-color:var(--mor)}
.nasil div:nth-child(3) b{color:var(--mor)}
.nasil b{display:block;color:var(--turuncu)}
.mod-etiket{font-weight:800;color:#fff;font-size:clamp(14px,2.2vh,20px);background:rgba(20,15,38,.65);padding:.5vh 1.4vw;border-radius:999px}

/* =========================================================
   6. EKRAN 2 — TAKIM SEÇİMİ
   ========================================================= */
.slotlar{display:flex;gap:2vw;justify-content:center;flex-wrap:wrap}
#sahne-takim,#sahne-tablo,#sahne-ayarlar{
  background:
    radial-gradient(circle at 50% -10%, rgba(255,107,53,.16), transparent 55%),
    repeating-linear-gradient(90deg, transparent 0 79px, rgba(201,139,74,.07) 79px 80px),
    var(--zemin);
}
.slot{
  min-width:clamp(130px,15vw,240px);padding:1vh 1vw;border-radius:20px;
  background:#fff;border:4px solid #e3d9ee;border-top:10px solid var(--tr,#e3d9ee);
  display:flex;flex-direction:column;align-items:center;gap:.4vh;cursor:pointer;
  box-shadow:0 6px 0 rgba(0,0,0,.08);
}
.cins-sec{display:flex;gap:.4vw;margin-top:.3vh}
.cins-sec button{display:flex;align-items:center;gap:.3vw;min-height:44px;padding:.3vh .7vw;border-radius:12px;border:3px solid #e3d9ee;
  background:#fff;font-weight:900;font-size:clamp(12px,2vh,18px);color:var(--yumusak);cursor:pointer}
.cins-sec button.secili{border-color:var(--tr);color:var(--koyu);background:color-mix(in srgb, var(--tr) 16%, #fff)}
.cins-sec .bas{width:clamp(20px,3.6vh,34px);height:auto}
.vs{align-self:center;font-weight:900;font-size:clamp(24px,5vh,50px);color:#fff;background:var(--koyu);
  border-radius:50%;width:clamp(52px,9vh,90px);height:clamp(52px,9vh,90px);display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 0 rgba(0,0,0,.2);transform:rotate(-8deg)}
.slot.aktif{border-color:var(--turuncu);animation:nabiz 1s ease-in-out infinite}
@keyframes nabiz{0%,100%{box-shadow:0 0 0 0 rgba(255,107,53,.5)}50%{box-shadow:0 0 0 8px rgba(255,107,53,0)}}
.slot .etiket{font-weight:900;font-size:clamp(13px,2.1vh,20px);color:var(--yumusak)}
.slot .ad{font-weight:900;font-size:clamp(15px,2.6vh,24px)}
.slot svg,.slot .bos-amb{width:clamp(40px,7.5vh,76px);height:clamp(40px,7.5vh,76px)}
.bos-amb{border-radius:50%;border:4px dashed #cfc4dd;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(20px,4vh,40px);color:#cfc4dd}
.takim-izgara{display:grid;grid-template-columns:repeat(5,1fr);gap:1.4vh 1.2vw;width:min(1200px,94vw)}
.takim-kart{
  border:none;border-radius:20px;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.1);
  border-bottom:7px solid var(--tr,#ddd);
  padding:1vh .6vw;display:flex;flex-direction:column;align-items:center;gap:.6vh;cursor:pointer;
  font-weight:900;font-size:clamp(14px,2.5vh,24px);color:var(--koyu);min-height:64px;
  position:relative;transition:transform .1s, opacity .2s;
}
.takim-kart svg{width:clamp(44px,9vh,96px);height:auto}
.takim-kart:active{transform:translateY(3px)}
.takim-kart.alindi{opacity:.4;filter:grayscale(.5)}
.takim-kart:not(.alindi):hover{transform:translateY(-3px)}
.takim-kart .no{
  position:absolute;top:.6vh;right:.6vw;background:var(--turuncu);color:#fff;border-radius:999px;
  min-width:1.8em;padding:0 .4em;font-size:clamp(12px,2vh,18px);
}
.sallan{animation:sallan .35s}
@keyframes sallan{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ipucu-genel{min-height:1.4em;font-weight:800;color:var(--pembe);font-size:clamp(14px,2.4vh,22px)}

/* =========================================================
   7. EKRAN 3 — TURNUVA TABLOSU
   ========================================================= */
.tablo{display:flex;gap:2.5vw;align-items:center;justify-content:center}
.tablo-sutun{display:flex;flex-direction:column;gap:5vh}
.eslesme{background:#fff;border-radius:20px;padding:1vh 1.2vw;min-width:clamp(200px,24vw,360px);box-shadow:0 5px 0 rgba(0,0,0,.08)}
.eslesme-ad{font-weight:900;color:var(--yumusak);font-size:clamp(12px,2vh,18px);margin-bottom:.4vh}
.eslesme .satir{display:flex;align-items:center;gap:.8vw;font-weight:900;font-size:clamp(15px,2.8vh,26px);padding:.5vh 0}
.eslesme .satir svg{width:clamp(28px,5vh,48px);height:auto}
.eslesme .satir.kazanan{color:#009e83}
.eslesme .satir.bos{color:#b8aec8}
.eslesme .skor{margin-left:auto;min-width:2ch;text-align:right}
.tablo-ok{font-size:clamp(24px,5vh,48px);font-weight:900;color:#cfc4dd}
.sampiyon{display:flex;flex-direction:column;align-items:center;gap:1vh;font-weight:900;font-size:clamp(16px,3vh,28px);text-align:center}
.sampiyon svg{width:clamp(60px,12vh,120px);height:auto}

/* =========================================================
   8. EKRAN 4 — MAÇ
   ========================================================= */
#sahne-mac{padding:0;gap:0;justify-content:flex-start;touch-action:none}
.skor-tablosu{
  width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:2vw;
  padding:.9vh 1.6vw;color:#fff;font-weight:900;
  background:linear-gradient(#241c3d,#120e22);border-bottom:4px solid #000;
  box-shadow:inset 0 -1px 0 rgba(255,255,255,.08);position:relative;z-index:2;
}
.skor-taraf{display:flex;align-items:center;gap:1vw;min-width:0;padding:.5vh 1vw;border-radius:16px;
  background:linear-gradient(90deg, var(--tr,#4a3d66), transparent 85%)}
.skor-taraf.sag{justify-content:flex-end;background:linear-gradient(270deg, var(--tr,#4a3d66), transparent 85%)}
.sk-ad{text-shadow:0 2px 0 rgba(0,0,0,.35)}
.skor-taraf svg.amb{width:clamp(30px,5.5vh,56px);height:auto;flex:0 0 auto}
.sk-ad{font-size:clamp(16px,3vh,30px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skor-sayi{font-size:clamp(26px,5.4vh,56px);min-width:2.2ch;text-align:center;background:#07050e;border-radius:12px;padding:0 .6vw;
  color:#fff;font-variant-numeric:tabular-nums;border:2px solid rgba(255,255,255,.12);
  text-shadow:0 0 10px rgba(255,255,255,.55);box-shadow:inset 0 0 12px rgba(0,0,0,.8)}
.skor-sayi.pop{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.35);color:var(--sari)}}
.top-isaret{width:clamp(20px,3.6vh,36px);height:clamp(20px,3.6vh,36px);visibility:hidden}
.top-isaret.var{visibility:visible;animation:sektir2 .6s ease-in-out infinite}
@keyframes sektir2{50%{transform:translateY(-4px)}}
.orta-saat{display:flex;flex-direction:column;align-items:center;gap:.2vh}
.saat-satir{display:flex;align-items:center;gap:.8vw}
.sure{background:#07050e;color:var(--sari);padding:.2vh 1.4vw;border-radius:12px;font-variant-numeric:tabular-nums;font-size:clamp(24px,4.8vh,48px);
  border:2px solid rgba(255,214,0,.25);text-shadow:0 0 12px rgba(255,214,0,.7);box-shadow:inset 0 0 12px rgba(0,0,0,.8)}
.sure.altin{color:#FFB300}
.mola-dugme{width:clamp(40px,6vh,60px);height:clamp(40px,6vh,60px);border-radius:14px;border:none;background:#4a3d66;box-shadow:0 4px 0 #120e22;color:#fff;font-weight:900;font-size:clamp(16px,2.6vh,24px);cursor:pointer}
.ucluk-isaret{font-size:clamp(11px,1.9vh,18px);color:var(--sari);visibility:hidden;letter-spacing:.5px}
.ucluk-isaret.goster{visibility:visible;animation:yanip .8s infinite}
@keyframes yanip{50%{opacity:.4}}

.saha{
  width:100%;flex:0 0 38%;position:relative;overflow:hidden;
  background:linear-gradient(#1b1530 0 70%, #C98B4A 70%);
  border-bottom:6px solid #6b3e12;
}
.saha > svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.isik{opacity:0;transition:opacity .35s}
.pad-serit{fill:var(--pad,#FF6B35)}
.isik.acik{opacity:1;animation:isikNabiz 1.2s ease-in-out infinite}
@keyframes isikNabiz{50%{opacity:.6}}
.led-yazi{animation:ledKay 14s linear infinite}
@keyframes ledKay{to{transform:translateX(-340px)}}
#topIc.dribble{animation:dribble .5s ease-in infinite alternate}
@keyframes dribble{from{transform:translateY(0)}to{transform:translateY(39px)}}
.fig-ic.zipla{animation:zipla .6s ease-out}
@keyframes zipla{40%{transform:translateY(-26px)}}
.net{transform-box:fill-box;transform-origin:50% 0}
.net.salla{animation:salla .5s}
@keyframes salla{30%{transform:scaleY(1.35)}60%{transform:scaleY(.85)}}
.kalabalik.cosku{animation:cosku .3s ease-in-out 4 alternate}
@keyframes cosku{to{transform:translateY(-8px)}}
.puan-yazi{font-weight:900;font-size:52px;fill:var(--sari);stroke:var(--koyu);stroke-width:5;paint-order:stroke;animation:puanUc 1.2s ease-out forwards}
@keyframes puanUc{from{transform:translateY(0);opacity:1}to{transform:translateY(-40px);opacity:0}}

.mesaj{
  position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);opacity:0;
  font-weight:900;font-size:clamp(24px,6vh,64px);color:var(--sari);text-align:center;line-height:1.1;
  background:rgba(43,33,64,.88);border-radius:22px;padding:.8vh 2.2vw;
  box-shadow:0 6px 0 rgba(0,0,0,.2);white-space:nowrap;
  pointer-events:none;transition:opacity .2s, transform .2s;z-index:4;
}
.mesaj small{display:block;font-size:.45em;color:#fff}
.mesaj.goster{opacity:1;transform:translate(-50%,-50%) scale(1)}
.model-afis{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  background:#fff;border-radius:22px;padding:1.2vh 2vw;box-shadow:0 8px 0 rgba(0,0,0,.15);
  display:none;align-items:center;gap:2vw;border:5px solid var(--sari);z-index:5;
}
.model-afis.goster{display:flex}
.model-afis .yazi{font-weight:900;font-size:clamp(20px,4.4vh,44px);white-space:nowrap}
.model-afis .alt{font-weight:800;font-size:clamp(14px,2.8vh,28px);color:var(--yumusak)}
.model-resim{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.model-resim .mr-sira{display:flex;align-items:flex-end;gap:3px;flex-wrap:nowrap;min-height:4px}

.paneller{width:100%;flex:1;display:flex;min-height:0}
.panel{
  position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;
  gap:.8vh;padding:1vh 1.4vw 3.2vh;border-top:8px solid var(--tr,#ccc);
  background:var(--zemin);
  background:color-mix(in srgb, var(--tr,#ccc) 10%, var(--zemin));
  transition:filter .3s;
}
.panel.sag{border-left:4px solid rgba(43,33,64,.15)}
.panel.savunma{filter:saturate(.7) brightness(.98)}
.panel-ust{display:flex;align-items:center;gap:.8vw;width:100%;background:#fff;border-radius:16px;padding:.5vh .8vw;box-shadow:0 4px 0 rgba(0,0,0,.07)}
.panel-ust svg{width:clamp(28px,5vh,52px);height:auto;flex:0 0 auto}
.panel-ust .ad{font-weight:900;font-size:clamp(15px,2.7vh,28px);white-space:nowrap}
.rol-ipucu{font-weight:800;color:var(--yumusak);font-size:clamp(11px,1.9vh,18px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rol{margin-left:auto;font-weight:900;font-size:clamp(12px,2.2vh,22px);padding:.4vh 1vw;border-radius:999px;color:#fff;background:var(--yumusak);white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.18);letter-spacing:.5px}
.panel.hucum .rol{animation:rolNabiz 1.4s ease-in-out infinite}
@keyframes rolNabiz{50%{transform:scale(1.07)}}
.panel.hucum .rol{background:var(--turuncu)}
.panel.savunma .rol{background:var(--mavi)}
.panel.ribaund .rol{background:var(--mor)}
.ucluk-rozet{display:none;font-weight:900;font-size:clamp(11px,1.9vh,18px);background:var(--sari);color:var(--koyu);border-radius:999px;padding:.3vh .8vw;white-space:nowrap}
.panel.ucluk .ucluk-rozet{display:inline-block}
.hucum-saati{width:100%;height:clamp(8px,1.2vh,14px);background:rgba(0,0,0,.1);box-shadow:inset 0 1px 2px rgba(0,0,0,.15);border-radius:99px;overflow:hidden;visibility:hidden;flex:0 0 auto}
.panel.hucum .hucum-saati,.panel.ribaund .hucum-saati{visibility:visible}
.hucum-saati .dolum{height:100%;width:100%;background:var(--yesil);transform-origin:left center}
.hucum-saati .dolum.az{background:var(--pembe)}
.soru-alani{flex:1;width:100%;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:.8vh}
.soru-metin{font-weight:900;font-size:clamp(18px,3.6vh,36px);text-align:center;line-height:1.1}
.soru-metin b{color:var(--turuncu);font-size:1.4em;text-shadow:0 3px 0 rgba(0,0,0,.12)}
.kurma-alani{
  flex:1;width:100%;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:.8vh;
  background:
    repeating-linear-gradient(0deg, transparent 0 22px, rgba(139,90,43,.07) 22px 23px),
    linear-gradient(#fffaf1,#f7e7cd);
  border:3px solid #e9cfa6;border-radius:18px;padding:.8vh 1vw;
  box-shadow:inset 0 3px 8px rgba(139,90,43,.12);
}
.sira{display:flex;align-items:center;gap:.6vw;min-height:min(2.8vw,4.6vh)}
.sira-etiket{font-weight:900;font-size:clamp(11px,1.8vh,17px);color:#fff;width:6.2em;flex:0 0 auto;text-align:center;
  background:var(--turuncu);border-radius:999px;padding:.3vh .4vw;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.sira + .sira .sira-etiket{background:var(--mavi)}
.dizi{display:flex;align-items:flex-end;gap:.4vw;flex-wrap:nowrap;min-width:0}
.kurma-alani:not(.salt) .dizi > *{cursor:pointer}
.kur-dugmeler,.secenekler{display:flex;gap:1vw;width:100%;flex:0 0 auto}
.kur-dugme{
  flex:1;min-height:clamp(56px,9vh,96px);border-radius:18px;border:4px solid var(--koyu);
  font-weight:900;font-size:clamp(18px,3.4vh,34px);
  display:flex;align-items:center;justify-content:center;gap:.6vw;
  background:#fff;color:var(--koyu);box-shadow:0 7px 0 var(--koyu);cursor:pointer;
  transition:transform .06s, box-shadow .06s;
}
.kur-dugme .file{--fw:min(1.5vw,2.6vh);border-width:2px}
.kur-dugme .tektop{--tw:min(2vw,3.4vh)}
.kur-dugme.sut{background:var(--turuncu);color:#fff;flex:1.3;border-color:#b8400f;box-shadow:0 7px 0 #b8400f;letter-spacing:1px;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.panel.savunma .kur-dugme.sut{background:var(--mavi);border-color:#2b6cc4;box-shadow:0 7px 0 #2b6cc4}
.panel.ribaund .kur-dugme.sut{background:var(--mor);border-color:#7a2fc2;box-shadow:0 7px 0 #7a2fc2}
.kur-dugme:active,.secenek:active{transform:translateY(5px);box-shadow:0 2px 0 var(--koyu)}
.kur-dugme.sut:active{box-shadow:0 2px 0 #b8400f}
.ipucu{min-height:1.2em;font-weight:800;color:var(--pembe);font-size:clamp(13px,2.2vh,22px);text-align:center;flex:0 0 auto}
.secenek{
  flex:1;min-height:clamp(52px,11vh,120px);border-radius:20px;border:4px solid var(--koyu);
  background:linear-gradient(#fff 60%, #f3eefa);font-weight:900;font-size:clamp(28px,6vh,60px);color:var(--koyu);
  box-shadow:0 8px 0 var(--koyu);cursor:pointer;transition:transform .06s, box-shadow .06s;
}
.secenek.dogru{background:var(--yesil);border-color:#00876f;color:#fff;box-shadow:0 8px 0 #00876f}
.secenek.yanlis{background:var(--pembe);border-color:#b8255f;color:#fff;box-shadow:0 8px 0 #b8255f}
.buyuk-sayi{display:flex;gap:.6vw;justify-content:center;font-weight:900;font-size:clamp(34px,12vh,150px);line-height:1;flex:0 1 auto;min-height:0}
.buyuk-sayi span{padding:.02em .26em;border-radius:min(22px,2.4vh);background:#fff;border:min(5px,.6vh) solid var(--koyu);box-shadow:0 min(9px,1vh) 0 var(--koyu)}
.buyuk-sayi .vurgu{background:var(--sari);animation:vurguParla 1.2s ease-in-out infinite}
@keyframes vurguParla{50%{box-shadow:0 min(9px,1vh) 0 var(--koyu), 0 0 0 10px rgba(255,214,0,.35)}}
.panel-kilit{
  position:absolute;inset:0;background:rgba(255,248,240,.88);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.2vh;
  text-align:center;padding:2vh 2vw;z-index:6;
}
.panel-kilit.goster{display:flex}
.panel-kilit .k-baslik{font-weight:900;font-size:clamp(22px,5vh,50px);color:var(--koyu);text-shadow:0 4px 0 color-mix(in srgb, var(--tr,#ccc) 45%, transparent)}
.panel-kilit .k-yazi{font-weight:800;font-size:clamp(16px,3vh,30px);color:var(--yumusak);line-height:1.3}
.panel-kilit .k-yazi b{color:var(--koyu)}

.mola-perde{position:absolute;inset:0;background:rgba(43,33,64,.7);display:none;align-items:center;justify-content:center;z-index:20}
.mola-perde.goster{display:flex}
.mola-kutu{background:var(--zemin);border-radius:28px;padding:4vh 4vw;display:flex;flex-direction:column;align-items:center;gap:3vh}

/* =========================================================
   9. EKRAN 5 — MAÇ SONU
   ========================================================= */
#sahne-sonuc{background:radial-gradient(circle at 50% 30%, rgba(255,214,0,.35), transparent 60%), var(--zemin);overflow:hidden}
.kupa{width:clamp(70px,13vh,140px);height:auto}
.sonuc-kutu{display:flex;gap:3vw;align-items:stretch;justify-content:center}
.sonuc-takim{
  background:#fff;border-radius:24px;padding:1.6vh 2vw;display:flex;flex-direction:column;align-items:center;gap:.8vh;
  width:clamp(220px,30vw,420px);box-shadow:0 6px 0 rgba(0,0,0,.08);border:5px solid transparent;
  border-top:12px solid var(--tr,#ccc);position:relative;
}
.sonuc-takim.kazanan{border-color:var(--sari);border-top-color:var(--tr,#ccc);transform:scale(1.04);
  box-shadow:0 0 0 8px rgba(255,214,0,.25), 0 10px 0 rgba(0,0,0,.08)}
.sonuc-takim .tac{position:absolute;top:-6vh;left:50%;transform:translateX(-50%) rotate(-6deg);width:clamp(44px,8vh,80px)}
.sonuc-vs{align-self:center;font-weight:900;font-size:clamp(22px,4.6vh,46px);color:#fff;background:var(--koyu);
  border-radius:50%;width:clamp(48px,8vh,84px);height:clamp(48px,8vh,84px);display:flex;align-items:center;justify-content:center;transform:rotate(-8deg)}
.sonuc-takim svg.amb{width:clamp(50px,9vh,96px);height:auto}
.sonuc-ad{font-weight:900;font-size:clamp(18px,3.4vh,34px)}
.sonuc-skor{font-size:clamp(40px,9vh,96px);font-weight:900;line-height:1}
.sonuc-dogru{font-weight:800;color:var(--yumusak);font-size:clamp(14px,2.5vh,24px)}
.sonuc-yanlis{font-size:clamp(13px,2.2vh,21px);font-weight:700;background:#FFF3D6;border-radius:14px;padding:.8vh 1vw;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.6vh;width:100%}
.sonuc-yanlis.iyi{background:#DDF8F2}
.konfeti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.konfeti i{position:absolute;top:-4vh;width:12px;height:18px;border-radius:3px;animation:dus linear forwards}
@keyframes dus{to{transform:translateY(115vh) rotate(720deg)}}

/* =========================================================
   10. EKRAN 6 — AYARLAR
   ========================================================= */
.ayar-kutusu{width:min(900px,92vw);display:flex;flex-direction:column;gap:1.4vh}
.ayar-satir{display:flex;align-items:center;justify-content:space-between;gap:2vw;background:#fff;border-radius:20px;padding:1vh 1.6vw;box-shadow:0 4px 0 rgba(0,0,0,.06)}
.ayar-ad{font-weight:900;font-size:clamp(16px,3vh,28px)}
.ayar-ad small{display:block;font-weight:700;color:var(--yumusak);font-size:.6em}
.segment{display:flex;gap:.6vw;flex-wrap:wrap;justify-content:flex-end}
.segment button{
  min-height:56px;min-width:clamp(60px,7vw,120px);border-radius:16px;border:3px solid #e3d9ee;
  background:#fff;font-weight:900;font-size:clamp(14px,2.5vh,24px);color:var(--koyu);cursor:pointer;
}
.segment button.secili{background:var(--mavi);border-color:var(--mavi);color:#fff}
.segment button.tehlike{background:var(--pembe);border-color:var(--pembe);color:#fff}

/* Kısa ekranlar (yatay telefon): maç ekranını sıkıştır */
@media (max-height:520px){
  .skor-tablosu{padding:.4vh 1.2vw}
  .saha{flex-basis:34%}
  .panel{gap:.5vh;padding:.6vh 1vw 2.6vh}
  .panel-ust{padding:.2vh .6vw;box-shadow:none}
  .panel-ust .ad{font-size:13px}
  .rol-ipucu{display:none}
  .rol{font-size:11px;padding:.2vh .8vw}
  .hucum-saati{height:5px}
  .soru-metin{font-size:14px}
  .soru-metin b{font-size:1.25em}
  .buyuk-sayi{font-size:26px}
  .buyuk-sayi span{border-width:3px;box-shadow:0 3px 0 var(--koyu);border-radius:8px}
  .kurma-alani{gap:2px;padding:2px 6px;border-width:2px}
  .sira{min-height:14px}
  .sira-etiket{font-size:9px;width:5.6em;padding:0 2px}
  .kurma-alani .file{--fw:min(2.6vw,4.4vh);border-width:2px}
  .kurma-alani .tektop{--tw:min(2.4vw,4vh)}
  .kur-dugme,.secenek{min-height:40px;border-width:3px;box-shadow:0 4px 0 var(--koyu);border-radius:12px}
  .kur-dugme{font-size:16px}
  .secenek{font-size:22px}
  .kur-dugme.sut{box-shadow:0 4px 0 #b8400f}
  .secenek.dogru{box-shadow:0 4px 0 #00876f}
  .secenek.yanlis{box-shadow:0 4px 0 #b8255f}
  .ipucu{font-size:11px;min-height:0}
  .panel-kilit .k-baslik{font-size:20px}
  .panel-kilit .k-yazi{font-size:13px}
  /* takım seçimi */
  #sahne-takim{gap:1vh;padding-top:1.5vh;padding-bottom:4vh}
  #sahne-takim .altbaslik{display:none}
  #takimBaslik{font-size:20px}
  .slot{padding:2px 8px;border-top-width:6px;gap:1px}
  .slot svg,.slot .bos-amb{width:28px;height:28px}
  .slot .ad{font-size:13px}
  .slot .etiket{font-size:11px}
  .cins-sec button{min-height:30px;font-size:11px;padding:1px 6px;border-width:2px}
  .cins-sec .bas{width:18px}
  .takim-izgara{gap:6px}
  .takim-kart{padding:3px 4px;font-size:12px;min-height:0;gap:1px;border-bottom-width:4px}
  .takim-kart svg{width:28px}
  .vs{width:38px;height:38px;font-size:16px}
  #takimBasla{min-height:40px;padding:4px 20px;font-size:18px}
  .ipucu-genel{min-height:0;font-size:12px}
  #sahne-takim .ust-cubuk .dugme{min-height:36px;padding:4px 12px;font-size:14px}
}

/* =========================================================
   B. AYARLAR VE KALICILIK (localStorage)
   ========================================================= */
const DEPO = 'potaDuellosu_v1';
const VARSAYILAN = {ses:true, taraftar:true, zorluk:'orta', sure:3, mod:'tek', sonTakimlar:null, sonTurnuva:null, cinsiyet:null};
const Ayar = {...VARSAYILAN};
function ayarYukle(){
  try{
    const v = JSON.parse(localStorage.getItem(DEPO));
    if (v && typeof v === 'object'){
      if (typeof v.ses === 'boolean') Ayar.ses = v.ses;
      if (typeof v.taraftar === 'boolean') Ayar.taraftar = v.taraftar;
      if (['kolay','orta','zor'].includes(v.zorluk)) Ayar.zorluk = v.zorluk;
      if ([1,1.5,2,3,5].includes(v.sure)) Ayar.sure = v.sure;
      if (v.cinsiyet && typeof v.cinsiyet === 'object') Ayar.cinsiyet = v.cinsiyet;
      if (['tek','turnuva'].includes(v.mod)) Ayar.mod = v.mod;
      if (Array.isArray(v.sonTakimlar)) Ayar.sonTakimlar = v.sonTakimlar;
      if (Array.isArray(v.sonTurnuva)) Ayar.sonTurnuva = v.sonTurnuva;
    }
  }catch(e){}
}
function ayarKaydet(){ try{ localStorage.setItem(DEPO, JSON.stringify(Ayar)); }catch(e){} }
function ayarSifirla(){ try{ localStorage.removeItem(DEPO); }catch(e){} Object.assign(Ayar, VARSAYILAN); }

const Ses = {
  ctx:null, gurultuTampon:null, ornekler:{}, ornekYukleniyor:false,
  hazirla(){
    if (!this.ctx){
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      try{ this.ctx = new C(); }catch(e){ return; }
    }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(()=>{});
    this.orneklerYukle();
  },
  /* base64 MP3'leri bir kez çöz, AudioBuffer olarak sakla */
  orneklerYukle(){
    if (this.ornekYukleniyor || !this.ctx) return;
    this.ornekYukleniyor = true;
    for (const [ad, b] of Object.entries(SES_VERI)){
      try{
        const ikili = atob(b), dizi = new Uint8Array(ikili.length);
        for (let i=0;i<ikili.length;i++) dizi[i] = ikili.charCodeAt(i);
        const p = this.ctx.decodeAudioData(dizi.buffer, buf => { this.ornekler[ad] = buf; }, () => {});
        if (p && p.catch) p.catch(()=>{});
      }catch(e){}
    }
  },
  /* Gömülü sesi çal; hazır değilse false döner (yedek sentez çalınsın diye) */
  ornek(ad, vol=1, gec=0){
    if (!this.hazir() || !this.ornekler[ad]) return false;
    if (ad !== 'file' && !Ayar.taraftar) return true;
    const c = this.ctx, src = c.createBufferSource(), g = c.createGain();
    src.buffer = this.ornekler[ad]; g.gain.value = vol;
    src.connect(g).connect(c.destination);
    src.start(c.currentTime + gec);
    return true;
  },
  hazir(){ return Ayar.ses && this.ctx && this.ctx.state === 'running'; },
  ton(f, sure, tip='sine', vol=.2, f2=null, gec=0){
    if (!this.hazir()) return;
    const c = this.ctx, t = c.currentTime + gec;
    const o = c.createOscillator(), g = c.createGain();
    o.type = tip; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + sure);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .01);
    g.gain.exponentialRampToValueAtTime(.0001, t + sure);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + sure + .05);
  },
  gurultu(sure, vol, f1, f2, gec=0){
    if (!this.hazir()) return;
    const c = this.ctx, t = c.currentTime + gec;
    if (!this.gurultuTampon){
      const b = c.createBuffer(1, c.sampleRate, c.sampleRate);
      const d = b.getChannelData(0);
      for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
      this.gurultuTampon = b;
    }
    const s = c.createBufferSource(); s.buffer = this.gurultuTampon;
    const f = c.createBiquadFilter(); f.type='bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(f2, t + sure);
    const g = c.createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t + sure);
    s.connect(f).connect(g).connect(c.destination);
    s.start(t); s.stop(t + sure + .05);
  },
  dokun(){ this.ton(620,.07,'sine',.12); },
  sektir(){ this.ton(130,.14,'sine',.35,60); },
  file(){ this.gurultu(.4,.3,4200,1200); },
  cember(){ this.ton(620,.28,'square',.07); this.ton(930,.22,'square',.05); },
  dogru(){ this.ton(660,.12,'triangle',.18); this.ton(990,.18,'triangle',.18,null,.1); },
  yanlis(){ this.ton(330,.18,'triangle',.2,220); this.ton(220,.25,'triangle',.18,180,.15); },
  cal(){ this.ton(450,.12,'square',.08,950); },
  uyari(){ this.ton(440,.1,'triangle',.15); },
  tik(){ this.ton(1100,.05,'square',.07); },
  buzzer(){ this.ton(150,.9,'sawtooth',.13); this.ton(156,.9,'sawtooth',.1); },
  kisaBuzzer(){ this.ton(170,.35,'sawtooth',.12); },
  alkis(){ for (let i=0;i<34;i++) this.gurultu(.07, .08+Math.random()*.12, 1600, 2600, Math.random()*1.4); },
  duduk(){
    if (!this.hazir()) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain(), l = c.createOscillator(), lg = c.createGain();
    o.type='sine'; o.frequency.value = 2700; l.frequency.value = 38; lg.gain.value = 180;
    l.connect(lg).connect(o.frequency);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.16,t+.02);
    g.gain.setValueAtTime(.16,t+.4); g.gain.exponentialRampToValueAtTime(.0001,t+.5);
    o.connect(g).connect(c.destination);
    o.start(t); l.start(t); o.stop(t+.55); l.stop(t+.55);
  },
};
document.addEventListener('pointerdown', () => Ses.hazirla(), true);

   E. SAHNE YÖNETİCİSİ
   ========================================================= */
const Sahne = (() => {
  const sahneler = {};
  document.querySelectorAll('.sahne').forEach(el => {
    sahneler[el.dataset.sahne] = { el, giris:null, cikis:null };
  });
  let aktif = null, ayarlarDonus = 'giris';
  function goster(ad){
    const hedef = sahneler[ad];
    if (!hedef || ad === aktif) return;
    if (aktif){
      const eski = sahneler[aktif];
      eski.el.classList.remove('aktif');
      if (eski.cikis) eski.cikis();
    }
    hedef.el.classList.add('aktif');
    aktif = ad;

/* =========================================================
   I. SORU ÜRETİCİ
   Tipler: kur (file+top ile sayıyı kur), oku (resimdeki sayıyı bul),
           deger (vurgulu rakamın basamak değeri)
   Kurallar: maçta aynı sayı aynı oyuncuya iki kez gelmez; art arda
   iki soru aynı tipte olmaz; her 5 soruda en az bir birleri 0 olan
   ve en az bir ters çevrilebilen sayı gelir.
   ========================================================= */
const TIPLER = ['kur','oku','deger'];
const birUst = s => s === 'kolay' ? 'orta' : 'zor';

function sayiSec(seviye, p, zorla, haric, ikinci=false){
  const uygun = (d,u) => {
    if (seviye === 'kolay' && (d > 5 || u > 5)) return false;
    if (zorla === 'sifir' && u !== 0) return false;
    if (zorla === 'ters' && (u === 0 || u === d)) return false;
    if (zorla === 'tekrar' && u !== d) return false;
    const n = d*10+u;
    return !mac.kullanilan[p].has(n) && !haric.includes(n);
  };
  for (let i=0;i<300;i++){
    let d, u;
    if (seviye === 'kolay'){ d = rnd(1,5); u = rnd(0,5); }
    else { d = rnd(1,9); u = rnd(0,9); if (seviye === 'zor' && !zorla && Math.random() < .5) u = rnd(6,9); }
    if (zorla === 'sifir') u = 0;
    if (zorla === 'tekrar') u = d;
    if (uygun(d,u)) return d*10+u;
  }
  // yedek: kalan tüm uygun sayılar
  const liste = [];
  for (let n=10;n<=99;n++) if (uygun(Math.floor(n/10), n%10)) liste.push(n);
  if (liste.length) return liste[rnd(0,liste.length-1)];
  mac.kullanilan[p].clear();
  return sayiSec(seviye, p, ikinci ? null : zorla, haric, true);
}

function secenekKur(cevap, adaylar){
  const s = [cevap];
  for (const a of adaylar){ if (s.length >= 3) break; if (a == null || a < 0 || a > 99 || s.includes(a)) continue; s.push(a); }
  for (const e of [1,-1,2,-2,3,-3]){ if (s.length >= 3) break; const a = cevap + e; if (a >= 0 && a <= 99 && !s.includes(a)) s.push(a); }
  return karistir(s);
}

function soruUret(p, tip, {ucluk=false, haric=[]} = {}){
  const seviye = ucluk ? birUst(Ayar.zorluk) : Ayar.zorluk;
  const blok = mac.blok[p];
  let zorla = null;
  if (blok.sira >= 3 && !blok.sifir) zorla = 'sifir';
  else if (blok.sira >= 4 && !blok.ters) zorla = 'ters';
  else if (tip === 'deger' && (ucluk || seviye === 'zor') && Math.random() < .4) zorla = 'tekrar';

  const n = sayiSec(seviye, p, zorla, haric);
  const d = Math.floor(n/10), u = n % 10;
  mac.kullanilan[p].add(n);
  if (u === 0) blok.sifir = true;
  if (u !== 0 && u !== d) blok.ters = true;
  blok.sira++;
  if (blok.sira >= 5){ blok.sira = 0; blok.sifir = false; blok.ters = false; }

  const q = {tip, n, d, u, puan:1, dosya:0, top:0};
  if (tip === 'oku'){
    q.cevap = n;
    const ters = (u !== 0 && u !== d) ? u*10+d : null;
    q.secenekler = secenekKur(n, [ters, ...karistir([d+u, n+10, n-10])]);
  } else if (tip === 'deger'){
    q.hane = (u === 0) ? 'onlar' : (Math.random() < .5 ? 'onlar' : 'birler');
    if (q.hane === 'onlar'){
      q.cevap = d*10;
      q.secenekler = secenekKur(q.cevap, [d, n, (d+1)*10 <= 90 ? (d+1)*10 : null, (d-1)*10 >= 10 ? (d-1)*10 : null]);
    } else {
      q.cevap = u;
      q.secenekler = secenekKur(q.cevap, [u*10, n, d]);
    }
  }
  return q;
}
const soruKopya = q => ({...q, dosya:0, top:0, secenekler: q.secenekler ? karistir(q.secenekler) : undefined});

function nedenYaz(q, v){
  if (q.tip === 'kur'){
    const p = [];
    if (v.dosya < q.d) p.push(`${q.d - v.dosya} file eksik`);
    if (v.dosya > q.d) p.push(`${v.dosya - q.d} file fazla`);
    if (v.top < q.u) p.push(`${q.u - v.top} top eksik`);
    if (v.top > q.u) p.push(`${v.top - q.u} top fazla`);
    return p.length ? p.join(', ') + '.' : '';
  }
  if (q.tip === 'oku') return `${q.d} file = ${q.d*10}, ${q.u} top = ${q.u}.`;
  return q.hane === 'onlar' ? `${q.d} onlar basamağında. Değeri ${q.d*10}.` : `${q.u} birler basamağında. Değeri ${q.u}.`;
}

function netSalla(taraf){ const n = $('net-'+taraf); n.classList.remove('salla'); void n.getBBox(); n.classList.add('salla'); }
function kalabalikCosku(){ const k = $('kalabalik'); k.classList.remove('cosku'); void k.getBBox(); k.classList.add('cosku'); }
function puanYazi(taraf, puan){
  const t = document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('x', POTA[taraf].x); t.setAttribute('y', 80); t.setAttribute('text-anchor','middle');
  t.setAttribute('class','puan-yazi'); t.textContent = '+' + puan;
  $('efektler').appendChild(t); setTimeout(() => t.remove(), 1300);
}
let mesajZaman = null;
function mesaj(html, ms=1400){
  const m = $('mesaj'); m.innerHTML = html; m.classList.add('goster');
  clearTimeout(mesajZaman); mesajZaman = setTimeout(() => m.classList.remove('goster'), ms);
}
function modelGoster(q){
  clearTimeout(mesajZaman); $('mesaj').classList.remove('goster');
  $('modelAfis').innerHTML = `${modelResim(q.d,q.u)}<div><div class="yazi">${modelYazi(q)}</div><div class="alt">${q.d*10} + ${q.u} = ${q.n}</div></div>`;
  $('modelAfis').classList.add('goster');
}
function modelGizle(){ $('modelAfis').classList.remove('goster'); }

/* Top animasyonu: a → b, c varsa yay (ikinci derece Bezier) */
function topAnim(a, b, c, ms){
  const id = mac.id;
  return new Promise(res => {
    const t0 = performance.now();
    function adim(t){
      if (id !== mac.id){ res(false); return; }
      const k = Math.min(1, (t - t0) / ms), m = 1 - k;
      let x, y;
      if (c){ x = m*m*a[0] + 2*m*k*c[0] + k*k*b[0]; y = m*m*a[1] + 2*m*k*c[1] + k*k*b[1]; }
      else { x = a[0] + (b[0]-a[0])*k; y = a[1] + (b[1]-a[1])*k; }
      topXY(x, y);
      if (k < 1) requestAnimationFrame(adim); else res(true);
    }
    requestAnimationFrame(adim);
  });
}
function bekle(ms){ const id = mac.id; return new Promise(r => setTimeout(() => r(id === mac.id), ms)); }
async function topVer(p, ms=500){
  topDribble(false);
  const [x,y] = mac.topXY, h = elKonum(p);
  const ok = await topAnim([x,y], h, [(x+h[0])/2, Math.min(y,h[1]) - 90], ms);
  if (ok) topDribble(true);
  return ok;
}
async function sut(p, girer){
  topDribble(false);
  const taraf = rakip(p), h = POTA[taraf], yon = p === 'sol' ? 1 : -1;
  const bas = elKonum(p);
  const ctrl = [(bas[0] + h.x)/2, -90];
  if (girer){
    if (!await topAnim(bas, [h.x, h.y-16], ctrl, 850)) return false;
    netSalla(taraf);
    if (!await topAnim([h.x, h.y-16], [h.x, h.y+45], null, 220)) return false;
    if (!await topAnim([h.x, h.y+45], [h.x, ZEMIN_Y], null, 260)) return false;
  } else {
    const kenar = [h.x - yon*30, h.y-18];
    if (!await topAnim(bas, kenar, ctrl, 850)) return false;
    Ses.cember();
    if (!await topAnim(kenar, [h.x - yon*190, ZEMIN_Y], [h.x - yon*110, 30], 650)) return false;
    Ses.sektir();
  }
  return true;
}

/* =========================================================
   K. MAÇ DURUMU VE ANA DÖNGÜ
   ========================================================= */
const mac = { id:0, topXY:[500,ZEMIN_Y], kullanilan:{sol:new Set(), sag:new Set()}, blok:{sol:{sira:0},sag:{sira:0}} };
const panelEl = { sol:$('panel-sol'), sag:$('panel-sag') };

function macBaslat(){
  mac.id++;
  Object.assign(mac, {
    takim:{ sol:takimBul(Oyun.takimlar[0]), sag:takimBul(Oyun.takimlar[1]) },
    skor:{sol:0, sag:0}, toplam:Ayar.sure*60, kalan:Ayar.sure*60, uclukEsik:bonusEsik(Ayar.sure*60),
    top:null, faz:'basla', soru:{sol:null, sag:null}, kilit:{sol:true, sag:true},
    hucumSaati:HUCUM_SURESI, ribaundcu:null, altin:false, sureSifir:false, bitisBekliyor:false,
    duraklat:false, saatAkiyor:false, son30:false, hucumNo:0, sonTip:null,
    kullanilan:{sol:new Set(), sag:new Set()},
    blok:{ sol:{sira:0,sifir:false,ters:false}, sag:{sira:0,sifir:false,ters:false} },
    istat:{ dogru:{sol:0,sag:0}, yanlis:{sol:0,sag:0}, ilkYanlis:{sol:null,sag:null} },
    calisiyor:true,
  });
  $('fig-sol').innerHTML = figurHTML(mac.takim.sol, false, 7, cinsBul(mac.takim.sol.id));
  $('fig-sag').innerHTML = figurHTML(mac.takim.sag, true, 11, cinsBul(mac.takim.sag.id));
  $('boya-sol').setAttribute('fill', mac.takim.sol.renk);
  $('boya-sag').setAttribute('fill', mac.takim.sag.renk);
  document.querySelector('.skor-taraf.sol').style.setProperty('--tr', renkTon(mac.takim.sol.renk, -.15));
  document.querySelector('.skor-taraf.sag').style.setProperty('--tr', renkTon(mac.takim.sag.renk, -.15));
  document.querySelector('.pota-sol').style.setProperty('--pad', mac.takim.sol.renk);
  document.querySelector('.pota-sag').style.setProperty('--pad', mac.takim.sag.renk);
  $('skAmbSol').innerHTML = amblem(mac.takim.sol);
  $('skAmbSag').innerHTML = amblem(mac.takim.sag);
  $('skAdSol').textContent = mac.takim.sol.ad;
  $('skAdSag').textContent = mac.takim.sag.ad;
  $('molaPerde').classList.remove('goster');
  modelGizle(); $('mesaj').classList.remove('goster');
  topDribble(false); topXY(500, ZEMIN_Y);
  P.forEach(p => { panelCiz(p); panelKilit(p, 'Hazır ol!', 'Hava atışı geliyor...'); });
  skorCiz(); saatCiz();
  mac.sonT = performance.now();
  cancelAnimationFrame(mac.raf);
  mac.raf = requestAnimationFrame(dongu);
  havaAtisi();
}
function macDurdur(){
  mac.calisiyor = false; mac.id++;
  cancelAnimationFrame(mac.raf);
  modelGizle(); topDribble(false);
  $('molaPerde').classList.remove('goster');
}
Sahne.kanca('mac', macBaslat, macDurdur);

async function havaAtisi(){
  if (!await bekle(700)) return;
  Ses.duduk(); mesaj('HAVA ATIŞI!');
  if (!await topAnim([500,ZEMIN_Y], [500,60], null, 550)) return;
  mac.top = Math.random() < .5 ? 'sol' : 'sag';
  if (!await topAnim([500,60], elKonum(mac.top), [500,40], 550)) return;
  topDribble(true);
  mac.saatAkiyor = true;
  yeniHucum();
}

function dongu(t){
  if (!mac.calisiyor) return;
  const dt = Math.min(.1, (t - mac.sonT) / 1000); mac.sonT = t;
  if (!mac.duraklat && mac.saatAkiyor && mac.faz !== 'bitti'){
    if (!mac.altin && !mac.sureSifir){
      const once = Math.ceil(mac.kalan);
      mac.kalan = Math.max(0, mac.kalan - dt);
      const simdi = Math.ceil(mac.kalan);
      if (simdi !== once && simdi <= 10 && simdi > 0) Ses.tik();
      if (!mac.son30 && mac.kalan <= mac.uclukEsik){
        mac.son30 = true; mesaj(`SON ${mac.uclukEsik} SANİYE!<small>Basketler artık 2 sayı</small>`, 1800);
      }
      if (mac.kalan <= 0) sureBitti();
    }
    if (mac.faz === 'oyun' || mac.faz === 'ribaund'){
      mac.hucumSaati -= dt;
      if (mac.hucumSaati <= 0){ mac.hucumSaati = 0; hucumSuresiDoldu(); }
    }
  }
  saatCiz(); hucumSaatiCiz();
  mac.raf = requestAnimationFrame(dongu);
}

/* Maç süresi bitti */
function sureBitti(){
  mac.sureSifir = true;
  Ses.buzzer();
  if (Oyun.turnuvaMac !== null && mac.skor.sol === mac.skor.sag){
    mac.altin = true; mesaj('ALTIN BASKET!<small>İlk basketi atan kazanır</small>', 2200);
    return;
  }
  if (mac.faz === 'anim') mac.bitisBekliyor = true;
  else macBitir();
}
/* Bir olay bittikten sonra: maç bitmeli mi? (true → bitti) */
function sonrakiKontrol(){
  if (!mac.bitisBekliyor) return false;
  mac.bitisBekliyor = false;
  if (Oyun.turnuvaMac !== null && mac.skor.sol === mac.skor.sag){
    mac.altin = true; mesaj('ALTIN BASKET!<small>İlk basketi atan kazanır</small>', 2200);
    return false;
  }
  macBitir();
  return true;
}

/* Yeni hücum: iki oyuncuya aynı tipte, farklı sayılarla soru */
function yeniHucum(){
  mac.hucumNo++;
  mac.faz = 'oyun'; mac.ribaundcu = null; mac.hucumSaati = HUCUM_SURESI;
  const ucluk = !mac.altin && mac.kalan <= mac.uclukEsik;
  const tip = karistir(TIPLER.filter(t => t !== mac.sonTip))[0];
  mac.sonTip = tip;
  const a = mac.top, s = rakip(a);
  const qa = soruUret(a, tip, {ucluk});
  qa.puan = ucluk ? 2 : 1;
  const qs = soruUret(s, tip, {haric:[qa.n]});
  mac.soru[a] = qa; mac.soru[s] = qs;
  mac.kilit.sol = mac.kilit.sag = false;
  P.forEach(panelCiz);
  skorCiz();
}

/* =========================================================
   L. CEVAP AKIŞI
   ========================================================= */
function cevapVer(p, dogru, verilen){
  const q = mac.soru[p];
  if (dogru){ mac.istat.dogru[p]++; Ses.dogru(); }
  else {
    mac.istat.yanlis[p]++;
    if (!mac.istat.ilkYanlis[p]) mac.istat.ilkYanlis[p] = {n:q.n, d:q.d, u:q.u};
  }
  const neden = dogru ? '' : nedenYaz(q, verilen);
  if (mac.faz === 'oyun'){
    if (p === mac.top) dogru ? basket(p, q) : kacir(p, q, neden);
    else dogru ? topCal(p) : savunmaHata(p, q, neden);
  } else if (mac.faz === 'ribaund' && p === mac.ribaundcu){
    ribaundBitir(p, dogru, q, neden);
  }
}
function hepsiniKilitle(){ mac.kilit.sol = mac.kilit.sag = true; }

async function basket(p, q){
  mac.faz = 'anim'; hepsiniKilitle();
  const r = rakip(p);
  panelKilit(p, 'Şut!', 'Doğru cevap!');
  panelKilit(r, 'Şut geliyor...', '');
  figurZipla(p);
  if (!await sut(p, true)) return;
  mac.skor[p] += q.puan; skorCiz(p);
  if (!Ses.ornek('file', .9)) Ses.file();
  if (!Ses.ornek('basket', .85, .12)) Ses.alkis();
  kalabalikCosku(); puanYazi(r, q.puan);
  mesaj(q.puan === 2 ? 'BONUS! +2' : 'BASKET! +1');
  if (!await bekle(600)) return;
  if (mac.altin){ macBitir(); return; }
  mac.top = r;
  if (!await topVer(r, 550)) return;
  if (sonrakiKontrol()) return;
  yeniHucum();
}

async function kacir(p, q, neden){
  mac.faz = 'anim'; hepsiniKilitle();
  const r = rakip(p);
  Ses.yanlis();
  panelKilit(p, 'Kaçtı!', `${neden}<br>Ribaund rakibinde.`);
  panelKilit(r, 'Ribaund geliyor!', 'Hazır ol...');
  figurZipla(p);
  if (!await sut(p, false)) return;
  Ses.ornek('kacti', .9);
  mesaj('KAÇTI!<small>Ribaund!</small>');
  if (sonrakiKontrol()) return;
  mac.faz = 'ribaund'; mac.ribaundcu = r; mac.hucumSaati = HUCUM_SURESI;
  mac.soru[r] = soruKopya(q);
  mac.kilit[r] = false;
  panelCiz(r);
  panelKilit(p, 'Ribaund...', `${mac.takim[r].ad} aynı soruyu çözüyor.`);
}

async function ribaundBitir(r, dogru, q, neden){
  mac.faz = 'anim'; hepsiniKilitle();
  const p = rakip(r);
  if (dogru) panelKilit(r, 'Ribaund senin!', 'Doğru cevap.');
  else { Ses.yanlis(); panelKilit(r, 'Olmadı ama top sende.', neden); }
  panelKilit(p, 'Doğrusu:', `<b>${modelYazi(q)}</b>`);
  modelGoster(q);
  mac.top = r;
  skorCiz();
  if (!await topVer(r, 600)) return;
  if (!await bekle(1800)) return;
  modelGizle();
  if (sonrakiKontrol()) return;
  yeniHucum();
}

async function topCal(p){
  mac.faz = 'anim'; hepsiniKilitle();
  const a = rakip(p);
  Ses.cal(); Ses.ornek('calindi', .8, .05); mesaj('TOP ÇALINDI!');
  panelKilit(p, 'Topu çaldın!', 'Şimdi sen hücumdasın.');
  panelKilit(a, 'Top çalındı!', 'Rakibin senden önce bildi.');
  mac.top = p; skorCiz();
  if (!await topVer(p, 550)) return;
  if (!await bekle(300)) return;
  if (sonrakiKontrol()) return;
  yeniHucum();
}

function savunmaHata(p, q, neden){
  Ses.yanlis();
  mac.kilit[p] = true;
  panelKilit(p, 'Olmadı!', `${neden}<br><b>${modelYazi(q)}</b>`);
  const id = mac.id, hn = mac.hucumNo;
  setTimeout(() => {
    if (id !== mac.id || hn !== mac.hucumNo || mac.faz !== 'oyun') return;
    const qa = mac.soru[mac.top];
    mac.soru[p] = soruUret(p, qa.tip, {haric:[qa.n]});
    mac.kilit[p] = false;
    panelCiz(p);
  }, SAVUNMA_CEZA_MS);
}

async function hucumSuresiDoldu(){
  if (mac.faz === 'ribaund'){
    const r = mac.ribaundcu;
    ribaundBitir(r, false, mac.soru[r], 'Süre doldu.');
    return;
  }
  if (mac.faz !== 'oyun') return;
  mac.faz = 'anim'; hepsiniKilitle();
  const a = mac.top, s = rakip(a);
  Ses.kisaBuzzer(); mesaj('HÜCUM SÜRESİ DOLDU!');
  panelKilit(a, 'Süre doldu!', 'Top rakibe geçiyor.');
  panelKilit(s, 'Top sana geliyor!', '');
  mac.top = s; skorCiz();
  if (!await topVer(s, 550)) return;
  if (sonrakiKontrol()) return;
  yeniHucum();
}

function macBitir(){
  if (mac.faz === 'bitti') return;
  mac.faz = 'bitti'; hepsiniKilitle();
  const id = mac.id;
  Ses.duduk(); mesaj('MAÇ BİTTİ!', 1600);
  P.forEach(p => panelKilit(p, 'Maç bitti!', ''));
  Oyun.sonuc = {
    takim:{...mac.takim}, skor:{...mac.skor},
    dogru:{...mac.istat.dogru}, yanlis:{...mac.istat.yanlis}, ilkYanlis:{...mac.istat.ilkYanlis},
    turnuvaMac: Oyun.turnuvaMac,
  };
  if (Oyun.turnuvaMac !== null){
    const m = Turnuva.maclar[Oyun.turnuvaMac];
    m.sa = mac.skor.sol; m.sb = mac.skor.sag;
    m.k = mac.skor.sol >= mac.skor.sag ? m.a : m.b;
    const [y1, y2, f] = Turnuva.maclar;
    if (y1.k && y2.k && !f.a){ f.a = y1.k; f.b = y2.k; }
  }
  setTimeout(() => { if (id === mac.id) Sahne.goster('sonuc'); }, 1700);
}

/* =========================================================
   M. PANEL ÇİZİMİ VE GİRDİ
   ========================================================= */
const ROL = {
  hucum:   {ad:'HÜCUM',   ipucu:'Doğru yap, basket at!', sut:'ŞUT!'},
  savunma: {ad:'SAVUNMA', ipucu:'Önce sen bil, topu çal!', sut:'ÇAL!'},
  ribaund: {ad:'RİBAUND', ipucu:'Aynı soru. Topu kap!', sut:'KAP!'},
};
function panelRol(p){
  if (mac.faz === 'ribaund' && p === mac.ribaundcu) return 'ribaund';
  return p === mac.top ? 'hucum' : 'savunma';
}
function soruHTML(q, rol){
  if (q.tip === 'kur'){
    return `<div class="soru-metin"><b>${q.n}</b> sayısını kur</div>
      <div class="kurma-alani">
        <div class="sira"><span class="sira-etiket">Onluklar</span><div class="dizi" data-dizi="file"></div></div>
        <div class="sira"><span class="sira-etiket">Birlikler</span><div class="dizi" data-dizi="top"></div></div>
      </div>
      <div class="ipucu"></div>
      <div class="kur-dugmeler">
        <button class="kur-dugme" data-e="file">${fileHTML()} +10</button>
        <button class="kur-dugme" data-e="top">${topHTML()} +1</button>
        <button class="kur-dugme sut" data-e="sut">${ROL[rol].sut}</button>
      </div>`;
  }
  const secenek = q.secenekler.map(v => `<button class="secenek" data-e="sec" data-v="${v}">${v}</button>`).join('');
  if (q.tip === 'oku'){
    return `<div class="soru-metin">Kaç top var?</div>
      <div class="kurma-alani salt">
        <div class="sira"><span class="sira-etiket">Onluklar</span><div class="dizi">${fileHTML().repeat(q.d)}</div></div>
        <div class="sira"><span class="sira-etiket">Birlikler</span><div class="dizi">${topHTML().repeat(q.u)}</div></div>
      </div>
      <div class="secenekler">${secenek}</div>`;
  }
  return `<div class="soru-metin">Sarı rakamın değeri kaç?</div>
    <div class="buyuk-sayi"><span class="${q.hane==='onlar'?'vurgu':''}">${q.d}</span><span class="${q.hane==='birler'?'vurgu':''}">${q.u}</span></div>
    <div class="secenekler">${secenek}</div>`;
}
function panelCiz(p){
  const el = panelEl[p], t = mac.takim[p], q = mac.soru[p];
  const rol = panelRol(p);
  el.className = `panel ${p} ${rol}` + (q && q.puan === 2 && rol === 'hucum' ? ' ucluk' : '');
  el.style.setProperty('--tr', t.renk);
  el.innerHTML = `
    <div class="panel-ust">${amblem(t)}<span class="ad">${t.ad}</span><span class="rol-ipucu">${q ? ROL[rol].ipucu : ''}</span><span class="ucluk-rozet">BONUS · 2 sayı</span><span class="rol">${ROL[rol].ad}</span></div>
    <div class="hucum-saati"><div class="dolum"></div></div>
    <div class="soru-alani">${q ? soruHTML(q, rol) : ''}</div>
    <div class="panel-kilit"><div class="k-baslik"></div><div class="k-yazi"></div></div>`;
  if (q && q.tip === 'kur') kurCiz(p);
}
function kurCiz(p){
  const q = mac.soru[p], el = panelEl[p];
  const f = el.querySelector('[data-dizi="file"]'), t = el.querySelector('[data-dizi="top"]');
  if (f) f.innerHTML = fileHTML('data-e="cikarFile"').repeat(q.dosya);
  if (t) t.innerHTML = topHTML('data-e="cikarTop"').repeat(q.top);
}
function panelKilit(p, baslik, yazi){
  const k = panelEl[p].querySelector('.panel-kilit'); if (!k) return;
  k.querySelector('.k-baslik').innerHTML = baslik;
  k.querySelector('.k-yazi').innerHTML = yazi || '';
  k.classList.add('goster');
}
const ipucuZaman = {};
function ipucu(p, yazi){
  const el = panelEl[p].querySelector('.ipucu'); if (!el) return;
  el.textContent = yazi; clearTimeout(ipucuZaman[p]);
  ipucuZaman[p] = setTimeout(() => { el.textContent = ''; }, 2200);
}

/* Her panel kendi dokunuşunu ayrı dinler (iki çocuk aynı anda dokunabilir) */
P.forEach(p => {
  panelEl[p].addEventListener('pointerdown', e => {
    const b = e.target.closest('[data-e]'); if (!b) return;
    e.preventDefault();
    if (mac.duraklat || mac.kilit[p]) return;
    const aktifSoru = mac.faz === 'oyun' || (mac.faz === 'ribaund' && p === mac.ribaundcu);
    if (!aktifSoru) return;
    const q = mac.soru[p]; if (!q) return;
    switch (b.dataset.e){
      case 'file':
        if (q.dosya >= 9){ Ses.uyari(); ipucu(p, 'En fazla 9 file koyabilirsin.'); return; }
        q.dosya++; Ses.dokun(); kurCiz(p); break;
      case 'top':
        if (q.top >= 9){ Ses.uyari(); ipucu(p, '10 tek top = 1 file! File ekle.'); return; }
        q.top++; Ses.sektir(); kurCiz(p); break;
      case 'cikarFile': if (q.dosya > 0){ q.dosya--; Ses.dokun(); kurCiz(p); } break;
      case 'cikarTop':  if (q.top > 0){ q.top--; Ses.dokun(); kurCiz(p); } break;
      case 'sut':
        if (q.dosya + q.top === 0){ Ses.uyari(); ipucu(p, 'Önce file ve top koy.'); return; }
        cevapVer(p, q.dosya === q.d && q.top === q.u, {dosya:q.dosya, top:q.top});
        break;
      case 'sec': {
        const v = +b.dataset.v, dogru = v === q.cevap;
        b.classList.add(dogru ? 'dogru' : 'yanlis');
        cevapVer(p, dogru, {deger:v});
        break;
      }
    }
  });
});

/* Skor tablosu ve saatler */
function skorCiz(pop){
  $('skSol').textContent = mac.skor.sol; $('skSag').textContent = mac.skor.sag;
  $('skTopSol').classList.toggle('var', mac.top === 'sol');
  $('skTopSag').classList.toggle('var', mac.top === 'sag');
  $('isik-sol').classList.toggle('acik', mac.top === 'sol');
  $('isik-sag').classList.toggle('acik', mac.top === 'sag');
  if (pop){ const el = $(pop === 'sol' ? 'skSol' : 'skSag'); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
}
function saatCiz(){
  const s = $('sure');
  if (mac.altin){ s.textContent = 'ALTIN'; s.classList.add('altin'); }
  else {
    const k = Math.ceil(mac.kalan);
    s.textContent = Math.floor(k/60) + ':' + String(k%60).padStart(2,'0');
    s.classList.remove('altin');
  }
  $('uclukIsaret').classList.toggle('goster', !mac.altin && mac.saatAkiyor && mac.kalan <= mac.uclukEsik && mac.kalan > 0);
}
function hucumSaatiCiz(){
  const kim = mac.faz === 'ribaund' ? mac.ribaundcu : (mac.faz === 'oyun' ? mac.top : null);
  if (!kim) return;
  const d = panelEl[kim].querySelector('.dolum'); if (!d) return;
  const oran = Math.max(0, mac.hucumSaati / HUCUM_SURESI);
  d.style.transform = `scaleX(${oran})`;
  d.classList.toggle('az', oran < .3);
}

/* Mola */
$('molaBtn').addEventListener('click', () => {
  if (mac.faz === 'bitti') return;
  Ses.dokun(); mac.duraklat = true; $('molaPerde').classList.add('goster');
});
$('devamBtn').addEventListener('click', () => {
  Ses.dokun(); mac.duraklat = false; mac.sonT = performance.now(); $('molaPerde').classList.remove('goster');
});

/* =========================================================
   N. EKRAN 5 — MAÇ SONU
   ========================================================= */
function sonucCiz(){
  const s = Oyun.sonuc; if (!s) return;
  const {sol, sag} = s.skor;
  const kazanan = sol > sag ? 'sol' : sag > sol ? 'sag' : null;
  const tur = s.turnuvaMac !== null;
  const finalBitti = tur && sampiyon();
  $('sonucBaslik').textContent = finalBitti ? `Şampiyon: ${takimBul(sampiyon()).ad}!` : kazanan ? `${s.takim[kazanan].ad} kazandı!` : 'Berabere! İkiniz de harikasınız!';
  $('sonucKutu').innerHTML = P.map(p => {
    const y = s.ilkYanlis[p];
    return `<div class="sonuc-takim ${kazanan===p?'kazanan':''}" style="--tr:${s.takim[p].renk}">
      ${kazanan===p ? `<svg class="tac" viewBox="0 0 100 70" aria-hidden="true"><path d="M8 62 L14 18 L34 40 L50 6 L66 40 L86 18 L92 62 Z" fill="#FFD600" stroke="#B8860B" stroke-width="5" stroke-linejoin="round"/><circle cx="50" cy="44" r="7" fill="#FF4D8D"/></svg>` : ''}
      ${amblem(s.takim[p])}
      <div class="sonuc-ad">${s.takim[p].ad}</div>
      <div class="sonuc-skor">${s.skor[p]}</div>
      <div class="sonuc-dogru">Doğru cevap: ${s.dogru[p]}</div>
      ${y ? `<div class="sonuc-yanlis">Bir yanlışın vardı. Doğrusu:<b>${modelYazi(y)}</b>${modelResim(y.d,y.u)}</div>`
          : `<div class="sonuc-yanlis iyi"><b>Hiç yanlış yok!</b></div>`}
    </div>`;
  }).join('<div class="sonuc-vs">VS</div>');
  $('sonucDugmeler').innerHTML = !tur
    ? `<button class="dugme yesil" data-git="mac">↻ Rövanş</button><button class="dugme mavi" data-git="takim">Yeni Takımlar</button><button class="dugme gri" data-git="giris">Ana Menü</button>`
    : finalBitti
      ? `<button class="dugme mavi" data-git="takim">Yeni Turnuva</button><button class="dugme gri" data-git="giris">Ana Menü</button>`
      : `<button class="dugme yesil" data-git="tablo">Turnuva Tablosu →</button><button class="dugme gri" data-git="giris">Ana Menü</button>`;
  // konfeti
  const k = $('konfeti'); k.innerHTML = '';
  if (kazanan){
    const renk = [s.takim[kazanan].renk, '#FFD600', '#FF6B35', '#4D9FFF', '#00C9A7'];
    for (let i=0;i<60;i++){
      const c = document.createElement('i');
      c.style.left = Math.random()*100 + 'vw';
      c.style.background = renk[i % renk.length];
      c.style.animationDuration = (2.2 + Math.random()*2) + 's';
      c.style.animationDelay = (Math.random()*1.2) + 's';
      k.appendChild(c);
    }
  }
  if (!Ses.ornek('macSonu', .9)) Ses.alkis();
}
Sahne.kanca('sonuc', sonucCiz, () => { $('konfeti').innerHTML = ''; });

/* =========================================================
   O. EKRAN 6 — AYARLAR
   ========================================================= */
let sifirOnay = false;
function ayarCiz(){
  const seg = (ad, deger, secenekler) => `<div class="segment">${secenekler.map(([v,y]) =>
    `<button data-ayar="${ad}" data-deger="${v}" class="${String(deger)===String(v)?'secili':''}">${y}</button>`).join('')}</div>`;
  $('ayarKutusu').innerHTML = `
    <div class="ayar-satir"><div class="ayar-ad">Ses</div>${seg('ses', Ayar.ses, [[true,'Açık'],[false,'Kapalı']])}</div>
    <div class="ayar-satir"><div class="ayar-ad">Taraftar sesi<small>Basket alkışı, "ooo", tebrik coşkusu</small></div>${seg('taraftar', Ayar.taraftar, [[true,'Açık'],[false,'Kapalı']])}</div>
    <div class="ayar-satir"><div class="ayar-ad">Zorluk<small>Kolay: 10–55 · Orta: 10–99 · Zor: büyük birler</small></div>${seg('zorluk', Ayar.zorluk, [['kolay','Kolay'],['orta','Orta'],['zor','Zor']])}</div>
    <div class="ayar-satir"><div class="ayar-ad">Maç süresi</div>${seg('sure', Ayar.sure, [[1,'1 dk'],[1.5,'1,5 dk'],[2,'2 dk'],[3,'3 dk'],[5,'5 dk']])}</div>
    <div class="ayar-satir"><div class="ayar-ad">Mod<small>Turnuva: 4 takım, yarı final ve final</small></div>${seg('mod', Ayar.mod, [['tek','Tek Maç'],['turnuva','Turnuva']])}</div>
    <div class="ayar-satir"><div class="ayar-ad">Sıfırla<small>Ayarlar ve son takımlar silinir</small></div><div class="segment"><button data-sifirla class="${sifirOnay?'tehlike':''}">${sifirOnay?'Emin misin? Dokun':'Sıfırla'}</button></div></div>`;
}
$('ayarKutusu').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  Ses.dokun();
  if (b.hasAttribute('data-sifirla')){
    if (!sifirOnay){ sifirOnay = true; ayarCiz(); return; }
    sifirOnay = false; ayarSifirla(); ayarCiz(); return;
  }
  sifirOnay = false;
  const ad = b.dataset.ayar, v = b.dataset.deger;
  if (ad === 'ses') Ayar.ses = v === 'true';
  else if (ad === 'taraftar') Ayar.taraftar = v === 'true';
  else if (ad === 'sure') Ayar.sure = +v;
  else if (ad === 'zorluk' || ad === 'mod') Ayar[ad] = v;
  ayarKaydet(); ayarCiz();
});
Sahne.kanca('ayarlar', () => { sifirOnay = false; ayarCiz(); });

/* =========================================================
   P. BAŞLANGIÇ
   ========================================================= */
ayarYukle();
Sahne.goster('giris');
</script>
</body>
</html>
