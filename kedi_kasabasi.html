<title>Kedi Kasabası — 100'e Kadar Sayılar</title>

<!--
=====================================================================
  KEDİ KASABASI — sinanince.com
  Kazanım: Sayılar ve Nicelikler (1) — 100'e kadar doğal sayılar,
           okuma, yazma ve ritmik saymalar (2. sınıf)

  YAPIM DURUMU
    [x] Aşama 1 — İskelet: sahne yöneticisi, ekranlar, geçişler,
                  kayıt katmanı, Ayarlar, altbilgi
    [x] Aşama 2 — Ortak parçalar (tuş takımı, soru kartı, geri bildirim,
                  sesler, sayı→yazı, sesli okuma)
    [x] Aşama 3 — Çatılar (ritmik sayma)
    [x] Aşama 4 — Mama Postası (okuma–yazma)
    [x] Aşama 5 — Kedi Sepetleri (onluk–birlik)
    [x] Aşama 6 — Ekonomi + Kedi Evi
    [x] Aşama 7 — Görsel cilalama + cihaz testleri
    [ ] Aşama 8 — İçerik ayarı (sınıfta kullanıldıktan sonra)

  KAPANAN KARARLAR (spec v0.1 soruları)
    1. Zorluk seçimi serbest; kilit yok.
    2. Ritmik adımlar: Kolay 10-5 · Orta 2-5-10 · Zor 2-3-4-5-10.
       Kolay/Orta başlangıç sayısı adımın katı; Zor'da herhangi bir sayı.
       İleri ve geri; geri saymada 0'a inilebilir.
    3. Kolay 1–50 (seçme) · Orta 1–100 (yazma, destekli) ·
       Zor 1–100 (yazma, desteksiz, ters turlar).
       Çatılar'da ritmik diziler her zorlukta 0–100 arasında kalır.
    Çatılar ayrıntısı:
       Kolay → 3 çatı görünür, sıradaki çatı 4 çatı arasından seçilir; adım okları var.
       Orta  → 3 çatı görünür, sıradaki sayı yazılır; adım okları var.
       Zor   → 5 çatıdan biri boş (herhangi bir yerde), adım söylenmez, ok yok.
       Turda her adım en az bir kez gelir; aynı adım üst üste en fazla 2 kez gelir.
    Mama Postası ayrıntısı (iki soru türü):
       Kapı   → zarfta okunuş yazar, çocuk kapı numarasını bulur (söz → rakam).
       Okunuş → kapıda numara yazar, çocuk okunuşu bulur (rakam → söz).
       Kolay  → 5 Kapı + 5 Okunuş, seçerek (1–50).
       Orta   → 10 Kapı, yazarak; destek: okunuşta ve tuş ekranında onlar/birler renkli.
       Zor    → 5 Kapı (desteksiz yazma) + 5 Okunuş (kelime kartlarından kurma, 10–99).
       Tekrar havuzundan her tura en fazla 2 sayı geri gelir.
    Kedi Sepetleri ayrıntısı (her sepette 10 kedi):
       Say → sepetler ve tek kediler görünür, çocuk toplamı bulur.
       Kur → sayı verilir, çocuk + / − ile sepet ve kedi ekleyerek kurar.
             10. tek kedi eklenince 10 kedi kendiliğinden bir sepete dolar.
       Kolay → 10 Say, seçerek (1–50); sepetlerde "10" rozeti.
       Orta  → 10 Say, yazarak; rozet + "Sepetler (onlar) / Kediler (birler)" etiketi + renkli tuş ekranı.
       Zor   → 5 Say (sepet ve kediler karışık, rozetsiz) + 5 Kur.
       Yanlış Say cevabında sahnede onar onar, sonra birer birer sayma gösterilir.
    4. Sesli okuma: tarayıcının Türkçe sesi varsa açık; yoksa gizli.
    5. Tek profil.
    6. 8 kedi + 6 aksesuar (hepsi kozmetik, oynanışı etkilemez).
       Kazanç: her doğru Kolay 1 · Orta 2 · Zor 3 balık (turda en çok 10 / 20 / 30).
       Kediler: Sarman (hediye) · Tekir 15 · Pamuk 20 · Kömür 25 · Benekli 30 ·
                Duman 40 · Pembiş 50 · Galaksi 60
       Aksesuarlar (bir kez alınır, her kediye takılabilir; kedi başına bir tane):
                Tasma 10 · Papyon 15 · Şapka 20 · Gözlük 25 · Pelerin 35 · Taç 50
       Hepsi ≈ 395 balık. Kedi Evi'nde önce denenir (önizleme), sonra alınır.
       Seçilen kedi açılışta, Çatılar'da, Postada, tur sonunda ve geri bildirim panelinde görünür.
    Kedi Evi düzeni:
       Üstte "Kedilerim": sahip olunan kediler yan yana, minder üstünde; ara sıra
       rastgele biri pati yalar. Dokunulan kedi oyundaki kedi olur ("Oyunda" işareti).
       Altta önizleme + dükkân: Kediler sekmesinde alınmamış kediler, Aksesuarlar
       sekmesinde oyundaki kedi için Tak / Çıkar / Satın al (satın alınca takılır).
    İçerik: 0–100 okunuş listesi (Sayi.yazi) Sinan tarafından onaylandı.

  Sinan İnce 2026
=====================================================================
-->
<style>
/* =========================================================
   1. TEMA DEĞİŞKENLERİ (site paleti)
   ========================================================= */
:root{
  --turuncu:#FF6B35;
  --sari:#FFD600;
  --pembe:#FF4D8D;
  --yesil:#00C9A7;
  --mavi:#4D9FFF;
  --mor:#A855F7;
  --zemin:#FFF8F0;
  --kart:#FFFFFF;
  --yazi:#2B2140;
  --yazi-soluk:#6B6080;
  --cizgi:#EADFD2;
  --kirmizi:#E5484D;
  --golge:0 6px 0 rgba(43,33,64,.12), 0 10px 24px rgba(43,33,64,.10);
  --golge-kucuk:0 4px 0 rgba(43,33,64,.12);
  --kose:24px;
  --kose-kucuk:16px;
  --font:"Nunito","Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;
  --ust-yukseklik:clamp(56px,8vh,76px);
}

/* =========================================================
   2. TEMEL
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--font);
  color:var(--yazi);
  background:var(--zemin);
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
  overflow:hidden;
  overscroll-behavior:none;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:4px solid var(--mavi);outline-offset:3px}
svg{display:block}
.gizli{display:none !important}

#uygulama{
  height:100dvh;height:100vh;
  display:flex;flex-direction:column;
  /* dekoratif zemin: hafif pati izleri */
  background:
    radial-gradient(circle at 12% 18%, rgba(255,214,0,.18) 0 60px, transparent 61px),
    radial-gradient(circle at 88% 82%, rgba(255,77,141,.12) 0 90px, transparent 91px),
    var(--zemin);
}
@supports (height:100dvh){ #uygulama{height:100dvh} }

/* =========================================================
   3. ÜST ÇUBUK
   ========================================================= */
#ust{
  flex:0 0 var(--ust-yukseklik);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:8px;padding:0 clamp(10px,2vw,24px);
  padding-top:env(safe-area-inset-top);
}
#ust .sol{justify-self:start}
#ust .sag{justify-self:end;display:flex;gap:10px;align-items:center}
#ustBaslik{
  margin:0;font-size:clamp(20px,3.2vw,34px);font-weight:900;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50vw;
}
.ust-dugme{
  min-width:56px;min-height:52px;padding:0 16px;
  display:flex;align-items:center;gap:8px;
  background:var(--kart);border-radius:var(--kose-kucuk);
  box-shadow:var(--golge-kucuk);font-weight:800;font-size:clamp(16px,2vw,22px);
}
.ust-dugme:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(43,33,64,.12)}
.ust-dugme svg{width:26px;height:26px}
#balikSayaci{
  display:flex;align-items:center;gap:8px;
  background:var(--kart);border-radius:999px;padding:6px 16px 6px 10px;
  box-shadow:var(--golge-kucuk);font-weight:900;font-size:clamp(18px,2.4vw,26px);
}
#balikSayaci svg{width:34px;height:34px}
#balikSayaci.zipla{animation:zipla .5s}

/* =========================================================
   4. SAHNELER
   ========================================================= */
#sahneler{flex:1 1 auto;position:relative;min-height:0}
.sahne{
  position:absolute;inset:0;
  display:none;flex-direction:column;align-items:center;
  padding:clamp(8px,2vh,24px) clamp(12px,3vw,40px);
  overflow-y:auto;overflow-x:hidden;
}
.sahne.aktif{display:flex;animation:sahneGir .28s ease-out}
/* dikeyde ortalama: içerik taşarsa üstü kesilmez, kaydırılabilir */
.sahne.orta > :first-child{margin-top:auto}
.sahne.orta > :last-child{margin-bottom:auto}
@keyframes sahneGir{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes zipla{0%,100%{transform:scale(1)}40%{transform:scale(1.18)}}
@keyframes suzul{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* ---- ortak düğme ---- */
.dugme{
  min-height:64px;padding:12px 32px;border-radius:var(--kose);
  font-size:clamp(20px,2.8vw,30px);font-weight:900;color:#fff;
  background:var(--turuncu);box-shadow:var(--golge);
  transition:transform .08s;
}
.dugme:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(43,33,64,.12)}
.dugme.ikincil{background:var(--kart);color:var(--yazi)}
.dugme.yesil{background:var(--yesil)}
.dugme.kirmizi{background:var(--kirmizi)}
.dugme.kucuk{min-height:52px;font-size:clamp(16px,2vw,22px);padding:8px 20px}

/* ---- yıldızlar ---- */
.yildizlar{display:flex;gap:4px;align-items:center}
.yildizlar svg{width:24px;height:24px}
.yildiz-dolu{fill:var(--sari);stroke:#E0A800}
.yildiz-bos{fill:#EDE6DC;stroke:#D6CCBE}

/* =========================================================
   5. AÇILIŞ
   ========================================================= */
#sahne-acilis{gap:clamp(10px,2.5vh,28px);text-align:center}
#sahne-acilis .acilis-kedi{width:clamp(140px,26vh,260px);animation:suzul 3s ease-in-out infinite}
#sahne-acilis h1{
  margin:0;font-size:clamp(40px,8vw,88px);font-weight:900;line-height:1;
  color:var(--turuncu);text-shadow:0 4px 0 rgba(43,33,64,.12);
}
#sahne-acilis .alt-baslik{margin:0;font-size:clamp(18px,2.6vw,28px);font-weight:800;color:var(--yazi-soluk)}
#sahne-acilis .dugmeler{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
#sahne-acilis .dugme.buyuk{min-width:240px;min-height:80px;font-size:clamp(26px,3.6vw,40px)}

/* =========================================================
   6. HARİTA
   ========================================================= */
.harita-izgara{
  width:100%;max-width:1400px;
  display:grid;gap:clamp(12px,2vw,28px);
  grid-template-columns:repeat(4,1fr);
}
.bolge-kart{
  background:var(--kart);border-radius:var(--kose);box-shadow:var(--golge);
  padding:clamp(14px,2vh,24px) 12px;
  display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
  border-top:10px solid var(--bolge-renk,var(--turuncu));
  transition:transform .1s;
}
.bolge-kart:active{transform:translateY(4px) scale(.98)}
.bolge-kart .ikon{width:clamp(90px,16vh,170px);height:clamp(90px,16vh,170px)}
.bolge-kart .ad{font-size:clamp(22px,2.6vw,32px);font-weight:900}
.bolge-kart .alt{font-size:clamp(16px,1.8vw,22px);font-weight:700;color:var(--yazi-soluk)}
.bolge-kart .yildiz-ozet{
  display:flex;align-items:center;gap:6px;font-weight:900;font-size:clamp(16px,1.8vw,22px);
  background:var(--zemin);border-radius:999px;padding:4px 12px;
}
.bolge-kart .yildiz-ozet svg{width:22px;height:22px}

/* =========================================================
   7. ZORLUK SEÇİMİ
   ========================================================= */
#sahne-zorluk{gap:clamp(12px,3vh,32px)}
#sahne-zorluk .soru-baslik{margin:0;font-size:clamp(24px,3.4vw,40px);font-weight:900;text-align:center}
.zorluk-izgara{
  width:100%;max-width:1100px;display:grid;gap:clamp(12px,2vw,28px);
  grid-template-columns:repeat(3,1fr);
}
.zorluk-kart{
  background:var(--kart);border-radius:var(--kose);box-shadow:var(--golge);
  padding:clamp(16px,3vh,32px) 12px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  border-bottom:10px solid var(--zorluk-renk);
}
.zorluk-kart:active{transform:translateY(4px)}
.zorluk-kart .ad{font-size:clamp(28px,4vw,48px);font-weight:900;color:var(--zorluk-renk)}
.zorluk-kart .alt{font-size:clamp(18px,2.2vw,26px);font-weight:800}
.zorluk-kart .odul{display:flex;align-items:center;gap:6px;font-weight:800;color:var(--yazi-soluk);font-size:clamp(15px,1.8vw,20px)}
.zorluk-kart .odul svg{width:26px;height:26px}
.zorluk-kart .yildizlar svg{width:clamp(26px,3.4vw,40px);height:clamp(26px,3.4vw,40px)}

/* =========================================================
   8. OYUN SAHNELERİ
   ========================================================= */
.oyun-sahne{gap:20px;text-align:center}

/* =========================================================
   9. TUR SONU
   ========================================================= */
.tursonu-kart{
  background:var(--kart);border-radius:var(--kose);box-shadow:var(--golge);
  padding:clamp(20px,4vh,40px) clamp(20px,4vw,56px);
  display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,18px);
  text-align:center;max-width:720px;width:100%;
}
.tursonu-kart h2{margin:0;font-size:clamp(30px,4.4vw,52px);font-weight:900}
.tursonu-kart .buyuk-yildizlar{display:flex;gap:12px}
.tursonu-kart .buyuk-yildizlar svg{width:clamp(56px,9vh,96px);height:clamp(56px,9vh,96px)}
.tursonu-kart .buyuk-yildizlar svg.yeni{animation:zipla .6s both}
.tursonu-kart .sonuc-satir{font-size:clamp(20px,2.6vw,30px);font-weight:800}
.tursonu-kart .kazanc{
  display:flex;align-items:center;gap:10px;font-size:clamp(24px,3.2vw,38px);font-weight:900;
  background:var(--zemin);border-radius:999px;padding:6px 22px;
}
.tursonu-kart .kazanc svg{width:44px;height:44px}
.tursonu-kart .rekor{font-weight:900;color:var(--pembe);font-size:clamp(18px,2.2vw,24px)}
.tursonu-kart .tekrar-liste{font-weight:700;color:var(--yazi-soluk);font-size:clamp(16px,1.8vw,20px)}
.tursonu-kart .dugmeler{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

/* =========================================================
   10. KEDİ EVİ — önizleme + dükkân (kediler / aksesuarlar)
   ========================================================= */
#sahne-kediEvi{gap:16px}
.ev-duzen{width:100%;max-width:1300px;display:flex;flex-direction:column;gap:clamp(12px,2vh,24px)}
.ev-alt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:clamp(12px,2.4vw,32px);align-items:start}
/* Kedilerim rafı */
.kedi-raf-kart{
  background:linear-gradient(#FFFFFF 0%, #FFF7EC 100%);border-radius:var(--kose);box-shadow:var(--golge);
  padding:clamp(10px,1.8vh,20px) clamp(10px,2vw,24px) clamp(10px,1.6vh,18px);
}
.raf-baslik{display:flex;align-items:baseline;justify-content:center;gap:4px 12px;flex-wrap:wrap;font-weight:900;font-size:clamp(20px,2.8vh,30px)}
.raf-ipucu{font-size:clamp(14px,1.8vh,19px);color:var(--yazi-soluk);font-weight:800}
.kedi-raf{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:clamp(18px,3vh,30px) clamp(4px,1.2vw,18px);padding-top:clamp(30px,4.4vh,44px)}
.kedi-yer{position:relative;display:flex;flex-direction:column;align-items:center;padding:0 2px;transition:transform .15s}
.kedi-yer:active{transform:scale(.95)}
.kedi-yer .raf-kedi{width:clamp(62px,11.5vh,124px);height:auto;position:relative;z-index:1;margin-bottom:calc(clamp(62px,11.5vh,124px) * -.1)}
.kedi-yer .minder{
  width:clamp(70px,13vh,140px);height:clamp(16px,2.8vh,30px);border-radius:50%;
  background:radial-gradient(ellipse at 50% 30%, #FFD9E7, #FF97BD);box-shadow:0 4px 0 rgba(43,33,64,.12);
}
.kedi-yer.oyunda .minder{background:radial-gradient(ellipse at 50% 30%, #FFF4B8, #FFC400)}
.raf-ad{font-weight:900;font-size:clamp(14px,1.8vh,19px);margin-top:4px}
.kedi-yer.oyunda .raf-ad{color:#D93673}
.kedi-yer.yeni{animation:zipla .5s 2}
.oyunda-isaret{
  position:absolute;top:0;left:50%;transform:translate(-50%,-100%);z-index:2;white-space:nowrap;
  background:var(--pembe);color:#fff;font-weight:900;font-size:clamp(12px,1.6vh,16px);
  padding:2px 10px;border-radius:999px;animation:isaret-zipla 1.6s ease-in-out infinite;
}
.oyunda-isaret::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--pembe);border-bottom:0}
@keyframes isaret-zipla{0%,100%{transform:translate(-50%,-100%)}50%{transform:translate(-50%,calc(-100% - 6px))}}
/* pati yalama: sol ön pati ağza gider, gözler kapanır, dil çıkar */
.yalama-pati,.dil{transform-box:fill-box}
.yalama-pati{transform-origin:center}
.dil{transform-origin:50% 0}
.kapali-goz,.dil,.pati-ic{opacity:0}
.yaliyor .pati-ic{animation:goz-kapa 2.4s linear}
.yaliyor .yalama-pati{animation:pati-yala 2.4s ease-in-out}
.yaliyor .kapali-goz{animation:goz-kapa 2.4s linear}
.yaliyor .dil{animation:dil-cik 2.4s linear}
@keyframes pati-yala{
  0%,100%{transform:translate(0,0) rotate(0)}
  16%,40%,64%,84%{transform:translate(1px,-44px) rotate(-25deg)}
  28%,52%,76%{transform:translate(3px,-47px) rotate(-25deg)}
}
@keyframes goz-kapa{0%,12%{opacity:0}17%,86%{opacity:1}92%,100%{opacity:0}}
@keyframes dil-cik{0%,18%{opacity:0}24%,48%,72%{opacity:1}36%,60%{opacity:.15}80%,100%{opacity:0}}
.dukkan-bos{grid-column:1/-1;text-align:center;font-weight:900;font-size:clamp(18px,2.4vh,26px);color:var(--yesil);padding:24px 8px}
.dukkan-kart{cursor:pointer}
.dukkan-kart:focus-visible{outline:4px solid var(--mavi);outline-offset:3px}
.dukkan-kart.takili-kart{background:#E9FBF6}
.kart-dugme{
  margin-top:4px;min-height:40px;padding:0 18px;border-radius:999px;background:var(--yesil);color:#fff;
  font-weight:900;font-size:clamp(15px,1.9vh,20px);box-shadow:var(--golge-kucuk);
}
.kart-dugme.cikar{background:var(--kart);color:var(--yazi);box-shadow:inset 0 0 0 2px var(--cizgi)}
.kart-dugme:active{transform:translateY(2px)}
.ev-onizleme{
  background:var(--kart);border-radius:var(--kose);box-shadow:var(--golge);
  padding:clamp(12px,2.4vh,28px);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
}
.onizleme-sahne{
  width:100%;border-radius:var(--kose-kucuk);display:flex;justify-content:center;padding:clamp(6px,1.6vh,16px);
  background:radial-gradient(ellipse at 50% 92%, #FFC7DC 0 34%, transparent 35%), linear-gradient(#FFF6FA,#FFE3EE);
}
#kediEviKedi{width:clamp(120px,30vh,280px);height:auto;animation:suzul 3s ease-in-out infinite}
.onizleme-ad{font-size:clamp(26px,3.8vh,42px);font-weight:900;line-height:1.1}
.onizleme-durum{font-weight:800;color:var(--yazi-soluk);font-size:clamp(16px,2vh,22px)}
.onizleme-durum.oyunda{color:var(--yesil)}
.onizleme-dugmeler{display:flex;flex-direction:column;gap:10px;width:100%;align-items:center}
.onizleme-dugmeler .dugme{display:inline-flex;align-items:center;justify-content:center;gap:10px}
.dugme .balik-mini{width:clamp(28px,4vh,40px);height:clamp(28px,4vh,40px)}
.dugme.pasif{background:#CFC6BA;box-shadow:none}
.ev-dukkan{display:flex;flex-direction:column;gap:12px;min-width:0}
.sekmeler{display:flex;gap:6px;align-self:center;background:var(--kart);border-radius:999px;padding:6px;box-shadow:var(--golge-kucuk)}
.sekme{min-height:50px;padding:0 24px;border-radius:999px;font-weight:900;font-size:clamp(17px,2.2vh,24px)}
.sekme.secili{background:var(--pembe);color:#fff}
.dukkan-izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(104px,11vw,170px),1fr));gap:clamp(8px,1.4vw,16px)}
.dukkan-kart{
  background:var(--kart);border-radius:var(--kose-kucuk);box-shadow:var(--golge-kucuk);
  padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;border:4px solid transparent;
}
.dukkan-kart:active{transform:translateY(3px)}
.dukkan-kart.secili{border-color:var(--mavi)}
.dukkan-kart .kart-kedi{width:clamp(60px,10vh,112px);height:auto}
.dukkan-kart .kart-yok{width:clamp(60px,10vh,112px);aspect-ratio:1;display:grid;place-items:center;font-size:clamp(28px,4vh,44px);font-weight:900;color:#D6CCBE}
.kart-ad{font-weight:900;font-size:clamp(15px,2vh,22px)}
.kart-fiyat{display:inline-flex;align-items:center;gap:4px;font-weight:900;color:#2F7FE0;font-size:clamp(15px,1.9vh,21px)}
.kart-fiyat svg{width:24px;height:24px}
.kart-durum{font-weight:900;font-size:clamp(13px,1.7vh,18px);color:var(--yesil)}
.kart-durum.oyunda{color:#fff;background:var(--yesil);border-radius:999px;padding:0 10px}
@media (orientation:portrait) and (max-width:1100px), (max-width:760px){
  .ev-alt{grid-template-columns:1fr}
  /* dikeyde kediler küçülür ki satıra 4–5 tane sığsın */
  .kedi-raf{gap:22px 6px;padding-top:30px}
  .kedi-yer .raf-kedi{width:clamp(50px,min(14vw,10vh),104px);margin-bottom:-6px}
  .kedi-yer .minder{width:clamp(56px,min(15.5vw,11vh),112px);height:clamp(14px,2.2vh,24px)}
  .raf-ad{font-size:clamp(12px,1.6vh,17px)}
  #kediEviKedi{width:clamp(100px,18vh,200px)}
  .onizleme-ad{font-size:clamp(22px,3vh,34px)}
}
@media (max-height:500px) and (orientation:landscape){
  #kediEviKedi{width:96px}
  .onizleme-sahne{padding:2px}
  .ev-onizleme{padding:10px;gap:6px}
  .onizleme-ad{font-size:22px}
  .dukkan-kart .kart-kedi,.dukkan-kart .kart-yok{width:54px}
}

/* =========================================================
   11. AYARLAR
   ========================================================= */
#sahne-ayarlar{justify-content:flex-start}
.ayar-kart{
  width:100%;max-width:720px;background:var(--kart);border-radius:var(--kose);
  box-shadow:var(--golge);padding:clamp(14px,3vh,28px) clamp(16px,3vw,32px);
  display:flex;flex-direction:column;gap:6px;margin-top:clamp(4px,2vh,20px);
}
.ayar-satir{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 0;border-bottom:2px solid var(--cizgi);
}
.ayar-satir:last-child{border-bottom:0}
.ayar-satir .metin{display:flex;flex-direction:column;gap:2px;text-align:left}
.ayar-satir .ad{font-size:clamp(20px,2.4vw,26px);font-weight:900}
.ayar-satir .aciklama{font-size:clamp(14px,1.6vw,18px);font-weight:700;color:var(--yazi-soluk)}
/* aç/kapa anahtarı */
.anahtar{
  flex:0 0 auto;width:92px;height:52px;border-radius:999px;background:#D9D0C4;position:relative;
  transition:background .2s;
}
.anahtar::after{
  content:"";position:absolute;top:6px;left:6px;width:40px;height:40px;border-radius:50%;
  background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s;
}
.anahtar[aria-checked="true"]{background:var(--yesil)}
.anahtar[aria-checked="true"]::after{transform:translateX(40px)}
.anahtar:disabled{opacity:.4;cursor:not-allowed}
.sifirla-onay{
  margin-top:8px;padding:16px;border-radius:var(--kose-kucuk);background:#FFF0F0;
  display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;
}
.sifirla-onay p{margin:0;font-size:clamp(18px,2.2vw,22px);font-weight:800}
.sifirla-onay .dugmeler{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* =========================================================
   11b. ORTAK PARÇALAR (Aşama 2)
        oyun alanı · soru kartı · tuş takımı · seçenekler ·
        geri bildirim paneli · açıklama görselleri
   ========================================================= */
.oyun-alani{
  width:100%;max-width:1300px;
  display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);
  gap:clamp(12px,2.4vw,36px);align-items:center;
}
.soru-karti{
  background:var(--kart);border-radius:var(--kose);box-shadow:var(--golge);
  padding:clamp(14px,2.6vh,28px) clamp(14px,2.4vw,32px);
  display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,22px);
  text-align:center;min-width:0;
}
.ilerleme{display:flex;gap:clamp(5px,.8vw,8px);flex-wrap:wrap;justify-content:center}
.ilerleme i{
  width:clamp(12px,1.5vw,18px);height:clamp(12px,1.5vw,18px);border-radius:50%;
  background:#EDE6DC;transition:background .2s;
}
.ilerleme i.dogru{background:var(--yesil)}
.ilerleme i.yanlis{background:var(--pembe)}
.ilerleme i.simdi{background:#fff;box-shadow:0 0 0 3px var(--mavi)}
.yonerge{display:flex;align-items:center;justify-content:center;gap:12px;
  font-size:clamp(20px,2.6vw,32px);font-weight:900;line-height:1.2}
.hoparlor{
  width:clamp(44px,6vh,56px);height:clamp(44px,6vh,56px);flex:0 0 auto;border-radius:50%;
  background:var(--zemin);display:grid;place-items:center;color:var(--mavi);
  box-shadow:var(--golge-kucuk);
}
.hoparlor svg{width:60%;height:60%}
.hoparlor:active{transform:translateY(2px)}
.soru-govde{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.buyuk-sayi{font-size:clamp(64px,14vh,150px);font-weight:900;line-height:1}
.okunus{font-size:clamp(34px,6.4vh,68px);font-weight:900;line-height:1.1;color:var(--mor);overflow-wrap:anywhere}
.cevap-alani{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;min-width:0}

/* ---- tuş takımı ---- */
.tus-takimi{display:flex;flex-direction:column;gap:clamp(8px,1.2vh,12px);width:100%;max-width:400px}
.tus-ekran{
  height:clamp(64px,10vh,100px);border-radius:var(--kose-kucuk);background:var(--kart);
  box-shadow:inset 0 0 0 4px var(--cizgi);
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(44px,7.4vh,76px);font-weight:900;letter-spacing:.05em;transition:background .2s,color .2s;
}
.tus-ekran:empty::after{content:"?";color:#D6CCBE}
.tus-ekran.dogru{background:var(--yesil);color:#fff;box-shadow:none}
.tus-ekran.yanlis{background:var(--pembe);color:#fff;box-shadow:none}
.tus-izgara{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,1.2vh,12px)}
.tus{
  height:clamp(56px,9.6vh,90px);border-radius:var(--kose-kucuk);background:var(--kart);
  box-shadow:var(--golge-kucuk);font-size:clamp(28px,4.8vh,46px);font-weight:900;
  display:grid;place-items:center;
}
.tus svg{width:clamp(28px,4.4vh,42px);height:clamp(28px,4.4vh,42px)}
.tus:active,.tus.basili{transform:translateY(3px);box-shadow:0 1px 0 rgba(43,33,64,.12)}
.tus.sil{background:#FFE3E3;color:var(--kirmizi)}
.tus.tamam{background:var(--yesil);color:#fff}
.tus.tamam.pasif{background:#CFEFE8}
.tus-takimi.kilitli .tus{opacity:.5;pointer-events:none}
.titre{animation:titre .35s}
@keyframes titre{0%,100%{transform:none}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ---- seçenekler ---- */
.secenekler{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(10px,1.6vh,18px);width:100%;max-width:540px}
.secenek{
  min-height:clamp(72px,14vh,124px);border-radius:var(--kose);background:var(--kart);
  box-shadow:var(--golge);font-size:clamp(36px,6.4vh,64px);font-weight:900;
  padding:8px 12px;line-height:1.1;transition:background .15s,opacity .15s;
}
.secenek.metin{font-size:clamp(22px,3.6vh,36px)}
.secenek:active{transform:translateY(4px)}
.secenek.dogru{background:var(--yesil);color:#fff}
.secenek.yanlis{background:var(--pembe);color:#fff}
.secenek.soluk{opacity:.4}
.secenekler.kilitli .secenek{pointer-events:none}

/* ---- geri bildirim paneli ---- */
#geriBildirim{
  /* üst çubuk açık kalır: panel açıkken de Geri çalışır */
  position:fixed;left:0;right:0;bottom:0;top:calc(var(--ust-yukseklik) + env(safe-area-inset-top));z-index:40;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(43,33,64,0);pointer-events:none;transition:background .2s;
}
#geriBildirim.acik{pointer-events:auto}
#geriBildirim.acik.yanlis{background:rgba(43,33,64,.28)}
.gb-panel{
  width:min(960px,100%);background:var(--kart);
  border-radius:var(--kose) var(--kose) 0 0;border-top:10px solid var(--gb-renk,var(--yesil));
  box-shadow:0 -8px 30px rgba(43,33,64,.18);
  padding:clamp(14px,2.6vh,28px) clamp(16px,3vw,40px) calc(clamp(14px,2.6vh,28px) + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:clamp(12px,2vw,28px);
  transform:translateY(110%);transition:transform .25s ease-out;
}
#geriBildirim.acik .gb-panel{transform:none}
#geriBildirim.dogru{--gb-renk:var(--yesil)}
#geriBildirim.yanlis{--gb-renk:var(--pembe)}
.gb-kedi{width:clamp(72px,13vh,124px);flex:0 0 auto}
#geriBildirim.dogru .gb-kedi{animation:zipla .5s}
#geriBildirim.yanlis .gb-kedi{transform:rotate(-12deg)}
.gb-icerik{flex:1 1 auto;display:flex;flex-direction:column;gap:8px;min-width:0}
.gb-baslik{font-size:clamp(26px,3.8vw,44px);font-weight:900;color:var(--gb-renk)}
.gb-aciklama{font-size:clamp(18px,2.4vw,28px);font-weight:800;display:flex;flex-direction:column;gap:10px}
.gb-aciklama:empty{display:none}
.gb-panel .dugme{flex:0 0 auto}

/* ---- açıklama görselleri ---- */
.basamak{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.basamak b{font-size:1.25em}
.kutu{padding:2px 12px;border-radius:12px;font-weight:900;white-space:nowrap}
.kutu.onluk{background:#EDE1FE;color:#7C3AED}
.kutu.birlik{background:#FFE7D6;color:#C2410C}
.kutu.okunus-kutu{background:var(--zemin);color:var(--yazi)}
.dizi{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.dizi .halka{
  min-width:clamp(44px,5vw,64px);padding:4px 10px;border-radius:999px;background:var(--zemin);
  text-align:center;font-weight:900;
}
.dizi .halka.vurgu{background:var(--yesil);color:#fff}
.dizi .ok{font-size:.75em;font-weight:900;color:var(--mor)}
.ipucu{color:var(--pembe)}

/* =========================================================
   11c. ÇATILAR (Aşama 3) — gece manzarası, çatılar, kedi
   ========================================================= */
.gece{
  position:relative;width:100%;border-radius:var(--kose-kucuk);overflow:hidden;
  padding:clamp(64px,13vh,150px) clamp(6px,1.2vw,18px) 0;
  background:
    radial-gradient(circle at 86% 16%, #FFE98A 0 clamp(12px,2.2vh,22px), transparent calc(clamp(12px,2.2vh,22px) + 1px)),
    radial-gradient(circle at 12% 22%, #fff 0 1.6px, transparent 2.6px),
    radial-gradient(circle at 30% 10%, #fff 0 1.2px, transparent 2.2px),
    radial-gradient(circle at 52% 26%, #fff 0 1.6px, transparent 2.6px),
    radial-gradient(circle at 70% 8%,  #fff 0 1.2px, transparent 2.2px),
    radial-gradient(circle at 40% 40%, #fff 0 1px,   transparent 2px),
    linear-gradient(#211D48, #463F82);
}
.cati-sira{
  --ara:clamp(6px,1.2vw,16px);
  --zemin-h:clamp(28px,4.4vh,44px);
  position:relative;z-index:0;display:flex;align-items:flex-end;justify-content:center;gap:var(--ara);
  padding-bottom:var(--zemin-h);
}
.cati-sira::after{  /* zemin şeridi: adım okları burada */
  content:"";position:absolute;left:-40px;right:-40px;bottom:0;height:var(--zemin-h);
  background:#1A1638;z-index:-1;
}
.cati{flex:1 1 0;max-width:160px;min-width:0;display:flex;flex-direction:column;align-items:center;position:relative}
.cati .dam{width:100%;aspect-ratio:2/1;background:var(--renk);clip-path:polygon(50% 0,100% 100%,0 100%)}
.cati .duvar{
  width:86%;background:var(--renk-koyu);
  min-height:calc(clamp(64px,10vh,110px) + var(--h) * clamp(10px,2.2vh,24px));
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;
  padding:clamp(6px,1.2vh,12px) 0 clamp(6px,1.2vh,12px);
}
.cati .levha{
  background:#fff;border-radius:10px;min-width:84%;padding:2px 4px;text-align:center;
  font-weight:900;font-size:clamp(17px,min(4.6vh,5.4vw),52px);line-height:1.15;color:var(--yazi);
  transition:background .2s,color .2s;
}
.cati.bos .levha{background:#FFF6C2;outline:3px dashed #E0A800;outline-offset:-3px;color:#B07D00}
.cati.dogru .levha{background:var(--yesil);color:#fff;outline:0}
.cati.yanlis .levha{background:var(--pembe);color:#fff;outline:0}
.cati .pencere{width:34%;aspect-ratio:1;background:#FFE98A;border-radius:6px;opacity:.85}
.ok-etiket{
  position:absolute;top:calc(100% + (var(--zemin-h) - 1.5em) / 2);right:calc(var(--ara) / -2);transform:translateX(50%);
  z-index:1;background:var(--sari);color:var(--yazi);font-weight:900;white-space:nowrap;
  font-size:clamp(13px,2.2vh,22px);padding:2px 8px;border-radius:999px;box-shadow:0 2px 0 rgba(0,0,0,.25);
}
.cati-kedi{position:absolute;left:0;top:0;width:clamp(44px,9vh,100px);z-index:2;pointer-events:none;will-change:transform}
.cati-kedi svg{width:100%;height:auto}
.cevap-baslik{font-size:clamp(18px,2.4vh,28px);font-weight:900;text-align:center}
/* kolay: seçenekler çatı biçiminde */
.secenek.cati-secenek{
  position:relative;margin-top:clamp(20px,4vh,44px);
  border-radius:0 0 var(--kose-kucuk) var(--kose-kucuk);
}
.secenek.cati-secenek::before{
  content:"";position:absolute;left:-5%;right:-5%;bottom:100%;height:clamp(20px,4vh,44px);
  background:var(--dam,var(--mor));clip-path:polygon(50% 0,100% 100%,0 100%);
}
.secenek.cati-secenek:nth-child(1){--dam:#A855F7}
.secenek.cati-secenek:nth-child(2){--dam:#FF4D8D}
.secenek.cati-secenek:nth-child(3){--dam:#FF6B35}
.secenek.cati-secenek:nth-child(4){--dam:#4D9FFF}
@media (max-height:500px) and (orientation:landscape){
  .gece{padding-top:56px}
  .cati .duvar{min-height:calc(46px + var(--h) * 8px)}
  .cati .levha{font-size:20px}
  .cati .pencere{display:none}
  .cati-sira{--zemin-h:26px}
  .secenek.cati-secenek{margin-top:16px}
  .secenek.cati-secenek::before{height:16px}
}

/* =========================================================
   11d. MAMA POSTASI (Aşama 4) — zarf, ev/kapı, kelime kartları
   ========================================================= */
.b-onluk{color:#7C3AED}
.b-birlik{color:#C2410C}
.b-yuz{color:#6B6080}
.tus-ekran.dogru span,.tus-ekran.yanlis span{color:#fff}
.tus-basamak{display:flex;justify-content:center;gap:clamp(14px,2vw,26px);font-weight:900;font-size:clamp(14px,1.8vh,20px);margin-top:-4px}

.posta-sahne{
  position:relative;width:100%;border-radius:var(--kose-kucuk);overflow:hidden;
  display:flex;align-items:flex-end;justify-content:center;gap:clamp(12px,2.4vw,36px);
  padding:clamp(44px,8vh,90px) clamp(10px,2vw,28px) clamp(14px,2.4vh,28px);
  background:
    radial-gradient(circle at 90% 18%, #FFE45C 0 clamp(14px,2.4vh,26px), transparent calc(clamp(14px,2.4vh,26px) + 1px)),
    linear-gradient(#BFE6FF 0%, #E9F7FF 68%, #E7D9C5 68%, #D9C7AE 100%);
}
.posta-sahne.ters{flex-direction:row-reverse}
/* zarf */
.zarf-kutu{position:relative;flex:1 1 auto;min-width:0;max-width:560px;display:flex;justify-content:center}
.zarf{
  position:relative;width:100%;border-radius:14px;padding:clamp(6px,1vh,10px);
  background:repeating-linear-gradient(135deg,#FF4D8D 0 14px,#fff 14px 28px,#4D9FFF 28px 42px,#fff 42px 56px);
  box-shadow:0 6px 0 rgba(43,33,64,.15);
}
.zarf-ic{
  background:#fff;border-radius:9px;min-height:clamp(90px,15vh,170px);
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;
  padding:clamp(10px,2vh,22px) clamp(10px,1.6vw,22px);text-align:center;
}
.zarf-ic .okunus{font-size:clamp(28px,5.6vh,64px)}
.zarf-ic .okunus .kutu{padding:0 10px}
.zarf-bos{font-size:clamp(40px,7vh,80px);font-weight:900;color:#D6CCBE}
.zarf-yazi{font-size:clamp(26px,5vh,56px);font-weight:900;color:var(--mor)}
.zarf.dogru .zarf-ic{background:#E3FAF5}
.zarf.yanlis .zarf-ic{background:#FFE8F0}
.zarf-kedi{position:absolute;width:clamp(48px,8.4vh,96px);left:clamp(4px,1vw,14px);bottom:calc(100% - clamp(10px,1.6vh,18px));z-index:1}
/* kelime yuvaları (zor okunuş) */
.slot{
  min-width:clamp(80px,9vw,150px);min-height:clamp(44px,7vh,76px);padding:4px 12px;border-radius:12px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:clamp(24px,4.4vh,48px);font-weight:900;cursor:pointer;
  border:3px dashed currentColor;
}
.slot.onluk{color:#7C3AED;background:#F5EEFF}
.slot.birlik{color:#C2410C;background:#FFF2E8}
.slot.dolu{border-style:solid}
.zarf.dogru .slot{background:var(--yesil);color:#fff;border-color:var(--yesil)}
.zarf.yanlis .slot{background:var(--pembe);color:#fff;border-color:var(--pembe)}
/* ev ve kapı */
.ev{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;width:clamp(120px,15vw,220px)}
.ev-dam{width:116%;aspect-ratio:2.4/1;background:#FF6B35;clip-path:polygon(50% 0,100% 100%,0 100%)}
.ev-duvar{
  width:100%;background:#FFD600;display:flex;flex-direction:column;align-items:center;
  gap:clamp(6px,1.2vh,12px);padding:clamp(8px,1.4vh,14px) 0 0;
}
.kapi-levha{
  background:#fff;border:3px solid var(--yazi);border-radius:10px;min-width:2.4em;padding:0 8px;
  text-align:center;font-weight:900;font-size:clamp(28px,6vh,68px);line-height:1.15;transition:background .2s,color .2s;
}
.kapi-levha.bos{border-style:dashed;color:#B07D00;background:#FFF6C2}
.kapi-levha.dogru{background:var(--yesil);color:#fff;border-color:var(--yesil)}
.kapi-levha.yanlis{background:var(--pembe);color:#fff;border-color:var(--pembe)}
.kapi{position:relative;width:58%;height:clamp(80px,14vh,160px);background:#A0673B;border-radius:40px 40px 0 0;box-shadow:inset 0 0 0 5px #7A4A26}
.kapi::after{content:"";position:absolute;right:16%;top:52%;width:10%;aspect-ratio:1;border-radius:50%;background:#FFD600}
/* kolay: kapı biçiminde seçenekler */
.secenek.kapi-secenek{background:#A0673B;color:#fff;border-radius:60px 60px 14px 14px;position:relative;box-shadow:inset 0 0 0 5px #7A4A26, var(--golge)}
.secenek.kapi-secenek::after{content:"";position:absolute;right:12%;top:55%;width:9%;aspect-ratio:1;border-radius:50%;background:#FFD600}
.secenek.kapi-secenek.dogru{background:var(--yesil);box-shadow:var(--golge)}
.secenek.kapi-secenek.yanlis{background:var(--pembe);box-shadow:var(--golge)}
/* kelime kartları */
.kartlar{display:flex;flex-direction:column;gap:clamp(8px,1.4vh,14px);width:100%;max-width:560px;align-items:center}
.kart-satir{display:flex;flex-wrap:wrap;gap:clamp(6px,1vh,10px);justify-content:center;align-items:center;width:100%}
.kart-etiket{flex:0 0 100%;text-align:center;font-weight:900;font-size:clamp(16px,2vh,22px)}
.kart-etiket.onluk{color:#7C3AED}
.kart-etiket.birlik{color:#C2410C}
.kelime-kart{
  min-width:calc(50% - 10px);min-height:clamp(52px,8vh,84px);padding:6px 10px;border-radius:var(--kose-kucuk);
  background:var(--kart);box-shadow:var(--golge-kucuk);font-size:clamp(22px,3.8vh,40px);font-weight:900;
  border:3px solid transparent;
}
.kelime-kart.onluk{color:#7C3AED}
.kelime-kart.birlik{color:#C2410C}
.kelime-kart.secili.onluk{background:#7C3AED;color:#fff}
.kelime-kart.secili.birlik{background:#C2410C;color:#fff}
.kelime-kart:active{transform:translateY(3px)}
.kartlar.kilitli .kelime-kart,.kartlar.kilitli .dugme{pointer-events:none;opacity:.55}
.kartlar .dugme{min-width:60%}

/* =========================================================
   11e. KEDİ SEPETLERİ (Aşama 5) — sepetler, tek kediler, kurucu
   ========================================================= */
.sepet-sahne{
  container-type:inline-size;
  width:100%;border-radius:var(--kose-kucuk);padding:clamp(8px,1.6vh,18px);
  background:linear-gradient(#FFF4D6,#FFE7A8);
  display:flex;gap:clamp(8px,1.6vw,22px);align-items:stretch;justify-content:center;
  min-height:clamp(130px,24vh,290px);transition:box-shadow .2s;
}
.sepet-sahne.dogru{box-shadow:inset 0 0 0 4px var(--yesil)}
.sepet-sahne.yanlis{box-shadow:inset 0 0 0 4px var(--pembe)}
.sepet-alan,.kedi-alan,.karisik-alan{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  background:rgba(255,255,255,.6);border-radius:14px;padding:6px 8px 10px;min-width:0;
}
.sepet-alan{flex:2.2 1 0}
.kedi-alan{flex:1 1 0}
.karisik-alan{flex:1 1 auto}
.alan-etiket{font-weight:900;font-size:clamp(14px,1.9vh,22px)}
.alan-etiket.onluk{color:#7C3AED}
.alan-etiket.birlik{color:#C2410C}
.sepet-izgara{display:grid;grid-template-columns:repeat(5,max-content);gap:clamp(6px,1vh,12px) clamp(4px,.7vw,10px);justify-content:center;align-content:start;padding-top:clamp(12px,2.2vh,22px)}
.kedi-izgara{display:grid;grid-template-columns:repeat(3,max-content);gap:clamp(6px,1vh,12px) 4px;justify-content:center;align-content:start;padding-top:clamp(12px,2.2vh,22px)}
.karisik-alan .karisik-izgara{display:flex;flex-wrap:wrap;gap:clamp(8px,1.4vh,14px) clamp(6px,1vw,14px);justify-content:center;align-items:center;padding-top:clamp(12px,2.2vh,22px)}
.sepet-oge{position:relative;display:block}
.sepet-oge.sepet svg{width:clamp(30px,min(6.4vh,6vw),88px);width:clamp(26px,min(10.4cqw,9vh),104px);height:auto;display:block}
.sepet-oge.tek-kedi svg{width:clamp(18px,min(3.4vh,3.2vw),46px);width:clamp(16px,min(5.4cqw,4.8vh),54px);height:auto;display:block}
.karisik-alan .sepet-oge.sepet svg{width:clamp(26px,min(9cqw,8vh),96px)}
.sepet-oge.yeni{animation:zipla .35s}
.on-rozet{
  position:absolute;right:-5px;top:-6px;background:var(--turuncu);color:#fff;font-weight:900;
  font-size:clamp(11px,2.4cqw,22px);line-height:1.25;border-radius:999px;padding:0 5px;
}
.sayac{
  position:absolute;left:50%;top:0;transform:translate(-50%,-85%);z-index:2;
  background:var(--yesil);color:#fff;font-weight:900;font-size:clamp(12px,1.9vh,22px);
  border-radius:999px;padding:0 7px;line-height:1.35;box-shadow:0 2px 0 rgba(0,0,0,.15);
  animation:zipla .3s;
}
.bos-not{color:var(--yazi-soluk);font-weight:800;font-size:clamp(14px,1.8vh,20px);padding-top:clamp(10px,3vh,30px)}
/* kurucu: + / − düğmeleri */
.kurucu{display:flex;flex-direction:column;gap:clamp(10px,1.6vh,16px);width:100%;max-width:460px;align-items:stretch}
.kur-satir{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;
  background:var(--kart);border-radius:var(--kose);box-shadow:var(--golge);padding:8px;
}
.kur-ad{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:clamp(20px,3vh,32px)}
.kur-ad svg{width:clamp(34px,6vh,64px);height:auto}
.kur-dugme{
  width:clamp(56px,9vh,92px);height:clamp(56px,9vh,92px);border-radius:var(--kose-kucuk);
  font-size:clamp(34px,5.4vh,56px);font-weight:900;line-height:1;color:#fff;box-shadow:var(--golge-kucuk);
}
.kur-dugme.arti{background:var(--yesil)}
.kur-dugme.eksi{background:var(--pembe)}
.kur-dugme:active{transform:translateY(3px)}
.kur-dugme:disabled{opacity:.3;pointer-events:none}
.kurucu.kilitli button{pointer-events:none;opacity:.55}

/* Sepetler: dikey ve alçak yatay ekran */
@media (orientation:portrait) and (max-width:1100px), (max-width:760px){
  .sepet-sahne{min-height:0}
  .kur-dugme{width:clamp(50px,7vh,80px);height:clamp(50px,7vh,80px)}
}
@media (max-height:500px) and (orientation:landscape){
  .sepet-sahne{min-height:0;padding:6px}
  .sepet-izgara,.kedi-izgara,.karisik-alan .karisik-izgara{padding-top:14px}
  .alan-etiket{font-size:13px}
  .kur-dugme{width:46px;height:46px;font-size:30px}
  .kur-ad{font-size:18px}
  .kur-ad svg{width:30px}
}

/* =========================================================
   11f. CİLA (Aşama 7) — başlık çipi, tur sonu kutlaması,
        uçan balıklar, gece parıltısı, bulutlar
   ========================================================= */
.zorluk-cip{
  display:inline-block;margin-left:.4em;padding:.05em .6em;border-radius:999px;
  background:var(--c);color:#fff;font-size:.6em;vertical-align:.14em;line-height:1.35;
}
@media (max-width:430px){ #ustBaslik{font-size:18px} }
.sahne{position:absolute}
#sahne-tursonu{overflow:hidden}
.ts-kedi{width:clamp(76px,13vh,140px);height:auto;margin-bottom:-6px}
.ts-kedi.sevinc{animation:sevinc .7s ease-in-out 3}
.ts-kedi.uzgun{transform:rotate(-10deg)}
@keyframes sevinc{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px) rotate(-6deg)}70%{transform:translateY(0) rotate(4deg)}}
.konfeti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.konfeti i{position:absolute;top:-24px;width:12px;height:18px;border-radius:3px;animation:konfeti-dus linear forwards}
@keyframes konfeti-dus{to{transform:translateY(115vh) rotate(760deg)}}
.ucan-balik{position:fixed;left:0;top:0;width:40px;height:40px;z-index:60;pointer-events:none}
.ucan-balik svg{width:100%;height:100%}
.gb-balik{display:inline-flex;align-items:center;gap:6px;font-weight:900;color:#2F7FE0;font-size:clamp(22px,3vw,34px)}
.gb-balik svg{width:1.4em;height:1.4em}
.yildizcik{
  position:absolute;width:9px;height:9px;background:#fff;opacity:.4;
  clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
  animation:pirilti 2.6s ease-in-out infinite;
}
@keyframes pirilti{50%{opacity:1;transform:scale(1.7)}}
.posta-sahne .ev{position:relative}
.bulut{
  position:absolute;left:-110px;width:86px;height:26px;border-radius:999px;background:#fff;opacity:.9;
  animation:bulut-gec var(--s,30s) linear infinite;pointer-events:none;
}
.bulut::before{content:"";position:absolute;left:16px;top:-15px;width:40px;height:34px;border-radius:50%;background:#fff}
.bulut.kucuk{width:60px;height:18px}
.bulut.kucuk::before{left:12px;top:-10px;width:26px;height:22px}
@keyframes bulut-gec{to{left:calc(100% + 110px)}}

/* Posta: alçak yatay ekran (telefon yatay) — 11d temel kurallarından sonra gelmeli */
@media (max-height:500px) and (orientation:landscape){
  .posta-sahne{padding-top:30px;padding-bottom:6px}
  .zarf-kedi{width:40px}
  .ev{width:96px}
  .ev-dam{aspect-ratio:3.6/1}
  .kapi{height:32px}
  .kapi-levha{font-size:26px}
  .zarf-ic{min-height:64px;padding:6px 10px}
  .zarf-ic .okunus{font-size:26px}
  .slot{min-height:40px;font-size:22px}
  .kelime-kart{min-height:40px;font-size:20px}
  .kart-etiket{display:none}
}

/* ---- yerleşim: akıllı tahta (geniş ve yüksek yatay ekran) — parçalar büyür ---- */
@media (min-width:1280px) and (min-height:700px) and (orientation:landscape){
  .oyun-alani{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);max-width:1500px}
  .soru-karti{min-height:min(48vh,500px);justify-content:center}
  .okunus{font-size:clamp(56px,8.4vh,108px)}
  .buyuk-sayi{font-size:clamp(96px,18vh,190px)}
  .yonerge{font-size:clamp(26px,3.4vh,40px)}
  .tus-takimi{max-width:clamp(360px,28vw,500px)}
  .tus{height:clamp(64px,10.4vh,112px);font-size:clamp(34px,5.4vh,56px)}
  .tus-ekran{height:clamp(80px,12vh,128px);font-size:clamp(56px,9vh,96px)}
  .secenekler{max-width:660px}
  .secenek{min-height:clamp(96px,17vh,170px);font-size:clamp(48px,8.4vh,92px)}
  .secenek.metin{font-size:clamp(28px,4.4vh,46px)}
  .ilerleme i{width:20px;height:20px}
}

/* ---- yerleşim: dikey ekran / telefon ---- */
@media (orientation:portrait) and (max-width:1100px), (max-width:760px){
  .oyun-alani{grid-template-columns:1fr;align-content:center}
  .soru-karti{padding:12px 14px}
  /* dikeyde soru + tuş takımı tek ekrana sığsın */
  .tus{height:clamp(48px,6.8vh,76px)}
  .tus-ekran{height:clamp(52px,7.2vh,84px);font-size:clamp(36px,5.8vh,64px)}
  .secenek{min-height:clamp(60px,10vh,110px)}
  .gece{padding-top:clamp(52px,8vh,96px)}
  .cati .duvar{min-height:calc(clamp(44px,6vh,80px) + var(--h) * clamp(6px,1.2vh,14px))}
  .cati .pencere{display:none}
  .cati-sira{--zemin-h:30px}
  .posta-sahne{padding-top:clamp(40px,6vh,70px);gap:10px}
  .ev{width:clamp(96px,26vw,170px)}
  .kapi{height:clamp(50px,7vh,110px)}
  .kapi-levha{font-size:clamp(26px,4.6vh,56px)}
  .zarf-ic{min-height:clamp(70px,10vh,130px)}
  .zarf-ic .okunus{font-size:clamp(24px,4.4vh,52px)}
  .kelime-kart{min-height:clamp(40px,5.4vh,72px);font-size:clamp(20px,3.2vh,36px)}
  .kartlar{gap:6px}
  .kart-etiket{font-size:15px}
}
@media (max-width:600px){
  .gb-panel{flex-wrap:wrap;justify-content:center;text-align:center}
  .gb-kedi{width:64px}
  .gb-icerik{flex-basis:calc(100% - 90px);text-align:left}
  .gb-panel .dugme{width:100%}
}
@media (max-height:500px) and (orientation:landscape){
  .tus{height:44px;font-size:26px}
  .tus-ekran{height:52px;font-size:38px}
  .tus-izgara,.tus-takimi{gap:6px}
  .secenek{min-height:64px;font-size:32px}
  .soru-karti{gap:8px;padding:10px 14px}
  .gb-panel{padding:10px 20px}
  .gb-kedi{width:56px}
}

/* =========================================================
   12. BİLDİRİM + ALTBİLGİ
   ========================================================= */
#bildirim{
  position:fixed;left:50%;bottom:56px;transform:translate(-50%,20px);opacity:0;
  background:var(--yazi);color:#fff;font-weight:800;font-size:clamp(16px,2vw,22px);
  padding:12px 24px;border-radius:999px;pointer-events:none;transition:all .25s;z-index:50;
  max-width:90vw;text-align:center;
}
#bildirim.goster{opacity:1;transform:translate(-50%,0)}
#altbilgi{
  flex:0 0 auto;text-align:center;font-size:13px;font-weight:700;color:var(--yazi-soluk);
  padding:4px 0 calc(4px + env(safe-area-inset-bottom));opacity:.8;
}

/* =========================================================
   13. YERLEŞİM — tablet / telefon
   ========================================================= */
@media (max-width:1000px){
  .harita-izgara{grid-template-columns:repeat(2,1fr);max-width:760px}
}
/* telefon dikey */
@media (max-width:600px){
  .zorluk-izgara{grid-template-columns:1fr;max-width:420px}
  .zorluk-kart{flex-direction:row;flex-wrap:wrap;justify-content:center;padding:14px}
  .ust-dugme .yazi{display:none}
  .bolge-kart .ikon{width:72px;height:72px}
}
/* alçak yatay ekran (telefon yatay) */
@media (max-height:500px) and (orientation:landscape){
  .harita-izgara{grid-template-columns:repeat(4,1fr);max-width:none}
  .bolge-kart .ikon{width:64px;height:64px}
  .bolge-kart{padding:10px 8px;gap:4px}
  #sahne-acilis .acilis-kedi{width:110px}
  #sahne-acilis h1{font-size:44px}
  #altbilgi{display:none}
  .tursonu-kart{padding:12px 24px;gap:6px}
  .tursonu-kart h2{font-size:28px}
  .tursonu-kart .buyuk-yildizlar svg{width:44px;height:44px}
  .tursonu-kart .kazanc svg{width:32px;height:32px}
  .tursonu-kart .dugme{min-height:52px;font-size:20px;padding:8px 20px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}

'use strict';

/* =========================================================

/* Kediler ve aksesuarlar (Aşama 6) — hepsi kozmetik */

  { id:'sarman',  ad:'Sarman',  fiyat:0,  tuy:'#F4A259', desen:'#C9732C', goz:'#2B2140' },
  { id:'tekir',   ad:'Tekir',   fiyat:15, tuy:'#9C9C9C', desen:'#6E6E6E', goz:'#2B2140' },

/* Yıldız eşikleri — 10 soruda: 6-7 → 1, 8-9 → 2, 10 → 3 */
function yildizHesapla(dogru, toplam){
  const oran = toplam ? dogru / toplam : 0;
  if (oran >= 1)   return 3;
  if (oran >= 0.8) return 2;
  if (oran >= 0.6) return 1;
  return 0;
}

/* =========================================================
   2. KAYIT (localStorage) — tek anahtar
   ========================================================= */
const KAYIT_ANAHTARI = 'kediKasabasi_v1';

function varsayilanDurum(){
  const bos = () => ({ kolay:0, orta:0, zor:0 });
  return {
    surum: 1,
    balik: 0,
    kediler: ['sarman'],       // sahiplenilen kediler (Aşama 6)
    seciliKedi: 'sarman',
    aksesuarlar: [],           // sahip olunan aksesuarlar (Aşama 6)
    takili: {},                // kedi → takılı aksesuar (Aşama 6)
    yildiz: { catilar:bos(), posta:bos(), sepetler:bos() },  // en iyi yıldızlar
    yanlislar: [],             // tekrar havuzu, en fazla 30 (Aşama 3–5)
    ayarlar: { ses:true, sesliOkuma:true }
  };
}

/* Kayıttaki veriyi varsayılanla birleştirir; eksik alanlar tamamlanır */
function birlestir(varsayilan, kayitli){
  const nesneMi = x => x !== null && typeof x === 'object' && !Array.isArray(x);
  if (nesneMi(varsayilan)) {
    const k = nesneMi(kayitli) ? kayitli : {};
    // anahtarsız varsayılan (ör. takili:{}) → kayıttakini olduğu gibi al
    if (Object.keys(varsayilan).length === 0) return { ...k };
    const sonuc = {};
    for (const anahtar of Object.keys(varsayilan)) sonuc[anahtar] = birlestir(varsayilan[anahtar], k[anahtar]);
    return sonuc;
  }
  if (Array.isArray(varsayilan)) return Array.isArray(kayitli) ? kayitli : varsayilan;
  return (kayitli === undefined || typeof kayitli !== typeof varsayilan) ? varsayilan : kayitli;
}

const Kayit = {
  durum: null,
  yukle(){
    let ham = null;
    try { ham = JSON.parse(localStorage.getItem(KAYIT_ANAHTARI)); } catch(e) { ham = null; }
    this.durum = birlestir(varsayilanDurum(), ham || {});
    // koleksiyon doğrulama: bilinmeyen kimlikler atılır, Sarman her zaman vardır
    const d = this.durum;
    const kediIdler = KEDILER.map(k => k.id), aksIdler = AKSESUARLAR.map(a => a.id);
    d.kediler = [...new Set(['sarman', ...d.kediler.filter(x => kediIdler.includes(x))])];
    if (!d.kediler.includes(d.seciliKedi)) d.seciliKedi = 'sarman';
    d.aksesuarlar = [...new Set(d.aksesuarlar.filter(x => aksIdler.includes(x)))];
    for (const k of Object.keys(d.takili)) {
      if (!d.kediler.includes(k) || !d.aksesuarlar.includes(d.takili[k])) delete d.takili[k];
    }
    if (!Number.isFinite(d.balik) || d.balik < 0) d.balik = 0;
  },
  kaydet(){
    try { localStorage.setItem(KAYIT_ANAHTARI, JSON.stringify(this.durum)); } catch(e) { /* gizli sekme vb. */ }
  },
  sifirla(){
    try { localStorage.removeItem(KAYIT_ANAHTARI); } catch(e) {}
    this.durum = varsayilanDurum();
    this.kaydet();
  }
};

/* =========================================================
   3. SES (Web Audio) — tüm sesler sentezle üretilir
   ========================================================= */
const Ses = {
  ctx: null,
  baglam(){
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      this.ctx = new AC();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  acik(){ return Kayit.durum.ayarlar.ses; },

  /* kısa ton: frekans (Hz), süre (sn), dalga tipi, düzey, gecikme (sn), bitiş frekansı (kaydırma) */
  ton(frekans, sure=0.08, tip='sine', duzey=0.15, gecikme=0, bitis=null){
    if (!this.acik()) return;
    const c = this.baglam(); if (!c) return;
    const t = c.currentTime + gecikme;
    const o = c.createOscillator(), g = c.createGain();
    o.type = tip; o.frequency.setValueAtTime(frekans, t);
    if (bitis) o.frequency.exponentialRampToValueAtTime(bitis, t + sure);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(duzey, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + sure);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + sure + 0.03);
  },

  /* sentez miyav: testere dalgası + kayan bant geçiren süzgeç */
  miyav(gecikme=0, perde=1){
    if (!this.acik()) return;
    const c = this.baglam(); if (!c) return;
    const t = c.currentTime + gecikme, sure = 0.42;
    const o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(520*perde, t);
    o.frequency.linearRampToValueAtTime(840*perde, t + 0.12);
    o.frequency.linearRampToValueAtTime(600*perde, t + sure);
    f.type = 'bandpass'; f.Q.value = 5;
    f.frequency.setValueAtTime(900, t);
    f.frequency.linearRampToValueAtTime(1900, t + 0.14);
    f.frequency.linearRampToValueAtTime(1000, t + sure);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.32, t + 0.05);
    g.gain.setValueAtTime(0.32, t + sure*0.55);
    g.gain.exponentialRampToValueAtTime(0.0001, t + sure);
    o.connect(f).connect(g).connect(c.destination);
    o.start(t); o.stop(t + sure + 0.05);
  },

  tik(){    this.ton(660, 0.06, 'triangle', 0.12); },
  tus(){    this.ton(520, 0.05, 'square', 0.05); },
  zipla(){  this.ton(380, 0.16, 'sine', 0.14, 0, 820); },
  balik(){  [1319,1568].forEach((f,i)=>this.ton(f,0.09,'triangle',0.10,i*0.06)); },
  dogru(){  this.ton(784,0.10,'triangle',0.14); this.ton(1047,0.16,'triangle',0.14,0.08); this.miyav(0.18); },
  yanlis(){ this.ton(330,0.16,'sine',0.14,0,260); this.ton(247,0.24,'sine',0.12,0.13,200); },
  basari(){ [523,659,784,1047].forEach((f,i)=>this.ton(f,0.16,'triangle',0.14,i*0.1)); this.miyav(0.45, 1.1); }
};

/* =========================================================
   4. SESLİ OKUMA (speechSynthesis) — cihazın Türkçe sesi varsa
   ========================================================= */
const Konusma = {
  turkceSes: null,
  hazir: false,
  baslat(cb){
    if (!('speechSynthesis' in window)) { this.hazir = true; cb && cb(); return; }
    const bul = () => {
      const sesler = speechSynthesis.getVoices() || [];
      this.turkceSes = sesler.find(s => /^tr(-|_|$)/i.test(s.lang)) || null;
      this.hazir = true;
      cb && cb();
    };
    bul();
    speechSynthesis.addEventListener && speechSynthesis.addEventListener('voiceschanged', bul);
  },
  varMi(){ return !!this.turkceSes; },
  acik(){ return this.varMi() && Kayit.durum.ayarlar.sesliOkuma; },
  /* metni okur; önceki okumayı keser */
  oku(metin){
    if (!this.acik() || !metin) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(metin));
      u.lang = this.turkceSes.lang || 'tr-TR';
      u.voice = this.turkceSes;
      u.rate = 0.9; u.pitch = 1.05;
      speechSynthesis.speak(u);
    } catch(e) {}
  },
  sus(){ try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch(e) {} }
};

  const e = document.createElement(etiket);
  for (const [k,v] of Object.entries(ozellik)) {
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  if (icerik) e.innerHTML = icerik;
  return e;
};

/* tur sonu: balıklar kazanç kutusundan sayaca uçar; bitince bitince() çağrılır */
function baliklarUcsun(kaynak, adet, bitince){
  const hedef = $('#balikSayaci');
  if (Catilar.azHareket() || !document.body.animate || !kaynak || hedef.offsetParent === null) { bitince(); return; }
  const a = kaynak.getBoundingClientRect(), h = hedef.getBoundingClientRect();
  const x0 = a.left + a.width / 2 - 20, y0 = a.top + a.height / 2 - 20;
  const dx = h.left + 26 - (x0 + 20), dy = h.top + h.height / 2 - (y0 + 20);
  let biten = 0;
  for (let i = 0; i < adet; i++) {
    const f = el('div', { class:'ucan-balik' }, svgUse('s-balik'));
    f.style.transform = `translate(${x0}px,${y0}px)`;
    document.body.appendChild(f);
    const an = f.animate([
      { transform:`translate(${x0}px,${y0}px) scale(1)` },
      { transform:`translate(${x0 + dx * 0.45}px,${y0 + dy * 0.45 - 90}px) scale(1.15)`, offset:0.5 },
      { transform:`translate(${x0 + dx}px,${y0 + dy}px) scale(.55)` }
    ], { duration:720, delay:i * 90, easing:'ease-in', fill:'forwards' });
    an.onfinish = an.oncancel = () => { f.remove(); if (++biten === adet) bitince(); };
  }
}

function balikSay(eski, yeni){
  const yer = $('#balikSayi'), t0 = performance.now(), sure = 650;
  const adim = t => {
    const o = Math.min(1, (t - t0) / sure);
    yer.textContent = Math.round(eski + (yeni - eski) * o);
    if (o < 1) requestAnimationFrame(adim);
    else { balikGuncelle(true); Ses.balik(); }
  };
  requestAnimationFrame(adim);
}

/* =========================================================
   5b. SAYI ARAÇLARI — okunuş, basamak, çeldirici, hata türü
   ========================================================= */
const Sayi = {
  BIRLER:['','bir','iki','üç','dört','beş','altı','yedi','sekiz','dokuz'],
  ONLAR: ['','on','yirmi','otuz','kırk','elli','altmış','yetmiş','seksen','doksan'],

  /* 0–100 arası sayının okunuşu: 68 → "altmış sekiz" */
  yazi(n){
    if (n === 0) return 'sıfır';
    if (n === 100) return 'yüz';
    return [this.ONLAR[Math.floor(n/10)], this.BIRLER[n%10]].filter(Boolean).join(' ');
  },
  parcala(n){ return { onluk:Math.floor(n/10), birlik:n%10 }; },

  rastgele(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); },
  karistir(dizi){
    const d = dizi.slice();
    for (let i = d.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [d[i], d[j]] = [d[j], d[i]]; }
    return d;
  },
  sec(dizi){ return dizi[Math.floor(Math.random() * dizi.length)]; },

  /* onlar ile birler yer değiştirir: 68 → 86. Anlamsızsa null (7, 60, 55, 100) */
  yerDegistir(n){
    if (n < 10 || n > 99) return null;
    const { onluk, birlik } = this.parcala(n);
    if (birlik === 0 || birlik === onluk) return null;
    return birlik * 10 + onluk;
  },

  /* öğretici çeldiriciler: önce yer değiştirme, sonra ±10 ve ±1, sonra yakın sayılar */
  celdiriciler(dogru, [enAz, enCok], adet){
    const sonuc = [];
    const ekle = x => {
      if (Number.isInteger(x) && x >= enAz && x <= enCok && x !== dogru && !sonuc.includes(x)) sonuc.push(x);
    };
    ekle(this.yerDegistir(dogru));
    this.karistir([dogru+10, dogru-10, dogru+1, dogru-1]).forEach(x => { if (sonuc.length < adet) ekle(x); });
    let guvenlik = 0;
    while (sonuc.length < adet && guvenlik++ < 200) ekle(dogru + this.rastgele(-15, 15));
    while (sonuc.length < adet && guvenlik++ < 600) ekle(this.rastgele(enAz, enCok));
    return sonuc.slice(0, adet);
  },

  /* verilen cevabın hata türü */
  hataTuru(dogru, verilen){
    if (verilen === this.yerDegistir(dogru)) return 'yerDegistirme';
    const fark = verilen - dogru;
    if (fark === 1)   return 'birFazla';
    if (fark === -1)  return 'birEksik';
    if (fark === 10)  return 'onFazla';
    if (fark === -10) return 'onEksik';
    return null;
  }
};

/* =========================================================
   5c. AÇIKLAMA GÖRSELLERİ — geri bildirim panelinde kullanılır
   ========================================================= */
const Aciklama = {
  /* 68 = 6 onluk 8 birlik → altmış sekiz */
  basamak(n){
    const { onluk, birlik } = Sayi.parcala(n);
    const parcalar = [];
    if (onluk) parcalar.push(`<span class="kutu onluk">${onluk} onluk</span>`);
    if (birlik || !onluk) parcalar.push(`<span class="kutu birlik">${birlik} birlik</span>`);
    return `<div class="basamak"><b>${n}</b> = ${parcalar.join(' ')} → <span class="kutu okunus-kutu">${Sayi.yazi(n)}</span></div>`;
  },

  /* ritmik dizi: 20 →+5→ 25 →+5→ 30 ; vurgu: vurgulanacak sıra */
  dizi(sayilar, adim, vurgu=-1){
    const isaret = adim >= 0 ? '+' : '−';
    return `<div class="dizi">` + sayilar.map((x, i) =>
      (i ? `<span class="ok">${isaret}${Math.abs(adim)}→</span>` : '') +
      `<span class="halka${i === vurgu ? ' vurgu' : ''}">${x}</span>`).join('') + `</div>`;
  },

  /* hata türüne göre kısa ipucu (yoksa boş) */
  hataMesaji(dogru, verilen){
    const m = {
      yerDegistirme:'Onlar ile birler yer değiştirmiş.',
      birFazla:'Çok yaklaştın! Cevabın 1 fazla.',
      birEksik:'Çok yaklaştın! Cevabın 1 eksik.',
      onFazla:'Onlukları bir daha say: 1 onluk fazla.',
      onEksik:'Onlukları bir daha say: 1 onluk eksik.'
    }[Sayi.hataTuru(dogru, verilen)];
    return m ? `<div class="ipucu">${m}</div>` : '';
  }
};

   5d. OYUN ALANI + SORU KARTI
   Yapı: [soru kartı: ilerleme · yönerge+hoparlör · gövde] [cevap alanı]

/* =========================================================
   5e. TUŞ TAKIMI — 0–9, Sil, Tamam ; fiziksel klavye de çalışır

  /* ayar: { enFazla:3, onTamam(sayi), onDegisim(metin) } */

    if (ayar.renkli) k.el.appendChild(el('div', { class:'tus-basamak', 'aria-hidden':'true' },
      '<span class="b-onluk">onlar</span><span class="b-birlik">birler</span>'));
    k.el.append(izgara);
    kap.appendChild(k.el);

    k.guncelle = () => {
      if (ayar.renkli && k.deger) {
        // destek: sağdan birler (turuncu), onlar (mor), yüzler (gri)
        const sinif = ['b-birlik', 'b-onluk', 'b-yuz'];
        k.ekran.innerHTML = k.deger.split('').reverse()
          .map((r, i) => `<span class="${sinif[i]}">${r}</span>`).reverse().join('');
      } else k.ekran.textContent = k.deger;
      k.tusEl.tamam.classList.toggle('pasif', k.deger === '');
      ayar.onDegisim && ayar.onDegisim(k.deger);
    };
    k.titret = () => { k.ekran.classList.remove('titre'); void k.ekran.offsetWidth; k.ekran.classList.add('titre'); };
    k.bas = t => {
      if (k.kilitli) return;
      if (t === 'sil') { k.deger = k.deger.slice(0, -1); Ses.tus(); }
      else if (t === 'tamam') {
        if (k.deger === '') { k.titret(); Ses.yanlis(); return; }
        Ses.tik();
        ayar.onTamam && ayar.onTamam(parseInt(k.deger, 10));
        return;
      }
      else {
        if (k.deger === '0') k.deger = t;                 // baştaki sıfır kalmaz
        else if (k.deger.length < enFazla) k.deger += t;
        else { k.titret(); return; }
        Ses.tus();
      }
      k.guncelle();
    };
    k.kilitle = (b=true) => { k.kilitli = b; k.el.classList.toggle('kilitli', b); };
    k.temizle = () => { k.deger = ''; k.ekran.classList.remove('dogru','yanlis'); k.kilitle(false); k.guncelle(); };
    k.isaretle = dogru => k.ekran.classList.add(dogru ? 'dogru' : 'yanlis');

    k.guncelle();
    this.aktif = k;
    return k;
  },

  /* fiziksel klavye; işlediyse true döner */
  klavye(e){
    const k = this.aktif;
    if (!k || !document.body.contains(k.el) || k.kilitli) return false;
    let t = null;
    if (/^[0-9]$/.test(e.key)) t = e.key;
    else if (e.key === 'Backspace' || e.key === 'Delete') t = 'sil';
    else if (e.key === 'Enter') t = 'tamam';
    if (!t) return false;
    const b = k.tusEl[t];
    b.classList.add('basili'); setTimeout(() => b.classList.remove('basili'), 120);
    k.bas(t);
    return true;
  }
};

/* =========================================================
   5f. SEÇENEKLER — kolay seviyede 3–4 düğme
   ========================================================= */
const Secenekler = {
  /* liste: [{ deger, etiket }] ; onSec(deger) ; metin:true → okunuş gibi uzun yazılar */
  olustur(kap, liste, onSec, { metin=false, sinif='' }={}){
    const s = { kilitli:false };
    s.el = el('div', { class:'secenekler' });
    s.dugmeler = liste.map(o => {
      const b = el('button', { class:'secenek' + (metin ? ' metin' : '') + (sinif ? ' ' + sinif : ''), onclick:()=>{
        if (s.kilitli) return;
        s.kilitle(true);
        onSec(o.deger);
      }});
      b.textContent = o.etiket;
      b.dataset.deger = String(o.deger);
      s.el.appendChild(b);
      return b;
    });
    kap.appendChild(s.el);
    s.kilitle = (x=true) => { s.kilitli = x; s.el.classList.toggle('kilitli', x); };
    /* doğruyu yeşil, seçilen yanlışı pembe, diğerlerini soluk yapar */
    s.isaretle = (dogruDeger, secilen) => {
      s.dugmeler.forEach(b => {
        const d = b.dataset.deger;
        if (d === String(dogruDeger)) b.classList.add('dogru');
        else if (d === String(secilen)) { b.classList.add('yanlis','titre'); }
        else b.classList.add('soluk');
      });
    };
    return s;
  }
};

/* =========================================================
   5g. GERİ BİLDİRİM PANELİ
   dogru(ek)  → kısa kutlama, ~1.2 sn sonra kendiliğinden kapanır
   yanlis({aciklama, okunacak}) → öğretici açıklama + Devam
   İkisi de Promise döner; panel kapanınca çözülür.
   ========================================================= */
const GeriBildirim = {
  acik: false,
  coz: null,
  zaman: null,
  OVGULER: ['Aferin!', 'Süper!', 'Doğru!', 'Harika!', 'Bravo!', 'Çok iyi!'],

  goster({ tur, baslik, aciklama='', okunacak='', otomatik=0 }){
    this.kapat(true);
    const p = $('#geriBildirim');
    p.classList.remove('dogru','yanlis');
    p.classList.add(tur, 'acik');
    $('#gbBaslik').textContent = baslik;
    $('#gbAciklama').innerHTML = aciklama;
    $('#gbDevam').classList.toggle('gizli', tur === 'dogru');
    this.acik = true;
    if (okunacak) Konusma.oku(okunacak);
    if (tur === 'yanlis') setTimeout(() => this.acik && $('#gbDevam').focus({ preventScroll:true }), 260);
    return new Promise(c => {
      this.coz = c;
      if (otomatik) this.zaman = setTimeout(() => this.kapat(), otomatik);
    });
  },
  dogru(ek=''){
    Ses.dogru();
    return this.goster({ tur:'dogru', baslik:Sayi.sec(this.OVGULER), aciklama:ek, otomatik:1200 });
  },
  yanlis({ baslik='Bir daha bakalım', aciklama='', okunacak='' }={}){
    Ses.yanlis();
    return this.goster({ tur:'yanlis', baslik, aciklama, okunacak });
  },
  /* sessiz=true → sadece temizle (yeni panel açılırken / sahne değişirken) */
  kapat(sessiz=false){
    clearTimeout(this.zaman);
    if (!this.acik) return;
    this.acik = false;
    $('#geriBildirim').classList.remove('acik');
    const c = this.coz; this.coz = null;
    if (!sessiz) Ses.tik();
    c && c();
  }
};
$('#gbDevam').addEventListener('click', () => GeriBildirim.kapat());
/* doğru panelinde ekrana dokunmak bekletmeden geçirir */
$('#geriBildirim').addEventListener('click', e => {
  if ($('#geriBildirim').classList.contains('dogru') && GeriBildirim.acik) GeriBildirim.kapat(true);
});

/* =========================================================
   5h. TUR AKIŞI — 10 soru → tur sonu
   ayar: { bolge, zorluk, alan (OyunAlani.kur sonucu),
           soruUret(i) → { anahtar, … },
           soruSor(soru, alan) → Promise<{ dogru:boolean, tekrar?:sayı }> }
   ========================================================= */
const TurAkisi = {
  kimlik: 0,
  async baslat(ayar){
    const kimlik = ++this.kimlik;
    const sonuclar = [], tekrar = [], sorulanlar = new Set();
    for (let i = 0; i < TUR_SORU_SAYISI; i++) {
      OyunAlani.ilerleme(ayar.alan, sonuclar, TUR_SORU_SAYISI);
      let soru, deneme = 0;
      do { soru = ayar.soruUret(i); } while (sorulanlar.has(soru.anahtar) && ++deneme < 50);
      sorulanlar.add(soru.anahtar);
      const s = await ayar.soruSor(soru, ayar.alan);
      if (kimlik !== this.kimlik) return;           // tur iptal edildi
      sonuclar.push(!!s.dogru);
      if (!s.dogru && s.tekrar !== undefined) tekrar.push(s.tekrar);
    }
    OyunAlani.ilerleme(ayar.alan, sonuclar, TUR_SORU_SAYISI);
    Tur.bitir({ bolge:ayar.bolge, zorluk:ayar.zorluk, dogru:sonuclar.filter(Boolean).length,
                toplam:TUR_SORU_SAYISI, tekrar });
  },
  iptal(){
    this.kimlik++;
    GeriBildirim.kapat(true);
    Konusma.sus();
    TusTakimi.aktif = null;
  }
};

/* =========================================================
   6. SAHNE YÖNETİCİSİ
   Her sahne: { baslik, geri, ust, ayar, gir(params), cik() }
     baslik : üst çubuk başlığı (metin veya params → metin)
     geri   : geri düğmesinin gideceği sahne (veya params → [sahne, params])
     ust    : üst çubuk görünsün mü
     ayar   : ayarlar düğmesi görünsün mü
   ========================================================= */
const Sahne = {
  tanimlar: {},
  aktif: null,
  params: {},
  ayarlardanDonus: null,   // Ayarlar kapatılınca dönülecek sahne

  tanimla(ad, tanim){ this.tanimlar[ad] = tanim; },

  git(ad, params={}){
    const yeni = this.tanimlar[ad];
    if (!yeni) { console.warn('Sahne yok:', ad); return; }

    if (ad === 'ayarlar' && this.aktif !== 'ayarlar') {
      this.ayarlardanDonus = { ad:this.aktif, params:this.params };
    }

    const eski = this.tanimlar[this.aktif];
    if (eski && eski.cik) eski.cik();
    document.querySelectorAll('.sahne.aktif').forEach(s => s.classList.remove('aktif'));

    this.aktif = ad;
    this.params = params;

    // Üst çubuk
    $('#ust').classList.toggle('gizli', !yeni.ust);
    $('#geriDugme').classList.toggle('gizli', !yeni.geri);
    $('#ayarDugme').classList.toggle('gizli', !yeni.ayar);
    const baslik = typeof yeni.baslik === 'function' ? yeni.baslik(params) : (yeni.baslik || '');
    $('#ustBaslik').innerHTML = baslik;

    if (yeni.gir) yeni.gir(params);
    const kutu = $('#sahne-' + ad);
    kutu.classList.add('aktif');
    kutu.scrollTop = 0;
  },

  geri(){
    const t = this.tanimlar[this.aktif];
    if (!t || !t.geri) return;
    const hedef = typeof t.geri === 'function' ? t.geri(this.params) : [t.geri, {}];
    this.git(hedef[0], hedef[1] || {});
  }
};
