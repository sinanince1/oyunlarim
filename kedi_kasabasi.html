/* ---------- 5. MAMA POSTASI (okuma–yazma) ---------- */
const Posta = {
  zorluk: null,
  deste: [],            // turun 10 sorusu: { tur:'kapi'|'okunus', sayi:null|tekrar sayısı }
  sonSayilar: [],       // son 15 sayı (oturum boyunca) tekrar gelmez
  bekle(ms){ return new Promise(r => setTimeout(r, ms)); },

  baslat(zorluk){
    this.zorluk = zorluk;
    this.desteHazirla(zorluk);
    const alan = OyunAlani.kur($('#sahne-posta'));
    const kimlik = TurAkisi.kimlik;
    requestAnimationFrame(() => {
      if (TurAkisi.kimlik !== kimlik || Sahne.aktif !== 'posta') return;
      TurAkisi.baslat({ bolge:'posta', zorluk, alan,
        soruUret:i => this.soruUret(i), soruSor:(soru, a) => this.soruSor(soru, a) });
    });
  },

  desteHazirla(zorluk){
    const turler = zorluk === 'orta'
      ? Array(TUR_SORU_SAYISI).fill('kapi')
      : [...Array(5).fill('kapi'), ...Array(5).fill('okunus')];
    // tekrar havuzu: bu bölgede yanlış yapılan sayılardan en fazla 2 tanesi
    const [a, b] = ZORLUKLAR[zorluk].aralik;
    const havuz = [...new Set(Kayit.durum.yanlislar.filter(y => y.b === 'posta').map(y => y.s))]
      .filter(x => x >= a && x <= b);
    const tekrarlar = Sayi.karistir(havuz).slice(0, 2);
    this.deste = Sayi.karistir(turler.map((tur, i) => {
      let sayi = i < tekrarlar.length ? tekrarlar[i] : null;
      if (sayi !== null && tur === 'okunus' && zorluk === 'zor' && (sayi < 10 || sayi > 99)) sayi = null;
      return { tur, sayi };
    }));
  },

  /* sayı dağılımı: %70 iki basamaklı (birler ≠ 0), %20 tam onluk, %10 tek basamaklı veya 100 */
  sayiSec(tur){
    const [a, b] = ZORLUKLAR[this.zorluk].aralik;
    const kartli = tur === 'okunus' && this.zorluk === 'zor';   // kelime kartları: 10–99
    const ust = kartli ? 99 : b;
    const r = Math.random();
    let n;
    if (r < 0.7 || kartli && r >= 0.9) {
      do { n = Sayi.rastgele(Math.max(11, a), Math.min(99, ust)); } while (n % 10 === 0);
    } else if (r < 0.9) {
      n = 10 * Sayi.rastgele(1, Math.floor(Math.min(ust, 90) / 10));
    } else {
      n = (b >= 100 && Math.random() < 0.4) ? 100 : Sayi.rastgele(1, 9);
    }
    return n;
  },

  soruUret(i){
    const d = this.deste[i];
    let n = d.sayi;
    d.sayi = null;                       // tekrar sayısı bir kez kullanılır
    if (n === null) {
      for (let k = 0; k < 30; k++) { n = this.sayiSec(d.tur); if (!this.sonSayilar.includes(n)) break; }
    }
    this.sonSayilar.push(n);
    if (this.sonSayilar.length > 15) this.sonSayilar.shift();
    return { anahtar:n, tur:d.tur, sayi:n };
  },

  /* okunuş; destekte onlar mor, birler turuncu */
  okunusHTML(n, destekli){
    if (!destekli || n === 100) return `<span class="okunus">${Sayi.yazi(n)}</span>`;
    const { onluk, birlik } = Sayi.parcala(n);
    const p = [];
    if (onluk) p.push(`<span class="kutu onluk">${Sayi.ONLAR[onluk]}</span>`);
    if (birlik) p.push(`<span class="kutu birlik">${Sayi.BIRLER[birlik]}</span>`);
    return `<span class="okunus">${p.join(' ')}</span>`;
  },

  async soruSor(s, alan){
    const z = ZORLUKLAR[this.zorluk];
    alan.cevap.innerHTML = '';
    const sonuc = s.tur === 'kapi'
      ? await this.kapiSorusu(s.sayi, alan, z.bicim === 'secme', this.zorluk === 'orta')
      : await this.okunusSorusu(s.sayi, alan, z.bicim === 'secme');
    if (sonuc.dogru) await GeriBildirim.dogru(balikEkHTML(z.balik));
    else await GeriBildirim.yanlis({ aciklama:sonuc.aciklama, okunacak:Sayi.yazi(s.sayi) });
    return { dogru:sonuc.dogru, tekrar:s.sayi };
  },

  /* KAPI: okunuş → rakam */
  async kapiSorusu(n, alan, secme, destekli){
    OyunAlani.yonerge(alan, secme ? 'Mamayı hangi kapıya götürelim?' : 'Kapı numarasını yaz!', Sayi.yazi(n));
    const sahne = this.sahneCiz(alan.govde, { zarf:this.okunusHTML(n, destekli), kapi:secme ? null : '?' });
    let verilen;
    if (secme) {
      alan.cevap.appendChild(el('div', { class:'cevap-baslik' }, 'Kapıyı seç'));
      const liste = Sayi.karistir([n, ...Sayi.celdiriciler(n, ZORLUKLAR[this.zorluk].aralik, 3)])
        .map(d => ({ deger:d, etiket:String(d) }));
      let sec;
      verilen = await new Promise(coz => { sec = Secenekler.olustur(alan.cevap, liste, coz, { sinif:'kapi-secenek' }); });
      sec.isaretle(n, verilen);
    } else {
      let tus;
      verilen = await new Promise(coz => {
        tus = TusTakimi.olustur(alan.cevap, { renkli:destekli,
          onTamam:d => { tus.kilitle(true); coz(d); }, onDegisim:m => sahne.kapiYaz(m) });
      });
      tus.isaretle(verilen === n);
    }
    const dogru = verilen === n;
    await sahne.teslim(dogru, n);
    return { dogru, aciklama:Aciklama.hataMesaji(n, verilen) + Aciklama.basamak(n) };
  },

  /* OKUNUŞ: rakam → söz (kolay seçerek, zor kelime kartlarıyla) */
  async okunusSorusu(n, alan, secme){
    const yonerge = secme ? 'Bu kapının numarası nasıl okunur?' : 'Kartlarla kapı numarasını yaz!';
    OyunAlani.yonerge(alan, yonerge, yonerge);      // sayı okunmaz: cevabı söylemiş olurdu
    const slotlar = secme ? '<span class="zarf-bos">?</span>'
      : '<span class="slot onluk" data-yuva="onluk"></span><span class="slot birlik" data-yuva="birlik"></span>';
    const sahne = this.sahneCiz(alan.govde, { zarf:slotlar, kapi:String(n), ters:true });
    if (secme) {
      const sayilar = Sayi.karistir([n, ...Sayi.celdiriciler(n, ZORLUKLAR[this.zorluk].aralik, 3)]);
      let sec;
      const v = await new Promise(coz => {
        sec = Secenekler.olustur(alan.cevap, sayilar.map(d => ({ deger:d, etiket:Sayi.yazi(d) })), coz, { metin:true });
      });
      sec.isaretle(n, v);
      sahne.zarfYaz(`<span class="zarf-yazi">${Sayi.yazi(v)}</span>`);
      const dogru = v === n;
      await sahne.okunusIsaretle(dogru, `<span class="zarf-yazi">${Sayi.yazi(n)}</span>`);
      return { dogru, aciklama:Aciklama.hataMesaji(n, v) + Aciklama.basamak(n) };
    }
    const v = await this.kartlar(n, alan.cevap, sahne);
    const verilen = v.onluk * 10 + v.birlik;
    const dogru = verilen === n;
    await sahne.okunusIsaretle(dogru, null, n);
    return { dogru, aciklama:this.kartAciklama(n, v) + Aciklama.basamak(n) };
  },

  kartAciklama(n, v){
    const { onluk:o, birlik:b } = Sayi.parcala(n);
    let m = '';
    if (v.onluk === b && v.birlik === o && o !== b) m = 'Onlar ile birler yer değiştirmiş.';
    else if (v.onluk !== o && v.birlik === b) m = o ? `Onlar basamağında ${o} var: ${Sayi.ONLAR[o]}.` : 'Onlar basamağı boş.';
    else if (v.birlik !== b && v.onluk === o) m = b ? `Birler basamağında ${b} var: ${Sayi.BIRLER[b]}.` : 'Birler basamağında 0 var, sadece onlar okunur.';
    return m ? `<div class="ipucu">${m}</div>` : '';
  },

  /* kelime kartları: 4 onlar + 4 birler kartı; Promise<{ onluk, birlik }> */
  kartlar(n, kap, sahne){
    const { onluk:o, birlik:b } = Sayi.parcala(n);
    const doldur = adaylar => {
      const sonuc = [];
      adaylar.forEach(x => { if (x >= 1 && x <= 9 && !sonuc.includes(x) && sonuc.length < 4) sonuc.push(x); });
      while (sonuc.length < 4) { const x = Sayi.rastgele(1, 9); if (!sonuc.includes(x)) sonuc.push(x); }
      return Sayi.karistir(sonuc);
    };
    const onlarDiz = doldur([o, b, o + 1, o - 1, o + 2, o - 2]);
    const birlerDiz = doldur([b, o, b + 1, b - 1, b + 2, b - 2]);
    const secim = { onluk:0, birlik:0 };
    const kutu = el('div', { class:'kartlar' });
    const satir = (tur, dizi, sozluk, etiket) => {
      const r = el('div', { class:'kart-satir' }, `<span class="kart-etiket ${tur}">${etiket}</span>`);
      dizi.forEach(d => r.appendChild(el('button', { class:`kelime-kart ${tur}`, 'data-deger':String(d),
        onclick:() => { Ses.tus(); secim[tur] = secim[tur] === d ? 0 : d; guncelle(); } }, sozluk[d])));
      kutu.appendChild(r);
    };
    satir('onluk', onlarDiz, Sayi.ONLAR, 'Onlar');
    satir('birlik', birlerDiz, Sayi.BIRLER, 'Birler');
    const tamam = el('button', { class:'dugme yesil' }, 'Tamam');
    kutu.appendChild(tamam);
    kap.appendChild(kutu);
    const guncelle = () => {
      kutu.querySelectorAll('.kelime-kart').forEach(k => {
        const tur = k.classList.contains('onluk') ? 'onluk' : 'birlik';
        k.classList.toggle('secili', secim[tur] === Number(k.dataset.deger));
      });
      sahne.yuvaYaz(secim);
    };
    sahne.yuvaTikla(tur => { secim[tur] = 0; Ses.tus(); guncelle(); });
    return new Promise(coz => {
      tamam.addEventListener('click', () => {
        if (!secim.onluk && !secim.birlik) { tamam.classList.remove('titre'); void tamam.offsetWidth; tamam.classList.add('titre'); Ses.yanlis(); return; }
        Ses.tik();
        kutu.classList.add('kilitli');
        coz({ ...secim });
      });
    });
  },

  /* sokak sahnesi: zarf (+kedi) ve isteğe bağlı ev/kapı */
  sahneCiz(govde, { zarf, kapi=null, ters=false }){
    govde.innerHTML = '';
    const sahne = el('div', { class:'posta-sahne' + (ters ? ' ters' : '') },
      '<span class="bulut" style="top:10%;--s:28s;animation-delay:-9s"></span><span class="bulut kucuk" style="top:26%;--s:38s;animation-delay:-24s"></span>');
    const zarfKutu = el('div', { class:'zarf-kutu' },
      `${kediSVG('zarf-kedi')}
       <div class="zarf"><div class="zarf-ic">${zarf}</div></div>`);
    sahne.appendChild(zarfKutu);
    let levha = null;
    if (kapi !== null) {
      const ev = el('div', { class:'ev' },
        `<div class="ev-dam"></div><div class="ev-duvar"><div class="kapi-levha${kapi === '?' ? ' bos' : ''}">${kapi}</div><div class="kapi"></div></div>`);
      sahne.appendChild(ev);
      levha = $('.kapi-levha', ev);
    }
    govde.appendChild(sahne);
    const zarfEl = $('.zarf', zarfKutu), zarfIc = $('.zarf-ic', zarfKutu);
    const oynat = (hedef, kareler, sure) => new Promise(res => {
      if (Catilar.azHareket() || !hedef.animate) return res();
      const a = hedef.animate(kareler, { duration:sure, easing:'ease-in-out' });
      a.onfinish = res; a.oncancel = res;
    });
    let yuvaCb = null;
    zarfIc.addEventListener('click', e => {
      const y = e.target.closest('.slot');
      if (y && yuvaCb && !y.closest('.zarf').classList.contains('dogru') && !y.closest('.zarf').classList.contains('yanlis')) yuvaCb(y.dataset.yuva);
    });

    return {
      kapiYaz: m => { if (levha) levha.textContent = m || '?'; },
      zarfYaz: html => { zarfIc.innerHTML = html; },
      yuvaTikla: cb => { yuvaCb = cb; },
      yuvaYaz: sec => {
        zarfIc.querySelectorAll('.slot').forEach(y => {
          const tur = y.dataset.yuva, d = sec[tur];
          y.textContent = d ? (tur === 'onluk' ? Sayi.ONLAR[d] : Sayi.BIRLER[d]) : '';
          y.classList.toggle('dolu', !!d);
        });
      },
      /* kapı sorusu: zarf kapıya uçar (doğru) ya da titrer (yanlış) */
      teslim: async (dogru, n) => {
        if (levha) { levha.classList.remove('bos'); levha.classList.add(dogru ? 'dogru' : 'yanlis'); }
        if (dogru) {
          Ses.balik();
          if (levha) {
            const z = zarfKutu.getBoundingClientRect(), l = levha.getBoundingClientRect();
            const dx = (l.left + l.width / 2) - (z.left + z.width / 2), dy = (l.top + l.height / 2) - (z.top + z.height / 2);
            await oynat(zarfKutu, [{ transform:'none', opacity:1 },
              { transform:`translate(${dx}px,${dy}px) scale(.25)`, opacity:0.2 }], 520);
            zarfKutu.style.opacity = '0';
          } else {
            zarfEl.classList.add('dogru');
            await oynat(zarfKutu, [{ transform:'none' }, { transform:'translateY(-18px)' }, { transform:'none' }], 420);
          }
        } else {
          zarfKutu.classList.add('titre');
          await this.bekle(450);
          if (levha) { levha.textContent = n; levha.classList.replace('yanlis', 'dogru'); }
        }
      },
      /* okunuş sorusu: zarfı işaretle; yanlışsa doğru okunuşu göster */
      okunusIsaretle: async (dogru, dogruHTML, n) => {
        zarfEl.classList.add(dogru ? 'dogru' : 'yanlis');
        if (dogru) { Ses.balik(); await oynat(zarfKutu, [{ transform:'none' }, { transform:'translateY(-14px)' }, { transform:'none' }], 380); return; }
        zarfKutu.classList.add('titre');
        await this.bekle(500);
        zarfEl.classList.replace('yanlis', 'dogru');
        if (dogruHTML) zarfIc.innerHTML = dogruHTML;
        else {
          const { onluk, birlik } = Sayi.parcala(n);
          this.zarfYuvaDogru(zarfIc, onluk, birlik);
        }
      }
    };
  },
  zarfYuvaDogru(zarfIc, o, b){
    zarfIc.querySelectorAll('.slot').forEach(y => {
      const d = y.dataset.yuva === 'onluk' ? o : b;
      y.textContent = d ? (y.dataset.yuva === 'onluk' ? Sayi.ONLAR[d] : Sayi.BIRLER[d]) : '';
      y.classList.toggle('gizli', !d);
    });
  }
};

  geri:() => ['zorluk', { bolge:'posta' }],
  cik(){ TurAkisi.iptal(); },
  gir(p){ Posta.baslat(p.zorluk); }
});



/* ---------- 6. KEDİ SEPETLERİ (onluk–birlik) ---------- */
const TEK_KEDI_RENK = [
  { tuy:'#F4A259' }, { tuy:'#9C9C9C' }, { tuy:'#2B2140', goz:'#FFD600' },
  { tuy:'#FFFFFF', cizgi:'#D9CBB8' }, { tuy:'#C98B4E' }, { tuy:'#E8C39E' }
];

const Sepetler = {
  zorluk: null,
  deste: [],            // turun 10 sorusu: { tur:'say'|'kur', sayi:null|tekrar sayısı }
  sonSayilar: [],
  bekle(ms){ return new Promise(r => setTimeout(r, ms)); },

  baslat(zorluk){
    this.zorluk = zorluk;
    this.desteHazirla(zorluk);
    const alan = OyunAlani.kur($('#sahne-sepetler'));
    const kimlik = TurAkisi.kimlik;
    requestAnimationFrame(() => {
      if (TurAkisi.kimlik !== kimlik || Sahne.aktif !== 'sepetler') return;
      TurAkisi.baslat({ bolge:'sepetler', zorluk, alan,
        soruUret:i => this.soruUret(i), soruSor:(soru, a) => this.soruSor(soru, a) });
    });
  },

  desteHazirla(zorluk){
    const turler = zorluk === 'zor'
      ? [...Array(5).fill('say'), ...Array(5).fill('kur')]
      : Array(TUR_SORU_SAYISI).fill('say');
    const [a, b] = ZORLUKLAR[zorluk].aralik;
    const havuz = [...new Set(Kayit.durum.yanlislar.filter(y => y.b === 'sepetler').map(y => y.s))]
      .filter(x => x >= a && x <= b);
    const tekrarlar = Sayi.karistir(havuz).slice(0, 2);
    this.deste = Sayi.karistir(turler.map((tur, i) => ({ tur, sayi:i < tekrarlar.length ? tekrarlar[i] : null })));
  },

  /* %70 iki basamaklı (birler ≠ 0), %20 tam onluk, %10 tek basamaklı veya 100 */
  sayiSec(){
    const [a, b] = ZORLUKLAR[this.zorluk].aralik;
    const r = Math.random();
    if (r < 0.7) { let n; do { n = Sayi.rastgele(Math.max(11, a), Math.min(99, b)); } while (n % 10 === 0); return n; }
    if (r < 0.9) return 10 * Sayi.rastgele(1, Math.floor(Math.min(b, 90) / 10));
    return (b >= 100 && Math.random() < 0.4) ? 100 : Sayi.rastgele(1, 9);
  },

  soruUret(i){
    const d = this.deste[i];
    let n = d.sayi;
    d.sayi = null;
    if (n === null) {
      for (let k = 0; k < 30; k++) { n = this.sayiSec(); if (!this.sonSayilar.includes(n)) break; }
    }
    this.sonSayilar.push(n);
    if (this.sonSayilar.length > 15) this.sonSayilar.shift();
    return { anahtar:n, tur:d.tur, sayi:n };
  },

  async soruSor(s, alan){
    const z = ZORLUKLAR[this.zorluk];
    alan.cevap.innerHTML = '';
    const sonuc = s.tur === 'say' ? await this.saySorusu(s.sayi, alan) : await this.kurSorusu(s.sayi, alan);
    if (sonuc.dogru) await GeriBildirim.dogru(balikEkHTML(z.balik));
    else await GeriBildirim.yanlis({ aciklama:sonuc.aciklama, okunacak:Sayi.yazi(s.sayi) });
    return { dogru:sonuc.dogru, tekrar:s.sayi };
  },

  /* SAY: sepet ve kedileri say, toplamı bul */
  async saySorusu(n, alan){
    const z = ZORLUKLAR[this.zorluk];
    const { onluk, birlik } = Sayi.parcala(n);
    const destekli = this.zorluk === 'orta';
    OyunAlani.yonerge(alan, 'Kaç kedi var?', 'Kaç kedi var?');
    const sahne = this.sahneCiz(alan.govde, {
      karisik:this.zorluk === 'zor', rozet:this.zorluk !== 'zor', destekli });
    sahne.ciz({ sepet:onluk, kedi:birlik });
    let verilen;
    if (z.bicim === 'secme') {
      const liste = Sayi.karistir([n, ...Sayi.celdiriciler(n, z.aralik, 3)]).map(d => ({ deger:d, etiket:String(d) }));
      let sec;
      verilen = await new Promise(coz => { sec = Secenekler.olustur(alan.cevap, liste, coz); });
      sec.isaretle(n, verilen);
    } else {
      let tus;
      verilen = await new Promise(coz => {
        tus = TusTakimi.olustur(alan.cevap, { renkli:destekli, onTamam:d => { tus.kilitle(true); coz(d); } });
      });
      tus.isaretle(verilen === n);
    }
    const dogru = verilen === n;
    sahne.isaretle(dogru);
    if (dogru) Ses.balik();
    else await sahne.saymaGoster();
    return { dogru, aciklama:this.sayAciklama(n, verilen) };
  },

  sayAciklama(n, verilen){
    const { onluk:o, birlik:b } = Sayi.parcala(n);
    const satirlar = [];
    if (o) satirlar.push(`Sepetleri onar say: <b>${Array.from({ length:o }, (_, i) => (i + 1) * 10).join(', ')}</b>`);
    if (b) {
      const birler = Array.from({ length:b }, (_, i) => o * 10 + i + 1);
      const kisa = birler.length > 4 ? `${birler[0]}, ${birler[1]} … ${birler[birler.length - 1]}` : birler.join(', ');
      satirlar.push(`${o ? 'Sonra kedileri ekle' : 'Kedileri birer say'}: <b>${kisa}</b>`);
    }
    return Aciklama.hataMesaji(n, verilen) + satirlar.map(x => `<div>${x}</div>`).join('') + Aciklama.basamak(n);
  },

  /* KUR: sayı verilir; + / − ile sepet ve kedi eklenir */
  async kurSorusu(n, alan){
    const { onluk:o, birlik:b } = Sayi.parcala(n);
    OyunAlani.yonerge(alan, `${n} kedi topla!`, `${Sayi.yazi(n)} kedi topla`);
    const sahne = this.sahneCiz(alan.govde, { karisik:false, rozet:false, destekli:false, kur:true });
    const durum = { sepet:0, kedi:0 };
    sahne.ciz(durum);

    const kutu = el('div', { class:'kurucu' });
    const satir = (tur, ad, sembol) => {
      const r = el('div', { class:'kur-satir' });
      const eksi = el('button', { class:'kur-dugme eksi', 'aria-label':`${ad} çıkar` }, '−');
      const arti = el('button', { class:'kur-dugme arti', 'aria-label':`${ad} ekle` }, '+');
      r.append(eksi, el('span', { class:'kur-ad' }, `<svg viewBox="${sembol === 's-sepet' ? '0 0 100 86' : '0 0 40 40'}" aria-hidden="true"><use href="#${sembol}"/></svg>${ad}`), arti);
      kutu.appendChild(r);
      return { eksi, arti };
    };
    const ds = satir('sepet', 'Sepet', 's-sepet');
    const dk = satir('kedi', 'Kedi', 's-kedi-yuz');
    const tamam = el('button', { class:'dugme yesil' }, 'Tamam');
    kutu.appendChild(tamam);
    alan.cevap.appendChild(kutu);

    const dugmeGuncelle = () => {
      ds.eksi.disabled = durum.sepet === 0;
      ds.arti.disabled = durum.sepet >= 10 || durum.sepet * 10 + durum.kedi >= 100;
      dk.eksi.disabled = durum.kedi === 0;
      dk.arti.disabled = durum.sepet * 10 + durum.kedi >= 100;
    };
    const degis = (tur, fark) => {
      if (tur === 'kedi' && fark > 0 && durum.kedi === 9) {
        // 10. kedi: 10 kedi bir sepete dolar
        durum.kedi = 0; durum.sepet++;
        Ses.balik(); bildir('10 kedi bir sepet oldu!');
        sahne.ciz(durum, 'sepet');
      } else {
        durum[tur] += fark;
        Ses.tus();
        sahne.ciz(durum, fark > 0 ? tur : null);
      }
      dugmeGuncelle();
    };
    ds.eksi.onclick = () => degis('sepet', -1); ds.arti.onclick = () => degis('sepet', 1);
    dk.eksi.onclick = () => degis('kedi', -1);  dk.arti.onclick = () => degis('kedi', 1);
    dugmeGuncelle();

    const v = await new Promise(coz => {
      tamam.addEventListener('click', () => {
        if (!durum.sepet && !durum.kedi) { tamam.classList.remove('titre'); void tamam.offsetWidth; tamam.classList.add('titre'); Ses.yanlis(); return; }
        Ses.tik(); kutu.classList.add('kilitli'); coz({ ...durum });
      });
    });
    const dogru = v.sepet * 10 + v.kedi === n;
    sahne.isaretle(dogru);
    if (dogru) Ses.balik();
    else {
      await this.bekle(600);
      sahne.ciz({ sepet:o, kedi:b });          // doğru kuruluşu göster
      sahne.isaretle(true);
    }
    return { dogru, aciklama:this.kurAciklama(n, v) };
  },

  kurAciklama(n, v){
    const { onluk:o, birlik:b } = Sayi.parcala(n);
    let m = '';
    if (v.sepet === b && v.kedi === o && o !== b) m = 'Sepetler ile kediler yer değiştirmiş.';
    else if (v.sepet === o && v.kedi !== b) m = `Sepetler doğru. ${b ? b + ' kedi' : 'Hiç tek kedi'} olmalı.`;
    else if (v.kedi === b && v.sepet !== o) m = `Kediler doğru. ${o} sepet olmalı.`;
    return (m ? `<div class="ipucu">${m}</div>` : '')
      + `<div>${n} kedi = <b>${o} sepet</b> ve <b>${b} kedi</b></div>` + Aciklama.basamak(n);
  },

  /* sahne: düzenli (Sepetler | Kediler) ya da karışık; Döner: { ciz, isaretle, saymaGoster } */
  sahneCiz(govde, { karisik, rozet, destekli, kur=false }){
    govde.innerHTML = '';
    const sahne = el('div', { class:'sepet-sahne' });
    govde.appendChild(sahne);
    const kediHTML = i => {
      const r = TEK_KEDI_RENK[i % TEK_KEDI_RENK.length];
      return `<span class="sepet-oge tek-kedi" style="--tuy:${r.tuy};--goz:${r.goz || '#2B2140'};--cizgi-renk:${r.cizgi || 'none'}"><svg viewBox="0 0 40 40" aria-hidden="true"><use href="#s-kedi-yuz"/></svg></span>`;
    };
    const sepetHTML = () =>
      `<span class="sepet-oge sepet"><svg viewBox="0 0 100 86" aria-hidden="true"><use href="#s-sepet"/></svg>${rozet ? '<span class="on-rozet">10</span>' : ''}</span>`;
    const yeniIsaretle = (kap, secici) => { const s = kap.querySelectorAll(secici); if (s.length) s[s.length - 1].classList.add('yeni'); };

    const ciz = (d, yeni=null) => {
      sahne.classList.remove('dogru', 'yanlis');
      if (karisik) {
        const ogeler = [...Array(d.sepet).fill('s'), ...Array(d.kedi).fill('k')];
        let ki = 0;
        const html = Sayi.karistir(ogeler).map(t => {
          const aci = Sayi.rastgele(-9, 9);
          const h = t === 's' ? sepetHTML() : kediHTML(ki++);
          return h.replace('class="sepet-oge', `style="transform:rotate(${aci}deg)" class="sepet-oge`);
        }).join('');
        sahne.innerHTML = `<div class="karisik-alan"><div class="karisik-izgara">${html}</div></div>`;
        return;
      }
      const et1 = destekli ? '<span class="alan-etiket onluk">Sepetler (onlar)</span>' : '<span class="alan-etiket">Sepetler</span>';
      const et2 = destekli ? '<span class="alan-etiket birlik">Kediler (birler)</span>' : '<span class="alan-etiket">Kediler</span>';
      const bos = '<span class="bos-not">—</span>';
      sahne.innerHTML =
        `<div class="sepet-alan">${et1}${d.sepet ? `<div class="sepet-izgara">${Array.from({ length:d.sepet }, sepetHTML).join('')}</div>` : bos}</div>` +
        `<div class="kedi-alan">${et2}${d.kedi ? `<div class="kedi-izgara">${Array.from({ length:d.kedi }, (_, i) => kediHTML(i)).join('')}</div>` : bos}</div>`;
      if (yeni === 'sepet') yeniIsaretle(sahne, '.sepet-oge.sepet');
      if (yeni === 'kedi') yeniIsaretle(sahne, '.sepet-oge.tek-kedi');
    };

    return {
      ciz,
      isaretle: dogru => { sahne.classList.remove('dogru', 'yanlis'); sahne.classList.add(dogru ? 'dogru' : 'yanlis'); },
      /* önce sepetler onar onar (10, 20, …), sonra kediler birer birer */
      saymaGoster: async () => {
        let toplam = 0;
        for (const s of sahne.querySelectorAll('.sepet-oge.sepet')) {
          toplam += 10;
          s.classList.add('yeni'); s.insertAdjacentHTML('beforeend', `<span class="sayac">${toplam}</span>`);
          Ses.tus(); await this.bekle(Catilar.azHareket() ? 60 : 230);
        }
        for (const k of sahne.querySelectorAll('.sepet-oge.tek-kedi')) {
          toplam += 1;
          k.classList.add('yeni'); k.insertAdjacentHTML('beforeend', `<span class="sayac">${toplam}</span>`);
          Ses.tus(); await this.bekle(Catilar.azHareket() ? 40 : 150);
        }
        await this.bekle(250);
      }
    };
  }
};

Sahne.tanimla('sepetler', {
  ust:true, ayar:false,
  baslik:p => `Kedi Sepetleri${zorlukCip(p.zorluk)}`,
  geri:() => ['zorluk', { bolge:'sepetler' }],
  cik(){ TurAkisi.iptal(); },
  gir(p){ Sepetler.baslat(p.zorluk); }
});

/* ---------- 4. ÇATILAR (ritmik sayma) ---------- */
const ADIM_EK  = { 2:"2'şer", 3:"3'er", 4:"4'er", 5:"5'er", 10:"10'ar" };
const ADIM_OKU = { 2:'ikişer', 3:'üçer', 4:'dörder', 5:'beşer', 10:'onar' };
const CATI_RENK = [['#A855F7','#7C3AED'], ['#FF4D8D','#D93673'], ['#FF6B35','#D9531F'], ['#4D9FFF','#2F7FE0'], ['#00C9A7','#00A88B']];

const Catilar = {
  zorluk: null,
  deste: [],            // turun 10 sorusu için { adim, yon }
  sonAnahtarlar: [],    // son 15 soru (oturum boyunca) tekrar gelmez
  aktifSahne: null,
  bekle(ms){ return new Promise(r => setTimeout(r, ms)); },
  azHareket(){ return window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; },

  baslat(zorluk){
    this.zorluk = zorluk;
    this.desteHazirla(zorluk);
    const alan = OyunAlani.kur($('#sahne-catilar'));
    const kimlik = TurAkisi.kimlik;
    // sahne görünür olduktan sonra başla (kedi konumu ölçülebilsin)
    requestAnimationFrame(() => {
      if (TurAkisi.kimlik !== kimlik || Sahne.aktif !== 'catilar') return;
      TurAkisi.baslat({ bolge:'catilar', zorluk, alan,
        soruUret:i => this.soruUret(i), soruSor:(soru, a) => this.soruSor(soru, a) });
    });
  },

  /* her adım en az bir kez; aynı adım üst üste en fazla 2; aynı yön üst üste en fazla 3 */
  desteHazirla(zorluk){
    const adimlar = RITMIK[zorluk].adimlar;
    let a = [];
    while (a.length < TUR_SORU_SAYISI) a.push(...Sayi.karistir(adimlar));
    a = a.slice(0, TUR_SORU_SAYISI);
    let y = Array.from({ length:TUR_SORU_SAYISI }, (_, i) => i % 2 ? 'geri' : 'ileri');
    const uygun = (d, sinir) => d.every((x, i) => i < sinir || d.slice(i - sinir, i + 1).some(z => z !== x));
    for (let i = 0; i < 200; i++) { a = Sayi.karistir(a); if (uygun(a, 2)) break; }
    for (let i = 0; i < 200; i++) { y = Sayi.karistir(y); if (uygun(y, 3)) break; }
    this.deste = a.map((adim, i) => ({ adim, yon:y[i] }));
  },

  soruUret(i){
    const { adim, yon } = this.deste[i];
    const r = RITMIK[this.zorluk];
    const uzunluk = this.zorluk === 'zor' ? 5 : 4;
    const yayilim = (uzunluk - 1) * adim;
    const isaret = yon === 'ileri' ? 1 : -1;
    const adaylar = [];
    for (let v = RITMIK.enKucuk; v <= RITMIK.enBuyuk; v++) {
      const son = v + isaret * yayilim;
      if (son < RITMIK.enKucuk || son > RITMIK.enBuyuk) continue;
      if (r.katlardanBasla && v % adim !== 0) continue;
      adaylar.push(v);
    }
    let bas, anahtar;
    for (let d = 0; d < 30; d++) {
      bas = Sayi.sec(adaylar);
      anahtar = `${adim}${yon}${bas}`;
      if (!this.sonAnahtarlar.includes(anahtar)) break;
    }
    this.sonAnahtarlar.push(anahtar);
    if (this.sonAnahtarlar.length > 15) this.sonAnahtarlar.shift();
    const degerler = Array.from({ length:uzunluk }, (_, k) => bas + isaret * adim * k);
    const bosSira = this.zorluk === 'zor' ? Sayi.rastgele(0, uzunluk - 1) : uzunluk - 1;
    return { anahtar, adim, yon, isaret, degerler, bosSira, dogru:degerler[bosSira] };
  },

  /* kolay seçenekleri: yön hatası, adım hatası + 1 öğretici çeldirici */
  celdiriciler(s){
    const { dogru, adim, isaret, degerler, bosSira } = s;
    const onceki = degerler[bosSira - 1];
    const digerAdim = adim === 10 ? 5 : 10;
    const sonuc = [];
    const ekle = x => { if (x >= 0 && x <= 100 && x !== dogru && !sonuc.includes(x)) sonuc.push(x); };
    ekle(onceki - isaret * adim);            // yön hatası (geri gitmek)
    ekle(onceki + isaret * digerAdim);       // adım hatası (5 yerine 10)
    Sayi.karistir([dogru + 1, dogru - 1, dogru + 10, dogru - 10]).forEach(x => { if (sonuc.length < 3) ekle(x); });
    if (sonuc.length < 3) Sayi.celdiriciler(dogru, [0, 100], 3).forEach(x => { if (sonuc.length < 3) ekle(x); });
    return sonuc.slice(0, 3);
  },

  /* yanlış cevapta öğretici açıklama */
  aciklama(s, verilen){
    const { dogru, adim, isaret, degerler, bosSira } = s;
    const solda = bosSira > 0;
    const komsu = solda ? degerler[bosSira - 1] : degerler[1];
    const artiMi = solda ? isaret > 0 : isaret < 0;
    const islem = `${komsu} ${artiMi ? '+' : '−'} ${adim} = ${dogru}`;
    let ipucu = '';
    if (solda) {
      const fark = (verilen - komsu) * isaret;
      if (fark === -adim) ipucu = isaret > 0 ? 'Sayılar artıyor, ileri sayıyoruz.' : 'Sayılar azalıyor, geri sayıyoruz.';
      else if (fark > 0 && fark !== adim && ADIM_EK[fark]) ipucu = `${fark} ${isaret > 0 ? 'ekledin' : 'çıkardın'}, ama ${ADIM_EK[adim]} sayıyoruz.`;
    }
    const ust = ipucu ? `<div class="ipucu">${ipucu}</div>` : Aciklama.hataMesaji(dogru, verilen);
    return ust
      + `<div>Her çatıda sayı ${adim} ${isaret > 0 ? 'artıyor' : 'azalıyor'}: <b>${islem}</b></div>`
      + Aciklama.dizi(degerler, isaret * adim, bosSira);
  },

  async soruSor(s, alan){
    const z = ZORLUKLAR[this.zorluk];
    const destekli = this.zorluk !== 'zor';
    const yonergeMetni = destekli ? `${ADIM_EK[s.adim]} ${s.yon} say!` : 'Eksik sayıyı bul!';
    const okunacak = destekli
      ? `${ADIM_OKU[s.adim]} ${s.yon} say. ` + s.degerler.slice(0, s.bosSira).map(x => Sayi.yazi(x)).join(', ')
      : 'Eksik sayıyı bul.';
    OyunAlani.yonerge(alan, yonergeMetni, okunacak);
    const sahne = this.sahneCiz(alan.govde, s, destekli);
    this.aktifSahne = sahne;

    alan.cevap.innerHTML = '';
    let tus = null, sec = null;
    const cevapSozu = new Promise(coz => {
      if (z.bicim === 'secme') {
        alan.cevap.appendChild(el('div', { class:'cevap-baslik' }, 'Kedi hangi çatıya zıplasın?'));
        const liste = Sayi.karistir([s.dogru, ...this.celdiriciler(s)]).map(d => ({ deger:d, etiket:String(d) }));
        sec = Secenekler.olustur(alan.cevap, liste, coz, { sinif:'cati-secenek' });
        sec.kilitle(true);
      } else {
        tus = TusTakimi.olustur(alan.cevap, {
          onTamam:d => { tus.kilitle(true); coz(d); },
          onDegisim:m => sahne.bosYaz(m)
        });
        tus.kilitle(true);
      }
    });

    await sahne.giris();                      // kedi görünen çatılarda zıplar
    if (sec) sec.kilitle(false);
    if (tus) tus.kilitle(false);

    const verilen = await cevapSozu;
    const dogru = verilen === s.dogru;
    if (sec) sec.isaretle(s.dogru, verilen);
    if (tus) tus.isaretle(dogru);
    await sahne.cevapla(verilen, dogru);

    if (dogru) await GeriBildirim.dogru(balikEkHTML(z.balik));
    else await GeriBildirim.yanlis({ aciklama:this.aciklama(s, verilen),
                                     okunacak:s.degerler.map(x => Sayi.yazi(x)).join(', ') });
    return { dogru, tekrar:s.dogru };
  },

  /* gece manzarası: çatılar + kedi. Döner: { giris, bosYaz, cevapla, yerlestir } */
  sahneCiz(govde, s, destekli){
    govde.innerHTML = '';
    const gece = el('div', { class:'gece' },
      '<i class="yildizcik" style="left:20%;top:12%"></i><i class="yildizcik" style="left:56%;top:7%;animation-delay:.9s"></i>' +
      '<i class="yildizcik" style="left:74%;top:30%;animation-delay:1.7s"></i><i class="yildizcik" style="left:36%;top:26%;animation-delay:2.2s"></i>');
    const sira = el('div', { class:'cati-sira' });
    const catilar = s.degerler.map((d, i) => {
      const [r1, r2] = CATI_RENK[i % CATI_RENK.length];
      const bos = i === s.bosSira;
      const c = el('div', { class:'cati' + (bos ? ' bos' : ''),
        style:`--renk:${r1};--renk-koyu:${r2};--h:${Sayi.rastgele(0, 2)}` },
        `<div class="dam"></div><div class="duvar"><span class="levha">${bos ? '?' : d}</span><span class="pencere"></span></div>`);
      if (destekli && i < s.degerler.length - 1)
        c.appendChild(el('span', { class:'ok-etiket' }, `${s.isaret > 0 ? '+' : '−'}${s.adim}`));
      sira.appendChild(c);
      return c;
    });
    const kedi = el('div', { class:'cati-kedi' }, kediSVG());
    gece.append(sira, kedi);
    govde.appendChild(gece);

    let konum = 0;
    const nokta = i => {
      const g = gece.getBoundingClientRect(), d = catilar[i].querySelector('.dam').getBoundingClientRect();
      const w = kedi.offsetWidth;
      return { x:d.left - g.left + d.width / 2 - w / 2, y:d.top - g.top - w * 0.8 };
    };
    const yerlestir = i => { const p = nokta(i); kedi.style.transform = `translate(${p.x}px,${p.y}px)`; konum = i; };
    const oynat = (kareler, sure) => new Promise(res => {
      if (this.azHareket() || !kedi.animate) return res();
      const a = kedi.animate(kareler, { duration:sure, easing:'ease-in-out' });
      a.onfinish = res; a.oncancel = res;
    });
    const zipla = async i => {
      const a = nokta(konum), b = nokta(i);
      const tepe = Math.min(a.y, b.y) - kedi.offsetWidth * 0.6;
      Ses.zipla();
      kedi.style.transform = `translate(${b.x}px,${b.y}px)`;
      konum = i;
      await oynat([
        { transform:`translate(${a.x}px,${a.y}px)` },
        { transform:`translate(${(a.x + b.x) / 2}px,${tepe}px)`, offset:0.5 },
        { transform:`translate(${b.x}px,${b.y}px)` }], 360);
    };
    const kay = async geriSira => {
      const a = nokta(konum), b = nokta(geriSira);
      kedi.style.transform = `translate(${b.x}px,${b.y}px)`;
      konum = geriSira;
      await oynat([
        { transform:`translate(${a.x}px,${a.y}px) rotate(0deg)` },
        { transform:`translate(${a.x + 8}px,${a.y + 34}px) rotate(28deg)`, offset:0.45 },
        { transform:`translate(${b.x}px,${b.y}px) rotate(0deg)` }], 700);
    };

    const baslangic = s.bosSira > 0 ? 0 : 1;
    const bekleme = s.bosSira > 0 ? s.bosSira - 1 : 1;
    const bosLevha = catilar[s.bosSira].querySelector('.levha');

    return {
      giris: async () => {
        yerlestir(baslangic);
        for (let i = baslangic + 1; i <= bekleme; i++) { await this.bekle(140); await zipla(i); }
      },
      bosYaz: m => { bosLevha.textContent = m || '?'; },
      cevapla: async (verilen, dogru) => {
        const c = catilar[s.bosSira];
        bosLevha.textContent = verilen;
        c.classList.remove('bos');
        c.classList.add(dogru ? 'dogru' : 'yanlis');
        await zipla(s.bosSira);
        if (!dogru) {
          await kay(bekleme);
          await this.bekle(150);
          c.classList.replace('yanlis', 'dogru');      // doğru sayı çatıya yazılır
          bosLevha.textContent = s.dogru;
        }
      },
      yerlestir: () => yerlestir(konum)
    };
  }
};

/* ---------- 7. TUR SONU ---------- */
const Tur = {
  /* sonuc: { bolge, zorluk, dogru, toplam, tekrar:[yanlış yapılan sayılar] } */
  bitir(sonuc){
    const d = Kayit.durum;
    const yildiz = yildizHesapla(sonuc.dogru, sonuc.toplam);
    const eskiEnIyi = d.yildiz[sonuc.bolge][sonuc.zorluk];
    const balik = sonuc.dogru * ZORLUKLAR[sonuc.zorluk].balik;

    d.balik += balik;
    if (yildiz > eskiEnIyi) d.yildiz[sonuc.bolge][sonuc.zorluk] = yildiz;
    // tekrar havuzu: yanlış yapılan sayılar, en fazla 30
    (sonuc.tekrar || []).forEach(x => d.yanlislar.push({ b:sonuc.bolge, s:x }));
    if (d.yanlislar.length > 30) d.yanlislar = d.yanlislar.slice(-30);
    Kayit.kaydet();

    Sahne.git('tursonu', { ...sonuc, yildiz, balik, rekor: yildiz > eskiEnIyi });
  }
};

Sahne.tanimla('tursonu', {

    const basliklar = ['Tekrar deneyelim!', 'İyi gidiyorsun!', 'Çok güzel!', 'Harika!'];

    const kedi = $('.ts-kedi');

    kedi.classList.add(p.yildiz === 0 ? 'uzgun' : 'sevinc');

  }
});

/* ---------- 8. KEDİ EVİ ---------- */
const KediEvi = {
  sekme: 'kediler',
  onizKedi: 'sarman',     // önizlenen kedi
  onizAks: null,          // önizlenen aksesuar (null = yok)
  yeniKedi: null,         // yeni alınan kedi rafta zıplar
  yalamaZaman: null,

  gir(){
    this.sekme = 'kediler';
    this.onizlemeSifirla();
    this.ciz();
    this.yalamaBaslat();
  },
  cik(){ clearTimeout(this.yalamaZaman); },
  onizlemeSifirla(){
    const d = Kayit.durum;
    this.onizKedi = d.seciliKedi;
    this.onizAks = d.takili[d.seciliKedi] || null;
  },
  ciz(){ this.rafCiz(); this.onizlemeCiz(); this.dukkanCiz(); },
  balikHTML(n){ return `<svg class="balik-mini" aria-hidden="true"><use href="#s-balik"/></svg>${n}`; },

  /* üst: sahip olunan kediler yan yana; dokunulan kedi oyuna girer */
  rafCiz(){
    const d = Kayit.durum, raf = $('#kediRaf');
    raf.innerHTML = '';
    KEDILER.filter(k => d.kediler.includes(k.id)).forEach(k => {
      const oyunda = d.seciliKedi === k.id;
      raf.appendChild(el('button', {
        class:'kedi-yer' + (oyunda ? ' oyunda' : '') + (this.yeniKedi === k.id ? ' yeni' : ''),
        'aria-label':`${k.ad}${oyunda ? ', oyunda' : ', oynamak için dokun'}`, 'aria-pressed':String(oyunda),
        onclick:() => this.oyna(k.id) },
        `${oyunda ? '<span class="oyunda-isaret">Oyunda</span>' : ''}` +
        `<svg class="raf-kedi" viewBox="0 0 120 120" style="${kediStil(k.id)}" aria-hidden="true">${kediIcYalayan(k.id, d.takili[k.id])}</svg>` +
        `<span class="minder"></span><span class="raf-ad">${k.ad}</span>`));
    });
    this.yeniKedi = null;
  },

  oyna(id){
    const d = Kayit.durum;
    if (d.seciliKedi !== id) {
      d.seciliKedi = id;
      Kayit.kaydet();
      seciliKediGuncelle();
      Ses.miyav();
      bildir(`${kediBul(id).ad} ile oynuyorsun!`);
    } else Ses.tik();
    this.onizlemeSifirla();
    this.ciz();
  },

  /* sol: önizleme + sıradaki adım */
  onizlemeCiz(){
    const d = Kayit.durum, k = kediBul(this.onizKedi), a = aksBul(this.onizAks);
    const svg = $('#kediEviKedi');
    svg.setAttribute('style', kediStil(k.id));
    svg.innerHTML = kediIc(k.id, this.onizAks);
    $('#onizlemeAd').textContent = a ? `${k.ad} · ${a.ad}` : k.ad;

    const durum = $('#onizlemeDurum'), kutu = $('#onizlemeDugmeler');
    durum.classList.remove('oyunda');
    kutu.innerHTML = '';
    const dugme = (metin, sinif, f) => kutu.appendChild(el('button', { class:'dugme ' + sinif, onclick:f }, metin));
    const satinDugme = (tur, nesne, metin) => {
      const yeter = d.balik >= nesne.fiyat;
      dugme(`${metin} ${this.balikHTML(nesne.fiyat)}`, 'yesil' + (yeter ? '' : ' pasif'), () => this.satinAl(tur, nesne));
      if (!yeter) durum.textContent = `${nesne.fiyat - d.balik} balık daha lazım`;
    };
    const takili = d.takili[k.id] || null;

    if (!d.kediler.includes(k.id)) { durum.textContent = 'Bu kedi henüz senin değil'; satinDugme('kedi', k, 'Sahiplen'); return; }
    if (d.seciliKedi !== k.id) { durum.textContent = 'Senin kedin'; dugme('Bu kediyle oyna', '', () => this.oyna(k.id)); return; }
    if (!a) {
      if (takili) { durum.textContent = `${aksBul(takili).ad} takılı`; dugme('Çıkar', 'ikincil', () => this.cikar()); }
      else { durum.textContent = 'Oyunda bu kedi var ✓'; durum.classList.add('oyunda'); }
      return;
    }
    if (!d.aksesuarlar.includes(a.id)) { durum.textContent = `${a.ad} henüz senin değil`; satinDugme('aks', a, 'Satın al'); return; }
    if (takili === a.id) { durum.textContent = `${a.ad} takılı ✓`; durum.classList.add('oyunda'); dugme('Çıkar', 'ikincil', () => this.cikar()); }
    else { durum.textContent = `${a.ad} senin`; dugme(`${a.ad} tak`, 'yesil', () => this.tak(a.id)); }
  },

  /* sağ: Kediler = alınmamış kediler; Aksesuarlar = oyundaki kedi için */
  dukkanCiz(){
    const d = Kayit.durum, izgara = $('#dukkanIzgara');
    document.querySelectorAll('#sahne-kediEvi .sekme').forEach(b => {
      const secili = b.dataset.sekme === this.sekme;
      b.classList.toggle('secili', secili);
      b.setAttribute('aria-selected', String(secili));
    });
    izgara.innerHTML = '';
    const kart = (sinif, etiket, icerik, onSec) => {
      const c = el('div', { class:'dukkan-kart' + sinif, role:'button', tabindex:'0', 'aria-label':etiket }, icerik);
      c.addEventListener('click', onSec);
      c.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onSec(); } });
      izgara.appendChild(c);
      return c;
    };
    if (this.sekme === 'kediler') {
      const satilik = KEDILER.filter(k => !d.kediler.includes(k.id));
      if (!satilik.length) { izgara.innerHTML = '<div class="dukkan-bos">Bütün kediler senin!</div>'; return; }
      satilik.forEach(k => kart(this.onizKedi === k.id ? ' secili' : '', `${k.ad}, ${k.fiyat} balık`,
        `${kediSVG('kart-kedi', k.id, null)}<span class="kart-ad">${k.ad}</span><span class="kart-fiyat">${this.balikHTML(k.fiyat)}</span>`,
        () => { Ses.tik(); this.onizKedi = k.id; this.onizAks = null; this.onizlemeCiz(); this.dukkanCiz(); }));
      return;
    }
    const hedef = d.seciliKedi, takili = d.takili[hedef] || null;
    AKSESUARLAR.forEach(a => {
      const sahip = d.aksesuarlar.includes(a.id), takiliMi = takili === a.id;
      const c = kart((this.onizAks === a.id && this.onizKedi === hedef ? ' secili' : '') + (takiliMi ? ' takili-kart' : ''),
        `${a.ad}${sahip ? (takiliMi ? ', takılı' : ', senin') : ', ' + a.fiyat + ' balık'}`,
        `${kediSVG('kart-kedi', hedef, a.id)}<span class="kart-ad">${a.ad}</span>` +
        (sahip ? '' : `<span class="kart-fiyat">${this.balikHTML(a.fiyat)}</span>`),
        () => { Ses.tik(); this.onizKedi = hedef; this.onizAks = a.id; this.onizlemeCiz(); this.dukkanCiz(); });
      if (sahip) {
        // satın alınmış aksesuar: oyundaki kediye Tak / Çıkar
        const b = el('button', { class:'kart-dugme' + (takiliMi ? ' cikar' : '') }, takiliMi ? 'Çıkar' : 'Tak');
        b.addEventListener('click', e => { e.stopPropagation(); takiliMi ? this.cikar() : this.tak(a.id); });
        c.appendChild(b);
      }
    });
  },

  tak(aksId){
    const d = Kayit.durum;
    d.takili[d.seciliKedi] = aksId;
    Kayit.kaydet();
    seciliKediGuncelle();
    Ses.balik();
    bildir(`${aksBul(aksId).ad} takıldı!`);
    this.onizKedi = d.seciliKedi; this.onizAks = aksId;
    this.ciz();
  },
  cikar(){
    const d = Kayit.durum;
    delete d.takili[d.seciliKedi];
    Kayit.kaydet();
    seciliKediGuncelle();
    Ses.tik();
    bildir('Aksesuar çıkarıldı');
    this.onizKedi = d.seciliKedi; this.onizAks = null;
    this.ciz();
  },

  satinAl(tur, nesne){
    const d = Kayit.durum;
    if (d.balik < nesne.fiyat) { Ses.yanlis(); bildir(`${nesne.fiyat - d.balik} balık daha lazım`); return; }
    d.balik -= nesne.fiyat;
    if (tur === 'kedi') {
      d.kediler.push(nesne.id);
      this.yeniKedi = nesne.id;
      bildir(`${nesne.ad} artık senin!`);
    } else {
      d.aksesuarlar.push(nesne.id);
      d.takili[d.seciliKedi] = nesne.id;          // alınan aksesuar oyundaki kediye takılır
      seciliKediGuncelle();
      bildir(`${nesne.ad} artık senin ve takıldı!`);
    }
    Kayit.kaydet();
    balikGuncelle(true);
    Ses.basari();
    this.ciz();
  },

  /* raftaki kedilerden biri ara sıra pati yalar */
  yalamaBaslat(){
    clearTimeout(this.yalamaZaman);
    const dongu = () => {
      const adaylar = [...document.querySelectorAll('#kediRaf .kedi-yer:not(.yaliyor)')];
      if (adaylar.length) {
        const k = Sayi.sec(adaylar);
        k.classList.add('yaliyor');
        setTimeout(() => k.classList.remove('yaliyor'), 2500);
      }
      this.yalamaZaman = setTimeout(dongu, Sayi.rastgele(1800, 4200));
    };
    this.yalamaZaman = setTimeout(dongu, 1000);
  }
};
document.querySelectorAll('#sahne-kediEvi .sekme').forEach(b =>
  b.addEventListener('click', () => {
    Ses.tik();
    KediEvi.sekme = b.dataset.sekme;
    if (KediEvi.sekme === 'aksesuarlar') KediEvi.onizlemeSifirla();   // aksesuarlar oyundaki kedi için
    KediEvi.onizlemeCiz(); KediEvi.dukkanCiz();
  }));

Sahne.tanimla('kediEvi', { ust:true, ayar:true, baslik:'Kedi Evi', geri:'harita',
  gir(){ KediEvi.gir(); }, cik(){ KediEvi.cik(); } });

/* ---------- 9. AYARLAR ---------- */
Sahne.tanimla('ayarlar', {
  ust:true, ayar:false, baslik:'Ayarlar',
  geri:() => {
    const d = Sahne.ayarlardanDonus;
    return d && d.ad ? [d.ad, d.params] : ['acilis', {}];
  },
  gir(){ ayarlariGoster(); $('#sifirlaOnay').classList.add('gizli'); }
});

function ayarlariGoster(){
  const a = Kayit.durum.ayarlar;
  $('#ayarSes').setAttribute('aria-checked', String(a.ses));
  const oku = $('#ayarSesliOkuma');
  if (Konusma.varMi()) {
    oku.disabled = false;
    oku.setAttribute('aria-checked', String(a.sesliOkuma));
    $('#sesliOkumaAciklama').textContent = 'Sayılar sesli okunur';
  } else {
    oku.disabled = true;
    oku.setAttribute('aria-checked', 'false');
    $('#sesliOkumaAciklama').textContent = 'Bu cihazda Türkçe ses yok';
  }
}

$('#ayarSes').addEventListener('click', ()=>{
  Kayit.durum.ayarlar.ses = !Kayit.durum.ayarlar.ses;
  Kayit.kaydet(); ayarlariGoster(); Ses.tik();
});
$('#ayarSesliOkuma').addEventListener('click', ()=>{
  if (!Konusma.varMi()) return;
  Kayit.durum.ayarlar.sesliOkuma = !Kayit.durum.ayarlar.sesliOkuma;
  Kayit.kaydet(); ayarlariGoster(); Ses.tik();
});
$('#sifirlaDugme').addEventListener('click', ()=>{ Ses.tik(); $('#sifirlaOnay').classList.remove('gizli'); });
$('#sifirlaVazgec').addEventListener('click', ()=>{ Ses.tik(); $('#sifirlaOnay').classList.add('gizli'); });
$('#sifirlaEvet').addEventListener('click', ()=>{
  Kayit.sifirla();
  $('#sifirlaOnay').classList.add('gizli');
  ayarlariGoster(); balikGuncelle(); seciliKediGuncelle();
  bildir('İlerleme sıfırlandı');
});

/* =========================================================
   7. GENEL OLAYLAR + BAŞLANGIÇ
   ========================================================= */
document.querySelectorAll('[data-git]').forEach(b =>
  b.addEventListener('click', ()=>{ Ses.tik(); Sahne.git(b.dataset.git); }));
$('#geriDugme').addEventListener('click', ()=>{ Ses.tik(); Sahne.geri(); });
$('#ayarDugme').addEventListener('click', ()=>{ Ses.tik(); Sahne.git('ayarlar'); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { Sahne.geri(); return; }
  if (GeriBildirim.acik) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); GeriBildirim.kapat(); }
    return;
  }
  if (TusTakimi.klavye(e)) e.preventDefault();
});

Kayit.yukle();
Kayit.kaydet();
balikGuncelle();
seciliKediGuncelle();
Konusma.baslat(()=>{ if (Sahne.aktif === 'ayarlar') ayarlariGoster(); });
Sahne.git('acilis');
</script>
</body>
</html>
